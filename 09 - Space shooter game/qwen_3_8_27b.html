<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA STRIKE — Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  #game { display: block; margin: 0 auto; background: #000; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 12px 20px;
    display: flex; justify-content: space-between; pointer-events: none;
    color: #7df9ff; font-size: 18px; text-shadow: 0 0 10px #0ff;
    letter-spacing: 2px; z-index: 10;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: radial-gradient(ellipse at center, rgba(10,0,40,.85), rgba(0,0,0,.95));
    color: #fff; text-align: center;
  }
  .overlay h1 {
    font-size: 64px; letter-spacing: 12px; margin-bottom: 8px;
    background: linear-gradient(90deg, #00f6ff, #ff00e5, #00f6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 3s linear infinite; background-size: 200%;
  }
  @keyframes shimmer { to { background-position: 200%; } }
  .overlay p { color: #9fd8ff; margin: 6px 0; font-size: 16px; letter-spacing: 2px; }
  .overlay .big { font-size: 28px; color: #ff5577; text-shadow: 0 0 15px #f0f; margin: 14px 0; }
  .btn {
    margin-top: 24px; padding: 14px 44px; font-size: 20px; font-family: inherit;
    letter-spacing: 4px; color: #0ff; background: transparent;
    border: 2px solid #0ff; cursor: pointer; text-shadow: 0 0 10px #0ff;
    box-shadow: 0 0 20px rgba(0,255,255,.3), inset 0 0 20px rgba(0,255,255,.1);
    transition: all .2s;
  }
  .btn:hover { background: rgba(0,255,255,.15); box-shadow: 0 0 40px rgba(0,255,255,.6); transform: scale(1.05); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="score">SCORE 0</div>
  <div id="wave">WAVE 1</div>
  <div id="lives"></div>
</div>
<div id="startScreen" class="overlay">
  <h1>NEBULA STRIKE</h1>
  <p>Pilot your ship through the asteroid belt. Destroy the invaders.</p>
  <p style="margin-top:20px">⬅  / A D &nbsp;—&nbsp; MOVE &nbsp;&nbsp;|&nbsp;&nbsp; SPACE / CLICK &nbsp;—&nbsp; FIRE</p>
  <p>↑ ↓ / W S &nbsp;—&nbsp; THRUST &nbsp;&nbsp;|&nbsp;&nbsp; P &nbsp;—&nbsp; PAUSE</p>
  <button class="btn" id="startBtn">LAUNCH</button>
</div>
<div id="gameOverScreen" class="overlay hidden">
  <h1>SHIP DESTROYED</h1>
  <div class="big" id="finalScore">SCORE: 0</div>
  <p id="finalWave"></p>
  <button class="btn" id="retryBtn">RETRY</button>
</div>

<script>
(() => {
'use strict';

// ============ SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============ AUDIO (procedural, no external files) ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  if (type === 'laser') {
    const o = audioCtx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(220, t + 0.12);
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); o.start(t); o.stop(t + 0.13);
  } else if (type === 'explosion') {
    const len = audioCtx.sampleRate * 0.4;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(100, t + 0.4);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    src.connect(f); f.connect(g); src.start(t);
  } else if (type === 'hit') {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); o.start(t); o.stop(t + 0.26);
  } else if (type === 'powerup') {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(440, t);
    o.frequency.linearRampToValueAtTime(1760, t + 0.2);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); o.start(t); o.stop(t + 0.26);
  }
}

// ============ INPUT ============
const keys = {};
let mouseDown = false;
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyP' && state === 'playing') state = state === 'paused' ? 'playing' : 'paused';
});
window.addEventListener('keyup', e => keys[e.code] = false);
canvas.addEventListener('mousedown', () => mouseDown = true);
window.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', e => { mouseDown = true; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', () => mouseDown = false);

// ============ GAME STATE ============
let state = 'menu'; // menu | playing | paused | gameover
let score = 0, lives = 3, wave = 1, waveTimer = 0, spawnTimer = 0, alienTimer = 0;
let shake = 0, flash = 0;
let player, bullets, enemyBullets, asteroids, aliens, particles, stars, powerups, texts;

function makeStars() {
  stars = [];
  for (let i = 0; i < 180; i++) {
    const layer = Math.random();
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: layer * 2 + 0.3,
      speed: layer * 1.5 + 0.2,
      hue: Math.random() < 0.15 ? (Math.random() < 0.5 ? 190 : 300) : 0,
      tw: Math.random() * Math.PI * 2
    });
  }
}

function reset() {
  score = 0; lives = 3; wave = 1; waveTimer = 0; spawnTimer = 0; alienTimer = 0;
  shake = 0; flash = 0;
  player = { x: W / 2, y: H - 120, vx: 0, vy: 0, r: 16, fireCd: 0, inv: 0, power: 0, tilt: 0 };
  bullets = []; enemyBullets = []; asteroids = []; aliens = []; particles = []; powerups = []; texts = [];
  makeStars();
  for (let i = 0; i < 5; i++) spawnAsteroid(true);
}

// ============ ENTITIES ============
function spawnAsteroid(randomY = false) {
  const size = 18 + Math.random() * 40;
  const verts = [];
  const n = 8 + (Math.random() * 5 | 0);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = size * (0.7 + Math.random() * 0.5);
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  asteroids.push({
    x: Math.random() * W,
    y: randomY ? Math.random() * H : -size - 20,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 1 + Math.random() * 1.5 + wave * 0.1,
    rot: Math.random() * Math.PI * 2,
    rv: (Math.random() - 0.5) * 0.04,
    size, verts, hp: Math.ceil(size / 18)
  });
}

function spawnAlien() {
  const type = Math.random() < 0.3 && wave > 2 ? 'heavy' : 'scout';
  aliens.push({
    x: 60 + Math.random() * (W - 120),
    y: -40,
    vx: 0, vy: type === 'heavy' ? 0.6 : 0.9,
    r: type === 'heavy' ? 26 : 18,
    hp: type === 'heavy' ? 5 : 2,
    type, fireCd: 60 + Math.random() * 120,
    wobble: Math.random() * Math.PI * 2,
    targetY: 80 + Math.random() * (H * 0.35)
  });
}

function spawnParticles(x, y, count, opts = {}) {
  const { speed = 5, life = 40, colors = ['#ff9500', '#ffcc00', '#ff4400', '#fff'], size = 3, gravity = 0 } = opts;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * speed + 0.5;
    particles.push({
      x, y,
      vx: Math.cos(a) * s + (opts.vx || 0),
      vy: Math.sin(a) * s + (opts.vy || 0),
      life: life * (0.5 + Math.random() * 0.5),
      maxLife: life,
      size: size * (0.5 + Math.random()),
      color: colors[Math.random() * colors.length | 0],
      gravity
    });
  }
}

function explode(x, y, big = false) {
  const n = big ? 60 : 30;
  spawnParticles(x, y, n, { speed: big ? 8 : 5, life: big ? 60 : 40, size: big ? 4 : 3 });
  spawnParticles(x, y, n / 3 | 0, { speed: 2, life: 80, colors: ['#ff5500', '#882200'], size: 5 });
  // shockwave ring
  particles.push({ x, y, vx: 0, vy: 0, life: 20, maxLife: 20, size: 5, color: '#fff', ring: true });
  shake = Math.min(shake + (big ? 14 : 6), 20);
  flash = Math.max(flash, big ? 0.25 : 0.1);
  playSound('explosion');
}

function addText(x, y, str, color = '#0ff') {
  texts.push({ x, y, str, color, life: 60 });
}

// ============ UPDATE ============
function update() {
  if (state !== 'playing') return;

  // stars always drift
  for (const s of stars) {
    s.y += s.speed * (state === 'playing' ? 1 : 0.3);
    s.tw += 0.05;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  // --- Player ---
  const p = player;
  const accel = 0.55, maxV = 7, fric = 0.92;
  if (keys['ArrowLeft'] || keys['KeyA']) p.vx -= accel;
  if (keys['ArrowRight'] || keys['KeyD']) p.vx += accel;
  if (keys['ArrowUp'] || keys['KeyW']) p.vy -= accel * 0.7;
  if (keys['ArrowDown'] || keys['KeyS']) p.vy += accel * 0.7;
  p.vx *= fric; p.vy *= fric;
  p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
  p.vy = Math.max(-maxV * 0.7, Math.min(maxV * 0.7, p.vy));
  p.x += p.vx; p.y += p.vy;
  p.x = Math.max(20, Math.min(W - 20, p.x));
  p.y = Math.max(H * 0.35, Math.min(H - 30, p.y));
  p.tilt += ((p.vx * 0.05) - p.tilt) * 0.2;
  if (p.inv > 0) p.inv--;
  if (p.power > 0) p.power--;

  // engine trail
  if (Math.random() < 0.8) {
    spawnParticles(p.x + (Math.random() - 0.5) * 6, p.y + 18, 1, {
      speed: 1.5, life: 20, colors: ['#00ccff', '#0066ff', '#ff8800'], size: 2.5, vy: 2
    });
  }

  // firing
  if (p.fireCd > 0) p.fireCd--;
  if ((keys['Space'] || mouseDown) && p.fireCd <= 0) {
    p.fireCd = p.power > 0 ? 7 : 11;
    const spread = p.power > 0 ? [-0.15, 0, 0.15] : [0];
    for (const off of spread) {
      bullets.push({ x: p.x, y: p.y - 18, vx: off * 8, vy: -14, r: 4 });
    }
    playSound('laser');
  }

  // --- Bullets ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
  }
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
  }

  // --- Asteroids ---
  spawnTimer--;
  const maxAst = 6 + wave * 2;
  if (spawnTimer <= 0 && asteroids.length < maxAst) {
    spawnAsteroid();
    spawnTimer = Math.max(20, 90 - wave * 6);
  }
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.x += a.vx; a.y += a.vy; a.rot += a.rv;
    if (a.x < -a.size) a.x = W + a.size;
    if (a.x > W + a.size) a.x = -a.size;
    if (a.y > H + a.size + 20) { asteroids.splice(i, 1); continue; }

    // bullet hits
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < (a.size * 0.8) * (a.size * 0.8)) {
        bullets.splice(j, 1);
        a.hp--;
        spawnParticles(b.x, b.y, 8, { speed: 3, life: 20, colors: ['#aaa', '#666', '#ffcc00'], size: 2 });
        if (a.hp <= 0) {
          asteroids.splice(i, 1);
          explode(a.x, a.y, a.size > 40);
          score += Math.ceil(50 - a.size / 2);
          updateHUD();
          if (a.size > 32 && Math.random() < 0.8) {
            for (let k = 0; k < 2; k++) {
              const ns = a.size * 0.55;
              const nv = [];
              for (let v = 0; v < 8; v++) {
                const ang = v / 8 * Math.PI * 2;
                nv.push([Math.cos(ang) * ns * (0.7 + Math.random() * 0.5), Math.sin(ang) * ns * (0.7 + Math.random() * 0.5)]);
              }
              asteroids.push({
                x: a.x + (Math.random() - 0.5) * 20, y: a.y + (Math.random() - 0.5) * 20,
                vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 2,
                rot: Math.random() * 6, rv: (Math.random() - 0.5) * 0.08,
                size: ns, verts: nv, hp: 1
              });
            }
          }
          if (Math.random() < 0.08) powerups.push({ x: a.x, y: a.y, vy: 1.2, type: Math.random() < 0.5 ? 'power' : 'life' });
        }
        break;
      }
    }
    if (!asteroids.includes(a)) continue;

    // player collision
    if (p.inv <= 0) {
      const dx = p.x - a.x, dy = p.y - a.y;
      if (dx * dx + dy * dy < (a.size * 0.7 + p.r) * (a.size * 0.7 + p.r)) {
        hitPlayer();
        if (a.hp <= 0 || a.size < 30) {
          explode(a.x, a.y, false);
          asteroids.splice(i, 1);
        }
      }
    }
  }

  // --- Aliens ---
  alienTimer--;
  if (alienTimer <= 0 && aliens.length < 2 + wave) {
    spawnAlien();
    alienTimer = Math.max(40, 160 - wave * 12);
  }
  for (let i = aliens.length - 1; i >= 0; i--) {
    const al = aliens[i];
    al.wobble += 0.05;
    if (al.y < al.targetY) al.y += al.vy;
    else al.x += Math.sin(al.wobble) * 1.5;
    al.x += Math.sin(al.wobble * 0.7) * 0.5;
    if (al.x < 30) al.x = 30;
    if (al.x > W - 30) al.x = W - 30;

    // fire at player
    al.fireCd--;
    if (al.fireCd <= 0 && al.y > 0) {
      al.fireCd = al.type === 'heavy' ? 70 : 110;
      const dx = p.x - al.x, dy = p.y - al.y;
      const d = Math.hypot(dx, dy) || 1;
      const spd = al.type === 'heavy' ? 4.5 : 5.5;
      enemyBullets.push({ x: al.x, y: al.y + al.r, vx: dx / d * spd, vy: dy / d * spd, r: 5 });
    }

    // bullets hit alien
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      const dx = b.x - al.x, dy = b.y - al.y;
      if (dx * dx + dy * dy < al.r * al.r) {
        bullets.splice(j, 1);
        al.hp--;
        spawnParticles(b.x, b.y, 6, { speed: 3, life: 15, colors: ['#f0f', '#a0f', '#fff'], size: 2 });
        if (al.hp <= 0) {
          aliens.splice(i, 1);
          explode(al.x, al.y, al.type === 'heavy');
          const pts = al.type === 'heavy' ? 300 : 100;
          score += pts;
          addText(al.x, al.y, '+' + pts, '#f0f');
          updateHUD();
          if (Math.random() < 0.15) powerups.push({ x: al.x, y: al.y, vy: 1.2, type: Math.random() < 0.4 ? 'life' : 'power' });
        }
        break;
      }
    }
    if (!aliens.includes(al)) continue;

    // ram player
    if (p.inv <= 0) {
      const dx = p.x - al.x, dy = p.y - al.y;
      if (dx * dx + dy * dy < (al.r + p.r) * (al.r + p.r)) {
        hitPlayer();
        explode(al.x, al.y, false);
        aliens.splice(i, 1);
      }
    }
  }

  // --- Enemy bullets vs player ---
  if (p.inv <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      const dx = b.x - p.x, dy = b.y - p.y;
      if (dx * dx + dy * dy < (p.r + b.r) * (p.r + b.r)) {
        enemyBullets.splice(i, 1);
        hitPlayer();
      }
    }
  }

  // --- Powerups ---
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.y += pu.vy;
    if (pu.y > H + 20) { powerups.splice(i, 1); continue; }
    const dx = pu.x - p.x, dy = pu.y - p.y;
    if (dx * dx + dy * dy < 30 * 30) {
      powerups.splice(i, 1);
      playSound('powerup');
      if (pu.type === 'power') { p.power = 600; addText(p.x, p.y - 30, 'TRIPLE SHOT!', '#0f8'); }
      else { lives = Math.min(lives + 1, 5); addText(p.x, p.y - 30, '+1 LIFE', '#0f8'); }
      spawnParticles(pu.x, pu.y, 20, { speed: 4, life: 30, colors: ['#0f8', '#0fa', '#fff'], size: 2.5 });
      updateHUD();
    }
  }

  // --- Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life--;
    if (pt.ring) { pt.size += 12; }
    else {
      pt.x += pt.vx; pt.y += pt.vy;
      pt.vx *= 0.97; pt.vy *= 0.97;
      pt.vy += pt.gravity;
    }
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // --- Texts ---
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.y -= 0.8; t.life--;
    if (t.life <= 0) texts.splice(i, 1);
  }

  // --- Wave progression ---
  waveTimer++;
  if (waveTimer > 400 + wave * 100) {
    wave++;
    waveTimer = 0;
    addText(W / 2, H / 2, 'WAVE ' + wave, '#0ff');
    updateHUD();
  }

  shake *= 0.88;
  flash *= 0.9;
}

function hitPlayer() {
  lives--;
  player.inv = 120;
  explode(player.x, player.y, true);
  playSound('hit');
  updateHUD();
  if (lives <= 0) {
    state = 'gameover';
    document.getElementById('finalScore').textContent = 'SCORE: ' + score;
    document.getElementById('finalWave').textContent = 'You reached wave ' + wave;
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
  }
}

function updateHUD() {
  document.getElementById('score').textContent = 'SCORE ' + score;
  document.getElementById('wave').textContent = 'WAVE ' + wave;
  document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives));
}

// ============ DRAW ============
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // background gradient
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#0a0a2e');
  bg.addColorStop(0.5, '#060618');
  bg.addColorStop(1, '#01010a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // nebula clouds
  ctx.globalAlpha = 0.06;
  const t = performance.now() * 0.00005;
  for (let i = 0; i < 3; i++) {
    const nx = W * (0.3 + 0.4 * Math.sin(t * (i + 1) + i * 2));
    const ny = H * (0.3 + 0.4 * Math.cos(t * (i + 2) + i));
    const g = ctx.createRadialGradient(nx, ny, 0, nx, ny, 300);
    g.addColorStop(0, i === 1 ? '#f0f' : '#08f');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;

  // screen shake
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // stars
  for (const s of stars) {
    const twinkle = 0.6 + 0.4 * Math.sin(s.tw);
    ctx.globalAlpha = twinkle;
    if (s.hue) ctx.fillStyle = `hsl(${s.hue}, 100%, 80%)`;
    else ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // particles (additive for glow)
  ctx.globalCompositeOperation = 'lighter';
  for (const pt of particles) {
    const a = pt.life / pt.maxLife;
    if (pt.ring) {
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.8})`;
      ctx.lineWidth = 3 * a;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * a + 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // asteroids
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    ctx.moveTo(a.verts[0][0], a.verts[0][1]);
    for (let i = 1; i < a.verts.length; i++) ctx.lineTo(a.verts[i][0], a.verts[i][1]);
    ctx.closePath();
    const g = ctx.createRadialGradient(-a.size * 0.3, -a.size * 0.3, 0, 0, 0, a.size);
    g.addColorStop(0, '#9a8f80');
    g.addColorStop(0.7, '#5a5248');
    g.addColorStop(1, '#2e2a24');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#7a7060';
    ctx.lineWidth = 2;
    ctx.stroke();
    // craters
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(a.size * 0.2, -a.size * 0.15, a.size * 0.18, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-a.size * 0.25, a.size * 0.2, a.size * 0.12, 0, 7); ctx.fill();
    ctx.restore();
  }

  // powerups
  for (const pu of powerups) {
    const pulse = 1 + 0.2 * Math.sin(performance.now() * 0.01);
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.shadowColor = pu.type === 'power' ? '#0f8' : '#f4a';
    ctx.shadowBlur = 15;
    ctx.fillStyle = pu.type === 'power' ? '#0f8' : '#f4a';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.scale(pulse, pulse);
    ctx.fillText(pu.type === 'power' ? 'P' : '♥', 0, 0);
    ctx.restore();
  }

  // aliens
  for (const al of aliens) {
    ctx.save();
    ctx.translate(al.x, al.y);
    const bob = Math.sin(al.wobble * 2) * 2;
    ctx.translate(0, bob);
    if (al.type === 'heavy') {
      // saucer
      ctx.shadowColor = '#f0f';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#8020a0';
      ctx.beginPath();
      ctx.ellipse(0, 4, 26, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c040e0';
      ctx.beginPath();
      ctx.arc(0, -4, 13, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) {
        const on = Math.sin(performance.now() * 0.01 + i) > 0;
        ctx.fillStyle = on ? '#ff0' : '#802060';
        ctx.beginPath();
        ctx.arc(i * 9, 6, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // invader bug
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#00aa88';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#004433';
      ctx.beginPath();
      ctx.arc(0, -2, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f0f';
      ctx.beginPath(); ctx.arc(-4, -3, 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -3, 3, 0, 7); ctx.fill();
      // legs
      ctx.strokeStyle = '#00aa88';
      ctx.lineWidth = 2;
      const flap = Math.sin(performance.now() * 0.02) * 4;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 8, 8);
        ctx.lineTo(i * 12, 14 + (i === 0 ? flap : -flap));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // player
  const p = player;
  if (p && (state === 'playing' || state === 'paused')) {
    const blink = p.inv > 0 && Math.floor(p.inv / 5) % 2 === 0;
    if (!blink) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.tilt);
      // glow
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 20;
      // body
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(6, -4);
      ctx.lineTo(16, 10);
      ctx.lineTo(16, 16);
      ctx.lineTo(6, 12);
      ctx.lineTo(0, 16);
      ctx.lineTo(-6, 12);
      ctx.lineTo(-16, 16);
      ctx.lineTo(-16, 10);
      ctx.lineTo(-6, -4);
      ctx.closePath();
      const shipG = ctx.createLinearGradient(0, -20, 0, 16);
      shipG.addColorStop(0, '#e0faff');
      shipG.addColorStop(0.5, '#4090ff');
      shipG.addColorStop(1, '#1030a0');
      ctx.fillStyle = shipG;
      ctx.fill();
      ctx.strokeStyle = '#8ff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // cockpit
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0ff';
      ctx.beginPath();
      ctx.ellipse(0, -4, 4, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      // engine flame
      const flame = 8 + Math.random() * 8;
      ctx.shadowColor = '#f80';
      ctx.shadowBlur = 15;
      ctx.fillStyle = 'rgba(255,150,0,0.9)';
      ctx.beginPath();
      ctx.moveTo(-5, 16);
      ctx.lineTo(0, 16 + flame);
      ctx.lineTo(5, 16);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,200,0.9)';
      ctx.beginPath();
      ctx.moveTo(-2.5, 16);
      ctx.lineTo(0, 16 + flame * 0.5);
      ctx.lineTo(2.5, 16);
      ctx.closePath();
      ctx.fill();
      // power-up indicator
      if (p.power > 0) {
        ctx.strokeStyle = `rgba(0,255,120,${0.4 + 0.3 * Math.sin(performance.now() * 0.01)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // bullets
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#aff';
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 2.5, 9, Math.atan2(b.vx, b.vy) + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();
    // trail
    ctx.strokeStyle = 'rgba(0,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + 8);
    ctx.lineTo(b.x - b.vx * 1.5, b.y + 8 - b.vy * 1.5);
    ctx.stroke();
  }
  for (const b of enemyBullets) {
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#f8f';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';

  // floating texts
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / 30);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 22px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 10;
    ctx.fillText(t.str, t.x, t.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // hit flash
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,100,80,${flash})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  // pause
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
  }
}

// ============ LOOP ============
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ============ UI ============
function startGame() {
  initAudio();
  reset();
  state = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  updateHUD();
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

makeStars();
loop();
})();
</script>
</body>
</html>
