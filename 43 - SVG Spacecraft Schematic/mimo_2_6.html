<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>512-AA-001 — AURORA-7 Crewed Transport — General Arrangement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9E3D6;
    --paper2:#E2DACA;
    --ink:#152B44;
    --ink2:#3A5573;
    --neutral:#6B7C92;
    --red:#B4331F;
    --hot:#E2571F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#CFC7B6;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(30,40,55,.18), transparent 60%);
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    padding:26px 20px 40px;
  }
  .wrap{max-width:2200px;margin:0 auto}
  .sheet{
    position:relative;
    background-color:var(--paper);
    background-image:url("https://images.pexels.com/photos/7953297/pexels-photo-7953297.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940");
    background-size:cover;
    background-position:center;
    background-blend-mode:multiply;
    box-shadow:0 2px 0 rgba(255,255,255,.35) inset, 0 26px 60px rgba(30,35,45,.42), 0 3px 10px rgba(30,35,45,.25);
    overflow-x:auto;
    border:1px solid rgba(21,43,68,.25);
  }
  .sheet::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(115deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 28%),
      linear-gradient(0deg, rgba(120,105,80,.12), rgba(120,105,80,0) 45%);
    mix-blend-mode:multiply;
  }
  svg.drawing{display:block;width:100%;height:auto;min-width:1180px}
  .caption{
    margin:14px 2px 0;
    font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    color:#3C4654;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;
  }
  .caption b{font-weight:600;color:var(--red)}
  .caption .rule{flex:1 1 60px;height:1px;background:rgba(21,43,68,.28);align-self:center}

  /* ---------- drawing ink classes ---------- */
  .o{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
  .o2{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round}
  .th{fill:none;stroke:var(--ink);stroke-width:1;opacity:.72}
  .wall{fill:none;stroke:var(--ink);stroke-width:11;stroke-linejoin:round;opacity:.93}
  .hid{fill:none;stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:11 6}
  .hid2{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:7 5;opacity:.8}
  .ctr{fill:none;stroke:var(--neutral);stroke-width:1;stroke-dasharray:28 5 5 5}
  .dim{fill:none;stroke:var(--red);stroke-width:1.1;marker-start:url(#ar);marker-end:url(#ar)}
  .ext{fill:none;stroke:var(--red);stroke-width:.9;opacity:.85}
  .lead{fill:none;stroke:var(--red);stroke-width:1.2;marker-start:url(#dotr)}
  .sec{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-dasharray:30 6 4 6;opacity:.9;marker-end:url(#secar)}
  .proj{fill:none;stroke:var(--neutral);stroke-width:.9;stroke-dasharray:18 6 3 6;opacity:.55}

  .dimtxt{font:500 17px 'IBM Plex Mono',monospace;fill:var(--red);text-anchor:middle}
  .dimtxts{font:500 15px 'IBM Plex Mono',monospace;fill:var(--red);text-anchor:middle}
  .ann{font:400 16px 'IBM Plex Mono',monospace;fill:var(--red)}
  .annb{font:500 16px 'IBM Plex Mono',monospace;fill:var(--red)}
  .ink{font:500 16px 'IBM Plex Mono',monospace;fill:var(--ink)}
  .inks{font:400 13px 'IBM Plex Mono',monospace;fill:var(--ink2)}
  .vt{font:700 27px 'Barlow Condensed',sans-serif;fill:var(--ink);letter-spacing:.26em}
  .vts{font:600 17px 'Barlow Condensed',sans-serif;fill:var(--ink2);letter-spacing:.22em}
  .ttl{font:700 46px 'Barlow Condensed',sans-serif;fill:var(--ink);letter-spacing:.10em}
  .ttl2{font:600 25px 'Barlow Condensed',sans-serif;fill:var(--ink);letter-spacing:.20em}
  .tbl{font:400 11px 'IBM Plex Mono',monospace;fill:var(--neutral);letter-spacing:.15em}
  .tbv{font:500 15px 'IBM Plex Mono',monospace;fill:var(--ink)}
  .tbvs{font:400 13px 'IBM Plex Mono',monospace;fill:var(--ink2)}
  .balt{font:500 14px 'IBM Plex Mono',monospace;fill:var(--red);text-anchor:middle}
  .bal{fill:var(--paper);stroke:var(--red);stroke-width:1.7}

  /* ---------- interaction ---------- */
  [data-part]{transition:filter .18s ease}
  .pl-row{cursor:pointer}
  .pl-row rect.hit{fill:transparent}
  .pl-row:hover .plname{fill:var(--hot)}
  .hl,.hl .o,.hl .o2,.hl .th,.hl .hid,.hl path,.hl line,.hl circle,.hl rect,.hl ellipse,.hl polyline,.hl polygon{
    stroke:var(--hot)!important;
  }
  .hl text{fill:var(--hot)!important}
  .hl{filter:drop-shadow(0 0 7px rgba(226,87,31,.55))}
  .hl .bal{fill:#FBEDE6}

  .draw{stroke-dasharray:6200;stroke-dashoffset:6200;animation:ink 1.9s cubic-bezier(.62,.02,.28,1) forwards}
  .draw.d2{animation-delay:.22s}
  .draw.d3{animation-delay:.44s}
  @keyframes ink{to{stroke-dashoffset:0}}
  .fadein{opacity:0;animation:fi .9s ease .9s forwards}
  @keyframes fi{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .draw,.fadein{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">

  <!-- ================= SHEET / BORDER ================= -->

  <!-- sheet header -->

<script>
(function(){
  var roName = document.getElementById('ro-name');
  var roSpec = document.getElementById('ro-spec');
  var roMass = document.getElementById('ro-mass');
  var base = { name: '— TRACE ACROSS ALL FIVE VIEWS —', spec: 'SPEC · —', mass: 'MASS · —' };
  var rows = {};
  document.querySelectorAll('.pl-row').forEach(function(r){ rows[r.dataset.part] = r; });

  function paint(part, on){
    var sel = '[data-part="' + part + '"]';
    document.querySelectorAll(sel).forEach(function(el){
      if (on) { el.classList.add('hl'); }
      else if (!el.classList.contains('pl-row')) { el.classList.remove('hl'); }
      else { el.classList.remove('hl'); }
    });
  }
  function readout(part){
    var r = rows[part];
    if (!r){ roName.textContent = base.name; roSpec.textContent = base.spec; roMass.textContent = base.mass; return; }
    roName.textContent = (part.length < 2 ? '0' + part : part) + '  ' + (r.dataset.name || '');
    roSpec.textContent = 'SPEC · ' + (r.dataset.spec || '—');
    roMass.textContent = 'MASS · ' + (r.dataset.mass || '—');
  }

  var current = null;
  function enter(part){ if (current && current !== part) paint(current, false); current = part; paint(part, true); readout(part); }
  function leave(part){ paint(part, false); if (current === part){ current = null; readout(null); } }

  document.querySelectorAll('[data-part]').forEach(function(el){
    var part = el.dataset.part;
    el.addEventListener('mouseenter', function(){ enter(part); });
    el.addEventListener('mouseleave', function(){ leave(part); });
    el.addEventListener('focus', function(){ enter(part); });
    el.addEventListener('blur', function(){ leave(part); });
    if (el.classList.contains('pl-row')) { el.setAttribute('tabindex','0'); }
    el.addEventListener('click', function(){ enter(part); });
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && current){ paint(current, false); current = null; readout(null); }
  });
})();
</script>
