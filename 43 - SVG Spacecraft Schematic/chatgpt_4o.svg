<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f7ff" />

  <!-- Styles -->
  <style>
    .label { font: 12px sans-serif; fill: #333; }
    .dimension { font: 10px sans-serif; fill: #1a1a1a; }
    .line { stroke: #333; stroke-width: 2; }
    .thin-line { stroke: #666; stroke-width: 1; stroke-dasharray: 4,2; }
    .component { fill: #99c2ff; stroke: #2674ab; stroke-width: 1.5; }
    .cutaway { fill: #e6f2ff; stroke: #2674ab; stroke-width: 1.5; fill-opacity: 0.3; }
  </style>

  <!-- Top View -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="300" height="60" class="component" />
    <text x="150" y="-10" class="label" text-anchor="middle">Top View</text>
    <line x1="150" y1="60" x2="150" y2="110" class="thin-line" />
    <text x="150" y="125" class="dimension" text-anchor="middle">Length: 300 units</text>
    <text x="15" y="30" class="label">Solar Array</text>
    <text x="270" y="30" class="label" text-anchor="middle">Engine</text>
  </g>

  <!-- Side View -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="300" height="60" class="component" />
    <text x="150" y="-10" class="label" text-anchor="middle">Side View</text>
    <line x1="300" y1="30" x2="350" y2="30" class="thin-line" />
    <text x="355" y="30" class="dimension">Width: 60 units</text>
    <text x="15" y="30" class="label">Landing Gear</text>
    <text x="270" y="30" class="label" text-anchor="middle">Cockpit</text>
  </g>

  <!-- Front View -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="60" height="300" class="component" />
    <text x="30" y="-10" class="label" text-anchor="middle">Front View</text>
    <text x="30" y="30" class="label" text-anchor="middle">Docking Port</text>
    <text x="30" y="270" class="label" text-anchor="middle">Landing Gear</text>
  </g>

  <!-- Rear View -->
  <g transform="translate(600, 150)">
    <rect x="0" y="0" width="60" height="300" class="component" />
    <text x="30" y="-10" class="label" text-anchor="middle">Rear View</text>
    <text x="30" y="30" class="label" text-anchor="middle">Radiators</text>
    <text x="30" y="270" class="label" text-anchor="middle">Engine Nozzle</text>
  </g>

  <!-- Cutaway Section -->
  <g transform="translate(800, 50)">
    <rect x="0" y="0" width="300" height="300" class="cutaway" />
    <text x="150" y="-10" class="label" text-anchor="middle">Cutaway View</text>
    <line x1="150" y1="0" x2="150" y2="-50" class="thin-line" />
    <text x="150" y="-60" class="dimension" text-anchor="middle">Height: 300 units</text>
    <text x="50" y="150" class="label">Avionics</text>
    <text x="250" y="150" class="label" text-anchor="end">Life-Support</text>
  </g>

  <!-- Callouts -->
  <line x1="100" y1="50" x2="50" y2="20" class="thin-line" />
  <line x1="400" y1="210" x2="450" y2="240" class="thin-line" />
  <text x="45" y="15" class="label">Solar Panel Extension</text>
  <text x="455" y="245" class="label">Crew Module</text>

  <!-- Scale Bar -->
  <line x1="900" y1="600" x2="1100" y2="600" class="line" />
  <line x1="900" y1="590" x2="900" y2="610" class="line" />
  <line x1="1100" y1="590" x2="1100" y2="610" class="line" />
  <text x="1000" y="585" class="dimension" text-anchor="middle">Scale: 1:50</text>
</svg>
