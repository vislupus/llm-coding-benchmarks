<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger 26 — Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFDFB; --chrome:#F3F1EC; --tool:#FBFAF7;
    --rule:#D8D6CE; --rule2:#C3C1B7; --head:#B4B2A7;
    --green:#1F6B4A; --green-d:#0F3F2C; --green-m:#2E8B62; --green-t:#D9E9E0;
    --ink:#22251F; --ink2:#6B6E64; --red:#C0392B;
    --tint:#F6F7F2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--chrome); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .micro{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- TITLE BAR ---------- */
  .titlebar{
    display:flex; align-items:center; gap:14px; padding:0 14px; height:52px;
    background:linear-gradient(180deg,#2B2E27 0%,#22251F 100%); color:#EDEBE3; flex:0 0 auto;
    border-bottom:1px solid #0B0D09;
  }
  .mark{width:26px;height:26px;flex:0 0 auto;}
  .brandwrap{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:.005em;line-height:1;}
  .brand em{font-style:normal;color:#7FC3A2;}
  .bookname{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A7A99C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill{
    display:flex;align-items:center;gap:7px;font-size:11px;color:#B9BBAD;
    border:1px solid #3B3E36;border-radius:999px;padding:4px 11px;white-space:nowrap;
    transition:opacity .25s ease;
  }
  .pill .dotmark{width:6px;height:6px;border-radius:50%;background:#2E8B62;box-shadow:0 0 0 3px rgba(46,139,98,.18);}
  .tb-spacer{flex:1;}
  .tbtn{
    display:inline-flex;align-items:center;gap:7px;background:#31352C;color:#EDEBE3;
    border:1px solid #45493F;border-radius:5px;padding:7px 12px;font-size:11.5px;font-weight:500;
    cursor:pointer;transition:background .15s ease,transform .08s ease;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .tbtn:hover{background:#3C4137;}
  .tbtn:active{transform:translateY(1px);background:#2A2E26;}
  .tbtn svg{width:14px;height:14px;}
  .tbtn.icon{padding:7px 9px;}
  .tbtn:disabled{opacity:.38;cursor:default;}
  .tbtn:disabled:active{transform:none;}

  /* ---------- RIBBON ---------- */
  .ribbon{
    display:flex;align-items:stretch;gap:0;background:var(--chrome);
    border-bottom:1px solid var(--rule2);padding:8px 12px 5px;flex:0 0 auto;overflow-x:auto;
  }
  .rgroup{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 13px;border-right:1px solid var(--rule);}
  .rgroup:last-child{border-right:none;}
  .rkeys{display:flex;align-items:center;gap:5px;}
  .rlabel{color:var(--ink2);}
  .key{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-width:30px;height:30px;padding:0 9px;background:var(--tool);color:var(--ink);
    border:1px solid var(--rule);border-radius:5px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;
    box-shadow:inset 0 1px 0 #fff, 0 1px 0 rgba(34,37,31,.07);
    transition:background .12s ease,border-color .12s ease;user-select:none;
  }
  .key:hover{background:#F3F1EA;border-color:var(--rule2);}
  .key:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(34,37,31,.16);}
  .key.on{background:var(--green-t);border-color:var(--green);color:var(--green-d);box-shadow:inset 0 1px 3px rgba(31,107,74,.22);}
  .key.wide{padding:0 12px;}
  .key svg{width:15px;height:15px;}
  .key.serif{font-family:'Fraunces',serif;font-size:15px;}
  .key.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .keystack{display:flex;flex-direction:column;gap:2px;}
  .well{position:relative;overflow:hidden;}
  .well .swatch{position:absolute;left:5px;right:5px;bottom:3px;height:4px;border-radius:1px;border:1px solid rgba(34,37,31,.18);}
  .sep{width:1px;background:var(--rule);margin:4px 4px;align-self:stretch;}

  /* ---------- FORMULA BAR ---------- */
  .fbar{
    display:flex;align-items:stretch;height:34px;background:var(--tool);
    border-bottom:1px solid var(--rule2);flex:0 0 auto;
  }
  .namebox{
    width:118px;border:none;border-right:1px solid var(--rule);background:transparent;
    padding:0 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--green-d);
    letter-spacing:.04em;outline:none;
  }
  .namebox:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--green);}
  .fx{
    width:38px;border:none;border-right:1px solid var(--rule);background:transparent;
    cursor:pointer;color:var(--ink2);font-family:'Fraunces',serif;font-style:italic;font-size:15px;
  }
  .fx:hover{background:#F1EFE8;color:var(--green);}
  .finput{
    flex:1;border:none;background:transparent;padding:0 12px;outline:none;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);
  }
  .finput:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--green);}
  .finput::placeholder{color:#A9A79C;}

  /* ---------- GRID ---------- */
  .gridwrap{flex:1 1 auto;min-height:0;position:relative;background:var(--paper);}
  .grid-scroll{position:absolute;inset:0;overflow:auto;}
  table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;}
  table.grid th,table.grid td{padding:0;margin:0;}
  thead th{
    position:sticky;top:0;z-index:2;height:23px;background:var(--chrome);
    font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink2);text-align:center;user-select:none;
    border-bottom:1px solid var(--head);border-right:1px solid var(--rule);cursor:default;
  }
  thead th.colhead{cursor:pointer;}
  thead th.colhead:hover{background:#E9E7DF;color:var(--ink);}
  thead th.col-active{background:var(--green-t);color:var(--green-d);}
  thead th.corner{left:0;z-index:5;width:48px;border-right:2px solid var(--red);}
  tbody th.rowhead{
    position:sticky;left:0;z-index:1;width:48px;background:var(--chrome);
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.08em;
    color:var(--ink2);text-align:right;padding-right:8px;user-select:none;
    border-bottom:1px solid var(--rule);border-right:2px solid var(--red);cursor:default;
  }
  tbody th.rowhead:hover{background:#E9E7DF;color:var(--ink);}
  tbody th.rowhead.row-active{background:var(--green-t);color:var(--green-d);}
  td.cell{
    height:23px;background:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);
    cursor:cell;position:relative;padding:0 6px;line-height:23px;
  }
  tbody tr:nth-child(even) td.cell{background:var(--tint);}
  td.cell.neg{color:var(--red);}
  td.cell.sel{background:rgba(31,107,74,.13)!important;}
  td.cell.sel-t{box-shadow:inset 0 2px 0 var(--green);}
  td.cell.sel-b{box-shadow:inset 0 -2px 0 var(--green);}
  td.cell.sel-t.sel-b{box-shadow:inset 0 2px 0 var(--green),inset 0 -2px 0 var(--green);}
  td.cell.sel-l{border-left:2px solid var(--green);padding-left:4px;}
  td.cell.sel-r{border-right:2px solid var(--green);padding-right:4px;}
  td.cell.active{background:#fff!important;box-shadow:inset 0 0 0 2px var(--green);}
  td.cell.fill::after{
    content:'';position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;
    background:var(--green);border:1.5px solid var(--paper);cursor:crosshair;z-index:3;
  }
  td.cell.dragging{background:rgba(31,107,74,.22)!important;outline:2px dashed var(--green);outline-offset:-2px;}
  .resizer{position:absolute;top:0;right:-3px;width:8px;height:100%;cursor:col-resize;z-index:6;}
  .resizer:hover{background:rgba(31,107,74,.22);}
  #resizeGuide{position:absolute;top:0;width:1px;background:var(--red);height:100%;display:none;z-index:9;pointer-events:none;}
  #cellEditor{
    position:absolute;display:none;z-index:20;border:2px solid var(--green);background:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:0 4px;outline:none;color:var(--ink);
    box-shadow:0 4px 14px rgba(34,37,31,.18);
  }

  /* ---------- COLOUR PALETTE ---------- */
  .palette{
    position:fixed;z-index:60;width:196px;background:var(--tool);
    border:1px solid var(--rule2);border-radius:9px;padding:12px;
    box-shadow:0 16px 36px rgba(34,37,31,.24);
  }
  .palette[hidden]{display:none;}
  .pal-title{color:var(--ink2);margin-bottom:2px;}
  .pal-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#A9A79C;margin-bottom:9px;}
  .pal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
  .pal-sw{
    height:23px;border-radius:4px;border:1px solid rgba(34,37,31,.18);cursor:pointer;
    transition:transform .1s ease,border-color .1s ease;
  }
  .pal-sw:hover{transform:translateY(-2px);border-color:var(--green);}
  .pal-none{
    margin-top:10px;width:100%;height:29px;border-radius:5px;border:1px solid var(--rule2);
    background:#fff;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;color:var(--ink2);
  }
  .pal-none:hover{border-color:var(--red);color:var(--red);}

  /* ---------- SHEET BAR ---------- */
  .sheetbar{
    display:flex;align-items:flex-end;gap:2px;padding:6px 12px 0;background:var(--chrome);
    border-top:1px solid var(--rule2);flex:0 0 auto;overflow-x:auto;
  }
  .tab{
    position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 15px 8px;
    background:#EAE8E1;border:1px solid var(--rule2);border-bottom:none;
    border-radius:6px 6px 0 0;cursor:pointer;font-size:12px;color:var(--ink2);
    white-space:nowrap;user-select:none;transition:background .12s ease,color .12s ease;
  }
  .tab:hover{background:#F2F0E9;color:var(--ink);}
  .tab.active{
    background:var(--paper);color:var(--green-d);font-weight:600;
    border-color:var(--rule2);border-top:2px solid var(--green);padding-top:6px;
    box-shadow:0 -2px 8px rgba(34,37,31,.05);
  }
  .tab .x{
    width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:3px;font-size:11px;line-height:1;opacity:0;transition:opacity .12s ease;
  }
  .tab:hover .x{opacity:.65;}
  .tab .x:hover{background:rgba(192,57,43,.16);color:var(--red);opacity:1;}
  .tab-add{
    width:30px;height:29px;margin-bottom:1px;border:1px dashed var(--rule2);background:transparent;
    border-radius:6px 6px 0 0;cursor:pointer;color:var(--ink2);font-size:15px;line-height:1;
  }
  .tab-add:hover{background:#EAE8E1;color:var(--green);border-color:var(--green);}
  .tab input{
    border:1px solid var(--green);border-radius:3px;font-family:inherit;font-size:12px;
    padding:1px 4px;width:110px;outline:none;
  }

  /* ---------- STATUS BAR ---------- */
  .statusbar{
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex:0 0 auto;
    height:62px;padding:0 18px;background:linear-gradient(180deg,#22251F,#1B1E18);color:#DCDACE;
  }
  .stat-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .stat-chip{
    display:inline-flex;align-items:center;gap:8px;border:1px solid #3B3E36;border-radius:5px;
    padding:5px 11px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9FD3B8;letter-spacing:.05em;
  }
  .stat-note{font-size:11px;color:#8B8E82;}
  .readout{display:flex;align-items:center;gap:0;}
  .ro{display:flex;flex-direction:column;align-items:flex-end;padding:0 20px;border-left:1px solid #34382F;}
  .ro:first-child{border-left:none;}
  .ro-l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8B8E82;margin-bottom:1px;}
  .ro-v{
    font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.05;
    font-variant-numeric:tabular-nums;color:#F1EFE7;
  }
  .ro-v small{font-size:12px;color:#8B8E82;font-weight:400;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;}
  }
  @media (max-width:760px){
    .pill,.bookname{display:none;}
    .ro-v{font-size:16px;}
    .ro{padding:0 12px;}
    .statusbar{height:54px;}
  }
</style>
</head>
<body>

<div class="titlebar">
  <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <rect x="2.5" y="2.5" width="27" height="27" rx="2.5" stroke="#7FC3A2" stroke-width="1.5"/>
    <path d="M2.5 11.5H29.5M2.5 20.5H29.5M11.5 2.5V29.5M20.5 2.5V29.5" stroke="#7FC3A2" stroke-width="1.2"/>
    <rect x="11.5" y="11.5" width="9" height="9" fill="#2E8B62"/>
    <path d="M5 26.2l3.1 2.1 2.2-3.4" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="brandwrap">
    <div class="brand">Ledger<em>&nbsp;26</em></div>
    <div class="bookname" id="bookName">Book1.xlsx — regional analysis</div>
  </div>
  <div class="pill" id="savePill"><span class="dotmark"></span><span id="saveText">Saved locally · —</span></div>
  <div class="tb-spacer"></div>
  <button class="tbtn icon" id="btnUndo" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/></svg>
  </button>
  <button class="tbtn icon" id="btnRedo" title="Redo (Ctrl+Y)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h3"/></svg>
  </button>
  <button class="tbtn" id="btnUpload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    Upload CSV
  </button>
  <button class="tbtn" id="btnDownload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    Download CSV
  </button>
  <input type="file" id="fileInput" accept=".csv,text/csv" style="display:none">
</div>

<div class="ribbon">
  <div class="rgroup">
    <div class="rkeys">
      <button class="key" data-cmd="clear" title="Clear contents (Delete)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M15.5 4.5l4 4-9 9-4-4z"/><path d="M6.5 11.5l-2 2 6 6 2-2"/></svg>
      </button>
      <button class="key" data-cmd="clearall" title="Clear contents and formatting">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 12h8l1-12"/><path d="M11 11v5M14 11v5"/></svg>
      </button>
    </div>
    <div class="rlabel micro">Clipboard</div>
  </div>

  <div class="rgroup">
    <div class="rkeys">
      <div class="keystack">
        <div class="rkeys">
          <button class="key serif" data-cmd="bold" title="Bold (Ctrl+B)" style="font-weight:700">B</button>
          <button class="key serif" data-cmd="italic" title="Italic (Ctrl+I)" style="font-style:italic">I</button>
          <button class="key serif" data-cmd="underline" title="Underline (Ctrl+U)" style="text-decoration:underline">U</button>
          <div class="sep"></div>
          <button class="key mono" data-cmd="size-" title="Decrease font size">A−</button>
          <button class="key mono" data-cmd="size+" title="Increase font size">A+</button>
        </div>
        <div class="rkeys">
          <button class="key well" data-cmd="color" title="Text colour">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 15l6-11 6 11"/><path d="M8.5 12h7"/><path d="M5 20h14"/></svg>
            <span class="swatch" id="colorSwatch" style="background:#22251F"></span>
          </button>
          <button class="key well" data-cmd="fill" title="Fill colour">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l7-7 7 7-7 7z"/><path d="M19 15c1.2 1.6 1.8 2.6 1.8 3.4a1.8 1.8 0 1 1-3.6 0c0-.8.6-1.8 1.8-3.4z"/></svg>
            <span class="swatch" id="fillSwatch" style="background:#D9E9E0"></span>
          </button>
          <div class="sep"></div>
          <button class="key" data-cmd="align-l" title="Align left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 11h10M4 16h14M4 21h8"/></svg>
          </button>
          <button class="key" data-cmd="align-c" title="Align centre">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M7 11h10M5 16h14M8 21h8"/></svg>
          </button>
          <button class="key" data-cmd="align-r" title="Align right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M10 11h10M6 16h14M12 21h8"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="rlabel micro">Font &amp; Alignment</div>
  </div>

  <div class="rgroup">
    <div class="rkeys">
      <button class="key mono" data-cmd="fmt-usd" title="Currency format">$</button>
      <button class="key mono" data-cmd="fmt-pct" title="Percent format">%</button>
      <button class="key mono" data-cmd="fmt-d2" title="Two decimals">.00</button>
      <button class="key mono" data-cmd="fmt-d1" title="One decimal">.0</button>
      <button class="key mono" data-cmd="fmt-gen" title="General format">Gen</button>
    </div>
    <div class="rlabel micro">Number</div>
  </div>

  <div class="rgroup">
    <div class="rkeys">
      <button class="key wide" data-cmd="autosum" title="AutoSum">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5H7l5 7-5 7h10"/></svg>
        AutoSum
      </button>
      <button class="key" data-cmd="neg" title="Negative numbers in red">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 12h12"/><circle cx="12" cy="12" r="8.2"/></svg>
      </button>
    </div>
    <div class="rlabel micro">Edit</div>
  </div>

  <div class="rgroup" style="border-right:none">
    <div class="rkeys">
      <div class="key mono" style="cursor:default;background:#F1EFE8" id="ribbonSel">A1</div>
    </div>
    <div class="rlabel micro">Selection</div>
  </div>
</div>

<div class="fbar">
  <input class="namebox mono tnum" id="nameBox" value="A1" spellcheck="false" aria-label="Name box">
  <button class="fx" id="fxBtn" title="Insert function">fx</button>
  <input class="finput" id="formulaInput" spellcheck="false" placeholder="Enter a value, or a formula starting with =  —  e.g. =SUM(E2:E11)/10" aria-label="Formula bar">
</div>

<div class="gridwrap">
  <div class="grid-scroll" id="gridScroll" tabindex="-1">
    <table class="grid" id="grid">
      <colgroup id="colgroup"></colgroup>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="gridBody"></tbody>
    </table>
    <div id="resizeGuide"></div>
    <input id="cellEditor" spellcheck="false">
  </div>
</div>

  <div class="palette" id="palette" hidden>
    <div class="pal-title micro" id="palTitle">Fill colour</div>
    <div class="pal-sub">ledger palette · 18 swatches</div>
    <div class="pal-grid" id="palGrid"></div>
    <button class="pal-none" id="palNone">No colour</button>
  </div>

  <div class="sheetbar">
  <div id="sheetTabs" style="display:flex;gap:2px;align-items:flex-end;"></div>
  <button class="tab-add" id="addSheet" title="Add sheet">+</button>
</div>

<div class="statusbar">
  <div class="stat-left">
    <div class="stat-chip"><span id="statSel">A1</span></div>
    <div class="stat-note" id="statNote">Ready — double-click a cell or press F2 to edit</div>
  </div>
  <div class="readout">
    <div class="ro"><span class="ro-l">Count</span><span class="ro-v tnum" id="roCount">0</span></div>
    <div class="ro"><span class="ro-l">Sum</span><span class="ro-v tnum" id="roSum">0</span></div>
    <div class="ro"><span class="ro-l">Average</span><span class="ro-v tnum" id="roAvg">0</span></div>
    <div class="ro"><span class="ro-l">Min / Max</span><span class="ro-v tnum" id="roMinMax">—</span></div>
  </div>

<script>
/* =========================================================
   LEDGER 26 — formula engine (tokenizer → parser → evaluator)
   ========================================================= */
const NC = 40, NR = 200;

function colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; }
function colIndex(n){ let x=0; n=n.toUpperCase(); for(const ch of n) x = x*26 + (ch.charCodeAt(0)-64); return x-1; }

function tokenize(src){
  const out=[]; let i=0;
  const isDigit=c=>c>='0'&&c<='9';
  while(i<src.length){
    const c=src[i];
    if(c===' '||c==='\t'||c==='\n'||c==='\r'){ i++; continue; }
    if(c==='"'){
      let s=''; i++;
      while(i<src.length){
        if(src[i]==='"'){ if(src[i+1]==='"'){ s+='"'; i+=2; continue; } i++; break; }
        s+=src[i++];
      }
      out.push({t:'str',v:s}); continue;
    }
    if(isDigit(c) || (c==='.' && isDigit(src[i+1]))){
      let j=i; while(j<src.length && (isDigit(src[j])||src[j]==='.')) j++;
      out.push({t:'num',v:parseFloat(src.slice(i,j))}); i=j; continue;
    }
    if(/[A-Za-z_$]/.test(c)){
      let j=i; while(j<src.length && /[A-Za-z0-9_$.]/.test(src[j])) j++;
      const w=src.slice(i,j); i=j;
      const m=w.match(/^\$?([A-Za-z]{1,3})\$?([0-9]{1,7})$/);
      if(m) out.push({t:'ref',c:colIndex(m[1]),r:parseInt(m[2],10)-1});
      else out.push({t:'id',v:w.toUpperCase()});
      continue;
    }
    if(c==='<'||c==='>'){
      if(src[i+1]==='='){ out.push({t:'op',v:c+'='}); i+=2; continue; }
      if(c==='<'&&src[i+1]==='>'){ out.push({t:'op',v:'<>'}); i+=2; continue; }
      out.push({t:'op',v:c}); i++; continue;
    }
    if('+-*/^&%='.includes(c)){ out.push({t:'op',v:c}); i++; continue; }
    if(c==='('){ out.push({t:'lp'}); i++; continue; }
    if(c===')'){ out.push({t:'rp'}); i++; continue; }
    if(c===','){ out.push({t:'comma'}); i++; continue; }
    if(c===':'){ out.push({t:'colon'}); i++; continue; }
    throw new Error('Unexpected character "'+c+'"');
  }
  return out;
}

function parseFormula(src){
  const ts = tokenize(src); let p = 0;
  const peek = () => ts[p];
  const next = () => ts[p++];
  const CMP = ['=','<>','<','>','<=','>='];

  function primary(){
    const t = next();
    if(!t) throw new Error('Unexpected end of formula');
    if(t.t==='num') return {k:'num',v:t.v};
    if(t.t==='str') return {k:'str',v:t.v};
    if(t.t==='ref'){
      if(peek() && peek().t==='colon'){
        next();
        const t2 = next();
        if(!t2 || t2.t!=='ref') throw new Error('Malformed range');
        return {k:'range',r1:t.r,c1:t.c,r2:t2.r,c2:t2.c};
      }
      return {k:'ref',r:t.r,c:t.c};
    }
    if(t.t==='id'){
      if(peek() && peek().t==='lp'){
        next();
        const args=[];
        if(peek() && peek().t==='rp'){ next(); }
        else{
          for(;;){ args.push(expr()); if(peek() && peek().t==='comma'){ next(); continue; } break; }
          if(!peek() || peek().t!=='rp') throw new Error('Expected )');
          next();
        }
        return {k:'call',name:t.v,args};
      }
      if(t.v==='TRUE') return {k:'bool',v:true};
      if(t.v==='FALSE') return {k:'bool',v:false};
      throw new Error('Unknown name "'+t.v+'"');
    }
    if(t.t==='lp'){ const e=expr(); if(!peek()||peek().t!=='rp') throw new Error('Expected )'); next(); return e; }
    throw new Error('Unexpected token');
  }
  function postfix(){ let e=primary(); while(peek()&&peek().t==='op'&&peek().v==='%'){ next(); e={k:'pct',a:e}; } return e; }
  function power(){ let l=postfix(); if(peek()&&peek().t==='op'&&peek().v==='^'){ next(); const r=unary(); l={k:'bin',op:'^',a:l,b:r}; } return l; }
  function unary(){
    if(peek()&&peek().t==='op'&&(peek().v==='-'||peek().v==='+')){
      const op=next().v; const e=unary();
      return op==='-' ? {k:'neg',a:e} : e;
    }
    return power();
  }
  function mul(){ let l=unary(); while(peek()&&peek().t==='op'&&(peek().v==='*'||peek().v==='/')){ const op=next().v; const r=unary(); l={k:'bin',op,a:l,b:r}; } return l; }
  function add(){ let l=mul(); while(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='-')){ const op=next().v; const r=mul(); l={k:'bin',op,a:l,b:r}; } return l; }
  function cat(){ let l=add(); while(peek()&&peek().t==='op'&&peek().v==='&'){ next(); const r=add(); l={k:'bin',op:'&',a:l,b:r}; } return l; }
  function expr(){ let l=cat(); while(peek()&&peek().t==='op'&&CMP.includes(peek().v)){ const op=next().v; const r=cat(); l={k:'bin',op,a:l,b:r}; } return l; }

  const e = expr();
  if(p < ts.length) throw new Error('Unexpected extra input');
  return e;
}

/* ---------- values ---------- */
const ERR = s => ({err:s});
const isErr = v => v && typeof v === 'object' && typeof v.err === 'string';
function scalar(v){ if(v && typeof v==='object' && Array.isArray(v.range)) return ERR('#VALUE!'); return v; }
function toNum(v){
  v = scalar(v);
  if(isErr(v)) return v;
  if(typeof v === 'number') return v;
  if(typeof v === 'boolean') return v?1:0;
  if(v===''||v===null||v===undefined) return 0;
  const n = Number(String(v).replace(/[$,]/g,''));
  return isNaN(n) ? ERR('#VALUE!') : n;
}
function toStr(v){
  v = scalar(v);
  if(isErr(v)) return v;
  if(typeof v === 'boolean') return v?'TRUE':'FALSE';
  if(v==null) return '';
  return String(v);
}
function truthy(v){
  v = scalar(v);
  if(isErr(v)) return false;
  if(typeof v === 'boolean') return v;
  if(typeof v === 'number') return v!==0;
  return v!=='' && v!=null;
}
function compare(a,b){
  const an = typeof a==='number', bn = typeof b==='number';
  if(an && bn) return a<b?-1:(a>b?1:0);
  if(a===''&&b!=='') return -1; if(b===''&&a!=='') return 1;
  const as=String(a).toUpperCase(), bs=String(b).toUpperCase();
  return as<bs?-1:(as>bs?1:0);
}

/* ---------- evaluation ---------- */
function evalNode(node, sheet){
  switch(node.k){
    case 'num': return node.v;
    case 'str': return node.v;
    case 'bool': return node.v;
    case 'ref': return cellValue(sheet, node.r, node.c);
    case 'range': {
      const out=[];
      const r1=Math.min(node.r1,node.r2), r2=Math.max(node.r1,node.r2);
      const c1=Math.min(node.c1,node.c2), c2=Math.max(node.c1,node.c2);
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) out.push(cellValue(sheet,r,c));
      return {range:out};
    }
    case 'pct': { const n=toNum(evalNode(node.a,sheet)); return isErr(n)?n:n/100; }
    case 'neg': { const n=toNum(evalNode(node.a,sheet)); return isErr(n)?n:-n; }
    case 'bin': {
      const a = scalar(evalNode(node.a, sheet));
      if(isErr(a)) return a;
      const b = scalar(evalNode(node.b, sheet));
      if(isErr(b)) return b;
      const op = node.op;
      if(op==='&'){ const s1=toStr(a), s2=toStr(b); if(isErr(s1))return s1; if(isErr(s2))return s2; return s1+s2; }
      if(op==='='||op==='<>'||op==='<'||op==='>'||op==='<='||op==='>='){
        const cmp = compare(a,b);
        switch(op){ case '=': return cmp===0; case '<>': return cmp!==0; case '<': return cmp<0;
          case '>': return cmp>0; case '<=': return cmp<=0; case '>=': return cmp>=0; }
      }
      const x=toNum(a), y=toNum(b);
      if(isErr(x)) return x; if(isErr(y)) return y;
      switch(op){
        case '+': return x+y;
        case '-': return x-y;
        case '*': return x*y;
        case '/': return y===0 ? ERR('#DIV/0!') : x/y;
        case '^': return Math.pow(x,y);
      }
      return ERR('#VALUE!');
    }
    case 'call': return callFn(node.name, node.args, sheet);
  }
  return ERR('#VALUE!');
}

function argValues(args, sheet){ return args.map(a=>evalNode(a,sheet)); }
function flatNums(vals){
  const out=[];
  for(const v of vals){
    if(isErr(v)) return v;
    if(v && typeof v==='object' && Array.isArray(v.range)){
      for(const x of v.range){ if(isErr(x)) return x; if(typeof x==='number') out.push(x); }
    } else if(typeof v==='number') out.push(v);
  }
  return out;
}
function flatAll(vals){
  const out=[];
  for(const v of vals){
    if(isErr(v)) return v;
    if(v && typeof v==='object' && Array.isArray(v.range)) out.push(...v.range);
    else out.push(v);
  }
  return out;
}

function callFn(name, args, sheet){
  const vals = argValues(args, sheet);
  for(const v of vals) if(isErr(v)) return v;
  const nums = flatNums(vals);
  if(isErr(nums)) return nums;
  const all = flatAll(vals);
  if(isErr(all)) return all;

  switch(name){
    case 'SUM': return nums.reduce((a,b)=>a+b,0);
    case 'AVERAGE': return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : ERR('#DIV/0!');
    case 'MIN': return nums.length ? Math.min(...nums) : 0;
    case 'MAX': return nums.length ? Math.max(...nums) : 0;
    case 'COUNT': return nums.length;
    case 'COUNTA': return all.filter(v=>v!==''&&v!=null).length;
    case 'ABS': { const n=toNum(vals[0]); return isErr(n)?n:Math.abs(n); }
    case 'ROUND': {
      const n=toNum(vals[0]); if(isErr(n)) return n;
      const d=vals.length>1?toNum(vals[1]):0; if(isErr(d)) return d;
      const f=Math.pow(10,d); return Math.round(n*f)/f;
    }
    case 'SQRT': { const n=toNum(vals[0]); if(isErr(n)) return n; return n<0?ERR('#NUM!'):Math.sqrt(n); }
    case 'POWER': { const a=toNum(vals[0]), b=toNum(vals[1]); if(isErr(a))return a; if(isErr(b))return b; return Math.pow(a,b); }
    case 'IF': { const cond=truthy(vals[0]); if(vals.length<2) return cond; return cond ? vals[1] : (vals.length>2?vals[2]:false); }
    case 'LEN': { const s=toStr(vals[0]); return isErr(s)?s:s.length; }
    case 'TRIM': { const s=toStr(vals[0]); return isErr(s)?s:s.trim().replace(/\s+/g,' '); }
    case 'UPPER': { const s=toStr(vals[0]); return isErr(s)?s:s.toUpperCase(); }
    case 'LOWER': { const s=toStr(vals[0]); return isErr(s)?s:s.toLowerCase(); }
    case 'CONCATENATE': return all.map(v=>{ const s=toStr(v); return isErr(s)?'':s; }).join('');
    case 'NOW': return new Date().toLocaleString();
    case 'TODAY': return new Date().toLocaleDateString();
  }
  return ERR('#NAME?');
}

function cellValue(sheet, r, c){
  if(r<0||c<0||r>=NR||c>=NC) return ERR('#REF!');
  const key = r+','+c;
  if(key in sheet.cache) return sheet.cache[key];
  const cell = sheet.cells[key];
  if(!cell || cell.v==='' || cell.v==null){ sheet.cache[key]=''; return ''; }
  const raw = String(cell.v);
  if(raw[0]==='='){
    if(sheet.stack.has(key)){ sheet.cache[key]=ERR('#CYCLE!'); return ERR('#CYCLE!'); }
    sheet.stack.add(key);
    let val;
    try { val = evalNode(parseFormula(raw.slice(1)), sheet); }
    catch(e){ val = ERR('#NAME?'); }
    sheet.stack.delete(key);
    sheet.cache[key]=val;
    return val;
  }
  const t = raw.trim();
  const n = Number(t.replace(/,/g,''));
  const val = (t!=='' && !isNaN(n) && !/[a-zA-Z]/.test(t.replace(/e/gi,''))) ? n : raw;
  sheet.cache[key]=val;
  return val;
}

function recalcAll(sheet){
  sheet.cache = {};
  for(const key in sheet.cells){
    if(sheet.cells[key].v && String(sheet.cells[key].v)[0]==='='){
      const [r,c] = key.split(',').map(Number);
      cellValue(sheet, r, c);
    }
  }
}

/* ---------- display formatting ---------- */
function fmtValue(v, st){
  if(v===''||v===null||v===undefined) return {text:'',neg:false,right:false};
  if(isErr(v)) return {text:v.err,neg:true,right:true};
  if(typeof v==='boolean') return {text:v?'TRUE':'FALSE',neg:false,right:true};
  if(typeof v==='number'){
    const neg = v<0;
    const f = st && st.n;
    let t;
    if(f==='usd') t = (neg?'-$':'$') + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    else if(f==='pct') t = (v*100).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
    else if(f==='d1') t = v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
    else if(f==='d2') t = v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    else t = v.toLocaleString('en-US',{maximumFractionDigits:8});
    return {text:t,neg,right:true};
  }
  return {text:String(v),neg:false,right:false};
}
</script>
<script>
/* =========================================================
   LEDGER 26 — application
   ========================================================= */
const $ = id => document.getElementById(id);
const gridBody = $('gridBody'), headRow = $('headRow'), colgroup = $('colgroup');
const gridScroll = $('gridScroll'), editor = $('cellEditor');
const formulaInput = $('formulaInput'), nameBox = $('nameBox');

const state = {
  sheets: [], active: 0,
  sel: {r1:0,c1:0,r2:0,c2:0,ar:0,ac:0},
  undo: [], redo: [],
  dragging:false, refDragging:false, fillDragging:false, refSpan:null, refAnchor:null, fillSrc:null
};

function cur(){ return state.sheets[state.active]; }
function newSheet(name){ return {name:name, cells:{}, cache:{}, stack:new Set(), painted:new Set()}; }
function cellKey(r,c){ return r+','+c; }
function addr(r,c){ return colName(c) + (r+1); }
function rangeAddr(a,b){
  return (a.r===b.r && a.c===b.c) ? addr(a.r,a.c) : addr(Math.min(a.r,b.r),Math.min(a.c,b.c)) + ':' + addr(Math.max(a.r,b.r),Math.max(a.c,b.c));
}

/* ---------- grid construction ---------- */
const cellEl = [];
function buildGrid(){
  const cg = document.createElement('col');
  cg.style.width = '48px'; colgroup.appendChild(cg);
  for(let c=0;c<NC;c++){
    const col = document.createElement('col');
    col.style.width = '98px';
    colgroup.appendChild(col);
    const th = document.createElement('th');
    th.className = 'colhead'; th.dataset.c = c;
    th.innerHTML = colName(c) + '<span class="resizer" data-c="' + c + '"></span>';
    headRow.appendChild(th);
  }
  const corner = document.createElement('th');
  corner.className = 'corner'; corner.style.position='sticky'; corner.style.left='0';
  headRow.insertBefore(corner, headRow.firstChild);

  const frag = document.createDocumentFragment();
  for(let r=0;r<NR;r++){
    const tr = document.createElement('tr');
    const rh = document.createElement('th');
    rh.className = 'rowhead'; rh.textContent = r+1; rh.dataset.r = r;
    tr.appendChild(rh);
    cellEl[r] = [];
    for(let c=0;c<NC;c++){
      const td = document.createElement('td');
      td.className = 'cell'; td.dataset.r = r; td.dataset.c = c;
      td._base = 'cell'; td._sel = ''; td._d = null;
      cellEl[r][c] = td;
      tr.appendChild(td);
    }
    frag.appendChild(tr);
  }
  gridBody.appendChild(frag);
}

/* ---------- painting ---------- */
function applyStyle(el, st){
  el.style.fontWeight = st && st.b ? '600' : '';
  el.style.fontStyle  = st && st.i ? 'italic' : '';
  el.style.textDecoration = st && st.u ? 'underline' : '';
  el.style.color = st && st.c ? st.c : '';
  el.style.background = st && st.bg ? st.bg : '';
  el.style.fontSize = st && st.fs ? st.fs + 'px' : '';
}
function paintCell(r,c){
  const sheet = cur(), el = cellEl[r][c], key = cellKey(r,c);
  const cell = sheet.cells[key];
  const st = cell && cell.s;
  const d = fmtValue(cellValue(sheet,r,c), st);
  if(el._d !== d.text){ el.textContent = d.text; el._d = d.text; }
  if(d.text) sheet.painted.add(key); else sheet.painted.delete(key);
  setBase(el, 'cell' + (d.neg ? ' neg' : ''));
  el.style.textAlign = (st && st.a) ? (st.a==='c'?'center':st.a==='r'?'right':'left') : (d.right ? 'right' : 'left');
  applyStyle(el, st);
}
function setBase(el, cls){ el._base = cls; el.className = cls + (el._sel||''); }
function setSelCls(el, s){ el._sel = s; el.className = (el._base||'cell') + s; }

function repaintAll(){
  const sheet = cur();
  const keys = new Set(Object.keys(sheet.cells));
  for(const k of sheet.painted) keys.add(k);
  for(const k of keys){
    const [r,c] = k.split(',').map(Number);
    if(r<NR && c<NC) paintCell(r,c);
  }
}
function refresh(){ recalcAll(cur()); repaintAll(); updateInfo(); }

/* ---------- selection ---------- */
let selEls = [];
function applySelection(){
  for(const el of selEls) setSelCls(el, '');
  selEls = [];
  const s = state.sel;
  const R1 = Math.min(s.r1,s.r2), R2 = Math.max(s.r1,s.r2);
  const C1 = Math.min(s.c1,s.c2), C2 = Math.max(s.c1,s.c2);
  for(let r=R1;r<=R2;r++){
    for(let c=C1;c<=C2;c++){
      const el = cellEl[r][c];
      let cls = ' sel';
      if(r===R1) cls += ' sel-t';
      if(r===R2) cls += ' sel-b';
      if(c===C1) cls += ' sel-l';
      if(c===C2) cls += ' sel-r';
      if(r===R2 && c===C2) cls += ' fill';
      if(r===s.ar && c===s.ac) cls += ' active';
      setSelCls(el, cls);
      selEls.push(el);
    }
  }
  document.querySelectorAll('th.col-active').forEach(e=>e.classList.remove('col-active'));
  document.querySelectorAll('th.row-active').forEach(e=>e.classList.remove('row-active'));
  for(let c=C1;c<=C2;c++){ const th = headRow.children[c+1]; if(th) th.classList.add('col-active'); }
  for(let r=R1;r<=R2;r++){ const th = gridBody.children[r] && gridBody.children[r].firstChild; if(th && R2-R1<40) th.classList.add('row-active'); }
}
function setSel(r1,c1,r2,c2,ar,ac){
  state.sel = {r1,c1,r2,c2, ar:ar==null?r1:ar, ac:ac==null?c1:ac};
  applySelection(); updateInfo();
}
function scrollIntoView(r,c){
  const el = cellEl[r][c];
  const top = el.offsetTop, left = el.offsetLeft, h = el.offsetHeight, w = el.offsetWidth;
  const st = gridScroll.scrollTop, sl = gridScroll.scrollLeft;
  const vh = gridScroll.clientHeight, vw = gridScroll.clientWidth;
  if(top < st + 24) gridScroll.scrollTop = top - 24;
  else if(top + h > st + vh - 4) gridScroll.scrollTop = top + h - vh + 4;
  if(left < sl + 48) gridScroll.scrollLeft = left - 48;
  else if(left + w > sl + vw - 4) gridScroll.scrollLeft = left + w - vw + 4;
}

/* ---------- info / status ---------- */
function selectionLabel(){
  const s = state.sel;
  const R1 = Math.min(s.r1,s.r2), R2 = Math.max(s.r1,s.r2);
  const C1 = Math.min(s.c1,s.c2), C2 = Math.max(s.c1,s.c2);
  const rows = R2-R1+1, cols = C2-C1+1;
  return (rows===1 && cols===1) ? addr(s.ar,s.ac) : rows + 'R × ' + cols + 'C';
}
function updateInfo(){
  const s = state.sel, sheet = cur();
  const label = selectionLabel();
  nameBox.value = label;
  $('ribbonSel').textContent = label;
  $('statSel').textContent = (s.r1===s.r2 && s.c1===s.c2) ? addr(s.ar,s.ac) : rangeAddr({r:s.r1,c:s.c1},{r:s.r2,c:s.c2});
  if(document.activeElement !== formulaInput){
    const cell = sheet.cells[cellKey(s.ar,s.ac)];
    formulaInput.value = cell && cell.v != null ? cell.v : '';
    formulaInput.style.color = '#22251F';
  }
  syncToolbar();
  // aggregates
  const R1 = Math.min(s.r1,s.r2), R2 = Math.max(s.r1,s.r2);
  const C1 = Math.min(s.c1,s.c2), C2 = Math.max(s.c1,s.c2);
  let count = 0, sum = 0, mn = Infinity, mx = -Infinity;
  for(let r=R1;r<=R2;r++) for(let c=C1;c<=C2;c++){
    const v = cellValue(sheet,r,c);
    if(typeof v === 'number'){ count++; sum += v; mn = Math.min(mn,v); mx = Math.max(mx,v); }
    else if(v!=='' && v!=null) count++;
  }
  const fmt = n => Math.abs(n) >= 1000
    ? n.toLocaleString('en-US',{maximumFractionDigits:2})
    : (Math.round(n*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3});
  const numeric = count > 0 && isFinite(mn);
  $('roCount').textContent = count.toLocaleString('en-US');
  $('roSum').textContent = numeric ? fmt(sum) : '0';
  $('roAvg').textContent = numeric ? fmt(avgOf(sheet,R1,R2,C1,C2)) : '—';
  $('roMinMax').textContent = numeric ? fmt(mn) + ' / ' + fmt(mx) : '—';
}
function avgOf(sheet,R1,R2,C1,C2){
  let n=0, t=0;
  for(let r=R1;r<=R2;r++) for(let c=C1;c<=C2;c++){
    const v = cellValue(sheet,r,c);
    if(typeof v==='number'){ n++; t+=v; }
  }
  return n ? t/n : 0;
}

function markSaved(){
  const t = new Date();
  const hh = String(t.getHours()).padStart(2,'0'), mm = String(t.getMinutes()).padStart(2,'0');
  const pill = $('savePill');
  pill.style.opacity = '0.35';
  setTimeout(()=>{ $('saveText').textContent = 'Saved locally · ' + hh + ':' + mm; pill.style.opacity = '1'; }, 130);
}

/* ---------- mutations ---------- */
function pushUndo(){
  state.undo.push(JSON.stringify(cur().cells));
  if(state.undo.length > 60) state.undo.shift();
  state.redo.length = 0;
}
function doUndo(){
  if(!state.undo.length) return;
  state.redo.push(JSON.stringify(cur().cells));
  cur().cells = JSON.parse(state.undo.pop());
  refresh(); markSaved();
}
function doRedo(){
  if(!state.redo.length) return;
  state.undo.push(JSON.stringify(cur().cells));
  cur().cells = JSON.parse(state.redo.pop());
  refresh(); markSaved();
}
function setCellRaw(r,c,raw){
  const sheet = cur(), key = cellKey(r,c);
  if(!sheet.cells[key]) sheet.cells[key] = {};
  sheet.cells[key].v = raw;
  if(raw === '' && !sheet.cells[key].s) delete sheet.cells[key];
}
function getStyle(r,c){ const cell = cur().cells[cellKey(r,c)]; return cell && cell.s ? cell.s : null; }
function mutateStyle(fn){
  pushUndo();
  const s = state.sel;
  const R1 = Math.min(s.r1,s.r2), R2 = Math.max(s.r1,s.r2);
  const C1 = Math.min(s.c1,s.c2), C2 = Math.max(s.c1,s.c2);
  for(let r=R1;r<=R2;r++) for(let c=C1;c<=C2;c++){
    const key = cellKey(r,c), sheet = cur();
    if(!sheet.cells[key]) sheet.cells[key] = {v:''};
    if(!sheet.cells[key].s) sheet.cells[key].s = {};
    fn(sheet.cells[key].s, r, c);
  }
  repaintAll(); updateInfo(); markSaved();
}

/* ---------- editing ---------- */
let editing = false, editTarget = null;
function startEdit(initial, fromKey){
  const s = state.sel, el = cellEl[s.ar][s.ac];
  editing = true; editTarget = {r:s.ar, c:s.ac};
  editor.style.display = 'block';
  editor.style.left = el.offsetLeft + 'px';
  editor.style.top = el.offsetTop + 'px';
  editor.style.width = Math.max(el.offsetWidth, 140) + 'px';
  editor.style.height = el.offsetHeight + 'px';
  const cell = cur().cells[cellKey(s.ar,s.ac)];
  editor.value = initial != null ? initial : (cell && cell.v != null ? cell.v : '');
  editor.style.fontWeight = el.style.fontWeight;
  editor.style.fontStyle = el.style.fontStyle;
  editor.focus();
  if(fromKey) editor.setSelectionRange(editor.value.length, editor.value.length);
  else editor.select();
  $('statNote').textContent = 'Editing ' + addr(s.ar,s.ac) + ' — Enter commits, Escape cancels';
}
function commitEdit(move){
  if(!editing) return;
  const {r,c} = editTarget;
  pushUndo();
  setCellRaw(r,c,editor.value);
  editing = false; editTarget = null;
  editor.style.display = 'none';
  refresh(); markSaved();
  gridScroll.focus();
  if(move) moveSel(move.dr, move.dc, false);
  $('statNote').textContent = 'Ready — double-click a cell or press F2 to edit';
}
function cancelEdit(){
  editing = false; editTarget = null;
  editor.style.display = 'none';
  gridScroll.focus();
  $('statNote').textContent = 'Edit cancelled';
}

function moveSel(dr,dc,extend){
  const s = state.sel;
  if(extend){
    const r2 = Math.max(0, Math.min(NR-1, s.r2 + dr));
    const c2 = Math.max(0, Math.min(NC-1, s.c2 + dc));
    setSel(s.r1, s.c1, r2, c2, s.ar, s.ac);
  } else {
    const r = Math.max(0, Math.min(NR-1, s.ar + dr));
    const c = Math.max(0, Math.min(NC-1, s.ac + dc));
    setSel(r,c,r,c,r,c);
  }
  scrollIntoView(extend ? state.sel.r2 : state.sel.ar, extend ? state.sel.c2 : state.sel.ac);
}

/* ---------- formula-bar reference insertion ---------- */
function isRefMode(){
  return document.activeElement === formulaInput && formulaInput.value.trim().startsWith('=');
}
function insertAtCaret(inp, text){
  const s = inp.selectionStart, e = inp.selectionEnd, v = inp.value;
  inp.value = v.slice(0,s) + text + v.slice(e);
  const pos = s + text.length;
  inp.setSelectionRange(pos,pos);
  return {start:s, end:pos};
}
function replaceSpan(inp, span, text){
  inp.value = inp.value.slice(0,span.start) + text + inp.value.slice(span.end);
  inp.setSelectionRange(span.start, span.start + text.length);
  return {start:span.start, end:span.start + text.length};
}

/* ---------- grid interaction ---------- */
gridBody.addEventListener('mousedown', e=>{
  const td = e.target.closest('td.cell');
  if(!td) return;
  const r = +td.dataset.r, c = +td.dataset.c;
  e.preventDefault();

  if(isRefMode()){
    state.refAnchor = {r,c};
    state.refSpan = insertAtCaret(formulaInput, addr(r,c));
    state.refDragging = true;
    setSel(r,c,r,c,r,c);
    return;
  }
  if(editing) commitEdit(null);

  // fill handle?
  if(td.classList.contains('fill') && e.offsetX > td.offsetWidth - 10 && e.offsetY > td.offsetHeight - 10){
    state.fillDragging = true;
    state.fillSrc = {r1:state.sel.r1,c1:state.sel.c1,r2:state.sel.r2,c2:state.sel.c2};
    return;
  }
  if(e.shiftKey){
    state.sel.r2 = r; state.sel.c2 = c;
    applySelection(); updateInfo();
    state.dragging = true;
  } else {
    setSel(r,c,r,c,r,c);
    state.dragging = true;
  }
  gridScroll.focus();
});

gridBody.addEventListener('mouseover', e=>{
  const td = e.target.closest('td.cell');
  if(!td) return;
  const r = +td.dataset.r, c = +td.dataset.c;
  if(state.refDragging && state.refSpan){
    state.refSpan = replaceSpan(formulaInput, state.refSpan, rangeAddr(state.refAnchor, {r,c}));
    state.sel.r2 = r; state.sel.c2 = c; applySelection();
    return;
  }
  if(state.fillDragging){
    const f = state.fillSrc;
    setSel(Math.min(f.r1,r), Math.min(f.c1,c), Math.max(f.r2,r), Math.max(f.c2,c), f.r1, f.c1);
    return;
  }
  if(state.dragging){
    state.sel.r2 = r; state.sel.c2 = c;
    applySelection(); updateInfo();
  }
});

window.addEventListener('mouseup', ()=>{
  if(state.fillDragging){
    state.fillDragging = false;
    doFill();
  }
  state.dragging = false;
  state.refDragging = false;
  state.refSpan = null;
});

gridBody.addEventListener('dblclick', e=>{
  const td = e.target.closest('td.cell');
  if(!td) return;
  if(isRefMode()) return;
  setSel(+td.dataset.r, +td.dataset.c, +td.dataset.r, +td.dataset.c, +td.dataset.r, +td.dataset.c);
  startEdit(null, true);
});

/* column headers: click selects whole column */
headRow.addEventListener('mousedown', e=>{
  const resizer = e.target.closest('.resizer');
  if(resizer){ startResize(+resizer.dataset.c, e); return; }
  const th = e.target.closest('th.colhead');
  if(!th) return;
  const c = +th.dataset.c;
  setSel(0, c, NR-1, c, 0, c);
});
gridBody.addEventListener('mousedown', e=>{
  const rh = e.target.closest('th.rowhead');
  if(!rh) return;
  const r = +rh.dataset.r;
  setSel(r, 0, r, NC-1, r, 0);
}, true);

/* ---------- fill handle ---------- */
function shiftFormula(raw, dr, dc){
  if(typeof raw !== 'string' || raw[0] !== '=') return raw;
  return raw.replace(/(\$?)([A-Za-z]{1,3})(\$?)([0-9]{1,7})/g, (m, a, col, b, row) => {
    let c = colIndex(col), r = parseInt(row,10) - 1;
    if(!a) c += dc;
    if(!b) r += dr;
    if(r < 0 || c < 0) return '#REF!';
    return (a ? '$' : '') + colName(c) + (b ? '$' : '') + (r + 1);
  });
}
function doFill(){
  const f = state.fillSrc, s = state.sel;
  const TR1 = Math.min(s.r1,s.r2), TR2 = Math.max(s.r1,s.r2);
  const TC1 = Math.min(s.c1,s.c2), TC2 = Math.max(s.c1,s.c2);
  const SR1 = Math.min(f.r1,f.r2), SR2 = Math.max(f.r1,f.r2);
  const SC1 = Math.min(f.c1,f.c2), SC2 = Math.max(f.c1,f.c2);
  const h = SR2 - SR1 + 1, w = SC2 - SC1 + 1;
  pushUndo();
  for(let r=TR1;r<=TR2;r++){
    for(let c=TC1;c<=TC2;c++){
      if(r>=SR1 && r<=SR2 && c>=SC1 && c<=SC2) continue;
      const sr = SR1 + ((r - SR1) % h), sc = SC1 + ((c - SC1) % w);
      const src = cur().cells[cellKey(sr,sc)];
      const raw = src ? shiftFormula(src.v, r - sr, c - sc) : '';
      setCellRaw(r, c, raw);
    }
  }
  refresh(); markSaved();
}

/* ---------- column resize ---------- */
function startResize(c, e){
  e.preventDefault();
  const guide = $('resizeGuide');
  const rect = gridScroll.getBoundingClientRect();
  const col = colgroup.children[c + 1];
  const startX = e.clientX, startW = (headRow.children[c + 1] || {offsetWidth:98}).offsetWidth || 98;
  guide.style.display = 'block';
  guide.style.left = (e.clientX - rect.left + gridScroll.scrollLeft) + 'px';
  document.body.style.cursor = 'col-resize';
  function mv(ev){
    const w = Math.max(38, startW + (ev.clientX - startX));
    col.style.width = w + 'px';
    guide.style.left = (ev.clientX - rect.left + gridScroll.scrollLeft) + 'px';
  }
  function up(){
    window.removeEventListener('mousemove', mv);
    window.removeEventListener('mouseup', up);
    guide.style.display = 'none';
    document.body.style.cursor = '';
  }
  window.addEventListener('mousemove', mv);
  window.addEventListener('mouseup', up);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  const t = e.target;
  const inField = t === formulaInput || t === nameBox || t.tagName === 'INPUT';

  if(t === editor){
    if(e.key === 'Enter'){ e.preventDefault(); commitEdit({dr:1,dc:0}); }
    else if(e.key === 'Tab'){ e.preventDefault(); commitEdit({dr:0,dc:e.shiftKey?-1:1}); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
    return;
  }
  if(t === formulaInput){
    if(e.key === 'Enter'){
      e.preventDefault();
      pushUndo();
      setCellRaw(state.sel.ar, state.sel.ac, formulaInput.value);
      refresh(); markSaved();
      gridScroll.focus();
      moveSel(1,0,false);
    } else if(e.key === 'Escape'){
      e.preventDefault(); updateInfo(); gridScroll.focus();
    }
    return;
  }
  if(t === nameBox){
    if(e.key === 'Enter'){
      e.preventDefault();
      const m = nameBox.value.trim().toUpperCase().match(/^([A-Z]{1,3})([0-9]{1,7})$/);
      if(m){
        const r = Math.min(NR-1, parseInt(m[2],10)-1), c = Math.min(NC-1, colIndex(m[1]));
        setSel(r,c,r,c,r,c); scrollIntoView(r,c);
      }
      gridScroll.focus();
    }
    return;
  }
  if(inField) return;

  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if(mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); doRedo(); return; }
  if(mod && e.key.toLowerCase() === 'b'){ e.preventDefault(); mutateStyle(s=>s.b = s.b?0:1); return; }
  if(mod && e.key.toLowerCase() === 'i'){ e.preventDefault(); mutateStyle(s=>s.i = s.i?0:1); return; }
  if(mod && e.key.toLowerCase() === 'u'){ e.preventDefault(); mutateStyle(s=>s.u = s.u?0:1); return; }
  if(mod && e.key.toLowerCase() === 's'){ e.preventDefault(); downloadCSV(); return; }

  switch(e.key){
    case 'ArrowUp': e.preventDefault(); moveSel(-1,0,e.shiftKey); break;
    case 'ArrowDown': e.preventDefault(); moveSel(1,0,e.shiftKey); break;
    case 'ArrowLeft': e.preventDefault(); moveSel(0,-1,e.shiftKey); break;
    case 'ArrowRight': e.preventDefault(); moveSel(0,1,e.shiftKey); break;
    case 'Tab': e.preventDefault(); moveSel(0, e.shiftKey?-1:1, false); break;
    case 'Enter': e.preventDefault(); startEdit(null, true); break;
    case 'F2': e.preventDefault(); startEdit(null, true); break;
    case 'Delete': case 'Backspace': {
      e.preventDefault(); pushUndo();
      const s = state.sel;
      for(let r=Math.min(s.r1,s.r2); r<=Math.max(s.r1,s.r2); r++)
        for(let c=Math.min(s.c1,s.c2); c<=Math.max(s.c1,s.c2); c++) setCellRaw(r,c,'');
      refresh(); markSaved(); break;
    }
    case 'Escape': setSel(state.sel.ar, state.sel.ac, state.sel.ar, state.sel.ac, state.sel.ar, state.sel.ac); break;
    case 'Home': e.preventDefault(); moveSel(0, -NC, false); break;
    default:
      if(e.key.length === 1 && !mod){
        e.preventDefault();
        startEdit(e.key, true);
      }
  }
});

/* ---------- formula bar wiring ---------- */
formulaInput.addEventListener('focus', ()=>{
  const cell = cur().cells[cellKey(state.sel.ar, state.sel.ac)];
  formulaInput.value = cell && cell.v != null ? cell.v : '';
  $('statNote').textContent = 'Formula bar active — click cells to insert references';
});
formulaInput.addEventListener('blur', ()=>{ $('statNote').textContent = 'Ready — double-click a cell or press F2 to edit'; });
$('fxBtn').addEventListener('click', ()=>{
  const s = state.sel;
  const ref = rangeAddr({r:s.r1,c:s.c1},{r:s.r2,c:s.c2});
  formulaInput.value = '=SUM(' + ref + ')';

});

/* ---------- toolbar ---------- */
const CMD = {
  bold: ()=>mutateStyle(s=>s.b = s.b?0:1),
  italic: ()=>mutateStyle(s=>s.i = s.i?0:1),
  underline: ()=>mutateStyle(s=>s.u = s.u?0:1),
  'size+': ()=>mutateStyle(s=>s.fs = Math.min(28, (s.fs||12) + 1)),
  'size-': ()=>mutateStyle(s=>s.fs = Math.max(8, (s.fs||12) - 1)),
  'align-l': ()=>mutateStyle(s=>s.a = 'l'),
  'align-c': ()=>mutateStyle(s=>s.a = 'c'),
  'align-r': ()=>mutateStyle(s=>s.a = 'r'),
  'fmt-usd': ()=>mutateStyle(s=>s.n = 'usd'),
  'fmt-pct': ()=>mutateStyle(s=>s.n = 'pct'),
  'fmt-d1': ()=>mutateStyle(s=>s.n = 'd1'),
  'fmt-d2': ()=>mutateStyle(s=>s.n = 'd2'),
  'fmt-gen': ()=>mutateStyle(s=>s.n = 'gen'),
  clear: clearContents,
  clearall: ()=>{
    pushUndo();
    const s = state.sel, sheet = cur();
    for(let r=Math.min(s.r1,s.r2); r<=Math.max(s.r1,s.r2); r++)
      for(let c=Math.min(s.c1,s.c2); c<=Math.max(s.c1,s.c2); c++) delete sheet.cells[cellKey(r,c)];
    refresh(); markSaved();
  },
  autosum: ()=>{
    const s = state.sel, r = s.ar, c = s.ac;
    let start = r - 1;
    while(start >= 0 && typeof cellValue(cur(), start, c) === 'number') start--;
    let range;
    if(start < r - 1) range = addr(start + 1, c) + ':' + addr(r - 1, c);
    else {
      let sc = c - 1;
      while(sc >= 0 && typeof cellValue(cur(), r, sc) === 'number') sc--;
      range = sc < c - 1 ? addr(r, sc + 1) + ':' + addr(r, c - 1) : addr(r, c);
    }
    pushUndo();
    setCellRaw(r, c, '=SUM(' + range + ')');
    refresh(); markSaved();
  },
  color: ()=>{
    const col = prompt('Text colour (hex or name):', getStyle(state.sel.ar, state.sel.ac)?.c || '#22251F');
    if(col){ mutateStyle(s=>s.c = col); $('colorSwatch').style.background = col; }
  },
  fill: ()=>{
    const col = prompt('Fill colour (hex or name):', getStyle(state.sel.ar, state.sel.ac)?.bg || '#D9E9E0');
    if(col){ mutateStyle(s=>s.bg = col); $('fillSwatch').style.background = col; }
  },
  neg: ()=>mutateStyle(s=>s.c = s.c ? '' : '#C0392B')
};
function clearContents(){
  pushUndo();
  const s = state.sel, sheet = cur();
  for(let r=Math.min(s.r1,s.r2); r<=Math.max(s.r1,s.r2); r++)
    for(let c=Math.min(s.c1,s.c2); c<=Math.max(s.c1,s.c2); c++) setCellRaw(r,c,'');
  refresh(); markSaved();
}
const cmdButtons = Array.from(document.querySelectorAll('[data-cmd]'));
for(const btn of cmdButtons){
  btn.addEventListener('click', ()=>{
    const cmd = btn.dataset.cmd;
    if(cmd === 'color' || cmd === 'fill'){ openPalette(btn, cmd); return; }
    const fn = CMD[cmd];
    if(fn) fn();
    syncToolbar();
  });
}

/* ---------- colour palette ---------- */
const PALETTE = [
  '#22251F','#6B6E64','#B4B2A7','#FFFFFF','#F3F1EC','#EDE0A8',
  '#1F6B4A','#2E8B62','#0F3F2C','#D9E9E0','#EAF2ED','#5B7C99',
  '#C0392B','#E0705F','#F6E7D8','#8A6D3B','#2F4858','#B8C6D0'
];
let palMode = 'fill';
const palette = $('palette');
(function buildPalette(){
  const grid = $('palGrid');
  PALETTE.forEach(col=>{
    const b = document.createElement('button');
    b.className = 'pal-sw';
    b.style.background = col;
    b.title = col;
    b.addEventListener('mousedown', e=>e.preventDefault());

    else { mutateStyle(s=>s.bg = ''); $('fillSwatch').style.background = '#D9E9E0'; }

  });
})();
function openPalette(btn, mode){
  palMode = mode;
  $('palTitle').textContent = mode === 'color' ? 'Text colour' : 'Fill colour';
  const r = btn.getBoundingClientRect();

}
function closePalette(){ palette.hidden = true; }
document.addEventListener('mousedown', e=>{
  if(palette.hidden) return;
  if(!palette.contains(e.target) && !e.target.closest('[data-cmd="color"],[data-cmd="fill"]')) closePalette();

function syncToolbar(){
  const st = getStyle(state.sel.ar, state.sel.ac) || {};
  const map = {bold:!!st.b, italic:!!st.i, underline:!!st.u, 'align-l':st.a==='l', 'align-c':st.a==='c', 'align-r':st.a==='r',
    'fmt-usd':st.n==='usd', 'fmt-pct':st.n==='pct', 'fmt-d1':st.n==='d1', 'fmt-d2':st.n==='d2', 'fmt-gen':st.n==='gen'};
  for(const b of cmdButtons) b.classList.toggle('on', !!map[b.dataset.cmd]);
  if(st.c) $('colorSwatch').style.background = st.c;
  if(st.bg) $('fillSwatch').style.background = st.bg;
}

$('btnUndo').addEventListener('click', doUndo);
$('btnRedo').addEventListener('click', doRedo);

/* ---------- CSV ---------- */
function csvEscape(v){
  v = v == null ? '' : String(v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
function downloadCSV(){
  const sheet = cur();
  let maxR = 0, maxC = 0;
  for(const k in sheet.cells){
    if(sheet.cells[k].v === '' || sheet.cells[k].v == null) continue;
    const [r,c] = k.split(',').map(Number);
    maxR = Math.max(maxR, r); maxC = Math.max(maxC, c);
  }
  const lines = [];
  for(let r=0;r<=maxR;r++){
    const row = [];
    for(let c=0;c<=maxC;c++){
      const cell = sheet.cells[cellKey(r,c)];
      const d = fmtValue(cellValue(sheet,r,c), cell && cell.s);
      row.push(csvEscape(d.text));
    }
    lines.push(row.join(','));
  }
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = sheet.name.replace(/[^\w\- ]+/g,'') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  $('statNote').textContent = 'Exported ' + sheet.name + '.csv';
}
function parseCSV(text){
  const rows = []; let row = [], field = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ','){ row.push(field); field = ''; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(ch === '\r'){ /* skip */ }
      else field += ch;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
$('btnDownload').addEventListener('click', downloadCSV);
$('btnUpload').addEventListener('click', ()=>$('fileInput').click());
$('fileInput').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    pushUndo();
    const rows = parseCSV(String(reader.result));
    const sheet = cur();
    sheet.cells = {};
    rows.forEach((row,r)=>{
      if(r >= NR) return;
      row.forEach((val,c)=>{
        if(c >= NC) return;
        if(val !== '') sheet.cells[cellKey(r,c)] = {v:val};
      });
    });
    refresh(); markSaved();
    $('statNote').textContent = 'Imported ' + f.name + ' — ' + rows.length + ' rows';
    setSel(0,0,0,0,0,0);
  };
  reader.readAsText(f);
  e.target.value = '';
});

/* ---------- sheets ---------- */
function renderTabs(){
  const wrap = $('sheetTabs');
  wrap.innerHTML = '';
  state.sheets.forEach((sh, i)=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === state.active ? ' active' : '');
    const label = document.createElement('span');
    label.textContent = sh.name;
    tab.appendChild(label);
    if(state.sheets.length > 1){
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '✕'; x.title = 'Delete sheet';
      x.addEventListener('click', ev=>{
        ev.stopPropagation();
        if(confirm('Delete sheet "' + sh.name + '" and all its data?')){
          state.sheets.splice(i,1);
          state.active = Math.max(0, Math.min(state.active, state.sheets.length - 1));
          renderTabs(); switchSheet();
        }
      });
      tab.appendChild(x);
    }
    tab.addEventListener('click', ()=>{
      if(i === state.active) return;
      state.active = i; renderTabs(); switchSheet();
    });
    tab.addEventListener('dblclick', ()=>{
      const input = document.createElement('input');
      input.value = sh.name;
      tab.replaceChildren(input);
      input.focus(); input.select();
      const commit = ()=>{
        const v = input.value.trim();
        if(v) sh.name = v.slice(0,24);
        renderTabs();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev=>{
        ev.stopPropagation();
        if(ev.key === 'Enter') commit();
        if(ev.key === 'Escape') renderTabs();
      });
    });
    wrap.appendChild(tab);
  });
}
$('addSheet').addEventListener('click', ()=>{
  const n = state.sheets.length + 1;
  state.sheets.push(newSheet('Sheet' + n));
  state.active = state.sheets.length - 1;
  renderTabs(); switchSheet();
});
function switchSheet(){
  recalcAll(cur());
  for(const row of cellEl) for(const el of row){ el._d = null; setBase(el, 'cell'); setSelCls(el, ''); applyStyle(el, null); el.style.textAlign = ''; }
  selEls = [];
  cur().painted = new Set();
  repaintAll();
  setSel(0,0,0,0,0,0);
  gridScroll.scrollTop = 0; gridScroll.scrollLeft = 0;
  $('bookName').textContent = 'Book1.xlsx — ' + cur().name.toLowerCase();
}

/* ---------- boot ---------- */
buildGrid();
seed();
renderTabs();
recalcAll(cur());
repaintAll();
