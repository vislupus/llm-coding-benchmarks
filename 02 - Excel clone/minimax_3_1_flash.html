    const w = measureText(txt, cell.style.bold, cell.style.italic) + 14;
    if (w > max) max = w;
  }
  sheet.colW.set(c, clamp(Math.round(max), 30, 400));
  invalidateMetrics();
  scheduleRender();
}

/* ---- row headers ---- */
function onRowHeaderDown(e){
  const idx = Array.from(rowEls.entries()).find(([, n]) => n === e.currentTarget);
  const row = idx ? idx[0] : 0;
  if (e.target.classList.contains('grip')){
    e.preventDefault();
    state.drag = { type:'rowresize', row };
    return;
  }
  const sheet = activeSheet();
  state.selAnchor = { r:row, c:0 };
  setSelection({ r1:row, c1:0, r2:row, c2:MAX_COLS - 1 }, { r:row, c:sheet.cursor.c });
  state.drag = { type:'selectrows', anchor:row };
  e.preventDefault();
}
function onRowHeaderDblClick(e){
  if (e.target.classList.contains('grip')){
    const idx = Array.from(rowEls.entries()).find(([, n]) => n === e.currentTarget);
    if (idx) autoFitRow(idx[0]);
  }
}
function onDocMouseMoveRow(e){
  const d = state.drag;
  if (d && d.type === 'selectrows'){
    const y = e.clientY - dom.rowStrip.getBoundingClientRect().top + dom.scroller.scrollTop;
    const row = rowAt(y);
    const sheet = activeSheet();
    setSelection({ r1:Math.min(d.anchor, row), c1:0, r2:Math.max(d.anchor, row), c2:MAX_COLS - 1 },
                 { r:sheet.cursor.r, c:sheet.cursor.c });
  }
}
function autoFitRow(r){
  const sheet = activeSheet();
  let max = 16;
  for (const [k, cell] of sheet.cells){
    if (keyRow(k) !== r) continue;
    const w = measureText(formatValue(cell.value), cell.style.bold, cell.style.italic);
    if (w > max) max = w;
  }
  sheet.rowH.set(r, clamp(Math.round(max) + 8, 16, 200));
  invalidateMetrics();
  scheduleRender();
}

document.addEventListener('keydown', onGlobalKeyDown);
function onGlobalKeyDown(e){
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const sheet = activeSheet();
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key.toLowerCase() === 'c'){ e.preventDefault(); copySelection(false); return; }
  if (mod && e.key.toLowerCase() === 'x'){ e.preventDefault(); copySelection(true); return; }
  if (mod && e.key.toLowerCase() === 'v'){ /* handled by paste event */ return; }
  if (mod && e.key.toLowerCase() === 'a'){
    e.preventDefault();
    const used = usedRange(sheet);
    setSelection(used, sheet.cursor);
    return;
  }
  if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if (mod && ((e.key.toLowerCase() === 'y') || (e.key.toLowerCase() === 'z' && e.shiftKey))){
    e.preventDefault(); redo(); return;
  }
  if (mod && e.key.toLowerCase() === 'b'){ e.preventDefault(); toggleStyle('bold'); return; }
  if (mod && e.key.toLowerCase() === 'i'){ e.preventDefault(); toggleStyle('italic'); return; }
  if (mod && e.key.toLowerCase() === 'u'){ e.preventDefault(); toggleStyle('underline'); return; }
  if (mod && e.key === 'Home'){ e.preventDefault(); moveCursor(-sheet.cursor.r, -sheet.cursor.c, false); return; }

  switch (e.key){
    case 'ArrowUp':    e.preventDefault(); moveCursor(-1, 0, e.shiftKey); return;
    case 'ArrowDown':  e.preventDefault(); moveCursor(1, 0, e.shiftKey); return;
    case 'ArrowLeft':  e.preventDefault(); moveCursor(0, -1, e.shiftKey); return;
    case 'ArrowRight': e.preventDefault(); moveCursor(0, 1, e.shiftKey); return;
    case 'Tab':        e.preventDefault(); moveCursor(0, e.shiftKey ? -1 : 1, false); return;
    case 'Enter':      e.preventDefault(); moveCursor(e.shiftKey ? -1 : 1, 0, false); return;
    case 'Home':       e.preventDefault(); moveCursor(0, -sheet.cursor.c, e.shiftKey); return;
    case 'PageDown':   e.preventDefault(); moveCursor(Math.floor(dom.scroller.clientHeight / 22) || 1, 0, e.shiftKey); return;
    case 'PageUp':     e.preventDefault(); moveCursor(-(Math.floor(dom.scroller.clientHeight / 22) || 1), 0, e.shiftKey); return;
    case 'F2':         e.preventDefault(); startCellEdit(undefined, false); return;
    case 'Delete': case 'Backspace':
      e.preventDefault(); clearContents(); return;
    case 'Escape':
      state.preview = null; state.clip = null; scheduleRender(); return;
  }
  if (!mod && !e.altKey && e.key.length === 1){
    e.preventDefault();
    startCellEdit(e.key, true);
  }
}

/* ---- undo / redo ---- */
const undoStack = [];
const redoStack = [];
let undoRec = null;

function captureCell(sheet, r, c){
  if (!undoRec) return;
  const k = cellKey(r, c);
  for (const it of undoRec.items) if (it.k === k) return;
  const cell = sheet.cells.get(k);
  undoRec.items.push({
    k,
    before: { raw: cell ? cell.raw : '', style: cell ? Object.assign({}, cell.style) : defaultStyle() }
  });
}
function withUndo(fn){
  const prev = undoRec;
  undoRec = { sheetIndex: state.active, items: [] };
  let out;
  try { out = fn(); }
  finally {
    const rec = undoRec;
    undoRec = prev;
    if (rec && rec.items.length){
      const sheet = state.sheets[rec.sheetIndex];
      for (const item of rec.items){
        const cell = sheet ? sheet.cells.get(item.k) : null;
        item.after = {
          raw: cell ? cell.raw : '',
          style: cell ? Object.assign({}, cell.style) : defaultStyle()
        };
      }
      undoStack.push(rec);
      redoStack.length = 0;
    }
  }
  return out;
}
function applyRecord(rec, which){
  const sheet = state.sheets[rec.sheetIndex] || state.sheets[state.active];
  const changed = new Set();
  const prevRec = undoRec;
  undoRec = null;
  for (const item of rec.items){
    const r = keyRow(item.k), c = keyCol(item.k);
    const src = item[which];
    const cell = getCell(sheet, r, c, true);
    cell.style = Object.assign(defaultStyle(), src.style);
    setCellRaw(sheet, r, c, src.raw);
    changed.add(item.k);
  }
  undoRec = prevRec;
  const touched = recalcFrom(sheet, changed);
  const aff = affectedInSheet(touched, sheet);
  for (const k of aff) refreshCell(keyRow(k), keyCol(k));
  for (const item of rec.items) refreshCell(keyRow(item.k), keyCol(item.k));
  scheduleRender();
}
function undo(){
  const rec = undoStack.pop();
  if (!rec){ toast('Nothing to undo'); return; }
  redoStack.push(rec);
  applyRecord(rec, 'before');
  syncFormulaBar();
}
function redo(){
  const rec = redoStack.pop();
  if (!rec){ toast('Nothing to redo'); return; }
  undoStack.push(rec);
  applyRecord(rec, 'after');
  syncFormulaBar();
}
function usedRange(sheet){
  let r1 = Infinity, c1 = Infinity, r2 = -1, c2 = -1;
  for (const k of sheet.cells.keys()){
    const r = keyRow(k), c = keyCol(k);
    if (r < r1) r1 = r;
    if (c < c1) c1 = c;
    if (r > r2) r2 = r;
    if (c > c2) c2 = c;
  }
  if (r2 < 0) return { r1:0, c1:0, r2:0, c2:0 };
  return { r1, c1, r2, c2 };
}

function eachSelected(fn){
  const sheet = activeSheet();
  const s = sheet.sel;
  for (let r = s.r1; r <= s.r2; r++)
    for (let c = s.c1; c <= s.c2; c++)
      fn(r, c, getCell(sheet, r, c, true), sheet);
}

function clearContents(){
  const sheet = activeSheet();
  const s = sheet.sel;
  const changed = new Set();
  withUndo(() => {
  for (let r = s.r1; r <= s.r2; r++){
    for (let c = s.c1; c <= s.c2; c++){
      const k = cellKey(r, c);
      const cell = sheet.cells.get(k);
      if (!cell) continue;
      captureCell(sheet, r, c);
      cell.raw = ''; cell.ast = null; cell.value = null;
      updateDeps(sheet, r, c, null);
      changed.add(k);
    }
  }
  const touched = recalcFrom(sheet, changed);
  const affected = affectedInSheet(touched, sheet);
  for (const k of affected) refreshCell(keyRow(k), keyCol(k));
  });
  for (let r = s.r1; r <= s.r2; r++) for (let c = s.c1; c <= s.c2; c++) refreshCell(r, c);
  syncFormulaBar();
  scheduleRender();
}

function toggleStyle(prop){
  withUndo(() => toggleStyleInner(prop));
}
function toggleStyleInner(prop){
  const sheet = activeSheet();
  const s = sheet.sel;
  let all = true, any = false;
  for (let r = s.r1; r <= s.r2; r++){
    for (let c = s.c1; c <= s.c2; c++){
      const cell = sheet.cells.get(cellKey(r, c));
      const on = !!(cell && cell.style[prop]);
      if (on) any = true; else all = false;
    }
  }
  const value = all && any ? false : true;
  for (let r = s.r1; r <= s.r2; r++){
    for (let c = s.c1; c <= s.c2; c++){
      const cell = getCell(sheet, r, c, true);
      captureCell(sheet, r, c);
      cell.style[prop] = value;
      refreshCell(r, c);
    }
  }
  updateToolbarState();
  scheduleRender();
}
function setStyleProp(prop, value){
  withUndo(() => setStylePropInner(prop, value));
  if (prop === 'bg') el('fillSwatch').style.background = value || 'transparent';
  if (prop === 'fg') el('fontSwatch').style.background = value || '#c62828';
}
function setStylePropInner(prop, value){
  const sheet = activeSheet();
  const s = sheet.sel;
  for (let r = s.r1; r <= s.r2; r++){
    for (let c = s.c1; c <= s.c2; c++){
      const cell = getCell(sheet, r, c, true);
      captureCell(sheet, r, c);
      cell.style[prop] = value;
      refreshCell(r, c);
    }
  }
  updateToolbarState();
  scheduleRender();
}
function updateToolbarState(){
  const sheet = activeSheet();
  const cell = sheet.cells.get(cellKey(sheet.cursor.r, sheet.cursor.c));
  const st = cell ? cell.style : null;
  const on = p => !!(st && st[p]);
  el('btnBold').classList.toggle('on', on('bold'));
  el('btnItalic').classList.toggle('on', on('italic'));
  el('btnUnderline').classList.toggle('on', on('underline'));
  el('btnAlignLeft').classList.toggle('on', (st && st.align) === 'left');
  el('btnAlignCenter').classList.toggle('on', (st && st.align) === 'center');
  el('btnAlignRight').classList.toggle('on', (st && st.align) === 'right');
}

/* ---- auto sum ---- */
function autoSum(){
  withUndo(() => autoSumInner());
}
function autoSumInner(){
  const sheet = activeSheet();
  const s = sheet.sel;
  let r1 = s.r1, c1 = s.c1, r2 = s.r2, c2 = s.c2;
  if (r2 > r1 && c2 === c1){ /* column range: sum below */ }
  else if (c2 > c1 && r2 === r1){ /* row range: sum to the right */ }
  else { r2 = r1; c2 = c1; }
  const targetR = r2 + 1, targetC = c2 + 1;
  if (targetR >= MAX_ROWS || targetC >= MAX_COLS) return;
  let formula;
  if (c2 > c1 && r2 === r1) formula = '=SUM(' + addr(r1, c1) + ':' + addr(r2, c2) + ')';
  else formula = '=SUM(' + addr(r1, c1) + ':' + addr(r2, c2) + ')';
  setCellRaw(sheet, targetR, targetC, formula);
  refreshCell(targetR, targetC);
  setSelection({ r1:targetR, c1:targetC, r2:targetR, c2:targetC }, { r:targetR, c:targetC });
}

/* ==================== clipboard ======================================= */
/** Perform many writes and recalculate only once at the end */
function bulkEdit(sheet, fn){
  const prevChanged = bulkChanged;
  bulkChanged = new Set();
  bulkMode = true;
  try { fn(); }
  finally {
    bulkMode = false;
    const changed = bulkChanged;
    bulkChanged = prevChanged;
    const touched = recalcFrom(sheet, changed);
    const affected = affectedInSheet(touched, sheet);
    for (const k of affected) refreshCell(keyRow(k), keyCol(k));
  }
}
function translateFormula(src, dr, dc){
  return src.replace(/(\$?)([A-Za-z]{1,3})(\$?)(\d{1,7})/g, (m, d1, col, d2, row) => {
    let c = colIndex(col), r = parseInt(row, 10) - 1;
    if (!d1) c += dc;
    if (!d2) r += dr;
    if (c < 0 || c >= MAX_COLS || r < 0 || r >= MAX_ROWS) return '#REF!';
    return (d1 || '') + colName(c) + (d2 || '') + (r + 1);
  });
}
function copySelection(cut){
  const sheet = activeSheet();
  const s = sheet.sel;
  const rows = [];
  for (let r = s.r1; r <= s.r2; r++){
    const row = [];
    for (let c = s.c1; c <= s.c2; c++){
      const cell = sheet.cells.get(cellKey(r, c));
      row.push(cell ? { raw: cell.raw, style: Object.assign({}, cell.style) } : null);
    }
    rows.push(row);
  }
  state.clip = { rows, r1:s.r1, c1:s.c1, cut:!!cut };
  toast((cut ? 'Cut ' : 'Copied ') + rows.length + ' × ' + rows[0].length + ' cell' +
        (rows[0].length === 1 ? '' : 's'));
}
function pasteClip(){
  const clip = state.clip;
  if (!clip) return;
  withUndo(() => pasteClipInner(clip));
}
function pasteClipInner(clip){
  const sheet = activeSheet();
  const t = sheet.cursor;
  const dr = t.r - clip.r1, dc = t.c - clip.c1;
  const touched = new Set();
  bulkEdit(sheet, () => {
  for (let i = 0; i < clip.rows.length; i++){
    for (let j = 0; j < clip.rows[i].length; j++){
      const src = clip.rows[i][j];
      const r = t.r + i, c = t.c + j;
      if (r >= MAX_ROWS || c >= MAX_COLS) continue;
      let raw = '';
      if (src){
        raw = src.raw;
        if (raw.charAt(0) === '=' && (dr || dc)) raw = '=' + translateFormula(raw.slice(1), dr, dc);
        const cell = getCell(sheet, r, c, true);
        cell.style = Object.assign({}, src.style);
      }
      const res = setCellRaw(sheet, r, c, raw);
      for (const k of res.affected) touched.add(k);
      touched.add(cellKey(r, c));
    }
  }
  if (clip.cut){
    const changed = new Set();
    for (let i = 0; i < clip.rows.length; i++){
      for (let j = 0; j < clip.rows[i].length; j++){
        const r = clip.r1 + i, c = clip.c1 + j;
        if (r >= MAX_ROWS || c >= MAX_COLS) continue;
        const cell = sheet.cells.get(cellKey(r, c));
        if (!cell) continue;
        cell.raw = ''; cell.ast = null; cell.value = null;
        updateDeps(sheet, r, c, null);
        changed.add(cellKey(r, c));
      }
    }
    for (const k of changed) touched.add(k);
    state.clip = null;
  }
  });
  for (const k of touched) refreshCell(keyRow(k), keyCol(k));
  setSelection({ r1:t.r, c1:t.c, r2:t.r + clip.rows.length - 1, c2:t.c + clip.rows[0].length - 1 }, t);
  scheduleRender();
}

function parseDelimited(text, sep){
  const rows = [];
  let row = [], field = '', i = 0, inQ = false;
  while (i < text.length){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){
        if (text[i + 1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"'){ inQ = true; i++; continue; }
    if (ch === sep){ row.push(field); field = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += ch; i++;
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
document.addEventListener('paste', e => {
  if (state.editing) return;                       // let the active editor paste natively
  const cd = e.clipboardData;
  if (!cd) return;
  const text = cd.getData('text/plain');
  if (!text) return;
  e.preventDefault();
  if (state.clip){ pasteClip(); return; }
  const rows = parseDelimited(text, '\t');
  if (!rows.length) return;
  withUndo(() => pasteTextRows(rows));
});
function pasteTextRows(rows){
  const sheet = activeSheet();
  const t = sheet.cursor;
  const touched = new Set();
  bulkEdit(sheet, () => {
    rows.forEach((row, i) => {
      row.forEach((val, j) => {
        const r = t.r + i, c = t.c + j;
        if (r >= MAX_ROWS || c >= MAX_COLS) return;
        setCellRaw(sheet, r, c, val);
        touched.add(cellKey(r, c));
      });
    });
  });
  for (const k of touched) refreshCell(keyRow(k), keyCol(k));
  setSelection({ r1:t.r, c1:t.c, r2:t.r + rows.length - 1, c2:t.c + Math.max(...rows.map(r => r.length)) - 1 }, t);
  scheduleRender();
}

/* ==================== CSV import / export =========================== */
function sheetToCSV(sheet){
  const used = usedRange(sheet);
  const lines = [];
  for (let r = used.r1; r <= used.r2; r++){
    const out = [];
    for (let c = used.c1; c <= used.c2; c++){
      const cell = sheet.cells.get(cellKey(r, c));
      let v = cell ? formatValue(cell.value) : '';
      if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
      out.push(v);
    }
    lines.push(out.join(','));
  }
  return lines.join('\r\n');
}
function downloadCSV(){
  const sheet = activeSheet();
  const csv = sheetToCSV(sheet);
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (sheet.name || 'sheet').replace(/[^\w\-. ]+/g, '_') + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Downloaded ' + a.download);
}
function importCSVText(text){
  withUndo(() => importCSVTextInner(text));
}
function importCSVTextInner(text){
  const rows = parseDelimited(text, ',');
  if (!rows.length){ toast('That file looked empty'); return; }
  const sheet = activeSheet();
  // replace the active sheet's content
  bulkEdit(sheet, () => {
    for (const k of Array.from(sheet.cells.keys())){
      const cell = sheet.cells.get(k);
      captureCell(sheet, keyRow(k), keyCol(k));
      cell.raw = ''; cell.ast = null; cell.value = null;
      updateDeps(sheet, keyRow(k), keyCol(k), null);
    }
    rows.forEach((row, i) => {
      row.forEach((val, j) => {
        if (i >= MAX_ROWS || j >= MAX_COLS) return;
        setCellRaw(sheet, i, j, val);
      });
    });
  });
  for (let r = 0; r < Math.min(rows.length, 60); r++)
    for (let c = 0; c < Math.min(20, MAX_COLS); c++) refreshCell(r, c);
  setSelection({ r1:0, c1:0, r2:0, c2:0 }, { r:0, c:0 });
  scheduleRender();
  toast('Imported ' + rows.length + ' row' + (rows.length === 1 ? '' : 's') + ' into ' + sheet.name);
}
el('fileInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importCSVText(String(reader.result || ''));
  reader.onerror = () => toast('Could not read that file');
  reader.readAsText(file);
  e.target.value = '';
});

/* ==================== sheets ========================================= */
function renderTabs(){
  dom.tabs.innerHTML = '';
  state.sheets.forEach((sh, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === state.active ? ' active' : '');
    b.dataset.index = String(i);
    const label = document.createElement('span');
    label.className = 'tab-label';
    label.textContent = sh.name;
    b.appendChild(label);
    if (i === state.active){
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '×';
      x.title = 'Delete sheet';
      x.addEventListener('click', ev => { ev.stopPropagation(); deleteSheet(i); });
      b.appendChild(x);
    }
    b.addEventListener('click', () => switchSheet(i));
    b.addEventListener('dblclick', () => startRename(i));
    b.addEventListener('contextmenu', ev => { ev.preventDefault(); openSheetMenu(i, ev); });
    dom.tabs.appendChild(b);
  });
  el('sheetTitleLabel').textContent = state.sheets[state.active].name;
}
function switchSheet(i){
  if (i < 0 || i >= state.sheets.length) return;
  if (state.editing) commitEdit(false);
  state.active = i;
  state.clip = null;
  state.preview = null;
  M = null;
  for (const [, n] of cellEls) n.remove();
  cellEls.clear();
  for (const [, n] of colEls) n.remove();
  colEls.clear();
  for (const [, n] of rowEls) n.remove();
  rowEls.clear();
  dom.scroller.scrollLeft = 0;
  dom.scroller.scrollTop = 0;
  dom.colInner.style.transform = 'translateX(0px)';
  dom.rowInner.style.transform = 'translateY(0px)';
  renderTabs();
  syncFormulaBar();
  renderViewport();
}
function addSheet(){
  let n = state.sheets.length + 1;
  const names = new Set(state.sheets.map(s => s.name));
  while (names.has('Sheet' + n)) n++;
  const sheet = makeSheet('Sheet' + n);
  state.sheets.push(sheet);
  switchSheet(state.sheets.length - 1);
  toast('Added ' + sheet.name);
}
function startRename(i){
  const tab = dom.tabs.children[i];
  if (!tab) return;
  const label = tab.querySelector('.tab-label');
  if (!label) return;
  const input = document.createElement('input');
  input.className = 'tab-rename';
  input.value = state.sheets[i].name;
  label.replaceWith(input);
  input.focus();
  input.select();
  const finish = ok => {
    const name = input.value.trim();
    if (ok && name){
      state.sheets[i].name = name;
      el('sheetTitleLabel').textContent = name;
    }
    renderTabs();
  };
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}
function deleteSheet(i){
  if (state.sheets.length <= 1){ toast('A workbook needs at least one sheet'); return; }
  const name = state.sheets[i].name;
  state.sheets.splice(i, 1);
  if (state.active >= state.sheets.length) state.active = state.sheets.length - 1;
  switchSheet(state.active);
  toast('Deleted ' + name);
}
function duplicateSheet(i){
  const src = state.sheets[i];
  const copy = makeSheet(src.name + ' copy');
  copy.cells = new Map();
  for (const [k, cell] of src.cells){
    copy.cells.set(k, { raw:cell.raw, ast:cell.ast, value:cell.value, style:Object.assign({}, cell.style) });
  }
  copy.colW = new Map(src.colW);
  copy.rowH = new Map(src.rowH);
  for (const [k, ast] of copy.cells) updateDeps(copy, keyRow(k), keyCol(k), ast);
  state.sheets.splice(i + 1, 0, copy);
  switchSheet(i + 1);
}

/* ---- sheet context menu ---- */
const sheetMenu = el('sheetMenu');
let menuSheetIndex = -1;
function openSheetMenu(i, e){
  menuSheetIndex = i;
  sheetMenu.classList.add('open');
  const w = 190, h = 130;
  sheetMenu.style.left = Math.min(e.clientX, window.innerWidth - w - 8) + 'px';
  sheetMenu.style.top = Math.min(e.clientY, window.innerHeight - h - 8) + 'px';
}
sheetMenu.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  sheetMenu.classList.remove('open');
  const i = menuSheetIndex;
  if (act === 'rename') startRename(i);
  else if (act === 'duplicate') duplicateSheet(i);
  else if (act === 'delete') deleteSheet(i);
});
document.addEventListener('mousedown', e => {
  if (!sheetMenu.contains(e.target)) sheetMenu.classList.remove('open');
});

/* ==================== colour popovers ================================ */
const PALETTE = [
  '#ffffff','#000000','#e7e6e6','#44546a','#4472c4','#ed7d31','#a5a5a5','#ffc000','#5b9bd5','#70ad47',
  '#f8f8f8','#d9d9d9','#b4c6e7','#ffd966','#c6e0b4','#f4b084','#a9d18e','#dbe5f1','#e2efda','#fff2cc',
  '#fce4d6','#f4cccc','#d9e1f2','#e4dfec','#daeef3','#fff2cc','#f8cbad','#e2f0d9','#fce4d6','#ddebf7',
  '#c00000','#ff0000','#ffc000','#ffff00','#92d050','#00b050','#00b0f0','#0070c0','#002060','#7030a0'
];
function buildPalette(container){
  container.innerHTML = '';
  PALETTE.forEach(col => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = col;
    sw.title = col;
    sw.dataset.color = col;
    container.appendChild(sw);
  });
}
buildPalette(el('fillPalette'));
buildPalette(el('fontPalette'));

function openPopover(pop, anchor){
  closePopovers();
  const r = anchor.getBoundingClientRect();
  pop.classList.add('open');
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = clamp(r.left, 8, window.innerWidth - pw - 8) + 'px';
  pop.style.top = clamp(r.bottom + 4, 8, window.innerHeight - ph - 8) + 'px';
}
function closePopovers(){
  el('fillPopover').classList.remove('open');
  el('fontPopover').classList.remove('open');
}
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.popover') && !e.target.closest('#btnFill') && !e.target.closest('#btnFontColor'))
    closePopovers();
});
el('fillPopover').addEventListener('click', e => {
  const sw = e.target.closest('.swatch, .sw-none');
  if (!sw) return;
  setStyleProp('bg', sw.dataset.color || null);
  closePopovers();
});
el('fontPopover').addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  setStyleProp('fg', sw.dataset.color || null);
  closePopovers();
});

/* ==================== toast ========================================== */
let toastTimer = null;
function toast(msg){
  const t = dom.toast;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ==================== wiring ========================================= */
function wire(){
  el('btnUndo').addEventListener('click', undo);
  el('btnRedo').addEventListener('click', redo);
  el('btnBold').addEventListener('click', () => toggleStyle('bold'));
  el('btnItalic').addEventListener('click', () => toggleStyle('italic'));
  el('btnUnderline').addEventListener('click', () => toggleStyle('underline'));
  el('btnAlignLeft').addEventListener('click', () => setStyleProp('align', 'left'));
  el('btnAlignCenter').addEventListener('click', () => setStyleProp('align', 'center'));
  el('btnAlignRight').addEventListener('click', () => setStyleProp('align', 'right'));
  el('btnFill').addEventListener('click', e => {
    e.stopPropagation();
    const pop = el('fillPopover');
    if (pop.classList.contains('open')) closePopovers(); else openPopover(pop, el('btnFill'));
  });
  el('btnFontColor').addEventListener('click', e => {
    e.stopPropagation();
    const pop = el('fontPopover');
    if (pop.classList.contains('open')) closePopovers(); else openPopover(pop, el('btnFontColor'));
  });
  el('btnClear').addEventListener('click', clearContents);
  el('btnSum').addEventListener('click', autoSum);
  el('btnCsvDown').addEventListener('click', downloadCSV);
  el('btnCsvUp').addEventListener('click', () => el('fileInput').click());
  el('btnDownloadTitle').addEventListener('click', downloadCSV);
  el('btnUploadTitle').addEventListener('click', () => el('fileInput').click());
  el('btnAddSheet').addEventListener('click', addSheet);
  document.querySelector('.corner').addEventListener('click', () => {
    const sheet = activeSheet();
    const used = usedRange(sheet);
    setSelection(used, sheet.cursor);
  });
  window.addEventListener('resize', scheduleRender);
  dom.scroller.addEventListener('mousedown', () => {
    if (state.editing && state.editing.kind === 'formula' && !isFormulaText(state.editing.el.value))
      commitEdit(false);
  });
}

/* ==================== demo content =================================== */
function seedDemo(){
  const sheet = activeSheet();
  const rows = [
    ['Product',   'Q1', 'Q2', 'Q3', 'Total', 'Average'],
    ['Alpha',     1200, 1450, 1610, null, null],
    ['Beta',       980, 1120, 1250, null, null],
    ['Gamma',     1540, 1610, 1490, null, null],
    ['Delta',      760,  890,  980, null, null],
    ['', '', '', '', null, null]
  ];
  rows.forEach((row, r) => row.forEach((v, c) => {
    if (v !== null && v !== '') setCellRaw(sheet, r, c, String(v));
  }));
  for (let r = 1; r <= 4; r++){
    setCellRaw(sheet, r, 4, '=SUM(B' + (r + 1) + ':D' + (r + 1) + ')');
    setCellRaw(sheet, r, 5, '=AVERAGE(B' + (r + 1) + ':D' + (r + 1) + ')');
  }
  setCellRaw(sheet, 5, 4, '=SUM(E2:E5)');
  setCellRaw(sheet, 5, 5, '=AVERAGE(F2:F5)');
  setCellRaw(sheet, 5, 2, '=MAX(B2:D5)');
  // light formatting
  for (let c = 0; c <= 5; c++){
    const cell = getCell(sheet, 0, c, true);
    cell.style.bold = true;
    cell.style.bg = '#e2efda';
  }
  for (let r = 0; r <= 5; r++){
    const cell = getCell(sheet, r, 0, true);
    cell.style.bold = r === 0;
  }
  for (let r = 1; r <= 5; r++)
    for (let c = 1; c <= 4; c++)
      getCell(sheet, r, c, true).style.align = 'right';
}

/* ==================== boot =========================================== */
function boot(){
  state.sheets = [makeSheet('Sheet1')];
  state.active = 0;
  wire();
  seedDemo();
  renderTabs();
  syncFormulaBar();
  renderViewport();
  setSelection({ r1:0, c1:0, r2:0, c2:0 }, { r:0, c:0 });
  dom.scroller.focus({ preventScroll:true });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
