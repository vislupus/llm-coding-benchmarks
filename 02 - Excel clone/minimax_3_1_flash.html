<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sheetly — Spreadsheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23217346'/%3E%3Cpath d='M9 8h14v16H9z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M9 14h14M9 19h14M16 8v16M21 8v16' stroke='%23fff' stroke-width='1.4' opacity='.8'/%3E%3C/svg%3E" />
<style>
/* ============================ Design tokens ============================ */
:root{
  --green:#217346;
  --green-dark:#1a5c38;
  --title-bg:#1e6b3d;
  --title-bg-2:#175a33;
  --ribbon:#f3f2f1;
  --ribbon-2:#faf9f8;
  --ribbon-line:#e1dfdd;
  --hdr-bg:#f5f5f5;
  --hdr-bg-sel:#e2efda;
  --hdr-line:#d4d4d4;
  --grid-line:#d8d8d8;
  --grid-line-soft:#e4e4e4;
  --text:#242424;
  --muted:#616161;
  --accent:#107c41;
  --accent-soft:rgba(16,124,65,.10);
  --accent-soft-2:rgba(16,124,65,.18);
  --shadow:0 2px 10px rgba(0,0,0,.13);
  --row-hdr-w:48px;
  --col-hdr-h:26px;
  --cell-h:22px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:13px;background:#fff;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
input{font:inherit}

/* ============================ App shell ============================ */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0}

/* ---- Title bar ---- */
.titlebar{
  flex:0 0 auto;height:42px;display:flex;align-items:center;gap:10px;
  padding:0 12px;color:#fff;background:linear-gradient(180deg,var(--title-bg),var(--title-bg-2));
  user-select:none;
}
.logo{width:22px;height:22px;flex:0 0 auto;display:block}
.title-name{
  font-size:13px;font-weight:600;letter-spacing:.2px;opacity:.95;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw;
}
.title-sep{width:1px;height:20px;background:rgba(255,255,255,.28);flex:0 0 auto}
.title-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tbtn{
  height:28px;min-width:28px;padding:0 8px;border:1px solid transparent;border-radius:4px;
  background:transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  font-size:12px;transition:background .12s ease;
}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn:active{background:rgba(0,0,0,.14)}
.tbtn svg{width:16px;height:16px;fill:currentColor}

/* ---- Ribbon / toolbar ---- */
.ribbon{
  flex:0 0 auto;display:flex;align-items:stretch;gap:2px;padding:4px 8px;
  background:linear-gradient(180deg,var(--ribbon-2),var(--ribbon));
  border-bottom:1px solid var(--ribbon-line);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;
}
.rgroup{display:flex;align-items:center;gap:1px;padding:0 6px;position:relative;flex:0 0 auto}
.rgroup+.rgroup::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:1px;background:var(--ribbon-line)}
.rbtn{
  width:30px;height:30px;border:1px solid transparent;border-radius:4px;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  color:#3b3a39;position:relative;transition:background .12s ease,border-color .12s ease;
}
.rbtn:hover{background:#e9e8e6;border-color:#d8d6d4}
.rbtn:active{background:#dcdbd9}
.rbtn.on{background:var(--accent-soft-2);border-color:rgba(16,124,65,.35);color:var(--accent)}
.rbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rbtn .g{font-size:14px;font-weight:700;line-height:1}
.rbtn .g.i{font-style:italic;font-weight:600}
.rbtn .g.u{text-decoration:underline;font-weight:600}
.rbtn .g.sum{font-size:15px;font-weight:600}
.rbtn .swatch{
  position:absolute;left:7px;right:7px;bottom:3px;height:3px;border-radius:2px;
  box-shadow:0 0 0 1px rgba(0,0,0,.18);
}
.rbtn.wide{width:auto;padding:0 9px;gap:6px;font-size:12px}
.rbtn[disabled]{opacity:.4;pointer-events:none}

/* ---- Formula bar ---- */
.fbar{
  flex:0 0 auto;display:flex;align-items:center;gap:0;background:#fff;
  border-bottom:1px solid var(--ribbon-line);padding:4px 8px;
}
.namebox{
  width:118px;flex:0 0 auto;height:26px;border:1px solid var(--ribbon-line);border-right:none;
  border-radius:3px 0 0 3px;display:flex;align-items:center;padding:0 8px;gap:6px;
  background:#fff;font-size:12.5px;color:var(--text);
}
.namebox input{
  border:none;outline:none;width:100%;font:inherit;background:transparent;padding:0;
}
.fx{
  flex:0 0 auto;width:30px;height:26px;border:1px solid var(--ribbon-line);
  display:flex;align-items:center;justify-content:center;font-style:italic;color:var(--muted);
  font-size:12px;
}
.finput-wrap{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.finput{
  flex:1 1 auto;min-width:0;height:26px;border:1px solid var(--ribbon-line);border-left:none;
  border-radius:0 3px 3px 0;padding:0 8px;font-size:13px;outline:none;background:#fff;
  font-family:"Segoe UI",system-ui,sans-serif;
}
.finput:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* ============================ Grid ============================ */
.sheet-area{
  flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:var(--row-hdr-w) minmax(0,1fr);
  grid-template-rows:var(--col-hdr-h) minmax(0,1fr);
  background:#fff;
}
.corner{
  grid-area:1/1;background:var(--hdr-bg);border-right:1px solid var(--hdr-line);
  border-bottom:1px solid var(--hdr-line);display:flex;align-items:center;justify-content:center;
  cursor:default;user-select:none;overflow:hidden;
}
.corner svg{width:13px;height:13px;stroke:#8a8a8a;fill:none;stroke-width:1.4}
.colstrip{grid-area:1/2;overflow:hidden;position:relative;background:var(--hdr-bg);border-bottom:1px solid var(--hdr-line)}
.colstrip-inner{position:absolute;inset:0;will-change:transform}
.colh{
  position:absolute;top:0;height:100%;box-sizing:border-box;
  box-shadow:inset -1px 0 0 var(--hdr-line);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:#4a4a4a;background:var(--hdr-bg);cursor:pointer;user-select:none;
  overflow:hidden;
}
.colh.hl{background:#e8f0e2}
.colh.sel{background:var(--hdr-bg-sel);color:var(--accent);font-weight:600}
.colh:hover:not(.sel){background:#ebebeb}
.colh .grip{
  position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;z-index:3;
}
.rowstrip{grid-area:2/1;overflow:hidden;position:relative;background:var(--hdr-bg);border-right:1px solid var(--hdr-line)}
.rowstrip-inner{position:absolute;inset:0;will-change:transform}
.rowh{
  position:absolute;left:0;width:100%;box-sizing:border-box;
  box-shadow:inset 0 -1px 0 var(--hdr-line);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:#4a4a4a;background:var(--hdr-bg);cursor:pointer;user-select:none;overflow:hidden;
}
.rowh.sel{background:var(--hdr-bg-sel);color:var(--accent);font-weight:600}
.rowh:hover:not(.sel){background:#ebebeb}
.rowh .grip{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:row-resize;z-index:3}

.scroller{grid-area:2/2;overflow:auto;position:relative;background:#fff;outline:none}
.canvas{position:relative;min-width:100%;min-height:100%}
.cell-layer{position:absolute;inset:0}
.cell{
  position:absolute;box-sizing:border-box;overflow:hidden;white-space:pre;
  padding:1px 5px;font-size:13px;line-height:19px;color:var(--text);
  display:flex;align-items:center;
  border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);
  background:#fff;
}
.cell.b{font-weight:700}
.cell.i{font-style:italic}
.cell.u{text-decoration:underline}
.cell.num{justify-content:flex-end}
.cell.txt{justify-content:flex-start}
.cell.err{color:#c62828}
.cell.mid{justify-content:center}
.cell.selbg{background:var(--accent-soft)}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
.sel-fill{position:absolute;background:var(--accent-soft);border:1px solid rgba(16,124,65,.25);box-sizing:border-box}
.active-box{position:absolute;border:2px solid var(--accent);box-sizing:border-box;pointer-events:none}
.point-box{position:absolute;border:1.5px dashed #1a73e8;background:rgba(26,115,232,.10);box-sizing:border-box;pointer-events:none}
.preview-box{position:absolute;border:2px solid #d18b00;background:rgba(209,139,0,.10);box-sizing:border-box;pointer-events:none}

/* in-cell editor */
.editor{
  position:absolute;z-index:6;box-sizing:border-box;border:2px solid var(--accent);
  outline:none;padding:1px 4px;font-size:13px;font-family:inherit;background:#fff;
  box-shadow:0 1px 6px rgba(0,0,0,.18);display:none;
}

/* ============================ Status bar ============================ */
.statusbar{
  flex:0 0 auto;height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;
  border-top:1px solid var(--ribbon-line);background:var(--ribbon-2);
  font-size:11.5px;color:var(--muted);user-select:none;
}
.status-right{margin-left:auto;display:flex;gap:16px}
.stat b{color:var(--text);font-weight:600}
.zoom{display:flex;align-items:center;gap:6px}
.zoom input{width:90px}

/* ============================ Sheet tabs ============================ */
.tabbar{
  flex:0 0 auto;height:32px;display:flex;align-items:stretch;gap:0;
  border-top:1px solid var(--ribbon-line);background:var(--ribbon);padding-left:4px;
}
.tabs{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin;flex:1 1 auto}
.tab{
  display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;
  border:none;background:transparent;cursor:pointer;font-size:12.5px;color:var(--muted);
  border-right:1px solid var(--ribbon-line);white-space:nowrap;position:relative;
}
.tab:hover{background:#eae9e7}
.tab.active{background:#fff;color:var(--accent);font-weight:600}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab .x{width:15px;height:15px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#9a9a9a;cursor:pointer}
.tab .x:hover{background:#d8d7d5;color:#333}
.tab-rename{
  font-size:12.5px;border:1px solid var(--accent);border-radius:2px;padding:1px 4px;outline:none;
  width:120px;font-family:inherit;
}
.addtab{
  width:32px;flex:0 0 auto;border:none;background:transparent;cursor:pointer;font-size:17px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.addtab:hover{background:#eae9e7;color:var(--accent)}

/* ============================ Popover ============================ */
.popover{
  position:fixed;z-index:50;background:#fff;border:1px solid var(--ribbon-line);
  border-radius:6px;box-shadow:var(--shadow);padding:10px;display:none;
}
.popover.open{display:block}
.swatch-grid{display:grid;grid-template-columns:repeat(10,22px);gap:4px}
.swatch{
  width:22px;height:22px;border-radius:3px;cursor:pointer;border:1px solid rgba(0,0,0,.12);
}
.swatch:hover{outline:2px solid var(--accent);outline-offset:1px}
.sw-none{width:100%;height:26px;border:1px dashed var(--ribbon-line);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.sw-none:hover{background:#f3f2f1}
.pop-label{font-size:11px;color:var(--muted);margin:2px 0 6px;text-transform:uppercase;letter-spacing:.4px}

/* context menu */
.ctxmenu{
  position:fixed;z-index:60;min-width:170px;background:#fff;border:1px solid var(--ribbon-line);
  border-radius:6px;box-shadow:var(--shadow);padding:5px;display:none;
}
.ctxmenu.open{display:block}
.ctxmenu button{
  display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 10px;
  border-radius:4px;cursor:pointer;font-size:12.5px;
}
.ctxmenu button:hover{background:#eae9e7}
.ctxmenu .sep{height:1px;background:var(--ribbon-line);margin:4px 6px}
.ctxmenu button.danger:hover{background:#fdecea;color:#c62828}

/* toast */
.toast{
  position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(8px);
  background:#323130;color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:70;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* responsive */
@media (max-width:720px){
  :root{--row-hdr-w:40px}
  .namebox{width:86px}
  .title-name{max-width:24vw}
  .status-right{display:none}
}
@media (max-width:520px){
  .rgroup{padding:0 3px}
  .fbar{padding:4px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Title bar -->
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="rgba(255,255,255,.16)"/>
      <path d="M8 7.5h16v17H8z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M8 13h16M8 19h16M16 7.5v17M21 7.5v17" stroke="#fff" stroke-width="1.2" opacity=".75"/>
    </svg>
    <span class="title-name" id="bookTitle">Untitled workbook</span>
    <span class="title-sep"></span>
    <span class="title-name" id="sheetTitleLabel">Sheet1</span>
    <div class="title-right">
      <button class="tbtn" id="btnDownloadTitle" title="Download this sheet as CSV">
        <svg viewBox="0 0 16 16"><path d="M8 1v9M4.5 7L8 10.5 11.5 7M2 13h12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tbtn" id="btnUploadTitle" title="Upload a CSV file into this sheet">
        <svg viewBox="0 0 16 16"><path d="M8 10.5v-9M4.5 5L8 1.5 11.5 5M2 13h12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Ribbon -->
  <div class="ribbon" role="toolbar" aria-label="Formatting toolbar">
    <div class="rgroup">
      <button class="rbtn" id="btnUndo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 20 20"><path d="M7.5 5.5H4V2.2"/><path d="M4.3 5.8A6.6 6.6 0 1 1 3.4 12.6"/></svg>
      </button>
      <button class="rbtn" id="btnRedo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 20 20"><path d="M12.5 5.5H16V2.2"/><path d="M15.7 5.8A6.6 6.6 0 1 0 16.6 12.6"/></svg>
      </button>
    </div>
    <div class="rgroup">
      <button class="rbtn" id="btnBold" title="Bold (Ctrl+B)"><span class="g">B</span></button>
      <button class="rbtn" id="btnItalic" title="Italic (Ctrl+I)"><span class="g i">I</span></button>
      <button class="rbtn" id="btnUnderline" title="Underline (Ctrl+U)"><span class="g u">U</span></button>
    </div>
    <div class="rgroup">
      <button class="rbtn" id="btnFill" title="Cell background color">
        <svg viewBox="0 0 20 20"><path d="M10.9 2.6l6.2 6.2-6.6 6.6a1.7 1.7 0 0 1-2.4 0l-3.5-3.5a1.7 1.7 0 0 1 0-2.4l6.3-6.9z"/><path d="M7.6 5.4l6.3 6.3"/><path d="M16.6 12.2c0 1.3-.9 2.4-2 2.4s-2-1.1-2-2.4 2-3.4 2-3.4 2 2.1 2 3.4z"/></svg>
        <span class="swatch" id="fillSwatch" style="background:#ffe08a"></span>
      </button>
      <button class="rbtn" id="btnFontColor" title="Font color">
        <svg viewBox="0 0 20 20"><path d="M5 13.5l5-9.5 5 9.5"/><path d="M6.8 9.8h6.4"/></svg>
        <span class="swatch" id="fontSwatch" style="background:#c62828"></span>
      </button>
    </div>
    <div class="rgroup">
      <button class="rbtn" id="btnAlignLeft" title="Align left"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 9h9M3 13h14M3 17h9"/></svg></button>
      <button class="rbtn" id="btnAlignCenter" title="Align center"><svg viewBox="0 0 20 20"><path d="M3 5h14M5.5 9h9M3 13h14M5.5 17h9"/></svg></button>
      <button class="rbtn" id="btnAlignRight" title="Align right"><svg viewBox="0 0 20 20"><path d="M3 5h14M8 9h9M3 13h14M8 17h9"/></svg></button>
    </div>
    <div class="rgroup">
      <button class="rbtn" id="btnSum" title="AutoSum — insert =SUM(range) below the selection"><span class="g sum">&Sigma;</span></button>
      <button class="rbtn" id="btnClear" title="Clear contents (Delete)">
        <svg viewBox="0 0 20 20"><path d="M4 5.5h12M8 5.5V4h4v1.5M6 5.5l.8 10.2h6.4L14 5.5M8.6 8.2v5M11.4 8.2v5"/></svg>
      </button>
    </div>
    <div class="rgroup">
      <button class="rbtn wide" id="btnCsvDown" title="Download active sheet as CSV">
        <svg viewBox="0 0 20 20"><path d="M10 2.5v10M6 9l4 4 4-4M3 16.5h14"/></svg><span>CSV</span>
      </button>
      <button class="rbtn wide" id="btnCsvUp" title="Upload a CSV file into the active sheet">
        <svg viewBox="0 0 20 20"><path d="M10 13V3M6 7l4-4 4 4M3 16.5h14"/></svg><span>Import</span>
      </button>
    </div>
  </div>

  <!-- Formula bar -->
  <div class="fbar">
    <div class="namebox">
      <input id="nameBox" spellcheck="false" aria-label="Name box — type a cell address or range" />
    </div>
    <div class="fx" title="Function wizard">fx</div>
    <div class="finput-wrap">
      <input id="formulaInput" class="finput" spellcheck="false" autocomplete="off"
             aria-label="Formula bar" placeholder="Enter a value or a formula, e.g. =SUM(A1:A10)" />
    </div>
  </div>

  <!-- Grid -->
  <div class="sheet-area" id="sheetArea">
    <div class="corner" title="Select all">
      <svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg>
    </div>
    <div class="colstrip" id="colStrip"><div class="colstrip-inner" id="colStripInner"></div></div>
    <div class="rowstrip" id="rowStrip"><div class="rowstrip-inner" id="rowStripInner"></div></div>
    <div class="scroller" id="scroller" tabindex="0">
      <div class="canvas" id="canvas">
        <div class="cell-layer" id="cellLayer"></div>
        <div class="overlay" id="overlay">
          <div class="sel-fill" id="selFill"></div>
          <div class="active-box" id="activeBox"></div>
          <div class="point-box" id="pointBox" style="display:none"></div>
        </div>
        <input class="editor" id="cellEditor" spellcheck="false" autocomplete="off" />
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span id="statusSel">—</span>
    <span class="status-right">
      <span class="stat">Average: <b id="stAvg">—</b></span>
      <span class="stat">Count: <b id="stCount">—</b></span>
      <span class="stat">Sum: <b id="stSum">—</b></span>
    </span>
  </div>

  <!-- Sheet tabs -->
  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <button class="addtab" id="btnAddSheet" title="Add a new sheet">+</button>
  </div>
</div>

<!-- Color palettes -->
<div class="popover" id="fillPopover">
  <div class="pop-label">Cell background</div>
  <div class="sw-none" data-color="">No fill</div>
  <div class="swatch-grid" id="fillPalette"></div>
</div>
<div class="popover" id="fontPopover">
  <div class="pop-label">Font color</div>
  <div class="swatch-grid" id="fontPalette"></div>
</div>

<!-- Context menu for sheet tabs -->
<div class="ctxmenu" id="sheetMenu">
  <button data-act="rename">Rename sheet</button>
  <button data-act="duplicate">Duplicate sheet</button>
  <div class="sep"></div>
  <button data-act="delete" class="danger">Delete sheet</button>
</div>

<input type="file" id="fileInput" accept=".csv,text/csv,text/plain" style="display:none" />
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   Sheetly — a single-file spreadsheet app
   Sections: 1) helpers  2) model  3) values  4) formula engine
              5) dependency graph & recalc  6) UI  7) io
   ===================================================================== */

/* ========================= 1. Constants & helpers ==================== */
const MAX_ROWS  = 2000;
const MAX_COLS  = 100;
const DEF_COL_W = 92;
const DEF_ROW_H = 22;

const el = id => document.getElementById(id);
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const isNum = v => typeof v === 'number' && isFinite(v);

function colName(c){
  let s = '', n = c + 1;
  while (n > 0){
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = (n - 1 - m) / 26;
  }
  return s;
}
function colIndex(name){
  let n = 0;
  const s = String(name).toUpperCase();
  for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
  return n - 1;
}
function cellKey(r, c){ return r * MAX_COLS + c; }
function keyRow(k){ return Math.floor(k / MAX_COLS); }
function keyCol(k){ return k % MAX_COLS; }
function addr(r, c){ return colName(c) + (r + 1); }
function addrRange(s){
  const parts = s.split(':');
  const a = parseAddr(parts[0]);
  if (!a) return null;
  if (parts.length === 1) return { r1:a.r, c1:a.c, r2:a.r, c2:a.c };
  const b = parseAddr(parts[1]);
  if (!b) return null;
  return {
    r1: Math.min(a.r,b.r), c1: Math.min(a.c,b.c),
    r2: Math.max(a.r,b.r), c2: Math.max(a.c,b.c)
  };
}
function parseAddr(s){
  const m = /^\$?([A-Za-z]{1,3})\$?(\d{1,7})$/.exec(String(s).trim());
  if (!m) return null;
  const r = parseInt(m[2], 10) - 1;
  const c = colIndex(m[1]);
  if (r < 0 || r >= MAX_ROWS || c < 0 || c >= MAX_COLS) return null;
  return { r, c };
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

/* ============================ 2. Data model ========================== */
let sheetSeq = 0;

function defaultStyle(){
  return { bold:false, italic:false, underline:false, bg:null, fg:null, align:null };
}

function makeSheet(name){
  return {
    id: 'sh' + (++sheetSeq),
    name: name || 'Sheet1',
    cells: new Map(),        // numeric key -> cell
    colW: new Map(),         // col index -> px
    rowH: new Map(),         // row index -> px
    sel: { r1:0, c1:0, r2:0, c2:0 },
    cursor: { r:0, c:0 },
    precedents: new Map(),   // formula key -> Set(precedent keys)
    dependents: new Map(),   // cell key   -> Set(formula keys)
    rangeDeps: new Map()     // formula key -> [{r1,c1,r2,c2}]
  };
}
function makeCell(){
  return { raw:'', ast:null, value:null, style: defaultStyle() };
}
function getCell(sheet, r, c, create){
  const k = cellKey(r, c);
  let cell = sheet.cells.get(k);
  if (!cell && create){
    cell = makeCell();
    sheet.cells.set(k, cell);
  }
  return cell || null;
}
function colWidth(sheet, c){ return sheet.colW.get(c) || DEF_COL_W; }
function rowHeight(sheet, r){ return sheet.rowH.get(r) || DEF_ROW_H; }

const state = {
  sheets: [],
  active: 0,
  editing: null,        // {kind:'cell'|'formula', el, tokenStart, tokenEnd, ...}
  clip: null,           // internal clipboard {rows, r1, c1, r2, c2, cut}
  point: null,          // {r1,c1,r2,c2} live range while pointing in a formula
  preview: null,        // {key, value} live formula preview
  drag: null,           // active mouse drag descriptor
  lastPaint: 0
};

function activeSheet(){ return state.sheets[state.active]; }
function sheetById(id){
  if (!id) return null;
  for (const s of state.sheets) if (s.id === id) return s;
  return null;
}
function findSheetByName(name, curSheet){
  const want = String(name).trim().toLowerCase();
  if (curSheet && curSheet.name.toLowerCase() === want) return curSheet;
  for (const s of state.sheets) if (s.name.toLowerCase() === want) return s;
  return null;
}

/* cross-sheet dependency bookkeeping:
   crossDeps : "targetSheetId:cellKey" -> [{ sheetId, key }]  (formulas elsewhere)
   crossRanges: targetSheetId            -> [{ r1,c1,r2,c2, sheetId, key }] */
const crossDeps = new Map();
const crossRanges = new Map();

/* ========================= 3. Value semantics ======================== */
const ERR = code => ({ __err: code });
function isErr(v){ return !!v && typeof v === 'object' && typeof v.__err === 'string'; }

function formatNumber(n){
  if (!isFinite(n)) return '#NUM!';
  if (Number.isInteger(n)) return String(n);
  if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-10 && n !== 0))
    return n.toExponential(5).replace(/e([+-])(\d)$/, 'e$10$2');
  // Excel's "General" format shows at most 11 significant digits
  const intDigits = Math.max(1, Math.floor(Math.log10(Math.abs(n))) + 1);
  const decimals = clamp(11 - intDigits, 0, 15);
  let s = n.toFixed(decimals);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function formatValue(v){
  if (v === null || v === undefined) return '';
  if (isErr(v)) return v.__err;
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'number') return formatNumber(v);
  return String(v);
}
function toNumber(v){
  if (isErr(v)) return v;
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string'){
    const t = v.trim();
    if (t === '') return 0;
    if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)) return parseFloat(t);
    if (/^[+-]?\d+(\.\d+)?%$/.test(t)) return parseFloat(t) / 100;
    return ERR('#VALUE!');
  }
  return ERR('#VALUE!');
}
function toText(v){
  if (isErr(v)) return v;
  if (v === null || v === undefined) return '';
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'number') return formatNumber(v);
  return String(v);
}
function parseLiteral(raw){
  const s = String(raw);
  const t = s.trim();
  if (t === '') return null;
  if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)) return parseFloat(t);
  if (/^[+-]?\d+(\.\d+)?%$/.test(t)) return parseFloat(t) / 100;
  if (/^(TRUE|FALSE)$/i.test(t)) return t.toUpperCase() === 'TRUE';
  return s;
}

/* ======================= 4. Formula engine ========================== */
function ParseError(code){ this.code = code || '#ERROR!'; }

function lex(src){
  const toks = [];
  let i = 0;
  const isDigit = c => c >= '0' && c <= '9';
  while (i < src.length){
    const ch = src[i];
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r'){ i++; continue; }
    if (ch === '"'){
      let j = i + 1, s = '';
      let closed = false;
      while (j < src.length){
        if (src[j] === '"'){
          if (src[j + 1] === '"'){ s += '"'; j += 2; continue; }
          closed = true; break;
        }
        s += src[j]; j++;
      }
      if (!closed) throw new ParseError('#ERROR!');
      toks.push({ t:'str', v:s });
      i = j + 1; continue;
    }
    if (isDigit(ch) || (ch === '.' && isDigit(src[i + 1] || ''))){
      let j = i, s = '';
      while (j < src.length && /[0-9.]/.test(src[j])){ s += src[j]; j++; }
      if (src[j] === 'e' || src[j] === 'E'){
        let k = j + 1;
        if (src[k] === '+' || src[k] === '-') k++;
        if (isDigit(src[k] || '')){
          s += src[j]; j++;
          while (isDigit(src[k] || '')){ s += src[k]; k++; }
          j = k;
        }
      }
      toks.push({ t:'num', v:parseFloat(s) });
      i = j; continue;
    }
    if (ch === "'"){
      let j = i + 1, s = '';
      let closed = false;
      while (j < src.length){
        if (src[j] === "'"){ closed = true; break; }
        s += src[j]; j++;
      }
      if (!closed) throw new ParseError('#ERROR!');
      toks.push({ t:'word', v:s, quoted:true });
      i = j + 1; continue;
    }
    if (/[A-Za-z$]/.test(ch)){
      let j = i, s = '';
      while (j < src.length && /[A-Za-z0-9$]/.test(src[j])){ s += src[j]; j++; }
      toks.push({ t:'word', v:s.toUpperCase() });
      i = j; continue;
    }
    if (ch === '<' || ch === '>'){
      if (src[i + 1] === '='){ toks.push({ t:'op', v: ch + '=' }); i += 2; continue; }
      toks.push({ t:'op', v:ch }); i++; continue;
    }
    if ('+-*/^&%(),:<>=!'.indexOf(ch) >= 0){ toks.push({ t:'op', v:ch }); i++; continue; }
    throw new ParseError('#ERROR!');
  }
  toks.push({ t:'eof' });
  return toks;
}

function parseFormula(src, curSheet){
  const toks = lex(src);
  let p = 0;
  const peek  = () => toks[p];
  const next  = () => toks[p++];
  const isOp  = v => { const t = peek(); return t.t === 'op' && t.v === v; };
  function expect(v){
    const t = next();
    if (t.t !== 'op' || t.v !== v) throw new ParseError('#ERROR!');
    return t;
  }
  function makeRange(r1, c1, r2, c2){
    return {
      t:'range',
      r1: Math.min(r1, r2), c1: Math.min(c1, c2),
      r2: Math.max(r1, r2), c2: Math.max(c1, c2)
    };
  }
  const REF_RE = /^\$?([A-Z]{1,3})\$?(\d{1,7})$/;
  const COL_RE = /^\$?([A-Z]{1,3})$/;

  function primary(qualified){
    const t = peek();
    if (t.t === 'num'){ next(); return { t:'num', v:t.v }; }
    if (t.t === 'str'){ next(); return { t:'str', v:t.v }; }
    if (t.t === 'op' && t.v === '('){
      next();
      const e = comparison();
      expect(')');
      return e;
    }
    if (t.t === 'word'){
      next();
      const w = t.v;
      // qualified reference:  Sheet1!A1   or  'My Sheet'!A1:B2
      if (isOp('!')){
        next();
        const target = findSheetByName(w, curSheet);
        if (!target) throw new ParseError('#REF!');
        const rest = primary(true);
        rest.sid = target.id;
        return rest;
      }
      if (w === 'TRUE') return { t:'bool', v:true };
      if (w === 'FALSE') return { t:'bool', v:false };
      if (isOp('(')){
        next();                               // consume '('
        const args = [];
        if (!isOp(')')){
          for (;;){
            args.push(comparison());
            if (isOp(',')){ next(); continue; }
            break;
          }
        }
        expect(')');
        return { t:'call', name:w, args };
      }
      const mr = REF_RE.exec(w);
      if (mr){
        const r = parseInt(mr[2], 10) - 1;
        const c = colIndex(mr[1]);
        if (isOp(':')){
          const save = p; next();
          const t2 = peek();
          const mr2 = t2.t === 'word' ? REF_RE.exec(t2.v) : null;
          if (mr2){
            next();
            return makeRange(r, c, parseInt(mr2[2], 10) - 1, colIndex(mr2[1]));
          }
          p = save;
        }
        return { t:'ref', r, c };
      }
      const mc = COL_RE.exec(w);
      if (mc){
        const c = colIndex(mc[1]);
        if (isOp(':')){
          const save = p; next();
          const t2 = peek();
          const mc2 = t2.t === 'word' ? COL_RE.exec(t2.v) : null;
          if (mc2){
            next();
            return makeRange(0, c, MAX_ROWS - 1, colIndex(mc2[1]));
          }
          p = save;
        }
        return { t:'col', c };
      }
      throw new ParseError('#NAME?');
    }
    throw new ParseError('#ERROR!');
  }
  function postfix(){
    let node = primary();
    while (isOp('%')){ next(); node = { t:'post', a:node }; }
    return node;
  }
  function unary(){
    if (isOp('-')){ next(); return { t:'un', op:'-', a:unary() }; }
    if (isOp('+')){ next(); return { t:'un', op:'+', a:unary() }; }
    return postfix();
  }
  function power(){
    const left = unary();
    if (isOp('^')){ next(); return { t:'bin', op:'^', a:left, b:unary() }; }
    return left;
  }
  function multiplicative(){
    let node = power();
    for (;;){
      if (isOp('*')){ next(); node = { t:'bin', op:'*', a:node, b:power() }; continue; }
      if (isOp('/')){ next(); node = { t:'bin', op:'/', a:node, b:power() }; continue; }
      break;
    }
    return node;
  }
  function additive(){
    let node = multiplicative();
    for (;;){
      if (isOp('+')){ next(); node = { t:'bin', op:'+', a:node, b:multiplicative() }; continue; }
      if (isOp('-')){ next(); node = { t:'bin', op:'-', a:node, b:multiplicative() }; continue; }
      break;
    }
    return node;
  }
  function concat(){
    let node = additive();
    while (isOp('&')){ next(); node = { t:'bin', op:'&', a:node, b:additive() }; continue; }
    return node;
  }
  function comparison(){
    let node = concat();
    for (;;){
      const t = peek();
      if (t.t === 'op' && ['=','<>','<','>','<=','>='].indexOf(t.v) >= 0){
        next();
        node = { t:'bin', op:t.v, a:node, b:concat() };
        continue;
      }
      break;
    }
    return node;
  }
  const ast = comparison();
  if (peek().t !== 'eof') throw new ParseError('#ERROR!');
  return ast;
}

/* ---- evaluation ---- */
function evalNode(node, ctx){
  switch (node.t){
    case 'num':  return node.v;
    case 'str':  return node.v;
    case 'bool': return node.v;
    case 'err':  return ERR(node.code || '#ERROR!');
    case 'ref':  { const v = ctx.get(node.r, node.c, node.sid); return v === null ? 0 : v; }
    case 'range': return { __range:true, r1:node.r1, c1:node.c1, r2:node.r2, c2:node.c2, sid:node.sid };
    case 'col':  return { __range:true, r1:0, c1:node.c, r2:MAX_ROWS - 1, c2:node.c };
    case 'un': {
      const a = evalNode(node.a, ctx);
      if (isErr(a)) return a;
      const n = toNumber(a);
      if (isErr(n)) return n;
      return node.op === '-' ? -n : n;
    }
    case 'post': {
      const a = evalNode(node.a, ctx);
      if (isErr(a)) return a;
      const n = toNumber(a);
      if (isErr(n)) return n;
      return n / 100;
    }
    case 'bin': {
      const a = evalNode(node.a, ctx);
      if (isErr(a)) return a;
      const b = evalNode(node.b, ctx);
      if (isErr(b)) return b;
      if (a && a.__range) return ERR('#VALUE!');
      if (b && b.__range) return ERR('#VALUE!');
      switch (node.op){
        case '+': case '-': case '*': case '/': case '^': {
          const x = toNumber(a), y = toNumber(b);
          if (isErr(x)) return x;
          if (isErr(y)) return y;
          switch (node.op){
            case '+': return x + y;
            case '-': return x - y;
            case '*': return x * y;
            case '/': return isZero(y) ? ERR('#DIV/0!') : x / y;
            case '^': {
              const p = Math.pow(x, y);
              return isFinite(p) ? p : ERR('#NUM!');
            }
          }
          break;
        }
        case '&': {
          const x = toText(a), y = toText(b);
          if (isErr(x)) return x;
          if (isErr(y)) return y;
          return x + y;
        }
        default: {
          // comparisons
          const x = a, y = b;
          let cmp;
          if (typeof x === 'number' && typeof y === 'number') cmp = x < y ? -1 : (x > y ? 1 : 0);
          else if (typeof x === 'string' && typeof y === 'string'){
            const xs = x.toLowerCase(), ys = y.toLowerCase();
            cmp = xs < ys ? -1 : (xs > ys ? 1 : 0);
          }
          else if (typeof x === 'boolean' || typeof y === 'boolean'){
            const xb = typeof x === 'boolean' ? x : !!x, yb = typeof y === 'boolean' ? y : !!y;
            cmp = xb === yb ? 0 : (xb ? 1 : -1);
          }
          else {
            const xn = toNumber(x), yn = toNumber(y);
            if (isErr(xn) || isErr(yn)) return ERR('#VALUE!');
            cmp = xn < yn ? -1 : (xn > yn ? 1 : 0);
          }
          switch (node.op){
            case '=':  return cmp === 0;
            case '<>': return cmp !== 0;
            case '<':  return cmp < 0;
            case '>':  return cmp > 0;
            case '<=': return cmp <= 0;
            case '>=': return cmp >= 0;
          }
        }
      }
      return ERR('#VALUE!');
    }
    case 'call': return callFunction(node, ctx);
  }
  return ERR('#VALUE!');
}
function isZero(n){ return n === 0 || Math.abs(n) < 1e-14; }

function flatten(node, ctx){
  const v = evalNode(node, ctx);
  if (isErr(v)) return v;
  if (v && v.__range){
    const out = [];
    for (let r = v.r1; r <= v.r2; r++)
      for (let c = v.c1; c <= v.c2; c++)
        out.push(ctx.get(r, c, v.sid));
    return out;
  }
  return [v];
}
function numericValues(args, ctx){
  const vals = [];
  for (const a of args){
    const arr = flatten(a, ctx);
    if (isErr(arr)) return arr;
    for (const v of arr){
      if (isErr(v)) return v;
      if (v === null || v === undefined || v === '') continue;
      if (typeof v === 'number'){ vals.push(v); continue; }
      if (typeof v === 'boolean') continue;
      if (typeof v === 'string'){
        const n = toNumber(v);
        if (isErr(n)) continue;      // text is ignored inside ranges
        vals.push(n);
      }
    }
  }
  return vals;
}
function matchCriteria(value, crit){
  if (typeof crit === 'string'){
    const m = /^(<=|>=|<>|=|<|>)?(.*)$/.exec(crit.trim());
    const op = m[1] || '=';
    const target = m[2];
    if (target !== '' && /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(target)){
      const t = parseFloat(target);
      if (typeof value !== 'number') return false;
      switch (op){
        case '=':  return value === t;
        case '<>': return value !== t;
        case '<':  return value <  t;
        case '<=': return value <= t;
        case '>':  return value >  t;
        case '>=': return value >= t;
      }
      return false;
    }
    const sv = (value === null || value === undefined) ? ''
             : (typeof value === 'string' ? value : formatNumber(value));
    const a = sv.toLowerCase(), b = target.toLowerCase();
    switch (op){
      case '=':  return a === b;
      case '<>': return a !== b;
      default:   return false;
    }
  }
  return value === crit;
}

const FUNCS = {
  SUM(args, ctx){ const v = numericValues(args, ctx); return isErr(v) ? v : v.reduce((a,b) => a + b, 0); },
  PRODUCT(args, ctx){
    const v = numericValues(args, ctx);
    if (isErr(v)) return v;
    return v.length ? v.reduce((a,b) => a * b, 1) : 0;
  },
  AVERAGE(args, ctx){
    const v = numericValues(args, ctx);
    if (isErr(v)) return v;
    if (!v.length) return ERR('#DIV/0!');
    return v.reduce((a,b) => a + b, 0) / v.length;
  },
  MIN(args, ctx){
    const v = numericValues(args, ctx);
    if (isErr(v)) return v;
    if (!v.length) return 0;
    return Math.min.apply(null, v);
  },
  MAX(args, ctx){
    const v = numericValues(args, ctx);
    if (isErr(v)) return v;
    if (!v.length) return 0;
    return Math.max.apply(null, v);
  },
  COUNT(args, ctx){ const v = numericValues(args, ctx); return isErr(v) ? v : v.length; },
  COUNTA(args, ctx){
    let n = 0;
    for (const a of args){
      const arr = flatten(a, ctx);
      if (isErr(arr)) return arr;
      for (const v of arr) if (v !== null && v !== undefined && v !== '') n++;
    }
    return n;
  },
  MEDIAN(args, ctx){
    const v = numericValues(args, ctx);
    if (isErr(v)) return v;
    if (!v.length) return ERR('#NUM!');
    const s = v.slice().sort((a,b) => a - b);
    const mid = s.length >> 1;
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  },
  STDEV(args, ctx){
    const v = numericValues(args, ctx);
    if (isErr(v)) return v;
    if (v.length < 2) return ERR('#DIV/0!');
    const mean = v.reduce((a,b) => a + b, 0) / v.length;
    return Math.sqrt(v.reduce((a,b) => a + (b - mean) * (b - mean), 0) / (v.length - 1));
  },
  ABS(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const n = toNumber(v); return isErr(n) ? n : Math.abs(n); },
  SIGN(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const n = toNumber(v); return isErr(n) ? n : Math.sign(n); },
  INT(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const n = toNumber(v); return isErr(n) ? n : Math.floor(n); },
  TRUNC(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const n = toNumber(v); if (isErr(n)) return n;
    const d = args.length > 1 ? toNumber(evalNode(args[1], ctx)) : 0;
    const p = Math.pow(10, isErr(d) ? 0 : d);
    return Math.trunc(n * p) / p;
  },
  ROUND(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const n = toNumber(v); if (isErr(n)) return n;
    const d = args.length > 1 ? toNumber(evalNode(args[1], ctx)) : 0;
    const digits = isErr(d) ? 0 : clamp(Math.trunc(d), -15, 15);
    const f = Math.pow(10, digits);
    return Math.round((n * f + (n >= 0 ? 1e-9 : -1e-9))) / f;
  },
  ROUNDUP(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const n = toNumber(v); if (isErr(n)) return n;
    const d = args.length > 1 ? toNumber(evalNode(args[1], ctx)) : 0;
    const digits = isErr(d) ? 0 : clamp(Math.trunc(d), -15, 15);
    const f = Math.pow(10, digits);
    return (n < 0 ? Math.floor(n * f) : Math.ceil(n * f)) / f;
  },
  ROUNDDOWN(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const n = toNumber(v); if (isErr(n)) return n;
    const d = args.length > 1 ? toNumber(evalNode(args[1], ctx)) : 0;
    const digits = isErr(d) ? 0 : clamp(Math.trunc(d), -15, 15);
    const f = Math.pow(10, digits);
    return (n < 0 ? Math.ceil(n * f) : Math.floor(n * f)) / f;
  },
  MOD(args, ctx){
    const a = toNumber(evalNode(args[0], ctx)); if (isErr(a)) return a;
    const b = toNumber(evalNode(args[1], ctx)); if (isErr(b)) return b;
    if (isZero(b)) return ERR('#DIV/0!');
    return a - b * Math.floor(a / b);
  },
  POWER(args, ctx){
    const a = toNumber(evalNode(args[0], ctx)); if (isErr(a)) return a;
    const b = toNumber(evalNode(args[1], ctx)); if (isErr(b)) return b;
    const p = Math.pow(a, b);
    return isFinite(p) ? p : ERR('#NUM!');
  },
  SQRT(args, ctx){
    const a = toNumber(evalNode(args[0], ctx)); if (isErr(a)) return a;
    return a < 0 ? ERR('#NUM!') : Math.sqrt(a);
  },
  EXP(args, ctx){ const a = toNumber(evalNode(args[0], ctx)); if (isErr(a)) return a; return Math.exp(a); },
  LN(args, ctx){ const a = toNumber(evalNode(args[0], ctx)); if (isErr(a)) return a; return a <= 0 ? ERR('#NUM!') : Math.log(a); },
  LOG(args, ctx){ const a = toNumber(evalNode(args[0], ctx)); if (isErr(a)) return a; return a <= 0 ? ERR('#NUM!') : Math.log10(a); },
  PI(){ return Math.PI; },
  RAND(){ return Math.random(); },
  IF(args, ctx){
    if (!args.length) return ERR('#VALUE!');
    const c = evalNode(args[0], ctx);
    if (isErr(c)) return c;
    let truthy;
    if (typeof c === 'boolean') truthy = c;
    else if (typeof c === 'number') truthy = c !== 0;
    else if (c === null || c === undefined || c === '') truthy = false;
    else truthy = true;
    if (truthy) return args.length > 1 ? evalNode(args[1], ctx) : true;
    return args.length > 2 ? evalNode(args[2], ctx) : false;
  },
  IFERROR(args, ctx){
    const v = args.length ? evalNode(args[0], ctx) : ERR('#VALUE!');
    if (isErr(v)) return args.length > 1 ? evalNode(args[1], ctx) : '';
    return v;
  },
  AND(args, ctx){
    for (const a of args){
      const arr = flatten(a, ctx);
      if (isErr(arr)) return arr;
      for (const v of arr){
        if (v === null || v === undefined || v === '') continue;
        const b = typeof v === 'boolean' ? v : (typeof v === 'number' ? v !== 0 : !!v);
        if (!b) return false;
      }
    }
    return true;
  },
  OR(args, ctx){
    let any = false;
    for (const a of args){
      const arr = flatten(a, ctx);
      if (isErr(arr)) return arr;
      for (const v of arr){
        if (v === null || v === undefined || v === '') continue;
        const b = typeof v === 'boolean' ? v : (typeof v === 'number' ? v !== 0 : !!v);
        if (b) any = true;
      }
    }
    return any;
  },
  NOT(args, ctx){
    const v = evalNode(args[0], ctx);
    if (isErr(v)) return v;
    const b = typeof v === 'boolean' ? v : (typeof v === 'number' ? v !== 0 : !!v);
    return !b;
  },
  SUMIF(args, ctx){
    const range = flatten(args[0], ctx);
    if (isErr(range)) return range;
    const crit = args.length > 1 ? evalNode(args[1], ctx) : '';
    if (isErr(crit)) return crit;
    let sumRange = range;
    if (args.length > 2){
      const sr = flatten(args[2], ctx);
      if (isErr(sr)) return sr;
      sumRange = sr;
    }
    let sum = 0;
    for (let i = 0; i < range.length; i++){
      if (!matchCriteria(range[i], crit)) continue;
      const sv = sumRange[i];
      if (typeof sv === 'number') sum += sv;
      else if (typeof sv === 'string' && sv !== ''){ const n = toNumber(sv); if (!isErr(n)) sum += n; }
    }
    return sum;
  },
  COUNTIF(args, ctx){
    const range = flatten(args[0], ctx);
    if (isErr(range)) return range;
    const crit = args.length > 1 ? evalNode(args[1], ctx) : '';
    if (isErr(crit)) return crit;
    let n = 0;
    for (const v of range) if (matchCriteria(v, crit)) n++;
    return n;
  },
  CONCATENATE(args, ctx){
    let s = '';
    for (const a of args){
      const arr = flatten(a, ctx);
      if (isErr(arr)) return arr;
      for (const v of arr){
        const t = toText(v);
        if (isErr(t)) return t;
        s += t;
      }
    }
    return s;
  },
  LEN(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const t = toText(v); return isErr(t) ? t : t.length; },
  LEFT(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const t = toText(v); if (isErr(t)) return t;
    const n = args.length > 1 ? toNumber(evalNode(args[1], ctx)) : 1;
    return t.slice(0, isErr(n) ? 1 : Math.max(0, Math.trunc(n)));
  },
  RIGHT(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const t = toText(v); if (isErr(t)) return t;
    const n = args.length > 1 ? toNumber(evalNode(args[1], ctx)) : 1;
    const k = isErr(n) ? 1 : Math.max(0, Math.trunc(n));
    return k === 0 ? '' : t.slice(-k);
  },
  MID(args, ctx){
    const v = evalNode(args[0], ctx); if (isErr(v)) return v;
    const t = toText(v); if (isErr(t)) return t;
    const st = toNumber(evalNode(args[1], ctx)); if (isErr(st)) return st;
    const ln = toNumber(evalNode(args[2], ctx)); if (isErr(ln)) return ln;
    return t.substr(Math.max(0, Math.trunc(st) - 1), Math.max(0, Math.trunc(ln)));
  },
  UPPER(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const t = toText(v); return isErr(t) ? t : t.toUpperCase(); },
  LOWER(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const t = toText(v); return isErr(t) ? t : t.toLowerCase(); },
  TRIM(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const t = toText(v); return isErr(t) ? t : t.trim().replace(/\s+/g, ' '); },
  VALUE(args, ctx){ const v = evalNode(args[0], ctx); if (isErr(v)) return v; const n = toNumber(v); return isErr(n) ? ERR('#VALUE!') : n; },
  TODAY(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  NOW(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0') + ' ' +
           String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
};
FUNCS.CONCAT = FUNCS.CONCATENATE;

function callFunction(node, ctx){
  const fn = FUNCS[node.name];
  if (!fn) return ERR('#NAME?');
  try {
    return fn(node.args, ctx);
  } catch (e){
    return ERR('#VALUE!');
  }
}

/* ============ 5. Dependency graph & recalculation =================== */
function collectRefs(node, out){
  if (!node) return;
  switch (node.t){
    case 'ref':   out.refs.push({ r:node.r, c:node.c, sid:node.sid }); break;
    case 'range': out.ranges.push(node); break;
    case 'un': case 'post': collectRefs(node.a, out); break;
    case 'bin':   collectRefs(node.a, out); collectRefs(node.b, out); break;
    case 'call':  node.args.forEach(a => collectRefs(a, out)); break;
  }
}
function updateDeps(sheet, r, c, ast){
  const k = cellKey(r, c);
  const old = sheet.precedents.get(k);
  if (old){
    for (const p of old){
      const s = sheet.dependents.get(p);
      if (s){ s.delete(k); if (!s.size) sheet.dependents.delete(p); }
    }
  }
  sheet.precedents.delete(k);
  sheet.rangeDeps.delete(k);
  if (!ast) return;

  const out = { refs:[], ranges:[] };
  collectRefs(ast, out);
  const pre = new Set();
  for (const ref of out.refs){
    if (ref.sid){                                  // lives on another sheet
      addCrossDep(ref.sid, ref.r, ref.c, sheet, k);
      continue;
    }
    pre.add(cellKey(ref.r, ref.c));
  }
  const localRanges = [];
  for (const rg of out.ranges){
    if (rg.sid){                                   // range on another sheet
      addCrossRange(rg.sid, rg, sheet, k);
      continue;
    }
    localRanges.push(rg);
    const area = (rg.r2 - rg.r1 + 1) * (rg.c2 - rg.c1 + 1);
    if (area <= 20000){
      for (let rr = rg.r1; rr <= rg.r2; rr++)
        for (let cc = rg.c1; cc <= rg.c2; cc++)
          pre.add(cellKey(rr, cc));
    }
  }
  sheet.precedents.set(k, pre);
  for (const p of pre){
    let s = sheet.dependents.get(p);
    if (!s){ s = new Set(); sheet.dependents.set(p, s); }
    s.add(k);
  }
  sheet.rangeDeps.set(k, localRanges);
}
function addCrossDep(sid, r, c, srcSheet, srcKey){
  const mk = sid + ':' + cellKey(r, c);
  let list = crossDeps.get(mk);
  if (!list){ list = []; crossDeps.set(mk, list); }
  if (!list.some(e => e.sheetId === srcSheet.id && e.key === srcKey))
    list.push({ sheetId: srcSheet.id, key: srcKey });
}
function addCrossRange(sid, rg, srcSheet, srcKey){
  let list = crossRanges.get(sid);
  if (!list){ list = []; crossRanges.set(sid, list); }
  list.push({ r1:rg.r1, c1:rg.c1, r2:rg.r2, c2:rg.c2, sheetId:srcSheet.id, key:srcKey });
}

function computeAffected(sheet, changedKeys){
  const affected = new Set();
  const stack = Array.from(changedKeys);
  const rangeEntries = Array.from(sheet.rangeDeps.entries());
  while (stack.length){
    const k = stack.pop();
    const deps = sheet.dependents.get(k);
    if (deps) for (const d of deps) if (!affected.has(d)){ affected.add(d); stack.push(d); }
    if (rangeEntries.length){
      const r = keyRow(k), c = keyCol(k);
      for (const [fk, ranges] of rangeEntries){
        if (affected.has(fk)) continue;
        for (const rg of ranges){
          if (r >= rg.r1 && r <= rg.r2 && c >= rg.c1 && c <= rg.c2){
            affected.add(fk); stack.push(fk); break;
          }
        }
      }
    }
  }
  return affected;
}

function evaluateAffected(sheet, affected){
  if (!affected.size) return affected;
  const memo = new Map();
  const inProgress = new Set();
  const sid = sheet.id;
  const affKeys = new Set();
  for (const k of affected) affKeys.add(sid + ':' + k);
  function get(r, c, tsid){
    const useSid = tsid || sid;
    const mk = useSid + ':' + cellKey(r, c);
    if (memo.has(mk)) return memo.get(mk);
    const sh = useSid === sid ? sheet : sheetById(useSid);
    if (!sh) return ERR('#REF!');
    const cell = sh.cells.get(cellKey(r, c));
    if (!cell || !cell.ast){ const v = cell ? cell.value : null; memo.set(mk, v); return v; }
    // cells outside the affected set cannot depend on anything that changed,
    // so their stored value is still valid
    if (!affKeys.has(mk)){ const v = cell.value; memo.set(mk, v); return v; }
    if (inProgress.has(mk)) return ERR('#CIRCULAR!');
    inProgress.add(mk);
    let out;
    try { out = evalNode(cell.ast, { get }); }
    catch (e){ out = ERR('#VALUE!'); }
    inProgress.delete(mk);
    memo.set(mk, out);
    cell.value = out;
    return out;
  }
  for (const k of affected){
    const cell = sheet.cells.get(k);
    if (cell && cell.ast) get(keyRow(k), keyCol(k));
  }
  return affected;
}

/**
 * Recalculate a sheet after its cells changed, following dependencies both
 * inside the sheet and across sheets.  Returns the set of touched cells as
 * "sheetId:cellKey" strings.
 */
function recalcFrom(sheet, changedKeys){
  const queue = [{ sheet, keys: new Set(changedKeys) }];
  const touched = new Set();
  let guard = 0;
  while (queue.length && guard++ < 64){
    const job = queue.shift();
    const sh = job.sheet;
    const affected = computeAffected(sh, job.keys);
    for (const k of job.keys){
      const cell = sh.cells.get(k);
      if (cell && cell.ast) affected.add(k);
    }
    evaluateAffected(sh, affected);
    const outgoing = new Set(job.keys);
    for (const k of affected) outgoing.add(k);
    for (const k of affected) touched.add(sh.id + ':' + k);
    // cells on other sheets that depend on what just changed
    const next = new Map();
    const addNext = (sid2, k2) => {
      let set = next.get(sid2);
      if (!set){ set = new Set(); next.set(sid2, set); }
      set.add(k2);
    };
    for (const k of outgoing){
      const list = crossDeps.get(sh.id + ':' + k);
      if (list) for (const e of list) addNext(e.sheetId, e.key);
    }
    for (const entry of (crossRanges.get(sh.id) || [])){
      for (const k of outgoing){
        const r = keyRow(k), c = keyCol(k);
        if (r >= entry.r1 && r <= entry.r2 && c >= entry.c1 && c <= entry.c2){
          addNext(entry.sheetId, entry.key);
        }
      }
    }
    for (const [sid2, ks] of next){
      const sh2 = sheetById(sid2);
      if (sh2) queue.push({ sheet: sh2, keys: ks });
    }
  }
  return touched;
}
function affectedInSheet(touched, sheet){
  const out = new Set();
  const prefix = sheet.id + ':';
  for (const t of touched){
    if (t.indexOf(prefix) === 0){
      const k = parseInt(t.slice(prefix.length), 10);
      if (!isNaN(k)) out.add(k);
    }
  }
  return out;
}

/** Recalculate every formula on a sheet (used after bulk edits). */
function recalcSheet(sheet){
  const affected = new Set();
  for (const [k, cell] of sheet.cells) if (cell.ast) affected.add(k);
  evaluateAffected(sheet, affected);
  return affected;
}

let bulkMode = false;
let bulkChanged = null;

/** Write a raw value (text or formula) into a cell and recalculate the sheet. */
function setCellRaw(sheet, r, c, raw, opts){
  opts = opts || {};
  const k = cellKey(r, c);
  let cell = sheet.cells.get(k);
  if (!cell) cell = getCell(sheet, r, c, true);
  if (typeof captureCell === 'function') captureCell(sheet, r, c);

  const text = String(raw == null ? '' : raw);
  const isFormula = text.charAt(0) === '=';
  cell.raw = text;

  if (isFormula){
    let ast = null;
    let errCode = '#ERROR!';
    try { ast = parseFormula(text.slice(1), sheet); }
    catch (e){ ast = null; errCode = (e && e.code) || '#ERROR!'; }
    if (ast){
      cell.ast = ast;
      cell.value = null;
      updateDeps(sheet, r, c, ast);
    } else {
      cell.ast = { t:'err', code: errCode };
      cell.value = ERR(errCode);
      updateDeps(sheet, r, c, null);
    }
  } else {
    cell.ast = null;
    cell.value = parseLiteral(text);
    updateDeps(sheet, r, c, null);
  }

  if (bulkMode && bulkChanged) bulkChanged.add(k);
  const changed = new Set([k]);
  if (bulkMode){ bulkChanged.add(k); return { affected: new Set([k]), cell }; }
  const touched = recalcFrom(sheet, changed);
  const affected = affectedInSheet(touched, sheet);
  affected.add(k);
  return { affected, cell };
}
/* ===================== 6. UI: rendering & interaction ================ */
const dom = {
  scroller: el('scroller'), canvas: el('canvas'), cellLayer: el('cellLayer'),
  colStrip: el('colStrip'), colInner: el('colStripInner'),
  rowStrip: el('rowStrip'), rowInner: el('rowStripInner'),
  selFill: el('selFill'), activeBox: el('activeBox'), pointBox: el('pointBox'),
  overlay: el('overlay'),
  editor: el('cellEditor'), formula: el('formulaInput'), nameBox: el('nameBox'),
  tabs: el('tabs'), toast: el('toast')
};

const cellEls = new Map();      // numeric key -> element
const cellPool = [];            // recycled cell elements
const colEls = new Map();       // col index -> element
const rowEls = new Map();       // row index -> element
let renderQueued = false;

/* ---- geometry ---- */
let M = null;   // cached metrics
function metrics(sheet){
  if (M && M.sheet === sheet) return M;
  const colX = new Float64Array(MAX_COLS + 1);
  const colW = new Float64Array(MAX_COLS);
  let x = 0;
  for (let c = 0; c < MAX_COLS; c++){ colW[c] = colWidth(sheet, c); colX[c] = x; x += colW[c]; }
  colX[MAX_COLS] = x;
  const rowY = new Float64Array(MAX_ROWS + 1);
  const rowH = new Float64Array(MAX_ROWS);
  let y = 0;
  for (let r = 0; r < MAX_ROWS; r++){ rowH[r] = rowHeight(sheet, r); rowY[r] = y; y += rowH[r]; }
  rowY[MAX_ROWS] = y;
  M = { sheet, colX, colW, rowY, rowH, totalW:x, totalH:y };
  return M;
}
function invalidateMetrics(){ M = null; }

/** index of the column containing canvas-x */
function colAt(x){
  const m = metrics(activeSheet());
  let lo = 0, hi = MAX_COLS - 1, ans = MAX_COLS - 1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (m.colX[mid] <= x){ ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return clamp(ans, 0, MAX_COLS - 1);
}
/** index of the row containing canvas-y */
function rowAt(y){
  const m = metrics(activeSheet());
  let lo = 0, hi = MAX_ROWS - 1, ans = MAX_ROWS - 1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (m.rowY[mid] <= y){ ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return clamp(ans, 0, MAX_ROWS - 1);
}

/* ---- text measuring ---- */
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
function measureText(text, bold, italic){
  measureCtx.font = (italic ? 'italic ' : '') + (bold ? 'bold ' : '') +
                    '13px "Segoe UI", system-ui, -apple-system, sans-serif';
  return measureCtx.measureText(text || '').width;
}

/* ---- cell rendering ---- */
function cellDisplay(sheet, r, c){
  const k = cellKey(r, c);
  if (state.preview && state.preview.key === k) return state.preview.text;
  const cell = sheet.cells.get(k);
  if (!cell) return '';
  return formatValue(cell.value);
}
/** Excel-like behaviour: shrink the precision of a number until it fits the column */
function fitCellText(sheet, r, c, text){
  const cell = sheet.cells.get(cellKey(r, c));
  if (!cell || typeof cell.value !== 'number' || !text || text.length < 6) return text;
  const m = metrics(sheet);
  const avail = m.colW[c] - 12;
  const bold = cell.style.bold, italic = cell.style.italic;
  const cache = cell._fit;
  if (cache && cache.w === avail && cache.src === text && cache.bold === bold && cache.italic === italic)
    return cache.out;
  let out = text;
  if (measureText(text, bold, italic) > avail){
    out = '#######';
    const n = cell.value;
    for (let dec = 8; dec >= 0; dec--){
      let t = n.toFixed(dec);
      if (t.indexOf('.') >= 0) t = t.replace(/0+$/, '').replace(/\.$/, '');
      if (measureText(t, bold, italic) <= avail){ out = t; break; }
    }
  }
  cell._fit = { w:avail, src:text, bold, italic, out };
  return out;
}
function cellClass(sheet, r, c){
  const cell = sheet.cells.get(cellKey(r, c));
  let cls = 'cell';
  if (cell){
    const st = cell.style;
    const v = cell.value;
    if (typeof v === 'number') cls += ' num';
    else if (isErr(v)) cls += ' err';
    else cls += ' txt';
    if (st.align === 'center') cls += ' mid';
    if (st.bold) cls += ' b';
    if (st.italic) cls += ' i';
    if (st.underline) cls += ' u';
  } else {
    cls += ' txt';
  }
  return cls;
}
function cellStyle(sheet, r, c, node){
  const m = metrics(sheet);
  const cell = sheet.cells.get(cellKey(r, c));
  const st = cell ? cell.style : null;
  if (node._left !== m.colX[c]){ node.style.left = m.colX[c] + 'px'; node._left = m.colX[c]; }
  if (node._top !== m.rowY[r]){ node.style.top = m.rowY[r] + 'px'; node._top = m.rowY[r]; }
  if (node._w !== m.colW[c]){ node.style.width = m.colW[c] + 'px'; node._w = m.colW[c]; }
  if (node._h !== m.rowH[r]){ node.style.height = m.rowH[r] + 'px'; node._h = m.rowH[r]; }
  const cls = cellClass(sheet, r, c);
  if (node._cls !== cls){ node.className = cls; node._cls = cls; }
  const fg = (st && st.fg) || '';
  const bg = (st && st.bg) || '';
  if (node._fg !== fg){ node.style.color = fg; node._fg = fg; }
  if (node._bg !== bg){ node.style.background = bg; node._bg = bg; }
}
function refreshCell(r, c){
  const sheet = activeSheet();
  const node = cellEls.get(cellKey(r, c));
  if (!node) return;
  const text = fitCellText(sheet, r, c, cellDisplay(sheet, r, c));
  if (node._text !== text){ node.textContent = text; node._text = text; }
  const cls = cellClass(sheet, r, c);
  if (node._cls !== cls){ node.className = cls; node._cls = cls; }
  cellStyle(sheet, r, c, node);
}

function renderViewport(){
  const sheet = activeSheet();
  const m = metrics(sheet);
  const sl = dom.scroller.scrollLeft, st = dom.scroller.scrollTop;
  const vw = dom.scroller.clientWidth, vh = dom.scroller.clientHeight;

  dom.canvas.style.width = m.totalW + 'px';
  dom.canvas.style.height = m.totalH + 'px';

  const c0 = colAt(sl), c1 = clamp(colAt(sl + vw) + 1, 0, MAX_COLS - 1);
  const r0 = rowAt(st), r1 = clamp(rowAt(st + vh) + 1, 0, MAX_ROWS - 1);

  // remove cells that scrolled out
  for (const [k, node] of cellEls){
    const r = keyRow(k), c = keyCol(k);
    if (r < r0 || r > r1 || c < c0 || c > c1){
      node.remove();
      cellEls.delete(k);
      if (cellPool.length < 4000) cellPool.push(node);
    }
  }
  for (let r = r0; r <= r1; r++){
    for (let c = c0; c <= c1; c++){
      const k = cellKey(r, c);
      let node = cellEls.get(k);
      if (!node){
        node = cellPool.pop() || document.createElement('div');
        dom.cellLayer.appendChild(node);
        cellEls.set(k, node);
        node._text = null; node._cls = null;
        node._left = node._top = node._w = node._h = null;
        node._fg = node._bg = null;
      }
      const text = fitCellText(sheet, r, c, cellDisplay(sheet, r, c));
      if (node._text !== text){ node.textContent = text; node._text = text; }
      const cls = cellClass(sheet, r, c);
      if (node._cls !== cls){ node.className = cls; node._cls = cls; }
      cellStyle(sheet, r, c, node);
    }
  }
  renderHeaders(c0, c1, r0, r1);
  renderOverlay();
}
function renderHeaders(c0, c1, r0, r1){
  const sheet = activeSheet();
  const m = metrics(sheet);
  dom.colInner.style.width = m.totalW + 'px';
  dom.rowInner.style.height = m.totalH + 'px';

  for (const [c, node] of colEls){
    if (c < c0 || c > c1){ node.remove(); colEls.delete(c); }
  }
  for (const [r, node] of rowEls){
    if (r < r0 || r > r1){ node.remove(); rowEls.delete(r); }
  }
  for (let c = c0; c <= c1; c++){
    let node = colEls.get(c);
    if (!node){
      node = document.createElement('div');
      node.className = 'colh';
      node._label = document.createTextNode('');
      const grip = document.createElement('span');
      grip.className = 'grip';
      node.appendChild(node._label);
      node.appendChild(grip);
      node.addEventListener('mousedown', onColHeaderDown);
      node.addEventListener('dblclick', onColHeaderDblClick);
      dom.colInner.appendChild(node);
      colEls.set(c, node);
    }
    node.style.left = m.colX[c] + 'px';
    node.style.width = m.colW[c] + 'px';
    const name = colName(c);
    if (node._label.nodeValue !== name) node._label.nodeValue = name;
    const inSel = c >= sheet.sel.c1 && c <= sheet.sel.c2;
    node.classList.toggle('sel', inSel);
  }
  for (let r = r0; r <= r1; r++){
    let node = rowEls.get(r);
    if (!node){
      node = document.createElement('div');
      node.className = 'rowh';
      node._label = document.createTextNode('');
      const grip = document.createElement('span');
      grip.className = 'grip';
      node.appendChild(node._label);
      node.appendChild(grip);
      node.addEventListener('mousedown', onRowHeaderDown);
      node.addEventListener('dblclick', onRowHeaderDblClick);
      dom.rowInner.appendChild(node);
      rowEls.set(r, node);
    }
    node.style.top = m.rowY[r] + 'px';
    node.style.height = m.rowH[r] + 'px';
    const rn = String(r + 1);
    if (node._label.nodeValue !== rn) node._label.nodeValue = rn;
    node.classList.toggle('sel', r >= sheet.sel.r1 && r <= sheet.sel.r2);
  }
}
function scheduleRender(){
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderViewport(); });
}

/* ---- selection overlay ---- */
function renderOverlay(){
  const sheet = activeSheet();
  const m = metrics(sheet);
  const s = sheet.sel;
  const x = m.colX[s.c1], y = m.rowY[s.r1];
  const w = m.colX[s.c2 + 1] - x, h = m.rowY[s.r2 + 1] - y;
  dom.selFill.style.left = x + 'px';
  dom.selFill.style.top = y + 'px';
  dom.selFill.style.width = w + 'px';
  dom.selFill.style.height = h + 'px';

  const cu = sheet.cursor;
  const ax = m.colX[cu.c], ay = m.rowY[cu.r];
  dom.activeBox.style.left = ax + 'px';
  dom.activeBox.style.top = ay + 'px';
  dom.activeBox.style.width = m.colW[cu.c] + 'px';
  dom.activeBox.style.height = m.rowH[cu.r] + 'px';

  if (state.point){
    hideRangeBoxes();
    const p = state.point;
    const px = m.colX[Math.min(p.c1, p.c2)];
    const py = m.rowY[Math.min(p.r1, p.r2)];
    const pw = m.colX[Math.max(p.c1, p.c2) + 1] - px;
    const ph = m.rowY[Math.max(p.r1, p.r2) + 1] - py;
    dom.pointBox.style.display = 'block';
    dom.pointBox.style.left = px + 'px';
    dom.pointBox.style.top = py + 'px';
    dom.pointBox.style.width = pw + 'px';
    dom.pointBox.style.height = ph + 'px';
  } else {
    dom.pointBox.style.display = 'none';
    highlightTokenRange();
  }
  updateStatusBar();
}

/* ---- selection helpers ---- */
function normSel(a, b){
  return {
    r1: Math.min(a.r, b.r), c1: Math.min(a.c, b.c),
    r2: Math.max(a.r, b.r), c2: Math.max(a.c, b.c)
  };
}
function setSelection(sel, cursor){
  const sheet = activeSheet();
  sheet.sel = {
    r1: clamp(sel.r1, 0, MAX_ROWS - 1), c1: clamp(sel.c1, 0, MAX_COLS - 1),
    r2: clamp(sel.r2, 0, MAX_ROWS - 1), c2: clamp(sel.c2, 0, MAX_COLS - 1)
  };
  if (cursor) sheet.cursor = { r: clamp(cursor.r, 0, MAX_ROWS - 1), c: clamp(cursor.c, 0, MAX_COLS - 1) };
  syncFormulaBar();
  scheduleRender();
}
function scrollIntoView(r, c){
  const m = metrics(activeSheet());
  const x = m.colX[c], y = m.rowY[r];
  const vw = dom.scroller.clientWidth, vh = dom.scroller.clientHeight;
  if (x < dom.scroller.scrollLeft) dom.scroller.scrollLeft = x;
  else if (x + m.colW[c] > dom.scroller.scrollLeft + vw) dom.scroller.scrollLeft = x + m.colW[c] - vw;
  if (y < dom.scroller.scrollTop) dom.scroller.scrollTop = y;
  else if (y + m.rowH[r] > dom.scroller.scrollTop + vh) dom.scroller.scrollTop = y + m.rowH[r] - vh;
}
function moveCursor(dr, dc, extend){
  const sheet = activeSheet();
  const cur = sheet.cursor;
  const nr = clamp(cur.r + dr, 0, MAX_ROWS - 1);
  const nc = clamp(cur.c + dc, 0, MAX_COLS - 1);
  if (extend){
    const anchor = state.selAnchor || { r: sheet.sel.r1, c: sheet.sel.c1 };
    state.selAnchor = anchor;
    setSelection(normSel(anchor, { r:nr, c:nc }), { r:nr, c:nc });
  } else {
    state.selAnchor = { r:nr, c:nc };
    setSelection({ r1:nr, c1:nc, r2:nr, c2:nc }, { r:nr, c:nc });
  }
  scrollIntoView(nr, nc);
}

/* ---- formula bar sync ---- */
function currentRaw(r, c){
  const cell = activeSheet().cells.get(cellKey(r, c));
  return cell ? cell.raw : '';
}
function syncFormulaBar(){
  const sheet = activeSheet();
  if (state.editing && state.editing.kind === 'formula') return;
  const cur = sheet.cursor;
  dom.formula.value = currentRaw(cur.r, cur.c);
  const s = sheet.sel;
  const multi = (s.r1 !== s.r2 || s.c1 !== s.c2);
  dom.nameBox.value = multi
    ? addr(s.r1, s.c1) + ':' + addr(s.r2, s.c2)
    : addr(cur.r, cur.c);
  updateToolbarState();
}
function updateStatusBar(){
  const sheet = activeSheet();
  const s = sheet.sel;
  const count = (s.r2 - s.r1 + 1) * (s.c2 - s.c1 + 1);
  let nums = 0, sum = 0;
  const step = count > 20000 ? Math.ceil(count / 20000) : 1;
  let i = 0;
  for (let r = s.r1; r <= s.r2; r++){
    for (let c = s.c1; c <= s.c2; c++){
      if (step > 1 && (i++ % step) !== 0) continue;
      const cell = sheet.cells.get(cellKey(r, c));
      if (cell && typeof cell.value === 'number'){ nums++; sum += cell.value; }
    }
  }
  el('statusSel').textContent = count === 1
    ? addr(s.r1, s.c1)
    : count + ' cells selected';
  el('stAvg').textContent = nums ? formatNumber(sum / nums) : '—';
  el('stCount').textContent = nums ? String(nums) : '—';
  el('stSum').textContent  = nums ? formatNumber(sum) : '—';
}

/* ==================== editing ======================================== */
function isFormulaText(text){ return String(text).charAt(0) === '='; }

function placeEditor(r, c){
  const m = metrics(activeSheet());
  const ed = state.editing;
  const node = dom.editor;
  const w = Math.max(m.colW[c], measureText(node.value, false, false) + 18);
  node.style.left = m.colX[c] + 'px';
  node.style.top = m.rowY[r] + 'px';
  node.style.height = m.rowH[r] + 'px';
  node.style.width = w + 'px';
  node.style.display = 'block';
}
function startCellEdit(initialText, caretAtEnd){
  const sheet = activeSheet();
  const cur = sheet.cursor;
  const cell = sheet.cells.get(cellKey(cur.r, cur.c));
  const raw = cell ? cell.raw : '';
  const text = initialText !== undefined ? initialText : raw;
  dom.editor.value = text;
  state.editing = {
    kind:'cell', el:dom.editor, r:cur.r, c:cur.c,
    tokenStart:text.length, tokenEnd:text.length,
    dirty: initialText !== undefined
  };
  placeEditor(cur.r, cur.c);
  dom.editor.focus();
  if (initialText !== undefined) dom.editor.setSelectionRange(text.length, text.length);
  else dom.editor.setSelectionRange(text.length, text.length);
  syncToken();
}
function startFormulaEdit(){
  const sheet = activeSheet();
  const cur = sheet.cursor;
  const raw = currentRaw(cur.r, cur.c);
  dom.formula.value = raw;
  state.editing = {
    kind:'formula', el:dom.formula, r:cur.r, c:cur.c,
    tokenStart:raw.length, tokenEnd:raw.length, dirty:false
  };
  dom.formula.focus();
  syncToken();
}
function commitEdit(cancel){
  const ed = state.editing;
  if (!ed) return;
  const sheet = activeSheet();
  const value = ed.el.value;
  state.editing = null;
  state.point = null;
  state.preview = null;
  if (ed.kind === 'cell'){
    dom.editor.style.display = 'none';
    dom.editor.value = '';
  } else {
    dom.formula.blur();
  }
  if (!cancel){
    withUndo(() => {
      const res = setCellRaw(sheet, ed.r, ed.c, value);
      for (const k of res.affected) refreshCell(keyRow(k), keyCol(k));
    });
    refreshCell(ed.r, ed.c);
  }
  syncFormulaBar();
  scheduleRender();
}
function cancelEdit(){
  const ed = state.editing;
  if (!ed) return;
  state.editing = null;
  state.point = null;
  state.preview = null;
  if (ed.kind === 'cell'){ dom.editor.style.display = 'none'; dom.editor.value = ''; }
  else { dom.formula.value = currentRaw(ed.r, ed.c); }
  syncFormulaBar();
  scheduleRender();
}

/* ---- reference token handling (click / drag to insert refs) ---- */
const REF_WORDS = /^(TRUE|FALSE|AND|OR|NOT|SUM|MIN|MAX|AVG|COUNT|COUNTA|IF|IFERROR|ROUND|ROUNDUP|ROUNDDOWN|ABS|MOD|PI|RAND|INT|TRUNC|POWER|SQRT|EXP|LN|LOG|PRODUCT|MEDIAN|STDEV|SUMIF|COUNTIF|CONCAT|CONCATENATE|LEN|LEFT|RIGHT|MID|UPPER|LOWER|TRIM|VALUE|TODAY|NOW|SIGN|SIN|COS|TAN|PI|SQRT)$/;

function findRefTokenAtCaret(value, caret){
  const upto = value.slice(0, caret);
  const m = /(\$?[A-Za-z]{1,3}\$?\d{0,7})$/.exec(upto);
  if (!m) return null;
  const token = m[1];
  const start = caret - token.length;
  const before = start > 0 ? value[start - 1] : '';
  const after = caret < value.length ? value[caret] : '';
  if (before && /[A-Za-z0-9_$]/.test(before)) return null;
  if (after && /[A-Za-z0-9_$]/.test(after)) return null;
  if (after === '(') return null;
  if (!/\d/.test(token)){
    if (before === '(') return null;
    if (REF_WORDS.test(token)) return null;
  }
  return { start, end:caret };
}
function syncToken(){
  const ed = state.editing;
  if (!ed) return;
  const caret = ed.el.selectionStart;
  const tok = findRefTokenAtCaret(ed.el.value, caret);
  ed.tokenStart = tok ? tok.start : caret;
  ed.tokenEnd = tok ? tok.end : caret;
  highlightTokenRange();
}
/** outline the ranges referenced by the formula being edited */
const rangeBoxes = [];
function hideRangeBoxes(){
  for (const b of rangeBoxes) b.style.display = 'none';
}
function highlightTokenRange(){
  hideRangeBoxes();
  const ed = state.editing;
  if (!ed || state.point) return;
  const text = ed.el.value;
  const ranges = [];
  const push = rng => {
    if (!rng) return;
    for (const r of ranges) if (r.r1===rng.r1&&r.c1===rng.c1&&r.r2===rng.r2&&r.c2===rng.c2) return;
    ranges.push(rng);
  };
  const start = Math.min(ed.tokenStart, ed.tokenEnd);
  const end = Math.max(ed.tokenStart, ed.tokenEnd);
  const tok = text.slice(start, end);
  if (tok.indexOf(':') >= 0) push(addrRange(tok));
  const re = /(\$?[A-Za-z]{1,3}\$?\d{1,7}):(\$?[A-Za-z]{1,3}\$?\d{1,7})/g;
  let m;
  while ((m = re.exec(text)) !== null) push(addrRange(m[1] + ':' + m[2]));
  if (!ranges.length) return;
  const mm = metrics(activeSheet());
  ranges.forEach((rng, i) => {
    let box = rangeBoxes[i];
    if (!box){
      box = document.createElement('div');
      box.className = 'preview-box';
      dom.overlay.appendChild(box);
      rangeBoxes[i] = box;
    }
    const x = mm.colX[rng.c1], y = mm.rowY[rng.r1];
    box.style.display = 'block';
    box.style.left = x + 'px';
    box.style.top = y + 'px';
    box.style.width = (mm.colX[rng.c2 + 1] - x) + 'px';
    box.style.height = (mm.rowY[rng.r2 + 1] - y) + 'px';
  });
}
function refText(r1, c1, r2, c2){
  const a = normSel({ r:r1, c:c1 }, { r:r2, c:c2 });
  if (a.r1 === a.r2 && a.c1 === a.c2) return addr(a.r1, a.c1);
  return addr(a.r1, a.c1) + ':' + addr(a.r2, a.c2);
}
function insertRefText(text){
  const ed = state.editing;
  if (!ed) return;
  const value = ed.el.value;
  const start = Math.min(ed.tokenStart, ed.tokenEnd);
  const end = Math.max(ed.tokenStart, ed.tokenEnd);
  const next = value.slice(0, start) + text + value.slice(end);
  ed.el.value = next;
  const caret = start + text.length;
  try { ed.el.setSelectionRange(caret, caret); } catch (e){}
  // the freshly inserted reference becomes the token that the next
  // click / drag replaces (same behaviour as pointing in Excel)
  ed.tokenStart = start;
  ed.tokenEnd = caret;
  ed.dirty = true;
  updatePreview();
  if (ed.kind === 'cell') placeEditor(ed.r, ed.c);
}
function updatePointRef(){
  const ed = state.editing;
  if (!ed || !state.point) return;
  const p = state.point;
  insertRefText(refText(p.r1, p.c1, p.r2, p.c2));
  renderOverlay();
}
function updatePreview(){
  const ed = state.editing;
  if (!ed){ state.preview = null; return; }
  const text = ed.el.value;
  if (!isFormulaText(text)){ state.preview = null; renderOverlay(); return; }
  const sheet = activeSheet();
  const key = cellKey(ed.r, ed.c);
  let out = null;
  try {
    const ast = parseFormula(text.slice(1), sheet);
    const memo = new Map();
    const inProg = new Set();
    const get = (r, c) => {
      const k = cellKey(r, c);
      if (k === key) return ERR('#CIRCULAR!');
      if (memo.has(k)) return memo.get(k);
      const cell = sheet.cells.get(k);
      if (!cell || !cell.ast){ const v = cell ? cell.value : null; memo.set(k, v); return v; }
      if (inProg.has(k)) return ERR('#CIRCULAR!');
      inProg.add(k);
      let o; try { o = evalNode(cell.ast, { get }); } catch (e){ o = ERR('#VALUE!'); }
      inProg.delete(k); memo.set(k, o);
      return o;
    };
    const v = evalNode(ast, { get });
    out = isErr(v) ? v.__err : formatValue(v);
  } catch (e){ out = null; }
  if (out === null){ state.preview = null; }
  else state.preview = { key, text: out };
  refreshCell(ed.r, ed.c);
  renderOverlay();
}

/* ==================== pointer interaction ============================ */
function cellFromEvent(e){
  const rect = dom.scroller.getBoundingClientRect();
  const x = e.clientX - rect.left + dom.scroller.scrollLeft;
  const y = e.clientY - rect.top + dom.scroller.scrollTop;
  return { r: rowAt(y), c: colAt(x), x, y };
}

dom.cellLayer.addEventListener('mousedown', onCellMouseDown);
function onCellMouseDown(e){
  if (e.button !== 0) return;
  const { r, c } = cellFromEvent(e);
  const sheet = activeSheet();

  // point mode: an editor holds a formula and the user clicks a cell
  if (state.editing && isFormulaText(state.editing.el.value)){
    e.preventDefault();
    state.point = { r1:r, c1:c, r2:r, c2:c };
    state.drag = { type:'point' };
    updatePointRef();
    return;
  }
  if (state.editing) commitEdit(false);

  const shift = e.shiftKey;
  if (shift){
    const anchor = state.selAnchor || { r:sheet.sel.r1, c:sheet.sel.c1 };
    state.selAnchor = anchor;
    setSelection(normSel(anchor, { r, c }), { r, c });
  } else {
    state.selAnchor = { r, c };
    setSelection({ r1:r, c1:c, r2:r, c2:c }, { r, c });
    state.drag = { type:'select', anchor:{ r, c } };
  }
  dom.scroller.focus({ preventScroll:true });
  e.preventDefault();
}
dom.cellLayer.addEventListener('dblclick', onCellDblClick);
function onCellDblClick(e){
  const { r, c } = cellFromEvent(e);
  const sheet = activeSheet();
  if (sheet.cursor.r !== r || sheet.cursor.c !== c)
    setSelection({ r1:r, c1:c, r2:r, c2:c }, { r, c });
  startCellEdit(undefined, false);
}

document.addEventListener('mousemove', onDocMouseMove);
function onDocMouseMove(e){
  const d = state.drag;
  if (!d) return;
  if (d.type === 'select' || d.type === 'point'){
    const { r, c } = cellFromEvent(e);
    if (d.type === 'select'){
      const sheet = activeSheet();
      setSelection(normSel(d.anchor, { r, c }), { r, c });
    } else {
      if (!state.point) return;
      state.point.r2 = r; state.point.c2 = c;
      updatePointRef();
    }
  } else if (d.type === 'colresize'){
    const m = metrics(activeSheet());
    const x = e.clientX - dom.colStrip.getBoundingClientRect().left + dom.scroller.scrollLeft;
    const w = clamp(Math.round(x - m.colX[d.col]), 24, 600);
    activeSheet().colW.set(d.col, w);
    invalidateMetrics();
    scheduleRender();
  } else if (d.type === 'rowresize'){
    const m = metrics(activeSheet());
    const y = e.clientY - dom.rowStrip.getBoundingClientRect().top + dom.scroller.scrollTop;
    const h = clamp(Math.round(y - m.rowY[d.row]), 14, 300);
    activeSheet().rowH.set(d.row, h);
    invalidateMetrics();
    scheduleRender();
  }
}
document.addEventListener('mouseup', onDocMouseUp);
function onDocMouseUp(){
  if (state.drag && (state.drag.type === 'select' || state.drag.type === 'point')){
    state.drag = null;
    if (state.point){
      // keep the highlighted range visible but stop pointing
      const ed = state.editing;
      if (ed && ed.kind === 'cell') placeEditor(ed.r, ed.c);
    }
  } else {
    state.drag = null;
  }
}

/* ---- column headers ---- */
function onColHeaderDown(e){
  const node = e.currentTarget;
  const idx = Array.from(colEls.entries()).find(([, n]) => n === node);
  const col = idx ? idx[0] : 0;
  if (e.target.classList.contains('grip')){
    e.preventDefault();
    state.drag = { type:'colresize', col };
    return;
  }
  const sheet = activeSheet();
  state.selAnchor = { r:0, c:col };
  setSelection({ r1:0, c1:col, r2:MAX_ROWS - 1, c2:col }, { r:sheet.cursor.r, c:col });
  state.drag = { type:'selectcols', anchor:col };
  e.preventDefault();
}
function onColHeaderDblClick(e){
  if (e.target.classList.contains('grip')){
    const idx = Array.from(colEls.entries()).find(([, n]) => n === e.currentTarget);
    if (idx) autoFitColumn(idx[0]);
  }
}
document.addEventListener('mousemove', onDocMouseMoveCol);
function onDocMouseMoveCol(e){
  const d = state.drag;
  if (d && d.type === 'selectcols'){
    const x = e.clientX - dom.colStrip.getBoundingClientRect().left + dom.scroller.scrollLeft;
    const col = colAt(x);
    const sheet = activeSheet();
    setSelection({ r1:0, c1:Math.min(d.anchor, col), r2:MAX_ROWS - 1, c2:Math.max(d.anchor, col) },
                 { r:sheet.cursor.r, c:sheet.cursor.c });
  }
}
function autoFitColumn(c){
  const sheet = activeSheet();
  let max = 40;
  const m = metrics(sheet);
  for (const [k, cell] of sheet.cells){
    if (keyCol(k) !== c) continue;
    const txt = formatValue(cell.value);
