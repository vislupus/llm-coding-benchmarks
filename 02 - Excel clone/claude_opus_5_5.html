<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1D6B48; --accent-strong:#15553A; --accent-soft:#E1F0E7;
  --bg:#FFFFFF; --chrome:#F6F7F7; --chrome-2:#ECEEEE; --line:#D9DCDD; --grid:#E2E5E6;
  --head:#F3F4F4; --head-text:#5A6166; --head-sel:#D3E8DB; --head-sel-text:#124A31;
  --text:#1D2124; --muted:#646B70; --hover:#E7EAEA; --sel-fill:rgba(29,107,72,.10);
  --pop:#FFFFFF; --pop-shadow:0 10px 30px rgba(16,32,24,.18),0 1px 3px rgba(16,32,24,.12);
  --danger:#B42318; --toast-bg:#1D2124; --toast-text:#F4F6F6;
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#3FAE78; --accent-strong:#6BD19D; --accent-soft:#1F3A2C;
    --bg:#1B1E20; --chrome:#222628; --chrome-2:#2A2F31; --line:#3A4043; --grid:#2F3437;
    --head:#24292B; --head-text:#A2AAAF; --head-sel:#244434; --head-sel-text:#9BE0BB;
    --text:#E4E7E8; --muted:#9AA2A6; --hover:#30363A; --sel-fill:rgba(63,174,120,.17);
    --pop:#272C2E; --pop-shadow:0 10px 30px rgba(0,0,0,.55);
    --danger:#F97066; --toast-bg:#E4E7E8; --toast-text:#1B1E20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent:#3FAE78; --accent-strong:#6BD19D; --accent-soft:#1F3A2C;
  --bg:#1B1E20; --chrome:#222628; --chrome-2:#2A2F31; --line:#3A4043; --grid:#2F3437;
  --head:#24292B; --head-text:#A2AAAF; --head-sel:#244434; --head-sel-text:#9BE0BB;
  --text:#E4E7E8; --muted:#9AA2A6; --hover:#30363A; --sel-fill:rgba(63,174,120,.17);
  --pop:#272C2E; --pop-shadow:0 10px 30px rgba(0,0,0,.55);
  --danger:#F97066; --toast-bg:#E4E7E8; --toast-text:#1B1E20;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--chrome)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* App bar */
.appbar{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;background:var(--chrome);flex:none}
.brand{width:24px;height:24px;flex:none}
#title{font:500 15px/1 var(--font);color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;min-width:0;width:min(360px,50vw)}
#title:hover{border-color:var(--line)}
#title:focus{outline:none;border-color:var(--accent);background:var(--bg)}
#saveState{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
.tb{height:30px;min-width:30px;border:0;border-radius:6px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;cursor:pointer;white-space:nowrap;flex:none}
.tb:hover{background:var(--hover)}
.tb:disabled{opacity:.38;cursor:default;background:transparent}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong)}
.tb:focus-visible,.tab:focus-visible,#nameBox:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tb .glyph{font-size:15px;width:18px;text-align:center}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.grow{flex:1 1 auto;min-width:8px}
.split{display:inline-flex;flex:none}
.split .tb:first-child{border-radius:6px 0 0 6px;padding-right:4px}
.split .tb.caret{border-radius:0 6px 6px 0;min-width:18px;padding:0 3px}
.split .tb.caret svg{width:12px;height:12px}
.ic{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.cbar{display:block;width:18px;height:4px;border-radius:1px;margin-top:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ic svg{width:16px;height:16px}

/* Formula bar */
.fbar{display:flex;align-items:stretch;height:34px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
#nameBox{width:92px;border:0;border-right:1px solid var(--line);padding:0 10px;font:500 13px var(--font);color:var(--text);background:transparent}
#nameBox:focus{outline:none;background:var(--accent-soft)}
.fx{width:40px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font:italic 600 14px Georgia,"Times New Roman",serif;cursor:pointer}
.fx:hover{background:var(--hover);color:var(--accent-strong)}
#formula{flex:1;min-width:0;border:0;padding:0 10px;font:13px var(--font);color:var(--text);background:transparent}
#formula:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}

/* Grid */
#gridWrap{flex:1 1 auto;min-height:0;overflow:auto;position:relative;outline:none;background:var(--bg);overscroll-behavior:contain}
#gridInner{position:relative;width:max-content;min-width:100%}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
#grid th,#grid td{height:24px;padding:0 6px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:22px}
#grid td{cursor:cell;color:var(--text)}
#grid thead th{position:sticky;top:0;z-index:6;background:var(--head);color:var(--head-text);font-weight:500;font-size:12px;text-align:center;border-color:var(--line);cursor:s-resize}
#grid tbody th{position:sticky;left:0;z-index:5;background:var(--head);color:var(--head-text);font-weight:500;font-size:12px;text-align:center;border-color:var(--line);cursor:e-resize;padding:0 2px}
#grid thead th.corner{left:0;z-index:7;cursor:pointer}
#grid thead th.corner::after{content:"";position:absolute;right:3px;bottom:3px;border:5px solid transparent;border-right-color:var(--line);border-bottom-color:var(--line)}
#grid thead th.hs{background:var(--head-sel);color:var(--head-sel-text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
#grid tbody th.hs{background:var(--head-sel);color:var(--head-sel-text);font-weight:600;box-shadow:inset -2px 0 0 var(--accent)}
.rz{position:absolute;right:0;top:0;width:7px;height:100%;cursor:col-resize;touch-action:none;z-index:2}
.rz:hover,.rz.active{background:var(--accent)}

.box{position:absolute;display:none;pointer-events:none;z-index:3}
#selBox{border:1px solid var(--accent);background:var(--sel-fill)}
#activeBox{border:2px solid var(--accent)}
#activeBox.thin{border-width:1px;border-color:var(--accent-strong)}
#copyBox{border:2px dashed var(--accent)}
.refbox{position:absolute;pointer-events:none;z-index:3;border:2px solid}
.refbox.pt{border-style:dashed}
#cellEditor{position:absolute;z-index:4;display:none;border:2px solid var(--accent);outline:none;padding:0 5px;font:13px var(--font);color:var(--text);background:var(--bg);box-shadow:0 3px 10px rgba(0,0,0,.18)}
#cellEditor.show{display:block}

/* Sheet bar */
.sheetbar{display:flex;align-items:stretch;height:36px;border-top:1px solid var(--line);background:var(--chrome);flex:none}
#addSheet{border:0;border-right:1px solid var(--line);background:transparent;width:38px;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--muted)}
#addSheet:hover{background:var(--hover);color:var(--accent-strong)}
#tabs{display:flex;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:4px;padding:0 14px;border-right:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;flex:none;outline:none}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.active{background:var(--bg);color:var(--accent-strong);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent);padding-right:6px}
.tmenu{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;color:var(--muted)}
.tmenu:hover{background:var(--hover);color:var(--text)}
.tmenu svg{width:13px;height:13px}
.trename{font:600 13px var(--font);color:var(--text);background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:2px 5px;outline:none}
#status{margin-left:auto;display:flex;align-items:center;gap:16px;padding:0 14px;color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
#status b{color:var(--text);font-weight:500}

/* Popovers */
.pop{position:fixed;z-index:100;background:var(--pop);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop-shadow);padding:4px;display:none;min-width:170px}
.pop.show{display:block}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 12px;border:0;background:none;border-radius:5px;cursor:pointer}
.pop .mi:hover:not(:disabled){background:var(--hover)}
.pop .mi:disabled{opacity:.4;cursor:default}
.pop .mi.danger{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pal{padding:8px;width:236px}
.pal .none{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:transparent;cursor:pointer;text-align:left;margin-bottom:8px}
.pal .none:hover{background:var(--hover)}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.sw button{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0}
.sw button:hover{transform:scale(1.12);box-shadow:0 0 0 2px var(--accent)}
.pcustom{display:flex;align-items:center;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:12px}
.pcustom input{width:44px;height:24px;border:1px solid var(--line);border-radius:4px;background:transparent;padding:1px;cursor:pointer}
.fnlist{width:300px;max-height:min(360px,60vh);overflow:auto}
.fnlist .mi{display:grid;grid-template-columns:78px 1fr;gap:2px 10px}
.fnlist .mi b{font-weight:600;color:var(--accent-strong)}
.fnlist .mi span{color:var(--muted)}
.fnlist .mi small{grid-column:2;color:var(--muted);opacity:.8}
.fnhead{padding:6px 12px 4px;color:var(--muted);font-size:12px}

#toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--toast-bg);color:var(--toast-text);padding:9px 14px;border-radius:8px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;z-index:200;max-width:calc(100vw - 24px);transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
@media (prefers-reduced-motion: reduce){#toast{transition:none}.sw button:hover{transform:none}}

@media (max-width:720px){
  .tb .lbl{display:none}
  #saveState{display:none}
  #nameBox{width:64px;padding:0 8px}
  #status .opt{display:none}
}
</style>
</head>
<body>
<header class="appbar">
  <svg class="brand" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="var(--accent)"/><path d="M2 9.5h20M2 15.5h20M9 2v20" stroke="var(--bg)" stroke-width="1.6"/><rect x="9.8" y="10.3" width="11.4" height="4.4" fill="var(--bg)" opacity=".55"/></svg>
  <input id="title" aria-label="Workbook name" spellcheck="false">
  <span id="saveState">Changes save in this browser</span>
</header>

<div class="toolbar" role="toolbar" aria-label="Formatting">
  <button class="tb" data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="tb" data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="sep"></span>
  <button class="tb" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><span class="glyph" style="font-weight:700">B</span></button>
  <button class="tb" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><span class="glyph" style="font-style:italic;font-family:Georgia,serif">I</span></button>
  <button class="tb" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><span class="glyph" style="text-decoration:underline">U</span></button>
  <span class="sep"></span>
  <div class="split">
    <button class="tb" data-cmd="fill" title="Fill color" aria-label="Fill color"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg><span class="cbar" id="fillBar"></span></span></button>
    <button class="tb caret" data-cmd="fillMenu" title="Choose fill color" aria-label="Choose fill color" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="split">
    <button class="tb" data-cmd="ink" title="Text color" aria-label="Text color"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="m5 17 7-14 7 14"/><path d="M8 11.5h8"/></svg><span class="cbar" id="inkBar"></span></span></button>
    <button class="tb caret" data-cmd="inkMenu" title="Choose text color" aria-label="Choose text color" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <span class="sep"></span>
  <button class="tb" data-cmd="alignL" title="Align left" aria-label="Align left" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
  <button class="tb" data-cmd="alignC" title="Center" aria-label="Center" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
  <button class="tb" data-cmd="alignR" title="Align right" aria-label="Align right" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
  <span class="sep"></span>
  <button class="tb" data-cmd="clear" title="Clear contents (Delete)"><svg class="i" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span class="lbl">Clear</span></button>
  <span class="grow"></span>
  <button class="tb" data-cmd="upload" title="Load a CSV file into this sheet"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span class="lbl">Upload CSV</span></button>
  <button class="tb" data-cmd="download" title="Download this sheet as CSV"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span class="lbl">Download CSV</span></button>
  <input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv" hidden>
</div>

<div class="fbar">
  <input id="nameBox" aria-label="Cell address" spellcheck="false" autocomplete="off">
  <button class="fx" id="fxBtn" title="Insert a function" aria-label="Insert a function">fx</button>
  <input id="formula" aria-label="Cell contents" spellcheck="false" autocomplete="off">
</div>

<main id="gridWrap" tabindex="0" aria-label="Spreadsheet grid">
  <div id="gridInner">
    <div id="selBox" class="box"></div>
    <div id="copyBox" class="box"></div>
    <div id="refLayer"></div>
    <div id="activeBox" class="box"></div>
    <input id="cellEditor" spellcheck="false" autocomplete="off" aria-label="Edit cell">
  </div>
</main>

<footer class="sheetbar">
  <button id="addSheet" title="Add sheet" aria-label="Add sheet"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="tabs" role="tablist" aria-label="Sheets"></div>
  <div id="status" aria-live="polite"></div>
</footer>

<div id="pop" class="pop" role="menu"></div>
<div id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(() => {
'use strict';

/* ================= Constants & helpers ================= */
const ROWS0 = 200, COLS0 = 40, MAXR = 2000, MAXC = 120;
const DEF_W = 96, HEAD_W = 46, MIN_W = 32;
const STORE = 'gridbook.workbook.v1';
const REF_COLORS = ['#2F6FDE', '#D9480F', '#7C3AED', '#0F9D6B', '#D6336C', '#B7791F'];
const SWATCHES = ['#FFF4CC','#FDE3D3','#E2F0D9','#DCEBF7','#ECE6F5','#F9D9DC','#E7E7E7','#FFFFFF',
                  '#FFD966','#F4B183','#A9D08E','#9DC3E6','#B4A7D6','#EA9999','#BFBFBF','#808080',
                  '#BF8F00','#C55A11','#548235','#2F5597','#5B3F9E','#C00000','#404040','#000000'];
const $ = s => document.querySelector(s);
const wrap = $('#gridWrap'), inner = $('#gridInner'), fbar = $('#formula'), nameBox = $('#nameBox');
const cellEditor = $('#cellEditor'), selBox = $('#selBox'), activeBox = $('#activeBox'), copyBox = $('#copyBox');
const refLayer = $('#refLayer'), tabsEl = $('#tabs'), statusEl = $('#status'), pop = $('#pop');

function colName(c){ let s = ''; c++; while (c > 0){ const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }
function colIndex(s){ let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
const key = (r, c) => r + ',' + c;
const splitKey = k => { const i = k.indexOf(','); return [+k.slice(0, i), +k.slice(i + 1)]; };
const addr = (r, c) => colName(c) + (r + 1);
function parseAddr(s){ const m = /^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(String(s).trim()); if (!m || +m[2] < 1) return null; return { r: +m[2] - 1, c: colIndex(m[1]) }; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function cloneCell(c){ if (!c) return undefined; const n = { v: c.v == null ? '' : c.v }; if (c.s && Object.keys(c.s).length) n.s = { ...c.s }; return n; }
function isBlank(c){ return !c || ((c.v === '' || c.v == null) && (!c.s || !Object.keys(c.s).length)); }

/* ================= Formula engine ================= */
class FErr { constructor(code){ this.code = code; } toString(){ return this.code; } }
const E = code => new FErr(code);

function tokenize(src, loose){
  const out = []; let i = 0; const n = src.length;
  try {
    while (i < n){
      const ch = src[i];
      if (/\s/.test(ch)){ i++; continue; }
      const rest = src.slice(i); let m;
      if (ch === '"'){
        let j = i + 1, s = '';
        while (j < n){ if (src[j] === '"'){ if (src[j + 1] === '"'){ s += '"'; j += 2; continue; } break; } s += src[j++]; }
        if (j >= n) throw E('#ERROR!');
        out.push({ t: 'str', v: s, s: i, e: j + 1 }); i = j + 1; continue;
      }
      if (ch === "'"){
        const j = src.indexOf("'", i + 1);
        if (j < 0 || src[j + 1] !== '!') throw E('#ERROR!');
        out.push({ t: 'sheet', v: src.slice(i + 1, j), s: i, e: j + 2 }); i = j + 2; continue;
      }
      if (ch === '#' && (m = /^#(REF!|DIV\/0!|VALUE!|NAME\?|N\/A|NUM!|CIRC!|ERROR!)/.exec(rest))){
        out.push({ t: 'err', v: m[0], s: i, e: i + m[0].length }); i += m[0].length; continue;
      }
      if ((m = /^(\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/.exec(rest))){
        out.push({ t: 'num', v: parseFloat(m[0]), s: i, e: i + m[0].length }); i += m[0].length; continue;
      }
      if ((m = /^[A-Za-z_][A-Za-z0-9_.]*!/.exec(rest))){

      }

function jump(r, c, dr, dc){
  const sh = S();
  const has = (r, c) => { const x = sh.cells[key(r, c)]; return !!(x && x.v !== ''); };
  const inb = (r, c) => r >= 0 && c >= 0 && r < sh.rows && c < sh.cols;
  let nr = r + dr, nc = c + dc;
  if (!inb(nr, nc)) return [r, c];
  if (has(r, c) && has(nr, nc)){ while (inb(nr + dr, nc + dc) && has(nr + dr, nc + dc)){ nr += dr; nc += dc; } return [nr, nc]; }
  while (inb(nr, nc) && !has(nr, nc)){ nr += dr; nc += dc; }
  if (!inb(nr, nc)){ nr -= dr; nc -= dc; }
  return [nr, nc];
}
wrap.addEventListener('keydown', e => {
  if (ed || e.target !== wrap) return;
  const ctrl = e.ctrlKey || e.metaKey, sh = S();
  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (ARROWS[e.key]){
    e.preventDefault();
    const [dr, dc] = ARROWS[e.key];
    if (e.shiftKey){ const [fr, fc] = ctrl ? jump(sel.fr, sel.fc, dr, dc) : [sel.fr + dr, sel.fc + dc]; setSel(sel.ar, sel.ac, fr, fc); }
    else { const [r, c] = ctrl ? jump(sel.ar, sel.ac, dr, dc) : [sel.ar + dr, sel.ac + dc]; setSel(r, c); }
    return;
  }
  if (ctrl){
    const k = e.key.toLowerCase();
    if (k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'y'){ e.preventDefault(); redo(); }
    else if (k === 'b'){ e.preventDefault(); toggleStyle('b'); }
    else if (k === 'i'){ e.preventDefault(); toggleStyle('i'); }
    else if (k === 'u'){ e.preventDefault(); toggleStyle('u'); }
    else if (k === 'a'){ e.preventDefault(); setSel(0, 0, sh.rows - 1, sh.cols - 1, false); }
    else if (e.key === 'Home'){ e.preventDefault(); setSel(0, 0); }
    return;
  }
  const page = Math.max(1, Math.floor(wrap.clientHeight / 25) - 2);
  switch (e.key){
    case 'Enter': e.preventDefault(); setSel(sel.ar + (e.shiftKey ? -1 : 1), sel.ac); return;
    case 'Tab': e.preventDefault(); setSel(sel.ar, sel.ac + (e.shiftKey ? -1 : 1)); return;
    case 'Home': e.preventDefault(); setSel(sel.ar, 0); return;

});

let clip = null;

function doCopy(dt, cut){
  const q = selRect(), sh = S(), cells = [], lines = [];
  for (let r = q.r1; r <= q.r2; r++){
    const row = [], line = [];
    for (let c = q.c1; c <= q.c2; c++){ row.push(cloneCell(sh.cells[key(r, c)]) || null); line.push(tsvField(display(valueAt(sh, r, c)))); }
    cells.push(row); lines.push(line.join('\t'));

}
function doPaste(text){
  const sh = S(), q = selRect();
  const internal = !!(clip && text === clip.text);
  let grid;
  if (internal) grid = clip.cells;
  else {
    if (!text) return;
    grid = parseDelimited(text.replace(/\r?\n$/, ''), text.includes('\t') ? '\t' : detectDelim(text)).map(row => row.map(v => v === '' ? null : { v }));
  }
  const h = grid.length, w = grid.reduce((m, r) => Math.max(m, r.length), 0);
  if (!h || !w) return;
  const selH = q.r2 - q.r1 + 1, selW = q.c2 - q.c1 + 1, cut = internal && clip.cut;
  const H = !cut && selH % h === 0 ? selH : h, W = !cut && selW % w === 0 ? selW : w;
  const changes = [], touched = new Set();
  for (let i = 0; i < H; i++) for (let j = 0; j < W; j++){
    const r = q.r1 + i, c = q.c1 + j;
    if (r >= sh.rows || c >= sh.cols) continue;
    const src = grid[i % h][j % w], k = key(r, c), before = sh.cells[k];
    touched.add(k);
    let after = cloneCell(src);
    if (after && internal && !cut && typeof after.v === 'string' && after.v[0] === '=')
      after.v = shiftFormula(after.v, r - (clip.r1 + i % h), c - (clip.c1 + j % w));

    changes.push({ k, before, after: isBlank(after) ? undefined : after });

    if (clip.sh === sh) forRect(clip, (r, c) => { const k = key(r, c); if (!touched.has(k) && sh.cells[k]) changes.push({ k, before: sh.cells[k], after: undefined }); });
    clip = null;
  }
  applyChanges(sh, changes);

/* ================= CSV ================= */
function parseDelimited(text, d){
  const rows = []; let row = [], f = '', i = 0, q = false; const n = text.length;
  while (i < n){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += ch; i++; continue;
    }
    if (ch === '"' && f === ''){ q = true; i++; continue; }
    if (ch === d){ row.push(f); f = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += ch; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function detectDelim(text){
  const first = text.split(/\r?\n/, 1)[0] || '';
  const count = ch => { let n = 0, q = false; for (const x of first){ if (x === '"') q = !q; else if (!q && x === ch) n++; } return n; };
  const cands = [[',', count(',')], [';', count(';')], ['\t', count('\t')]].sort((a, b) => b[1] - a[1]);
  return cands[0][1] ? cands[0][0] : ',';
}
function importCSV(text, fname){
  text = text.replace(/^\uFEFF/, '');
  const rows = parseDelimited(text, detectDelim(text));
  while (rows.length && rows[rows.length - 1].every(v => v === '')) rows.pop();
  if (!rows.length){ toast(`${fname} doesn’t contain any rows.`); return; }
  const sh = S();
  let R = rows.length, C = rows.reduce((m, r) => Math.max(m, r.length), 0), trimmed = false;
  if (R > MAXR){ R = MAXR; trimmed = true; }
  if (C > MAXC){ C = MAXC; trimmed = true; }
  const changes = [], byKey = new Map();
  for (const k in sh.cells){ const ch = { k, before: sh.cells[k], after: undefined }; changes.push(ch); byKey.set(k, ch); }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
    const v = rows[r][c]; if (v == null || v === '') continue;
    const k = key(r, c), ex = byKey.get(k);
    if (ex) ex.after = { v }; else changes.push({ k, before: undefined, after: { v } });
  }
  if (R > sh.rows - 20 || C > sh.cols){
    saveView();
    sh.rows = clamp(Math.max(sh.rows, R + 50), ROWS0, MAXR);
    sh.cols = clamp(Math.max(sh.cols, C + 5), COLS0, MAXC);
    buildGrid();
  }
  clip = null;
  applyChanges(sh, changes);
  setSel(0, 0);
  toast(`Loaded ${R} row${R === 1 ? '' : 's'} from ${fname}${trimmed ? ' — trimmed to fit the grid' : ''}`, 'Undo', undo);
}

let downloadsP = null;
function getDownloads(){
  if (!downloadsP){
    try {
      downloadsP = window.claude && typeof window.claude.use === 'function'
        ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
        : Promise.resolve(null);
    } catch (e){ downloadsP = Promise.resolve(null); }
  }
  return downloadsP;
}
function csvField(s){ return /[",\r\n]/.test(s) || /^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function fallbackDownload(filename, data){
  const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function downloadCSV(){
  const sh = S(); let mr = -1, mc = -1;
  for (const k in sh.cells){ if (sh.cells[k].v === '' || sh.cells[k].v == null) continue; const [r, c] = splitKey(k); mr = Math.max(mr, r); mc = Math.max(mc, c); }
  if (mr < 0){ toast('This sheet is empty. Add some data, then download.'); return; }
  const lines = [];
  for (let r = 0; r <= mr; r++){ const line = []; for (let c = 0; c <= mc; c++) line.push(csvField(display(valueAt(sh, r, c)))); lines.push(line.join(',')); }
  const data = '\uFEFF' + lines.join('\r\n') + '\r\n';
  const filename = (sh.name.replace(/[^\w\- ]+/g, '_').trim() || 'sheet') + '.csv';
  const dl = await getDownloads();
  if (dl){
    try { await dl.save({ filename, data }); toast('Downloaded ' + filename); }
    catch (err){
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('A download is already waiting for your confirmation.');
      else toast('Downloads aren’t available here.');
    }
    return;
  }
  fallbackDownload(filename, data);
  toast('Downloaded ' + filename);
}

  let n = wb.sheets.length + 1; while (nameTaken('Sheet' + n)) n++;
  const sh = newSheet('Sheet' + n), idx = wb.active + 1;
  saveView(); wb.sheets.splice(idx, 0, sh); wb.active = idx;
  pushHistory({ kind: 'addSheet', sh, idx });
  showSheet(); wrap.focus({ preventScroll: true });
}
function duplicateSheet(i){
  const src = wb.sheets[i], base = src.name.replace(/ \(\d+\)$/, '').slice(0, 25);
  let n = 2; while (nameTaken(`${base} (${n})`)) n++;
  const sh = { name: `${base} (${n})`, cells: JSON.parse(JSON.stringify(src.cells)), colW: { ...src.colW }, rows: src.rows, cols: src.cols };
  saveView(); wb.sheets.splice(i + 1, 0, sh); wb.active = i + 1;
  pushHistory({ kind: 'addSheet', sh, idx: i + 1 });
  showSheet();
}
function deleteSheet(i){
  if (wb.sheets.length === 1){ toast('A workbook needs at least one sheet.'); return; }
  if (ed) commitEdit();
  const sh = wb.sheets[i];
  removeSheetAt(i);
  pushHistory({ kind: 'delSheet', sh, idx: i });
  showSheet();
  toast(`Deleted “${sh.name}”`, 'Undo', undo);
}
function validName(name, idx){
  if (!name) return 'Sheet names can’t be blank.';
  if (name.length > 31) return 'Sheet names can be up to 31 characters.';
  if (/[\\/?*[\]:']/.test(name)) return 'Sheet names can’t contain \\ / ? * [ ] : or \'.';
  if (nameTaken(name, idx)) return 'Another sheet already uses that name.';
  return null;
}
function renameSheet(idx, name, record = true){
  const sh = wb.sheets[idx]; if (!sh) return;
  const from = sh.name; if (from === name) return;
  rewriteSheetRefs(from, name);
  sh.name = name;
  if (record) pushHistory({ kind: 'rename', idx, from, to: name });
  renderTabs(); recalc();
}
const CARET = '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
function renderTabs(){
  tabsEl.textContent = '';
  wb.sheets.forEach((s, i) => {
    const t = document.createElement('div');
    t.className = 'tab' + (i === wb.active ? ' active' : '');
    t.dataset.i = i; t.tabIndex = 0;
    t.setAttribute('role', 'tab'); t.setAttribute('aria-selected', i === wb.active ? 'true' : 'false');
    t.title = 'Double-click to rename';
    const nm = document.createElement('span'); nm.className = 'tname'; nm.textContent = s.name; t.append(nm);
    if (i === wb.active){ const m = document.createElement('span'); m.className = 'tmenu'; m.title = 'Sheet options'; m.innerHTML = CARET; t.append(m); }
    tabsEl.append(t);
  });
  const act = tabsEl.children[wb.active];
  if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function openSheetMenu(i, rect){
  if (popKind === 'sheet'){ closePop(); return; }
  openMenu([
    { label: 'Rename', fn: () => startRename(i) },
    { label: 'Duplicate', fn: () => duplicateSheet(i) },
    '-',
    { label: 'Delete', danger: true, disabled: wb.sheets.length === 1, fn: () => deleteSheet(i) },
  ], rect, 'sheet');
}
function startRename(i){
  const tab = tabsEl.children[i]; if (!tab) return;
  const nm = tab.querySelector('.tname'), m = tab.querySelector('.tmenu');
  const inp = document.createElement('input');
  inp.className = 'trename'; inp.value = wb.sheets[i].name; inp.maxLength = 31; inp.size = Math.max(6, inp.value.length + 1);
  inp.setAttribute('aria-label', 'Sheet name');
  nm.replaceWith(inp); if (m) m.remove();
  inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const n = inp.value.trim();
    if (ok && n !== wb.sheets[i].name){ const err = validName(n, i); if (err) toast(err); else renameSheet(i, n); }
    renderTabs(); wrap.focus({ preventScroll: true });
  };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); finish(true); } else if (e.key === 'Escape'){ e.preventDefault(); finish(false); } });
  inp.addEventListener('input', () => { inp.size = Math.max(6, inp.value.length + 1); });
  inp.addEventListener('blur', () => finish(true));
  ['mousedown', 'click', 'dblclick'].forEach(ev => inp.addEventListener(ev, e => e.stopPropagation()));
}
tabsEl.addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  const i = +t.dataset.i;
  if (e.target.closest('.tmenu')){ openSheetMenu(i, t.getBoundingClientRect()); return; }
  switchSheet(i);
});
tabsEl.addEventListener('dblclick', e => { const t = e.target.closest('.tab'); if (t) startRename(+t.dataset.i); });
tabsEl.addEventListener('contextmenu', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  e.preventDefault();
  const i = +t.dataset.i; switchSheet(i);
  openSheetMenu(i, { left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY });
});
tabsEl.addEventListener('keydown', e => {
  const t = e.target.closest('.tab'); if (!t || e.target !== t) return;
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); switchSheet(+t.dataset.i); }
  else if (e.key === 'F2'){ e.preventDefault(); startRename(+t.dataset.i); }
});
$('#addSheet').addEventListener('click', addSheet);

/* ================= Name box & title ================= */
nameBox.addEventListener('focus', () => { if (ed) commitEdit(); nameBox.select(); });
nameBox.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    e.preventDefault();
    const [a, b] = nameBox.value.trim().split(':');
    const p = parseAddr(a || ''), q = b ? parseAddr(b) : p;
    if (p && q){ setSel(p.r, p.c, q.r, q.c); wrap.focus({ preventScroll: true }); }
    else toast('Type a cell like B3 or a range like A1:C10.');
  } else if (e.key === 'Escape'){ e.preventDefault(); nameBox.value = addr(sel.ar, sel.ac); wrap.focus({ preventScroll: true }); }
});
nameBox.addEventListener('blur', () => { nameBox.value = addr(sel.ar, sel.ac); });
const titleEl = $('#title');
titleEl.addEventListener('focus', () => { if (ed) commitEdit(); });
titleEl.addEventListener('input', () => { wb.title = titleEl.value; document.title = (wb.title || 'Untitled workbook') + ' — Spreadsheet'; scheduleSave(); });
titleEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape'){ e.preventDefault(); wrap.focus({ preventScroll: true }); } });

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg, actLabel, actFn){
  const el = $('#toast'), act = $('#toastAct');
  $('#toastMsg').textContent = msg;
  if (actLabel){ act.hidden = false; act.textContent = actLabel; act.onclick = () => { el.classList.remove('show'); actFn(); }; }
  else { act.hidden = true; act.onclick = null; }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

/* ================= Start ================= */
wb = load();
titleEl.value = wb.title;
document.title = (wb.title || 'Untitled workbook') + ' — Spreadsheet';
paintBars();
showSheet();
updateUndoButtons();
getDownloads();
wrap.focus({ preventScroll: true });
})();
</script>
