<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gridline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4f7f5'/%3E%3Crect x='4' y='4' width='10' height='10' rx='2' fill='%230e6b4f'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2' fill='%23c5d5cb'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2' fill='%23c5d5cb'/%3E%3Crect x='18' y='18' width='10' height='10' rx='2' fill='%23c5d5cb'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" />
<style>
  :root {
    --bg: #e6eee8;
    --panel: #ffffff;
    --ink: #1a2420;
    --muted: #5c6b63;
    --line: #d5e0d8;
    --header: #f3f6f4;
    --accent: #0e6b4f;
    --accent-ink: #f4fbf8;
    --danger: #9d3040;
    --butter: #f3e6bf;
    --sage: #d7ebda;
    --mist: #d5e4f5;
    --blush: #f6d6d6;
    --lilac: #e5def6;
    --peach: #f8e0cc;
    --row-w: 48px;
    --col-h: 30px;
    --row-h: 30px;
    --radius: 8px;
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel); }
  button, [role="button"] { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.38; }
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
  }
  .top {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 60px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: none; }
  .mark { width: 22px; height: 22px; }
  .mark rect { fill: var(--line); }
  .mark rect:first-child { fill: var(--accent); }
  .name { font-weight: 650; letter-spacing: -0.03em; font-size: 1.05rem; }
  .tag { color: var(--muted); font-size: 0.75rem; }
  .tools {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
    contain: paint;
  }
  .tools::-webkit-scrollbar { display: none; }
  .tray {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    background: var(--header);
    border: 1px solid var(--line);
    border-radius: 12px;
    flex: none;
  }
  .sep { width: 1px; height: 22px; background: var(--line); margin-inline: 3px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 44px;
    min-width: 44px;
    padding-inline: 8px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    font-size: 0.8125rem;
    font-weight: 550;
    flex: none;
  }
  .btn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .btn[data-on="true"] { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .label { white-space: nowrap; }
  .anchor { position: relative; }
  .pop {
    position: absolute;
    z-index: 40;
    top: calc(100% + 8px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 16px 40px color-mix(in srgb, var(--ink) 14%, transparent);
    padding: 10px;
  }
  .pop.help { right: 0; width: min(360px, 80vw); padding: 14px 16px 12px; }
  .pop h2 { margin: 0; font-size: 0.95rem; letter-spacing: -0.02em; }
  .pop ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .pop li { color: var(--muted); font-size: 0.8125rem; line-height: 1.45; }
  .pop code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem; color: var(--ink); background: var(--header); padding: 1px 4px; border-radius: 4px; }
  .swatches { display: flex; gap: 6px; }
  .swatch { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); padding: 0; background: var(--panel); }
  .swatch[data-on="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatch.none { background: linear-gradient(to bottom right, transparent 46%, var(--danger) 46%, var(--danger) 54%, transparent 54%), var(--panel); }
  .formula {
    display: flex;
    height: 44px;
    flex: none;
    border-bottom: 1px solid var(--line);
  }
  .formula[data-formula="true"] { box-shadow: inset 3px 0 0 var(--accent); }
  .namebox, .fx {
    flex: none;
    display: flex;
    align-items: center;
    border-right: 1px solid var(--line);
    background: var(--header);
  }
  .namebox { width: 84px; }
  .namebox input { text-align: center; font-weight: 600; font-size: 0.8125rem; }
  .fx { width: 36px; justify-content: center; color: var(--muted); font-size: 0.75rem; font-weight: 700; font-style: italic; }
  .namebox input, .fxbar, .editor, .rename {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    outline: none;
    width: 100%;
    height: 100%;
  }
  .fxbar {
    flex: 1;
    min-width: 0;
    padding: 0 12px;
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
  }
  .frame {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: var(--row-w) minmax(0, 1fr);
    grid-template-rows: var(--col-h) minmax(0, 1fr);
    background: var(--header);
  }
  .corner, .colclip, .rowclip { background: var(--header); color: var(--muted); }
  .corner {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: grid;
    place-items: center;
    padding: 0;
  }
  .colclip, .rowclip { overflow: hidden; position: relative; }
  .colclip { border-bottom: 1px solid var(--line); }
  .rowclip { border-right: 1px solid var(--line); }
  .col, .row {
    position: absolute;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    user-select: none;
    border-right: 1px solid var(--line);
  }
  .row { left: 0; right: 0; border-right: 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .col[data-sel="true"], .row[data-sel="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--header)); color: var(--accent); }
  .col[data-active="true"], .row[data-active="true"] { background: var(--accent); color: var(--accent-ink); }
  .resizer { position: absolute; top: 0; right: -3px; width: 8px; height: 100%; cursor: col-resize; z-index: 2; touch-action: none; }
  .body {
    overflow: auto;
    position: relative;
    background: var(--panel);
    outline: none;
    touch-action: pan-x pan-y;
    min-width: 0;
  }
  .canvas { position: relative; }
  .cell {
    position: absolute;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 8px;
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
    user-select: none;
    line-height: var(--row-h);
  }
  .cell[data-fill="butter"] { background: var(--butter); }
  .cell[data-fill="sage"] { background: var(--sage); }
  .cell[data-fill="mist"] { background: var(--mist); }
  .cell[data-fill="blush"] { background: var(--blush); }
  .cell[data-fill="lilac"] { background: var(--lilac); }
  .cell[data-fill="peach"] { background: var(--peach); }
  .cell[data-align="right"] { text-align: right; }
  .cell[data-align="center"] { text-align: center; }
  .cell[data-bold="true"] { font-weight: 700; }
  .cell[data-italic="true"] { font-style: italic; }
  .cell[data-error="true"] { color: var(--danger); font-weight: 600; }
  .cell.is-selected:not(.is-active)::after, .cell.is-point::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .cell.is-selected:not(.is-active)::after { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .cell.is-point::after { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .gframe { position: absolute; pointer-events: none; z-index: 3; }
  .gframe.range { box-shadow: inset 0 0 0 1px var(--accent); }
  .gframe.active { box-shadow: inset 0 0 0 2px var(--accent); z-index: 4; }
  .gframe.point { box-shadow: inset 0 0 0 2px var(--accent); outline: 1px dashed var(--accent); outline-offset: -3px; }
  .editor {
    position: absolute;
    z-index: 5;
    padding: 0 8px;
    font-size: 0.875rem;
    background: var(--panel);
    box-shadow: inset 0 0 0 2px var(--accent);
    line-height: var(--row-h);
  }
  .footer {
    flex: none;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    border-top: 1px solid var(--line);
    background: var(--header);
  }
  .tabs {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    min-width: 0;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
    height: 100%;
    padding-top: 6px;
    contain: paint;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 32px;
    max-width: 180px;
    padding: 0 8px 0 12px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--muted);
    font-size: 0.8125rem;
    flex: none;
  }
  .tab[data-active="true"] {
    background: var(--panel);
    color: var(--ink);
    border-color: var(--line);
    font-weight: 650;
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-x {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    display: grid;
    place-items: center;
  }
  .tab-x:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .rename { width: 120px; height: 26px; background: var(--panel); border-radius: 6px; padding: 0 6px; box-shadow: inset 0 0 0 1px var(--accent); }
  .add {
    width: 36px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    display: grid;
    place-items: center;
    flex: none;
  }
  .add:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .status {
    flex: none;
    max-width: 46%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }
  .file { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .help-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  @media (max-width: 760px) {
    .label, .tag, .status { display: none; }
    .namebox { width: 64px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="1.5"/><rect x="12" y="1" width="9" height="9" rx="1.5"/><rect x="1" y="12" width="9" height="9" rx="1.5"/><rect x="12" y="12" width="9" height="9" rx="1.5"/></svg>
      <span class="name">Gridline</span>
      <span class="tag">sheets</span>
    </div>
    <div class="tools">
      <div class="tray">
        <button class="btn" id="undo" type="button" aria-label="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="label">Undo</span></button>
        <button class="btn" id="redo" type="button" aria-label="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span class="label">Redo</span></button>
      </div>
      <div class="tray">
        <button class="btn" id="bold" type="button" aria-label="Bold"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></svg></button>
        <button class="btn" id="italic" type="button" aria-label="Italic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
        <span class="sep"></span>
        <button class="btn" id="align-left" type="button" aria-label="Align left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg></button>
        <button class="btn" id="align-center" type="button" aria-label="Align center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
        <button class="btn" id="align-right" type="button" aria-label="Align right"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg></button>
        <span class="sep"></span>
        <div class="anchor" id="fill-anchor">
          <button class="btn" id="fill" type="button" aria-label="Fill color"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 22a8 8 0 0 0 10-10"/></svg><span class="label">Fill</span></button>
        </div>
        <button class="btn" id="clear" type="button" aria-label="Clear contents"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span class="label">Clear</span></button>
      </div>
      <div class="tray">
        <button class="btn" id="csv-down" type="button" aria-label="Download CSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span class="label">CSV</span></button>
        <button class="btn" id="csv-up" type="button" aria-label="Upload CSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span class="label">Open</span></button>
      </div>
      <div class="anchor" id="help-anchor" style="margin-left:auto">
        <button class="btn" id="help" type="button" aria-label="Help"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
      </div>
    </div>
  </header>
  <div class="formula" id="formula-row">
    <div class="namebox"><input id="namebox" aria-label="Name box" spellcheck="false" /></div>
    <div class="fx">fx</div>
    <input id="formula" class="fxbar" aria-label="Formula bar" spellcheck="false" autocomplete="off" placeholder="Enter a value or =formula" />
  </div>
  <div class="frame">
    <button class="corner" id="corner" type="button" aria-label="Select all cells"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10h8V2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <div class="colclip" id="colclip"><div id="cols"></div></div>
    <div class="rowclip" id="rowclip"><div id="rows"></div></div>
    <div class="body" id="grid" role="grid" tabindex="0" aria-label="Spreadsheet">
      <div class="canvas" id="canvas">
        <div id="cells"></div>
        <div id="frames"></div>
        <input id="editor" class="editor" hidden spellcheck="false" autocomplete="off" aria-label="Cell editor" />
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="tabs" id="tabs" role="tablist" aria-label="Sheets"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </footer>
</div>
<input id="file" class="file" type="file" accept=".csv,text/csv" aria-label="Upload CSV file" />
<script>
const ROW_H = 30, COL_H = 30, ROW_W = 48, DEF_W = 112, MIN_W = 56, MAX_W = 420;
const MIN_ROWS = 36, MIN_COLS = 13, MAX_ROWS = 300, MAX_COLS = 40;
const FILLS = ["butter", "sage", "mist", "blush", "lilac", "peach"];
const FILL_SET = new Set(FILLS);
const CMP = new Set(["=", "<>", "<", ">", "<=", ">="]);
const FUNCS = new Set(["SUM", "AVERAGE", "MIN", "MAX", "COUNT", "IF", "ABS", "ROUND"]);
const NUMERIC = /^[+-]?(\d+\.?\d*|\.\d+)$/;
const STORAGE = "gridline.workbook.v1";

const $ = (id) => document.getElementById(id);
const gridEl = $("grid"), cellsEl = $("cells"), framesEl = $("frames"), canvasEl = $("canvas");
const colsEl = $("cols"), rowsEl = $("rows"), formulaEl = $("formula"), editorEl = $("editor");
const nameEl = $("namebox"), tabsEl = $("tabs"), statusEl = $("status");
const rangeFrame = document.createElement("div");
const activeFrame = document.createElement("div");
const pointFrame = document.createElement("div");
rangeFrame.className = "gframe range";
activeFrame.className = "gframe active";
pointFrame.className = "gframe point";
framesEl.append(rangeFrame, activeFrame, pointFrame);

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function colName(index) {
  let n = index + 1, s = "";
  while (n > 0) { const rem = (n - 1) % 26; s = String.fromCharCode(65 + rem) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function colIndex(col) {
  let n = 0;
  for (const ch of col.toUpperCase()) {
    const code = ch.charCodeAt(0);
    if (code < 65 || code > 90) return -1;
    n = n * 26 + (code - 64);
  }
  return n - 1;
}
function parseAddr(input) {
  const m = /^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(String(input).trim());
  if (!m) return null;
  const r = Number(m[2]);
  if (!Number.isInteger(r) || r < 1 || r > 10000) return null;
  const c = colIndex(m[1]);
  if (c < 0 || c > 200) return null;
  return { c, r: r - 1 };
}
function keyOf(c, r) { return colName(c) + (r + 1); }
function fmtAddr(a) { return keyOf(a.c, a.r); }
function fmtRange(a, b) { return a.c === b.c && a.r === b.r ? fmtAddr(a) : fmtAddr(a) + ":" + fmtAddr(b); }
function rectOf(a, b) {
  return { c1: Math.min(a.c, b.c), c2: Math.max(a.c, b.c), r1: Math.min(a.r, b.r), r2: Math.max(a.r, b.r) };
}
function inside(rect, c, r) { return c >= rect.c1 && c <= rect.c2 && r >= rect.r1 && r <= rect.r2; }
function cleanStyle(style) {
  if (!style) return undefined;
  const next = {};
  if (style.bold) next.bold = true;
  if (style.italic) next.italic = true;
  if (style.fill && FILL_SET.has(style.fill)) next.fill = style.fill;
  if (style.align === "left" || style.align === "center" || style.align === "right") next.align = style.align;
  return next.bold || next.italic || next.fill || next.align ? next : undefined;
}
function active() { return wb.sheets.find((s) => s.id === wb.activeId) || wb.sheets[0]; }
function colW(sheet, c) { return sheet.colWidths[c] || DEF_W; }
function withRaw(sheet, key, raw) {
  const clipped = raw.length > 4000 ? raw.slice(0, 4000) : raw;

  geo = { xs, rows: rowCount, cols: colCount };
  const totalW = xs[colCount], totalH = rowCount * ROW_H;
  const sl = gridEl.scrollLeft, st = gridEl.scrollTop;
  const vw = gridEl.clientWidth || 1280, vh = gridEl.clientHeight || 700;
  const visC1 = clamp(Math.max(0, colAt(xs, sl)), 0, colCount - 1);
  const visC2 = clamp(colAt(xs, sl + vw + 1) + 1, 0, colCount - 1);
  const visR1 = clamp(Math.floor(st / ROW_H) - 1, 0, rowCount - 1);
  const visR2 = clamp(Math.ceil((st + vh) / ROW_H) + 1, 0, rowCount - 1);
  const box = rectOf(sel.anchor, sel.focus);
  const pointRect = point ? rectOf(point.anchor, point.focus) : null;
  canvasEl.style.width = totalW + "px";
  canvasEl.style.height = totalH + "px";
  cellsEl.replaceChildren();
  for (let r = visR1; r <= visR2; r++) {
    for (let c = visC1; c <= visC2; c++) {
      const key = keyOf(c, r);
      const data = sheet.cells[key];
      const presented = evaluated.get(key);
      const div = document.createElement("div");
      const isActive = c === sel.focus.c && r === sel.focus.r;
      const selected = inside(box, c, r);
      const pointed = pointRect ? inside(pointRect, c, r) : false;
      div.className = "cell" + (selected && !isActive ? " is-selected" : "") + (isActive ? " is-active" : "") + (pointed ? " is-point" : "");
      div.dataset.addr = key;
      if (data && data.style && data.style.fill) div.dataset.fill = data.style.fill;
      const align = (data && data.style && data.style.align) || (presented && presented.num != null && !presented.error ? "right" : "");
      if (align) div.dataset.align = align;
      if (data && data.style && data.style.bold) div.dataset.bold = "true";
      if (data && data.style && data.style.italic) div.dataset.italic = "true";
      if (presented && presented.error) div.dataset.error = "true";
      div.style.left = xs[c] + "px";
      div.style.top = r * ROW_H + "px";
      div.style.width = (xs[c + 1] - xs[c]) + "px";
      div.style.height = ROW_H + "px";
      div.textContent = editing && editing.key === key ? "" : (presented ? presented.display : "");
      cellsEl.append(div);
    }
  }
  const place = (el, a) => {
    el.hidden = !a;
    if (!a) return;
    el.style.left = xs[a.c1] + "px";
    el.style.top = a.r1 * ROW_H + "px";
    el.style.width = (xs[a.c2 + 1] - xs[a.c1]) + "px";
    el.style.height = (a.r2 - a.r1 + 1) * ROW_H + "px";
  };
  const multi = box.c1 !== box.c2 || box.r1 !== box.r2;
  place(rangeFrame, multi ? box : null);
  place(activeFrame, { c1: sel.focus.c, c2: sel.focus.c, r1: sel.focus.r, r2: sel.focus.r });
  place(pointFrame, pointRect);
  const editAddr = editing ? parseAddr(editing.key) : null;
  if (editing && editAddr) {
    const style = (sheet.cells[editing.key] || {}).style || {};
    editorEl.hidden = false;
    editorEl.style.left = xs[editAddr.c] + "px";
    editorEl.style.top = editAddr.r * ROW_H + "px";
    editorEl.style.width = Math.max(xs[editAddr.c + 1] - xs[editAddr.c], 80) + "px";
    editorEl.style.height = ROW_H + "px";
    editorEl.style.fontWeight = style.bold ? "700" : "450";
    editorEl.style.fontStyle = style.italic ? "italic" : "normal";
    editorEl.style.textAlign = style.align || "left";
    editorEl.style.background = style.fill ? "var(--" + style.fill + ")" : "var(--panel)";
    if (document.activeElement !== editorEl) editorEl.value = editing.draft;
    editorEl.style.pointerEvents = editing.via === "cell" ? "auto" : "none";
  } else editorEl.hidden = true;
  colsEl.style.transform = "translateX(" + (-sl) + "px)";
  colsEl.style.position = "relative";
  colsEl.style.height = "100%";
  colsEl.style.width = totalW + "px";
  colsEl.replaceChildren();
  for (let c = 0; c < colCount; c++) {
    const col = document.createElement("div");
    col.className = "col";
    col.dataset.sel = c >= box.c1 && c <= box.c2 ? "true" : "false";
    col.dataset.active = c === sel.focus.c && box.c1 === box.c2 ? "true" : "false";
    col.style.left = xs[c] + "px";
    col.style.width = (xs[c + 1] - xs[c]) + "px";
    col.style.height = COL_H + "px";
    col.dataset.i = String(c);
    col.append(document.createTextNode(colName(c)));
    const resizer = document.createElement("div");
    resizer.className = "resizer";
    resizer.addEventListener("pointerdown", (ev) => startResize(ev, c));
    resizer.addEventListener("dblclick", (ev) => { ev.stopPropagation(); autofit(c); });
    col.append(resizer);
    col.addEventListener("pointerdown", (ev) => { if (ev.button === 0 && ev.target === col) selectHeader("col", c, ev.shiftKey); });
    colsEl.append(col);
  }
  rowsEl.style.transform = "translateY(" + (-st) + "px)";
  rowsEl.style.position = "relative";
  rowsEl.style.height = totalH + "px";
  rowsEl.replaceChildren();
  for (let r = visR1; r <= visR2; r++) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.sel = r >= box.r1 && r <= box.r2 ? "true" : "false";
    row.dataset.active = r === sel.focus.r && box.r1 === box.r2 ? "true" : "false";
    row.style.top = r * ROW_H + "px";
    row.style.height = ROW_H + "px";
    row.dataset.i = String(r);
    row.textContent = String(r + 1);
    row.addEventListener("pointerdown", (ev) => { if (ev.button === 0) selectHeader("row", r, ev.shiftKey); });
    rowsEl.append(row);
  }
  const draft = shownDraft();
  if (document.activeElement !== formulaEl) formulaEl.value = draft;
  $("formula-row").dataset.formula = draft.trimStart().startsWith("=") ? "true" : "false";
  if (document.activeElement !== nameEl) nameEl.value = fmtAddr(sel.focus);
  const focusStyle = (sheet.cells[keyOf(sel.focus.c, sel.focus.r)] || {}).style || {};
  $("bold").dataset.on = focusStyle.bold ? "true" : "false";
  $("italic").dataset.on = focusStyle.italic ? "true" : "false";
  $("align-left").dataset.on = focusStyle.align === "left" ? "true" : "false";
  $("align-center").dataset.on = focusStyle.align === "center" ? "true" : "false";
  $("align-right").dataset.on = focusStyle.align === "right" ? "true" : "false";
  $("undo").disabled = past.length === 0;
  $("redo").disabled = future.length === 0;
  tabsEl.replaceChildren();
  for (const item of wb.sheets) {
    const tab = document.createElement("div");
    tab.className = "tab";
    tab.setAttribute("role", "tab");
    tab.dataset.active = item.id === wb.activeId ? "true" : "false";
    tab.dataset.id = item.id;
    tab.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0 || ev.target.closest(".tab-x") || ev.target.closest(".rename")) return;
      if (ev.detail >= 2) {
        renaming = { id: item.id, name: item.name };
        render();
        return;
      }
      switchSheet(item.id);
    });
    if (renaming && renaming.id === item.id) {
      const input = document.createElement("input");
      input.className = "rename";
      input.value = renaming.name;
      input.setAttribute("aria-label", "Rename sheet");
      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("input", () => { renaming.name = input.value; });
      input.addEventListener("blur", () => commitRename());
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); commitRename(); }
        else if (ev.key === "Escape") { ev.preventDefault(); renaming = null; render(); }
      });
      tab.append(input);
      requestAnimationFrame(() => input.focus());
    } else {
      const span = document.createElement("span");
      span.className = "tab-name";
      span.textContent = item.name;
      tab.append(span);
    }
    if (wb.sheets.length > 1) {
      const x = document.createElement("button");
      x.type = "button";
      x.className = "tab-x";
      x.setAttribute("aria-label", "Delete " + item.name);
      x.textContent = "×";
      x.dataset.id = item.id;
      x.addEventListener("pointerdown", (ev) => {
        ev.stopPropagation();
        ev.preventDefault();
        deleteSheet(item.id);
      });
      tab.append(x);
    }
    tabsEl.append(tab);
  }
  const add = document.createElement("button");
  add.type = "button";
  add.className = "add";
  add.setAttribute("aria-label", "Add sheet");
  add.textContent = "+";
  add.addEventListener("pointerdown", (ev) => { if (ev.button === 0) addSheet(); });
  tabsEl.append(add);
  paintStatus();
  renderLock = false;
}
let scrollFrame = 0;
gridEl.addEventListener("scroll", () => {
  if (scrollFrame) return;
  scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; render(); });
}, { passive: true });
new ResizeObserver(() => render()).observe(gridEl);
render();
</script>
</body>
</html>
