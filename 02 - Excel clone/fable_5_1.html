<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridline — spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --chrome:#eef1ef; --surface:#ffffff; --line:#e1e5e3; --line-strong:#c5ccc8;
  --head:#f5f7f6; --head-text:#5b6560; --text:#1d2321; --muted:#66706b;
  --accent:#18794e; --accent-strong:#12613e; --title-bg:#18794e; --title-text:#ffffff;
  --sel-fill:rgba(24,121,78,.10); --head-sel:#dcefe4; --head-sel-text:#0e5233;
  --btn-hover:#e2e8e4; --btn-press:#d4ded9; --popover:#ffffff; --danger:#b42318;
  --shadow:0 10px 28px rgba(16,40,28,.18),0 1px 3px rgba(16,40,28,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#161a19; --surface:#1e2322; --line:#2e3533; --line-strong:#434c48;
    --head:#232927; --head-text:#98a39e; --text:#e3e9e6; --muted:#98a39e;
    --accent:#3aa874; --accent-strong:#5cc893; --title-bg:#17402d; --title-text:#e9f5ef;
    --sel-fill:rgba(92,200,147,.15); --head-sel:#22392e; --head-sel-text:#86dcb1;
    --btn-hover:#252c2a; --btn-press:#2e3734; --popover:#222827; --danger:#f97066;
    --shadow:0 10px 28px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome:#161a19; --surface:#1e2322; --line:#2e3533; --line-strong:#434c48;
  --head:#232927; --head-text:#98a39e; --text:#e3e9e6; --muted:#98a39e;
  --accent:#3aa874; --accent-strong:#5cc893; --title-bg:#17402d; --title-text:#e9f5ef;
  --sel-fill:rgba(92,200,147,.15); --head-sel:#22392e; --head-sel-text:#86dcb1;
  --btn-hover:#252c2a; --btn-press:#2e3734; --popover:#222827; --danger:#f97066;
  --shadow:0 10px 28px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--chrome);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden;
  -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{display:flex;flex-direction:column;height:100%}

/* Title bar */
.titlebar{flex:none;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;background:var(--title-bg);color:var(--title-text)}
.logo{display:flex}
.app-name{font-weight:600;font-size:15px;letter-spacing:.01em}
.tb-sep{width:1px;height:18px;background:currentColor;opacity:.3}
.book-name{min-width:0;width:200px;max-width:40vw;height:28px;padding:0 8px;border:1px solid transparent;border-radius:4px;
  background:transparent;color:inherit;font:inherit;font-size:14px}
.book-name:hover{border-color:rgba(255,255,255,.35)}
.book-name:focus{outline:none;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
.save-state{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap}
.title-btn{height:28px;padding:0 12px;border:0;border-radius:4px;background:rgba(255,255,255,.14);color:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.title-btn:hover{background:rgba(255,255,255,.24)}

/* Toolbar */
.toolbar{flex:none;display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tgroup{display:flex;align-items:center;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.tgroup.end{border-right:0;margin-left:auto}
.tbtn{position:relative;height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;
  border:1px solid transparent;border-radius:4px;background:transparent;font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--btn-hover)}
.tbtn:active{background:var(--btn-press)}
.tbtn[aria-pressed="true"]{background:var(--head-sel);color:var(--head-sel-text);border-color:var(--line-strong)}
.tbtn:disabled{opacity:.38;cursor:default;background:transparent}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn .glyph-b{font-weight:700;font-size:15px}
.tbtn .glyph-i{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-size:16px}
.split{display:flex}
.split .tbtn:first-child{border-top-right-radius:0;border-bottom-right-radius:0;padding-right:5px}
.split .caret{min-width:18px;width:18px;padding:0;border-top-left-radius:0;border-bottom-left-radius:0}
.split .caret svg{width:12px;height:12px}
.fill-icon{display:flex;flex-direction:column;align-items:center;gap:1px}
.fill-bar{display:block;width:16px;height:4px;border-radius:1px;border:1px solid rgba(0,0,0,.15)}

/* Formula bar */
.fbar{flex:none;display:flex;align-items:stretch;height:34px;background:var(--surface);border-bottom:1px solid var(--line-strong)}
.namebox{width:92px;flex:none;border:0;border-right:1px solid var(--line);padding:0 10px;background:transparent;color:var(--text);
  font:500 13px "IBM Plex Sans",system-ui,sans-serif}
.namebox:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.fx{flex:none;width:36px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);
  color:var(--muted);font:italic 15px Georgia,"Times New Roman",serif;user-select:none}
.formula-input{flex:1;min-width:0;border:0;padding:0 10px;background:transparent;color:var(--text);font:13px "IBM Plex Sans",system-ui,sans-serif}
.formula-input:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}

/* Grid */
.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--surface);outline:none;overscroll-behavior:contain}
.grid-wrap.drop{box-shadow:inset 0 0 0 3px var(--accent)}
.canvas{position:relative;display:inline-block;vertical-align:top}
.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.grid th,.grid td{height:24px;padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;line-height:23px}
.grid td{background:var(--surface);color:var(--text);cursor:cell}
.grid td.num{text-align:right}
.grid td.bool,.grid td.err{text-align:center}
.grid td.err{color:var(--danger)}
.grid td.b{font-weight:600}
.grid td.i{font-style:italic}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--head-text);font-weight:500;font-size:12px;
  text-align:center;border-bottom-color:var(--line-strong);cursor:s-resize;padding:0 4px}
.grid tbody th{position:sticky;left:0;z-index:3;background:var(--head);color:var(--head-text);font-weight:400;font-size:12px;
  text-align:center;border-right-color:var(--line-strong);cursor:e-resize;padding:0 2px}
.grid thead th.corner{left:0;z-index:5;cursor:pointer;border-right-color:var(--line-strong)}
.grid thead th.corner::after{content:"";position:absolute;right:3px;bottom:3px;border:5px solid transparent;border-right-color:var(--line-strong);border-bottom-color:var(--line-strong)}
.grid th.hsel{background:var(--head-sel);color:var(--head-sel-text);font-weight:600}
.grid thead th.hsel{box-shadow:inset 0 -2px 0 var(--accent)}
.grid tbody th.hsel{box-shadow:inset -2px 0 0 var(--accent)}
.rs{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:1}
.rs:hover{background:var(--accent);opacity:.5}

.overlay{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2}
.overlay>div,.overlay>div>div{position:absolute}
.range-box{background:var(--sel-fill);border:1px solid var(--accent)}
.active-box{border:2px solid var(--accent)}
.clip-box{border:2px dashed var(--accent)}
.ref-box{border:2px solid;border-radius:1px}

.cell-editor{position:absolute;z-index:2;margin:0;border:2px solid var(--accent);padding:0 5px;background:var(--surface);color:var(--text);
  font:13px "IBM Plex Sans",system-ui,sans-serif;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:0}
.cell-editor.idle{opacity:0;pointer-events:none;caret-color:transparent;box-shadow:none}
.cell-editor.away{display:none}

/* Sheet tabs + status */
.tabsbar{flex:none;display:flex;align-items:stretch;height:36px;background:var(--chrome);border-top:1px solid var(--line-strong)}
.add-sheet{flex:none;width:38px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-sheet:hover{background:var(--btn-hover)}
.add-sheet svg{width:16px;height:16px}
.tabs{flex:0 1 auto;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:2px;padding:0 6px 0 14px;border-right:1px solid var(--line);
  color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;user-select:none;outline-offset:-2px}
.tab:not(.active){padding-right:14px}
.tab:hover{background:var(--btn-hover);color:var(--text)}
.tab.active{background:var(--surface);color:var(--accent-strong);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
.tab-menu{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:0;border-radius:3px;background:transparent;cursor:pointer;color:inherit}
.tab-menu:hover{background:var(--btn-hover)}
.tab-menu svg{width:12px;height:12px}
.tab-rename{width:120px;height:24px;border:1px solid var(--accent);border-radius:3px;padding:0 6px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;margin-right:8px}
.tab-rename:focus{outline:none}
.status{margin-left:auto;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:12px;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:16px}
.stats b{font-weight:500;color:var(--text);margin-left:5px}
.mode{min-width:36px;text-align:right}

/* Menus, dialogs, toasts */
.menu{position:fixed;z-index:60;background:var(--popover);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);padding:4px;min-width:160px}
.menu>button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:4px;background:transparent;font-size:13px;cursor:pointer}
.menu>button:hover,.menu>button:focus-visible{background:var(--btn-hover);outline:none}
.menu>button.danger{color:var(--danger)}
.fill-pop{padding:8px;min-width:0}
.fill-pop .nofill{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin-bottom:6px;border:1px solid var(--line);border-radius:4px;background:transparent;font-size:13px;cursor:pointer}
.fill-pop .nofill:hover{background:var(--btn-hover)}
.nofill-chip{width:14px;height:14px;border:1px solid var(--line-strong);background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%)}
.swatches{display:grid;grid-template-columns:repeat(8,22px);gap:4px}
.sw{width:22px;height:22px;border:1px solid rgba(0,0,0,.14);border-radius:3px;cursor:pointer;padding:0}
.sw:hover{transform:scale(1.12);border-color:var(--text)}
.custom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.custom input{width:36px;height:24px;padding:0;border:1px solid var(--line-strong);border-radius:3px;background:transparent;cursor:pointer}

.dialog-backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,20,15,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:min(420px,100%);background:var(--popover);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:20px 20px 16px}
.dialog h2{margin:0 0 8px;font-size:16px;font-weight:600}
.dialog p{margin:0 0 18px;color:var(--muted);line-height:1.5;font-size:14px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.btn{height:32px;padding:0 14px;border-radius:5px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-size:13px}
.btn:hover{background:var(--btn-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong)}
.btn.danger{background:var(--danger);border-color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:90;
  max-width:min(520px,calc(100vw - 32px));padding:9px 14px;border-radius:6px;background:#1f2a25;color:#f1f6f3;font-size:13px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.resizing,body.resizing *{cursor:col-resize!important}
body.dragging{user-select:none;-webkit-user-select:none}

@media (max-width:760px){
  .lbl{display:none}
  .save-state{display:none}
  .book-name{margin-right:auto}
  .stats{display:none}
}
@media (max-width:480px){
  .app-name,.tb-sep{display:none}
  .namebox{width:64px}
}
@media (pointer:coarse){
  .cell-editor,.formula-input,.namebox,.book-name,.tab-rename{font-size:16px}
  .tbtn{height:36px;min-width:36px}
}
@media (prefers-reduced-motion:reduce){
  .toast{transition:none}
  .sw:hover{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2.5" y="2.5" width="15" height="15" rx="2.5"/><path d="M2.5 7.5h15M2.5 12.5h15M8 7.5v10"/>
      </svg>
    </span>
    <span class="app-name">Gridline</span>
    <span class="tb-sep" aria-hidden="true"></span>
    <input id="bookName" class="book-name" aria-label="Workbook name" spellcheck="false" autocomplete="off">
    <span id="saveState" class="save-state"></span>
    <button id="btnNew" class="title-btn" type="button">New<span class="lbl"> workbook</span></button>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Editing tools">
    <div class="tgroup">
      <button class="tbtn" id="btnUndo" type="button" aria-label="Undo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h6.5a3.5 3.5 0 0 1 0 7H7"/><path d="M6.5 3.5l-3 3 3 3"/></svg>
      </button>
      <button class="tbtn" id="btnRedo" type="button" aria-label="Redo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5H5.5a3.5 3.5 0 0 0 0 7H9"/><path d="M9.5 3.5l3 3-3 3"/></svg>
      </button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="btnBold" type="button" aria-label="Bold" aria-pressed="false"><span class="glyph-b">B</span></button>
      <button class="tbtn" id="btnItalic" type="button" aria-label="Italic" aria-pressed="false"><span class="glyph-i">I</span></button>
    </div>
    <div class="tgroup">
      <div class="split">
        <button class="tbtn" id="btnFill" type="button" aria-label="Fill color">
          <span class="fill-icon">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="height:13px"><path d="M2.5 8L7.5 3l5 5-5 5z"/><path d="M5 1.5l2.5 1.5"/><path d="M13.3 9.5s1.2 1.5 1.2 2.3a1.2 1.2 0 0 1-2.4 0c0-.8 1.2-2.3 1.2-2.3z" fill="currentColor" stroke="none"/></svg>
            <span class="fill-bar" id="fillBar"></span>
          </span>
        </button>
        <button class="tbtn caret" id="btnFillMenu" type="button" aria-label="Choose fill color" aria-haspopup="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
        </button>
      </div>
      <button class="tbtn" id="btnClear" type="button" aria-label="Clear contents">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 13.5L2.5 10a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0l3.6 3.6a1 1 0 0 1 0 1.4L7 13.5z"/><path d="M5 6l5 5"/><path d="M7 13.5h6.5"/></svg>
        <span class="lbl">Clear contents</span>
      </button>
    </div>
    <div class="tgroup end">
      <button class="tbtn" id="btnUpload" type="button" aria-label="Upload CSV">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5"/><path d="M5 5.5l3-3 3 3"/><path d="M2.5 10.5v3h11v-3"/></svg>
        <span class="lbl">Upload CSV</span>
      </button>
      <button class="tbtn" id="btnDownload" type="button" aria-label="Download CSV">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8"/><path d="M5 7.5l3 3 3-3"/><path d="M2.5 10.5v3h11v-3"/></svg>
        <span class="lbl">Download CSV</span>
      </button>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" hidden>
    </div>
  </div>

  <div class="fbar">
    <input id="nameBox" class="namebox" aria-label="Go to cell" title="Type a cell or range and press Enter" spellcheck="false" autocomplete="off">
    <span class="fx" aria-hidden="true">fx</span>
    <input id="formulaInput" class="formula-input" aria-label="Cell contents or formula" spellcheck="false" autocomplete="off">
  </div>

  <div id="gridWrap" class="grid-wrap" tabindex="-1" aria-label="Spreadsheet grid">
    <div id="canvas" class="canvas">
      <table id="grid" class="grid"></table>
      <div class="overlay" aria-hidden="true">
        <div id="refLayer"></div>
        <div id="clipBox" class="clip-box" hidden></div>
        <div id="rangeBox" class="range-box" hidden></div>
        <div id="activeBox" class="active-box"></div>
      </div>
      <input id="cellEditor" class="cell-editor idle" spellcheck="false" autocomplete="off" aria-label="Cell editor">
    </div>
  </div>

  <footer class="tabsbar">
    <button id="btnAddSheet" class="add-sheet" type="button" title="Add sheet" aria-label="Add sheet">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <div id="tabs" class="tabs" role="tablist" aria-label="Sheets"></div>
    <div class="status"><span id="statusStats" class="stats"></span><span id="modeLabel" class="mode">Ready</span></div>
  </footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============================================================
   Constants & small helpers
   ============================================================ */
const ROWHEAD_W = 46, DEF_W = 96, ROW_H = 24, MAX_ROWS = 5000, MAX_COLS = 260;
const STORE_KEY = 'gridline.workbook.v1';
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl+';
const NUM_RE = /^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/;
const REF_COLORS = ['#2f6fde', '#d6336c', '#7a49c8', '#e8590c', '#0c8599', '#5c940d'];
const FILLS = ['#ffffff','#f3f3f3','#e0e0e0','#cccccc','#999999','#666666','#434343','#000000',
  '#fff2cc','#fce5cd','#f4cccc','#ead1dc','#d9d2e9','#cfe2f3','#d0e0e3','#d9ead3',
  '#ffe599','#f9cb9c','#ea9999','#d5a6bd','#b4a7d6','#9fc5e8','#a2c4c9','#b6d7a8',
  '#f1c232','#e69138','#cc4125','#a64d79','#674ea7','#3d85c6','#45818e','#6aa84f'];

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}
function addSheet() {
  if (editing) commitEdit();
  let n = wb.sheets.length + 1; while (sheetByName('Sheet' + n)) n++;
  const s = newSheet('Sheet' + n);
  wb.sheets.splice(wb.sheets.indexOf(view) + 1, 0, s);
  switchSheet(s.id); afterDataChange(); focusGrid();
}
async function deleteSheet(id) {
  if (wb.sheets.length === 1) { toast('A workbook needs at least one sheet.'); return; }
  const s = sheetById(id);
  const ok = await confirmDialog({
    title: `Delete “${s.name}”?`,
    message: 'Its cells are removed and undo can’t bring them back. Formulas on other sheets that point to it will show #REF!.',
    confirm: 'Delete sheet', danger: true,
  });
  if (!ok) return;
  if (editing) cancelEdit();
  const idx = wb.sheets.indexOf(s);
  wb.sheets.splice(idx, 1);
  for (const stack of [undoStack, redoStack]) {
    for (let i = stack.length - 1; i >= 0; i--) { stack[i] = stack[i].filter((x) => x.sheetId !== id); if (!stack[i].length) stack.splice(i, 1); }
  }
  if (clip && clip.sheetId === id) clip = null;
  if (view === s) { view = null; switchSheet(wb.sheets[Math.max(0, idx - 1)].id); }
  renderTabs(); afterDataChange(); focusGrid();
}
$('#btnAddSheet').addEventListener('mousedown', (e) => e.preventDefault());
$('#btnAddSheet').addEventListener('click', addSheet);

/* ============================================================
   Menus, dialogs, toasts
   ============================================================ */
let menuEl = null, menuOwner = null, dialogOpen = false;
function closeMenus() { if (menuEl) { menuEl.remove(); menuEl = null; menuOwner = null; } }
function showMenu(el, owner, rect, prefer) {
  closeMenus();
  el.classList.add('menu');
  document.body.appendChild(el);
  menuEl = el; menuOwner = owner;
  const mw = el.offsetWidth, mh = el.offsetHeight;
  let x = rect.left, y = prefer === 'above' ? rect.top - mh - 4 : rect.bottom + 4;
  if (y + mh > innerHeight - 8) y = rect.top - mh - 4;
  if (y < 8) y = Math.min(rect.bottom + 4, innerHeight - mh - 8);
  x = clamp(x, 8, innerWidth - mw - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
document.addEventListener('pointerdown', (e) => {
  if (menuEl && !menuEl.contains(e.target) && !(menuOwner && menuOwner.contains(e.target))) closeMenus();
}, true);
function confirmDialog({ title, message, confirm, danger }) {
  return new Promise((resolve) => {
    closeMenus();
    dialogOpen = true;
    const back = document.createElement('div'); back.className = 'dialog-backdrop';
    back.innerHTML = '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgM"><h2 id="dlgT"></h2><p id="dlgM"></p><div class="dialog-actions"><button type="button" class="btn" data-a="cancel">Cancel</button><button type="button" class="btn primary" data-a="ok"></button></div></div>';
    back.querySelector('#dlgT').textContent = title;
    back.querySelector('#dlgM').textContent = message;
    const okBtn = back.querySelector('[data-a="ok"]'); okBtn.textContent = confirm || 'OK';
    if (danger) okBtn.classList.add('danger');
    document.body.appendChild(back);
    okBtn.focus();
    const close = (v) => { back.remove(); dialogOpen = false; resolve(v); focusGrid(); };
    back.addEventListener('click', (e) => { if (e.target === back) close(false); const a = e.target.closest('[data-a]'); if (a) close(a.dataset.a === 'ok'); });
    back.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); close(false); }
      if (e.key === 'Tab') { e.preventDefault(); const bs = [...back.querySelectorAll('button')]; bs[(bs.indexOf(document.activeElement) + 1) % bs.length].focus(); }
    });
  });
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3600);
}

/* ============================================================
   CSV import / export
   ============================================================ */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const nl = text.search(/\r?\n|\r/);
  const first = nl < 0 ? text : text.slice(0, nl);
  const count = (ch) => first.split(ch).length - 1;
  let d = ',';
  if (count('\t') > count(d)) d = '\t';
  if (count(';') > count(d)) d = ';';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
      continue;
    }
    if (ch === '"' && f === '') { q = true; continue; }
    if (ch === d) { row.push(f); f = ''; continue; }
    if (ch === '\r' || ch === '\n') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = ''; continue;
    }
    f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function importCSV(text, fname) {
  if (editing) commitEdit();
  let rows = parseCSV(text);
  if (!rows.length) { toast(`${fname} has no rows to import.`); return; }
  let maxC = 0; for (const r of rows) maxC = Math.max(maxC, r.length);
  let note = '';
  if (rows.length > MAX_ROWS || maxC > MAX_COLS) {
    rows = rows.slice(0, MAX_ROWS).map((r) => r.slice(0, MAX_COLS)); maxC = Math.min(maxC, MAX_COLS);
    note = ` Only the first ${MAX_ROWS} rows and ${MAX_COLS} columns fit.`;
  }
  const changes = [];
  for (const k in view.cells) changes.push({ sheetId: view.id, key: k, after: null });
  rows.forEach((row, r) => row.forEach((val, c) => { if (val !== '') changes.push({ sheetId: view.id, key: keyOf(r, c), after: { raw: val } }); }));
  view.rows = Math.min(MAX_ROWS, Math.max(view.rows, rows.length + 20));
  view.cols = Math.min(MAX_COLS, Math.max(view.cols, maxC + 2));
  buildGrid();
  applyChanges(changes);
  wrap.scrollTop = 0; wrap.scrollLeft = 0;
  setSel({ r: 0, c: 0 });
  toast(`Imported ${rows.length} row${rows.length === 1 ? '' : 's'} from ${fname} into ${view.name}. Undo restores the previous contents.${note}`);
}
function readCSVFile(file) {
  if (file.size > 15 * 1024 * 1024) { toast(`${file.name} is over 15 MB. Choose a smaller CSV file.`); return; }
  const fr = new FileReader();
  fr.onload = () => importCSV(String(fr.result), file.name);
  fr.onerror = () => toast(`${file.name} couldn’t be read. Try saving it again as CSV.`);
  fr.readAsText(file);
}
function toCSV(s) {
  let mr = -1, mc = -1;
  for (const k in s.cells) { if (!s.cells[k].raw) continue; const [r, c] = parseKey(k); if (r > mr) mr = r; if (c > mc) mc = c; }
  if (mr < 0) return null;
  const esc = (v) => (/[",\r\n]/.test(v) || /^\s|\s$/.test(v)) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [];
  for (let r = 0; r <= mr; r++) {
    const out = [];
    for (let c = 0; c <= mc; c++) { const cell = s.cells[keyOf(r, c)]; out.push(cell && cell.raw ? esc(fmtVal(cellValue(s, r, c))) : ''); }
    lines.push(out.join(','));
  }
  return lines.join('\r\n') + '\r\n';
}
const downloadsCap = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').catch(() => null)
  : Promise.resolve(null);
const safeName = (s) => (s || '').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'Workbook';
async function downloadCSV() {
  if (editing) commitEdit();
  recalc();
  const csv = toCSV(view);
  if (csv === null) { toast(`${view.name} has no data to download.`); return; }
  const filename = `${safeName(wb.name)} - ${safeName(view.name)}.csv`;
  const dl = await downloadsCap;
  if (dl) {
    try { await dl.save({ filename, data: csv }); toast(`Downloaded ${filename}`); }
    catch (err) {
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { toast('A download prompt is already open.'); return; }
      toast(`${filename} couldn’t be downloaded here.`);
    }
    return;
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
wrap.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); wrap.classList.add('drop'); } });
wrap.addEventListener('dragleave', (e) => { if (e.target === wrap) wrap.classList.remove('drop'); });
wrap.addEventListener('drop', (e) => {
  wrap.classList.remove('drop');
  const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return;
  e.preventDefault(); readCSVFile(f);
});

/* ============================================================
   Toolbar, name box, title bar
   ============================================================ */
function updateToolbar() {
  const cell = view.cells[keyOf(act.r, act.c)];
  $('#btnBold').setAttribute('aria-pressed', String(!!(cell && cell.b)));
  $('#btnItalic').setAttribute('aria-pressed', String(!!(cell && cell.i)));
  $('#btnUndo').disabled = !undoStack.length;
  $('#btnRedo').disabled = !redoStack.length;
}
function updateFillSwatch() { $('#fillBar').style.background = lastFill; $('#btnFill').title = `Fill color (${lastFill})`; }
document.querySelectorAll('.tbtn').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));
const tip = (id, t) => { $(id).title = t; };
tip('#btnUndo', `Undo (${MOD}Z)`); tip('#btnRedo', `Redo (${MOD}${IS_MAC ? '⇧Z' : 'Y'})`);
tip('#btnBold', `Bold (${MOD}B)`); tip('#btnItalic', `Italic (${MOD}I)`);
tip('#btnFillMenu', 'Choose fill color'); tip('#btnClear', 'Clear contents (Delete)');
tip('#btnUpload', 'Replace this sheet with a CSV file'); tip('#btnDownload', 'Download this sheet as CSV');
$('#btnUndo').addEventListener('click', () => { undo(); focusGrid(); });
$('#btnRedo').addEventListener('click', () => { redo(); focusGrid(); });
$('#btnBold').addEventListener('click', () => { toggleFormat('b'); focusGrid(); });
$('#btnItalic').addEventListener('click', () => { toggleFormat('i'); focusGrid(); });
$('#btnFill').addEventListener('click', () => { setFill(lastFill); focusGrid(); });
$('#btnClear').addEventListener('click', () => { clearContents(); focusGrid(); });
$('#btnUpload').addEventListener('click', () => { if (editing) commitEdit(); fileInput.value = ''; fileInput.click(); });
fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) readCSVFile(f); });
$('#btnDownload').addEventListener('click', () => { downloadCSV(); });
$('#btnFillMenu').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  if (menuOwner === btn) { closeMenus(); return; }
  const m = document.createElement('div'); m.className = 'fill-pop';
  m.innerHTML = '<button type="button" class="nofill" data-color=""><span class="nofill-chip"></span>No fill</button>'
    + '<div class="swatches">' + FILLS.map((c) => `<button type="button" class="sw" style="background:${c}" data-color="${c}" title="${c}" aria-label="Fill ${c}"></button>`).join('') + '</div>'
    + `<label class="custom">Custom color<input type="color" value="${lastFill}"></label>`;
  m.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-color]'); if (!b) return;
    const col = b.dataset.color || null;
    if (col) { lastFill = col; updateFillSwatch(); }
    closeMenus(); setFill(col); focusGrid();
  });
  m.querySelector('input[type=color]').addEventListener('change', (ev) => {
    lastFill = ev.target.value; updateFillSwatch(); closeMenus(); setFill(lastFill); focusGrid();
  });
  showMenu(m, btn, btn.closest('.split').getBoundingClientRect(), 'below');
});

nameBox.addEventListener('focus', () => { if (editing) commitEdit(); nameBox.select(); });
nameBox.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); nameBox.value = addr(act.r, act.c); focusGrid(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const parts = nameBox.value.split(':');
  const a = parseRef(parts[0] || ''), b = parts.length === 2 ? parseRef(parts[1]) : (parts.length === 1 ? a : null);
  if (!a || !b || a.r >= MAX_ROWS || b.r >= MAX_ROWS || a.c >= MAX_COLS || b.c >= MAX_COLS) {
    toast('Type a cell such as B5 or a range such as A1:C10.'); nameBox.select(); return;
  }
  ensureDims(Math.max(a.r, b.r), Math.max(a.c, b.c));
  nameBox.blur();
  setSel(a, b);
  focusGrid();
});
nameBox.addEventListener('blur', () => { nameBox.value = addr(act.r, act.c); });

bookName.addEventListener('input', () => { wb.name = bookName.value; document.title = (bookName.value || 'Untitled') + ' — Gridline'; scheduleSave(); });
bookName.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); bookName.blur(); focusGrid(); } });
bookName.addEventListener('blur', () => { if (!bookName.value.trim()) { bookName.value = wb.name = 'Book1'; scheduleSave(); } });

$('#btnNew').addEventListener('click', async () => {
  const ok = await confirmDialog({
    title: 'Start a new workbook?',
    message: 'This replaces the current workbook in this browser. Download any sheets you want to keep as CSV first.',
    confirm: 'Start new workbook', danger: true,
  });
  if (!ok) return;
  if (editing) cancelEdit();
  blankWorkbook();
  undoStack.length = 0; redoStack.length = 0; clip = null;
  boot();
});

window.addEventListener('resize', () => {
  let w = ROWHEAD_W; for (let c = 0; c < view.cols; c++) w += colW(view, c);
  if (w < wrap.clientWidth + 100 && view.cols < MAX_COLS) appendCols(Math.ceil((wrap.clientWidth + 100 - w) / DEF_W));
  updateSelection(); positionEditor(); updateRefHighlights();
});
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); saveNow(); });

/* ============================================================
   Boot
   ============================================================ */
function boot() {
  view = sheetById(wb.active) || wb.sheets[0];
  wb.active = view.id;
  bookName.value = wb.name;
  document.title = wb.name + ' — Gridline';
  recalc();
  buildGrid();
  const sl = view.sel || { r: 0, c: 0, fr: 0, fc: 0 };
  act = { r: clampR(sl.r | 0), c: clampC(sl.c | 0) };
  foc = { r: clampR(sl.fr | 0), c: clampC(sl.fc | 0) };
  wrap.scrollTop = sl.st || 0; wrap.scrollLeft = sl.sl || 0;
  renderTabs(); updateSelection(); updateFillSwatch();
  setMode('Ready');
  saveNow();
  focusGrid();
}
loadWorkbook();
boot();
})();
