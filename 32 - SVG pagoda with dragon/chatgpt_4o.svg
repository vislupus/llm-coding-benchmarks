<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background and Garden Elements -->
  <rect width="800" height="600" fill="lightblue" />
  
  <!-- Ground and Pathways -->
  <path d="M0,450 C200,470 600,470 800,450 L800,600 L0,600 Z" fill="lightgreen" />
  <path d="M400,450 C390,480 410,480 400,450 Z" fill="saddlebrown" />
  <path d="M370,480 C360,510 440,510 430,480 Z" fill="saddlebrown" />

  <!-- Trees -->
  <g>
    <path d="M100,400 L120,350 L140,400 Z" fill="darkgreen" />
    <rect x="115" y="400" width="10" height="50" fill="sienna" />
    <path d="M150,400 L170,350 L190,400 Z" fill="darkgreen" />
    <rect x="165" y="400" width="10" height="50" fill="sienna" />
  </g>

  <!-- Pagoda -->
  <g transform="translate(300, 150)">
    <!-- Base -->
    <rect x="85" y="320" width="130" height="30" fill="peru" />
    <!-- Floors -->
    <g fill="sienna">
      <rect x="90" y="270" width="120" height="50" />
      <rect x="100" y="220" width="100" height="50" />
      <rect x="110" y="170" width="80" height="50" />
      <rect x="120" y="120" width="60" height="50" />
      <rect x="130" y="70" width="40" height="50" />
      <rect x="140" y="20" width="20" height="50" />
    </g>
    <!-- Roofs -->
    <g fill="darkred">
      <polygon points="85,270 150,250 215,270 85,270" />
      <polygon points="95,220 150,200 205,220 95,220" />
      <polygon points="105,170 150,150 195,170 105,170" />
      <polygon points="115,120 150,100 185,120 115,120" />
      <polygon points="125,70 150,50 175,70 125,70" />
      <polygon points="135,20 150,0 165,20 135,20" />
    </g>
    <!-- Windows and Details -->
    <g fill="gold">
      <rect x="130" y="240" width="40" height="20" />
      <rect x="135" y="190" width="30" height="20" />
      <rect x="140" y="140" width="20" height="20" />
      <rect x="145" y="90" width="10" height="20" />
      <rect x="150" y="40" width="5" height="10" />
    </g>
  </g>

  <!-- Dragon -->
  <g fill="darkorange" stroke="gold" stroke-width="2">
    <path d="M400,450 C370,420 350,380 380,350 C410,320 420,400 440,370 C460,340 430,310 470,310 C510,310 520,360 550,340 C580,320 560,280 600,280" />
    <circle cx="600" cy="280" r="10" fill="red" />
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="600" cy="180" rx="40" ry="20" />
    <ellipse cx="650" cy="200" rx="50" ry="25" />
  </g>
</svg>
