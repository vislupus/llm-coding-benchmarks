<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal Earth — Interactive World Map (SVG.js)</title>
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: #08131f; color: #dbe7f3; overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
  }
  #toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: #0d1b2a; border-bottom: 1px solid #1e3a55;
    font-size: 13px; z-index: 5;
  }
  #toolbar b { color: #7fd4a8; letter-spacing: .4px; }
  #toolbar input {
    width: 90px; padding: 5px 7px; border-radius: 5px; border: 1px solid #2c4f70;
    background: #10222f; color: #eaf4ff; font-size: 13px;
  }
  #toolbar button {
    padding: 5px 12px; border-radius: 5px; border: 1px solid #2c4f70;
    background: #17517a; color: #fff; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #1e679c; }
  #toolbar .hint { color: #7b93a9; margin-left: auto; }
  #wrap { position: relative; flex: 1; min-height: 0; cursor: grab; }
  #wrap.dragging { cursor: grabbing; }
  #wrap svg { width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute; left: 14px; bottom: 12px;
    background: rgba(8, 20, 32, 0.85); border: 1px solid #2c4f70;
    border-radius: 8px; padding: 9px 13px; font-size: 13px; line-height: 1.55;
    pointer-events: none; min-width: 300px; backdrop-filter: blur(3px);
  }
  #hud .lon { color: #7fd4a8; font-weight: 600; }
  #hud .lat { color: #8fc7ff; font-weight: 600; }
  #hud .dim { color: #7b93a9; }
</style>
</head>
<body>

<div id="toolbar">
  <b>Equal Earth</b>
  <label>Lat <input id="latIn" type="number" step="any" value="48.8566" min="-90" max="90"></label>
  <label>Lon <input id="lonIn" type="number" step="any" value="2.3522" min="-180" max="180"></label>
  <button id="plotBtn">Plot marker (forward projection)</button>
  <button id="clearBtn">Clear markers</button>
  <button id="resetBtn">Reset view</button>
  <span class="hint">wheel = zoom · drag = pan · click = inverse projection</span>
</div>

<div id="wrap">
  <div id="map"></div>
  <div id="hud">
    <div><span class="dim">cursor:</span> <span id="hoverTxt">move over the map…</span></div>
    <div><span class="dim">clicked:</span> <span id="clickTxt">—</span></div>
    <div><span class="dim">zoom:</span> <span id="zoomTxt">100%</span></div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   1. Equal Earth projection (Šavrič, Patterson & Jenny, 2018)
   Forward: (lon°, lat°) -> raw (x, y);  Inverse: (x, y) -> (lon°, lat°)
   ============================================================ */
const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
const M  = Math.sqrt(3) / 2;
const RAD = Math.PI / 180, DEG = 180 / Math.PI;

function eeForward(lonDeg, latDeg) {
  const lam = lonDeg * RAD, phi = latDeg * RAD;
  const th = Math.asin(Math.max(-1, Math.min(1, M * Math.sin(phi))));
  const t2 = th * th, t6 = t2 * t2 * t2;
  const x = lam * Math.cos(th) / (M * (A1 + 3*A2*t2 + t6*(7*A3 + 9*A4*t2)));
  const y = th * (A1 + A2*t2 + t6*(A3 + A4*t2));
  return [x, y];
}

function eeInverse(x, y) {
  let th = y, i = 25, d;
  do { // Newton–Raphson on y(θ)
    const t2 = th*th, t6 = t2*t2*t2;
    d = (th*(A1 + t2*(A2 + t6*(A3 + A4*t2))) - y) /
        (A1 + t2*(3*A2 + t6*(7*A3 + 9*A4*t2)));
    th -= d;
  } while (Math.abs(d) > 1e-12 && --i > 0);
  const t2 = th*th, t6 = t2*t2*t2;
  const lam = M * x * (A1 + t2*(3*A2 + t6*(7*A3 + 9*A4*t2))) / Math.cos(th);
  const s = Math.sin(th) / M;
  if (!isFinite(lam) || !isFinite(s) || Math.abs(s) > 1 || Math.abs(lam) > Math.PI + 1e-9) return null;
  const lon = lam * DEG, lat = Math.asin(Math.max(-1, Math.min(1, s))) * DEG;
  // Validate point lies inside the map frame (re-project and compare)
  const [rx, ry] = eeForward(lon, lat);
  if (Math.hypot(rx - x, ry - y) > 1e-7) return null;
  return [lon, lat];
}

/* ============================================================
   2. Map geometry math: raw projection -> base screen pixels
   ============================================================ */
const W = 1200, H = 640;                       // logical canvas
const HALF_W = Math.PI / (M * A1);             // raw |x| at equator edge ≈ 2.7064
const HALF_H = eeForward(0, 90)[1];            // raw |y| at poles  ≈ 1.3173
const S  = Math.min(W / (2 * HALF_W), H / (2 * HALF_H)) * 0.93;
const CX = W / 2, CY = H / 2;

function toScreen(lon, lat) {                  // geographic -> base SVG coords
  const [x, y] = eeForward(lon, lat);
  return [CX + x * S, CY - y * S];
}
function toLonLat(px, py) {                    // base SVG coords -> geographic
  return eeInverse((px - CX) / S, -(py - CY) / S);
}

/* ============================================================
   4. SVG.js scene setup
   ============================================================ */
const svg = SVG().addTo('#map').viewbox(0, 0, W, H).attr('preserveAspectRatio', 'xMidYMid meet');

// Ocean background
svg.rect(W, H).fill('#0d2438');

// World group: everything inside lives in BASE projection coords;
// zoom/pan is a pure SVG affine transform on this group => projection
// stays mathematically exact at any scale.
const world = svg.group();

function ringPath(ring) {
  return 'M' + ring.map(p => toScreen(p[0], p[1]).map(v => +v.toFixed(2)).join(',')).join('L') + 'Z';
}
function linePath(pts) {
  return 'M' + pts.map(p => toScreen(p[0], p[1]).map(v => +v.toFixed(2)).join(',')).join('L');
}

// Graticule (15°)
const graticule = world.group();
for (let lat = -75; lat <= 75; lat += 15) {
  const pts = []; for (let lon = -180; lon <= 180; lon += 3) pts.push([lon, lat]);
  graticule.path(linePath(pts)).fill('none')
    .attr('stroke', lat === 0 ? 'rgba(180,220,255,0.22)' : 'rgba(180,220,255,0.10)',
          'stroke-width', 1, 'vector-effect', 'non-scaling-stroke');
}
for (let lon = -180; lon <= 165; lon += 15) {
  const pts = []; for (let lat = -90; lat <= 90; lat += 3) pts.push([lon, lat]);
  graticule.path(linePath(pts)).fill('none')
    .attr('stroke', lon === 0 ? 'rgba(180,220,255,0.22)' : 'rgba(180,220,255,0.10)',
          'stroke-width', 1, 'vector-effect', 'non-scaling-stroke');
}

// Land
const landG = world.group();
LAND.forEach(r => landG.path(ringPath(r))
  .fill('#3d7a5c').attr('stroke', '#9fd4b5', 'stroke-width', 0.8, 'vector-effect', 'non-scaling-stroke', 'stroke-linejoin', 'round'));

// Inland seas
SEAS.forEach(r => landG.path(ringPath(r)).fill('#0d2438'));

// Map frame (projection boundary)
(function frame() {
  const edge = [];
  for (let lon = -180; lon <= 180; lon += 5) edge.push([lon, 90]);
  for (let lat = 90;  lat >= -90; lat -= 5) edge.push([180, lat]);
  for (let lon = 180;  lon >= -180; lon -= 5) edge.push([lon, -90]);
  for (let lat = -90;  lat <= 90; lat += 5) edge.push([-180, lat]);
  world.path(ringPath(edge)).fill('none')
    .attr('stroke', '#4c7ba6', 'stroke-width', 1.5, 'vector-effect', 'non-scaling-stroke');
  // move frame below land but keep it crisp: re-insert at front of group
})();

/* ============================================================
   5. View state (zoom & pan) — SVG affine transform
   screen = translate(tx,ty) · scale(k) applied to base coords
   ============================================================ */
const view = { k: 1, tx: 0, ty: 0 };
const markers = [];   // {el, lon, lat, r}

function applyView() {
  world.node.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  markers.forEach(m => { const [sx, sy] = toScreen(m.lon, m.lat); m.el.center(sx, sy).attr('r', m.r / view.k); });
  zoomTxt.textContent = Math.round(view.k * 100) + '%';
}
function addMarker(lon, lat, color, r) {
  const el = world.circle(0).fill(color)
    .attr('stroke', '#ffffff', 'stroke-width', 1.5, 'vector-effect', 'non-scaling-stroke', 'fill-opacity', 0.9);
  markers.push({ el, lon, lat, r });
  applyView();
}

// client px -> base SVG coords, un-doing zoom/pan
function clientToLonLat(clientX, clientY) {
  const pt = new DOMPoint(clientX, clientY).matrixTransform(svg.node.getScreenCTM().inverse());
  return toLonLat((pt.x - view.tx) / view.k, (pt.y - view.ty) / view.k);
}

/* ============================================================
   6. Interaction: wheel zoom (cursor-anchored), drag pan,
      click -> inverse projection, hover readout
   ============================================================ */
const wrap = document.getElementById('wrap');
const hoverTxt = document.getElementById('hoverTxt');
const clickTxt = document.getElementById('clickTxt');
const zoomTxt  = document.getElementById('zoomTxt');

svg.node.addEventListener('wheel', e => {
  e.preventDefault();
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.node.getScreenCTM().inverse());
  const newK = Math.max(0.5, Math.min(64, view.k * Math.exp(-e.deltaY * 0.0016)));
  const f = newK / view.k;                       // keep cursor point fixed
  view.tx = pt.x - (pt.x - view.tx) * f;
  view.ty = pt.y - (pt.y - view.ty) * f;
  view.k = newK;
  applyView();
}, { passive: false });

let drag = null;
svg.node.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, moved: 0 };
  svg.node.setPointerCapture(e.pointerId);
  wrap.classList.add('dragging');
});
svg.node.addEventListener('pointermove', e => {
  // live inverse readout
  const ll = clientToLonLat(e.clientX, e.clientY);
  hoverTxt.textContent = ll
    ? `lat ${ll[1].toFixed(3)}°, lon ${ll[0].toFixed(3)}°`
    : 'outside map frame';
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.moved > 3) {
    const rect = svg.node.getBoundingClientRect();
    const sx = (rect.width / W) * ((svg.node.clientWidth  && W  / rect.width)  || 1); // client->svg unit factor
    view.tx += dx * (W / rect.width);
    view.ty += dy * (H / rect.height);
    drag.x = e.clientX; drag.y = e.clientY;
    applyView();
  }
});
svg.node.addEventListener('pointerup', e => {
  wrap.classList.remove('dragging');
  if (drag && drag.moved <= 3) {                 // treat as click -> inverse projection
    const ll = clientToLonLat(e.clientX, e.clientY);
    if (ll) {
      const [rx, ry] = eeForward(ll[0], ll[1]);
      clickTxt.innerHTML = `<span class="lat">lat ${ll[1].toFixed(3)}°</span>, ` +
        `<span class="lon">lon ${ll[0].toFixed(3)}°</span> ` +
        `<span class="dim">(raw x=${rx.toFixed(4)}, y=${ry.toFixed(4)})</span>`;
      addMarker(ll[0], ll[1], '#ffb347', 5);
      console.log(`inverse -> lat ${ll[1].toFixed(4)}°, lon ${ll[0].toFixed(4)}°`);
    } else {
      clickTxt.textContent = 'outside map frame';
    }
  }
  drag = null;
});

/* ============================================================
   7. Forward projection UI (lat/lon -> marker)
   ============================================================ */
document.getElementById('plotBtn').onclick = () => {
  let lat = parseFloat(document.getElementById('latIn').value);
  let lon = parseFloat(document.getElementById('lonIn').value);
  if (isNaN(lat) || isNaN(lon)) return;
  lat = Math.max(-90, Math.min(90, lat));
  lon = ((lon + 180) % 360 + 360) % 360 - 180;   // wrap into [-180, 180)
  const [x, y] = eeForward(lon, lat);
  addMarker(lon, lat, '#ff5c5c', 5.5);
  clickTxt.innerHTML = `<span class="dim">plotted:</span> <span class="lat">lat ${lat.toFixed(3)}°</span>, ` +
    `<span class="lon">lon ${lon.toFixed(3)}°</span> <span class="dim">(raw x=${x.toFixed(4)}, y=${y.toFixed(4)})</span>`;
  console.log(`forward -> raw x=${x.toFixed(5)}, y=${y.toFixed(5)} (screen ${toScreen(lon, lat).map(v=>v.toFixed(1))})`);
};
document.getElementById('clearBtn').onclick = () => { markers.forEach(m => m.el.remove()); markers.length = 0; };
document.getElementById('resetBtn').onclick = () => { view.k = 1; view.tx = view.ty = 0; applyView(); };

applyView();
