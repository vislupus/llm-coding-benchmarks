<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowkit — Drag & Drop UI Builder</title>
<style>
:root{
  --bg:#141418;--panel:#1c1c22;--panel2:#24242c;--border:#30303a;--text:#e7e7ee;--muted:#9a9aab;
  --accent:#6c5ce7;--accent2:#00c48c;--guide:#ff3b7f;--sel:#4f8cff;--danger:#ff5c5c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--text);background:var(--bg);overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3a46;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-rows:48px 1fr;grid-template-columns:236px 1fr 288px;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;margin-right:6px}
.brand .logo{color:var(--accent);font-size:18px}
.name{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;width:150px;outline:none}
.name:focus{border-color:var(--accent)}
.tgroup{display:flex;align-items:center;gap:4px;padding:0 8px;border-left:1px solid var(--border);height:30px}
.spacer{flex:1}
.tb{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:5px;line-height:1}
.tb:hover{background:var(--panel2)}
.tb.active{background:rgba(108,92,231,.22);border-color:var(--accent);color:#fff}
.tb.primary{background:var(--accent);color:#fff}
.tb.primary:hover{filter:brightness(1.1)}
.tb:disabled{opacity:.35;cursor:default}
.tb:disabled:hover{background:transparent}
.lbl{color:var(--muted);min-width:44px;text-align:center}
.chk{display:flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer;padding:0 4px}
.chk input{accent-color:var(--accent);margin:0}

aside{background:var(--panel);overflow:auto;display:flex;flex-direction:column}
#left{border-right:1px solid var(--border)}
#right{border-left:1px solid var(--border)}
.ptitle{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 6px;font-weight:600}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 8px}
.pal{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 8px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .12s,transform .12s}
.pal:hover{border-color:var(--accent);transform:translateY(-1px)}
.pal:active{cursor:grabbing}
.pal .ic{font-size:18px;line-height:1;color:#cfcfe0;height:20px;display:flex;align-items:center}
.pal .nm{font-size:11px;color:var(--muted)}
#ghost{position:fixed;pointer-events:none;z-index:1000;background:rgba(108,92,231,.25);border:1px dashed var(--accent);border-radius:6px;color:#fff;padding:6px 10px;font-size:12px;display:none}
.layers{flex:1;padding:0 8px 12px;min-height:120px}
.layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;cursor:pointer;color:#cfcfe0}
.layer:hover{background:var(--panel2)}
.layer.sel{background:rgba(79,140,255,.18);color:#fff}
.layer .ic{width:18px;text-align:center;color:var(--muted)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .lk{background:transparent;border:0;cursor:pointer;opacity:.4;padding:0 2px;font-size:12px}
.layer .lk.on{opacity:1}
.empty{color:var(--muted);padding:8px 10px;font-size:12px}

#viewport{position:relative;overflow:auto;background:#101014;background-image:radial-gradient(#1f1f27 1px,transparent 1px);background-size:24px 24px}
#stageWrap{min-width:100%;min-height:100%;width:max-content;height:max-content;display:flex;align-items:center;justify-content:center;padding:48px}
#stage{position:relative;flex:0 0 auto}
#canvas{--z:1;position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4;color:#111827;cursor:default}
#canvas.grid-on{background-image:linear-gradient(to right,rgba(127,127,127,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(127,127,127,.22) 1px,transparent 1px)}
#canvas.panning{cursor:grab}
#conns{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
#conns .conn-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#conns .conn-line{pointer-events:none}
#conns .conn.selected .conn-line{filter:drop-shadow(0 0 3px rgba(79,140,255,.9))}
#conns .conn-handle{fill:#fff;stroke:var(--sel);stroke-width:2;pointer-events:all;cursor:move}
#conns .conn-end{fill:var(--sel);stroke:#fff;stroke-width:1.5;pointer-events:none}
#conns text{pointer-events:none;font-family:Inter,system-ui,sans-serif;user-select:none}
#elements{position:absolute;inset:0;pointer-events:none;z-index:2}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
#tempConn{position:absolute;left:0;top:0;overflow:visible}
.guide{position:absolute;pointer-events:none}
.guide.v{top:0;bottom:0;width:0;border-left:1px dashed var(--guide)}
.guide.h{left:0;right:0;height:0;border-top:1px dashed var(--guide)}
#marquee{position:absolute;border:1px solid var(--sel);background:rgba(79,140,255,.12);display:none}
#canvasResizer{position:absolute;right:calc(-7px/var(--z));bottom:calc(-7px/var(--z));width:calc(14px/var(--z));height:calc(14px/var(--z));background:var(--sel);border-radius:3px;cursor:nwse-resize;z-index:10;box-shadow:0 0 0 2px #fff}
#hint{position:absolute;left:12px;bottom:10px;background:rgba(20,20,26,.85);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;font-size:11px;pointer-events:none}

.el{position:absolute;pointer-events:auto;cursor:move;outline-offset:0}
.el.locked{cursor:default}
#canvas.tool-connect .el{cursor:crosshair}
.el-content{width:100%;height:100%;pointer-events:none}
.el-content *{pointer-events:none}
.el.selected{outline:calc(1px/var(--z)) solid var(--sel)}
.el.pending{outline:calc(2px/var(--z)) dashed var(--accent2)}
.el.drop-target{outline:calc(2px/var(--z)) solid var(--accent2);box-shadow:0 0 0 calc(4px/var(--z)) rgba(0,196,140,.25)}
.handle{position:absolute;width:calc(8px/var(--z));height:calc(8px/var(--z));background:#fff;border:calc(1px/var(--z)) solid var(--sel);border-radius:2px;display:none;z-index:5}
.el.single:not(.locked) .handle{display:block}
.handle.n{top:0;left:50%;transform:translate(-50%,-50%);cursor:ns-resize}
.handle.s{top:100%;left:50%;transform:translate(-50%,-50%);cursor:ns-resize}
.handle.e{left:100%;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.handle.w{left:0;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.handle.nw{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.handle.ne{left:100%;top:0;transform:translate(-50%,-50%);cursor:nesw-resize}
.handle.sw{left:0;top:100%;transform:translate(-50%,-50%);cursor:nesw-resize}
.handle.se{left:100%;top:100%;transform:translate(-50%,-50%);cursor:nwse-resize}
.port{position:absolute;width:calc(12px/var(--z));height:calc(12px/var(--z));border-radius:50%;background:var(--accent2);border:calc(2px/var(--z)) solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);opacity:0;transition:opacity .12s;cursor:crosshair;z-index:6}
.el:hover .port,.el.selected .port,#canvas.tool-connect .port{opacity:1}
.el.locked .port{display:none}
.port.top{left:50%;top:calc(-12px/var(--z));transform:translate(-50%,-50%)}
.port.bottom{left:50%;top:calc(100% + 12px/var(--z));transform:translate(-50%,-50%)}
.port.left{top:50%;left:calc(-12px/var(--z));transform:translate(-50%,-50%)}
.port.right{top:50%;left:calc(100% + 12px/var(--z));transform:translate(-50%,-50%)}

#props{padding:8px 12px 24px}
.phead{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.badge{background:rgba(108,92,231,.25);color:#c9c2ff;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sec{border-top:1px solid var(--border);padding:4px 0 10px}
.sec summary{cursor:pointer;list-style:none;padding:8px 0 6px;font-weight:600;font-size:12px;color:#d6d6e4;display:flex;align-items:center;gap:6px}
.sec summary::before{content:"▸";color:var(--muted);font-size:10px;transition:transform .12s}
.sec[open] summary::before{transform:rotate(90deg)}
.sec-body{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field.inline{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1}
.flabel{font-size:11px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none;width:100%;min-width:0;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:54px;font-family:inherit}
.field input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.colorf{display:flex;gap:6px;align-items:center}
.colorf input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);cursor:pointer;flex:0 0 auto}
.colorf input[type=text]{flex:1}
.colorf .tr{flex:0 0 auto;background:var(--panel2);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:14px}
.colorf .tr:hover{color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.sb{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;cursor:pointer;flex:1;min-width:0;white-space:nowrap}
.sb:hover{border-color:var(--accent);color:#fff}
.sb.danger:hover{border-color:var(--danger);color:#ffb3b3}
.sb.full{flex:1 1 100%}
.note{grid-column:1/-1;color:var(--muted);font-size:11px;line-height:1.5}
kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo">◈</span>Flowkit</div>
    <input id="projName" class="name" value="Untitled" title="Project name">
    <div class="tgroup">
      <button class="tb active" data-tool="select" title="Select / Move (V)">⬚ Select</button>
      <button class="tb" data-tool="connect" title="Connect elements (C)">⤳ Connect</button>
    </div>
    <div class="tgroup">
      <button id="undoBtn" class="tb" title="Undo (Ctrl+Z)">↶</button>
      <button id="redoBtn" class="tb" title="Redo (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="tgroup">
      <button id="zoomOut" class="tb" title="Zoom out">−</button>
      <span id="zoomLbl" class="lbl">100%</span>
      <button id="zoomIn" class="tb" title="Zoom in">+</button>
      <button id="zoomFit" class="tb" title="Fit canvas to view">Fit</button>
      <button id="zoom100" class="tb" title="Reset zoom">1:1</button>
    </div>
    <div class="tgroup">
      <label class="chk"><input type="checkbox" id="optGrid"> Grid</label>
      <label class="chk"><input type="checkbox" id="optSnapGrid"> Snap to grid</label>
      <label class="chk"><input type="checkbox" id="optGuides"> Smart guides</label>
    </div>
    <div class="spacer"></div>
    <div class="tgroup">
      <button id="newBtn" class="tb" title="New empty project">New</button>
      <button id="saveBtn" class="tb" title="Save project as JSON">Save</button>
      <button id="loadBtn" class="tb" title="Open a saved JSON project">Open</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
    <div class="tgroup">
      <button id="previewBtn" class="tb" title="Open the exported page in a new tab">▶ Preview</button>
      <button id="exportBtn" class="tb primary" title="Download a standalone HTML file">⬇ Export HTML</button>
    </div>
  </header>

  <aside id="left">
    <div class="ptitle">Components</div>
    <div class="palette" id="palComponents"></div>
    <div class="ptitle">Shapes</div>
    <div class="palette" id="palShapes"></div>
    <div class="ptitle">Layers</div>
    <div class="layers" id="layers"></div>
  </aside>

  <main id="viewport">
    <div id="stageWrap"><div id="stage">
      <div id="canvas">
        <svg id="conns" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="elements"></div>
        <div id="overlay">
          <div id="guides"></div>
          <div id="marquee"></div>
          <svg id="tempConn" xmlns="http://www.w3.org/2000/svg"><path id="tempPath" fill="none" stroke="#00c48c" stroke-width="2" stroke-dasharray="6 4" d=""/></svg>
        </div>
        <div id="canvasResizer" title="Drag to resize canvas"></div>
      </div>
    </div></div>
    <div id="hint">Drag components onto the canvas · Drag the green ports to connect elements · <kbd>Shift</kbd>+click to multi-select · <kbd>Space</kbd>+drag to pan · <kbd>Ctrl</kbd>+wheel to zoom</div>
  </main>

  <aside id="right"><div id="props"></div></aside>
</div>
<div id="ghost"></div>

<script>
(() => {
'use strict';
/* ───────────────────────── utilities ───────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = (p = 'e') => p + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const deepClone = o => JSON.parse(JSON.stringify(o));
const r4 = v => ({ tl: v, tr: v, br: v, bl: v });
const round = (v, d = 4) => +(+v).toFixed(d);
function hexToRgba(hex, a) {
  if (typeof hex !== 'string' || !/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex)) return hex;
  let h = hex.slice(1); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function toHex(v) {
  if (typeof v !== 'string') return '#000000';
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v.slice(1).split('').map(c => c + c).join('');
  return '#000000';
}
const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setP = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; };

/* ───────────────────────── component library ───────────────────────── */
const BASE_STYLE = {
  bg: '#ffffff', color: '#1f2937', opacity: 1,
  borderWidth: 0, borderStyle: 'solid', borderColor: '#cbd5e1',
  radius: r4(0), padding: 0,
  fontSize: 14, fontWeight: 400, fontFamily: 'inherit',
  shadow: { on: false, x: 0, y: 4, blur: 12, spread: 0, color: '#000000', alpha: 0.18, inset: false }
};
const LIB = {
  button:   { label: 'Button', group: 'Components', icon: '▭', w: 140, h: 44, props: { text: 'Button' },
              style: { bg: '#6c5ce7', color: '#ffffff', fontWeight: 600, fontSize: 15, radius: r4(8), shadow: { on: true, x: 0, y: 6, blur: 16, spread: 0, color: '#6c5ce7', alpha: .35, inset: false } } },
  text:     { label: 'Text', group: 'Components', icon: 'T', w: 220, h: 32, props: { text: 'Heading text', align: 'left', valign: 'center' },
              style: { bg: 'transparent', color: '#111827', fontSize: 20, fontWeight: 700 } },
  input:    { label: 'Input', group: 'Components', icon: '⌨', w: 220, h: 40, props: { placeholder: 'Enter text…', value: '', inputType: 'text' },
              style: { bg: '#ffffff', borderWidth: 1, borderColor: '#cbd5e1', radius: r4(6), padding: 10 } },
  textarea: { label: 'Text Field', group: 'Components', icon: '☰', w: 260, h: 100, props: { placeholder: 'Type your message…', value: '' },
              style: { bg: '#ffffff', borderWidth: 1, borderColor: '#cbd5e1', radius: r4(6), padding: 10 } },
  checkbox: { label: 'Checkbox', group: 'Components', icon: '☑', w: 170, h: 28, props: { label: 'Accept terms', checked: true, accent: '#6c5ce7' },
              style: { bg: 'transparent' } },
  toggle:   { label: 'Toggle', group: 'Components', icon: '◐', w: 180, h: 28, props: { label: 'Notifications', checked: true, accent: '#00c48c' },
              style: { bg: 'transparent' } },
  dropdown: { label: 'Dropdown', group: 'Components', icon: '▾', w: 200, h: 40, props: { options: 'Option A\nOption B\nOption C', selected: 0 },
              style: { bg: '#ffffff', borderWidth: 1, borderColor: '#cbd5e1', radius: r4(6), padding: 8 } },
  slider:   { label: 'Slider', group: 'Components', icon: '⊸', w: 220, h: 32, props: { min: 0, max: 100, step: 1, value: 40, accent: '#6c5ce7', showValue: true },
              style: { bg: 'transparent' } },
  stepper:  { label: 'Stepper', group: 'Components', icon: '±', w: 140, h: 40, props: { value: 1, min: 0, max: 99, step: 1 },
              style: { bg: '#ffffff', borderWidth: 1, borderColor: '#cbd5e1', radius: r4(8), fontWeight: 600 } },
  progress: { label: 'Progress Bar', group: 'Components', icon: '▬', w: 240, h: 14, props: { value: 65, max: 100, fillColor: '#00c48c', showLabel: false },
              style: { bg: '#e5e7eb', radius: r4(99), fontSize: 10, color: '#ffffff' } },
  rect:     { label: 'Rectangle', group: 'Shapes', icon: '▢', w: 160, h: 120, props: {},
              style: { bg: '#dbeafe', borderWidth: 2, borderColor: '#3b82f6', radius: r4(8) } },
  circle:   { label: 'Circle', group: 'Shapes', icon: '◯', w: 120, h: 120, props: {},
              style: { bg: '#fde68a', borderWidth: 2, borderColor: '#f59e0b' } },
  triangle: { label: 'Triangle', group: 'Shapes', icon: '△', w: 140, h: 120, props: { direction: 'up' },
              style: { bg: '#bbf7d0', borderWidth: 2, borderColor: '#22c55e' } },
  line:     { label: 'Line', group: 'Shapes', icon: '╱', w: 200, h: 24, props: { orientation: 'horizontal', thickness: 2, dash: 'solid' },
              style: { bg: 'transparent', color: '#334155' } },
};
const TRI = { up: '50,0 100,100 0,100', down: '0,0 100,0 50,100', left: '100,0 100,100 0,50', right: '0,0 100,50 0,100' };
const LINES = { horizontal: ['0', '50%', '100%', '50%'], vertical: ['50%', '0', '50%', '100%'], 'diag-down': ['0', '0', '100%', '100%'], 'diag-up': ['0', '100%', '100%', '0'] };

/* Shared CSS for component internals — used by the builder AND the exported page. */
const UB_CSS = `
.ub-button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .15s,transform .1s;line-height:1}
.ub-button:hover{filter:brightness(1.08)}.ub-button:active{transform:translateY(1px)}
.ub-input,.ub-textarea,.ub-select{outline:none;display:block}
.ub-textarea{resize:none;line-height:1.4}
.ub-check{display:flex;align-items:center;gap:8px;cursor:pointer}
.ub-check input{width:18px;height:18px;margin:0;flex:0 0 auto}
.ub-toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.ub-toggle input{display:none}
.ub-track{width:44px;height:24px;border-radius:12px;background:#cbd5e1;position:relative;flex:0 0 auto;transition:background .2s}
.ub-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.ub-toggle input:checked+.ub-track{background:var(--accent,#00c48c)}
.ub-toggle input:checked+.ub-track .ub-knob{left:22px}
.ub-slider{display:flex;align-items:center;gap:10px}
.ub-slider input{flex:1;margin:0;min-width:0}
.ub-slider-val{min-width:2.5em;text-align:right;font-variant-numeric:tabular-nums}
.ub-stepper{display:flex;align-items:stretch;overflow:hidden}
.ub-stepper button{flex:0 0 auto;width:36px;background:transparent;border:0;cursor:pointer;color:inherit;font:inherit;font-size:1.2em;padding:0}
.ub-stepper button:hover{background:rgba(0,0,0,.06)}
.ub-stepper .ub-step-dec{border-right:1px solid rgba(0,0,0,.12)}.ub-stepper .ub-step-inc{border-left:1px solid rgba(0,0,0,.12)}
.ub-step-val{flex:1;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ub-progress{position:relative;overflow:hidden}
.ub-progress-fill{height:100%;border-radius:inherit;transition:width .3s}
.ub-progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600}
.ub-text{display:flex;white-space:pre-wrap;overflow:hidden;word-break:break-word}

document.addEventListener('keydown', e => {

    Object.assign(createConnection(ok.id, 'right', dash.id, 'left'), { label: 'redirect', routing: 'orthogonal', color: '#6366f1' }),
    Object.assign(createConnection(err.id, 'bottom', btn.id, 'bottom'), { label: 'retry', routing: 'orthogonal', mid: 0.5, color: '#94a3b8', dash: 'dotted' }),
  ];
}

/* ───────────────────────── boot ───────────────────────── */
const style = document.createElement('style'); style.textContent = '.el-content{' + '}' + UB_CSS; document.head.appendChild(style);
buildPalette();
let booted = false;
try { const saved = JSON.parse(localStorage.getItem('flowkit-project') || 'null'); if (saved && saved.elements && saved.elements.length) { loadProject(saved); booted = true; } } catch (e) { /* ignore */ }
if (!booted) { demoProject(); $('#projName').value = state.name; renderAll(); commit(); }
requestAnimationFrame(zoomFit);
})();
</script>
</body>
</html>
