<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy RTS Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; color: white; }
        .button { margin: 5px; padding: 10px; background: rgba(0, 0, 0, 0.5); border: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <button class="button" onclick="gatherResources()">Gather Resources</button>
        <button class="button" onclick="buildStructure()">Build Structure</button>
        <button class="button" onclick="recruitUnits()">Recruit Units</button>
    </div>
    <script>
        // Basic Three.js Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Basic Terrain
        const geometry = new THREE.PlaneGeometry(100, 100, 10, 10);
        const material = new THREE.MeshPhongMaterial({ color: 0x556b2f });
        const terrain = new THREE.Mesh(geometry, material);
        terrain.rotation.x = - Math.PI / 2;
        scene.add(terrain);

        camera.position.set(0, 20, 20);
        camera.lookAt(0, 0, 0);

        // Main Game Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Game Functions
        function gatherResources() {
            console.log("Gathering resources...");
        }

        function buildStructure() {
            console.log("Building structure...");
        }

        function recruitUnits() {
            console.log("Recruiting units...");
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
