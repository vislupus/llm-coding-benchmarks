<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Aetherhold - Stylized 3D Survival RTS</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
html,body{margin:0;height:100%;background:#0a0e14;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#ui{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;gap:10px;align-items:center;background:linear-gradient(#16202e,#16202ecc);color:#e8f4ff;font-size:14px;z-index:10}
#ui .panel{background:#0f1724cc;border:1px solid #2a3b55;border-radius:10px;padding:8px 12px;box-shadow:0 4px 20px #0006}
#resources{display:flex;gap:16px}
#builds button,#train button{margin:2px;padding:6px 10px;border:0;border-radius:8px;background:#2a3b55;color:#e8f4ff;cursor:pointer}
#builds button:hover,#train button:hover{background:#3a4f7a}
#minimap{position:absolute;right:12px;bottom:12px;width:180px;height:180px;border:2px solid #2a3b55;border-radius:10px;background:#081018;opacity:.9}
#hud{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;color:#fff;text-align:center;text-shadow:0 2px 6px #000}
canvas{display:block}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="ui">
  <div class="panel" id="resources">
    <div>Wood: <b id="resWood">100</b></div>
    <div>Gold: <b id="resGold">50</b></div>
    <div>Pop: <b id="resPop">3/20</b></div>
    <div>Wave: <b id="resWave">0</b></div>
  </div>
  <div class="panel" id="builds">
    <b>Build</b><br>
    <button data-b="barracks">Barracks 120W</button>
    <button data-b="tower">Tower 100W 50G</button>
  </div>
  <div class="panel" id="train">
    <b>Train</b><br>
    <button data-u="spear">Spear 50W</button>
    <button data-u="archer">Archer 60W 20G</button>
  </div>
</div>
<canvas id="minimap"></canvas>
<div id="hud">Right-click ground to move | Click units to select</div>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,85,85); camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff,0.6); scene.add(ambient);
const dir = new THREE.DirectionalLight(0xfff0d0,1.2); dir.position.set(30,80,20); dir.castShadow=true; scene.add(dir);

// Stylized ground
const groundGeo = new THREE.PlaneGeometry(200,200,64,64);
const pos = groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){ const y = Math.sin(i*0.1)*0.5; pos.setY(i,y); }
groundGeo.computeVertexNormals();
const groundMat = new THREE.MeshLambertMaterial({color:0x3a7d5a});
const ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// Miniature stylized materials
const matKeep = new THREE.MeshLambertMaterial({color:0xf2c777});
const matWall = new THREE.MeshLambertMaterial({color:0x9aa8b8});
const matTree = new THREE.MeshLambertMaterial({color:0x2f5d3a});
const matGold = new THREE.MeshLambertMaterial({color:0xffd166});
const matUnit = new THREE.MeshLambertMaterial({color:0x6fb3ff});
const matEnemy = new THREE.MeshLambertMaterial({color:0xff6b6b});
const matTower = new THREE.MeshLambertMaterial({color:0xc9d6e3});

// Player keep
const keep = new THREE.Mesh(new THREE.BoxGeometry(10,8,10), matKeep); keep.position.set(0,4,0); keep.castShadow=true; scene.add(keep);
let hpKeep = 1000;

// Resources
const resources = {wood:100,gold:50,pop:3,popMax:20};
const nodes = [];
function makeTree(x,z){ const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.7,3), matTree); trunk.position.set(x,1.5,z); trunk.castShadow=true; scene.add(trunk); const crown=new THREE.Mesh(new THREE.ConeGeometry(2,3,6), matTree); crown.position.set(x,3.5,z); scene.add(crown); nodes.push({type:'wood',x,z,mesh:trunk,alive:true});}
function makeGold(x,z){ const g=new THREE.Mesh(new THREE.BoxGeometry(2,2,2), matGold); g.position.set(x,1,z); g.castShadow=true; scene.add(g); nodes.push({type:'gold',x,z,mesh:g,alive:true});}
for(let i=0;i<12;i++){ makeTree((Math.random()-0.5)*120, (Math.random()-0.5)*120); }
for(let i=0;i<6;i++){ makeGold((Math.random()-0.5)*120, (Math.random()-0.5)*120); }

// Units
const units=[]; const buildings=[]; const enemies=[];
const unitGeo = new THREE.ConeGeometry(0.6,1.8,6);
function spawnUnit(type,x,z,isEnemy=false){
  const m = new THREE.Mesh(unitGeo, isEnemy?matEnemy:matUnit);
  m.position.set(x,0.9,z); m.castShadow=true;
  scene.add(m);
  units.push({mesh:m,type,isEnemy, hp:100, speed: isEnemy?2.2:2.8, target:null, gather:null, state:'idle'});
  resources.pop++;
}
for(let i=0;i<3;i++) spawnUnit('worker', 4+Math.random()*2, 4+Math.random()*2);

// Buildings
function build(type,x,z){
  if(type==='barracks' && resources.wood>=120){ resources.wood-=120; const b=new THREE.Mesh(new THREE.BoxGeometry(8,6,8), matWall); b.position.set(x,3,z); b.castShadow=true; scene.add(b); buildings.push({type,x,z,mesh:b}); }
  if(type==='tower' && resources.wood>=100 && resources.gold>=50){ resources.wood-=100; resources.gold-=50; const t=new THREE.Mesh(new THREE.CylinderGeometry(2,2.5,10,8), matTower); t.position.set(x,5,z); t.castShadow=true; scene.add(t); buildings.push({type:'tower',x,z,mesh:t,hp:400}); }
}

// Enemy camp
const enemyBase = new THREE.Mesh(new THREE.BoxGeometry(12,6,12), new THREE.MeshLambertMaterial({color:0x4a1a1a})); enemyBase.position.set(90,3,90); scene.add(enemyBase);

// UI refs
const resWood = document.getElementById('resWood');
const resGold = document.getElementById('resGold');
const resPop  = document.getElementById('resPop');
const resWave = document.getElementById('resWave');

// Input
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
let selected = [];
renderer.domElement.addEventListener('pointerdown', e=>{
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit = ray.intersectObjects(units.map(u=>u.mesh));
  if(e.button===0 && hit.length){ selectUnit(hit[0].object); }
  else if(e.button===2){
    const groundHit = ray.intersectObject(ground);
    if(groundHit.length){ const p=groundHit[0].point; selected.forEach(u=>{u.target={x:p.x,z:p.z};}); }
  }
});
function selectUnit(mesh){ selected = units.filter(u=>u.mesh===mesh && !u.isEnemy); }

document.getElementById('builds').onclick=e=>{ if(e.target.dataset.b){ build(e.target.dataset.b, (Math.random()-0.5)*40, (Math.random()-0.5)*40); }};
document.getElementById('train').onclick=e=>{
  if(!e.target.dataset.u) return;
  const cost = {spear:[50,0], archer:[60,20]}[e.target.dataset.u];
  if(resources.wood>=cost[0] && resources.gold>=cost[1] && resources.pop<resources.popMax){
    resources.wood-=cost[0]; resources.gold-=cost[1];
    spawnUnit(e.target.dataset.u, 6+Math.random()*4, 6+Math.random()*4);
  }
};

// Wave system
let wave=0; let waveTimer=0;
function spawnWave(){
  wave++; resWave.textContent=wave;
  const count = 6 + wave*3;
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2; const r=110;
    spawnUnit('brute', Math.cos(ang)*r, Math.sin(ang)*r, true);
  }
}

// Game loop
let last=performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now;
  waveTimer-=dt; if(waveTimer<=0){ spawnWave(); waveTimer=30+Math.max(0,10-wave*0.5); }

  // Day/night
  const t = (now*0.00005)%1; dir.intensity = 0.6+Math.sin(t*Math.PI*2)*0.6;
  scene.background.lerpColors(new THREE.Color(0x0a0e14), new THREE.Color(0x1a2330), 0.5+Math.sin(t*Math.PI*2)*0.5);

  // Update units
  units.forEach(u=>{
    const m=u.mesh; let vx=0,vz=0;
    if(u.isEnemy){
      // move to keep
      vx = keep.position.x - m.position.x; vz = keep.position.z - m.position.z;
      const d=Math.hypot(vx,vz);
      if(d>1.5){ m.position.x+=vx/d*u.speed*dt; m.position.z+=vz/d*u.speed*dt; }
      else { hpKeep-=20*dt; }
    } else {
      // simple worker gathering
      if(!u.target && !u.gather){
        const node = nodes.find(n=>n.alive && Math.hypot(n.x-m.position.x,n.z-m.position.z)<80);
        if(node){ u.gather=node; }
      }
      if(u.gather && u.gather.alive){
        const dx=u.gather.x-m.position.x, dz=u.gather.z-m.position.z;
        const d=Math.hypot(dx,dz);
        if(d>0.5){ m.position.x+=dx/d*u.speed*dt; m.position.z+=dz/d*u.speed*dt; }
        else { if(u.gather.type==='wood'){resources.wood+=1;} else {resources.gold+=1;} }
      }
      if(u.target){ const dx=u.target.x-m.position.x, dz=u.target.z-m.position.z; const d=Math.hypot(dx,dz); if(d>0.2){m.position.x+=dx/d*u.speed*dt; m.position.z+=dz/d*u.speed*dt;} else {u.target=null;} }
    }
    m.position.y=0.9;
  });

  // Towers attack
  buildings.forEach(b=>{
    if(b.type==='tower'){
      const target = enemies.find(e=>Math.hypot(e.mesh.position.x-b.x, e.mesh.position.z-b.z)<25);
      if(target){ /* visual pulse */ b.mesh.material.color.offsetHSL(0,0.02,0); }
    }
  });

  // Update UI
  resWood.textContent=resources.wood|0; resGold.textContent=resources.gold|0; resPop.textContent=resources.pop+'/'+resources.popMax;

  // Defeat/victory
  if(hpKeep<=0){ document.getElementById('hud').textContent='DEFEAT - Keep destroyed'; }
  if(wave>=10){ document.getElementById('hud').textContent='VICTORY - Survived waves'; }

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
spawnWave(); waveTimer=20;
requestAnimationFrame(loop);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
