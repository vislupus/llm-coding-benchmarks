    const mc=this.el.mm, mx=this.mmCtx;
    mx.imageSmoothingEnabled=true;
    mx.drawImage(c,0,0,mc.width,mc.height);
    this.mmReady=true;
  },
  minimap(){
    if(!this.mmReady) return;
    const mc=this.el.mm, x=this.mmCtx, W=mc.width, H=mc.height;
    x.clearRect(0,0,W,H);
    x.globalAlpha=1; x.drawImage(this.mmBase,0,0,W,H);
    const P=v=>(v/CFG.map+0.5)*W;
    // fog veil
    x.fillStyle='rgba(8,11,16,.72)';
    for(let j=0;j<FGRID;j++)for(let i=0;i<FGRID;i++){
      if(FogGrid.exp[j*FGRID+i]) continue;
      x.fillRect(i/FGRID*W, j/FGRID*H, W/FGRID+1, H/FGRID+1);
    }
    // buildings
    for(const b of G.buildings){
      x.fillStyle = b.team===0?'#6fd0e8': (b.blight?'#c79bff':'#b06ad0');
      const s=b.blight?5:3.4;
      x.fillRect(P(b.x)-s/2,P(b.z)-s/2,s,s);
    }
    for(const s of G.sites){ x.fillStyle='#e8a33c'; x.fillRect(P(s.x)-2,P(s.z)-2,4,4); }
    // units
    for(const u of G.units){
      if(u.dead) continue;
      if(u.team===1&&!visibleToPlayer(u.x,u.z)) continue;
      x.fillStyle = u.team===0?'#ffe08a':(u.def.hero?'#ff6a8a':'#ff7a5a');
      x.beginPath(); x.arc(P(u.x),P(u.z), u.def.hero?4:2.4,0,TAU); x.fill();
    }
    // camera rect
    const half=Main.cam.dist*0.52;
    x.strokeStyle='rgba(255,255,255,.85)'; x.lineWidth=2;
    x.strokeRect(P(Main.cam.tx-half),P(Main.cam.tz-half),(half*2/CFG.map)*W,(half*2/CFG.map)*H);
  },
  /* ---------- tooltips / toasts ---------- */
  showTip(e,title,desc,cost){
    const t=this.el.tip;
    let html=`<b>${title}</b>`;
    if(desc) html+=`<span>${desc}</span>`;
    if(cost&&cost.length){
      html+='<div class="cost">'+cost.map(c=>`<span><i style="background:${hex(RES_COLOR[c[0]])}"></i>${RES_NAME[c[0]]} ${c[1]}</span>`).join('')+'</div>';
    }
    t.innerHTML=html; t.style.display='block'; this.moveTip(e);
  },
  moveTip(e){
    const t=this.el.tip;
    const w=t.offsetWidth||220, h=t.offsetHeight||80;
    let x=e.clientX+16, y=e.clientY+16;
    if(x+w>innerWidth-8) x=e.clientX-w-14;
    if(y+h>innerHeight-8) y=e.clientY-h-14;
    t.style.left=x+'px'; t.style.top=y+'px';
  },
  hideTip(){ this.el.tip.style.display='none'; },
};
function toast(msg,kind){
  const d=document.createElement('div');
  d.className='toast'+(kind?' '+kind:''); d.textContent=msg;
  UI.el.toasts.appendChild(d);
  setTimeout(()=>d.remove(),3200);
}
function banner(big,sm){
  const b=UI.el.banner;
  b.querySelector('.big').textContent=big; b.querySelector('.sm').textContent=sm||'';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
function showAlert(msg){
  const a=UI.el.alert; a.textContent=msg; a.classList.add('show');
  clearTimeout(showAlert._t); showAlert._t=setTimeout(()=>a.classList.remove('show'),5200);
}
function dayPart(){
  const t=World.time;
  if(t<0.2) return 'Night'; if(t<0.3) return 'Dawn'; if(t<0.42) return 'Morning';
  if(t<0.58) return 'Noon'; if(t<0.72) return 'Afternoon'; if(t<0.84) return 'Dusk'; return 'Night';
}

/* =====================================================================
   80-main : renderer, camera, input, loop, overlays
   ===================================================================== */
const Main={
  canvas:null, renderer:null, scene:null, camera:null,
  cam:{ tx:World.playerBase.x, tz:World.playerBase.z+6, dist:56, yaw:-0.35, pitch:0.86, ttx:0, ttz:0, tdist:0, tyaw:0 },
  keys:{}, mouse:{x:0,y:0,down:false,btn:0,sx:0,sy:0,moved:false,world:new T.Vector3()},
  box:{active:false,x0:0,y0:0,x1:0,y1:0},
  panning:false, lastPX:0, lastPY:0, edgeScroll:true,
  ghost:null, ghostKey:null, buildMode:false, research:null,
  hpBars:null, rings:[], ringPool:[], lastT:0, acc:0, fpsT:0, fpsN:0, fps:60,
  paused:false, gameStarted:false, ended:false,

  /* ---------------- setup ---------------- */
  init(){
    this.canvas=document.getElementById('scene');
    this.renderer=new T.WebGLRenderer({canvas:this.canvas,antialias:true,powerPreference:'high-performance'});
    this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    this.renderer.setSize(innerWidth,innerHeight);
    this.renderer.outputEncoding=T.sRGBEncoding;
    this.renderer.toneMapping=T.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure=1.06;
    this.renderer.shadowMap.enabled=true;
    this.renderer.shadowMap.type=T.PCFSoftShadowMap;
    this.renderer.setClearColor(0x0d1620,1);

    this.scene=new T.Scene();
    this.scene.fog=new T.Fog(0xbcd7e8,90,300);
    this.camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,0.6,900);

    World.group=new T.Group();
    this.scene.add(World.group);
    this.scene.add(buildTerrain());
    this.scene.add(buildWater());
    this.scene.add(buildSky());
    this.scene.add(buildClouds());

    // lights
    const hemi=new T.HemisphereLight(0xbcd9ef,0x6a5a45,0.72);
    this.scene.add(hemi); World.lights.hemi=hemi;
    const sun=new T.DirectionalLight(0xfff0d0,1.5);
    sun.castShadow=true;
    sun.shadow.mapSize.width=1024; sun.shadow.mapSize.height=1024;
    const S=46;
    sun.shadow.camera.left=-S; sun.shadow.camera.right=S; sun.shadow.camera.top=S; sun.shadow.camera.bottom=-S;
    sun.shadow.camera.near=1; sun.shadow.camera.far=200; sun.shadow.bias=-0.0016; sun.shadow.normalBias=0.06;
    this.scene.add(sun); this.scene.add(sun.target);
    World.lights.sun=sun;
    const fill=new T.DirectionalLight(0x9fc4e8,0.28);
    fill.position.set(-40,30,-60); this.scene.add(fill); World.lights.fill=fill;

    initFog(); initArrows(); Fx.init();
    initHpBars();

    UI.init();
    UI.buildMinimap();

    // world contents
    const groups=scatterNodes();
    buildNodeMeshes(groups);
    initAI();
    this.setupPlayerBase();

    this.cam.ttx=this.cam.tx; this.cam.ttz=this.cam.tz;
    this.bindInput();
    this.showIntro();
    addEventListener('resize',()=>{ this.resize(); });
    this.loop();
  },
  resize(){
    this.camera.aspect=innerWidth/innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(innerWidth,innerHeight);
  },

  /* ---------------- player start ---------------- */
  setupPlayerBase(){
    const b=World.playerBase;
    const th=spawnBuilding('townhall',b.x,b.z,TEAM.PLAYER,true);
    th.rally={x:b.x+9,z:b.z+7};
    for(let i=0;i<6;i++){
      const a=i/6*TAU, r=6.5;
      const u=spawnUnit('villager',b.x+Math.cos(a)*r,b.z+Math.sin(a)*r,TEAM.PLAYER);
      u.order={type:'idle'};
      // assign starting gather jobs
      const n=findNodeNear(u.x,u.z,'wood');
      if(n) orderGather(u,n);
    }
    // a small garrison so the first raid is survivable
    for(let i=0;i<2;i++){
      const u=spawnUnit('militia',b.x-4.5+i*2.2,b.z+5.5,TEAM.PLAYER);
      u.order={type:'idle'};
    }
    // starting buildings
    spawnBuilding('barracks',b.x-7.5,b.z+2.5,TEAM.PLAYER,true);
    spawnBuilding('farm',b.x+6.5,b.z-4.5,TEAM.PLAYER,true);
  },

  /* ---------------- input ---------------- */
  bindInput(){
    const cv=this.canvas;
    addEventListener('keydown',e=>{
      this.keys[e.code]=true;
      if(e.code==='Space'){ e.preventDefault(); this.togglePause(); }
      if(e.code==='KeyF'){ this.cycleSpeed(); }
      if(e.code==='KeyA'&&!e.ctrlKey){ this.selectAll('worker'); }
      if(e.code==='KeyM'&&!e.ctrlKey){ this.selectAll('military'); }
      if(e.code==='KeyB'){ this.toggleTab('build'); }
      if(e.code==='KeyC'&&!e.ctrlKey){ this.toggleTab('council'); }
      if(e.code==='KeyS'&&!e.ctrlKey){ this.command('stop'); }
      if(e.code==='KeyH'){ this.command('hold'); }
      if(e.code==='KeyT'){ this.command('attack'); }
      if(e.code==='Digit1'){ this.command('form','box'); }
      if(e.code==='Digit2'){ this.command('form','line'); }
      if(e.code==='Digit3'){ this.command('form','column'); }
      if(e.code==='Digit4'){ this.command('form','circle'); }
      if(e.code==='Escape'){ this.cancelBuild(); }
    });
    addEventListener('keyup',e=>{ this.keys[e.code]=false; });
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    cv.addEventListener('mousedown',e=>{
      Audio.init(); Audio.resume();
      this.mouse.down=true; this.mouse.btn=e.button; this.mouse.sx=e.clientX; this.mouse.sy=e.clientY;
      this.mouse.moved=false;
      if(e.button===2||e.button===1){ this.panning=true; this.lastPX=e.clientX; this.lastPY=e.clientY; }
      if(e.button===0){ this.box.active=true; this.box.x0=e.clientX; this.box.y0=e.clientY; this.box.x1=e.clientX; this.box.y1=e.clientY; }
    });
    addEventListener('mouseup',e=>{
      document.getElementById('selbox').style.display='none';
      if(e.button===0&&this.box.active){
        const w=Math.abs(this.box.x1-this.box.x0), h=Math.abs(this.box.y1-this.box.y0);
        if(w<5&&h<5){ this.clickSelect(e.clientX,e.clientY,e.shiftKey); }
        else this.boxSelect(e.shiftKey);
      }
      this.box.active=false;
      this.mouse.down=false;
      if(e.button===2||e.button===1){ this.panning=false; }
      if(e.button===0&&this.buildMode){ this.placeGhost(); return; }
      if(e.button===2){ this.rightClick(e.clientX,e.clientY); }
    });
    addEventListener('mousemove',e=>{
      this.mouse.x=e.clientX; this.mouse.y=e.clientY;
      if(this.box.active){
        this.box.x1=e.clientX; this.box.y1=e.clientY;
        const sb=document.getElementById('selbox');
        sb.style.display='block';
        sb.style.left=Math.min(this.box.x0,this.box.x1)+'px';
        sb.style.top=Math.min(this.box.y0,this.box.y1)+'px';
        sb.style.width=Math.abs(this.box.x1-this.box.x0)+'px';
        sb.style.height=Math.abs(this.box.y1-this.box.y0)+'px';
      }
      if(this.panning){
        const dx=e.clientX-this.lastPX, dy=e.clientY-this.lastPY;
        this.lastPX=e.clientX; this.lastPY=e.clientY;
        const s=this.cam.dist*0.0016;
        const yaw=this.cam.yaw;
        this.cam.tx -= (dx*Math.cos(yaw) - dy*Math.sin(yaw))*s;
        this.cam.tz -= (dx*Math.sin(yaw) + dy*Math.cos(yaw))*s;
        this.cam.ttx=this.cam.tx; this.cam.ttz=this.cam.tz;
      }
      this.updateGhost();
    });
    cv.addEventListener('wheel',e=>{
      e.preventDefault();
      this.cam.dist=clamp(this.cam.dist*(1+Math.sign(e.deltaY)*0.12),16,110);
    },'{passive:false}');
    // minimap navigation
    const mm=document.getElementById('minimap');
    mm.addEventListener('mousedown',e=>{
      const r=mm.getBoundingClientRect();
      const mx=(e.clientX-r.left)/r.width, mz=(e.clientY-r.top)/r.height;
      this.cam.tx=(mx-0.5)*CFG.map; this.cam.tz=(mz-0.5)*CFG.map;
      this.cam.ttx=this.cam.tx; this.cam.ttz=this.cam.tz;
    });
    document.getElementById('btnPause').addEventListener('click',()=>this.togglePause());
    document.getElementById('btnSpeed').addEventListener('click',()=>this.cycleSpeed());
    document.getElementById('btnSound').addEventListener('click',()=>{
      Audio.on=!Audio.on; Audio.init();
      document.getElementById('btnSound').classList.toggle('on',Audio.on);
    });
    document.getElementById('btnSound').classList.add('on');
  },

  /* ---------------- selection ---------------- */
  screenOf(x,y,z){
    const v=new T.Vector3(x,y,z).project(this.camera);
    return {x:(v.x*0.5+0.5)*innerWidth, y:(-v.y*0.5+0.5)*innerHeight, z:v.z};
  },
  pickUnitAt(sx,sy,team){
    let best=null,bd=42;
    for(const u of G.units){
      if(u.dead) continue;
      if(u.team!==team) continue;
      const p=this.screenOf(u.x,u.y+1,u.z);
      if(p.z<0||p.z>1) continue;
      const d=Math.hypot(p.x-sx,p.y-sy);
      if(d<bd){bd=d;best=u;}
    }
    return best;
  },
  pickBuildingAt(sx,sy,team){
    let best=null,bd=40;
    for(const b of G.buildings){
      if(b.dead) continue;
      if(b.team!==team) continue;
      const p=this.screenOf(b.x,b.y+1.5,b.z);
      if(p.z<0||p.z>1) continue;
      const d=Math.hypot(p.x-sx,p.y-sy);
      if(d<bd){bd=d;best=b;}
    }
    return best;
  },
  pickNodeAt(sx,sy){
    let best=null,bd=36;
    for(const n of World.nodes){
      if(n.amount<=0) continue;
      const p=this.screenOf(n.x,terrainHeight(n.x,n.z)+1,n.z);
      if(p.z<0||p.z>1) continue;
      const d=Math.hypot(p.x-sx,p.y-sy);
      if(d<bd){bd=d;best=n;}
    }
    return best;
  },
  clickSelect(sx,sy,add){
    if(this.attackMode){
      const en=this.pickUnitAt(sx,sy,TEAM.ENEMY)||this.pickBuildingAt(sx,sy,TEAM.ENEMY);
      if(en){
        for(const u of G.sel) orderAttack(u,en);
        this.attackMode=false; UI.hideTip();
        toast('Attacking');
        return;
      }
      this.attackMode=false;
    }
    const u=this.pickUnitAt(sx,sy,TEAM.PLAYER);
    if(u){ selectUnit(u,add); return; }
    const b=this.pickBuildingAt(sx,sy,TEAM.PLAYER);
    if(b){ selectBuilding(b,add); return; }
    if(!add) clearSel();
  },
  boxSelect(add){
    const x0=Math.min(this.box.x0,this.box.x1), x1=Math.max(this.box.x0,this.box.x1);
    const y0=Math.min(this.box.y0,this.box.y1), y1=Math.max(this.box.y0,this.box.y1);
    if(!add){ for(const s of G.sel) s.sel=false; G.sel.length=0; G.selB=null; }
    for(const u of G.units){
      if(u.team!==TEAM.PLAYER||u.dead) continue;
      const p=this.screenOf(u.x,u.y+1,u.z);
      if(p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1){ if(G.sel.indexOf(u)<0){u.sel=true;G.sel.push(u);} }
    }
  },
  selectAll(kind){
    clearSel();
    for(const u of G.units){
      if(u.team!==TEAM.PLAYER||u.dead) continue;
      const isW=u.def.role==='worker';
      if(kind==='worker'&&!isW) continue;
      if(kind==='military'&&isW) continue;
      u.sel=true; G.sel.push(u);
    }
  },

  /* ---------------- right click commands ---------------- */
  rightClick(sx,sy){
    if(this.buildMode){ this.placeGhost(); return; }
    if(!G.sel.length&&!G.selB) return;
    const enemyU=this.pickUnitAt(sx,sy,TEAM.ENEMY);
    const enemyB=this.pickBuildingAt(sx,sy,TEAM.ENEMY);
    const node=this.pickNodeAt(sx,sy);
    const mine=this.pickBuildingAt(sx,sy,TEAM.PLAYER);
    const ground=this.groundAt(sx,sy);
    if(this.rallyMode&&G.selB&&ground){ G.selB.rally={x:ground.x,z:ground.z}; this.rallyMode=false; toast('Rally point set','good'); return; }
    const sel=G.sel.slice();
    if(enemyU||enemyB){
      const t=enemyU||enemyB;
      for(const u of sel){
        if(u.def.role==='worker'&&!enemyU) continue;
        orderAttack(u,t);
      }
      G.pendingForm=null;
      return;
    }
    if(mine&&mine.prog>=1&&!this.box.active){
      // rally point
      for(const u of sel) if(u.def.role==='worker') orderGather(u,node||null);
      if(node){ for(const u of sel) if(u.def.role==='worker') orderGather(u,node); }
      return;
    }
    if(node){
      for(const u of sel) if(u.def.role==='worker') orderGather(u,node);
      G.pendingForm=null;
      return;
    }
    // ground move
    const p=ground;
    if(!p) return;
    this.showDest(sx,sy);
    const form=G.pendingForm;
    if(form){
      const n=sel.length;
      const cols = form==='line'? n : form==='column'? 1 : Math.ceil(Math.sqrt(n));
      const rows = form==='line'? 1 : form==='column'? n : Math.ceil(n/cols);
      const sp=2.3;
      sel.forEach((u,i)=>{
        const cx=form==='column'?0:(i%cols), cy=form==='line'?0:(form==='column'?i:Math.floor(i/cols));
        const ox=(cx-(cols-1)/2)*sp, oy=(cy-(rows-1)/2)*sp;
        const yaw=this.cam.yaw;
        const wx=p.x+ox*Math.cos(yaw)+oy*Math.sin(yaw);
        const wz=p.z-ox*Math.sin(yaw)+oy*Math.cos(yaw);
        setOrder(u,{type:'move',x:wx,z:wz});
      });
      G.pendingForm=null;
    } else {
      // loose formation around the click
      const n=sel.length;
      const cols=Math.ceil(Math.sqrt(n)), sp=2.2;
      sel.forEach((u,i)=>{
        const cx=(i%cols)-(cols-1)/2, cy=Math.floor(i/cols)-Math.ceil(n/cols)/2+0.5;
        const yaw=this.cam.yaw;
        const wx=p.x+cx*sp*Math.cos(yaw)+cy*sp*Math.sin(yaw);
        const wz=p.z-cx*sp*Math.sin(yaw)+cy*sp*Math.cos(yaw);
        setOrder(u,{type:'move',x:wx,z:wz});
      });
    }
  },

  showDest(x,y){
    const d=document.getElementById('dest');
    d.style.left=x+'px'; d.style.top=y+'px'; d.style.display='block';
    clearTimeout(this._destT);
    this._destT=setTimeout(()=>d.style.display='none',700);
  },
  /* ---------------- ground picking ---------------- */
  groundAt(sx,sy){
    const nx=(sx/innerWidth)*2-1, ny=-(sy/innerHeight)*2+1;
    const rc=new T.Raycaster();
    rc.setFromCamera({x:nx,y:ny},this.camera);
    const ray=rc.ray;
    const tmp=this._tmpV||(this._tmpV=new T.Vector3());
    // find a coarse t where the ray crosses the terrain
    let t0=null,t1=null;
    const o=ray.origin, d=ray.direction;
    let prevT=0, prevDiff=o.y-terrainHeight(o.x,o.z);
    for(let i=1;i<=90;i++){
      const tt=i*3.2;
      const p=ray.at(tt,tmp);
      const diff=p.y-terrainHeight(p.x,p.z);
      if(prevDiff>0&&diff<=0){ t0=prevT; t1=tt; break; }
      prevT=tt; prevDiff=diff;
    }
    if(t0===null){
      // fallback: intersect with y=0
      if(Math.abs(d.y)<1e-5) return null;
      const t=(0-o.y)/d.y; if(t<0) return null;
      const p=ray.at(t,tmp); return new T.Vector3(p.x,terrainHeight(p.x,p.z),p.z);
    }
    for(let i=0;i<12;i++){
      const mid=(t0+t1)/2, p=ray.at(mid,tmp);
      if(p.y>terrainHeight(p.x,p.z)) t0=mid; else t1=mid;
    }
    const p=ray.at((t0+t1)/2,tmp);
    return new T.Vector3(p.x,terrainHeight(p.x,p.z),p.z);
  },

  /* ---------------- building placement ---------------- */
  pickBuild(key){
    if(!canAfford(BLD_DEF[key].cost)){ toast('Not enough resources','warn'); return; }
    this.buildMode=true; this.ghostKey=key;
    if(!this.ghost||this.ghost.key!==key){
      if(this.ghost){ World.group.remove(this.ghost.mesh); this.ghost=null; }
      const geo=buildGeo(key,false);
      const mat=new T.MeshStandardMaterial({color:0x6fd08a,transparent:true,opacity:0.42,roughness:1,flatShading:true,depthWrite:false});
      const m=new T.Mesh(geo,mat);
      m.renderOrder=5;
      World.group.add(m);
      this.ghost={key,mesh:m,mat};
    }
    this.toggleTab('build',true);
    toast('Click the ground to place the '+BLD_DEF[key].name,'good');
  },
  cancelBuild(){
    this.buildMode=false; this.ghostKey=null;
    if(this.ghost){ this.ghost.mat.color.setHex(0x6fd08a); this.ghost.mat.opacity=0.42; }
  },
  updateGhost(){
    if(!this.buildMode||!this.ghost) return;
    const p=this.groundAt(this.mouse.x,this.mouse.y);
    if(!p) return;
    this.ghost.mesh.position.set(p.x,p.y,p.z);
    const ok=validPlacement(this.ghostKey,p.x,p.z);
    this.ghost.mat.color.setHex(ok?0x6fd08a:0xe0604e);
    this.ghost.mat.opacity=ok?0.5:0.34;
  },
  placeGhost(){
    const p=this.groundAt(this.mouse.x,this.mouse.y);
    if(!p) return;
    if(placeBuilding(this.ghostKey,p.x,p.z)){
      Audio.build();
      const s=G.sites[G.sites.length-1];
      buildSiteVisual(s);
      this.cancelBuild();
    }
  },

  /* ---------------- research ---------------- */
  startResearch(key){
    const t=TECH_DEF[key];
    if(G.tech[key]) return;
    if(G.research){ toast('The council is already at work','warn'); return; }
    if(!G.buildings.some(b=>b.team===0&&b.key===t.req)){ toast('Requires '+(t.req==='wardenshall'?"Warden's Hall":'Town Hall'),'warn'); return; }
    if(!canAfford(t.cost)){ toast('Not enough resources','warn'); return; }
    pay(t.cost);
    G.research={key,p:0,t:0};
    toast('Researching '+t.name,'good');
  },

  /* ---------------- command card ---------------- */
  command(act,key){
    Audio.init(); Audio.resume();
    switch(act){
      case 'stop': for(const u of G.sel) orderStop(u); break;
      case 'hold': for(const u of G.sel) orderHold(u); break;
      case 'attack': this.attackMode=true; toast('Click an enemy to attack'); break;
      case 'form': G.pendingForm=G.pendingForm===key?null:key; break;
      case 'selworkers': this.selectAll('worker'); break;
      case 'selarmy': this.selectAll('military'); break;
      case 'buildtab': this.toggleTab('build'); break;
      case 'counciltab': this.toggleTab('council'); break;
      case 'train': if(G.selB) enqueue(G.selB,key); break;
      case 'upgrade': this.upgrade(G.selB); break;
      case 'rally': if(G.selB){ toast('Click the ground to set the rally point'); this.rallyMode=true; } break;
      case 'gather': toast('Click a tree, rock or vein'); this.gatherMode=true; break;
      case 'return': for(const u of G.sel) orderStop(u); break;
      case 'move': break;
      case 'attackmove': break;
      case 'speed': this.cycleSpeed(); break;
    }
  },
  toggleTab(which,force){
    document.querySelectorAll('.tabs button').forEach(b=>{
      const on = force? b.dataset.tab===which : b.classList.contains('on');
      if(on) b.classList.add('on'); else b.classList.remove('on');
    });
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('on'));
    const el=document.getElementById(which==='build'?'tabBuild':'tabCouncil');
    if(el) el.classList.add('on');
  },
  upgrade(b){
    if(!b||b.team!==TEAM.PLAYER||b.tier>=3) return;
    const cost={wood:60+40*b.tier, gold:50+40*b.tier, stone:40+30*b.tier};
    if(!canAfford(cost)){ toast('Not enough resources','warn'); return; }
    pay(cost);
    b.tier++;
    const h=b.maxhp*0.45;
    b.maxhp+=h; b.hp+=h;
    // rebuild the mesh with the new tier
    if(b.key!=='blightcore'&&b.key!=='spire'){
      World.group.remove(b.mesh);
      const geo=buildGeo(b.key,b.tier>1);
      const m=new T.Mesh(geo,buildingMaterial());
      m.castShadow=true; m.receiveShadow=true;
      m.position.set(b.x,b.y,b.z); m.rotation.y=b.mesh.rotation.y;
      World.group.add(m); b.mesh=m;
    }
    Audio.done();
    toast(b.def.name+' upgraded to tier '+(b.tier+1),'good');
  },
  togglePause(){ this.paused=!this.paused; document.getElementById('btnPause').classList.toggle('on',this.paused); },
  cycleSpeed(){ G.speed = G.speed===1?2:(G.speed===2?3:1); toast('Speed '+G.speed+'x'); },

  /* ---------------- overlays ---------------- */
  showIntro(){
    const o=UI.el.overlay;
    o.innerHTML=`<div class="panel">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="crest" style="width:38px;height:38px"></div>
        <div><b style="font-size:13px;letter-spacing:3px;color:var(--amber)">A STRATEGY SURVIVAL GAME</b>
        <h1 style="margin-top:4px">Aurovale <em>·</em> The Long Watch</h1></div>
      </div>
      <p class="sub">The blight has come up out of the Hollow. Gather what you can, raise a kingdom, and hold
      the pass until you can march out and break the heart of it.</p>
      <div class="rule"></div>
      <div class="cols">
        <div>
          <div class="key"><kbd>LMB</kbd><span><b>Select</b> a unit or building · drag a box for many</span></div>
          <div class="key"><kbd>RMB</kbd><span><b>Command</b> — move, attack, gather, build</span></div>
          <div class="key"><kbd>A</kbd><span>Select all workers · <kbd style="min-width:0">M</kbd> all soldiers</span></div>

        </div>

    const notes=['Steady raids. Learn the ropes.','Relentless waves. Keep your walls high.','The blight fights back. Hold nothing back.'];
    o.querySelectorAll('#diffSeg button').forEach(b=>b.addEventListener('click',()=>{

      o.querySelector('#diffNote').textContent=notes[+b.dataset.d];
    }));

  endGame(won){
    if(this.ended) return;
    this.ended=true; G.gameOver=true;
    const o=UI.el.overlay; o.classList.remove('hidden');

      <h1 style="color:${won?'var(--amber)':'var(--blood)'}">${won?'The Watch Holds':'The Kingdom Falls'}</h1>

        'The Town Hall has burned. The blight takes the valley.'}</p>
      <div id="endStats">
        <div><span>Waves survived</span><b>${AI.wave}</b></div>
        <div><span>Kills</span><b>${G.stats.kills}</b></div>
        <div><span>Resources gathered</span><b>${fmtN(G.stats.collected)}</b></div>
        <div><span>Buildings raised</span><b>${G.stats.built}</b></div>
        <div><span>Losses</span><b>${G.stats.lost}</b></div>
        <div><span>Days held</span><b>${World.day}</b></div>
      </div>
      <div class="btnrow"><button class="btn" id="againBtn">Play again</button>
      <span style="font-size:11.5px;color:var(--dim2)">${won?'Victory':'Defeat'} on ${DIFF[AI.diff].name} difficulty.</span></div>
    </div>`;

    if(won) Audio.win(); else Audio.lose();

  /* ---------------- camera + loop ---------------- */
  updateCamera(dt){
    const c=this.cam;
    let mv=0;
    if(this.keys['KeyW']||this.keys['ArrowUp']) mv+=1;
    if(this.keys['KeyS']&&!this.keys['ShiftLeft']) mv-=1;
    if(this.keys['KeyA']&&this.keys['ControlLeft']) mv-=1;
    if(this.keys['KeyD']&&this.keys['ControlLeft']) mv+=1;
    if(this.keys['ArrowLeft']) c.yaw-=1.1*dt;
    if(this.keys['ArrowRight']) c.yaw+=1.1*dt;
    if(this.keys['KeyQ']) c.yaw-=1.1*dt;
    if(this.keys['KeyE']) c.yaw+=1.1*dt;
    if(mv){
      const s=c.dist*0.85*dt;
      const yaw=c.yaw;
      c.tx+=Math.sin(yaw)*mv*s; c.tz+=Math.cos(yaw)*mv*s;
    }
    // edge scroll
    if(this.edgeScroll&&this.gameStarted&&!this.paused){
      const m=18, sp=c.dist*0.9*dt;
      let ex=0,ez=0;
      if(this.mouse.x<m) ex-=1; if(this.mouse.x>innerWidth-m) ex+=1;
      if(this.mouse.y<m) ez-=1; if(this.mouse.y>innerHeight-m) ez+=1;
      if(ex||ez){
        const yaw=c.yaw;
        c.tx+=ex*Math.cos(yaw)*sp+ez*Math.sin(yaw)*sp;
        c.tz+=-ex*Math.sin(yaw)*sp+ez*Math.cos(yaw)*sp;
      }
    }
    const lim=CFG.map*0.52;
    c.tx=clamp(c.tx,-lim,lim); c.tz=clamp(c.tz,-lim,lim);
    c.dist=clamp(c.dist,16,110);
    const pitch=c.pitch;
    const h=Math.sin(pitch)*c.dist, r=Math.cos(pitch)*c.dist;
    const gy=terrainHeight(c.tx,c.tz);
    this.camera.position.set(c.tx+Math.sin(c.yaw)*r, gy+h, c.tz+Math.cos(c.yaw)*r);
    this.camera.lookAt(c.tx,gy+1.5,c.tz);
    this.camera.updateMatrixWorld();
  },
  updateDayNight(dt){
    World.time+=dt/CFG.dayLength;
    if(World.time>=1){ World.time-=1; World.day++; }
    const t=World.time;
    const elev=Math.sin((t-0.25)*TAU);
    const azim=(t-0.25)*TAU;
    const day=clamp(elev*1.8+0.25,0,1);
    World.night = day<0.18;
    const sun=World.lights.sun;
    const fx=this.cam.tx, fz=this.cam.tz;
    sun.position.set(fx+Math.cos(azim)*80, Math.max(8,elev*85), fz+Math.sin(azim)*80);
    sun.target.position.set(fx,0,fz);
    sun.target.updateMatrixWorld();
    sun.intensity=0.16+day*1.46;
    sun.color.setHSL(0.09, 0.55-day*0.25, 0.5+day*0.28);
    World.lights.hemi.intensity=0.34+day*0.48;
    World.lights.hemi.color.setHSL(0.56,0.45,0.22+day*0.42);
    World.lights.hemi.groundColor.setHSL(0.09,0.3,0.1+day*0.22);
    World.lights.fill.intensity=0.16+day*0.16;
    // sky
    const sk=World.skyMat.uniforms;
    const top=new T.Color().setHSL(0.58,0.55,lerp(0.06,0.44,day));
    const mid=new T.Color().setHSL(0.55,lerp(0.25,0.5,day),lerp(0.12,0.66,day));
    const bot=new T.Color().setHSL(lerp(0.62,0.09,day),lerp(0.3,0.5,day),lerp(0.1,0.76,day));
    sk.uTop.value.copy(top); sk.uMid.value.copy(mid); sk.uBot.value.copy(bot);
    sk.uSunDir.value.copy(sun.position).normalize();
    sk.uNight.value=1-day;
    // fog
    const fogC=new T.Color().copy(mid).lerp(bot,0.45);
    this.scene.fog.color.copy(fogC);
    this.renderer.setClearColor(fogC.clone().multiplyScalar(0.8),1);
    // torches glow at night
    if(Materials.torch) Materials.torch.opacity=World.night?0.95:0.0;
  },
  renderUnits(){
    for(const type in UnitRender){
      const r=UnitRender[type];
      let n=0;
      for(const u of G.units){
        if(u.type!==type) continue;
        if(n>=r.mesh.instanceMatrix.count) break;
        const q=new T.Quaternion().setFromEuler(new T.Euler(u.dead?-1.4*(u.deadT/0.9):0,u.dir,0));
        const sc=u.scale*(u.dead?1:1);
        const m=new T.Matrix4().compose(new T.Vector3(u.x,u.y+(u.dead?-0.2:0),u.z),q,new T.Vector3(sc,sc,sc));
        r.mesh.setMatrixAt(n,m);
        r.attrs.aPhase.array[n]=u.phase;
        r.attrs.aAtk.array[n]=u.atk;
        r.attrs.aFlash.array[n]=u.flash;
        r.attrs.aMove.array[n]=u.moveAmt;
        n++;
      }
      r.mesh.count=n;
      r.mesh.instanceMatrix.needsUpdate=true;
      r.attrs.aPhase.needsUpdate=true; r.attrs.aAtk.needsUpdate=true;
      r.attrs.aFlash.needsUpdate=true; r.attrs.aMove.needsUpdate=true;
    }
  },
  renderHpBars(){
    const H=this.hpBars; if(!H) return;
    let n=0;
    for(const u of G.units){
      if(u.dead) continue;
      const damaged=u.hp<u.maxhp-0.5, selected=u.sel;
      if(!damaged&&!selected&&!(u.team===TEAM.ENEMY&&u.def.hero)) continue;
      if(n>=H.max) break;
      H.pos.setXYZ(n,u.x,u.y+(u.def.hero?2.9:1.9),u.z);
      H.hp.array[n]=clamp(u.hp/u.maxhp,0,1);
      H.team.array[n]=u.team;
      n++;
    }
    H.count=n;
    H.mesh.count=n;
    H.pos.needsUpdate=true; H.hp.needsUpdate=true; H.team.needsUpdate=true;
  },
  renderRings(){
    // pool of selection rings
    const sel=G.sel.filter(u=>!u.dead);
    while(this.ringPool.length<sel.length){
      const m=new T.Mesh(new T.RingGeometry(0.62,0.78,18),
        new T.MeshBasicMaterial({color:0x8ef0c0,transparent:true,opacity:0.85,side:T.DoubleSide,depthWrite:false}));
      m.rotation.x=-Math.PI/2; m.renderOrder=3;
      World.group.add(m); this.ringPool.push(m);
    }
    for(let i=0;i<this.ringPool.length;i++){
      const r=this.ringPool[i];
      if(i<sel.length){
        const u=sel[i];
        r.visible=true; r.position.set(u.x,terrainHeight(u.x,u.z)+0.08,u.z);
        r.scale.setScalar(u.def.hero?1.9:1);
      } else r.visible=false;
    }
  },
  loop(){
    requestAnimationFrame(()=>this.loop());
    const now=performance.now();
    let rawDt=(now-this.lastT)/1000; this.lastT=now;
    rawDt=Math.min(rawDt,0.5);
    let dt=Math.min(rawDt,0.05);
    // adaptive resolution for weak devices
    this.avgDt=this.avgDt?this.avgDt*0.9+rawDt*0.1:rawDt;
    const want=this.avgDt>0.075?0.62:(this.avgDt>0.04?0.8:Math.min(devicePixelRatio,2));
    if(Math.abs(want-this.renderer.getPixelRatio())>0.05){
      this.renderer.setPixelRatio(want); this.renderer.setSize(innerWidth,innerHeight);
    }
    this.fpsN++; this.fpsT+=rawDt;
    if(this.fpsT>0.5){ this.fps=Math.round(this.fpsN/this.fpsT); this.fpsN=0; this.fpsT=0;
      UI.el.fps.textContent=this.fps+' fps · '+G.units.length+' units'; }
    if(!this.paused&&this.gameStarted&&!G.gameOver){
      const sdt=dt*G.speed;
      this.step(sdt);
    }
    this.updateCamera(dt);
    this.renderUnits();
    this.renderHpBars();
    this.renderRings();
    this.renderer.render(this.scene,this.camera);
    if(this.gameStarted){
      this.uiT=(this.uiT||0)+rawDt;
      if(this.uiT>0.1){ this.uiT=0; UI.update(); }
      this.mmT=(this.mmT||0)+rawDt;
      if(this.mmT>0.09){ this.mmT=0; UI.minimap(); }
    }
  },
  simulate(seconds, stepDt){
    const s=stepDt||0.05; let t=0;
    while(t<seconds){ this.step(s); t+=s; }
  },
  step(dt){
    G.time+=dt;
    this.updateDayNight(dt);
    // population
    G.pop=0;
    for(const u of G.units){ if(u.team===TEAM.PLAYER&&!u.dead) G.pop+= (u.def.role==='cav'||u.def.hero)?2:1; }
    // food upkeep
    G.food-=G.pop*0.016*dt;
    if(G.food<0){ G.food=0; for(const u of G.units){ if(u.team===TEAM.PLAYER&&!u.dead){ u.hp-=2.2*dt; if(u.hp<=0) killUnit(u,TEAM.ENEMY); } } }
    // research
    if(G.research){
      G.research.t+=dt;
      const t=TECH_DEF[G.research.key];
      G.research.p=clamp(G.research.t/t.time,0,1);
      if(G.research.t>=t.time){ G.tech[G.research.key]=true; G.research=null; toast(t.name+' researched','good'); Audio.done(); }
    }
    // building sites
    for(const s of G.sites.slice()){
      if(G.sites.indexOf(s)<0) continue;
      s.prog=Math.max(0,s.prog);
      if(s.plane){ const sc=0.6+0.4*Math.sin(G.time*3); s.plane.material.opacity=0.14+0.12*sc; }
    }
    // production
    for(const b of G.buildings){
      if(b.team!==TEAM.PLAYER) continue;
      if(b.queue&&b.queue.length){
        const q=b.queue[0];
        const rate=(1+techVal('build'));
        const need=q.ud.time/rate;
        if(q.t>=need){
          b.queue.shift();
          const ang=RNG()*TAU, r=b.def.size*0.6+0.9;
          const ux=b.x+Math.cos(ang)*r, uz=b.z+Math.sin(ang)*r;
          const u=spawnUnit(q.key,ux,uz,TEAM.PLAYER);
          u.y=terrainHeight(ux,uz);
          if(b.rally) u.order={type:'move',x:b.rally.x,z:b.rally.z};
          Audio.done();
        }
      }
    }
    updateUnits(dt);
    updateBuildings(dt);
    updateAI(dt);
    updateEnemyOrders(dt);
    enemyAttackBuildings(dt);
    updateArrows(dt);
    Fx.update(dt);
    this.fogT=(this.fogT||0)+dt;
    if(this.fogT>0.05){ this.fogT=0; updateFog(); }
    // clouds drift
    for(const c of World.clouds){
      c.position.x+=c.userData.spd*dt;
      if(c.position.x>CFG.map*0.75) c.position.x=-CFG.map*0.75;
    }
    // arrows in flight removal handled in updateArrows
    // victory / defeat
    if(!G.gameOver){
      if(AI.core&&AI.core.hp<=0){ this.endGame(true); }
      const th=G.buildings.find(b=>b.team===TEAM.PLAYER&&b.key==='townhall'&&!b.dead);
      if(!th) this.endGame(false);
    }
  },
};

/* ---------- health bar system ---------- */
function initHpBars(){
  const max=260;
  const geo=new T.PlaneGeometry(1,1);
  const pos=new Float32Array(max*3), hp=new Float32Array(max), team=new Float32Array(max);
  const geo2=geo;
  geo2.setAttribute('aPos',new T.InstancedBufferAttribute(pos,3));
  geo2.setAttribute('aHp',new T.InstancedBufferAttribute(hp,1));
  geo2.setAttribute('aTeam',new T.InstancedBufferAttribute(team,1));
  const mat=new T.ShaderMaterial({
    transparent:true, depthTest:false, depthWrite:false,
    uniforms:{},
    vertexShader:`
      attribute vec3 aPos; attribute float aHp; attribute float aTeam;
      varying vec2 vUv; varying float vHp; varying float vTeam;
      void main(){ vUv=uv; vHp=aHp; vTeam=aTeam;
        vec4 mv=modelViewMatrix*vec4(aPos,1.0);
        mv.xy += position.xy*vec2(1.05,0.14);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`
      precision mediump float; varying vec2 vUv; varying float vHp; varying float vTeam;
      void main(){
        vec3 bg=vec3(0.05,0.06,0.08);
        vec3 fill=mix(vec3(0.92,0.26,0.20), vec3(0.38,0.84,0.55), vHp);
        float edge = min(vUv.x, 1.0-vUv.x);
        float a = edge<0.02 ? 0.0 : 0.95;
        gl_FragColor=vec4(mix(bg,fill, step(vUv.x, vHp)), a); }`
  });
  const mesh=new T.InstancedMesh(geo2,mat,max);
  mesh.frustumCulled=false; mesh.renderOrder=20;
  mesh.count=0;
  World.group.add(mesh);
  Main.hpBars={mesh,max,pos:mesh.geometry.attributes.aPos,hp:mesh.geometry.attributes.aHp,team:mesh.geometry.attributes.aTeam,count:0};
}

/* ---------- bootstrap ---------- */
Main.init();
</script>
