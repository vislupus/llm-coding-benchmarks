<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Aurovale — The Long Watch</title>
<style>
:root{
  --ink:#0d1117; --ink2:#161d26; --panel:rgba(19,26,35,.94); --panel2:rgba(28,37,48,.95);
  --line:rgba(233,223,200,.14); --line2:rgba(233,223,200,.28);
  --txt:#e9e2d4; --dim:#9aa6b4; --dim2:#6f7d8c;
  --amber:#e8a33c; --amber-d:#b87a1d; --teal:#46b3ad; --blood:#e0604e; --violet:#9b7ad0;
  --ok:#6fc38a; --shadow:0 10px 34px rgba(0,0,0,.45);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070a0e;color:var(--txt);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;font-size:13px}
#hud button,#hud .card,#hud canvas{pointer-events:auto}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:linear-gradient(180deg,rgba(9,13,18,.96),rgba(9,13,18,.72) 62%,rgba(9,13,18,.28) 92%,transparent);
}
.brand{display:flex;align-items:center;gap:10px;padding-right:14px;border-right:1px solid var(--line)}
.crest{width:30px;height:30px;border-radius:8px;background:radial-gradient(circle at 32% 28%,#f7cd7c,#b4761c 70%);
  box-shadow:0 0 0 1px rgba(255,220,150,.35),0 3px 10px rgba(0,0,0,.5);position:relative;flex:none}
.crest::after{content:"";position:absolute;inset:8px 11px 6px;background:#12181f;clip-path:polygon(50% 0,100% 32%,78% 32%,78% 100%,22% 100%,22% 32%,0 32%)}
.brand b{display:block;font-size:15px;letter-spacing:.4px}
.brand i{display:block;font-style:normal;font-size:10px;letter-spacing:1.6px;color:var(--amber);text-transform:uppercase;margin-top:1px}

#res{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);min-width:104px}
.chip svg{width:17px;height:17px;flex:none}
.chip .v{font-weight:700;font-size:14px;letter-spacing:.2px}
.chip .l{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:1.1px;margin-left:auto}
.chip.flash{animation:cf .5s}
@keyframes cf{0%{background:rgba(232,163,60,.42)}100%{background:rgba(255,255,255,.05)}}
.chip.low .v{color:var(--blood)}

#topRight{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:20px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-size:12px}
.pill b{font-size:13px}
.pill.warn{border-color:rgba(224,96,78,.6);background:rgba(224,96,78,.16);animation:pulse 1.4s infinite}
@keyframes pulse{50%{background:rgba(224,96,78,.3)}}
#clockDot{width:11px;height:11px;border-radius:50%;background:#f2c96b;box-shadow:0 0 10px #f2c96b}
#clockDot.night{background:#8fa8d8;box-shadow:0 0 10px #8fa8d8}
.iconbtn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:.12s}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.on{background:rgba(232,163,60,.24);border-color:rgba(232,163,60,.6);color:#ffd68f}

/* ---------- minimap ---------- */
#minimapPanel{position:absolute;left:14px;top:70px;width:178px;height:178px;border-radius:14px;
  overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow);background:#0d1219}
#minimap{width:100%;height:100%;display:block;cursor:crosshair}
#mmLabel{position:absolute;left:8px;top:6px;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(255,255,255,.6);text-shadow:0 1px 3px #000}

/* ---------- right panel ---------- */
#rightPanel{position:absolute;right:14px;top:70px;width:268px;max-height:calc(100% - 290px);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0;background:none;border:0;color:var(--dim);font:inherit;font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber);background:rgba(232,163,60,.08)}
.tabpane{display:none;overflow-y:auto;padding:9px;flex:1}
.tabpane.on{display:block}
.tabpane::-webkit-scrollbar{width:7px}
.tabpane::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.grp{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim2);margin:9px 4px 6px}
.bcard{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:10px;
  background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--txt);font:inherit;cursor:pointer;
  margin-bottom:5px;transition:.12s;position:relative}
.bcard:hover{background:rgba(255,255,255,.11);border-color:var(--line2);transform:translateX(2px)}
.bcard.locked{opacity:.42;cursor:not-allowed}
.bcard.locked:hover{transform:none;background:rgba(255,255,255,.04)}
.bcard .ic{width:34px;height:34px;flex:none;border-radius:9px;background:rgba(232,163,60,.13);display:grid;place-items:center}
.bcard .ic svg{width:22px;height:22px;stroke:#f0bb63}
.bcard>span:nth-child(2){flex:1;min-width:0}
.bcard .nm{display:block;font-weight:600;font-size:12.5px;line-height:1.2}
.bcard .sub{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.3}
.bcard .cost{margin-left:auto;display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex:none;padding-left:4px}
.bcard .cost span{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:3px}
.bcard .cost span i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bcard .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);border-radius:2px;width:0}

/* ---------- bottom ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;height:172px;display:flex;align-items:flex-end;
  gap:12px;padding:0 14px 12px;background:linear-gradient(0deg,rgba(7,10,14,.94),rgba(7,10,14,.55) 55%,transparent)}
#selPanel{width:322px;flex:none;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:11px;height:158px;overflow:hidden}
.selhead{display:flex;gap:11px;align-items:center}
.selhead .por{width:50px;height:50px;flex:none;border-radius:10px;background:linear-gradient(160deg,#2b3a49,#18222c);
  display:grid;place-items:center;border:1px solid var(--line2)}
.selhead .por svg{width:34px;height:34px;stroke:var(--amber);stroke-width:1.6;fill:none}
.selhead h3{font-size:15px;font-weight:700;letter-spacing:.2px}
.selhead p{font-size:11px;color:var(--dim);margin-top:2px}
.selhead .cnt{margin-left:auto;text-align:right}
.selhead .cnt b{font-size:19px}
.selhead .cnt span{display:block;font-size:9.5px;letter-spacing:1.2px;color:var(--dim2);text-transform:uppercase}
.hpbar{height:6px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;margin:9px 0 8px;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#5fbf85,#9adf9f);border-radius:4px;transition:width .18s}
.hpbar b{position:absolute;inset:0;text-align:center;font-size:9px;line-height:6px;font-weight:600;color:#04140b}
.selstats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.selstats div{background:rgba(255,255,255,.05);border-radius:7px;padding:5px 6px}
.selstats span{display:block;font-size:8.5px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase}
.selstats b{font-size:12.5px}
.selact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.minibtn{padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  color:var(--txt);font:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px}
.minibtn:hover{background:rgba(232,163,60,.2);border-color:rgba(232,163,60,.5)}
.minibtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.minibtn:disabled{opacity:.4;cursor:not-allowed}

#cmdCard{flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:9px;height:158px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cmdrow{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;overflow:hidden}
.cmd{width:58px;height:58px;border-radius:10px;background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;position:relative;transition:.12s;flex:none;color:var(--txt)}
.cmd:hover{background:rgba(232,163,60,.18);border-color:rgba(232,163,60,.55);transform:translateY(-2px)}
.cmd.sel{background:rgba(232,163,60,.3);border-color:var(--amber)}
.cmd:disabled{opacity:.36;cursor:not-allowed;transform:none}
.cmd svg{width:25px;height:25px;stroke:#f0bb63;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cmd span{font-size:8.5px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase}
.cmd .k{position:absolute;top:2px;left:4px;font-size:8px;color:var(--dim2);font-weight:700}
.cmd .q{position:absolute;inset:auto 0 0 0;height:2px;background:var(--amber);border-radius:0 0 10px 10px}
.cmdrow .sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
#cmdHint{font-size:10.5px;color:var(--dim2);letter-spacing:.3px;padding:0 2px}

/* ---------- selection box + cursor ---------- */
#selbox{position:absolute;border:1px solid rgba(120,220,180,.95);background:rgba(120,220,180,.14);
  display:none;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset}
#dest{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:none;pointer-events:none}
#dest::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,240,190,.95);
  box-shadow:0 0 12px rgba(255,220,140,.8)}
#dest::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff}

/* ---------- toast / tip ---------- */
#toasts{position:absolute;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{padding:8px 16px;border-radius:20px;background:rgba(16,22,30,.94);border:1px solid var(--line2);
  font-size:12.5px;box-shadow:var(--shadow);animation:tin .3s, tout .5s 2.6s forwards}
.toast.warn{border-color:rgba(224,96,78,.7);color:#ffc9c0}
.toast.good{border-color:rgba(111,195,138,.7);color:#c9f0d6}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#tip{position:absolute;display:none;max-width:250px;padding:9px 11px;border-radius:9px;
  background:rgba(12,17,23,.97);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:11.5px;line-height:1.45;z-index:20}
#tip b{display:block;font-size:12.5px;margin-bottom:3px}
#tip .cost{margin-top:6px;display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)}
#tip .cost i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px}

/* ---------- alert banner ---------- */
#alert{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:10px 22px;border-radius:10px;
  background:rgba(120,26,22,.9);border:1px solid rgba(255,120,100,.6);font-size:13px;letter-spacing:.6px;
  box-shadow:0 0 30px rgba(200,60,40,.4);display:none;animation:tin .4s}
#alert.show{display:block}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(14,20,28,.86),rgba(4,6,9,.96));
  display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:30}
.panel{width:640px;max-width:92vw;background:linear-gradient(170deg,rgba(24,32,42,.96),rgba(14,19,26,.97));
  border:1px solid var(--line2);border-radius:18px;padding:30px 34px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.panel h1{font-size:38px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.panel h1 em{font-style:normal;color:var(--amber)}
.panel .sub{color:var(--dim);font-size:13.5px;margin-top:8px;letter-spacing:.3px}
.rule{height:1px;background:linear-gradient(90deg,var(--amber),transparent);margin:18px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;margin:14px 0 4px}
.key{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--dim);margin-bottom:7px}
.key kbd{background:rgba(255,255,255,.09);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;font:inherit;font-size:10.5px;color:var(--txt);flex:none;min-width:22px;text-align:center}
.key b{color:var(--txt);font-weight:600}
.btn{padding:11px 24px;border-radius:10px;border:1px solid rgba(232,163,60,.55);background:linear-gradient(180deg,#e8a33c,#c07f1c);
  color:#1a1206;font:inherit;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px;transition:.14s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--txt);border-color:var(--line2);font-weight:600}
.btnrow{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.seg{display:flex;gap:5px;background:rgba(0,0,0,.35);padding:4px;border-radius:10px;border:1px solid var(--line)}
.seg button{padding:6px 13px;border-radius:7px;border:0;background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:rgba(232,163,60,.24);color:#ffd68f}
#endStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
#endStats div{background:rgba(255,255,255,.05);border-radius:10px;padding:11px}
#endStats span{display:block;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2)}
#endStats b{font-size:21px}

/* ---------- misc ---------- */
#fps{position:absolute;left:14px;top:254px;font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.35);padding:3px 7px;border-radius:6px}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}
#banner.show{opacity:1}
#banner::before{content:'';position:absolute;left:-60px;right:-60px;top:-26px;bottom:-22px;background:radial-gradient(ellipse at center,rgba(4,7,12,.72),rgba(4,7,12,0) 72%);z-index:-1}
#banner .big{font-size:34px;font-weight:800;letter-spacing:3px;text-shadow:0 6px 30px rgba(0,0,0,.85)}
#banner .sm{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--amber);margin-top:5px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#banner.show{animation:bn 3.4s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0}}
@media (max-width:900px){
  #rightPanel{width:210px}
  #minimapPanel{width:140px;height:140px}
  #fps{top:216px}
  .chip{min-width:84px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="hud">
    <header id="topbar">
      <div class="brand">
        <div class="crest"></div>
        <div><b>Aurovale</b><i>The Long Watch</i></div>
      </div>
      <div id="res"></div>
      <div id="topRight">
        <div class="pill" id="wavePill"><span id="waveTxt">Wave 1</span><b id="waveTimer">0:45</b></div>
        <div class="pill"><span id="clockDot"></span><span id="clockTxt">Day 1 · Noon</span></div>
        <button class="iconbtn" id="btnSpeed" title="Game speed (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg></button>
        <button class="iconbtn" id="btnPause" title="Pause (Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
        <button class="iconbtn" id="btnSound" title="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
      </div>
    </header>
    <div id="fps"></div>
    <div id="banner"><div class="big"></div><div class="sm"></div></div>
    <div id="toasts"></div>
    <div id="tip"></div>
    <div id="alert"></div>
    <aside id="rightPanel">
      <div class="tabs">
        <button data-tab="build" class="on">Build</button>
        <button data-tab="council">Council</button>
      </div>
      <div id="tabBuild" class="tabpane on"></div>
      <div id="tabCouncil" class="tabpane"></div>
    </aside>
    <div id="minimapPanel"><canvas id="minimap" width="372" height="372"></canvas><div id="mmLabel">Aurovale</div></div>
    <div id="selbox"></div>
    <div id="dest"></div>
    <footer id="bottom">
      <div id="selPanel"></div>
      <div id="cmdCard">
        <div id="cmdRows"></div>
        <div id="cmdHint">Right-click to command · drag to select · A selects all workers</div>
      </div>
    </footer>
    <div id="overlay" class="overlay"></div>
  </div>
</div>
<script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
<script>
"use strict";

/* =====================================================================
   10-core : configuration, math, noise, palette
   ===================================================================== */
const T = THREE;

const CFG = {
  map: 150,              // world size (square, centred on origin)
  seed: 20260903,
  visionUnit: 15.5,
  visionBuilding: 17,
  visionHero: 22,
  visionTown: 30,
  nightVisionMul: 0.62,
  dayLength: 165,        // seconds per full day/night cycle
  startWaveIn: 50,       // seconds until the first wave
  waveGapMin: 56, waveGapMax: 80,
  popCapBase: 14,
  popPerHouse: 5,
  foodPerPop: 1 / 9,     // food consumed per pop per second-ish
  grazeTime: 5.5,
  workTime: 5.0,
  buildTimeMul: 1.0,
};

/* ---------------- math helpers ---------------- */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t=> t*t*(3-2*t);
const dist2 = (ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};
const dist  = (ax,az,bx,bz)=>Math.sqrt(dist2(ax,az,bx,bz));
const TAU = Math.PI*2;
function angLerp(a,b,t){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t;}
function angTo(a,b){return Math.atan2(b-a);}
function fmtTime(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtN(n){n=Math.round(n);return n>=10000?(n/1000).toFixed(1)+'k':String(n);}

/* ---------------- seeded rng ---------------- */
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG = mulberry(CFG.seed);
function rint(a,b){return a+Math.floor(RNG()*(b-a+1));}
function rrange(a,b){return a+RNG()*(b-a);}
function pick(arr){return arr[Math.floor(RNG()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------- value noise ---------------- */
const P = new Uint8Array(512);
(function(){const r=mulberry(1337);const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)P[i]=p[i&255];})();
function vnoise(x,y){
  const xi=Math.floor(x)&255, yi=Math.floor(y)&255, xf=x-Math.floor(x), yf=y-Math.floor(y);
  const u=smooth(xf),v=smooth(yf);
  const h=(a,b)=>P[(P[a&255]+b)&255]/255;
  const n00=h(xi,yi),n10=h(xi+1,yi),n01=h(xi,yi+1),n11=h(xi+1,yi+1);
  return lerp(lerp(n00,n10,u),lerp(n01,n11,u),v);
}
function fbm(x,y,oct=4,lac=2.0,gain=0.5){
  let a=1,f=1,s=0,n=0;
  for(let i=0;i<oct;i++){s+=a*vnoise(x*f,y*f);n+=a;a*=gain;f*=lac;}
  return s/n;
}

/* ---------- height field ---------- */
function terrainHeight(x,z){
  const rr = Math.sqrt(x*x+z*z)/(CFG.map*0.5);
  let h = 8.4 + (fbm(x*0.0112+3.7, z*0.0112+9.1, 4)-0.5)*12.0;
  h += (fbm(x*0.043+17.2, z*0.043+5.5, 3)-0.5)*3.4;
  // rocky highland ridge to the north-east
  const ridge = fbm(x*0.017+44.0, z*0.017+21.0, 3);
  h += Math.max(0, ridge-0.52)*34.0;
  // central lake basin
  const ld = Math.sqrt((x-4)*(x-4)+(z-26)*(z-26));
  h -= Math.max(0, 1-ld/15)*11.0;
  // island falloff into the sea
  const edge = smooth(clamp((rr-0.68)/0.32,0,1));
  h = lerp(h, -8.0, edge);
  // plateaus
  const fl = (cx,cz,r,hTarget)=>{
    const d = Math.sqrt((x-cx)*(x-cx)+(z-cz)*(z-cz));
    const t = 1-smooth(clamp((d-r)/(r*0.75),0,1));
    return t;
  };
  let t = fl(World.playerBase.x, World.playerBase.z, 11, 0);
  h = lerp(h, 7.6, t*0.92);
  t = fl(World.enemyBase.x, World.enemyBase.z, 10, 0);
  h = lerp(h, 8.4, t*0.90);
  return h;
}
World.heightAt = terrainHeight;
World.slopeAt = function(x,z){
  const d=1.6;
  const a=terrainHeight(x-d,z), b=terrainHeight(x+d,z), c=terrainHeight(x,z-d), e=terrainHeight(x,z+d);
  return Math.sqrt((a-b)*(a-b)+(c-e)*(c-e))/(2*d);
};

/* ---------- terrain mesh ---------- */
function buildTerrain(){
  const SEG=88, S=CFG.map, half=S/2, step=S/SEG;
  const pos=[], col=[];
  const cA=new T.Color(), cB=new T.Color();
  const colorFor=(x,z,h,sl)=>{
    const n=fbm(x*0.08+1.1, z*0.08+2.2,2);
    if(h<0.4) return cA.setHex(PAL.sand).lerp(cB.setHex(PAL.mud), clamp(-h/6,0,1)).clone();
    if(sl>0.62) return cA.setHex(PAL.rock).lerp(cB.setHex(PAL.rockD), n).clone();
    if(h>13.5) return cA.setHex(PAL.rock).lerp(cB.setHex(PAL.snow), clamp((h-14)/7,0,1)).clone();
    if(h>9.2)  return cA.setHex(PAL.dry).lerp(cB.setHex(PAL.rock), clamp((h-9.2)/5,0,1)).clone();
    if(h<2.6)  return cA.setHex(PAL.sand).lerp(cB.setHex(PAL.grassB), clamp((h-0.4)/2.2,0,1)).clone();
    const base = n<0.34?PAL.grassB:(n<0.62?PAL.grassA:PAL.grassC);
    return cA.setHex(base).lerp(cB.setHex(PAL.grassB), clamp((6-h)/9,0,1)*0.5).clone();
  };
  World.colorFor=colorFor;
  const push=(x,z,y,c)=>{pos.push(x,y,z);col.push(c.r,c.g,c.b);};
  for(let j=0;j<SEG;j++)for(let i=0;i<SEG;i++){
    const x0=-half+i*step, x1=x0+step, z0=-half+j*step, z1=z0+step;
    const h00=terrainHeight(x0,z0),h10=terrainHeight(x1,z0),h01=terrainHeight(x0,z1),h11=terrainHeight(x1,z1);
    const cxm=(x0+x1)/2, czm=(z0+z1)/2;
    const cA1=colorFor(cxm,czm,(h00+h10+h01+h11)/4, World.slopeAt(cxm,czm));
    cA1.convertSRGBToLinear();
    // split quad with a deterministic diagonal for a faceted look
    const flip=((i*7+j*13)%2)===0;
    const P=(x,z,h)=>[x,h,z];
    const a=P(x0,z0,h00), b=P(x1,z0,h10), c=P(x1,z1,h11), d=P(x0,z1,h01);
    const tris = flip?[[a,c,b],[a,d,c]]:[[a,d,b],[c,b,d]];
    for(const t of tris){ for(const v of t){ pos.push(v[0],v[1],v[2]); col.push(cA1.r,cA1.g,cA1.b);} }
  }
  const geo=new T.BufferGeometry();
  geo.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  geo.setAttribute('color', new T.Float32BufferAttribute(col,3));
  geo.computeVertexNormals();
  const mat=new T.MeshStandardMaterial({vertexColors:true, roughness:0.95, metalness:0.0, flatShading:true});
  applyFog(mat);
  const mesh=new T.Mesh(geo,mat);
  mesh.receiveShadow=true;
  mesh.castShadow=false;
  mesh.name='terrain';
  World.terrain=mesh;
  return mesh;
}

/* ---------- water ---------- */
function buildWater(){
  const geo=new T.PlaneGeometry(CFG.map*1.9,CFG.map*1.9,44,44);
  geo.rotateX(-Math.PI/2);
  const mat=new T.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ uTime:{value:0}, uDeep:{value:new T.Color(0x11374f)}, uShallow:{value:new T.Color(0x3d84a6)},
               uSun:{value:new T.Vector3(0.4,0.8,0.2)}, uSunCol:{value:new T.Color(0xffe6b0)},
               uFogVis:FogU.uFogVis, uFogExp:FogU.uFogExp, uFogRect:FogU.uFogRect },
    vertexShader:`
      varying vec3 vW; varying float vWave;
      uniform float uTime;
      void main(){
        vec3 p=position;
        float w = sin(p.x*0.28 + uTime*1.1)*0.16 + sin(p.z*0.21 - uTime*0.8)*0.14 + sin((p.x+p.z)*0.13+uTime*0.6)*0.2;
        p.y += w;
        vWave = w;
        vW = (modelMatrix*vec4(p,1.0)).xyz;
        gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.0);
      }`,
    fragmentShader:`
      precision highp float;
      varying vec3 vW; varying float vWave;
      uniform vec3 uDeep,uShallow,uSunCol; uniform vec3 uSun;
      uniform sampler2D uFogVis; uniform sampler2D uFogExp; uniform vec4 uFogRect;
      void main(){
        float f = smoothstep(-0.35,0.32,vWave);
        vec3 col = mix(uDeep,uShallow,f);
        vec3 V = normalize(cameraPosition - vW);
        float spec = pow(max(0.0,dot(normalize(V+vec3(vWave*3.0,0.0,vWave*3.0)),uSun)),24.0);
        col += uSunCol*spec*0.20;
        float rip = smoothstep(0.30,0.34,vWave);
        col += uSunCol*rip*0.05;
        vec2 fuv=(vW.xz-uFogRect.xy)/uFogRect.zw;
        float vis=texture2D(uFogVis,fuv).r; float ex=texture2D(uFogExp,fuv).r;
        col = mix(vec3(0.052,0.062,0.082), col, ex*mix(0.58,1.0,vis));
        gl_FragColor=vec4(col,0.93);
      }`
  });
  const m=new T.Mesh(geo,mat);
  m.position.y=0.55; m.renderOrder=-1;
  m.name='water';
  World.water=mat;
  return m;
}

/* ---------- sky dome ---------- */
function buildSky(){
  const geo=new T.SphereGeometry(420,32,20);
  const mat=new T.ShaderMaterial({
    side:T.BackSide, depthWrite:false,
    uniforms:{ uTop:{value:new T.Color(0x4d8fc4)}, uMid:{value:new T.Color(0xbcd9ea)},
               uBot:{value:new T.Color(0xf6e6cf)}, uSunDir:{value:new T.Vector3(0,1,0)},
               uSunCol:{value:new T.Color(0xfff0c0)}, uSunSize:{value:0.0016}, uNight:{value:0} },
    vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`
      precision highp float;
      varying vec3 vD; uniform vec3 uTop,uMid,uBot,uSunDir,uSunCol; uniform float uSunSize,uNight;
      void main(){
        vec3 d=normalize(vD);
        float h=clamp(d.y*0.5+0.5,0.0,1.0);
        vec3 col=mix(uBot,uMid,smoothstep(0.42,0.56,h));
        col=mix(col,uTop,smoothstep(0.54,0.95,h));
        float s=max(0.0,dot(d,normalize(uSunDir)));
        col+=uSunCol*pow(s,380.0)*1.1;
        col+=uSunCol*pow(s,9.0)*0.16*(1.0-uNight);
        // stars at night
        float st=step(0.9992, fract(sin(dot(floor(d.xz*260.0),vec2(12.9898,78.233)))*43758.5453));
        col+=vec3(st)*uNight*smoothstep(0.1,0.6,d.y)*0.9;
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const m=new T.Mesh(geo,mat);
  m.renderOrder=-2;
  World.skyMat=mat;
  return m;
}

/* ---------- clouds ---------- */
function buildClouds(){
  const g=new T.Group();
  for(let i=0;i<14;i++){
    const grp=new T.Group();
    const n=3+Math.floor(RNG()*3);
    for(let k=0;k<n;k++){
      const r=6+RNG()*10;
      const s=new T.Mesh(new T.SphereGeometry(r,9,7), new T.MeshStandardMaterial({color:0xffffff,roughness:1,transparent:true,opacity:0.82,flatShading:true}));
      s.position.set((RNG()-0.5)*26,(RNG()-0.5)*5,(RNG()-0.5)*18);
      s.scale.set(1,0.52,1);
      grp.add(s);
    }
    grp.position.set((RNG()-0.5)*CFG.map*1.1, 52+RNG()*26, (RNG()-0.5)*CFG.map*1.1);
    grp.userData.spd=0.35+RNG()*0.5;
    g.add(grp); World.clouds.push(grp);
  }
  return g;
}

const NODE_DEF = {
  wood:{label:'Tree', res:'wood', amount:140, color:PAL.wood},
  stone:{label:'Rock', res:'stone', amount:160, color:PAL.stone},
  gold:{label:'Gold vein', res:'gold', amount:120, color:PAL.gold},
  food:{label:'Berry bush', res:'food', amount:90, color:0xc0453f},
};

function scatterNodes(){
  const groups={wood:[],stone:[],gold:[],food:[]};
  const taken=[];
  const near=(x,z,r)=> taken.some(p=>dist2(p.x,p.z,x,z)<r*r);
  const place=(type,n,minD,range)=>{
    let guard=0;
    while(n>0 && guard++<4000){
      const x=rrange(-range,range), z=rrange(-range,range);
      const h=terrainHeight(x,z);
      if(h<1.6||h>12.5) continue;
      if(World.slopeAt(x,z)>0.75) continue;
      if(near(x,z,minD)) continue;
      // keep the two bases clear
      if(dist(x,z,World.playerBase.x,World.playerBase.z)<13) continue;
      if(dist(x,z,World.enemyBase.x,World.enemyBase.z)<12) continue;
      if(dist(x,z,6,20)<11) continue;   // lake
      taken.push({x,z});
      groups[type].push({x,z,type});
      n--;
    }
  };
  place('wood',34,7.5,58);
  place('stone',22,8,58);
  place('gold',13,9,58);
  place('food',17,7,52);
  // a dependable starting cluster around the town hall
  const placeNear=(type,n,r0,r1)=>{
    let guard=0;
    while(n>0&&guard++<2500){
      const a=RNG()*TAU, r=rrange(r0,r1);
      const x=World.playerBase.x+Math.cos(a)*r, z=World.playerBase.z+Math.sin(a)*r;
      const h=terrainHeight(x,z);
      if(h<1.8||h>11) continue;
      if(World.slopeAt(x,z)>0.5) continue;
      if(near(x,z,5.5)) continue;
      taken.push({x,z});
      groups[type].push({x,z,type}); n--;
    }
  };
  placeNear('wood',10,9,26); placeNear('stone',6,10,26); placeNear('gold',4,12,27); placeNear('food',5,9,24);
  return groups;
}

function buildNodeMeshes(groups){
  const lib = ModelLib.nodeGeo();
  const mk=(geoKey,list,type)=>{
    if(!list.length) return;
    const mesh=new T.InstancedMesh(lib[geoKey], NodeMaterials(geoKey), list.length);
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.instanceMatrix.setUsage(T.StaticDrawUsage);
    mesh.frustumCulled=false;
    const m=new T.Matrix4();
    list.forEach((n,i)=>{
      const s=0.85+RNG()*0.45;
      m.compose(new T.Vector3(n.x, terrainHeight(n.x,n.z)-0.15, n.z),
                new T.Quaternion().setFromEuler(new T.Euler(0,RNG()*TAU,0)),
                new T.Vector3(s,s,s));
      mesh.setMatrixAt(i,m);
      n.amount = NODE_DEF[type].amount;
      n.max = n.amount;
      n.id = World.nodes.length;
      n.ref={mesh,idx:i};
      World.nodes.push(n);
    });
    mesh.count=list.length;
    World.group.add(mesh);
    World.nodeMeshes[geoKey]=mesh;
  };
  const pines=[],broads=[];
  groups.wood.forEach((n,i)=>{(i%3===0?pines:broads).push(n);});
  mk('wood',pines,'wood');
  mk('broad',broads,'wood');
  mk('stone',groups.stone,'stone');
  mk('gold',groups.gold,'gold');
  mk('food',groups.food,'food');
}
function hideNode(n){
  if(!n.ref) return;
  n.ref.mesh.setMatrixAt(n.ref.idx,new T.Matrix4().makeScale(0,0,0));
  n.ref.mesh.instanceMatrix.needsUpdate=true;
  n.amount=0;
}

/* ---------- geometry helpers ---------- */
function box(w,h,d){return new T.BoxGeometry(w,h,d);}
function cyl(rt,rb,h,seg=8){return new T.CylinderGeometry(rt,rb,h,seg);}
function cone(r,h,seg=7){return new T.CylinderGeometry(0,r,h,seg);}
function sph(r,seg=8){return new T.SphereGeometry(r,seg,Math.max(5,seg-2));}
function ico(r,det=0){return new T.IcosahedronGeometry(r,det);}
function octa(r){return new T.OctahedronGeometry(r,0);}
function torus(r,t,seg=10,rad=6){return new T.TorusGeometry(r,t,rad,seg);}

function part(geo,color,pos,rot,scale,limb){
  const p = pos||[0,0,0], r = rot||[0,0,0], s = scale||[1,1,1];
  const mat=new T.Matrix4();
  mat.compose(new T.Vector3(p[0],p[1],p[2]),
    new T.Quaternion().setFromEuler(new T.Euler(r[0],r[1],r[2])),
    new T.Vector3(s[0],s[1],s[2]));
  return {geo, color:new T.Color(color), mat, limb:limb||0};
}

function mergeParts(parts){
  let total=0;
  const prep=parts.map(p=>{
    let g=p.geo.index? p.geo.toNonIndexed() : p.geo.clone();
    g.applyMatrix4(p.mat);
    if(!g.attributes.normal) g.computeVertexNormals();
    total+=g.attributes.position.count;
    const c=new T.Color(p.color); c.convertSRGBToLinear();
    return {g,c,l:p.limb|0};
  });
  const pos=new Float32Array(total*3), nrm=new Float32Array(total*3), col=new Float32Array(total*3), lim=new Float32Array(total);
  let o=0;
  for(const p of prep){
    const pa=p.g.attributes.position.array, na=p.g.attributes.normal.array, n=p.g.attributes.position.count;
    for(let i=0;i<n;i++){
      pos[(o+i)*3]=pa[i*3]; pos[(o+i)*3+1]=pa[i*3+1]; pos[(o+i)*3+2]=pa[i*3+2];
      nrm[(o+i)*3]=na[i*3]; nrm[(o+i)*3+1]=na[i*3+1]; nrm[(o+i)*3+2]=na[i*3+2];
      col[(o+i)*3]=p.c.r; col[(o+i)*3+1]=p.c.g; col[(o+i)*3+2]=p.c.b;
      lim[o+i]=p.l;
    }
    o+=n;
  }
  const geo=new T.BufferGeometry();
  geo.setAttribute('position',new T.BufferAttribute(pos,3));
  geo.setAttribute('normal',new T.BufferAttribute(nrm,3));
  geo.setAttribute('color',new T.BufferAttribute(col,3));
  geo.setAttribute('aLimb',new T.BufferAttribute(lim,1));
  geo.computeBoundingSphere();
  return geo;
}

/* ---------- shared materials ---------- */
const Materials = {};
function unitMaterial(){
  if(Materials.unit) return Materials.unit;
  const m=new T.MeshStandardMaterial({vertexColors:true,roughness:0.78,metalness:0.08,flatShading:true});
  applyFog(m); patchInstanced(m);
  Materials.unit=m; return m;
}
function buildingMaterial(){
  if(Materials.building) return Materials.building;
  const m=new T.MeshStandardMaterial({vertexColors:true,roughness:0.86,metalness:0.04,flatShading:true});
  applyFog(m);
  Materials.building=m; return m;
}
function NodeMaterials(type){
  Materials['n_'+type]=Materials['n_'+type]||(()=>{
    const m=new T.MeshStandardMaterial({vertexColors:true,roughness:0.92,metalness:0.02,flatShading:true});
    applyFog(m); return m;})();
  return Materials['n_'+type];
}

function legs(P,col,wide,limbBase){
  const w=wide||0.14, l=limbBase||0.44;
  P.push(part(box(w,l*0.92,w*1.15),col,[-w*0.95, l*0.46, 0],null,null,1));
  P.push(part(box(w,l*0.92,w*1.15),col,[ w*0.95, l*0.46, 0],null,null,2));
}
function arms(P,col,y,l){
  P.push(part(box(0.13,0.4,0.14),col,[-0.26,y,l||0],null,null,0));
  P.push(part(box(0.13,0.4,0.14),col,[ 0.26,y,l||0],null,null,3));
}

  P.push(part(box(0.44,0.12,0.3),0x8a5f3a,[0,0.5,0]));              // belt
  P.push(part(sph(0.16,8),0xe0b48c,[0,1.06,0]));                   // head
  P.push(part(cone(0.26,0.2,8),0xd8b463,[0,1.19,0]));              // straw hat

/* militia : sword & shield */
function geoMilitia(){
  const P=[];
  legs(P,0x3b4250,0.16);
  P.push(part(box(0.46,0.5,0.3),0x3a5f8f,[0,0.78,0]));
  P.push(part(box(0.2,0.42,0.32),0x2f4a6b,[0,0.76,0.01]));         // tabard
  P.push(part(box(0.5,0.1,0.34),0x8a6a3a,[0,0.56,0]));             // belt
  P.push(part(sph(0.17,8),0xe3bb92,[0,1.12,0]));
  P.push(part(sph(0.195,8),0xa9b4c0,[0,1.14,0]));                 // helm

/* =====================================================================

   ===================================================================== */
function roof(w,d,h,col,over){
  const o=over||0.18;
  const P=[];
  P.push(part(box(w+2*o,h,d+2*o),col,[0,h*0.5,0]));
  P.push(part(box(w*0.62,h*0.9,d+2*o+0.02),col,[0,h*0.5,0]));
  return P;
}
function pitchedRoof(w,d,h,col){
  const P=[];
  const steps=5;
  for(let i=0;i<steps;i++){
    const t=i/steps, t2=(i+1)/steps;
    const ww=lerp(w*0.62,w+0.5,t2), dd=lerp(d+0.5,d*0.55,t2);
    P.push(part(box(ww,h/steps*1.05,dd),col,[0,h*(t+t2)/2,0]));
  }
  return P;
}
function banner(P,x,y,z,col,s){
  const s2=s||1;
  P.push(part(box(0.06* s2,1.5*s2,0.06*s2),0x5a4630,[x,y,z]));
  P.push(part(box(0.44*s2,0.5*s2,0.04*s2),col,[x+0.24*s2,y+0.4*s2,z]));
}
function window3d(P,x,y,z,w,h,col){
  P.push(part(box(w,h,0.06),col||0x2b3444,[x,y,z]));
}

/* ---------- material patching ---------- */
let PATCH_SEQ=0;
function patchMaterial(mat, fn, tag){
  mat.userData.patches = mat.userData.patches||[];
  fn.__id = tag||('p'+ (++PATCH_SEQ));
  mat.userData.patches.push(fn);
  if(!mat.userData.__patched){
    mat.userData.__patched = true;
    const prev = mat.onBeforeCompile;
    mat.onBeforeCompile = (shader)=>{
      if(prev) prev(shader);
      for(const p of mat.userData.patches) p(shader);
      mat.userData.shader = shader;
    };
    mat.customProgramCacheKey = ()=> 'patch'+mat.userData.patches.map(p=>p.__id).join('_');
  }
}
/* fog of war: darkens everything outside current vision */
function applyFog(mat){
  patchMaterial(mat, (sh)=>{
    sh.uniforms.uFogVis=FogU.uFogVis; sh.uniforms.uFogExp=FogU.uFogExp; sh.uniforms.uFogRect=FogU.uFogRect;
    sh.vertexShader = 'varying vec3 vFogW;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       #ifdef USE_INSTANCING
         vFogW = (modelMatrix * instanceMatrix * vec4(transformed,1.0)).xyz;
       #else
         vFogW = (modelMatrix * vec4(transformed,1.0)).xyz;
       #endif`);
    sh.fragmentShader = 'uniform sampler2D uFogVis;\nuniform sampler2D uFogExp;\nuniform vec4 uFogRect;\nvarying vec3 vFogW;\n'
      + sh.fragmentShader.replace('#include <dithering_fragment>',
      `#include <dithering_fragment>
       {
         vec2 fuv = (vFogW.xz - uFogRect.xy) / uFogRect.zw;
         float vis = texture2D(uFogVis, fuv).r;
         float ex  = texture2D(uFogExp, fuv).r;
         float f = ex * mix(0.56, 1.0, vis);
         gl_FragColor.rgb = mix(vec3(0.048,0.058,0.078), gl_FragColor.rgb, f);
       }`);
  },'fog');
}
/* instanced unit animation: limb swing, attack, hit flash */
function patchInstanced(mat){
  patchMaterial(mat, (sh)=>{
    sh.uniforms.uTime = {value:0};
    sh.vertexShader = `
      attribute float aLimb; attribute float aPhase; attribute float aAtk; attribute float aFlash; attribute float aMove;
      varying float vFlash; varying float vPhase;
    ` + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       float sw = sin(aPhase);
       if (aLimb > 0.5 && aLimb < 2.5) {
         float dir = (aLimb < 1.5) ? 1.0 : -1.0;
         transformed.z += sw * 0.17 * dir * aMove;
         transformed.y += max(0.0, -sw) * 0.045 * aMove;
       } else if (aLimb > 2.5) {
         float k = sin(aAtk * 3.14159);
         transformed.z += -k * 0.42;
         transformed.y += k * 0.1;
       } else {
         transformed.y += abs(sw) * 0.05 * aMove;
       }
       vFlash = aFlash; vPhase = aPhase;`);
    sh.fragmentShader = 'varying float vFlash;\nvarying float vPhase;\n' + sh.fragmentShader.replace('#include <dithering_fragment>',
      `#include <dithering_fragment>
       gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0,0.32,0.24), clamp(vFlash,0.0,1.0)*0.85);`);
  },'inst');
}

/* ---------- fog state ---------- */
const FOG_RES=256, FGRID=72;
const FogU={
  uFogVis:{value:null}, uFogExp:{value:null},
  uFogRect:{value:new T.Vector4(-CFG.map/2,-CFG.map/2,CFG.map,CFG.map)}
};
const FogGrid={vis:new Uint8Array(FGRID*FGRID), exp:new Uint8Array(FGRID*FGRID)};
function initFog(){
  const c1=makeCanvas(FOG_RES,FOG_RES), c2=makeCanvas(FOG_RES,FOG_RES);
  const t1=new T.CanvasTexture(c1), t2=new T.CanvasTexture(c2);
  for(const t of [t1,t2]){ t.minFilter=T.LinearFilter; t.magFilter=T.LinearFilter; t.wrapS=t.wrapT=T.ClampToEdgeWrapping; t.flipY=false; t.generateMipmaps=false; }
  FogU.uFogVis.value=t1; FogU.uFogExp.value=t2;
  FogU.c1=c1; FogU.c2=c2; FogU.x1=ctxOf(c1); FogU.x2=ctxOf(c2);
}
function fogSrc(){ const a=[]; for(const u of G.units) if(u.team===TEAM.PLAYER&&!u.dead) a.push({x:u.x,z:u.z,r:u.sight});
  for(const b of G.buildings) if(b.team===TEAM.PLAYER&&!b.dead) a.push({x:b.x,z:b.z,r:b.def.sight});
  return a; }
function updateFog(){
  const {c1,c2,x1,x2}=FogU;
  x1.clearRect(0,0,FOG_RES,FOG_RES);
  x1.globalCompositeOperation='lighter';
  const S=FOG_RES/CFG.map, GS=FGRID/CFG.map;
  const src=fogSrc();
  for(const s of src){
    const r=s.r*S, cx=(s.x+CFG.map/2)*S, cy=(s.z+CFG.map/2)*S;
    const g=x1.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.62,'rgba(255,255,255,.82)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x1.fillStyle=g; x1.beginPath(); x1.arc(cx,cy,r,0,TAU); x1.fill();
    // coarse grid
    const gr=Math.ceil(s.r*GS), gx=Math.round((s.x+CFG.map/2)*GS), gy=Math.round((s.z+CFG.map/2)*GS);
    for(let j=-gr;j<=gr;j++)for(let i=-gr;i<=gr;i++){
      const px=gx+i, py=gy+j; if(px<0||py<0||px>=FGRID||py>=FGRID) continue;
      if(i*i+j*j > gr*gr) continue;
      FogGrid.vis[py*FGRID+px]=1; FogGrid.exp[py*FGRID+px]=1;
    }
  }
  x1.globalCompositeOperation='source-over';
  x2.globalCompositeOperation='lighten';
  x2.drawImage(c1,0,0);
  x2.globalCompositeOperation='source-over';
  FogU.uFogVis.value.needsUpdate=true;
  FogU.uFogExp.value.needsUpdate=true;
}
function gridAt(x,z){
  const gx=Math.round((x+CFG.map/2)/CFG.map*FGRID), gy=Math.round((z+CFG.map/2)/CFG.map*FGRID);
  if(gx<0||gy<0||gx>=FGRID||gy>=FGRID) return 0;
  return FogGrid.exp[gy*FGRID+gx];
}
function visibleToPlayer(x,z){
  const gx=Math.round((x+CFG.map/2)/CFG.map*FGRID), gy=Math.round((z+CFG.map/2)/CFG.map*FGRID);
  if(gx<0||gy<0||gx>=FGRID||gy>=FGRID) return false;
  return !!FogGrid.vis[gy*FGRID+gx];
}

    villager:geoVillager, militia:geoMilitia, archer:geoArcher, pike:geoPike, sunmare:geoSunmare, warden:geoWarden,
    grunt:geoGrunt, brute:geoBrute, spitter:geoSpitter, tyrant:geoTyrant };
  return ModelLib._ug[type]();
}
function getRenderer(type){
  if(UnitRender[type]) return UnitRender[type];
  const geo=unitGeoFor(type);
  const isEnemy=ENEMY_DEF[type];
  const mat=(isEnemy?new T.MeshStandardMaterial({vertexColors:true,roughness:0.8,metalness:0.06,flatShading:true})
                     :unitMaterial());
  if(isEnemy){ applyFog(mat); patchInstanced(mat); }
  const max=isEnemy?180:160;
  const mesh=new T.InstancedMesh(geo,mat,max);
  mesh.castShadow=true; mesh.receiveShadow=false;
  mesh.frustumCulled=false;
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);
  const A4=new Float32Array(max);
  const attrs={aPhase:new T.InstancedBufferAttribute(A4.slice(),1),
               aAtk:new T.InstancedBufferAttribute(new Float32Array(max),1),
               aFlash:new T.InstancedBufferAttribute(new Float32Array(max),1),
               aMove:new T.InstancedBufferAttribute(new Float32Array(max),1)};
  for(const k in attrs) geo.setAttribute(k, attrs[k]);
  const r={mesh,attrs,mat,items:[]};
  UnitRender[type]=r;
  World.group.add(mesh);
  return r;
}

let BID=1;
function spawnBuilding(key,x,z,team,free){
  const def=BLD_DEF[key];
  const b={id:BID++, key, def, team, x, z, y:terrainHeight(x,z), hp:def.hp, maxhp:def.hp,
    tier:1, prog:free?1:0, build:free?0:def.time*(1-0.4*techVal('build')), queue:[], rally:null,
    dead:false, cd:0, angle:0, mat:null, mesh:null, windows:[], sitePos:null, flash:0};
  const isEnemy = team===TEAM.ENEMY;
  const geo = isEnemy? geoBlightCore() : buildGeo(key,false);
  const mat = isEnemy? new T.MeshStandardMaterial({vertexColors:true,roughness:0.85,flatShading:true}) : buildingMaterial();
  if(isEnemy) applyFog(mat);
  const m=new T.Mesh(geo,mat);
  m.castShadow=true; m.receiveShadow=true;
  m.position.set(b.x,b.y,b.z);
  m.rotation.y=RNG()*TAU;
  m.scale.setScalar(isEnemy?1.6:1);
  World.group.add(m);
  b.mesh=m; b.mat=mat;
  G.buildings.push(b);
  if(!isEnemy){
    recomputePopCap();
    if(def.produces) b.prodAcc=0;
    // torch at the door that glows at night
    if(!Materials.torch){
      Materials.torch=new T.MeshBasicMaterial({color:0xffb347, transparent:true, opacity:0, depthWrite:false});
    }
    const tm=new T.Mesh(cone(0.16,0.5,6), Materials.torch);
    tm.position.set(b.x+def.size*0.28, b.y+1.5, b.z+def.size*0.3);
    tm.renderOrder=2;
    World.group.add(tm); b.torch=tm;
  }
  return b;
}
function buildGeo(key,tier){

    farm:geoFarm,barracks:geoBarracks,range:geoRange,stable:geoStable,watchtower:geoWatchtower,

function recomputePopCap(){

function canAfford(c){ for(const k in c) if(G[k]<c[k]) return false; return true; }
function pay(c){ for(const k in c) G[k]-=c[k]; }
function refund(c,frac){ for(const k in c) G[k]+=c[k]*(frac||1); }

function nearestDrop(type, x, z){
  let best=null,bd=1e9;
  for(const b of G.buildings){
    if(b.team!==TEAM.PLAYER||b.dead||!b.prog>=1&&false) continue;
    if(b.prog<1) continue;
    if(!b.def.drop||b.def.drop.indexOf(type)<0) continue;
    const d=dist2(x,z,b.x,b.z);
    if(d<bd){bd=d;best=b;}
  }
  return best;
}
function gatherBonus(type,x,z){
  let v=0;
  for(const b of G.buildings){
    if(b.team!==TEAM.PLAYER||b.prog<1||!b.def.bonus) continue;
    if(b.def.bonus[type]&&dist(x,z,b.x,b.z)<14) v+=b.def.bonus[type];
  }
  return v;
}

function setOrder(u,order){ u.order=order; u.state='idle'; u.target=null; u.node=null; u.site=null; }
function orderMove(u,x,z){
  const o={type:'move',x,z};
  if(G.pendingForm) o.form=G.pendingForm;
  setOrder(u,o);
  assignFormation(u,x,z,o.form);
}
function assignFormation(u,x,z,form){
  if(!form) return;
  const sel=G.sel.filter(s=>s.team===TEAM.PLAYER);
  const idx=sel.indexOf(u); if(idx<0) return;
  const n=sel.length, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols);
  const sp=2.2;
  const cx=Math.floor(idx/rows), cy=idx%rows;
  const ox=(cx-(cols-1)/2)*sp, oz=(cy-(rows-1)/2)*sp;
  const ang=u.order&&u.order.ang!==undefined?u.order.ang:0;
  u.order.x=x+ox*Math.cos(ang); u.order.z=z+ox*Math.sin(ang);
  u.order.offz=oz;
}
function orderGather(u,node){
  setOrder(u,{type:'gather',node});
  u.node=node; u.state='toNode'; u.cargo=0; u.cargoType=null; u.timer=0;
}
function orderAttack(u,t){
  setOrder(u,{type:'attack',target:t});
  u.target=t;
}
function orderBuild(u,site){ setOrder(u,{type:'build',site}); u.site=site; }
function orderStop(u){ setOrder(u,{type:'stop'}); u.target=null; u.node=null; u.site=null; }
function orderHold(u){ setOrder(u,{type:'hold'}); }

function selectUnit(u,add){

}

/* =====================================================================
   construction
   ===================================================================== */
function placeBuilding(key,x,z){
  const def=BLD_DEF[key];
  if(!canAfford(def.cost)) { toast('Not enough resources','warn'); return false; }
  if(!validPlacement(key,x,z)) { toast('Cannot build there','warn'); return false; }
  pay(def.cost);
  const b={id:BID++, key, def, team:TEAM.PLAYER, x, z, y:terrainHeight(x,z), hp:def.hp, maxhp:def.hp,
    tier:1, prog:0, build:def.time*(1-0.4*techVal('build')), queue:[], rally:null, dead:false,
    cd:0, angle:0, isSite:true, site:true, sitePos:{x,z}, siteH:terrainHeight(x,z)};
  G.sites.push(b);
  G.stats.built++;
  // pull idle workers onto the site so it never stalls
  let helpers=0;
  for(const u of G.units){
    if(u.team!==TEAM.PLAYER||u.dead||u.def.role!=='worker') continue;
    if(u.order&&u.order.type!=='idle'&&u.order.type!=='stop') continue;
    if(helpers>=3) break;
    orderBuild(u,b); helpers++;
  }
  if(helpers===0) toast('No idle workers — right-click the site to build it');
  return true;
}
function validPlacement(key,x,z){
  const def=BLD_DEF[key];
  if(Math.abs(x)>CFG.map/2-6||Math.abs(z)>CFG.map/2-6) return false;
  const h=terrainHeight(x,z);
  if(h<1.0) return false;
  if(World.slopeAt(x,z)>0.62) return false;
  for(const b of G.buildings){ if(b.team===TEAM.PLAYER&&Math.abs(b.x-x)<def.size*0.55+1&&Math.abs(b.z-z)<def.size*0.55+1) return false; }
  for(const s of G.sites){ if(Math.abs(s.x-x)<def.size*0.55+1&&Math.abs(s.z-z)<def.size*0.55+1) return false; }
  for(const u of G.units){ if(u.team===TEAM.PLAYER&&dist(u.x,u.z,x,z)<1.3) return false; }
  return true;
}
function buildSiteVisual(s){
  const def=s.def;
  const g=new T.Group();
  const posts=[];
  for(let i=0;i<4;i++){
    const a=i/4*TAU+0.4, r=def.size*0.42;
    const p=new T.Mesh(cyl(0.07,0.09,1.1,5),new T.MeshStandardMaterial({color:0x6d4b30,roughness:1,flatShading:true}));
    p.position.set(Math.cos(a)*r,0.55,Math.sin(a)*r); p.castShadow=true; g.add(p);
  }
  const boxm=new T.Mesh(box(def.size*0.8,0.12,def.size*0.8),new T.MeshStandardMaterial({color:0x8a6a3a,roughness:1,flatShading:true}));
  boxm.position.y=0.5; g.add(boxm);
  applyFog(g.children[0].material); applyFog(g.children[1].material);
  g.position.set(s.x,s.siteH,s.z);
  World.group.add(g);
  s.visual=g;
  s.plane=new T.Mesh(new T.PlaneGeometry(def.size*1.1,def.size*1.1),
    new T.MeshBasicMaterial({color:0xe8a33c,transparent:true,opacity:0.22,side:T.DoubleSide,depthWrite:false}));
  s.plane.rotation.x=-Math.PI/2; s.plane.position.set(s.x,s.siteH+0.12,s.z);
  World.group.add(s.plane);
}
function siteProgress(s,pts){
  s.prog+=pts;
  if(s.prog>=s.build){
    const b=spawnBuilding(s.key,s.x,s.z,TEAM.PLAYER,true);
    b.y=s.siteH; b.mesh.position.y=s.siteH;
    if(s.visual){ World.group.remove(s.visual); s.visual=null; }
    if(s.plane){ World.group.remove(s.plane); s.plane=null; }
    const i=G.sites.indexOf(s); if(i>=0) G.sites.splice(i,1);
    Audio.done();
    return true;
  }
  return false;
}

   production queue
   ===================================================================== */
function enqueue(b,key){
  const def=BLD_DEF[b.key];
  let ud=null;
  if(key==='woodcutter') ud=Object.assign({},UNIT_DEF.villager,{name:'Woodcutter'});
  else if(key==='goldminer') ud=Object.assign({},UNIT_DEF.villager,{name:'Gold Miner'});
  else if(key==='stonecutter') ud=Object.assign({},UNIT_DEF.villager,{name:'Stone Cutter'});
  else ud=UNIT_DEF[key];
  if(!ud) return;
  if(b.queue.length>=5) return;
  if(!canAfford(ud.cost)) { toast('Not enough resources','warn'); return; }
  pay(ud.cost);
  b.queue.push({key, ud, t:0});
}
function buildUnitLabel(key){
  return {woodcutter:'Woodcutter',goldminer:'Gold Miner',stonecutter:'Stone Cutter'}[key] || UNIT_DEF[key].name;
}

const Grid={cell:5,buckets:new Map()};
function cellKey(x,z){return ((x/CFG.map+0.5)*64|0)+'_'+((z/CFG.map+0.5)*64|0);}
function rebuildGrid(){
  Grid.buckets.clear();
  for(const u of G.units){
    if(u.dead) continue;
    const k=cellKey(u.x,u.z);
    let b=Grid.buckets.get(k); if(!b){b=[];Grid.buckets.set(k,b);}
    b.push(u);
  }
}
function nearbyUnits(x,z,r,team){
  const out=[]; const c=Grid.cell, span=Math.ceil(r/c);
  const gx=(x/CFG.map+0.5)*64|0, gz=(z/CFG.map+0.5)*64|0;
  for(let j=-span;j<=span;j++)for(let i=-span;i<=span;i++){
    const b=Grid.buckets.get((gx+i)+'_'+(gz+j));
    if(!b) continue;
    for(const u of b){ if(u.team===team&&dist2(u.x,u.z,x,z)<r*r) out.push(u); }
  }
  return out;
}

/* ---------- stats helpers ---------- */
function roleMul(u,kind){
  let m=1;
  if(u.def.role==='worker'){ if(kind==='gather') m+=techVal('gather'); if(kind==='carry') m+=techVal('carry'); if(kind==='yield') m+=techVal('yield'); }
  else { if(kind==='armor') m+=techVal('armor'); if(kind==='speed') m+=techVal('speed'); if(kind==='rate') m+=techVal('rate'); }
  if(u.def.role==='ranged'){ if(kind==='archDmg') m+=techVal('archDmg'); if(kind==='archRange') m+=techVal('archRange'); }
  return m;
}
function unitSpeed(u){ let s=u.def.speed; if(u.def.role!=='worker') s*=roleMul(u,'speed'); return s; }
function unitDamage(u){ let d=u.def.dmg; if(u.def.role==='ranged') d*=roleMul(u,'archDmg'); return d; }
function unitRange(u){ let r=u.def.range; if(u.def.role==='ranged') r*=roleMul(u,'archRange'); return r; }
function carryCap(u){ return 10*(1+techVal('carry')); }

/* ---------- movement ---------- */
function moveTowards(u,tx,tz,dt,speed){
  const dx=tx-u.x, dz=tz-u.z, d=Math.hypot(dx,dz);
  if(d<0.1){ u.moveAmt=0; return true; }
  const st=Math.min(speed*dt,d);
  u.x+=dx/d*st; u.z+=dz/d*st;
  u.y=terrainHeight(u.x,u.z);
  u.dir=Math.atan2(dx,dz);
  u.moveAmt=Math.min(1,u.moveAmt+dt*6);
  u.phase+=st*2.6;
  return false;
}
function faceTowards(u,tx,tz){ u.dir=Math.atan2(tx-u.x,tz-u.z); }

/* ---------- particles ---------- */
const Fx={
  max:1400, n:0,
  init(){
    this.pos=new Float32Array(this.max*3); this.col=new Float32Array(this.max*3);
    this.siz=new Float32Array(this.max); this.alp=new Float32Array(this.max);
    this.vel=new Float32Array(this.max*3); this.life=new Float32Array(this.max);
    this.maxl=new Float32Array(this.max); this.grav=new Float32Array(this.max);
    const mk=(blend)=>{
      const g=new T.BufferGeometry();
      g.setAttribute('position',new T.BufferAttribute(this.pos,3));
      g.setAttribute('aColor',new T.BufferAttribute(this.col,3));
      g.setAttribute('aSize',new T.BufferAttribute(this.siz,1));
      g.setAttribute('aAlpha',new T.BufferAttribute(this.alp,1));
      const m=new T.ShaderMaterial({
        uniforms:{},
        transparent:true, depthWrite:false, blending:blend,
        vertexShader:`
          attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
          varying vec3 vC; varying float vA;
          void main(){ vC=aColor; vA=aAlpha;
            vec4 mv=modelViewMatrix*vec4(position,1.0);
            gl_PointSize=clamp(aSize*(34.0/max(1.0,-mv.z)),1.0,64.0);
            gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`
          precision mediump float; varying vec3 vC; varying float vA;
          void main(){ vec2 c=gl_PointCoord-0.5; float d=dot(c,c);
            if(d>0.25) discard; float a=smoothstep(0.25,0.0,d);
            gl_FragColor=vec4(vC,a*vA); }`
      });
      const p=new T.Points(g,m); p.frustumCulled=false; return p;
    };
    this.addPts=mk(T.AdditiveBlending); this.normPts=mk(T.NormalBlending);
    World.group.add(this.addPts); World.group.add(this.normPts);
  },
  spawn(x,y,z,vx,vy,vz,r,g,b,size,life,grav,add){
    const i=this.n%this.max; this.n++;
    const add2=add?1:0;
    const idx=(add2?i:(i+this.max/2))%this.max;
    this.pos[idx*3]=x; this.pos[idx*3+1]=y; this.pos[idx*3+2]=z;
    this.vel[idx*3]=vx; this.vel[idx*3+1]=vy; this.vel[idx*3+2]=vz;
    this.col[idx*3]=r; this.col[idx*3+1]=g; this.col[idx*3+2]=b;
    this.siz[idx]=size; this.life[idx]=life; this.maxl[idx]=life; this.alp[idx]=1; this.grav[idx]=grav||0;
    this._dirty=true;
  },
  update(dt){
    const addHalf=this.max/2;
    for(let i=0;i<this.max;i++){
      if(this.life[i]<=0){ this.alp[i]=0; continue; }
      this.life[i]-=dt;
      if(this.life[i]<=0){ this.alp[i]=0; continue; }
      this.vel[i*3+1]-=this.grav[i]*dt;
      this.pos[i*3]+=this.vel[i*3]*dt;
      this.pos[i*3+1]+=this.vel[i*3+1]*dt;
      this.pos[i*3+2]+=this.vel[i*3+2]*dt;
      this.alp[i]=Math.min(1,this.life[i]/this.maxl[i]);
    }
    this.addPts.geometry.attributes.position.needsUpdate=true;
    this.addPts.geometry.attributes.aColor.needsUpdate=true;
    this.addPts.geometry.attributes.aSize.needsUpdate=true;
    this.addPts.geometry.attributes.aAlpha.needsUpdate=true;
    this.normPts.geometry.attributes.position.needsUpdate=true;
    this.normPts.geometry.attributes.aColor.needsUpdate=true;
    this.normPts.geometry.attributes.aSize.needsUpdate=true;
    this.normPts.geometry.attributes.aAlpha.needsUpdate=true;
  }
};
function burst(x,y,z,color,n,spd,size,life,grav,add){
  const c=new T.Color(color);
  for(let i=0;i<n;i++){
    const a=RNG()*TAU, e=(RNG()-0.2)*1.6, s=spd*(0.4+RNG()*0.9);
    Fx.spawn(x,y,z, Math.cos(a)*s, e*s*0.7, Math.sin(a)*s, c.r,c.g,c.b, size*(0.6+RNG()*0.8), life*(0.6+RNG()*0.8), grav===undefined?6:grav, add);
  }
}
function dustPuff(x,y,z,n,col){
  const c=new T.Color(col||0xd8cbb0);
  for(let i=0;i<n;i++){
    const a=RNG()*TAU,s=0.6+RNG()*1.4;
    Fx.spawn(x,y+0.2,z, Math.cos(a)*s, 0.5+RNG()*0.8, Math.sin(a)*s, c.r,c.g,c.b, 5+RNG()*6, 0.7+RNG()*0.6, 0.6, false);

/* ---------- projectiles ---------- */
const ArrowSys={mesh:null,max:160,items:[]};
function initArrows(){
  const P=[];
  P.push(part(cyl(0.028,0.028,0.9,5),0x6d4b30,[0,0,0],[Math.PI/2,0,0]));
  P.push(part(cone(0.06,0.2,5),0xd8d2c0,[0,0,0.52],[Math.PI/2,0,0]));
  P.push(part(box(0.02,0.14,0.2),0xd8cfae,[0,0,-0.4],[Math.PI/2,0,0]));
  const geo=mergeParts(P);
  const mat=new T.MeshStandardMaterial({vertexColors:true,roughness:0.8,flatShading:true});
  applyFog(mat);
  const m=new T.InstancedMesh(geo,mat,ArrowSys.max);
  m.frustumCulled=false; m.castShadow=false;
  m.instanceMatrix.setUsage(T.DynamicDrawUsage);
  World.group.add(m);
  ArrowSys.mesh=m;
}
function spawnArrow(from,to,dmg,team,speed,kind){
  if(ArrowSys.items.length>=ArrowSys.max) return;
  ArrowSys.items.push({x:from.x, y:from.y+(from.def.hero?2.4:1.3), z:from.z,
    tx:to.x, ty:to.y+0.9, tz:to.z, dmg, team, speed:speed||30, life:0, kind:kind||'arrow', target:to});
  if(from.team===TEAM.PLAYER) Audio.arrow();
}
function updateArrows(dt){
  const items=ArrowSys.items;
  for(let i=items.length-1;i>=0;i--){
    const a=items[i];
    a.life+=dt;
    const dx=a.tx-a.x, dy=a.ty-a.y, dz=a.tz-a.z, d=Math.hypot(dx,dy,dz);
    const st=a.speed*dt;
    if(d<=st||a.life>4){
      // hit
      const tgt=a.target;
      if(tgt&&!tgt.dead) damageUnit(tgt,a.dmg,a.team);
      const c=a.kind==='glob'?0x9b7ad0:0xc9a06a;
      burst(a.tx,a.ty,a.tz,c,a.kind==='glob'?10:6,a.kind==='glob'?3:2,4,0.35,4,true);
      items.splice(i,1);
      continue;
    }
    a.x+=dx/d*st; a.y+=dy/d*st; a.z+=dz/d*st;
    a.dx=dx; a.dy=dy; a.dz=dz;
  }
  // write instances
  const m=ArrowSys.mesh, mat=new T.Matrix4(), q=new T.Quaternion(), sc=new T.Vector3(1,1,1);
  let n=0;
  for(const a of items){
    if(n>=ArrowSys.max) break;
    const yaw=Math.atan2(a.dx,a.dz);
    const pitch=Math.atan2(a.dy,Math.hypot(a.dx,a.dz));
    q.setFromEuler(new T.Euler(-pitch,yaw,0,'YXZ'));
    mat.compose(new T.Vector3(a.x,a.y,a.z),q,sc);
    m.setMatrixAt(n,mat);
    if(a.kind==='glob') m.setColorAt(n,new T.Color(0x9b7ad0)); else m.setColorAt(n,new T.Color(0xffffff));
    n++;
  }
  m.count=n; m.instanceMatrix.needsUpdate=true;
  if(m.instanceColor) m.instanceColor.needsUpdate=true;
}

/* ---------- combat ---------- */
function acquire(u){
  if(u.order&&u.order.type==='attack'){ u.target=u.order.target; return; }
  let best=null,bd=(u.def.role==='ranged'?19:13);
  const cands=nearbyUnits(u.x,u.z,bd,1-u.team);
  for(const e of cands){
    if(e.dead) continue;
    const d=dist2(u.x,u.z,e.x,e.z);
    if(d<bd*bd){ bd=d; best=e; }
  }
  // prefer attacking buildings if adjacent
  if(!best){
    let bbest=null,bbd=bd*bd;
    for(const b of G.buildings){
      if(b.team===u.team||b.dead) continue;
      const d=dist2(u.x,u.z,b.x,b.z);
      if(d<bbd){bbd=d;bbest=b;}
    }
    if(bbest) best=bbest;
  }
  u.target=best;
}
function damageUnit(u,amt,srcTeam){
  if(u.dead) return;
  if(u.def&&u.def.size){ damageBuilding(u,amt,srcTeam); return; }
  let armor=(u.def.armor||0);
  if(u.team===TEAM.PLAYER) armor+=techVal('armor');
  amt*= (1-clamp(armor,0,0.85));
  u.hp-=amt; u.flash=1;
  if(u.hp<=0) killUnit(u,srcTeam);
}
function damageBuilding(b,amt,srcTeam){
  if(b.dead) return;
  b.hp-=amt; b.flash=1;
  if(b.hp<=0) killBuilding(b,srcTeam);
}
function killBuilding(b,srcTeam){
  if(b.dead) return;
  b.dead=true; b.hp=0;
  if(b.mesh){ World.group.remove(b.mesh); b.mesh=null; }
  if(b.torch){ World.group.remove(b.torch); b.torch=null; }
  burst(b.x,b.y+1.2,b.z, b.blight?0x9b7ad0:0xd8c9a8, 26, 5, 8, 1.1, 4, false);
  burst(b.x,b.y+1.2,b.z, 0xffc070, 16, 4, 6, 0.9, 1, true);
  Audio.death();
  if(b.team===TEAM.PLAYER) toast(b.def.name+' destroyed','warn');
}
function killUnit(u,srcTeam){
  if(u.dead) return;
  u.dead=true; u.deadT=0; u.target=null;
  const col = u.team===TEAM.PLAYER? 0xd0503f : 0x6f8a4a;
  burst(u.x,u.y+0.9,u.z,col, u.def.hero?22:10, 3.2, 5, 0.55, 7, false);
  if(u.def.hero) burst(u.x,u.y+1.2,u.z,0xc79bff,16,4,7,0.8,2,true);
  if(u.team===TEAM.ENEMY) G.stats.kills++; else G.stats.lost++;
  Audio.death();
}
function doAttack(u,t){
  u.atkCd=u.def.rate/(u.def.role!=='worker'?roleMul(u,'rate'):1);
  u.atk=1; u.hitT=0.24; u.atkTarget=t;
  if(u.def.role==='ranged'){
    spawnArrow(u,t,unitDamage(u),u.team,32);
  }
}
function updateCombat(u,dt){
  if(u.atkCd>0) u.atkCd-=dt;
  if(u.atk>0) u.atk=Math.max(0,u.atk-dt*4);
  if(u.hitT>0){
    u.hitT-=dt;
    if(u.hitT<=0){
      const t=u.atkTarget;
      if(t&&!t.dead&&dist(u.x,u.z,t.x,t.z)<u.def.range+0.9){
        let dmg=unitDamage(u);
        if(u.def.vsCav&&t.type==='sunmare') dmg*=u.def.vsCav;
        damageUnit(t,dmg,u.team);
        burst((u.x+t.x)/2,(u.y+t.y)/2+0.8,(u.z+t.z)/2,0xffe0a0,4,2,3,0.2,3,true);
        Audio.hit();
      }
    }
  }
  if(u.def.role==='worker') return;
  u.retarget-=dt;
  if(u.retarget<=0){ u.retarget=0.22+RNG()*0.22; acquire(u); }
  const t=u.target;
  if(!t||t.dead){ if(u.order&&u.order.type!=='attack'){u.target=null;} return; }
  if(t.def&&t.def.size){ // buildings are besieged separately
    const d=dist(u.x,u.z,t.x,t.z);
    if(d>2.0) moveTowards(u,t.x,t.z,dt,unitSpeed(u));
    else { faceTowards(u,t.x,t.z); }
    return;
  }
  if(u.order&&u.order.type==='hold'){ faceTowards(u,t.x,t.z); return; }
  const d=dist(u.x,u.z,t.x,t.z);
  const rng=unitRange(u);
  if(d>rng-0.15){
    if(u.order&&u.order.type==='move') return;   // moving order wins
    moveTowards(u,t.x,t.z,dt,unitSpeed(u));
  } else {
    faceTowards(u,t.x,t.z);
    if(u.atkCd<=0) doAttack(u,t);
  }
}

/* ---------- worker logic ---------- */
function updateWorker(u,dt){
  // panic: a badly hurt worker runs for the nearest drop-off building
  if(u.hp<u.maxhp*0.45&&u.def.role==='worker'){
    let safe=null,sd=1e9;
    for(const b of G.buildings){ if(b.team!==TEAM.PLAYER||b.dead) continue;
      const d=dist2(u.x,u.z,b.x,b.z); if(d<sd){sd=d;safe=b;} }
    if(safe){
      moveTowards(u,safe.x,safe.z,dt,unitSpeed(u)*1.15);
      u.fleeT=(u.fleeT||0)+dt;
      if(u.fleeT>3.5){ u.fleeT=0; u.hp=Math.min(u.maxhp,u.hp+u.maxhp*0.5); }
      return;
    }
  }
  const o=u.order;
  if(!o||o.type==='stop'){
    u.moveAmt=Math.max(0,u.moveAmt-dt*4);
    // auto-help construction
    if(G.sites.length){
      let best=null,bd=1e9;
      for(const s of G.sites){ const d=dist2(u.x,u.z,s.x,s.z); if(d<bd){bd=d;best=s;} }
      if(best&&bd<45*45){ orderBuild(u,best); }
    }
    return;
  }
  if(o.type==='move'){
    const ox=o.offz||0;
    const tx=o.x+(o.form?0:0), tz=o.z;
    const done=moveTowards(u,tx,tz,dt,unitSpeed(u));
    if(done){ u.moveAmt=Math.max(0,u.moveAmt-dt*4); u.order=null; }
    return;
  }
  if(o.type==='gather'){
    const n=o.node;
    if(!n||n.amount<=0){
      const nn=findNodeNear(u.x,u.z,n?n.type:'wood');
      if(nn){ o.node=nn; u.node=nn; u.state='toNode'; }
      else { u.order=null; return; }
    }
    if(u.state!=='working'&&u.state!=='toDrop') u.state='toNode';
    if(u.state==='toNode'){
      if(moveTowards(u,n.x,n.z,dt,unitSpeed(u))){
        u.state='working'; u.timer=0;
      }
    } else if(u.state==='working'){
      u.timer+=dt;
      if(u.timer>CFG.workTime){
        const cap=carryCap(u);
        const take=Math.min(cap*roleMul(u,'yield'),n.amount);
        n.amount-=take; u.cargo=take; u.cargoType=n.type;
        const drop=nearestDrop(n.type,u.x,u.z);
        if(drop){ u.state='toDrop'; u.drop=drop; }
        else { u.cargo=0; u.state='toNode'; }
        u.timer=0;
      }
    } else if(u.state==='toDrop'){
      const dp=u.drop;
      if(!dp||dp.dead){ const d2=nearestDrop(n.type,u.x,u.z); if(d2){u.drop=d2;} else {u.cargo=0;u.state='toNode';} }
      else if(moveTowards(u,dp.x,dp.z,dt,unitSpeed(u))){
        G[u.cargoType]+=u.cargo; G.stats.collected+=u.cargo;
        UI.flashRes(u.cargoType);
        u.cargo=0; u.state='toNode';
      }
    }
    return;
  }
  if(o.type==='build'){
    const s=o.site;
    if(!s||G.sites.indexOf(s)<0){ u.order=null; return; }
    if(u.state!=='helping'){
      if(moveTowards(u,s.x,s.z,dt,unitSpeed(u))){ u.state='helping'; }
    } else {
      const rate=(1+techVal('build'))*1.0;
      if(siteProgress(s,rate*dt)) { u.order=null; u.state='idle'; }
      if(RNG()<dt*6) dustPuff(s.x+(RNG()-0.5)*2, s.siteH, s.z+(RNG()-0.5)*2, 1);
    }
    return;
  }
  if(o.type==='attack'){
    const t=o.target;
    if(!t||t.dead){ u.order=null; return; }
    if(dist(u.x,u.z,t.x,t.z)>u.def.range-0.2) moveTowards(u,t.x,t.z,dt,unitSpeed(u));
    else faceTowards(u,t.x,t.z);
  }
}
function findNodeNear(x,z,type){
  let best=null,bd=1e9;
  for(const n of World.nodes){
    if(n.type!==type||n.amount<=0) continue;
    const d=dist2(x,z,n.x,n.z);
    if(d<bd){bd=d;best=n;}
  }
  return best;
}

/* ---------- unit update ---------- */
function updateUnits(dt){
  rebuildGrid();
  for(const u of G.units){
    if(u.dead){ u.deadT+=dt; if(u.deadT>0.9) removeUnit(u); continue; }
    u.flash=Math.max(0,u.flash-dt*4);
    u.spawnT+=dt;
    if(u.def.role==='worker') updateWorker(u,dt);
    else updateCombat(u,dt);
    if(u.def.role!=='worker'&&u.def.hero) applyAura(u);
  }
  // separation
  for(const u of G.units){
    if(u.dead) continue;
    const near=nearbyUnits(u.x,u.z,1.5,u.team);
    for(const o of near){
      if(o===u) continue;
      const dx=u.x-o.x, dz=u.z-o.z, d2=dx*dx+dz*dz;
      if(d2>0.0001&&d2<1.05){
        const d=Math.sqrt(d2), push=(1.05-d)*0.5;
        u.x+=dx/d*push; u.z+=dz/d*push;
      }
    }
  }
}
function applyAura(hero){
  const near=nearbyUnits(hero.x,hero.z,8,hero.team);
  for(const o of near){
    if(o===hero||o.def.role==='worker') continue;
    o.auraBonus=hero.def.aura;
  }
}

/* ---------- building update ---------- */
function updateBuildings(dt){
  for(const b of G.buildings){
    if(b.dead) continue;
    if(b.def.produces){
      b.prodAcc=(b.prodAcc||0)+b.def.produces.food*dt;
      if(b.prodAcc>=1){ const add=Math.floor(b.prodAcc); b.prodAcc-=add; G.food+=add; }
    }
    if(b.def.attack){
      b.cd-=dt;
      if(b.cd<=0){
        let best=null,bd=b.def.attack.range;
        for(const e of nearbyUnits(b.x,b.z,bd,b.team===TEAM.PLAYER?1:0)){
          const d=dist(b.x,b.z,e.x,e.z); if(d<bd){bd=d;best=e;}
        }
        if(best){
          b.cd=b.def.attack.rate;
          b.angle=Math.atan2(best.x-b.x,best.z-b.z);
          spawnArrow({x:b.x,y:b.y+3.0,z:b.z,def:{hero:false},team:b.team},best,b.def.attack.dmg,b.team,34,'arrow');
        }
      }
    }
  }
}

/* =====================================================================
   AUDIO (procedural, no assets)
   ===================================================================== */
const Audio={
  ctx:null, on:true, master:null, noise:null,
  init(){
    if(this.ctx) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=0.22; this.master.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*0.4, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      this.noise=buf;
    }catch(e){ this.ctx=null; }
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,dur,type,vol,slide){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  burst(dur,vol,filt,slide){
    if(!this.on||!this.ctx||!this.noise) return;
    const t=this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noise;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(filt||1200,t);
    if(slide) f.frequency.exponentialRampToValueAtTime(Math.max(80,slide),t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.02);
  },
  hit(){ this.burst(0.12,0.18,1800,400); },
  arrow(){ this.burst(0.07,0.07,3600,1600); },
  death(){ this.burst(0.22,0.16,900,180); this.tone(190,0.18,'triangle',0.1,80); },
  done(){ this.tone(660,0.13,'triangle',0.16,990); setTimeout(()=>this.tone(880,0.16,'triangle',0.13,1180),80); },
  build(){ this.burst(0.16,0.1,700,220); },
  wave(){ this.tone(110,1.1,'sawtooth',0.11,72); setTimeout(()=>this.tone(165,1.0,'sawtooth',0.09,110),130); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.5,'triangle',0.16),i*150)); },
  lose(){ [330,262,196,147].forEach((f,i)=>setTimeout(()=>this.tone(f,0.7,'sine',0.16),i*210)); },
};

/* =====================================================================
   60-ai : the Blightkin — waves, aggression, difficulty scaling
   ===================================================================== */
const AI={
  diff:1,                 // 0 squire / 1 warlord / 2 tyrant
  wave:0, waveTimer:CFG.startWaveIn, warn:false, marching:[],
  core:null, spires:[], nextSpire:0, aggroTimer:0, raids:0,
};
const DIFF=[
  {name:'Squire',    size:0.72, dmg:0.85, gap:1.22, armor:0, income:0.9},
  {name:'Warlord',  size:1.00, dmg:1.00, gap:1.00, armor:0, income:1.0},
  {name:'Tyrant',   size:1.32, dmg:1.20, gap:0.80, armor:0, income:1.15},
];

function initAI(){
  AI.core=spawnBuilding('townhall',World.enemyBase.x,World.enemyBase.z,TEAM.ENEMY,true);
  AI.core.key='blightcore'; AI.core.blight=true;
  AI.core.mesh.scale.setScalar(1.7);
  AI.core.maxhp=AI.core.hp=5200;
  AI.core.def=Object.assign({},BLD_DEF.townhall,{hp:5200,sight:26});
  // two spawned spires
  for(let i=0;i<2;i++){
    const a=i*2.2+0.8, r=7+i*2.5;
    const b=spawnBuilding('townhall',World.enemyBase.x+Math.cos(a)*r,World.enemyBase.z+Math.sin(a)*r,TEAM.ENEMY,true);
    b.key='spire'; b.blight=true;
    World.group.remove(b.mesh);
    const m=new T.Mesh(geoSpire(),new T.MeshStandardMaterial({vertexColors:true,roughness:0.9,flatShading:true}));
    applyFog(m.material);
    m.castShadow=true; m.position.set(b.x,terrainHeight(b.x,b.z),b.z); m.rotation.y=RNG()*TAU;
    World.group.add(m);
    b.mesh=m; b.maxhp=b.hp=520;
    AI.spires.push(b);
  }
}
function geoSpire(){
  const P=[];
  P.push(part(cyl(1.3,1.6,0.5,8),0x2f2a30,[0,0.25,0]));
  P.push(part(cyl(0.6,1.0,2.6,7),0x3a3340,[0,1.6,0]));
  P.push(part(cyl(0.4,0.6,1.2,7),0x453b4e,[0,3.4,0]));
  P.push(part(ico(0.32,0),0x9b7ad0,[0,4.1,0]));
  for(let i=0;i<3;i++){
    const a=i/3*TAU;
    P.push(part(box(0.16,1.2,0.16),0x2a2430,[Math.cos(a)*0.9,0.9,Math.sin(a)*0.9],[0.12*Math.sin(a),0,0.12*Math.cos(a)]));
  }
  return mergeParts(P);
}

function waveComposition(n){
  const d=DIFF[AI.diff];
  const g=Math.max(1,Math.round((1+n*0.6)*d.size));
  const b=n>=2?Math.round((n-1)*0.45*d.size):0;
  const s=n>=3?Math.round((n-2)*0.4*d.size):0;
  const t=(n>=5&&(n%3===2||n===8||n===13))?1:0;
  return {grunt:g, brute:b, spitter:s, tyrant:t};
}
function updateAI(dt){
  if(G.gameOver) return;
  const d=DIFF[AI.diff];
  AI.waveTimer-=dt;
  // advance the blight base
  AI.nextSpire-=dt;
  if(AI.nextSpire<=0&&AI.spires.length<6){
    AI.nextSpire=48;
    const a=RNG()*TAU,r=6+RNG()*7;
    const b=spawnBuilding('townhall',World.enemyBase.x+Math.cos(a)*r,World.enemyBase.z+Math.sin(a)*r,TEAM.ENEMY,true);
    b.key='spire'; b.blight=true;
    World.group.remove(b.mesh);
    const m=new T.Mesh(geoSpire(),new T.MeshStandardMaterial({vertexColors:true,roughness:0.9,flatShading:true}));
    applyFog(m.material); m.castShadow=true;
    m.position.set(b.x,terrainHeight(b.x,b.z),b.z); m.rotation.y=RNG()*TAU;
    World.group.add(m); b.mesh=m; b.maxhp=b.hp=520;
    AI.spires.push(b);
    toast('The blight spreads','warn');
  }
  // continuous trickle
  AI.aggroTimer-=dt;
  if(AI.aggroTimer<=0){
    AI.aggroTimer=17*d.gap;
    const spawn=spawnEnemyUnit(RNG()<0.62?'grunt':'spitter');
    if(spawn) spawn.order={type:'defend',x:AI.core.x,z:AI.core.z};
  }
  // wave trigger
  if(AI.waveTimer<=0&&!AI.warn){
    AI.warn=true; AI.waveTimer=6;
    banner('RAID INCOMING','the blightkin gather');
    Audio.wave(); Audio.resume();
    showAlert('Raid incoming — gather your warriors!');
  }
  if(AI.warn&&AI.waveTimer<=0){
    AI.warn=false;
    launchWave();
    let gap=clamp(CFG.waveGapMin*d.gap+RNG()*16, 34, 110);
    if(World.night) gap*=0.78;   // the dark brings raiders
    AI.waveTimer=gap;
  }
}
function spawnEnemyUnit(type, atx, atz){
  const cap=190;
  if(G.units.filter(u=>u.team===TEAM.ENEMY).length>=cap) return null;
  const base=AI.core||{x:World.enemyBase.x,z:World.enemyBase.z};
  const a=RNG()*TAU, r=9+RNG()*8;
  const x=atx!==undefined?atx:base.x+Math.cos(a)*r;
  const z=atz!==undefined?atz:base.z+Math.sin(a)*r;
  const u=spawnUnit(type,x,z,TEAM.ENEMY);
  u.y=terrainHeight(x,z);
  u.order={type:'defend',x:base.x,z:base.z};
  return u;
}
function launchWave(){
  AI.wave++; G.stats.wave=AI.wave; G.wave=AI.wave;
  const comp=waveComposition(AI.wave);
  const d=DIFF[AI.diff];
  const total=comp.grunt+comp.brute+comp.spitter+comp.tyrant;
  toast('Wave '+AI.wave+' — '+total+' blightkin approach','warn');
  let i=0;
  for(let k=0;k<comp.grunt;k++,i++) queueEnemy('grunt');
  for(let k=0;k<comp.brute;k++,i++) queueEnemy('brute');
  for(let k=0;k<comp.spitter;k++,i++) queueEnemy('spitter');
  for(let k=0;k<comp.tyrant;k++,i++) queueEnemy('tyrant');
  G.pendingWave=total;
  function queueEnemy(type){
    const u=spawnEnemyUnit(type);
    if(u) u.order={type:'attack',target:pickPlayerTarget()};
  }
  if(comp.tyrant>0) banner('A BLIGHT TYRANT RISES','elite · destroy it first');
}
function pickPlayerTarget(){
  let best=null,bs=-1;
  for(const b of G.buildings){
    if(b.team!==TEAM.PLAYER||b.dead) continue;
    const s=(b.key==='townhall'?400:80)+(b.maxhp||100)*0.1;
    if(s>bs){bs=s;best=b;}
  }
  if(!best){
    // fallback: nearest worker
    let bw=null,bwd=1e9;
    for(const u of G.units){ if(u.team!==TEAM.PLAYER||u.dead) continue; const d=dist2(u.x,u.z,World.enemyBase.x,World.enemyBase.z); if(d<bwd){bwd=d;bw=u;} }
    return bw;
  }
  return best;
}
function updateEnemyOrders(dt){
  for(const u of G.units){
    if(u.team!==TEAM.ENEMY||u.dead) continue;
    const o=u.order;
    if(!o||o.type==='defend'){
      // defend: stay near the core unless the player is close
      const px=u.x, pz=u.z;
      let threat=null,bd=1e9;
      for(const p of nearbyUnits(u.x,u.z,18,TEAM.PLAYER)){
        const d=dist2(u.x,u.z,p.x,p.z); if(d<bd){bd=d;threat=p;}
      }
      if(threat){ u.order={type:'attack',target:threat}; }
      else if(dist(u.x,u.z,AI.core.x,AI.core.z)>16){
        moveTowards(u,AI.core.x,AI.core.z,dt,u.def.speed*0.8);
      } else u.moveAmt=Math.max(0,u.moveAmt-dt*3);
    }
    if(o&&o.type==='attack'){
      const t=o.target;
      if(!t||t.dead){ u.order={type:'defend',x:AI.core.x,z:AI.core.z}; continue; }
      if(t.def&&t.def.size){
        const d=dist(u.x,u.z,t.x,t.z);
        if(d>1.8) moveTowards(u,t.x,t.z,dt,u.def.speed);
        else faceTowards(u,t.x,t.z);
      }
    }
  }
}
function enemyAttackBuildings(dt){
  for(const u of G.units){
    if(u.team!==TEAM.ENEMY||u.dead) continue;
    if(u.stateBusy) continue;
    const near=nearbyUnits(u.x,u.z,2.4,TEAM.PLAYER);
    for(const b of G.buildings){
      if(b.team!==TEAM.PLAYER||b.dead) continue;
      if(dist(u.x,u.z,b.x,b.z)<2.2){
        damageUnit(b,u.def.dmg*DIFF[AI.diff].dmg*dt*0.5,TEAM.ENEMY);
        break;
      }
    }
  }
}
