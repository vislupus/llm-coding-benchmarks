<svg width="1200" height="1800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f5fb" />
      <stop offset="100%" stop-color="#c5e3f7" />
    </linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="600" y="80" font-size="48" font-weight="bold" text-anchor="middle" fill="#333">Japan at a Glance</text>
  
  <!-- First Row: Map and Explanation -->
  <g transform="translate(50, 150)">
    <!-- Map of Japan -->
    <g>
      <rect width="500" height="400" fill="#f3f7fa" stroke="#999" />
      <!-- Simplified map shapes -->
      <path d="M150,250 L200,220 L210,260 L190,290 Z" fill="#adb7c2" />
      <path d="M320,300 L360,280 L370,340 L330,350 Z" fill="#adb7c2" />
      <!-- City Labels -->
      <text x="155" y="245" font-size="12" fill="#333">Tokyo</text>
      <text x="325" y="295" font-size="12" fill="#333">Yokohama</text>
      <text x="210" y="355" font-size="12" fill="#333">Osaka</text>
      <text x="235" y="310" font-size="12" fill="#333">Nagoya</text>
    </g>
    <!-- Explanatory Text -->
    <g transform="translate(550, 0)">
      <rect width="600" height="400" fill="#f9fcfe" stroke="#999" />
      <text x="20" y="40" font-size="16" fill="#333">
        Japan is an island country located in East Asia. Known for its rich culture and advanced technology,
        Japan offers a unique blend of tradition and modernity. It is the birthplace of sushi, sumo wrestling,
        and anime, and is renowned for its beautiful landscapes.
      </text>
    </g>
  </g>

  <!-- Full-width Paragraph -->
  <text x="600" y="600" font-size="14" text-anchor="middle" fill="#333">
    Japan has a unique culture characterized by its harmonious blend of ancient traditions and cutting-edge technology.
    This dynamic nation is home to numerous UNESCO World Heritage Sites, vibrant cities, and a culinary scene
    that is revered worldwide.
  </text>
  
  <!-- Second Row: Text and Bar Chart -->
  <g transform="translate(50, 700)">
    <!-- Text -->
    <g>
      <rect width="600" height="400" fill="#f9fcfe" stroke="#999" />
      <text x="20" y="40" font-size="16" fill="#333">
        Japan's economy is the third-largest in the world by nominal GDP. The nation is at the forefront of
        technological innovation and is a leader in the automotive and electronics industries.
      </text>
    </g>
    <!-- Bar Chart -->
    <g transform="translate(650, 0)">
      <rect width="500" height="400" fill="#f3f7fa" stroke="#999" />
      <text x="250" y="30" font-size="14" text-anchor="middle" fill="#333">Japan's Nominal GDP (US$ Trillions)</text>
      <!-- Bars -->
      <g fill="#4a90e2">
        <rect x="50" y="360" width="30" height="-88"></rect>
        <rect x="100" y="360" width="30" height="-100"></rect>
        <rect x="150" y="360" width="30" height="-98.6"></rect>
        <rect x="200" y="360" width="30" height="-101"></rect>
        <rect x="250" y="360" width="30" height="-102.4"></rect>
        <rect x="300" y="360" width="30" height="-101"></rect>
        <rect x="350" y="360" width="30" height="-101"></rect>
        <rect x="400" y="360" width="30" height="-85.2"></rect>
        <rect x="450" y="360" width="30" height="-84.2"></rect>
        <rect x="500" y="360" width="30" height="-80.6"></rect>
      </g>
      <!-- Year Labels -->
      <g font-size="12" fill="#333" text-anchor="middle">
        <text x="65" y="375">2015</text>
        <text x="115" y="375">2016</text>
        <text x="165" y="375">2017</text>
        <text x="215" y="375">2018</text>
        <text x="265" y="375">2019</text>
        <text x="315" y="375">2020</text>
        <text x="365" y="375">2021</text>
        <text x="415" y="375">2022</text>
        <text x="465" y="375">2023</text>
        <text x="515" y="375">2024</text>
      </g>
    </g>
  </g>

  <!-- Bottom Row: Pie Chart and Visit Text -->
  <g transform="translate(50, 1150)">
    <!-- Pie Chart -->
    <g>
      <circle cx="250" cy="250" r="150" fill="#f3f7fa" stroke="#999" />
      <text x="250" y="40" font-size="14" text-anchor="middle" fill="#333">Population Composition</text>
      <!-- Pie Slices -->
      <path d="M250,250 L250,100 A150,150 0 0,1 122.7,149.3 Z" fill="#ffc107" />
      <path d="M250,250 L122.7,149.3 A150,150 0 0,1 117.3,350 Z" fill="#e91e63" />
      <path d="M250,250 L117.3,350 A150,150 0 0,1 300,400 Z" fill="#8bc34a" />
      <path d="M250,250 L300,400 A150,150 0 0,1 250,100 Z" fill="#00bcd4" />
      <!-- Pie Labels -->
      <text x="190" y="150" font-size="12" fill="#333">Japanese 97.5%</text>
      <text x="90" y="150" font-size="12" fill="#333">Chinese 0.6%</text>
      <text x="90" y="350" font-size="12" fill="#333">Vietnamese 0.4%</text>
      <text x="225" y="400" font-size="12" fill="#333">South Korean 0.3%</text>
      <text x="320" y="270" font-size="12" fill="#333">Other 1.2%</text>
    </g>
    <!-- Visit Text -->
    <g transform="translate(650, 0)">
      <rect width="500" height="400" fill="#f9fcfe" stroke="#999" />
      <text x="250" y="40" font-size="14" text-anchor="middle" fill="#333">What to Visit in Japan</text>
      <text x="20" y="70" font-size="16" fill="#333">
        Explore the bustling metropolis of Tokyo, admire the historical temples of Kyoto, and experience the vibrant city life of Osaka. Don't miss the poignant history in Hiroshima/Miyajima and the scenic beauty of Mount Fuji/Hakone. Discover Hokkaido's natural landscapes.
      </text>
    </g>
  </g>

  <!-- Source Note -->
  <text x="600" y="1780" font-size="12" text-anchor="middle" fill="#666">Source: World Bank, National Statistics Institute</text>
</svg>
