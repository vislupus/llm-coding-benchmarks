<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="0.55" stop-color="#eef4f9"/>
      <stop offset="1" stop-color="#e7eef6"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5cbe4"/>
      <stop offset="1" stop-color="#5b93bd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fae"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="barPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5b6b"/>
      <stop offset="1" stop-color="#c1273a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#e63946" opacity="0.07"/>
  <circle cx="1080" cy="90" r="95" fill="#e63946" opacity="0.08"/>
  <path d="M0 1690 C 200 1650, 400 1730, 600 1690 C 800 1650, 1000 1730, 1200 1690 L1200 1800 L0 1800 Z" fill="#cfe0ef" opacity="0.55"/>
  <path d="M0 1725 C 220 1690, 420 1765, 640 1725 C 860 1688, 1020 1762, 1200 1725 L1200 1800 L0 1800 Z" fill="#b8d2e8" opacity="0.5"/>
  <path d="M0 1760 C 240 1730, 460 1795, 700 1760 C 940 1728, 1060 1792, 1200 1760 L1200 1800 L0 1800 Z" fill="#9fc0dd" opacity="0.45"/>
  <path d="M-20 150 C 300 120, 600 185, 900 150 C 1050 133, 1150 150, 1220 140" fill="none" stroke="#cfe0ef" stroke-width="3" opacity="0.6"/>

  <!-- ============ HEADER ============ -->
  <circle cx="86" cy="82" r="16" fill="#e63946"/>
  <text x="118" y="96" font-size="44" font-weight="700" fill="#14263c" letter-spacing="0.5">Japan at a glance</text>
  <text x="120" y="128" font-size="16" fill="#5a7188">An editorial snapshot of the Land of the Rising Sun — geography, economy, people, and places to visit</text>
  <line x1="60" y1="152" x2="1140" y2="152" stroke="#c9d8e6" stroke-width="1.5"/>

  <!-- ============ ROW 1 : MAP CARD ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="540" height="470" rx="18" fill="#ffffff"/>
  </g>
  <text x="90" y="212" font-size="20" font-weight="700" fill="#14263c">The Archipelago</text>
  <text x="90" y="234" font-size="12.5" fill="#5a7188">Four major cities, placed approximately</text>

  <g transform="translate(110,250)">
    <!-- Hokkaido -->
    <path d="M330 20 C 352 0, 396 4, 412 30 C 428 56, 416 84, 384 90 C 352 96, 324 80, 320 58 C 317 42, 320 30, 330 20 Z" fill="url(#land)" stroke="#3d6f96" stroke-width="1.5"/>
    <!-- Honshu -->
    <path d="M358 108 C 380 96, 404 110, 400 132 C 396 154, 372 168, 350 184 C 318 208, 288 232, 258 254 C 228 276, 198 292, 172 302 C 150 310, 128 302, 124 284 C 120 266, 136 252, 156 244 C 184 232, 210 216, 236 196 C 268 170, 300 144, 332 124 C 342 117, 350 112, 358 108 Z" fill="url(#land)" stroke="#3d6f96" stroke-width="1.5"/>
    <!-- Shikoku -->
    <path d="M142 330 C 158 318, 186 320, 196 334 C 205 348, 194 362, 172 364 C 150 366, 132 350, 142 330 Z" fill="url(#land)" stroke="#3d6f96" stroke-width="1.5"/>
    <!-- Kyushu -->
    <path d="M82 316 C 100 304, 122 312, 126 334 C 130 358, 118 386, 96 392 C 76 397, 62 382, 66 358 C 69 340, 72 326, 82 316 Z" fill="url(#land)" stroke="#3d6f96" stroke-width="1.5"/>

    <!-- City markers -->
    <circle cx="352" cy="158" r="6" fill="#ffffff" stroke="#e63946" stroke-width="3"/>
    <circle cx="342" cy="176" r="5" fill="#ffffff" stroke="#e63946" stroke-width="2.5"/>
    <circle cx="248" cy="240" r="5" fill="#ffffff" stroke="#e63946" stroke-width="2.5"/>
    <circle cx="176" cy="282" r="5" fill="#ffffff" stroke="#e63946" stroke-width="2.5"/>

    <!-- Labels with leader lines -->
    <line x1="358" y1="156" x2="404" y2="140" stroke="#8aa5bd" stroke-width="1"/>
    <text x="408" y="138" font-size="15" font-weight="700" fill="#14263c">Tokyo</text>
    <text x="408" y="154" font-size="11" fill="#5a7188">capital</text>

    <line x1="337" y1="180" x2="300" y2="205" stroke="#8aa5bd" stroke-width="1"/>
    <text x="296" y="222" font-size="14" font-weight="700" fill="#14263c" text-anchor="end">Yokohama</text>

    <line x1="253" y1="244" x2="286" y2="280" stroke="#8aa5bd" stroke-width="1"/>
    <text x="290" y="298" font-size="14" font-weight="700" fill="#14263c">Nagoya</text>

    <line x1="170" y1="286" x2="120" y2="330" stroke="#8aa5bd" stroke-width="1"/>
    <text x="116" y="348" font-size="14" font-weight="700" fill="#14263c" text-anchor="end">Osaka</text>

    <text x="352" y="112" font-size="11" fill="#7d95ab" text-anchor="middle">Hokkaido</text>
    <text x="300" y="150" font-size="11" fill="#ffffff" text-anchor="middle" transform="rotate(-38 300 150)">Honshu</text>
    <text x="168" y="352" font-size="10.5" fill="#7d95ab" text-anchor="middle">Shikoku</text>
    <text x="96" y="360" font-size="10.5" fill="#ffffff" text-anchor="middle">Kyushu</text>
  </g>

  <!-- ============ ROW 1 : ABOUT CARD ============ -->
  <g filter="url(#shadow)">
    <rect x="630" y="170" width="510" height="470" rx="18" fill="#ffffff"/>
  </g>
  <rect x="630" y="170" width="6" height="470" rx="3" fill="#e63946"/>
  <text x="668" y="216" font-size="20" font-weight="700" fill="#14263c">About Japan</text>
  <g font-size="14.5" fill="#3c5570">
    <text x="668" y="252">An archipelago of 6,852 islands in East</text>
    <text x="668" y="276">Asia, Japan sits at the edge of the Pacific.</text>
    <text x="668" y="300">Home to roughly 124 million people, it</text>
    <text x="668" y="324">blends deep tradition — tea ceremony,</text>
    <text x="668" y="348">calligraphy, seasonal festivals — with the</text>
    <text x="668" y="372">world's leading technology, design, and</text>
    <text x="668" y="396">pop culture. Japanese is the official</text>
    <text x="668" y="420">language, and the currency is the yen (¥).</text>
  </g>
  <!-- mini stats -->
  <g>
    <rect x="668" y="470" width="130" height="86" rx="12" fill="#f2f7fb"/>
    <text x="733" y="506" font-size="22" font-weight="700" fill="#1d3557" text-anchor="middle">6,852</text>
    <text x="733" y="528" font-size="11.5" fill="#5a7188" text-anchor="middle">islands</text>

    <rect x="812" y="470" width="130" height="86" rx="12" fill="#f2f7fb"/>
    <text x="877" y="506" font-size="22" font-weight="700" fill="#1d3557" text-anchor="middle">124M</text>
    <text x="877" y="528" font-size="11.5" fill="#5a7188" text-anchor="middle">residents</text>

    <rect x="956" y="470" width="130" height="86" rx="12" fill="#f2f7fb"/>
    <text x="1021" y="506" font-size="22" font-weight="700" fill="#e63946" text-anchor="middle">#3</text>
    <text x="1021" y="528" font-size="11.5" fill="#5a7188" text-anchor="middle">economy (nominal)</text>
  </g>
  <text x="668" y="600" font-size="12" font-style="italic" fill="#7d95ab">Tokyo, Yokohama, Osaka and Nagoya are the four largest cities by population.</text>

  <!-- ============ FULL-WIDTH PARAGRAPH ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="660" width="1080" height="96" rx="16" fill="#ffffff"/>
  </g>
  <g font-size="15" fill="#3c5570">
    <text x="92" y="696">From the neon canyons of Shinjuku to the quiet tea houses of Kyoto, Japan offers a rare balance: hyper-modern cities</text>
    <text x="92" y="720">minutes from ancient temples, and volcanic peaks rising over emerald coastlines. Its rail network links the</text>
    <text x="92" y="744">archipelago at 300 km/h, its cuisine is a UNESCO-recognized art form, and its four seasons shape festivals, gardens, and daily life.</text>
  </g>

  <!-- ============ ROW 2 : ECONOMY TEXT ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="780" width="520" height="380" rx="18" fill="#ffffff"/>
  </g>
  <rect x="60" y="780" width="6" height="380" rx="3" fill="#1d3557"/>
  <text x="98" y="826" font-size="20" font-weight="700" fill="#14263c">The Economy</text>
  <g font-size="14.5" fill="#3c5570">
    <text x="98" y="862">Japan's economy is the world's third</text>
    <text x="98" y="886">largest by nominal GDP.</text>
    <text x="98" y="922">After peaking above US$5 trillion in</text>
    <text x="98" y="946">2019, a strong yen in 2022–2024</text>
    <text x="98" y="970">compressed the dollar figure to just</text>
    <text x="98" y="994">over US$4 trillion, even as domestic</text>
    <text x="98" y="1018">output stayed resilient.</text>
    <text x="98" y="1054">Key pillars: automobiles, electronics,</text>
    <text x="98" y="1078">robotics, and tourism.</text>
  </g>
  <text x="98" y="1122" font-size="12" font-style="italic" fill="#7d95ab">The 2019 bar marks the decade's dollar-denominated peak.</text>

  <!-- ============ ROW 2 : BAR CHART ============ -->
  <g filter="url(#shadow)">
    <rect x="610" y="780" width="530" height="380" rx="18" fill="#ffffff"/>
  </g>
  <text x="640" y="820" font-size="17" font-weight="700" fill="#14263c">Nominal GDP, US$ trillions</text>
  <text x="640" y="840" font-size="12" fill="#5a7188">2015–2024 · current US$</text>

  <!-- gridlines -->
  <g stroke="#dde7f0" stroke-width="1">
    <line x1="655" y1="872.7" x2="1110" y2="872.7"/>
    <line x1="655" y1="918.2" x2="1110" y2="918.2"/>
    <line x1="655" y1="963.6" x2="1110" y2="963.6"/>
    <line x1="655" y1="1009.1" x2="1110" y2="1009.1"/>
    <line x1="655" y1="1054.5" x2="1110" y2="1054.5"/>
  </g>
  <line x1="655" y1="1100" x2="1110" y2="1100" stroke="#9db4c8" stroke-width="1.5"/>
  <g font-size="10.5" fill="#7d95ab" text-anchor="end">
    <text x="648" y="1104">0</text>
    <text x="648" y="1058.5">1</text>
    <text x="648" y="1013">2</text>
    <text x="648" y="967.6">3</text>
    <text x="648" y="922.2">4</text>
    <text x="648" y="876.7">5</text>
  </g>

  <!-- bars -->
  <g>
    <rect x="661"  y="898.2" width="33" height="201.8" rx="4" fill="url(#bar)"/>
    <rect x="706"  y="872.7" width="33" height="227.3" rx="4" fill="url(#bar)"/>
    <rect x="751"  y="875.9" width="33" height="224.1" rx="4" fill="url(#bar)"/>
    <rect x="796"  y="870.9" width="33" height="229.1" rx="4" fill="url(#bar)"/>
    <rect x="841"  y="867.3" width="33" height="232.7" rx="4" fill="url(#barPeak)"/>
    <rect x="886"  y="870.4" width="33" height="229.6" rx="4" fill="url(#bar)"/>
    <rect x="931"  y="870.9" width="33" height="229.1" rx="4" fill="url(#bar)"/>
    <rect x="976"  y="906.4" width="33" height="193.6" rx="4" fill="url(#bar)"/>
    <rect x="1021" y="908.6" width="33" height="191.4" rx="4" fill="url(#bar)"/>
    <rect x="1066" y="916.8" width="33" height="183.2" rx="4" fill="url(#bar)"/>
  </g>
  <!-- value labels -->
  <g font-size="11" font-weight="700" fill="#1d3557" text-anchor="middle">
    <text x="677.5" y="891">4.44</text>
    <text x="722.5" y="865.7">5.00</text>
    <text x="767.5" y="868.9">4.93</text>
    <text x="812.5" y="863.9">5.04</text>
    <text x="857.5" y="860" fill="#c1273a">5.12</text>
    <text x="902.5" y="863.4">5.05</text>
    <text x="947.5" y="863.9">5.04</text>
    <text x="992.5" y="899.4">4.26</text>
    <text x="1037.5" y="901.6">4.21</text>
    <text x="1082.5" y="909.8">4.03</text>
  </g>
  <!-- year labels -->
  <g font-size="11" fill="#5a7188" text-anchor="middle">
    <text x="677.5" y="1120">2015</text>
    <text x="722.5" y="1120">2016</text>
    <text x="767.5" y="1120">2017</text>
    <text x="812.5" y="1120">2018</text>
    <text x="857.5" y="1120" font-weight="700" fill="#c1273a">2019</text>
    <text x="902.5" y="1120">2020</text>
    <text x="947.5" y="1120">2021</text>
    <text x="992.5" y="1120">2022</text>
    <text x="1037.5" y="1120">2023</text>
    <text x="1082.5" y="1120">2024</text>
  </g>
  <text x="640" y="1146" font-size="11.5" font-style="italic" fill="#7d95ab">Red bar: 2019 peak. The 2022 drop reflects yen appreciation, not output loss.</text>

  <!-- ============ ROW 3 : DONUT CHART ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="1200" width="520" height="480" rx="18" fill="#ffffff"/>
  </g>
  <text x="90" y="1244" font-size="17" font-weight="700" fill="#14263c">Population by nationality</text>
  <text x="90" y="1264" font-size="12" fill="#5a7188">Share of residents, 2024 estimates</text>

  <g transform="translate(320,1420) rotate(-90)">
    <circle r="110" fill="none" stroke="#eef2f6" stroke-width="55"/>
    <circle r="110" fill="none" stroke="#e63946" stroke-width="55" stroke-dasharray="673.87 691.15" stroke-dashoffset="0"/>
    <circle r="110" fill="none" stroke="#1d3557" stroke-width="55" stroke-dasharray="4.15 691.15" stroke-dashoffset="-673.87"/>
    <circle r="110" fill="none" stroke="#457b9d" stroke-width="55" stroke-dasharray="2.76 691.15" stroke-dashoffset="-678.02"/>
