    <text x="118" y="1682">Other</text>
    <text x="1124" y="1682" text-anchor="end" font-weight="700">1.2%</text>
  </g>

  <!-- ============ ROW 3 : WHAT TO VISIT ============ -->
  <g filter="url(#shadow)">
    <rect x="610" y="1200" width="530" height="480" rx="18" fill="#ffffff"/>
  </g>
  <rect x="610" y="1200" width="6" height="480" rx="3" fill="#e63946"/>
  <text x="648" y="1244" font-size="20" font-weight="700" fill="#14263c">What to visit</text>

  <!-- 1 Tokyo -->
  <circle cx="672" cy="1290" r="20" fill="#fdeef0"/>
  <g stroke="#c1273a" stroke-width="3.4" stroke-linecap="round">
    <line x1="662" y1="1282" x2="682" y2="1282"/>
    <line x1="665" y1="1288" x2="679" y2="1288"/>
    <line x1="666" y1="1282" x2="666" y2="1299"/>
    <line x1="678" y1="1282" x2="678" y2="1299"/>
  </g>
  <text x="706" y="1286" font-size="15" font-weight="700" fill="#14263c">Tokyo</text>
  <text x="706" y="1304" font-size="12.5" fill="#5a7188">Shibuya crossings, Meiji Shrine, teamLab, sushi at Tsukiji</text>

  <!-- 2 Kyoto -->
  <circle cx="672" cy="1352" r="20" fill="#eef4fa"/>
  <path d="M660 1348 L672 1338 L684 1348 Z" fill="#1d3557"/>
  <rect x="663" y="1348" width="18" height="8" fill="#457b9d"/>
  <rect x="669" y="1350" width="6" height="6" fill="#f6f9fc"/>
  <text x="706" y="1348" font-size="15" font-weight="700" fill="#14263c">Kyoto</text>
  <text x="706" y="1366" font-size="12.5" fill="#5a7188">Fushimi Inari gates, Arashiyama bamboo, golden temples</text>

  <!-- 3 Osaka -->
  <circle cx="672" cy="1414" r="20" fill="#eef4fa"/>
  <rect x="664" y="1414" width="16" height="6" fill="#8aa5bd"/>
  <rect x="666" y="1406" width="12" height="8" fill="#457b9d"/>
  <rect x="668" y="1399" width="8" height="7" fill="#1d3557"/>
  <text x="706" y="1410" font-size="15" font-weight="700" fill="#14263c">Osaka</text>
  <text x="706" y="1428" font-size="12.5" fill="#5a7188">Osaka Castle, Dotonbori lights, street food capital</text>

  <!-- 4 Hiroshima / Miyajima -->
  <circle cx="672" cy="1476" r="20" fill="#fdeef0"/>
  <g stroke="#e67e22" stroke-width="3" stroke-linecap="round">
