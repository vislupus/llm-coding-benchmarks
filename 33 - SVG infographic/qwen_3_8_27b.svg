  </g>
  <text x="706" y="1472" font-size="15" font-weight="700" fill="#14263c">Hiroshima / Miyajima</text>
  <text x="706" y="1490" font-size="12.5" fill="#5a7188">Peace Memorial Park and the floating Itsukushima torii</text>

  <!-- 5 Mount Fuji / Hakone -->
  <circle cx="672" cy="1538" r="20" fill="#eef4fa"/>
  <path d="M658 1546 L672 1526 L686 1546 Z" fill="#1d3557"/>
  <path d="M667 1533 L672 1526 L677 1533 L674 1535 L672 1532 L670 1535 Z" fill="#ffffff"/>
  <text x="706" y="1534" font-size="15" font-weight="700" fill="#14263c">Mount Fuji / Hakone</text>
  <text x="706" y="1552" font-size="12.5" fill="#5a7188">Iconic volcano views, hot springs, and lake cruises</text>

  <!-- 6 Hokkaido -->
  <circle cx="672" cy="1600" r="20" fill="#eef4fa"/>
  <g stroke="#457b9d" stroke-width="2.6" stroke-linecap="round">
    <line x1="672" y1="1588" x2="672" y2="1612"/>
    <line x1="662" y1="1594" x2="682" y2="1606"/>
    <line x1="682" y1="1594" x2="662" y2="1606"/>
