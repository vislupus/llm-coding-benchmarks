  <text x="706" y="1614" font-size="12.5" fill="#5a7188">Sapporo, winter festivals, dairy farms, and powder snow</text>

  <!-- ============ SOURCE NOTE ============ -->
  <line x1="60" y1="1716" x2="1140" y2="1716" stroke="#c9d8e6" stroke-width="1"/>
  <text x="600" y="1744" font-size="11.5" fill="#7d95ab" text-anchor="middle">Sources: World Bank, nominal GDP in current US$ (2015–2024); national statistics and UN estimates for population composition. Figures rounded; infographic prepared for illustrative purposes.</text>
  <text x="600" y="1766" font-size="11" fill="#9db4c8" text-anchor="middle">Japan at a glance · static SVG infographic · no external assets</text>
</svg>
