</g> <text x="92" y="645" font-size="11" font-style="italic" fill="#93A0AE">Stylised map · not to scale · red dots = largest cities</text> <!-- Card B : about Japan --> <rect x="660" y="200" width="480" height="460" rx="20" fill="url(#cardGrad)" stroke="#DCE4EC"/> <rect x="660" y="200" width="8" height="460" rx="4" fill="#4C7FB3" opacity="0.85"/> <text x="692" y="243" font-size="19" font-weight="700" letter-spacing="1.1" fill="#22303F">AN ISLAND NATION</text> <text x="692" y="266" font-size="13.5" fill="#7A8899">14,125 islands · 47 prefectures</text> <text x="692" y="304" font-size="15.5" fill="#2C3A4A"> <tspan x="692" dy="0">Japan is an archipelago stretching roughly</tspan> <tspan x="692" dy="25">3,000 km — from subarctic Hokkaido in the</tspan> <tspan x="692" dy="25">north to subtropical Okinawa in the south.</tspan> <tspan x="692" dy="25">It sits on the Pacific “Ring of Fire”, with</tspan> <tspan x="692" dy="25">111 active volcanoes and frequent seismic</tspan> <tspan x="692" dy="25">activity.</tspan> <tspan x="692" dy="32">Around three quarters of the land is</tspan> <tspan x="692" dy="25">mountainous, so its 125 million people are</tspan> <tspan x="692" dy="25">packed into narrow coastal plains: the</tspan> <tspan x="692" dy="25">Kantō, Tōkai, Kansai and Sendai corridors.</tspan> <tspan x="692" dy="32">Four cities dominate the urban map —</tspan> <tspan x="692" dy="25">Tokyo, Yokohama, Osaka and Nagoya.</tspan> </text> <!-- ============ FULL-WIDTH PARAGRAPH ============ --> <rect x="60" y="690" width="1080" height="130" rx="20" fill="url(#cardGrad)" stroke="#DCE4EC"/> <rect x="60" y="690" width="8" height="130" rx="4" fill="#E5A04C" opacity="0.9"/> <text x="92" y="723" font-size="14" font-weight="700" letter-spacing="1.6" fill="#B4763A">THE BIG PICTURE</text> <text x="92" y="756" font-size="15.5" fill="#2C3A4A"> <tspan x="92" dy="0">Japan pairs one of the world’s oldest continuous cultures with hyper-modern infrastructure: a thousand-year-old shrine can stand beside a magnetic-levitation rail line.</tspan> <tspan x="92" dy="25">Each of its 47 prefectures keeps distinct dialects, crafts, festivals and cuisines, yet all share one of the planet’s safest, most punctual and most literate societies.</tspan> <tspan x="92" dy="25">The result is a compact country of enormous variety — dense megacities, quiet mountain villages, volcanic hot springs and forested islands, all within a few hours’ travel.</tspan> </text> <!-- ============ ROW 2 ============ --> <!-- Card C : economy text --> <rect x="60" y="850" width="440" height="360" rx="20" fill="url(#cardGrad)" stroke="#DCE4EC"/> <rect x="60" y="850" width="8" height="360" rx="4" fill="#6FB79A" opacity="0.9"/> <text x="92" y="893" font-size="19" font-weight="700" letter-spacing="1.1" fill="#22303F">THE ECONOMY</text> <text x="92" y="916" font-size="13.5" fill="#7A8899">Fourth largest in the world</text> <text x="92" y="952" font-size="14.5" fill="#2C3A4A"> <tspan x="92" dy="0">Japan is the fourth-largest economy,</tspan> <tspan x="92" dy="24">behind the United States, China and</tspan> <tspan x="92" dy="24">Germany.</tspan> <tspan x="92" dy="30">Nominal GDP has hovered around</tspan> <tspan x="92" dy="24">US$4–5 trillion for a decade. The slide</tspan> <tspan x="92" dy="24">in 2022–24 reflects a weaker yen more</tspan> <tspan x="92" dy="24">than weak output: measured in yen, the</tspan> <tspan x="92" dy="24">economy has kept expanding.</tspan> <tspan x="92" dy="30">Strengths: vehicles, machinery, robotics,</tspan> <tspan x="92" dy="24">chemicals, electronics and a vast stock</tspan> <tspan x="92" dy="24">of overseas assets.</tspan> </text> <!-- Card D : bar chart --> <rect x="540" y="850" width="600" height="360" rx="20" fill="url(#cardGrad)" stroke="#DCE4EC"/> <rect x="540" y="850" width="8" height="360" rx="4" fill="#C9374A" opacity="0.85"/> <text x="572" y="893" font-size="19" font-weight="700" letter-spacing="1.1" fill="#22303F">NOMINAL GDP</text> <text x="572" y="916" font-size="13.5" fill="#7A8899">Current US$ trillions · 2015–2024 · bars start at zero</text> <!-- gridlines --> <g stroke="#DCE4EC" stroke-width="1"> <line x1="588" y1="940" x2="1112" y2="940"/> <line x1="588" y1="980" x2="1112" y2="980"/> <line x1="588" y1="1020" x2="1112" y2="1020"/> <line x1="588" y1="1060" x2="1112" y2="1060"/> <line x1="588" y1="1100" x2="1112" y2="1100"/> <line x1="588" y1="1140" x2="1112" y2="1140" stroke="#B9C4CE" stroke-width="1.5"/> </g> <g font-size="10.5" fill="#93A0AE" text-anchor="end"> <text x="580" y="944">5</text> <text x="580" y="984">4</text> <text x="580" y="1024">3</text> <text x="580" y="1064">2</text> <text x="580" y="1104">1</text> <text x="580" y="1144">0</text> </g> <!-- bars --> <g> <rect x="590" y="962.4" width="34" height="177.6" rx="4" fill="url(#barGrad)"/> <rect x="644" y="940" width="34" height="200" rx="4" fill="url(#barGrad)"/> <rect x="698" y="942.8" width="34" height="197.2" rx="4" fill="url(#barGrad)"/> <rect x="752" y="938.4" width="34" height="201.6" rx="4" fill="url(#barGrad)"/> <rect x="806" y="935.2" width="34" height="204.8" rx="4" fill="url(#barGrad)"/> <rect x="860" y="938" width="34" height="202" rx="4" fill="url(#barGrad)"/> <rect x="914" y="938.4" width="34" height="201.6" rx="4" fill="url(#barGrad)"/> <rect x="968" y="969.6" width="34" height="170.4" rx="4" fill="url(#barGradLate)"/> <rect x="1022" y="971.6" width="34" height="168.4" rx="4" fill="url(#barGradLate)"/> <rect x="1076" y="978.8" width="34" height="161.2" rx="4" fill="url(#barGradLate)"/> </g> <!-- value labels --> <g font-size="10.5" font-weight="700" fill="#5A6B85" text-anchor="middle"> <text x="607" y="955.4">4.44</text> <text x="661" y="933">5.00</text> <text x="715" y="935.8">4.93</text> <text x="769" y="931.4">5.04</text> <text x="823" y="928.2">5.12</text> <text x="877" y="931">5.05</text> <text x="931" y="931.4">5.04</text> <text x="985" y="962.6">4.26</text> <text x="1039" y="964.6">4.21</text> <text x="1093" y="971.8">4.03</text> </g> <!-- year labels --> <g font-size="10.5" fill="#7A8899" text-anchor="middle"> <text x="607" y="1158">2015</text> <text x="661" y="1158">2016</text> <text x="715" y="1158">2017</text> <text x="769" y="1158">2018</text> <text x="823" y="1158">2019</text> <text x="877" y="1158">2020</text> <text x="931" y="1158">2021</text> <text x="985" y="1158">2022</text> <text x="1039" y="1158">2023</text> <text x="1093" y="1158">2024</text> </g> <!-- chart legend --> <g> <rect x="572" y="1178" width="12" height="12" rx="3" fill="url(#barGrad)"/> <text x="592" y="1188" font-size="11" fill="#7A8899">2015–2021</text> <rect x="672" y="1178" width="12" height="12" rx="3" fill="url(#barGradLate)"/> <text x="692" y="1188" font-size="11" fill="#7A8899">2022–2024 (weaker yen)</text> <text x="1112" y="1188" font-size="11" text-anchor="end" fill="#93A0AE">US$ trillions, current prices</text> </g> <!-- ============ ROW 3 ============ --> <!-- Card E : donut --> <rect x="60" y="1240" width="520" height="420" rx="20" fill="url(#cardGrad)" stroke="#DCE4EC"/> <rect x="60" y="1240" width="8" height="420" rx="4" fill="#C9374A" opacity="0.85"/> <text x="92" y="1283" font-size="19" font-weight="700" letter-spacing="1.1" fill="#22303F">POPULATION BY ORIGIN</text> <text x="92" y="1306" font-size="13.5" fill="#7A8899">Share of residents, per cent</text> <g transform="translate(-80,30)"> <!-- donut segments --> <path d="M320,1290 A130,130 0 1 1 299.66,1291.60 L307.80,1342.96 A78,78 0 1 0 320,1342 Z" fill="url(#ringGrad)" stroke="#FFFFFF" stroke-width="1.5"/> <path d="M299.66,1291.60 A130,130 0 0 1 304.51,1290.93 L310.70,1342.56 A78,78 0 0 0 307.80,1342.96 Z" fill="#E5804C" stroke="#FFFFFF" stroke-width="1.5"/> <path d="M304.51,1290.93 A130,130 0 0 1 307.77,1290.58 L312.66,1342.35 A78,78 0 0 0 310.70,1342.56 Z" fill="#4C7FB3" stroke="#FFFFFF" stroke-width="1.5"/> <path d="M307.77,1290.58 A130,130 0 0 1 310.21,1290.37 L314.13,1342.22 A78,78 0 0 0 312.66,1342.35 Z" fill="#6FB79A" stroke="#FFFFFF" stroke-width="1.5"/> <path d="M310.21,1290.37 A130,130 0 0 1 320,1290 L320,1342 A78,78 0 0 0 314.13,1342.22 Z" fill="#B9B2C9" stroke="#FFFFFF" stroke-width="1.5"/> <!-- centre label --> <text x="320" y="1418" font-size="38" font-weight="700" text-anchor="middle" fill="#22303F">125M</text> <text x="320" y="1444" font-size="13" text-anchor="middle" fill="#7A8899" letter-spacing="1">TOTAL RESIDENTS</text> <text x="320" y="1472" font-size="12.5" text-anchor="middle" fill="#B4763A">97.5% Japanese</text> </g> <!-- donut legend --> <g font-size="13" fill="#2C3A4A"> <rect x="398" y="1341" width="13" height="13" rx="3" fill="url(#ringGrad)"/> <text x="420" y="1352">Japanese</text> <text x="558" y="1352" text-anchor="end" font-weight="700" fill="#C9374A">97.5%</text>

