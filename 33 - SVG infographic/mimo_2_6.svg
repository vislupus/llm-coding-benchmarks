</g> <!-- SOURCE NOTE --> <line x1="60" y1="1690" x2="1140" y2="1690" stroke="#C9D3DC" stroke-width="1"/> <text x="60" y="1714" font-size="11.5" fill="#8D9AA8">Sources: World Bank World Development Indicators (GDP, current US$); Statistics Bureau of Japan — Population Census &amp; resident statistics. Figures rounded.</text> <text x="60" y="1733" font-size="11.5" fill="#8D9AA8">Editorial infographic · static SVG · no scripts, no external assets, no raster images. Percentages may not sum to 100 due to rounding.</text> </svg>
