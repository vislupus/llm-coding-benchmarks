200,0 L1200,72 C1010,132 830,42 620,88 C420,132 220,62 0,116 Z" fill="url(#waveB)" opacity="0.75"/> <path d="M0,1800 L1200,1800 L1200,1682 C980,1620 800,1730 590,1672 C400,1620 200,1700 0,1642 Z" fill="url(#waveB)"/> <path d="M0,1800 L1200,1800 L1200,1738 C1000,1682 820,1772 610,1724 C420,1682 210,1748 0,1706 Z" fill="url(#waveA)"/> <!-- faint decorative rings --> <circle cx="1092" cy="122" r="76" fill="none" stroke="#C9374A" stroke-opacity="0.16" stroke-width="1.5"/> <circle cx="1092" cy="122" r="52" fill="none" stroke="#4C7FB3" stroke-opacity="0.16" stroke-width="1.5"/> <circle cx="96" cy="1742" r="60" fill="none" stroke="#4C7FB3" stroke-opacity="0.14" stroke-width="1.5"/> <!-- TITLE BLOCK -->
