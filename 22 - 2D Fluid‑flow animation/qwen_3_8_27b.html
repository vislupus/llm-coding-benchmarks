<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Von Kármán Vortex Street — p5.js fluid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html,body{margin:0;background:#0a0a0f;display:flex;justify-content:center;
            align-items:center;height:100vh;font-family:monospace;}
  canvas{image-rendering:pixelated;box-shadow:0 0 40px #000;}
</style>
</head>
<body>
<script>
/* ================= GRID / SOLVER SETUP ================= */
const N = 160, M = 90, CELL = 6;          // grid resolution & pixel size
const W = N*CELL, H = M*CELL;
const S = (N+2)*(N+2) === 0 ? 0 : (N+2)*(M+2);
let u, v, u0, v0, pr, dv, wort, solid, prevSolid;
let g;                                     // offscreen field buffer
let t = 0, dt = 0.1, U0 = 6.0;            // inflow speed (cells/sec)

/* obstacle state */
let cx = N*0.35, cy = M*0.5;
let angle = 0, sizeScale = 1.0, shape = 0; // 0 circle, 1 ellipse, 2 rect
let ovx = 0, ovy = 0;                      // obstacle velocity (cells/frame)
let visMode = 0;                           // 0 speed color, 1 vorticity color
let paused = false, dragMode = null;

const idx = (i,j) => i + (N+2)*j;

function setup(){
  createCanvas(W,H);
  pixelDensity(1); imageSmoothing(false);
  g = createGraphics(N,M); g.pixelDensity(1);
  u=new Float32Array(S);  v=new Float32Array(S);
  u0=new Float32Array(S); v0=new Float32Array(S);
  pr=new Float32Array(S); dv=new Float32Array(S);
  wort=new Float32Array(S);
  solid=new Uint8Array(S); prevSolid=new Uint8Array(S);
  updateSolid();
  for(let k=0;k<150;k++){ t+=dt; stepFluid(); }   // pre-roll so vortices are visible immediately
}

/* ================= SOLID OBSTACLE MASK ================= */
function inObstacle(px,py){
  const c=Math.cos(angle), s=Math.sin(angle);
  const dx=px-cx, dy=py-cy;
  const lx= dx*c+dy*s, ly=-dx*s+dy*c;             // local (unrotated) coords
  const r=10*sizeScale;
  if(shape===0) return lx*lx+ly*ly < r*r;
  if(shape===1){ const a=1.7*r, b=0.75*r;
                 return (lx*lx)/(a*a)+(ly*ly)/(b*b) < 1; }
  const hw=1.5*r, hh=0.8*r;
  return Math.abs(lx)<hw && Math.abs(ly)<hh;
}

function updateSolid(){
  prevSolid.set(solid);
  solid.fill(0);
  const r=16*sizeScale;
  const i0=Math.max(1,Math.floor(cx-r)), i1=Math.min(N,Math.ceil(cx+r));
  const j0=Math.max(1,Math.floor(cy-r)), j1=Math.min(M,Math.ceil(cy+r));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++)
    if(inObstacle(i,j)) solid[idx(i,j)]=1;
  // inject momentum where the obstacle just vacated a cell (drives the wake)
  const ivx = Math.max(-12, Math.min(12, ovx/dt));
  const ivy = Math.max(-12, Math.min(12, ovy/dt));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const id=idx(i,j);
    if(prevSolid[id] && !solid[id]){ u[id]=ivx; v[id]=ivy; }
    if(solid[id]){ u[id]=0; v[id]=0; }
  }
}

/* ================= STABLE FLUIDS (Stam) ================= */
function setBnd(b,x){
  for(let i=1;i<=N;i++){
    x[idx(i,0)]   = b===2 ? -x[idx(i,1)] : x[idx(i,1)];
    x[idx(i,M+1)] = b===2 ? -x[idx(i,M)] : x[idx(i,M)];
  }
  for(let j=1;j<=M;j++){
    x[idx(0,j)]   = b===1 ? -x[idx(1,j)] : x[idx(1,j)];
    x[idx(N+1,j)] = b===1 ? -x[idx(N,j)] : x[idx(N,j)];
  }
  x[idx(0,0)]=0.5*(x[idx(1,0)]+x[idx(0,1)]);
  x[idx(N+1,0)]=0.5*(x[idx(N,0)]+x[idx(N+1,1)]);
  x[idx(0,M+1)]=0.5*(x[idx(1,M+1)]+x[idx(0,M)]);
  x[idx(N+1,M+1)]=0.5*(x[idx(N,M+1)]+x[idx(N+1,M)]);
  for(let j=1;j<=M;j++)for(let i=1;i<=N;i++)
    if(solid[idx(i,j)]) x[idx(i,j)]=0;
}

function linSolve(b,x,x0,a,c,iters){
  const cR=1/c;
  for(let k=0;k<iters;k++){
    for(let j=1;j<=M;j++){
      const row=j*(N+2);
      for(let i=1;i<=N;i++){
        const id=i+row;
        if(solid[id]){ x[id]=0; continue; }
        x[id]=(x0[id]+a*(x[id-1]+x[id+1]+x[id-(N+2)]+x[id+(N+2)]))*cR;
      }
    }
    setBnd(b,x);
  }
}

function advect(b,d,d0,uu,vv,dt){
  for(let j=1;j<=M;j++){
    const row=j*(N+2);
    for(let i=1;i<=N;i++){
      const id=i+row;
      if(solid[id]){ d[id]=0; continue; }
      let x=i-dt*uu[id], y=j-dt*vv[id];
      if(x<0.5)x=0.5; if(x>N+0.5)x=N+0.5;
      if(y<0.5)y=0.5; if(y>M+0.5)y=M+0.5;
      const i0=x|0, i1=i0+1, j0=y|0, j1=j0+1;
      const s1=x-i0, s0=1-s1, t1=y-j0, t0=1-t1;
      d[id]= s0*(t0*d0[i0+j0*(N+2)]+t1*d0[i0+j1*(N+2)])
           + s1*(t0*d0[i1+j0*(N+2)]+t1*d0[i1+j1*(N+2)]);
    }
  }
  setBnd(b,d);
}

function project(uu,vv,pp,dd){
  for(let j=1;j<=M;j++){
    const row=j*(N+2);
    for(let i=1;i<=N;i++){
      const id=i+row;
      if(solid[id]){ dd[id]=0; pp[id]=0; continue; }
      dd[id]=-0.5*(uu[id+1]-uu[id-1]+vv[id+(N+2)]-vv[id-(N+2)]);
      pp[id]=0;
    }
  }
  setBnd(0,dd); setBnd(0,pp);
  linSolve(0,pp,dd,1,4,14);
  for(let j=1;j<=M;j++){
    const row=j*(N+2);
    for(let i=1;i<=N;i++){
      const id=i+row;
      if(solid[id]){ uu[id]=0; vv[id]=0; continue; }
      uu[id]-=0.5*(pp[id+1]-pp[id-1]);
      vv[id]-=0.5*(pp[id+(N+2)]-pp[id-(N+2)]);
    }
  }
  setBnd(1,uu); setBnd(2,vv);
}

function stepFluid(){
  // inflow with a tiny oscillation to break symmetry and trigger shedding
  for(let j=1;j<=M;j++){
    const id=idx(1,j);
    if(!solid[id]){
      u[id]=U0*(1+0.06*Math.sin(t*3+j*0.35)+0.02*Math.sin(t*7.3+j*1.7));
      v[id]=0;
    }
  }
  let tmp=u; u=u0; u0=tmp;
  tmp=v; v=v0; v0=tmp;
  advect(1,u,u0,u0,v0,dt);
  advect(2,v,v0,u0,v0,dt);
  project(u,v,pr,dv);
  for(let k=0;k<S;k++){ u[k]*=0.999; v[k]*=0.999; }  // mild dissipation
}

function computeWort(){
  for(let j=1;j<=M;j++){
    const row=j*(N+2);
    for(let i=1;i<=N;i++){
      const id=i+row;
      wort[id]=0.5*((v[id+1]-v[id-1])-(u[id+(N+2)]-u[id-(N+2)]));
    }
  }
}

/* ================= RENDERING ================= */
function speedRGB(sp){
  const s0=[8,16,64], s1=[0,140,255], s2=[255,220,60], s3=[255,40,30];
  let a,b,tt;
  if(sp<0.35){a=s0;b=s1;tt=sp/0.35;}
  else if(sp<0.7){a=s1;b=s2;tt=(sp-0.35)/0.35;}
  else {a=s2;b=s3;tt=Math.min(1,(sp-0.7)/0.3);}
  return [a[0]+(b[0]-a[0])*tt, a[1]+(b[1]-a[1])*tt, a[2]+(b[2]-a[2])*tt];
}

function renderField(){
  g.loadPixels();
  const px=g.pixels;
  for(let j=1;j<=M;j++){
    const row=j*(N+2);
    for(let i=1;i<=N;i++){
      const id=i+row, k=((j-1)*N+(i-1))*4;
      if(solid[id]){ px[k]=70;px[k+1]=72;px[k+2]=84;px[k+3]=255; continue; }
      let R,G,B;
      if(visMode===1){
        const w=Math.max(-1,Math.min(1, wort[id]*8));
        if(w>0){ R=255*w; G=60*w;  B=60*w; }
        else   { R=-40*w; G=-120*w; B=-255*w; }
        R+=10; G+=10; B+=22;
      } else {
        const sp=Math.min(1, Math.hypot(u[id],v[id])/(U0*1.1));
        const c=speedRGB(sp); R=c[0]; G=c[1]; B=c[2];
      }
      px[k]=R; px[k+1]=G; px[k+2]=B; px[k+3]=255;
    }
  }
  g.updatePixels();
  image(g,0,0,W,H);
}

function drawVectors(){
  strokeWeight(1);
  for(let j=2;j<M;j+=4)for(let i=2;i<N;i+=4){
    const id=idx(i,j);
    if(solid[id]) continue;
    const uu=u[id], vv=v[id], sp=Math.hypot(uu,vv);
    if(sp<0.05) continue;
    const x=i*CELL, y=j*CELL;
    const len=Math.min(1.1, sp*0.22)*CELL;
    const nx=uu/sp, ny=vv/sp;
    const ex=x+nx*len, ey=y+ny*len;
    const c=speedRGB(Math.min(1,sp/(U0*1.1)));
    stroke(c[0],c[1],c[2],150);
    line(x,y,ex,ey);
    const ah=3, px_=-ny, py_=nx;
    line(ex,ey, ex-nx*ah+px_*ah*0.6, ey-ny*ah+py_*ah*0.6);
    line(ex,ey, ex-nx*ah-px_*ah*0.6, ey-ny*ah-py_*ah*0.6);
  }
}

function drawObstacle(){
  push();
  translate(cx*CELL, cy*CELL);
  rotate(angle);
  const r=10*sizeScale*CELL;
  fill(90,95,112); noStroke();
  if(shape===0) circle(0,0,2*r);
  else if(shape===1) ellipse(0,0,2*1.7*r,2*0.75*r);
  else { rectMode(CENTER); rect(0,0,2*1.5*r,2*0.8*r); }
  stroke(210,215,230,200); noFill(); strokeWeight(1.5);
  if(shape===0) circle(0,0,2*r);
  else if(shape===1) ellipse(0,0,2*1.7*r,2*0.75*r);
  else { rectMode(CENTER); rect(0,0,2*1.5*r,2*0.8*r); }
  pop();
}

function drawHUD(){
  noStroke(); fill(225,225,235,230); textSize(12); textAlign(LEFT,TOP);
  const shapes=['circle','ellipse','rectangle'];
  const lines=[
    'von Karman vortex street — interactive 2D Navier-Stokes',
    'drag obstacle: move   |   drag background: rotate',
    'scroll / [ ]: size   |   Q E: rotate   |   1 2 3: shape',
    'V: view (speed / vorticity)   |   SPACE: pause   |   R: reset',
    'shape: '+shapes[shape]+'    size: '+sizeScale.toFixed(2)+'    view: '+(visMode===0?'speed':'vorticity')
  ];
  for(let i=0;i<lines.length;i++) text(lines[i], 10, 8+i*16);
}

/* ================= MAIN LOOP ================= */
function draw(){
  if(!paused){ t+=dt; updateSolid(); stepFluid(); }
  computeWort();
  background(0);
  renderField();
  drawVectors();
  drawObstacle();
  drawHUD();
}

/* ================= INTERACTION ================= */
function mousePressed(){
  const gx=mouseX/CELL, gy=mouseY/CELL;
  const dx=gx-cx, dy=gy-cy;
  dragMode = (dx*dx+dy*dy < (17*sizeScale)**2) ? 'move' : 'rotate';
}
function mouseDragged(){
  const gx=mouseX/CELL, gy=mouseY/CELL;
  if(dragMode==='move'){
    ovx=gx-cx; ovy=gy-cy;
    cx=Math.max(14,Math.min(N-14,gx));
    cy=Math.max(10,Math.min(M-10,gy));
  } else if(dragMode==='rotate'){
    angle=Math.atan2(gy-cy, gx-cx);
  }
}
function mouseReleased(){ dragMode=null; ovx=0; ovy=0; }
function mouseWheel(e){
  sizeScale *= e.delta>0 ? 0.94 : 1.06;
  sizeScale = Math.max(0.35, Math.min(2.5, sizeScale));
  return false;
}
function keyPressed(){
  if(key==='1') shape=0;
  if(key==='2') shape=1;
  if(key==='3') shape=2;
  if(key==='q') angle-=0.1;
  if(key==='e') angle+=0.1;
  if(key==='[') sizeScale=Math.max(0.35,sizeScale*0.92);
  if(key===']') sizeScale=Math.min(2.5,sizeScale*1.08);
  if(key==='v') visMode=(visMode+1)%2;
  if(key==='r'){ u.fill(0); v.fill(0); }
  if(key===' '){ paused=!paused; return false; }
}
</script>
</body>
</html>
