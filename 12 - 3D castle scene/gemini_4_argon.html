<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Kingdom — 3D Medieval Tabletop Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #141824;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f4efe6;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Tabletop UI Overlay */
        .ui-header {
            position: absolute;
            top: 22px;
            left: 26px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
        }
        .ui-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #f3c663;
            background: rgba(20, 24, 34, 0.72);
            border: 1px solid rgba(243, 198, 99, 0.35);
            padding: 4px 10px;
            border-radius: 99px;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
        }
        .ui-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #fffdf9;
        }
        .ui-header p {
            font-size: 13px;
            color: rgba(244, 239, 230, 0.78);
            margin-top: 2px;
        }
        .ui-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            background: rgba(18, 22, 32, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 8px 12px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            z-index: 10;
            max-width: 94vw;
        }
        .ui-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .ui-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 4px;
        }
        .btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #f0ece1;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn:hover {
            background: rgba(243, 198, 99, 0.2);
            border-color: rgba(243, 198, 99, 0.55);
            color: #fff;
            transform: translateY(-1px);
        }
        .btn.active {
            background: linear-gradient(135deg, #e5b24c, #c98627);
            border-color: #f7d47c;
            color: #18140c;
            box-shadow: 0 4px 14px rgba(229, 178, 76, 0.35);
        }
        .ui-hint {
            position: absolute;
            top: 24px;
            right: 26px;
            background: rgba(18, 22, 32, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: rgba(244, 239, 230, 0.8);
            backdrop-filter: blur(8px);
            pointer-events: none;
            line-height: 1.5;
            z-index: 10;
        }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #242b3d 0%, #10141f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.65s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(243, 198, 99, 0.2);
            border-top-color: #f3c663;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 760px) {
            .ui-hint { display: none; }
            .ui-header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #f7d47c;">CRAFTING FLOATING KINGDOM...</div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 6px;">Sculpting cliffs, castle keep, watermill & timber village</div>
    </div>

    <div class="ui-header">
        <span class="ui-badge">Tabletop Miniature Diorama</span>
        <h1>Highland Keep &amp; Riverhaven</h1>
        <p>Procedural High-Poly Floating Island &bull; Interactive 3D Scene</p>
    </div>

    <div class="ui-hint">
        <strong>Left Drag</strong> Orbit &nbsp;|&nbsp; <strong>Right Drag</strong> Pan<br />
        <strong>Scroll</strong> Zoom &nbsp;|&nbsp; Click presets below to tour
    </div>

    <div class="ui-controls">
        <div class="ui-group" id="camGroup">
            <button class="btn active" data-cam="overview">Full Diorama</button>
            <button class="btn" data-cam="castle">Royal Castle</button>
            <button class="btn" data-cam="village">Market &amp; Tavern</button>
            <button class="btn" data-cam="mill">Watermill &amp; Falls</button>
            <button class="btn" data-cam="ruins">Ruined Watchtower</button>
        </div>
        <div class="ui-divider"></div>
        <div class="ui-group" id="moodGroup">
            <button class="btn active" data-mood="day">Sunlit Day</button>
            <button class="btn" data-mood="sunset">Golden Hour</button>
            <button class="btn" data-mood="night">Cozy Night</button>
        </div>
        <div class="ui-divider"></div>
        <div class="ui-group">
            <button class="btn active" id="btnSpin">Turntable: ON</button>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
    (function () {
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, {
            preserveDrawingBuffer: true,
            stencil: true,
            antialias: true
        });
        engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 2));

        // ============================================================================
        // 1. DETERMINISTIC 3D NOISE & MATH HELPERS
        // ============================================================================
        const PERM = new Uint8Array(512);
        (function initNoise() {
            const p = new Uint8Array(256);
            for (let i = 0; i < 256; i++) p[i] = i;
            let seed = 133742;
            for (let i = 255; i > 0; i--) {
                seed = (seed * 16807) % 2147483647;
                const j = seed % (i + 1);
                const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
            }
            for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
        })();

        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(a, b, t) { return a + t * (b - a); }
        function smoothstep(edge0, edge1, x) {
            const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
            return t * t * (3 - 2 * t);
        }
        function grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }
        function noise3D(x, y, z) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const Z = Math.floor(z) & 255;
            x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
            const u = fade(x), v = fade(y), w = fade(z);
            const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
            const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
            return lerp(
                lerp(
                    lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
                    lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u),
                    v
                ),
                lerp(
                    lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
                    lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u),
                    v
                ),
                w
            );
        }
        function fbm(x, y, z, octaves = 4) {
            let val = 0, amp = 0.5, freq = 1.0;
            for (let i = 0; i < octaves; i++) {
                val += amp * noise3D(x * freq, y * freq, z * freq);
                freq *= 2.05;
                amp *= 0.48;
            }
            return val;
        }

        // ============================================================================
        // 2. ISLAND TOPOLOGY, RIVER SPLINE & HEIGHTFIELD FUNCTIONS
        // ============================================================================
        const WATER_Y = 1.68;
        const RIVER_PTS = [
            { x: -16.5, z: 22.0 }, // Upper mountain cascade pool
            { x: -7.5,  z: 13.0 }, // Foot of castle crag
            { x: -0.5,  z: 4.5  }, // Bend near watermill
            { x: 5.5,   z: -1.5 }, // Watermill channel
            { x: 12.0,  z: -8.0 }, // Village central bridge
            { x: 19.5,  z: -15.5}, // Lower tavern bridge
            { x: 28.5,  z: -24.5}, // Waterfall cliff lip
            { x: 34.0,  z: -30.0}  // Off edge
        ];

        function getRiverInfo(x, z) {
            let minDist = 9999;
            let bestT = 0;
            const totalSegs = RIVER_PTS.length - 1;
            for (let i = 0; i < totalSegs; i++) {
                const A = RIVER_PTS[i], B = RIVER_PTS[i + 1];
                const dx = B.x - A.x, dz = B.z - A.z;
                const lenSq = dx * dx + dz * dz;
                let t = ((x - A.x) * dx + (z - A.z) * dz) / lenSq;
                t = Math.max(0, Math.min(1, t));
                const px = A.x + t * dx, pz = A.z + t * dz;
                const d = Math.hypot(x - px, z - pz);
                if (d < minDist) {
                    minDist = d;
                    bestT = (i + t) / totalSegs;
                }
            }
            // Smooth river width (wider at upper pond and mill, slightly narrower at bridges)
            const width = 2.55 + 0.55 * Math.sin(bestT * Math.PI * 3.0);
            return { dist: minDist, t: bestT, width };
        }

        function getIslandOuterRadius(angle) {
            const cx = Math.cos(angle), cz = Math.sin(angle);
            let r = 36.2
                + 2.6 * Math.sin(angle * 3.0 + 0.5)
                + 1.8 * Math.cos(angle * 5.0 - 0.8)
                + 2.8 * fbm(cx * 1.8 + 5, 0, cz * 1.8 + 5, 3);

            // Promontory jutting out for the Ruined Watchtower (around angle ~ -2.53 rad => x<0, z<0)
            const towerAngle = Math.atan2(-15.5, -24.5);
            let dTower = Math.abs(Math.atan2(Math.sin(angle - towerAngle), Math.cos(angle - towerAngle)));
            if (dTower < 0.42) {
                r += 4.2 * Math.cos((dTower / 0.42) * (Math.PI * 0.5));
            }

            // Slight cove indentation at the grand waterfall exit (around (28.5, -24.5))
            const fallAngle = Math.atan2(-24.5, 28.5);
            let dFall = Math.abs(Math.atan2(Math.sin(angle - fallAngle), Math.cos(angle - fallAngle)));
            if (dFall < 0.25) {
                r -= 1.6 * Math.cos((dFall / 0.25) * (Math.PI * 0.5));
            }
            return r;
        }

        function getTerrainHeight(x, z) {
            // Base undulating meadow
            let h = 2.4 + 1.15 * fbm(x * 0.045, 0, z * 0.045, 3);

            // 1. Central-Rear Castle Plateau centered at (-11.5, 11.5)
            const dCastle = Math.hypot(x - (-11.5), z - 11.5);
            const castlePlateau = 1.0 - smoothstep(10.2, 16.5, dCastle);
            const castleCragNoise = (1.0 - smoothstep(8.5, 17.5, dCastle)) * smoothstep(9.0, 12.5, dCastle) * fbm(x * 0.25, 1.3, z * 0.25, 3) * 3.2;
            h = lerp(h, 9.2, castlePlateau) + castleCragNoise;

            // 2. Castle Access Ramp descending from (-4.5, 7.2) to (2.5, 1.5)
            const rx = 2.5 - (-4.5), rz = 1.5 - 7.2;
            const rLenSq = rx * rx + rz * rz;
            let rt = ((x - (-4.5)) * rx + (z - 7.2) * rz) / rLenSq;
            rt = Math.max(0, Math.min(1, rt));
            const rpx = -4.5 + rt * rx, rpz = 7.2 + rt * rz;
            const dRamp = Math.hypot(x - rpx, z - rpz);
            if (dRamp < 3.4) {
                const rampBlend = 1.0 - smoothstep(1.3, 3.4, dRamp);
                const rampTargetH = lerp(9.1, 2.55, smoothstep(0.0, 1.0, rt));
                h = lerp(h, rampTargetH, rampBlend * 0.88);
            }

            // 3. High Mountain Peak behind Castle & River Headwaters at (-18.5, 24.5)
            const dPeak = Math.hypot((x - (-18.5)) * 0.85, (z - 24.5) * 1.1);
            if (dPeak < 14.5) {
                const peakFactor = Math.pow(1.0 - smoothstep(0.0, 14.5, dPeak), 1.65);
                const crags = Math.abs(fbm(x * 0.18, 2.5, z * 0.18, 4)) * 7.5;
                h += peakFactor * (13.5 + crags);
            }

            // 4. Ruined Watchtower Rocky Promontory at (-24.5, -15.5)
            const dRuins = Math.hypot(x - (-24.5), z - (-15.5));
            const ruinPlateau = 1.0 - smoothstep(4.2, 10.5, dRuins);
            h = lerp(h, 6.2, ruinPlateau);

            // 5. Flatten Village Market & Tavern Plazas slightly for clean foundations
            const dVillage = Math.hypot(x - 10.0, z - 0.0);
            if (dVillage < 15.0) {
                const vFlat = 1.0 - smoothstep(6.0, 15.0, dVillage);
                h = lerp(h, 2.55 + 0.25 * noise3D(x * 0.08, 0, z * 0.08), vFlat * 0.65);
            }

            // 6. Carve the Winding River Canyon
            const riv = getRiverInfo(x, z);
            if (riv.dist < riv.width + 2.8) {
                const bankFactor = 1.0 - smoothstep(riv.width * 0.55, riv.width + 2.5, riv.dist);
                const bedDepth = WATER_Y - 1.35 + 0.2 * noise3D(x * 0.4, 0, z * 0.4);
                // Keep mountain headwaters cliff steep behind t < 0.05
                const headwaterMask = smoothstep(0.0, 0.06, riv.t);
                h = lerp(h, bedDepth, bankFactor * headwaterMask);
            }

            // 7. Gentle raised rocky lip right at the island outer perimeter (except waterfall exit)
            const angle = Math.atan2(z, x);
            const maxR = getIslandOuterRadius(angle);
            const curR = Math.hypot(x, z);
            const rimProximity = smoothstep(maxR - 4.0, maxR, curR);
            const rivMask = smoothstep(2.0, 5.2, riv.dist);
            h += rimProximity * rivMask * (0.9 + 1.2 * Math.max(0, fbm(x * 0.16, 4.1, z * 0.16, 2)));

            return h;
        }

        // ============================================================================
        // 3. PROCEDURAL TEXTURE & MATERIAL STUDIO
        // ============================================================================
        function createProceduralTextures(scene) {
            const textures = {};

            // 1. Stone Wall Ashlar Texture
            const stoneDT = new BABYLON.DynamicTexture("stoneDT", 512, scene, true);
            const sCtx = stoneDT.getContext();
            sCtx.fillStyle = "#6c7078";
            sCtx.fillRect(0, 0, 512, 512);
            const rows = 16;
            const rowH = 512 / rows;
            let seed = 91;
            const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
            for (let r = 0; r < rows; r++) {
                let x = (r % 2) * -28;
                while (x < 512) {
                    const w = 44 + Math.floor(rand() * 36);
                    const shade = 118 + Math.floor((rand() - 0.5) * 42);
                    const warm = Math.floor((rand() - 0.5) * 14);
                    sCtx.fillStyle = `rgb(${shade + warm}, ${shade}, ${shade - warm * 0.5})`;
                    sCtx.fillRect(x + 2, r * rowH + 2, w - 4, rowH - 4);
                    // Highlight top edge
                    sCtx.fillStyle = "rgba(255,255,255,0.12)";
                    sCtx.fillRect(x + 2, r * rowH + 2, w - 4, 3);
                    // Shadow bottom edge
                    sCtx.fillStyle = "rgba(0,0,0,0.22)";
                    sCtx.fillRect(x + 2, (r + 1) * rowH - 5, w - 4, 3);
                    x += w;
                }
            }
            stoneDT.update();
            stoneDT.wrapU = stoneDT.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
            textures.stone = stoneDT;

            // 2. Scalloped Roof Shingles Texture (Neutral grayscale/warm tintable)
            const roofDT = new BABYLON.DynamicTexture("roofDT", 256, scene, true);
            const rCtx = roofDT.getContext();
            rCtx.fillStyle = "#b8b8b8";
            rCtx.fillRect(0, 0, 256, 256);
            const rRows = 12, rH = 256 / rRows;
            for (let r = 0; r < rRows; r++) {
                for (let c = -1; c < 12; c++) {
                    const x = c * 24 + (r % 2) * 12;
                    const y = r * rH;
                    const v = 185 + Math.floor((rand() - 0.5) * 45);
                    rCtx.fillStyle = `rgb(${v},${v},${v})`;
                    rCtx.fillRect(x + 1, y + 1, 22, rH - 2);
                    rCtx.fillStyle = "rgba(0,0,0,0.28)";
                    rCtx.fillRect(x, y + rH - 3, 24, 3);
                }
            }
            roofDT.update();
            roofDT.wrapU = roofDT.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
            textures.roof = roofDT;

            // 3. Half-Timber Plaster & Framing Texture
            const timberDT = new BABYLON.DynamicTexture("timberDT", 256, scene, true);
            const tCtx = timberDT.getContext();
            tCtx.fillStyle = "#f2e5ce";
            tCtx.fillRect(0, 0, 256, 256);
            // Subtle plaster grain
            for (let i = 0; i < 600; i++) {
                tCtx.fillStyle = rand() > 0.5 ? "rgba(255,255,255,0.08)" : "rgba(160,130,95,0.08)";
                tCtx.fillRect(rand() * 256, rand() * 256, 6, 6);
            }
            // Dark oak beams
            tCtx.fillStyle = "#4a3020";
            tCtx.fillRect(0, 0, 256, 16);
            tCtx.fillRect(0, 120, 256, 14);
            tCtx.fillRect(0, 240, 256, 16);
            for (let x = 0; x <= 256; x += 64) {
                tCtx.fillRect(x - 7, 0, 14, 256);
            }
            // Diagonal braces
            tCtx.strokeStyle = "#4a3020";
            tCtx.lineWidth = 11;
            tCtx.beginPath();
            tCtx.moveTo(7, 120); tCtx.lineTo(57, 14);
            tCtx.moveTo(199, 14); tCtx.lineTo(249, 120);
            tCtx.stroke();
            timberDT.update();
            timberDT.wrapU = timberDT.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
            textures.timber = timberDT;

            // 4. Striped Market Awning Fabrics
            function makeStripeTex(name, c1, c2) {
                const dt = new BABYLON.DynamicTexture(name, 128, scene, true);
                const ctx = dt.getContext();
                for (let i = 0; i < 8; i++) {
                    ctx.fillStyle = i % 2 === 0 ? c1 : c2;
                    ctx.fillRect(i * 16, 0, 16, 128);
                }
                ctx.fillStyle = "rgba(0,0,0,0.12)";
                ctx.fillRect(0, 116, 128, 12);
                dt.update();
                return dt;
            }
            textures.stripeRed = makeStripeTex("stripeRed", "#d93b34", "#f8f1e1");
            textures.stripeBlue = makeStripeTex("stripeBlue", "#286fb4", "#f8f1e1");
            textures.stripeGreen = makeStripeTex("stripeGreen", "#3a8f52", "#f9e398");
            textures.stripeGold = makeStripeTex("stripeGold", "#e09124", "#fff4dc");

            // 5. Animated Turquoise Water & Waterfall Foam Texture
            const waterDT = new BABYLON.DynamicTexture("waterDT", 256, scene, true);
            const wCtx = waterDT.getContext();
            wCtx.fillStyle = "#19b5b8";
            wCtx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 140; i++) {
                const x = rand() * 256, y = rand() * 256;
                const w = 8 + rand() * 18, h = 40 + rand() * 80;
                wCtx.fillStyle = rand() > 0.35 ? "rgba(255,255,255,0.22)" : "rgba(12,115,135,0.28)";
                wCtx.beginPath();
                wCtx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
                wCtx.fill();
            }
            waterDT.update();
            waterDT.wrapU = waterDT.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
            textures.water = waterDT;

            // 6. Soft Particle Radial Glow Texture
            const partDT = new BABYLON.DynamicTexture("partDT", 64, scene, true);
            const pCtx = partDT.getContext();
            const grad = pCtx.createRadialGradient(32, 32, 2, 32, 32, 30);
            grad.addColorStop(0, "rgba(255, 255, 255, 1)");
            grad.addColorStop(0.5, "rgba(255, 255, 255, 0.45)");
            grad.addColorStop(1, "rgba(255, 255, 255, 0)");
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, 64, 64);
            partDT.update();
            textures.particle = partDT;

            return textures;
        }

        // ============================================================================
        // 4. MAIN SCENE CONSTRUCTION
        // ============================================================================
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.11, 0.14, 0.22, 1.0);

        // Camera with smooth inertial tabletop orbit controls
        const camera = new BABYLON.ArcRotateCamera(
            "dioramaCam",
            -Math.PI * 0.32,
            Math.PI * 0.33,
            88,
            new BABYLON.Vector3(0, 3.5, 0),
            scene
        );
        camera.lowerRadiusLimit = 22;
        camera.upperRadiusLimit = 145;
        camera.lowerBetaLimit = 0.18;
        camera.upperBetaLimit = Math.PI * 0.52;
        camera.inertia = 0.88;
        camera.panningInertia = 0.85;
        camera.panningSensibility = 65;
        camera.wheelPrecision = 14;
        camera.attachControl(canvas, true);

        // Lighting Setup
        const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0.2, 1, 0.1), scene);
        hemiLight.diffuse = new BABYLON.Color3(0.86, 0.92, 1.0);

        const tex = createProceduralTextures(scene);

        mats.castleStone = makeMat("castleStone", "#d4d2cc", 0.85, 0.04, tex.stone, 2.5, 2.5);
