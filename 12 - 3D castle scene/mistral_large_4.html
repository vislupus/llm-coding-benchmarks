<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama — Babylon.js</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#a8d8f8;}
  #c{width:100%;height:100%;display:block;outline:none;touch-action:none;}
  #hud{position:fixed;left:14px;bottom:12px;font-family:Georgia,serif;color:#fff;
       text-shadow:0 1px 4px rgba(0,40,80,.6);font-size:14px;letter-spacing:.5px;pointer-events:none;opacity:.9;}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">⛰ Floating Isle Diorama — drag to orbit · scroll to zoom</div>
<script>
(function(){
"use strict";
const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, {stencil:true});
const scene  = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.66,0.83,0.97,1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.0055;
scene.fogColor = new BABYLON.Color3(0.72,0.86,0.97);
scene.ambientColor = new BABYLON.Color3(0.22,0.25,0.30);

/* ---------- camera ---------- */
const camera = new BABYLON.ArcRotateCamera("cam", -2.1, 1.02, 60, new BABYLON.Vector3(0,2,0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 32; camera.upperRadiusLimit = 120;
camera.lowerBetaLimit = 0.25; camera.upperBetaLimit = 1.45;
camera.wheelDeltaPercentage = 0.01;
camera.panningSensibility = 0;
camera.autoRotate = true; camera.autoRotateSpeed = 0.45;

/* ---------- lights ---------- */
const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.35,1,0.25), scene);
hemi.intensity = 0.85;
hemi.diffuse  = new BABYLON.Color3(0.95,0.98,1.0);
hemi.groundColor = new BABYLON.Color3(0.45,0.55,0.35);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5,-1,-0.4), scene);
sun.position = new BABYLON.Vector3(42,62,26);
sun.intensity = 0.95;
sun.orthoLeft=-55; sun.orthoRight=55; sun.orthoTop=55; sun.orthoBottom=-55;
sun.orthoNear=1;  sun.orthoFar=160;

const sg = new BABYLON.ShadowGenerator(2048, sun);
sg.useBlurExponentialShadowMap = true;
sg.blurKernel = 28;
sg.setDarkness(0.32);

/* ---------- materials ---------- */
const matCache = {};
function M(hex, opt={}){
  const key = hex + JSON.stringify(opt);
  if(!matCache[key]){
    const m = new BABYLON.StandardMaterial(key, scene);
    m.diffuseColor = BABYLON.Color3.FromHexString(hex);
    m.specularColor = opt.spec ? BABYLON.Color3.FromHexString(opt.spec) : new BABYLON.Color3(0,0,0);
    m.specularPower = 64;
    if(opt.emissive) m.emissiveColor = BABYLON.Color3.FromHexString(opt.emissive);
    if(opt.alpha !== undefined) m.alpha = opt.alpha;
    if(opt.noCull) m.backFaceCulling = false;
    matCache[key] = m;
  }
  return matCache[key];
}

/* ---------- mesh helpers ---------- */
function place(m,x,y,z,ry=0,parent=null){
  m.position.set(x,y,z);
  if(ry) m.rotation.y = ry;
  if(parent) m.parent = parent;
  m.receiveShadows = true;
  return m;
}
function B(name,w,h,d,mat,x,y,z,ry=0,parent=null){ // box
  return place(BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene),x,y,z,ry,parent).material=mat, place(BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene),x,y,z,ry,parent);
}
function box(name,w,h,d,mat,x,y,z,ry=0,parent=null){
  const m = BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
  m.material = mat;
  return place(m,x,y,z,ry,parent);
}
function cyl(name,d,h,mat,x,y,z,seg=16,parent=null){
  const m = BABYLON.MeshBuilder.CreateCylinder(name,{diameter:d,height:h,tessellation:seg},scene);
  m.material = mat;
  return place(m,x,y,z,0,parent);
}
function cone(name,d,h,mat,x,y,z,parent=null){
  const m = BABYLON.MeshBuilder.CreateCone(name,{diameter:d,height:h,tessellation:16},scene);
  m.material = mat;
  return place(m,x,y,z,0,parent);
}
function sph(name,d,mat,x,y,z,parent=null){
  const m = BABYLON.MeshBuilder.CreateSphere(name,{diameter:d,segments:10},scene);
  m.material = mat;
  return place(m,x,y,z,0,parent);
}
function prism(name,w,h,d,mat,x,y,z,ry=0,parent=null){ // triangular prism (roofs)
  const hw=w/2, hd=d/2, L=Math.hypot(hw,h);
  const pos=[],nor=[],uv=[],idx=[];
  const quad=(a,b,c,e,n)=>{const b0=pos.length/3;[a,b,c,e].forEach(p=>{pos.push(...p);nor.push(...n);uv.push(0,0);});idx.push(b0,b0+1,b0+2,b0,b0+2,b0+3);};
  const tri =(a,b,c,n)=>{const b0=pos.length/3;[a,b,c].forEach(p=>{pos.push(...p);nor.push(...n);uv.push(0,0);});idx.push(b0,b0+1,b0+2);};
  quad([-hw,0,-hd],[-hw,0,hd],[hw,0,hd],[hw,0,-hd],[0,-1,0]);
  quad([-hw,0,-hd],[0,h,-hd],[0,h,hd],[-hw,0,hd],[-h/L,hw/L,0]);
  quad([ hw,0,-hd],[hw,0,hd],[0,h,hd],[0,h,-hd],[ h/L,hw/L,0]);
  tri([-hw,0,-hd],[0,h,-hd],[hw,0,-hd],[0,0,-1]);
  tri([-hw,0, hd],[hw,0,hd],[0,h,hd],[0,0, 1]);
  const vd = new BABYLON.VertexData();
  vd.positions=pos; vd.normals=nor; vd.uvs=uv; vd.indices=idx;
  const m = new BABYLON.Mesh(name,scene);
  vd.applyToMesh(m);
  m.material = mat;
  return place(m,x,y,z,ry,parent);
}

/* ---------- sky dome ---------- */
const skyTex = new BABYLON.DynamicTexture("skyTex",{width:16,height:256},scene,true);
(function(){
  const c = skyTex.getContext();
  const g = c.createLinearGradient(0,0,0,256);
  g.addColorStop(0,"#4fa3ec"); g.addColorStop(0.55,"#9fd2f5"); g.addColorStop(1,"#eef8ff");
  c.fillStyle=g; c.fillRect(0,0,16,256); skyTex.update();
})();
const skyMat = new BABYLON.StandardMaterial("skyMat",scene);
skyMat.backFaceCulling=false; skyMat.disableLighting=true; skyMat.diffuseTexture=skyTex;
const sky = BABYLON.MeshBuilder.CreateSphere("sky",{diameter:520,segments:16},scene);
sky.material=skyMat; sky.applyFog=false; sky.infiniteDistance=true;
sky.metadata={noshadow:true};

/* ---------- floating island base ---------- */
const ROCK_A='#9c7b5a', ROCK_B='#7d6247', GRASS='#58b368', SAND='#e0c48f';
cyl("grassTop",62,3.2,M(GRASS), 0,-1.6,0,48);
cyl("st1",64,3.0,M(ROCK_A), 0,-3.2,0,48);
cyl("st2",56,4.0,M(ROCK_B), 0,-6.7,0,40);
cyl("st3",44,4.0,M(ROCK_A), 0,-10.7,0,32);
const under = BABYLON.MeshBuilder.CreateCylinder("under",{diameterTop:42,diameterBottom:4,height:16,tessellation:24},scene);
under.position.y=-18.7; under.material=M(ROCK_B); under.receiveShadows=true;
// hanging rocks on the underside cone
for(let i=0;i<11;i++){
  const a=Math.random()*Math.PI*2, y=-11-Math.random()*14;
  const r=21*(y+26.7)/16 + 0.6;
  const rk=sph("hrock"+i, 1.4+Math.random()*2.2, M(i%2?ROCK_A:ROCK_B), Math.cos(a)*r, y, Math.sin(a)*r);
  rk.scaling.y=0.8;
}
// rocky rim at the cliff edge
for(let i=0;i<26;i++){
  const a=Math.random()*Math.PI*2, r=28.6+Math.random()*2.4;
  const rk=sph("erock"+i,(0.8+Math.random()*1.8)*2, M(i%2?'#8a7a63':'#9c8b72'),
               Math.cos(a)*r, -1.2-Math.random()*2.2, Math.sin(a)*r);
  rk.scaling.y=0.72;
}

/* ---------- river ---------- */
const R=[[-26,-15],[-15,-4],[-7,1],[1,6],[9,10],[16,14],[23,19]];
const P3=R.map(([x,z])=>new BABYLON.Vector3(x,0,z));
function riverRibbon(w,y,mat){
  const L=[],Rt=[];
  for(let i=0;i<P3.length;i++){
    const a=P3[Math.max(0,i-1)], b=P3[Math.min(P3.length-1,i+1)];
    let dx=b.x-a.x, dz=b.z-a.z; const l=Math.hypot(dx,dz); dx/=l; dz/=l;
    const px=-dz, pz=dx, hw=w/2;
    L.push(new BABYLON.Vector3(P3[i].x+px*hw,y,P3[i].z+pz*hw));
    Rt.push(new BABYLON.Vector3(P3[i].x-px*hw,y,P3[i].z-pz*hw));
  }
  const m=BABYLON.MeshBuilder.CreateRibbon("rib"+w+y,{pathArray:[L,Rt],sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
  m.material=mat; m.receiveShadows=true; m.metadata={noshadow:true};
  return m;
}
riverRibbon(5.4,0.10,M(SAND)); // sandy banks
const riverTex=new BABYLON.DynamicTexture("rivTex",{width:64,height:64},scene,true);
(function(){
  const c=riverTex.getContext();
  c.fillStyle="#35c3d4"; c.fillRect(0,0,64,64);
  for(let i=0;i<26;i++){
    c.fillStyle=`rgba(255,255,255,${0.12+Math.random()*0.25})`;
    c.fillRect(Math.random()*64, Math.random()*64, 2+Math.random()*10, 1.5+Math.random()*2);
  }
  riverTex.update();
})();
riverTex.wrapU=riverTex.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;
const riverMat=new BABYLON.StandardMaterial("riverMat",scene);
riverMat.diffuseTexture=riverTex; riverMat.diffuseColor=new BABYLON.Color3(0.75,0.98,1);
riverMat.specularColor=new BABYLON.Color3(0.6,0.7,0.7); riverMat.specularPower=128;
riverMat.emissiveColor=new BABYLON.Color3(0.05,0.25,0.28); riverMat.alpha=0.95;
riverRibbon(3.6,0.17,riverMat);

/* ---------- waterfalls ---------- */
const wfTex=new BABYLON.DynamicTexture("wfTex",{width:128,height:256},scene,true);
wfTex.hasAlpha=true; wfTex.wrapU=wfTex.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;
(function(){
  const c=wfTex.getContext();
  c.clearRect(0,0,128,256);
  for(let i=0;i<46;i++){
    const x=Math.random()*128, w=1+Math.random()*3.5, a=0.12+Math.random()*0.5;
    const g=c.createLinearGradient(0,0,0,256);
    g.addColorStop(0,`rgba(255,255,255,${a})`);
    g.addColorStop(0.75,`rgba(210,245,255,${a*0.5})`);
    g.addColorStop(1,"rgba(255,255,255,0)");
    c.fillStyle=g; c.fillRect(x,0,w,256);
  }
  wfTex.update();
})();
const wfMat=new BABYLON.StandardMaterial("wfMat",scene);
wfMat.diffuseTexture=wfTex; wfMat.emissiveTexture=wfTex;
wfMat.emissiveColor=new BABYLON.Color3(1,1,1);
wfMat.useAlphaFromDiffuseTexture=true; wfMat.backFaceCulling=false;
wfMat.specularColor=new BABYLON.Color3(0,0,0);
const mistMat=M('#ffffff',{alpha:0.28}); mistMat.backFaceCulling=false;
const foamMat=M('#f4feff',{emissive:'#cfeef5'});

function waterfall(px,pz,dx,dz,len){
  const pl=BABYLON.MeshBuilder.CreatePlane("wf",{width:5.6,height:len},scene);
  pl.position.set(px+dx*0.6, 0.12-len/2, pz+dz*0.6);
  pl.rotation.y=Math.atan2(dx,dz);
  pl.material=wfMat; pl.metadata={noshadow:true};
  const f=sph("foam",5.4,foamMat,px,0.16,pz); f.scaling.y=0.10; f.metadata={noshadow:true};
  for(let i=1;i<=3;i++){
    const m=sph("mist"+i,1.6+i*1.3,mistMat,px+dx*i*1.6,-2.2-i*3.6,pz+dz*i*1.6);
    m.scaling.y=0.55; m.metadata={noshadow:true};
  }
  sph("lip1",2.2,M(ROCK_A),px-dz*2.2,0.1,pz+dx*2.2).scaling.y=0.6;
  sph("lip2",1.8,M(ROCK_B),px+dz*2.4,0.1,pz-dx*2.4).scaling.y=0.6;
}
(function(){
  const a=P3[0], b=P3[1]; let dx=b.x-a.x, dz=b.z-a.z; const l=Math.hypot(dx,dz);
  waterfall(a.x,a.z,dx/l,dz/l,17);
  const n=P3.length, c=P3[n-2], d=P3[n-1]; let ex=d.x-c.x, ez=d.z-c.z; const l2=Math.hypot(ex,ez);
  waterfall(d.x,d.z,ex/l2,ez/l2,17);
})();

/* ---------- bridges ---------- */
function bridgeAt(i){
  const a=P3[i-1], b=P3[i+1];
  let dx=b.x-a.x, dz=b.z-a.z; const l=Math.hypot(dx,dz); dx/=l; dz/=l;
  const px=-dz, pz=dx;
  const p=new BABYLON.TransformNode("br"+i,scene);
  p.position.set(P3[i].x,0,z=>z,P3[i].z); p.position.set(P3[i].x,0.1,P3[i].z);
  p.rotation.y=Math.atan2(-pz,px);
  const wood=M('#8a5a33'), woodD=M('#6e4526');
  const N=9;
  for(let k=0;k<N;k++){
    const t=k/(N-1), lx=-4.5+t*9, y=0.35+0.85*Math.sin(t*Math.PI);
    box("plank",1.05,0.18,4.8, k%2?wood:woodD, lx,y,0,0,p);
  }
  for(const s of [-1,1]){
    for(let k=0;k<4;k++){
      const t=(k+0.5)/4, lx=-4.5+t*9, y=0.35+0.85*Math.sin(t*Math.PI)+0.8;
      box("rail",2.3,0.12,0.12,woodD, lx,y,s*2.25,0,p);
    }
    for(let k=0;k<=4;k++){
      const t=k/4, lx=-4.5+t*9, y=0.35+0.85*Math.sin(t*Math.PI);
      cyl("rpost",0.13,0.85,woodD, lx,y+0.42,s*2.25,6,p);
    }
  }
}
bridgeAt(2); bridgeAt(4);

/* ---------- castle ---------- */
const flags=[];
(function buildCastle(){
  const stone=M('#a8b0ba'), stoneD=M('#878f99'), roof=M('#b5484d',{noCull:true});
  const wood=M('#6b4a2f'), woodD=M('#54371f'), glass=M('#ffe9a3',{emissive:'#ffc94d'});
  const doorMat=M('#3a3f45'), red=M('#d63c3c',{noCull:true});
  // courtyard
  cyl("court",24,0.12,M(SAND), 0,0.06,-10,28);
  // keep
  box("keep",12,9,10,stone, 0,4.5,-10);
  prism("keepRoof",13.2,3.2,11.2,roof, 0,9,-10);
  box("keepDoor",1.7,2.7,0.5,woodD, 0,1.35,-4.92);
  [-3.6,0,3.6].forEach(x=>{ box("kw1",0.9,1.3,0.15,glass, x,6.2,-4.93); box("kw2",0.9,1.3,0.15,glass, x,3.4,-4.93); });
  box("kw3",0.15,1.3,0.9,glass, -6.03,6.2,-10); box("kw4",0.15,1.3,0.9,glass, 6.03,6.2,-10);
  box("kw5",0.15,1.3,0.9,glass, -6.03,3.4,-13); box("kw6",0.15,1.3,0.9,glass, 6.03,3.4,-13);
  // flag
  cyl("flagpole",0.1,3,M('#555c66'), 0,13.7,-10,8);
  const flag=box("flag",1.7,1,0.06,red, 0.88,14.6,-10); flags.push(flag);
  // corner towers (back)
  [[-13,-18],[13,-18]].forEach(([x,z])=>{
    cyl("tw",5,13,stone, x,6.5,z,20);
    cone("twr",6.2,4.5,roof, x,15.2,z);
    box("tww",0.8,1.2,0.15,glass, x,7.5,z+2.56); box("tww2",0.8,1.2,0.15,glass, x,10.5,z+2.56);
  });
  // walls with battlements
  function wall(cx,cz,len,ry){
    const p=new BABYLON.TransformNode("wall",scene);
    p.position.set(cx,0,cz); p.rotation.y=ry;
    box("w",len,4.5,1.2,stone, 0,2.25,0,0,p);
    const n=Math.floor(len/1.55);
    for(let i=0;i<=n;i++){
      const lx=-len/2+0.8+i*1.55;
      if(lx>len/2-0.6) break;
      box("bat",0.9,0.9,1.35,stoneD, lx,4.95,0,0,p);
    }
    return p;
  }
  wall(0,-18,27,0);
  wall(-7.75,-2,10.5,0); wall(7.75,-2,10.5,0);
  wall(-13,-10,16.4,Math.PI/2); wall(13,-10,16.4,Math.PI/2);
  // gate
  box("gp1",1.4,7,1.8,stone, -3.2,3.5,-2); box("gp2",1.4,7,1.8,stone, 3.2,3.5,-2);
  box("lintel",8,1.5,1.8,stoneD, 0,7.2,-2);
  box("arch",4.6,5.4,0.8,doorMat, 0,2.7,-2);
  box("gateDoor",3.4,4.2,0.5,woodD, 0,2.1,-1.85);
  [[-3.2],[3.2]].forEach(([x])=>{
    cyl("gt",3,9,stone, x,4.5,-2,12);
    cone("gtr",3.9,2.8,roof, x,10.4,-2);
    box("ban",0.9,1.4,0.06,red, x,5.6,-0.42);
  });
  // well in courtyard
  cyl("well",1.8,1,stoneD, -6,0.5,-6,12);
  cyl("wp1",0.15,1.7,wood, -6.8,0.85,-6,6); cyl("wp2",0.15,1.7,wood, -5.2,0.85,-6,6);
  prism("wr",2.2,0.8,0.9,roof, -6,1.75,-6);
})();

/* ---------- village ---------- */
function house(x,z,ry,wallC,roofC,s=1){
  const p=new BABYLON.TransformNode("house",scene);
  p.position.set(x,0,z); p.rotation.y=ry;
  const wall=M(wallC), roof=M(roofC,{noCull:true}), wood=M('#6b4a2f'), glass=M('#ffe9a3',{emissive:'#ffc94d'});
  box("hb",4*s,3*s,3.4*s,wall, 0,1.5*s,0,0,p);
  prism("hr",4.8*s,2*s,4.1*s,roof, 0,3*s,0,0,p);
  box("hd",0.9*s,1.7*s,0.12,wood, 0,0.85*s,1.72*s,0,p);
  box("hw1",0.7*s,0.7*s,0.1,glass, -1.15*s,1.8*s,1.72*s,0,p);
  box("hw2",0.7*s,0.7*s,0.1,glass, 1.15*s,1.6*s,1.72*s,0,p);
  box("hch",0.5*s,1.3*s,0.5*s,M('#8d949c'), 1.2*s,4.3*s,-0.6*s,0,p);
  return p;
}
const wallCols=['#e8b04b','#e07a5f','#81b29a','#f2cc8f','#c9ada7'];
const roofCols=['#b5484d','#7d4f50','#4f6d7a','#a34d43'];
house(-10, 6, 0.4, wallCols[0], roofCols[0]);
house(-4, 11,-0.3, wallCols[1], roofCols[1]);
house( 3, 15, 0.6, wallCols[2], roofCols[2]);
house(12, 4, 1.2, wallCols[3], roofCols[3]);
house(-14,13, 0.9, wallCols[4], roofCols[0]);
house(19,10,-0.8, wallCols[1], roofCols[2]);

/* tavern */
(function tavern(){
  const p=house(-4,19,0.2,'#d99a4e','#8a3b3b',1.45);
  // sign
  const st=new BABYLON.DynamicTexture("sign",{width:256,height:128},scene,true);
  const c=st.getContext();
  c.fillStyle="#5c3d24"; c.fillRect(0,0,256,128);
  c.strokeStyle="#f2d38a"; c.lineWidth=8; c.strokeRect(6,6,244,116);
  c.fillStyle="#f2d38a"; c.font="bold 46px Georgia"; c.textAlign="center"; c.textBaseline="middle";
  c.fillText("TAVERN",128,66); st.update();
  const sm=new BABYLON.StandardMaterial("signMat",scene);
  sm.diffuseTexture=st; sm.emissiveTexture=st; sm.emissiveColor=new BABYLON.Color3(0.6,0.5,0.3);
  sm.specularColor=new BABYLON.Color3(0,0,0); sm.backFaceCulling=false;
  cyl("sp1",0.1,1.7,M('#6b4a2f'), -0.9,0.85,2.6,6,p);
  cyl("sp2",0.1,1.7,M('#6b4a2f'),  0.9,0.85,2.6,6,p);
  const bd=box("signboard",2.1,1.05,0.1,sm, 0,1.9,2.62,0,p);
  // barrels
  cyl("bar1",1.1,1.2,M('#7a4f2a'), 3.1,0.6,1.6,10,p);
  cyl("bar2",0.9,1.0,M('#8a5a33'), 3.6,0.5,2.6,10,p);
})();

/* market stalls */
function stripeTex(c1,c2){
  const t=new BABYLON.DynamicTexture("st"+c1, {width:64,height:64}, scene, true);
  const c=t.getContext();
  c.fillStyle=c1; c.fillRect(0,0,64,64);
  c.fillStyle=c2; for(let x=0;x<64;x+=16) c.fillRect(x,0,8,64);
  t.update(); t.wrapU=t.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;
  return t;
}
function stall(x,z,ry,cA,cB){
  const p=new BABYLON.TransformNode("stall",scene);
  p.position.set(x,0,z); p.rotation.y=ry;
  const wood=M('#8a5a33');
  [[-1.2,-0.7],[1.2,-0.7],[-1.2,0.7],[1.2,0.7]].forEach(([px,pz])=>cyl("post",0.16,2.3,wood,px,1.15,pz,8,p));
  box("counter",2.6,0.9,1.5,wood, 0,0.45,0,0,p);
  const am=new BABYLON.StandardMaterial("awn"+x,scene);
  am.diffuseTexture=stripeTex(cA,cB); am.specularColor=new BABYLON.Color3(0,0,0); am.backFaceCulling=false;
  const awn=box("awn",3.3,0.12,2.0,am, 0,2.42,0,0,p); awn.rotation.x=-0.42;
  const apple=M('#e04b3a'), bread=M('#d9a05b');
  for(let i=0;i<5;i++) sph("ap",0.24,apple, -0.8+i*0.4,1.05,0.1+ (i%2)*0.15, p);
  box("brd",0.5,0.25,0.35,bread, 0.9,1.05,0.2,0.3,p);
  box("crate",0.6,0.5,0.6,wood, -1.7,0.25,1.2,0.4,p);
  box("crate2",0.5,0.4,0.5,wood, 1.8,0.2,-1.3,-0.3,p);
}
stall( 6,17, 0.3,'#e63946','#f8f4e3');
stall(-6,16,-0.5,'#457b9d','#f1faee');
stall( 4,21,-0.2,'#e9c46a','#5c3d24');

  wheel=new BABYLON.TransformNode("wheel",scene);

  const rim=cyl("rim",5.6,0.35,M('#6b4a2f'), 0,0,0,14); rim.rotation.z=Math.PI/2; rim.parent=wheel;
  const hub=cyl("hub",0.7,0.5,M('#54371f'), 0,0,0,10); hub.rotation.z=Math.PI/2; hub.parent=wheel;

    const a=i/8*Math.PI*2;

  }
  const ax=cyl("axle",0.32,3.6,M('#54371f'), -1.1,0,0,8); ax.rotation.z=Math.PI/2; ax.parent=wheel;
})();

const sandM=M(SAND);
box("road1",3,0.12,12, sandM, 0,0.07,3);

[[1.9,1],[-1.9,1],[1.9,6.5],[-1.9,6.5]].forEach(([x,z],i)=>{

/* ---------- trees, grass tufts, flowers ---------- */
function dSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az;
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(pz-az)*dz)/(dx*dx+dz*dz)));
  return Math.hypot(px-(ax+dx*t), pz-(az+dz*t));
}
function clearSpot(x,z,riverClear){
  if(Math.hypot(x, z+10) < 14.5) return false;                 // castle
  if(x>-16 && x<21 && z>3 && z<22) return false;                 // village green
  if(Math.hypot(x-13, z-13.5) < 6.5) return false;               // mill
  if(Math.hypot(x-20, z-16) < 6.5) return false;                 // watchtower
  for(let i=0;i<R.length-1;i++)
    if(dSeg(x,z,R[i][0],R[i][1],R[i+1][0],R[i+1][1]) < riverClear) return false;
  return Math.hypot(x,z) < 27.5;
}
function pine(x,z,s){
  s = s || (0.8+Math.random()*0.7);
  const g = ['#3e8e4f','#57a65a','#2f7a44'][Math.floor(Math.random()*3)];
  cyl("trunk",0.34*s,1.7*s,M('#6e4a2c'), x,0.85*s,z,7);
  cone("f1",2.7*s,2.5*s,M(g), x,2.3*s,z);
  cone("f2",2.1*s,2.1*s,M(g), x,3.4*s,z);
  cone("f3",1.5*s,1.9*s,M(g), x,4.3*s,z);
}
for(let i=0;i<24;i++){
  const a=Math.random()*Math.PI*2, r=6+Math.random()*20;
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(clearSpot(x,z,4.2)) pine(x,z);
}
pine(-24,-8,1.5); pine(26,-12,1.3); pine(-20,20,1.2);
const tuftM=M('#4aa34a');
for(let i=0;i<55;i++){
  const a=Math.random()*Math.PI*2, r=Math.random()*26;
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(clearSpot(x,z,2.6)) cone("tuft"+i,0.3,0.55,tuftM, x,0.27,z);
}
const fl1=M('#ff7bac',{emissive:'#d14f86'}), fl2=M('#ffd166',{emissive:'#e0a92e'});
for(let i=0;i<30;i++){
  const a=Math.random()*Math.PI*2, r=Math.random()*25;
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(clearSpot(x,z,2.6)) sph("fl"+i,0.16, i%2?fl1:fl2, x,0.14,z);
}

/* ---------- clouds ---------- */
const clouds=[];
const cloudMat=M('#ffffff');
cloudMat.specularColor=new BABYLON.Color3(0,0,0);
function cloud(x,y,z,s){
  const g=new BABYLON.TransformNode("cloud",scene);
  g.position.set(x,y,z);
  [[0,0,0,2.3],[1.9,0.2,0.3,1.6],[-1.8,0.1,-0.2,1.5],[0.4,0.6,-0.4,1.4]].forEach(([px,py,pz,r])=>{
    const m=sph("cs",r*2,cloudMat,px,py,pz,g); m.scaling.y=0.45; m.metadata={noshadow:true};
  });
  clouds.push(g);
}
cloud(-32,21,8,1.2); cloud(14,25,-26,1.5); cloud(36,19,-6,1.0);
cloud(-8,27,32,1.3); cloud(46,23,22,1.1); cloud(-48,22,-16,1.4);

/* ---------- shadow casters ---------- */
scene.meshes.forEach(m=>{
  if(m.metadata && m.metadata.noshadow) return;
  try{ sg.addShadowCaster(m); }catch(e){}
});

/* ---------- animation ---------- */
let T=0;
scene.registerBeforeRender(()=>{
  const dt=engine.getDeltaTime(); T+=dt;
  riverTex.vOffset -= dt*0.00045;
  wfTex.vOffset    -= dt*0.0011;
  if(wheel) wheel.rotation.x += dt*0.0011;
  flags.forEach((f,i)=>{ f.rotation.y = Math.sin(T*2.2+i*2)*0.45; });
  clouds.forEach((c,i)=>{
    c.position.x += dt*0.0016*(1+(i%3)*0.4);
    if(c.position.x>78) c.position.x=-78;
  });
  sky.position.copyFrom(camera.position);
});

/* ---------- run ---------- */
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
})();
