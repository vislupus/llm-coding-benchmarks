<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floating Island Diorama</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0.8, 0.9, 1.0);

        // Camera
        const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 4, Math.PI / 3, 70, new BABYLON.Vector3(0, 20, 0), scene);
        camera.attachControl(canvas, true);

        // Lighting
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;

        // Ground (floating island)
        const island = BABYLON.MeshBuilder.CreateGround("island", {width: 60, height: 60}, scene);
        const islandMaterial = new BABYLON.StandardMaterial("islandMaterial", scene);
        islandMaterial.diffuseColor = new BABYLON.Color3(0.5, 0.8, 0.5);
        island.material = islandMaterial;
        island.position.y = 0;

        // Castle
        const castle = BABYLON.MeshBuilder.CreateBox("castle", {width: 10, height: 15, depth: 10}, scene);
        const castleMaterial = new BABYLON.StandardMaterial("castleMaterial", scene);
        castleMaterial.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
        castle.material = castleMaterial;
        castle.position.y = 7.5;

        // Village houses
        for (let i = 0; i < 5; i++) {
            const house = BABYLON.MeshBuilder.CreateBox(`house${i}`, {width: 4, height: 4, depth: 4}, scene);
            const houseMaterial = new BABYLON.StandardMaterial(`houseMaterial${i}`, scene);
            houseMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.4, 0.1);
            house.material = houseMaterial;
            house.position = new BABYLON.Vector3(Math.random() * 20 - 10, 2, Math.random() * 20 - 10);
        }

        // Trees
        for (let i = 0; i < 10; i++) {
            const tree = BABYLON.MeshBuilder.CreateCylinder(`tree${i}`, {diameterTop: 0, height: 6, diameterBottom: 1}, scene);
            const treeMaterial = new BABYLON.StandardMaterial(`treeMaterial${i}`, scene);
            treeMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.5, 0.3);
            tree.material = treeMaterial;
            tree.position = new BABYLON.Vector3(Math.random() * 30 - 15, 3, Math.random() * 30 - 15);
        }

        // River
        const river = BABYLON.MeshBuilder.CreateGround("river", {width: 5, height: 60}, scene);
        const riverMaterial = new BABYLON.StandardMaterial("riverMaterial", scene);
        riverMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.8);
        river.material = riverMaterial;
        river.position.y = 0.1;
        river.position.x = 10;

        return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());

    window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
