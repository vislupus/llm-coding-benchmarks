<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highmoor — a floating isle in miniature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,800;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22304d;
    --ink-soft: #4d5b7a;
    --glass: rgba(255, 252, 244, 0.72);
    --glass-edge: rgba(255, 255, 255, 0.9);
    --river: #1fa89f;
    --river-ink: #ffffff;
    --shadow: 0 10px 30px -12px rgba(30, 44, 80, 0.45);
    --sky-top: #8ecdf0;
    --sky-low: #fde2c2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f2ecdc;
      --ink-soft: #c3c9dc;
      --glass: rgba(26, 32, 54, 0.66);
      --glass-edge: rgba(255, 255, 255, 0.14);
      --river: #3fd3c9;
      --river-ink: #0e1d2a;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
    }
  }
  :root[data-theme="dark"] {
    --ink: #f2ecdc;
    --ink-soft: #c3c9dc;
    --glass: rgba(26, 32, 54, 0.66);
    --glass-edge: rgba(255, 255, 255, 0.14);
    --river: #3fd3c9;
    --river-ink: #0e1d2a;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-low));
    color: var(--ink);
    font-family: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; outline: none; touch-action: none;
  }
  .title {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: calc(22px + env(safe-area-inset-left, 0px));
    margin: 0;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35), 0 6px 22px rgba(30, 50, 90, 0.25);
  }
  .title h1 {
    margin: 0;
    font-family: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 800;
    font-size: clamp(2rem, 4.2vw, 3.3rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: #1d2a47;
  }
  .title p {
    margin: 0.35rem 0 0 0.1rem;
    font-family: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    color: #34466e;
  }
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
  }
  .dock button {
    font: 500 0.98rem/1 "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .dock button:hover { background: rgba(127, 140, 170, 0.16); }
  .dock button:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
  .dock button[aria-pressed="true"] { background: var(--river); color: var(--river-ink); }
  .dock .dot {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid currentColor; display: inline-block;
  }
  .dock button[aria-pressed="true"] .dot { background: currentColor; }
  .hint {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right, 0px));
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    margin: 0;
    font-size: 0.9rem;
    color: #3c4c70;
    opacity: 0.85;
    pointer-events: none;
    max-width: 16rem;
    text-align: right;
    line-height: 1.35;
  }
  #loader {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-low));
    transition: opacity 0.9s ease;
    z-index: 5;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .box { text-align: center; color: #22304d; }
  #loader .isle {
    width: 64px; height: 64px; margin: 0 auto 14px;
    animation: bob 2.4s ease-in-out infinite;
  }
  #loader .label {
    font-family: "Alegreya", Georgia, serif; font-style: italic; font-size: 1.15rem;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (max-width: 640px) {
    .hint { display: none; }
    .dock button { padding: 10px 12px; font-size: 0.92rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loader .isle { animation: none; }
    #loader { transition: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.28.0/babylon.js"></script>
</head>
<body>
<canvas id="scene" aria-label="3D diorama of a floating island with a medieval castle and village"></canvas>

<div class="title">
  <h1>Highmoor</h1>
  <p>a floating isle, in miniature</p>
</div>

<div class="dock" role="toolbar" aria-label="View controls">
  <button id="btnOrbit" type="button" aria-pressed="true"><span class="dot"></span>Slow orbit</button>
  <button id="btnTilt" type="button" aria-pressed="true"><span class="dot"></span>Tilt-shift</button>
  <button id="btnReset" type="button">Reset view</button>
</div>

<p class="hint">Drag to orbit, scroll to zoom, right-drag to pan. Look underneath, too.</p>

<div id="loader" role="status" aria-live="polite">
  <div class="box">
    <svg class="isle" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 30 Q32 22 56 30 L44 40 L36 58 L28 44 L18 40 Z" fill="#9b8470"/>
      <path d="M8 30 Q32 22 56 30 Q32 35 8 30Z" fill="#6cc04a"/>
      <rect x="27" y="14" width="10" height="13" fill="#d9d2c3"/>
      <path d="M25 15 L32 6 L39 15Z" fill="#4f73b8"/>
    </svg>
    <div class="label" id="loadLabel">Raising the island…</div>
  </div>
</div>

<script>
"use strict";
(async function () {
  const loadLabel = document.getElementById("loadLabel");
  const loader = document.getElementById("loader");
  const say = async (t) => { loadLabel.textContent = t; await new Promise(r => setTimeout(r, 16)); };

  if (typeof BABYLON === "undefined") {
    loadLabel.textContent = "Babylon.js did not load. Check your connection and reload the page.";
    return;
  }
  const B = BABYLON;
  const canvas = document.getElementById("scene");
  let engine;
  try {
    engine = new B.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: true, antialias: true }, true);
  } catch (e) {
    loadLabel.textContent = "This browser can't run WebGL. Try a recent Chrome, Edge, Firefox or Safari.";
    return;
  }
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
  engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const scene = new B.Scene(engine);
  scene.clearColor = new B.Color4(0.72, 0.85, 0.94, 1);
  scene.ambientColor = new B.Color3(0.25, 0.25, 0.3);

  // ---------------------------------------------------------------- utilities
  const V3 = (x, y, z) => new B.Vector3(x, y, z);
  const C3 = (h) => B.Color3.FromHexString(h);
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rand = mulberry32(20260924);
  const R = (a, b) => a + (b - a) * rand();
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;

  // Perlin noise (seeded)
  const perm = new Uint8Array(512);
  { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  function grad(h, x, y, z) { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
  function noise3(x, y, z) {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    const X = fx & 255, Y = fy & 255, Z = fz & 255; x -= fx; y -= fy; z -= fz;
    const u = fade(x), v = fade(y), w = fade(z);
    const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, Bq = perm[X + 1] + Y, BA = perm[Bq] + Z, BB = perm[Bq + 1] + Z;
    return mix(mix(mix(grad(perm[AA] & 15, x, y, z), grad(perm[BA] & 15, x - 1, y, z), u), mix(grad(perm[AB] & 15, x, y - 1, z), grad(perm[BB] & 15, x - 1, y - 1, z), u), v),
      mix(mix(grad(perm[AA + 1] & 15, x, y, z - 1), grad(perm[BA + 1] & 15, x - 1, y, z - 1), u), mix(grad(perm[AB + 1] & 15, x, y - 1, z - 1), grad(perm[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  }
  function fbm(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s; }

  // Matrix helper: local transform
  const Mx = (x, y, z, ry = 0, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0) =>
    B.Matrix.Compose(V3(sx, sy, sz), B.Quaternion.RotationYawPitchRoll(ry, rx, rz), V3(x, y, z));
  const yawZ = (dx, dz) => Math.atan2(dx, dz);   // aligns local +z with (dx,dz)
  const yawX = (dx, dz) => Math.atan2(-dz, dx);  // aligns local +x with (dx,dz)

  // Geometry batcher: merges many primitives into one vertex-coloured mesh
  class Batch {
    constructor() { this.p = []; this.n = []; this.c = []; this.u = []; this.i = []; }
    add(vd, m, col, jit = 0.06, vnoise = 0.05, alpha = 1) {
      if (m) vd.transform(m);
      const base = this.p.length / 3, pos = vd.positions, nor = vd.normals, uv = vd.uvs;
      const cnt = pos.length / 3;
      const f = 1 + (rand() * 2 - 1) * jit;
      for (let k = 0; k < cnt; k++) {
        const x = pos[k * 3], y = pos[k * 3 + 1], z = pos[k * 3 + 2];
        this.p.push(x, y, z); this.n.push(nor[k * 3], nor[k * 3 + 1], nor[k * 3 + 2]);
        this.u.push(uv ? uv[k * 2] : 0, uv ? uv[k * 2 + 1] : 0);
        const g = f * (1 + vnoise * noise3(x * 1.7 + 11.3, y * 1.7, z * 1.7));
        this.c.push(Math.min(1, col.r * g), Math.min(1, col.g * g), Math.min(1, col.b * g), alpha);
      }
      const idx = vd.indices;
      for (let k = 0; k < idx.length; k++) this.i.push(idx[k] + base);
      return this;
    }
    build(name, mat, parent) {
      const mesh = new B.Mesh(name, scene);
      if (!this.p.length) return mesh;
      const vd = new B.VertexData();
      vd.positions = this.p; vd.normals = this.n; vd.colors = this.c; vd.uvs = this.u; vd.indices = this.i;
      vd.applyToMesh(mesh);
      mesh.material = mat;
      if (parent) mesh.parent = parent;
      return mesh;
    }
  }

  const G = {
    box: (w, h, d) => B.VertexData.CreateBox({ width: w, height: h, depth: d }),
    cyl: (h, dt, db, t = 16, sub = 1) => B.VertexData.CreateCylinder({ height: h, diameterTop: dt, diameterBottom: db, tessellation: t, subdivisions: sub }),
    sph: (d, s = 10) => B.VertexData.CreateSphere({ diameter: d, segments: s }),
    ico: (r, sub = 2, flat = true) => B.VertexData.CreateIcoSphere({ radius: r, subdivisions: sub, flat }),
    torus: (d, th, t = 32) => B.VertexData.CreateTorus({ diameter: d, thickness: th, tessellation: t }),
  };
  // Lumpy faceted rock
  function rockVD(r, sub = 2, lump = 0.28, seed = rand() * 100) {
    const vd = G.ico(r, sub, true);
    const p = vd.positions;
    for (let k = 0; k < p.length; k += 3) {
      const x = p[k], y = p[k + 1], z = p[k + 2];
      const n = 1 + lump * noise3(x / r * 1.3 + seed, y / r * 1.3, z / r * 1.3);
      p[k] = x * n; p[k + 1] = y * n; p[k + 2] = z * n;
    }
    B.VertexData.ComputeNormals(p, vd.indices, vd.normals);
    return vd;
  }
  // Convex solid from faces (flat shaded, outward normals)
  function solidFromFaces(faces) {
    const pos = [], idx = [], nor = [];
    const cen = V3(0, 0, 0); let cn = 0;
    faces.forEach(f => f.forEach(p => { cen.addInPlace(p); cn++; })); cen.scaleInPlace(1 / cn);
    faces.forEach(f => {
      const fc = V3(0, 0, 0); f.forEach(p => fc.addInPlace(p)); fc.scaleInPlace(1 / f.length);
      let n = B.Vector3.Cross(f[0].subtract(f[1]), f[2].subtract(f[1]));
      let pts = f;
      if (B.Vector3.Dot(n, fc.subtract(cen)) < 0) { pts = [...f].reverse(); n = n.scale(-1); }
      n.normalize();
      const base = pos.length / 3;
      pts.forEach(p => { pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); });
      for (let k = 1; k < pts.length - 1; k++) idx.push(base, base + k, base + k + 1);
    });
    const vd = new B.VertexData(); vd.positions = pos; vd.indices = idx; vd.normals = nor;
    // make sure the winding agrees with Babylon's own normal convention
    const test = []; B.VertexData.ComputeNormals(pos, idx, test);
    if (test[0] * nor[0] + test[1] * nor[1] + test[2] * nor[2] < 0) {
      for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t; }
    }
    return vd;
  }
  // Triangular prism: triangle in local ZY (width w along z, height h), extruded along x (length l)
  function gableVD(w, h, l) {
    const a = [], b = [];
    for (const x of [-l / 2, l / 2]) { const s = [V3(x, 0, -w / 2), V3(x, 0, w / 2), V3(x, h, 0)]; (x < 0 ? a : b).push(...s); }
    return solidFromFaces([
      a, b,
      [a[0], a[1], b[1], b[0]],
      [a[1], a[2], b[2], b[1]],
      [a[2], a[0], b[0], b[2]],
    ]);
  }
  function fixWinding(pos, idx, expect) {
    const nor = []; B.VertexData.ComputeNormals(pos, idx, nor);
    let s = 0; for (let k = 0; k < nor.length; k += 3) s += nor[k] * expect.x + nor[k + 1] * expect.y + nor[k + 2] * expect.z;
    if (s < 0) { for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t; } B.VertexData.ComputeNormals(pos, idx, nor); }
    return nor;
  }

  // ---------------------------------------------------------------- the land plan
  const WATER_Y = -0.2;
  const RW = 1.8;
  const SQUARE = [15.5, 1];
  const POND = [-12, 14], POND_R = 3.4;
  const CASTLE_Y = 4.1;

  function catmull(pts, seg) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let s = 0; s < seg; s++) {
        const t = s / seg, t2 = t * t, t3 = t2 * t;
        const f = (k) => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
        out.push([f(0), f(1)]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  function mkPoly(pts) {
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
    pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); z0 = Math.min(z0, p[1]); z1 = Math.max(z1, p[1]); });
    return { pts, x0, x1, z0, z1 };
  }
  function polyDist(px, pz, poly, pad = 8) {
    if (px < poly.x0 - pad || px > poly.x1 + pad || pz < poly.z0 - pad || pz > poly.z1 + pad) return 99;
    let d = 1e9; const P = poly.pts;
    for (let i = 0; i < P.length - 1; i++) {
      const ax = P[i][0], az = P[i][1], dx = P[i + 1][0] - ax, dz = P[i + 1][1] - az;
      const l = dx * dx + dz * dz; let t = l ? ((px - ax) * dx + (pz - az) * dz) / l : 0; t = clamp(t);
      const qx = ax + dx * t - px, qz = az + dz * t - pz; const dd = qx * qx + qz * qz; if (dd < d) d = dd;
    }
    return Math.sqrt(d);
  }

  const RIVER_MAIN = mkPoly(catmull([[-12, 14], [-16, 9], [-18, 3], [-17.2, -4], [-13.5, -10], [-7, -14.5], [0, -17], [7, -17.6], [13, -16.2], [19, -15], [25.5, -15.6], [33, -17]], 10));
  const RIVER_NW = mkPoly(catmull([[-12, 14], [-14.2, 17.5], [-17, 20.2], [-21, 23.5], [-26, 27]], 10));
  const RIVERS = [RIVER_MAIN, RIVER_NW];
  const PATHS = [
    mkPoly([[11.6, 0], [SQUARE[0], SQUARE[1]]]),
    mkPoly(catmull([[15.5, 1], [13.6, -5], [9.5, -10], [5.6, -14.2], [3.4, -17.4], [1.6, -21], [0.4, -23.2]], 6)),
    mkPoly(catmull([[15.5, 1], [14.8, 7], [11.2, 11.8], [4, 14.8], [-2, 14.8], [-6.5, 10], [-10.6, 5.2], [-11.2, 0], [-13.2, -5], [-15.2, -8.8], [-18.5, -11.6], [-21.5, -11.4]], 6)),
    mkPoly(catmull([[14.8, 7], [16.8, 11.6], [18.4, 15.2]], 6)),
  ];

  function islandR(th) {
    return 27 + 2.2 * Math.sin(3 * th + 0.7) + 1.4 * Math.sin(5 * th + 2.1) + 0.7 * Math.sin(9 * th + 0.3) + 1.1 * noise3(Math.cos(th) * 1.5, Math.sin(th) * 1.5, 3.3);
  }
  const edgeT = (x, z) => Math.hypot(x, z) / islandR(Math.atan2(z, x));
  function waterDist(x, z) {
    let d = Math.max(0, Math.hypot(x - POND[0], z - POND[1]) - POND_R);
    for (const r of RIVERS) d = Math.min(d, polyDist(x, z, r));
    return d;
  }
  function roadDist(x, z) {
    let d = 99;
    for (const p of PATHS) d = Math.min(d, polyDist(x, z, p));
    return d;
  }
  const pathDist = (x, z) => Math.min(roadDist(x, z), Math.max(0, Math.hypot(x - SQUARE[0], z - SQUARE[1]) - 4.4));
  function baseHeight(x, z) {
    const r = Math.hypot(x, z), t = edgeT(x, z);
    let h = 0.35 + 0.7 * fbm(x * 0.07, z * 0.07, 0.5, 4) + 0.12 * noise3(x * 0.4, z * 0.4, 7.1);
    const dv = Math.hypot(x - SQUARE[0], z - SQUARE[1]);
    h = mix(h, 0.45 + 0.08 * noise3(x * 0.2, z * 0.2, 2), smooth(12, 5, dv) * 0.85);
    const hr = r + 1.2 * noise3(x * 0.22, z * 0.22, 4.2) + 0.4 * noise3(x * 0.8, z * 0.8, 9);
    h += 3.6 * smooth(11.6, 7.4, hr);
    h = mix(h, CASTLE_Y, smooth(8.6, 7.0, r));
    h += 1.7 * Math.exp(-((x - 16.5) ** 2 + (z - 17) ** 2) / 26) + 1.3 * Math.exp(-((x + 5) ** 2 + (z - 20.5) ** 2) / 22) + 0.9 * Math.exp(-((x + 21) ** 2 + (z + 3) ** 2) / 30);
    h -= 1.1 * Math.pow(smooth(0.87, 1.0, t), 2);
    return h;
  }
  function terrainInfo(x, z) {
    let h = baseHeight(x, z);
    const dw = waterDist(x, z);

  // Brick wall running along local x, base at y=0
  function brickWall(b, P, len, height, thick, opts = {}) {

        if (opts.skip && opts.skip(cx, y)) continue;
        b.add(G.box(x1 - x0 - 0.05, ch - 0.05, thick + R(-0.03, 0.05)), Mx(cx, y, R(-0.02, 0.02)).multiply(P), pick(cols), 0.07, 0.04);

      const rows = Math.max(3, Math.round(Ls / 0.32));
      for (let k = 0; k < rows; k++) {
        const tt = (k + 0.5) / rows * Ls;
        const p = ridge.add(dir.scale(tt)).add(nrm.scale(0.1 + 0.015 * (k % 2)));
        b.add(G.box(Wd + 0.64, 0.07, Ls / rows + 0.1), Mx(p.x, p.y, p.z, 0, 1, 1, 1, s * ang + R(-0.03, 0.03)).multiply(P), k % 2 ? colA : colB, 0.05, 0.05);
      }
    }
    b.add(G.box(Wd + 0.72, 0.2, 0.26), Mx(0, yt + rh + 0.1, 0).multiply(P), colB.scale(0.8), 0.02);
  }
  function windowAt(b, glow, P, x, y, z, lit, w = 0.46, h = 0.62) {
    b.add(G.box(w + 0.14, h + 0.14, 0.08), Mx(x, y, z).multiply(P), timberDark, 0.05);
    const inner = G.box(w, h, 0.1);
    if (lit) glow.add(inner, Mx(x, y, z + 0.01).multiply(P), C3("#ffc56b"), 0.08, 0);
    else b.add(inner, Mx(x, y, z + 0.01).multiply(P), C3("#2a2f4a"), 0.05);
    b.add(G.box(0.05, h, 0.12), Mx(x, y, z + 0.02).multiply(P), timberDark, 0);
    b.add(G.box(w + 0.24, 0.08, 0.2), Mx(x, y - h / 2 - 0.08, z + 0.06).multiply(P), timber, 0.05);
  }

  const roofPalettes = [
    ["#d65a3c", "#bf4a30"], ["#e37d3f", "#cc6a33"], ["#4f7cc4", "#4169aa"], ["#3f9a7a", "#358468"],
    ["#d8b35d", "#c49e4c"], ["#9c5aa6", "#864b90"], ["#d65a3c", "#b84633"],
  ].map(p => p.map(C3));
  const plasterCols = ["#f5e7c9", "#f0d9ae", "#f3ddd2", "#e9e4d3", "#f2e2b8", "#e7d6f0"].map(C3);

  function house(x, z, yaw, o = {}) {
    const y0 = heightAt(x, z);
    const P = Mx(x, y0, z, yaw);
    const w = o.w || R(2.6, 3.4), d = o.d || R(2.2, 2.8);
    const h1 = o.h1 || R(1.3, 1.6), h2 = o.twoStory === false ? 0 : (o.h2 || R(1.1, 1.4));
    const plaster = o.plaster || pick(plasterCols);
    const roof = o.roof || pick(roofPalettes);
    const jet = h2 ? 0.18 : 0;
    S.add(G.box(w + 0.4, 1.6, d + 0.4), Mx(0, -0.62, 0).multiply(P), pick(stoneCols).scale(0.88), 0.05, 0.08);
    // ground floor: stone or plaster
    const groundStone = o.groundStone ?? rand() < 0.4;
    if (groundStone) brickWall(S, Mx(0, 0.18, d / 2 - 0.2).multiply(P), w, h1, 0.4, { ch: 0.36 }), brickWall(S, Mx(0, 0.18, -d / 2 + 0.2).multiply(P), w, h1, 0.4, { ch: 0.36 }),
      S.add(G.box(w - 0.1, h1, d - 0.2), Mx(0, 0.18 + h1 / 2, 0).multiply(P), plaster, 0.02);
    else S.add(G.box(w, h1, d), Mx(0, 0.18 + h1 / 2, 0).multiply(P), plaster, 0.04, 0.04);
    let top = 0.18 + h1;
    const W2 = w + jet * 2, D2 = d + jet * 2;
    W.add(G.box(w + 0.1 + jet * 2, 0.16, d + 0.1 + jet * 2), Mx(0, top, 0).multiply(P), timber, 0.05);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) W.add(G.box(0.16, h1, 0.16), Mx(sx * w / 2, 0.18 + h1 / 2, sz * d / 2).multiply(P), timber, 0.08);
    if (h2) {
      S.add(G.box(W2, h2, D2), Mx(0, top + 0.08 + h2 / 2, 0).multiply(P), plaster, 0.04, 0.04);
      const yc = top + 0.08 + h2 / 2;
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) W.add(G.box(0.15, h2, 0.15), Mx(sx * W2 / 2, yc, sz * D2 / 2).multiply(P), timber, 0.08);
      for (const sz of [-1, 1]) {
        const zf = sz * (D2 / 2 + 0.02);
        for (const xs of [-W2 / 4, W2 / 4]) W.add(G.box(0.12, h2, 0.08), Mx(xs, yc, zf).multiply(P), timber, 0.05);
        const brace = Math.hypot(W2 / 4, h2) - 0.05, ang = Math.atan2(h2, W2 / 4);
        W.add(G.box(brace, 0.1, 0.07), Mx(-W2 * 0.375, yc, zf, 0, 1, 1, 1, 0, ang).multiply(P), timber, 0.05);
        W.add(G.box(brace, 0.1, 0.07), Mx(W2 * 0.375, yc, zf, 0, 1, 1, 1, 0, -ang).multiply(P), timber, 0.05);
      }
      for (const sx of [-1, 1]) {
        const xf = sx * (W2 / 2 + 0.02);
        W.add(G.box(0.07, 0.1, D2), Mx(xf, yc, 0).multiply(P), timber, 0.05);
      }
      windowAt(W, L, P, 0, yc + 0.05, D2 / 2 + 0.04, rand() < 0.35);
      top += 0.08 + h2;
      W.add(G.box(W2 + 0.08, 0.14, D2 + 0.08), Mx(0, top, 0).multiply(P), timber, 0.05);
    }
    // door + ground windows (front is +z)
    W.add(G.box(0.95, 1.3, 0.1), Mx(-w * 0.18, 0.18 + 0.65, d / 2 + 0.04).multiply(P), timberDark, 0.03);
    W.add(G.box(0.72, 1.14, 0.1), Mx(-w * 0.18, 0.18 + 0.6, d / 2 + 0.07).multiply(P), C3("#8a5a34"), 0.08);
    W.add(G.sph(0.08, 6), Mx(-w * 0.18 + 0.22, 0.18 + 0.6, d / 2 + 0.13).multiply(P), C3("#e0b64a"), 0);
    windowAt(W, L, P, w * 0.24, 0.18 + h1 * 0.58, d / 2 + 0.04, rand() < 0.3, 0.5, 0.5);
    windowAt(W, L, P, 0, 0.18 + h1 * 0.58, -d / 2 - 0.04, false, 0.5, 0.5);
    // flower box
    for (let k = 0; k < 4; k++) F.add(G.sph(0.16, 6), Mx(w * 0.24 - 0.2 + k * 0.13, 0.18 + h1 * 0.58 - 0.3, d / 2 + 0.2).multiply(P), C3(pick(["#e8505b", "#ffd166", "#ff8fb1", "#f8f4ff"])), 0.05, 0);
    const rh = D2 * R(0.48, 0.62);
    gableRoof(W, P, W2, D2, top, rh, roof[0], roof[1], plaster);
    if (o.chimney ?? rand() < 0.7) {
      const cx = W2 / 2 - 0.55, cz = -D2 * 0.2;
      const ch = rh * 0.9 + 0.9;
      S.add(G.box(0.5, ch, 0.5), Mx(cx, top + ch / 2, cz).multiply(P), pick(stoneCols).scale(0.92), 0.05, 0.1);
      S.add(G.box(0.62, 0.14, 0.62), Mx(cx, top + ch, cz).multiply(P), pick(stoneCols).scale(0.85), 0.05);
      chimneys.push(B.Vector3.TransformCoordinates(V3(cx, top + ch + 0.15, cz), P));
    }
    return { P, top, w, d, y0 };
  }

  function barrel(b, x, z, y, s = 1) {
    const P = Mx(x, y, z, R(0, TAU), s, s, s);
    b.add(G.cyl(0.9, 0.56, 0.56, 16), Mx(0, 0.45, 0).multiply(P), C3("#9a6a3c"), 0.08);
    b.add(G.sph(0.66, 12), Mx(0, 0.45, 0, 0, 1, 1.25, 1).multiply(P), C3("#9a6a3c"), 0.08);
    for (const yy of [0.18, 0.72]) b.add(G.torus(0.62, 0.05, 20), Mx(0, yy, 0).multiply(P), C3("#4a4a55"), 0.02);
  }
  function crate(b, x, z, y, s = 0.6) {
    const P = Mx(x, y + s / 2, z, R(0, TAU));
    b.add(G.box(s, s, s), P, C3("#c28e53"), 0.1);
    for (const sy of [-1, 1]) b.add(G.box(s + 0.04, 0.08, s + 0.04), Mx(0, sy * (s / 2 - 0.05), 0).multiply(P), C3("#8b5e34"), 0.05);
  }
  function haystack(b, x, z) {
    const y = heightAt(x, z);
    b.add(G.cyl(0.9, 1.5, 1.6, 18), Mx(x, y + 0.4, z), C3("#e5c15a"), 0.06, 0.12);
    b.add(G.sph(1.55, 14), Mx(x, y + 0.85, z, 0, 1, 0.75, 1), C3("#ecca63"), 0.06, 0.12);
  }
  function lamp(x, z, y, h = 1.6) {
    W.add(G.cyl(h, 0.1, 0.14, 8), Mx(x, y + h / 2, z), C3("#3a3440"), 0.02);
    W.add(G.box(0.34, 0.08, 0.34), Mx(x, y + h + 0.02, z), C3("#3a3440"), 0.02);
    L.add(G.box(0.24, 0.3, 0.24), Mx(x, y + h + 0.2, z), C3("#ffcf73"), 0, 0);
    W.add(G.cyl(0.22, 0.02, 0.4, 4), Mx(x, y + h + 0.45, z, Math.PI / 4), C3("#3a3440"), 0.02);
  }

  // ---------------------------------------------------------------- castle
  await say("Stacking the castle stones…");
  const castleP = Mx(0, CASTLE_Y, 0);
  const blueRoof = [C3("#4d73c2"), C3("#3d5fa6")];
  const TOWER_R = 1.3, RING = 6.0, WALL_H = 3.9, TOWER_H = 7.2;
  const towerAngles = [30, 90, 150, 210, 270, 330].map(a => a * Math.PI / 180);
  const towerPos = towerAngles.map(a => [Math.cos(a) * RING, Math.sin(a) * RING]);
  // courtyard floor
  S.add(G.cyl(0.2, RING * 2 - 0.4, RING * 2 - 0.2, 48), Mx(0, 0.02, 0).multiply(castleP), C3("#c9b99a"), 0.02, 0.12);
  for (let k = 0; k < 220; k++) {
    const a = rand() * TAU, r = Math.sqrt(rand()) * (RING - 1.2);
    S.add(G.box(R(0.3, 0.5), 0.08, R(0.25, 0.4)), Mx(Math.cos(a) * r, 0.14, Math.sin(a) * r, R(0, TAU)).multiply(castleP), pick(stoneCols).scale(0.92), 0.08);
  }
  towerPos.forEach(([tx, tz], i) => {
    const P = Mx(tx, 0, tz).multiply(castleP);
    S.add(G.cyl(4.2, 2 * TOWER_R + 0.2, 2 * TOWER_R + 1.2, 28), Mx(0, -2.0, 0).multiply(P), C3("#b3a68f"), 0.03, 0.1);
    const hgt = TOWER_H + (i % 2 ? 0.8 : 0);
    brickTower(S, P, TOWER_R, hgt);
    S.add(G.cyl(0.4, 2 * (TOWER_R + 0.32), 2 * (TOWER_R + 0.02), 28), Mx(0, hgt + 0.18, 0).multiply(P), pick(stoneCols), 0.02);
    const nm = 10;
    for (let k = 0; k < nm; k++) { const a = k / nm * TAU; S.add(G.box(0.48, 0.55, 0.32), Mx(Math.cos(a) * (TOWER_R + 0.12), hgt + 0.66, Math.sin(a) * (TOWER_R + 0.12), yawZ(Math.cos(a), Math.sin(a))).multiply(P), pick(stoneCols), 0.06); }
    for (let k = 0; k < 3; k++) { const a = (k / 3 + 0.1) * TAU + i; windowAt(S, L, Mx(Math.cos(a) * TOWER_R, 0, Math.sin(a) * TOWER_R, yawZ(Math.cos(a), Math.sin(a))).multiply(P), 0, 3.2 + k * 1.1, 0.02, rand() < 0.4, 0.28, 0.6); }
    if (i !== 2) {
      coneRoof(W, P, TOWER_R + 0.5, 3.6 + (i % 2) * 0.6, hgt + 0.35, blueRoof[0], blueRoof[1], 8);
      W.add(G.sph(0.24, 10), Mx(0, hgt + 4.1 + (i % 2) * 0.6, 0).multiply(P), C3("#f2c14e"), 0);
      flagSpots.push({ P, y: hgt + 4.2 + (i % 2) * 0.6, col: i % 2 ? "#e0473e" : "#f2c14e" });
    } else {
      S.add(G.cyl(0.3, 2 * TOWER_R, 2 * TOWER_R, 24), Mx(0, hgt + 0.3, 0).multiply(P), C3("#9c907c"), 0.02);
      flagSpots.push({ P, y: hgt + 0.3, col: "#3f6fd1", tall: true });
    }
  });
  // curtain walls
  for (let i = 0; i < 6; i++) {
    const a = towerPos[i], b = towerPos[(i + 1) % 6];
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const isGate = i === 5; // between 330° and 30° → +x
    const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz) - TOWER_R * 1.4;
    const yaw = yawX(dx, dz);
    const P = Mx(mid[0], 0, mid[1], yaw).multiply(castleP);
    const lz = V3(Math.sin(yaw), 0, Math.cos(yaw));
    const outSign = (lz.x * mid[0] + lz.z * mid[1]) > 0 ? 1 : -1;
    S.add(G.box(len + 0.6, 4.2, 1.6), Mx(0, -2.05, outSign * 0.1).multiply(P), C3("#b3a68f"), 0.03, 0.1);
    if (isGate) continue;
    brickWall(S, P, len, WALL_H, 1.0);
    merlons(S, P, len, WALL_H, outSign * 0.36);
    S.add(G.box(len, 0.16, 0.8), Mx(0, WALL_H - 0.08, -outSign * 0.15).multiply(P), C3("#b8ad98"), 0.02);
  }
  // gatehouse at +x
  {
    const gx = RING * Math.cos(Math.PI / 6);
    const P = Mx(gx, 0, 0).multiply(castleP);
    const GD = 2.6, GW = 3.2, GH = 5.4;
    const archSkip = (cx, y) => Math.abs(cx) < 0.8 && y < 2.3;
    for (const sx of [1, -1]) brickWall(S, Mx(sx * (GD / 2 - 0.25), 0, 0, Math.PI / 2).multiply(P), GW, GH, 0.5, { skip: archSkip });
    for (const sz of [1, -1]) brickWall(S, Mx(0, 0, sz * (GW / 2 - 0.25)).multiply(P), GD, GH, 0.5);
    S.add(G.box(GD - 0.8, 0.3, 1.6), Mx(0, 2.45, 0).multiply(P), mortar, 0.02);
    // arch
    S.add(G.box(GD + 0.1, 0.34, 1.9), Mx(0, 2.45, 0).multiply(P), pick(stoneCols), 0.03);
    W.add(G.box(0.12, 2.1, 1.5), Mx(0.2, 1.05, 0).multiply(P), C3("#6e4527"), 0.05);
    for (let k = -3; k <= 3; k++) W.add(G.box(0.06, 2.1, 0.07), Mx(GD / 2 - 0.08, 1.05, k * 0.2).multiply(P), C3("#3b3a44"), 0);
    for (let k = 1; k <= 4; k++) W.add(G.box(0.06, 0.06, 1.5), Mx(GD / 2 - 0.08, k * 0.45, 0).multiply(P), C3("#3b3a44"), 0);
    S.add(G.box(GD + 0.2, 0.3, GW + 0.2), Mx(0, GH + 0.1, 0).multiply(P), pick(stoneCols), 0.02);
    for (const sz of [1, -1]) merlons(S, Mx(0, 0, 0).multiply(P), GD, GH + 0.25, sz * (GW / 2 - 0.1), 0.7);
    for (const sx of [1, -1]) merlons(S, Mx(0, 0, 0, Math.PI / 2).multiply(P), GW, GH + 0.25, sx * (GD / 2 - 0.1), 0.7);
    windowAt(S, L, Mx(GD / 2 + 0.02, 0, 0, Math.PI / 2).multiply(P), 0, 3.9, 0, true, 0.4, 0.7);
    flagSpots.push({ P: Mx(0, 0, GW / 2 - 0.3).multiply(P), y: GH + 0.3, col: "#e0473e", small: true });
    flagSpots.push({ P: Mx(0, 0, -GW / 2 + 0.3).multiply(P), y: GH + 0.3, col: "#e0473e", small: true });
    // grand stair down to the village road
    const x0 = gx + GD / 2 + 0.1, x1 = 11.8, steps = 14;
    const yEnd = heightAt(x1 + 0.3, 0) + 0.12;
    for (let k = 0; k < steps; k++) {
      const t = k / (steps - 1), sx = mix(x0, x1, t);
      const yTop = Math.max(mix(CASTLE_Y + 0.12, yEnd, t), heightAt(sx, 0) + 0.16, heightAt(sx, 1.1) + 0.1, heightAt(sx, -1.1) + 0.1);
      const hb = yTop - (heightAt(sx, 0) - 1.2);
      S.add(G.box((x1 - x0) / steps + 0.06, hb, 2.3), Mx(sx, yTop - hb / 2, 0), pick(stoneCols), 0.06, 0.05);
      if (k % 3 === 0) for (const sz of [1.25, -1.25]) S.add(G.box(0.3, 0.5, 0.3), Mx(sx, yTop + 0.25, sz), pick(stoneCols).scale(0.9), 0.05);
    }
    lamp(x1 + 0.4, 1.5, heightAt(x1 + 0.4, 1.5));
    lamp(x1 + 0.4, -1.5, heightAt(x1 + 0.4, -1.5));
  }
  // keep
  {
    const P = Mx(-1.3, 0, -0.4, 0.12).multiply(castleP);
    const KS = 4.8, KH = 10.2;
    S.add(G.box(KS - 0.3, KH, KS - 0.3), Mx(0, KH / 2, 0).multiply(P), mortar, 0.02);
    for (let s = 0; s < 4; s++) {
      const a = s * Math.PI / 2;
      const Pf = Mx(Math.sin(a) * (KS / 2 - 0.25), 0, Math.cos(a) * (KS / 2 - 0.25), a).multiply(P);
      brickWall(S, Pf, KS, KH, 0.5);
      for (let fl = 0; fl < 3; fl++) for (const wx of [-1, 1]) windowAt(S, L, Pf, wx * 1.1, 3.0 + fl * 2.4, 0.27, rand() < 0.45, 0.4, 0.8);
      merlons(S, Pf, KS, KH, 0.12, 0.72);
    }
    S.add(G.box(KS + 0.2, 0.3, KS + 0.2), Mx(0, KH - 0.1, 0).multiply(P), pick(stoneCols), 0.02);
    pyramidRoof(W, P, KS / 2 - 0.35, 4.2, KH + 0.1, blueRoof[0], blueRoof[1], 7);
    W.add(G.sph(0.3, 10), Mx(0, KH + 4.35, 0).multiply(P), C3("#f2c14e"), 0);
    flagSpots.push({ P, y: KH + 4.4, col: "#f2c14e", big: true });
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const Pt = Mx(sx * KS / 2, 0, sz * KS / 2).multiply(P);
      brickTower(S, Pt, 0.8, KH + 1.8);
      S.add(G.cyl(0.3, 2.0, 1.6, 20), Mx(0, KH + 1.95, 0).multiply(Pt), pick(stoneCols), 0.02);
      coneRoof(W, Pt, 1.05, 2.6, KH + 2.05, blueRoof[0], blueRoof[1], 6, 20);
    }
    // wooden door on keep facing gate (+x)
    W.add(G.box(0.12, 1.9, 1.2), Mx(KS / 2 + 0.05, 0.95, 0).multiply(P), C3("#7a4b2a"), 0.05);
  }
  // great hall
  {
    const P = Mx(0.4, 0, 3.6, Math.PI - 0.35).multiply(castleP);
    brickWall(S, Mx(0, 0, 1.05).multiply(P), 4.6, 2.6, 0.4, { ch: 0.38 });
    brickWall(S, Mx(0, 0, -1.05).multiply(P), 4.6, 2.6, 0.4, { ch: 0.38 });
    S.add(G.box(4.5, 2.6, 2.1), Mx(0, 1.3, 0).multiply(P), C3("#e9dfcb"), 0.02);
    for (const wx of [-1.4, 0, 1.4]) windowAt(S, L, P, wx, 1.5, 1.28, true, 0.38, 0.8);
    gableRoof(W, P, 4.6, 2.5, 2.6, 1.5, C3("#d65a3c"), C3("#bf4a30"), C3("#e9dfcb"));
  }
  // castle well + props
  {
    const P = Mx(2.2, 0.1, -2.6).multiply(castleP);
    brickTower(S, P, 0.55, 0.8);
    for (const sx of [-0.5, 0.5]) W.add(G.box(0.1, 1.4, 0.1), Mx(sx, 1.3, 0).multiply(P), timber, 0.05);
    gableRoof(W, P, 1.1, 1.1, 1.9, 0.5, C3("#d65a3c"), C3("#bf4a30"), timber);
    barrel(W, 3.6, -1.2, CASTLE_Y + 0.1); barrel(W, 3.2, -0.6, CASTLE_Y + 0.1, 0.85); crate(W, -3.8, -2.2, CASTLE_Y + 0.1);
  }

  // ---------------------------------------------------------------- village
  await say("Building the village…");
  const placed = [];
  const clearOf = (x, z, r) => placed.every(p => Math.hypot(p[0] - x, p[1] - z) > p[2] + r);
  const houseSpots = [];
  const tryHouse = (x, z, fx, fz, maxT = 0.88) => {
    if (houseSpots.length >= 18) return;
    if (Math.hypot(x, z) < 12.8 || edgeT(x, z) > maxT) return;
    if (roadDist(x, z) < 2.1 || waterDist(x, z) < 3.9) return;
    if (Math.hypot(x - SQUARE[0], z - SQUARE[1]) < 5.2) return;
    if (!clearOf(x, z, 1.8)) return;
    placed.push([x, z, 1.8]);
    houseSpots.push([x, z, yawZ(fx - x, fz - z)]);
  };
  for (const deg of [130, 228, 292, 330, 2, 38, 66, 162, 262, 16, 52, 312]) {
    const a = deg * Math.PI / 180, x = SQUARE[0] + Math.cos(a) * 6.3, z = SQUARE[1] + Math.sin(a) * 6.3;
    tryHouse(x, z, SQUARE[0], SQUARE[1]);
  }
  for (let deg = 0; deg < 360; deg += 18) {
    const a = deg * Math.PI / 180, x = SQUARE[0] + Math.cos(a) * 9.2, z = SQUARE[1] + Math.sin(a) * 9.2;
    tryHouse(x, z, SQUARE[0], SQUARE[1], 0.9);
  }
  for (const pi of [1, 2]) {
    const pts = PATHS[pi].pts;

  for (let k = 0; k < 160 && fieldsMade < 4; k++) {
    const a = rand() * TAU, rr = R(13, 22);
    if (field(Math.cos(a) * rr, Math.sin(a) * rr, R(3.4, 4.8), R(2.6, 3.4), R(0, Math.PI), rand() < 0.6 ? "wheat" : "veg")) fieldsMade++;
  }

  // ---------------------------------------------------------------- trees, rocks, flowers
  function pine(x, z, s, dark = false) {
    const y = heightAt(x, z);
    const P = Mx(x, y, z, R(0, TAU), s, s * R(0.9, 1.15), s);
    F.add(G.cyl(1.0, 0.22, 0.34, 8), Mx(0, 0.35, 0).multiply(P), C3("#7a4f30"), 0.08);
    const greens = dark ? ["#2c6e45", "#347d4c", "#3f8c54", "#4d9c5a"] : ["#2f7d4a", "#3b8f50", "#4ba257", "#61b45e"];
    const layers = 4;
    for (let k = 0; k < layers; k++) {
      const t = k / layers;
      const d = 2.3 * (1 - t * 0.72), h = 1.45 * (1 - t * 0.25);
      const vd = G.cyl(h, 0.02, d, 12, 2);
      const p = vd.positions;
      for (let i = 0; i < p.length; i += 3) { const r = Math.hypot(p[i], p[i + 2]); if (r > 0.1) { const f = 1 + 0.12 * noise3(p[i] * 2 + x, p[i + 1] * 2, p[i + 2] * 2 + z); p[i] *= f; p[i + 2] *= f; } }
      B.VertexData.ComputeNormals(p, vd.indices, vd.normals);
      F.add(vd, Mx(0, 0.9 + k * 0.78 + h / 2, 0, R(0, TAU)).multiply(P), C3(greens[k]), 0.06, 0.06);
    }
  }
  function roundTree(x, z, s) {
    const y = heightAt(x, z);
    const P = Mx(x, y, z, R(0, TAU), s, s, s);
    F.add(G.cyl(1.5, 0.22, 0.36, 8), Mx(0, 0.7, 0).multiply(P), C3("#7a4f30"), 0.08);
    const palette = rand() < 0.2 ? ["#f0a53a", "#e8883a", "#f3c24a"] : ["#7cc24a", "#8fd052", "#63ae40", "#a3d95c"];
    const blobs = 5 + Math.floor(rand() * 3);
    for (let k = 0; k < blobs; k++) {
      const a = rand() * TAU, r = k === 0 ? 0 : R(0.45, 0.8);
      F.add(G.ico(R(0.7, 1.0) * (k === 0 ? 1.25 : 1), 2, false), Mx(Math.cos(a) * r, 2.0 + R(-0.2, 0.55) + (k === 0 ? 0.3 : 0), Math.sin(a) * r).multiply(P), C3(pick(palette)), 0.06, 0.05);
    }
  }
  function bush(x, z, s = 1) {
    const y = heightAt(x, z);
    for (let k = 0; k < 3; k++) F.add(G.ico(R(0.35, 0.55) * s, 1, false), Mx(x + R(-0.4, 0.4) * s, y + 0.2 * s, z + R(-0.4, 0.4) * s), C3(pick(["#5fb33a", "#4a9c3b", "#78c247"])), 0.06, 0.05);
    if (rand() < 0.5) for (let k = 0; k < 4; k++) F.add(G.sph(0.12, 5), Mx(x + R(-0.5, 0.5) * s, y + 0.45 * s, z + R(-0.5, 0.5) * s), C3(pick(["#ff6b8b", "#ffffff", "#ffd166"])), 0, 0);
  }
  let pines = 0, rounds = 0;
  for (let k = 0; k < 2600 && pines < (isMobile ? 120 : 170); k++) {
    const a = rand() * TAU, rr = Math.sqrt(rand()) * 27;
    const x = Math.cos(a) * rr, z = Math.sin(a) * rr, t = edgeT(x, z);
    if (t > 0.94 || Math.hypot(x, z) < 8.5) continue;
    const dens = noise3(x * 0.09, z * 0.09, 12.4);

  // castle-hill crags and scattered rocks
  for (let k = 0; k < 70; k++) {
    const a = rand() * TAU, rr = k < 40 ? R(8.2, 11.5) : R(12, 26);
    const x = Math.cos(a) * rr, z = Math.sin(a) * rr;

    S.add(rockVD(s, 2, 0.35), Mx(x, heightAt(x, z) + s * 0.1, z, R(0, TAU), 1, R(0.6, 1.1), 1), C3(pick(["#b4a488", "#a39279", "#c3b395"])), 0.08, 0.06);
  }
  // riverbank pebbles & reeds
  for (const poly of RIVERS) poly.pts.forEach((p, i) => {

    const q = nearestOn(poly, p[0], p[1]);
    for (const side of [1, -1]) {

      else for (let r = 0; r < 5; r++) F.add(G.cyl(R(0.6, 1.0), 0.02, 0.07, 5), Mx(x + R(-0.25, 0.25), heightAt(x, z) + 0.35, z + R(-0.25, 0.25), 0, 1, 1, 1, R(-0.2, 0.2), R(-0.2, 0.2)), C3(pick(["#6aa84f", "#8cbf5a", "#557f3c"])), 0.05, 0);

  });
  // lily pads on the pond
  for (let k = 0; k < 10; k++) {
    const a = rand() * TAU, r = R(0.8, POND_R + 0.6);
    F.add(G.cyl(0.04, R(0.5, 0.8), R(0.5, 0.8), 14), Mx(POND[0] + Math.cos(a) * r, WATER_Y + 0.03, POND[1] + Math.sin(a) * r), C3("#4fae4a"), 0.08, 0);

    const d = rr / 27;
    const yUnder = -21 * Math.pow(Math.max(0, 1 - d * d), 0.64) - 0.2;
    const h = R(2.5, 6);
    S.add(G.cyl(h, 0.2, R(1.2, 2.4), 7, 3), Mx(x, yUnder - h / 2 + 1.5, z, R(0, TAU), 1, 1, 1, Math.PI + R(-0.15, 0.15), R(-0.15, 0.15)), C3(pick(["#6f6479", "#7d7086", "#5f566a"])), 0.06, 0.1);
  }
  for (let k = 0; k < 12; k++) {

    const yUnder = -21 * Math.pow(Math.max(0, 1 - d * d), 0.64);
    L.add(G.cyl(R(1.2, 2.4), 0.02, R(0.4, 0.7), 6), Mx(x, yUnder - 0.4, z, R(0, TAU), 1, 1, 1, Math.PI + R(-0.4, 0.4), R(-0.4, 0.4)), C3(pick(["#7ff3e6", "#a88bff", "#8fd7ff"])), 0.05, 0);

  // ---------------------------------------------------------------- finalize batches
  await say("Painting the details…");
  const stoneMesh = addCaster(S.build("stone", vcMat, root));

  // ---------------------------------------------------------------- satellites, clouds, birds

    for (let i = 0; i < p.length; i += 3) { const r = Math.hypot(p[i], p[i + 2]); const f = 1 + 0.35 * noise3(p[i] * 0.8 / s + x, p[i + 1] * 0.8 / s, p[i + 2] * 0.8 / s); if (r > 0.05) { p[i] *= f; p[i + 2] *= f; } p[i + 1] *= 1 + 0.1 * noise3(p[i], 3, p[i + 2]); }

    sp.minEmitPower = 0.5; sp.maxEmitPower = 1; sp.start();
  }
  // parent particle emitters to follow the floating motion (they use world vectors; we shift them in the loop)
  const emitters = [...scene.particleSystems].map(ps => ({ ps, base: ps.emitter.clone() }));

  // ---------------------------------------------------------------- post-processing
  const pipeline = new B.DefaultRenderingPipeline("post", true, scene, [camera]);
  pipeline.samples = isMobile ? 2 : 4;

  // ---------------------------------------------------------------- controls
  const btnOrbit = document.getElementById("btnOrbit"), btnTilt = document.getElementById("btnTilt"), btnReset = document.getElementById("btnReset");
  camera.useAutoRotationBehavior = true;
  const auto = camera.autoRotationBehavior;
  auto.idleRotationSpeed = 0.07; auto.idleRotationWaitTime = 4000; auto.idleRotationSpinupTime = 2500; auto.zoomStopsAnimation = false;
  let orbit = !reduceMotion;
  const setOrbit = (on) => { orbit = on; auto.idleRotationSpeed = on ? 0.07 : 0; btnOrbit.setAttribute("aria-pressed", String(on)); };
  setOrbit(orbit);
  btnOrbit.addEventListener("click", () => setOrbit(!orbit));
  btnTilt.addEventListener("click", () => { tiltShift = !tiltShift; pipeline.depthOfFieldEnabled = tiltShift; btnTilt.setAttribute("aria-pressed", String(tiltShift)); });
  function flyTo(alpha, beta, radius, target, frames = 90) {
    const ease = new B.CubicEase(); ease.setEasingMode(B.EasingFunction.EASINGMODE_EASEINOUT);
    const K = B.Animation.ANIMATIONLOOPMODE_CONSTANT;
    let a = alpha; while (a - camera.alpha > Math.PI) a -= TAU; while (camera.alpha - a > Math.PI) a += TAU;
    B.Animation.CreateAndStartAnimation("ca", camera, "alpha", 60, frames, camera.alpha, a, K, ease);
    B.Animation.CreateAndStartAnimation("cb", camera, "beta", 60, frames, camera.beta, beta, K, ease);
    B.Animation.CreateAndStartAnimation("cr", camera, "radius", 60, frames, camera.radius, radius, K, ease);
    B.Animation.CreateAndStartAnimation("ct", camera, "target", 60, frames, camera.target.clone(), target.clone(), K, ease);
  }
  btnReset.addEventListener("click", () => flyTo(HOME.alpha, HOME.beta, fitRadius(), HOME.target, reduceMotion ? 1 : 80));
  window.addEventListener("resize", () => engine.resize());

  // ---------------------------------------------------------------- loop
  let time = 0;
  const flagTmp = [];
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    time += dt;
    const bob = reduceMotion ? 0 : Math.sin(time * 0.5) * 0.35;
    root.position.y = bob;
    emitters.forEach(e => { e.ps.emitter.y = e.base.y + bob; });
    waterTex.vOffset -= dt * 0.22;
    fallTex.vOffset -= dt * 1.1;
    const wheel = wheelNode.metadata.wheel;
    wheel.rotation.x -= dt * 0.9;
    for (const f of flags) {
      const p = f.base;
      for (let i = 0; i < p.length; i += 3) {
        const x = p[i];
        flagTmp[i] = x; flagTmp[i + 1] = p[i + 1] + Math.sin(x * 3 - time * 5 + f.phase) * 0.04 * x;
        flagTmp[i + 2] = Math.sin(x * 4.5 - time * 6.5 + f.phase) * 0.16 * x / f.fw;
      }
      flagTmp.length = p.length;
      f.mesh.updateVerticesData(B.VertexBuffer.PositionKind, flagTmp);
    }
    for (const it of islets) it.node.position.y = it.y + Math.sin(time * it.speed + it.phase) * 0.7;
    cloudRoot.rotation.y += dt * 0.006;
    for (const b of birds) {
      const a = b.phase + time * b.speed;
      b.node.position.set(Math.cos(a) * b.r, b.h + Math.sin(a * 3) * 1.2, Math.sin(a) * b.r);
      b.node.rotation.y = yawZ(-Math.sin(a) * Math.sign(b.speed), Math.cos(a) * Math.sign(b.speed));
      const flap = Math.sin(time * b.flap + b.phase) * 0.55;
      for (const w of b.wings) w.w.rotation.z = w.s * flap;
    }
    if (tiltShift) {
      const dist = B.Vector3.Distance(camera.position, camera.target);
      pipeline.depthOfField.focusDistance = dist * 1000;
      pipeline.depthOfField.focalLength = dist * 32;
    }
  });

  // intro flight
  camera.radius = reduceMotion ? fitRadius() : 150;
  camera.beta = reduceMotion ? HOME.beta : 0.72;
  camera.alpha = reduceMotion ? HOME.alpha : HOME.alpha - 0.9;
  await scene.whenReadyAsync();
  engine.runRenderLoop(() => scene.render());
  await new Promise(r => setTimeout(r, 120));
  loader.classList.add("done");
  if (!reduceMotion) flyTo(HOME.alpha, HOME.beta, fitRadius(), HOME.target, 240);
  window.__diorama = { scene, engine, camera, pipeline, stats: { pines, rounds, houses: houseSpots.length, fields: fieldsMade } };
})();
</script>
