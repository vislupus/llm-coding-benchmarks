<svg width="1800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f8ff" />
      <stop offset="100%" stop-color="#e6f7ff" />
    </linearGradient>
  </defs>
  <rect width="1800" height="1200" fill="url(#bgGradient)" />

  <!-- Title -->
  <text x="900" y="60" font-size="48" font-weight="bold" text-anchor="middle" fill="#333">
    <a xlink:href="#diagram">Flower Anatomy Drag & Drop</a>
  </text>

  <!-- Central Diagram Area -->
  <g id="diagram" transform="translate(300, 120)">
    <!-- Flower Illustration -->
    <g>
      <circle cx="600" cy="300" r="250" fill="#ffebb6" stroke="#ffcc66" stroke-width="5" />
      <path d="M600,300 L850,300 L830,400 Z" fill="#cfc" />
      <text x="850" y="300" font-size="16" fill="#333">Petal</text>
      <circle cx="750" cy="450" r="10" fill="#ffcc66" />
    </g>

    <!-- Label Slots -->
    <rect x="100" y="550" width="150" height="40" fill="#e3f2fd" stroke="#333" />
    <text x="175" y="575" font-size="16" text-anchor="middle" fill="#333">Sepal</text>

    <rect x="250" y="550" width="150" height="40" fill="#e3f2fd" stroke="#333" />
    <text x="325" y="575" font-size="16" text-anchor="middle" fill="#333">Stamen</text>
  </g>

  <!-- Right-side Instructions -->
  <g transform="translate(1400, 100)">
    <rect width="400" height="600" fill="#ffffff" stroke="#cccccc" />
    <text x="20" y="40" font-size="24" fill="#333">Instructions</text>
    <text x="20" y="70" font-size="16" fill="#333">
      Drag each label from the word bank below and place it in the correct position over the diagram.
      Use the buttons to check your answers or get hints.
    </text>
  </g>

  <!-- Word Bank -->
  <g transform="translate(300, 950)">
    <rect x="0" y="0" width="1200" height="200" fill="#e9f7fa" stroke="#cccccc" />
    <!-- Example Label -->
    <g>
      <circle cx="100" cy="50" r="40" fill="#ffcc66" />
      <text x="100" y="55" font-size="16" text-anchor="middle" fill="#333">
        <a xlink:href="#diagram">Petal</a>
      </text>
    </g>
    <!-- More labels similar to the above... -->
  </g>

  <!-- Buttons -->
  <g transform="translate(1300, 800)">
    <!-- Hint Button -->
    <g id="hint" style="display:none;">
      <rect x="-200" y="-240" width="300" height="200" fill="#fff8e1" stroke="#cccccc" />
      <text x="-150" y="-200" font-size="24" fill="#333">Hint</text>
      <text x="-150" y="-175" font-size="16" fill="#333">The petal is brightly colored to attract pollinators.</text>
      <text x="-150" y="-150" font-size="16" fill="#333">
        <a xlink:href="#diagram" font-size="16" fill="#333">Close</a>
      </text>
    </g>
    <rect x="0" y="0" width="150" height="40" fill="#a5d6a7" stroke="#333" />
    <text x="75" y="25" font-size="16" text-anchor="middle" fill="#333">
      <a xlink:href="#hint" fill="#333">Hint</a>
    </text>

    <!-- Check Answer Button -->
    <g id="check" style="display:none;">
      <rect x="-200" y="-140" width="300" height="100" fill="#d1c4e9" stroke="#cccccc" />
      <text x="-150" y="-100" font-size="24" fill="#333">Check Answer</text>
      <text x="-150" y="-75" font-size="16" fill="#333">Review your placements and make adjustments.</text>
      <text x="-150" y="-50" font-size="16" fill="#333">
        <a xlink:href="#diagram" font-size="16" fill="#333">Close</a>
      </text>
    </g>
    <rect x="200" y="0" width="150" height="40" fill="#90caf9" stroke="#333" />
    <text x="275" y="25" font-size="16" text-anchor="middle" fill="#333">
      <a xlink:href="#check" fill="#333">Check Answer</a>
    </text>

    <!-- Reset Button -->
    <g id="reset" style="display:none;">
      <rect x="-200" y="-40" width="300" height="100" fill="#ffcdd2" stroke="#cccccc" />
      <text x="-150" y="0" font-size="24" fill="#333">Reset</text>
      <text x="-150" y="25" font-size="16" fill="#333">All labels have been reset.</text>
      <text x="-150" y="50" font-size="16" fill="#333">
        <a xlink:href="#diagram" font-size="16" fill="#333">Close</a>
      </text>
    </g>
    <rect x="400" y="0" width="150" height="40" fill="#ef9a9a" stroke="#333" />
    <text x="475" y="25" font-size="16" text-anchor="middle" fill="#333">
      <a xlink:href="#reset" fill="#333">Reset</a>
    </text>
  </g>
</svg>
