<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Battle</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
          }
          #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
          }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
        const scene = new BABYLON.Scene(engine);

        // Camera
        const camera = new BABYLON.ArcRotateCamera("ArcRotateCamera", Math.PI / 2, Math.PI / 4, 50, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);

        // Light
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // Background
        const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size:1000.0}, scene);
        const skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
        skyboxMaterial.backFaceCulling = false;
        skyboxMaterial.disableLighting = true;
        skybox.material = skyboxMaterial;
        skybox.infiniteDistance = true;
        skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture("textures/skybox", scene);
        skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;

        // Fleets
        function createShip(name, size, isFlagship) {
            const ship = BABYLON.MeshBuilder.CreateBox(name, {width: size, height: size, depth: size * 2}, scene);
            const material = new BABYLON.StandardMaterial("material", scene);
            material.diffuseColor = isFlagship ? new BABYLON.Color3(0, 0, 1) : new BABYLON.Color3(1, 0, 0);
            ship.material = material;
            return ship;
        }

        const fleet1 = [];
        const fleet2 = [];
        
        for (let i = 0; i < 10; i++) {
            fleet1.push(createShip(`fleet1_ship${i}`, i === 0 ? 2 : 1, i === 0));
            fleet2.push(createShip(`fleet2_ship${i}`, i === 0 ? 2 : 1, i === 0));
        }

        // Position the fleets
        fleet1.forEach((ship, index) => {
            ship.position = new BABYLON.Vector3((index - 5) * 3, 0, 20);
        });

        fleet2.forEach((ship, index) => {
            ship.position = new BABYLON.Vector3((index - 5) * 3, 0, -20);
        });

        // Movement logic
        scene.onBeforeRenderObservable.add(() => {
            const deltaTime = engine.getDeltaTime();
            fleet1.forEach(ship => {
                ship.position.z -= 0.01 * deltaTime;
            });
            fleet2.forEach(ship => {
                ship.position.z += 0.01 * deltaTime;
            });
        });

        return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => {
        scene.render();
    });

    window.addEventListener("resize", function () {
        engine.resize();
    });
</script>
</body>
</html>
