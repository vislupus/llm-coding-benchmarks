<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet engagement — Babylon.js space battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azure: #5ab8ff;
    --crimson: #ff5a47;
    --ink: #dfe7f2;
    --muted: #8a96ab;
    --glass: rgba(8, 12, 22, 0.55);
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'Saira Semi Condensed', 'Bahnschrift', 'Arial Narrow', system-ui, sans-serif;
    color: var(--ink);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .fleet { position: absolute; top: 18px; max-width: 42vw; }
  .fleet.azure { left: 22px; }
  .fleet.crimson { right: 22px; text-align: right; }
  .fleet h2 { margin: 0; font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; }
  .azure h2 { color: var(--azure); }
  .crimson h2 { color: var(--crimson); }
  .fleet p { margin: 2px 0 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 4px; align-items: flex-end; height: 34px; }
  .crimson .pips { justify-content: flex-end; }
  .pip { width: 7px; height: 24px; position: relative; background: rgba(255,255,255,0.08); }
  .pip.flag { width: 14px; height: 34px; }
  .pip i { position: absolute; left: 0; right: 0; bottom: 0; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .azure .pip { color: var(--azure); }
  .crimson .pip { color: var(--crimson); }
  .pip.dead { background: transparent; outline: 1px solid rgba(255,255,255,0.14); outline-offset: -1px; }
  .pip.dead i { display: none; }
  #feed { position: absolute; left: 22px; bottom: 52px; margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.55; max-width: 52ch; }
  #feed li { transition: opacity 1.2s ease; }
  #feed .a { color: var(--azure); font-weight: 600; }
  #feed .c { color: var(--crimson); font-weight: 600; }
  #feed .chain { color: #ffc47a; }
  #controls { position: absolute; right: 22px; bottom: 20px; display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  #controls button {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    background: var(--glass); border: 1px solid rgba(160,180,210,0.28);
    padding: 7px 13px; border-radius: 3px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #controls button:hover { border-color: rgba(200,215,240,0.65); }
  #controls button:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
  #hint { position: absolute; left: 22px; bottom: 20px; margin: 0; font-size: 13px; color: var(--muted); }
  #banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; }
  #banner h1 { font-size: clamp(28px, 5vw, 64px); font-weight: 700; margin: 0; text-shadow: 0 0 28px currentColor, 0 2px 4px #000; }
  #banner p { margin: 10px 0 0; color: var(--ink); font-size: 16px; opacity: 0.8; }
  #error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); font: 16px system-ui, sans-serif; text-align: center; padding: 20px; }
  @media (max-width: 700px) {
    .fleet h2 { font-size: 16px; }
    .fleet p { font-size: 12px; }
    .pip { width: 5px; height: 18px; } .pip.flag { width: 10px; height: 26px; }
    #hint { display: none; }
    #feed { bottom: 64px; font-size: 12px; }
    #controls button { font-size: 12px; padding: 6px 9px; }
  }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="c" aria-label="3D space battle between two fleets"></canvas>

<div id="hud">
  <header class="fleet azure">
    <h2>Azure Coalition</h2>
    <p id="c0">10 of 10 ships</p>
    <div class="pips" id="p0"></div>
  </header>
  <header class="fleet crimson">
    <h2>Crimson Dominion</h2>
    <p id="c1">10 of 10 ships</p>
    <div class="pips" id="p1"></div>
  </header>
  <ol id="feed" aria-live="polite"></ol>
  <p id="hint">Drag to orbit, scroll to zoom. Keys: C cycles the camera, R restarts.</p>
  <div id="controls">
    <button id="bCam" type="button">Camera: battle view</button>
    <button id="bOrbit" type="button">Auto-orbit: on</button>
    <button id="bRestart" type="button">Restart battle</button>
  </div>
  <div id="banner" hidden>
    <h1 id="bannerTitle"></h1>
    <p id="bannerSub"></p>
  </div>
</div>

<script>
(() => {
'use strict';

if (typeof BABYLON === 'undefined') {
  const e = document.createElement('div');
  e.id = 'error';
  e.textContent = 'Babylon.js could not be loaded from cdn.babylonjs.com. Check your internet connection and reload the page.';
  document.body.appendChild(e);
  return;
}

/* ------------------------------------------------------------------ *
 *  Setup
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const V3 = BABYLON.Vector3, C3 = BABYLON.Color3, C4 = BABYLON.Color4, Q = BABYLON.Quaternion;
const HALF = Math.PI / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function randUnit(out) {
  out = out || new V3();
  const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - z * z);
  return out.set(r * Math.cos(a), z, r * Math.sin(a));
}

const canvas = $('c');
const engine = new BABYLON.Engine(canvas, true, { stencil: true, antialias: true }, false);
engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 1.5));
const scene = new BABYLON.Scene(engine);
scene.clearColor = new C4(0.004, 0.005, 0.014, 1);

const P_SPEED = 130, P_LIFE = 3.3, RANGE = 380, ARENA = 290, FIRE_INTERVAL = 3;

const TEAM = [
  { name: 'Azure Coalition', cls: 'a', color: new C3(0.2, 0.6, 1.0), bright: new C3(0.6, 0.88, 1.0),
    hull: [178, 190, 208], accent: new C3(0.1, 0.42, 1.0), escort: 'Kestrel', flag: 'Vigilant' },
  { name: 'Crimson Dominion', cls: 'c', color: new C3(1.0, 0.2, 0.1), bright: new C3(1.0, 0.62, 0.45),
    hull: [112, 104, 106], accent: new C3(0.9, 0.1, 0.06), escort: 'Viper', flag: 'Harrow' }
];

/* Camera */
const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI * 0.72, Math.PI * 0.39, 340, V3.Zero(), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 40;
camera.upperRadiusLimit = 950;
camera.wheelDeltaPercentage = 0.02;
camera.pinchDeltaPercentage = 0.004;
camera.panningSensibility = 0;
camera.minZ = 1;
camera.maxZ = 20000;
camera.fov = 0.9;
camera.useAutoRotationBehavior = true;
camera.autoRotationBehavior.idleRotationSpeed = 0.06;
camera.autoRotationBehavior.idleRotationWaitTime = 4000;
camera.autoRotationBehavior.idleRotationSpinupTime = 3000;

/* Lights (creation order = priority order for materials) */
const sunDir = new V3(-1, -0.25, 0.35).normalize();
const sun = new BABYLON.DirectionalLight('sun', sunDir, scene);
sun.intensity = 1.7; sun.diffuse = new C3(1, 0.93, 0.82); sun.specular = new C3(1, 0.95, 0.85);
const hemi = new BABYLON.HemisphericLight('hemi', new V3(0.2, 1, -0.3), scene);
hemi.intensity = 0.38; hemi.diffuse = new C3(0.4, 0.48, 0.8); hemi.groundColor = new C3(0.3, 0.08, 0.14); hemi.specular = C3.Black();
const rim = new BABYLON.DirectionalLight('rim', new V3(0.5, 0.3, -0.8).normalize(), scene);
rim.intensity = 0.55; rim.diffuse = new C3(0.55, 0.35, 0.9); rim.specular = new C3(0.4, 0.3, 0.7);

const xLights = [];
for (let i = 0; i < 4; i++) {
  const L = new BABYLON.PointLight('xlight' + i, new V3(0, -99999, 0), scene);
  L.intensity = 0; L.range = 100;
  L.diffuse = new C3(1, 0.62, 0.28); L.specular = new C3(1, 0.7, 0.4);
  xLights.push({ L, t: 1, dur: 1, peak: 0 });
}

/* Post-processing */
const glow = new BABYLON.GlowLayer('glow', scene, { mainTextureRatio: 0.5, blurKernelSize: 48 });
glow.intensity = 0.95;
glow.customEmissiveColorSelector = (mesh, subMesh, material, result) => {
  const g = mesh.metadata && mesh.metadata.glow;
  if (g) result.set(g.r, g.g, g.b, 1);
  else if (material && material.emissiveColor) result.set(material.emissiveColor.r, material.emissiveColor.g, material.emissiveColor.b, 1);
  else result.set(0, 0, 0, 1);
};

const pipeline = new BABYLON.DefaultRenderingPipeline('pipe', true, scene, [camera]);
pipeline.samples = 4;
pipeline.bloomEnabled = true;
pipeline.bloomThreshold = 0.72;
pipeline.bloomWeight = 0.35;
pipeline.bloomKernel = 64;
pipeline.bloomScale = 0.5;
pipeline.imageProcessingEnabled = true;
pipeline.imageProcessing.toneMappingEnabled = true;
pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
pipeline.imageProcessing.exposure = 1.25;
pipeline.imageProcessing.contrast = 1.2;
pipeline.imageProcessing.vignetteEnabled = true;
pipeline.imageProcessing.vignetteWeight = 2.2;
pipeline.imageProcessing.vignetteColor = new C4(0, 0, 0, 0);
pipeline.chromaticAberrationEnabled = true;
pipeline.chromaticAberration.aberrationAmount = 3;
pipeline.chromaticAberration.radialIntensity = 0.8;
pipeline.grainEnabled = false;
pipeline.grain.intensity = 5;
pipeline.grain.animated = true;

/* ------------------------------------------------------------------ *
 *  Procedural textures
 * ------------------------------------------------------------------ */
function canvasTex(name, w, h, draw, opts) {
  opts = opts || {};
  const t = new BABYLON.DynamicTexture(name, { width: w, height: h }, scene, opts.mipmaps !== false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
  draw(t.getContext(), w, h);
  t.update(true);
  t.hasAlpha = !!opts.alpha;
  return t;
}
const TEX = {};
TEX.flare = canvasTex('flare', 128, 128, (c, w, h) => {
  c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
  const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, '#fff'); g.addColorStop(0.18, '#e8e8e8'); g.addColorStop(0.45, '#555'); g.addColorStop(1, '#000');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
TEX.smoke = canvasTex('smoke', 128, 128, (c, w, h) => {
  const R = mulberry32(5);
  c.clearRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) {
    const x = 64 + (R() - 0.5) * 40, y = 64 + (R() - 0.5) * 40, r = 18 + R() * 30;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const v = 150 + R() * 80 | 0;
    g.addColorStop(0, `rgba(${v},${v},${v},0.35)`); g.addColorStop(1, `rgba(${v},${v},${v},0)`);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }
}, { alpha: true });
TEX.ring = canvasTex('ring', 256, 256, (c, w, h) => {
  c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, '#000'); g.addColorStop(0.55, '#140800'); g.addColorStop(0.8, '#ff9a48');
  g.addColorStop(0.87, '#fff2d8'); g.addColorStop(0.93, '#ff8830'); g.addColorStop(1, '#000');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
TEX.sun = canvasTex('sun', 256, 256, (c, w, h) => {
  c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.07, '#fff8e8'); g.addColorStop(0.14, '#ffc98a');
  g.addColorStop(0.35, '#4a2a18'); g.addColorStop(1, '#000');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});

function panelTexture(name, base, seed) {
  return canvasTex(name, 512, 512, (c, w, h) => {
    const R = mulberry32(seed);
    const rgb = (k) => `rgb(${clamp(base[0] * k, 0, 255) | 0},${clamp(base[1] * k, 0, 255) | 0},${clamp(base[2] * k, 0, 255) | 0})`;
    c.fillStyle = rgb(1); c.fillRect(0, 0, w, h);
    for (let i = 0; i < 150; i++) {
      const x = (R() * 32 | 0) * 16, y = (R() * 32 | 0) * 16;
      const pw = (2 + (R() * 9 | 0)) * 16, ph = (2 + (R() * 9 | 0)) * 16;
      c.fillStyle = rgb(0.84 + R() * 0.3); c.fillRect(x, y, pw, ph);
      c.strokeStyle = 'rgba(0,0,0,0.38)'; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, pw - 2, ph - 2);
    }
    for (let i = 0; i < 90; i++) {
      const x = R() * w, y = R() * h, s = 3 + R() * 9;
      c.fillStyle = R() < 0.5 ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.14)';
      c.fillRect(x, y, s, s * (0.5 + R()));
    }
    c.fillStyle = 'rgba(0,0,0,0.25)';
    for (let i = 0; i < 40; i++) { const x = R() * w, y = R() * h; for (let k = 0; k < 6; k++) c.fillRect(x + k * 6, y, 2, 2); }
  });
}

/* ------------------------------------------------------------------ *
 *  Background: nebula sky, stars, sun and ringed gas giant
 * ------------------------------------------------------------------ */
function drawSky(c, w, h) {
  const R = mulberry32(1337);
  const bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#02030b'); bg.addColorStop(0.5, '#070819'); bg.addColorStop(1, '#02030b');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  const blob = (x, y, r, col, a) => {
    for (const ox of [-w, 0, w]) {
      const cx = x + ox; if (cx + r < 0 || cx - r > w) continue;
      const g = c.createRadialGradient(cx, y, 0, cx, y, r);
      g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.5, `rgba(${col},${a * 0.45})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.fillRect(cx - r, y - r, r * 2, r * 2);
    }
  };
  const band = x => h * 0.5 + Math.sin(x / w * Math.PI * 2 + 0.8) * h * 0.12;
  const pal = ['70,50,170', '40,90,200', '170,50,150', '30,150,170', '210,90,60', '120,60,200'];
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 360; i++) {
    const x = R() * w, y = band(x) + (R() + R() + R() - 1.5) * h * 0.14;
    blob(x, y, 30 + R() * R() * 230, pal[(R() * pal.length) | 0], 0.015 + R() * 0.045);
  }
  for (let i = 0; i < 130; i++) {
    const x = w * 0.62 + (R() - 0.5) * w * 0.18, y = band(x) + (R() - 0.5) * h * 0.2;
    blob(x, y, 20 + R() * 120, R() < 0.5 ? '230,70,140' : '255,140,90', 0.02 + R() * 0.05);
  }
  for (let i = 0; i < 100; i++) {
    const x = w * 0.2 + (R() - 0.5) * w * 0.16, y = band(x) + (R() - 0.5) * h * 0.18;
    blob(x, y, 20 + R() * 110, R() < 0.5 ? '60,170,230' : '90,120,255', 0.02 + R() * 0.05);
  }
  c.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 170; i++) {
    const x = R() * w, y = band(x) + (R() - 0.5) * h * 0.07;
    blob(x, y, 10 + R() * 60, '2,2,8', 0.12 + R() * 0.2);
  }
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5000; i++) {
    const x = R() * w, y = R() * h, b = R();
    c.fillStyle = `rgba(${200 + R() * 55 | 0},${200 + R() * 55 | 0},255,${0.12 + b * b * 0.55})`;
    c.fillRect(x, y, 1, 1);
  }
  c.globalCompositeOperation = 'source-over';
}
const sky = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 16000, segments: 48, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
skyMat.disableLighting = true;
skyMat.diffuseColor = C3.Black(); skyMat.specularColor = C3.Black();
skyMat.emissiveTexture = canvasTex('skyTex', 2048, 1024, drawSky);
sky.material = skyMat; sky.infiniteDistance = true; sky.isPickable = false;
glow.addExcludedMesh(sky);

function makeStars(n, size, seed) {
  const R = mulberry32(seed);
  const pos = [], col = [], idx = [];
  for (let i = 0; i < n; i++) {
    const z = R() * 2 - 1, a = R() * Math.PI * 2, r = Math.sqrt(1 - z * z);
    pos.push(r * Math.cos(a) * 7000, z * 7000, r * Math.sin(a) * 7000);
    const b = 0.35 + Math.pow(R(), 3) * 0.65, t = R();
    col.push(b * (t < 0.2 ? 1 : 0.8 + t * 0.2), b * (0.85 + R() * 0.15), b * (t > 0.7 ? 1 : 0.85), 1);
    idx.push(i);
  }
  const m = new BABYLON.Mesh('stars' + seed, scene);
  const vd = new BABYLON.VertexData();
  vd.positions = pos; vd.colors = col; vd.indices = idx;
  vd.applyToMesh(m);
  const mat = new BABYLON.StandardMaterial('starMat' + seed, scene);
  mat.disableLighting = true; mat.emissiveColor = C3.White(); mat.pointsCloud = true; mat.pointSize = size;
  m.material = mat; m.infiniteDistance = true; m.isPickable = false; m.alwaysSelectAsActiveMesh = true;
  glow.addExcludedMesh(m);
}
makeStars(3500, 1.3, 11);
makeStars(350, 2.4, 23);

const sunDisc = BABYLON.MeshBuilder.CreatePlane('sunDisc', { size: 2200 }, scene);
const sunMat = new BABYLON.StandardMaterial('sunMat', scene);
sunMat.disableLighting = true; sunMat.emissiveTexture = TEX.sun; sunMat.diffuseColor = C3.Black();
sunMat.alphaMode = BABYLON.Engine.ALPHA_ADD; sunMat.alpha = 0.99; sunMat.disableDepthWrite = true;
sunDisc.material = sunMat; sunDisc.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
sunDisc.position = sunDir.scale(-7000); sunDisc.infiniteDistance = true;
glow.addExcludedMesh(sunDisc);

(function buildPlanet() {
  const sys = new BABYLON.TransformNode('planetSys', scene);
  sys.position.set(2300, -1100, 1400);
  sys.rotation.set(0.14, 0, 0.35);
  const planet = BABYLON.MeshBuilder.CreateSphere('planet', { diameter: 1400, segments: 64 }, scene);
  planet.parent = sys;
  const pm = new BABYLON.StandardMaterial('planetMat', scene);
  pm.diffuseTexture = canvasTex('planetTex', 1024, 512, (c, w, h) => {
    const R = mulberry32(99);
    const A = [38, 52, 102], B = [96, 124, 176], Cc = [178, 168, 196], D = [206, 150, 118];
    for (let y = 0; y < h; y++) {
      const v = y / h;
      const n = Math.sin(v * 42 + Math.sin(v * 9) * 3) * 0.5 + 0.5, n2 = Math.sin(v * 113 + 1.3) * 0.5 + 0.5;
      const warm = Math.max(0, Math.sin(v * 7 + 0.4) - 0.6) * 1.6;
      const col = [0, 1, 2].map(k => {
        let x = A[k] + (B[k] - A[k]) * n; x += (Cc[k] - x) * n2 * 0.35; x += (D[k] - x) * warm * 0.5; return x | 0;
      });
      c.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`; c.fillRect(0, y, w, 1);
    }
    for (let i = 0; i < 500; i++) {
      c.fillStyle = R() < 0.5 ? `rgba(255,255,255,${0.04 + R() * 0.1})` : `rgba(10,15,40,${0.05 + R() * 0.12})`;
      c.beginPath(); c.ellipse(R() * w, R() * h, 20 + R() * 150, 1.5 + R() * 5, 0, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = 'rgba(220,150,120,0.45)'; c.beginPath(); c.ellipse(w * 0.3, h * 0.62, 50, 18, 0, 0, Math.PI * 2); c.fill();
  });
  pm.specularColor = C3.Black();
  pm.emissiveFresnelParameters = new BABYLON.FresnelParameters();
  pm.emissiveFresnelParameters.leftColor = new C3(0.22, 0.4, 0.85);
  pm.emissiveFresnelParameters.rightColor = C3.Black();
  pm.emissiveFresnelParameters.power = 3;
  pm.emissiveFresnelParameters.bias = 0.05;
  planet.material = pm;
  scene.onBeforeRenderObservable.add(() => { planet.rotation.y += 0.00004 * engine.getDeltaTime(); });

  const ring = BABYLON.MeshBuilder.CreateDisc('ring', { radius: 1, tessellation: 128, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  ring.parent = sys; ring.rotation.x = HALF; ring.scaling.setAll(1500);
  const ringTex = canvasTex('ringTex', 512, 512, (c, w, h) => {
    const R = mulberry32(4);
    c.clearRect(0, 0, w, h);
    for (let r = 256; r > 0; r--) {
      const f = r / 256;
      if (f < 0.56) break;

function paint(mesh, fn) {

  const n = p.length / 3, c = new Float32Array(n * 4);

    c[i * 4] = col[0]; c[i * 4 + 1] = col[1]; c[i * 4 + 2] = col[2]; c[i * 4 + 3] = 1;
  }

}

  m.disableLighting = true; m.emissiveColor = C3.White(); m.diffuseColor = C3.Black(); m.specularColor = C3.Black();
  m.alphaMode = BABYLON.Engine.ALPHA_ADD; m.disableDepthWrite = true; m.backFaceCulling = false;

    m.opacityFresnelParameters.rightColor = C3.White();
    m.opacityFresnelParameters.power = 1.6;

}

const MAT_ADD = additiveMat('add', false);

}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  core.scaling.set(0.55, 0.55, 2.6); core.bakeCurrentTransformIntoVertices();

function P(list, type, opt, pos, rot, scl) {

function buildEscort(team, root) {

function createShip(team, flag, index, pos, fwd) {

  ex.direction1 = new V3(-0.12, -0.12, -1); ex.direction2 = new V3(0.12, 0.12, -1);

  ex.minLifeTime = flag ? 0.4 : 0.22; ex.maxLifeTime = flag ? 0.9 : 0.5;
  ex.minSize = flag ? 1.0 : 0.45; ex.maxSize = flag ? 2.0 : 1.1;
  const exK = flag ? 0.55 : 0.8;
  ex.color1 = new C4(T.bright.r * exK, T.bright.g * exK, T.bright.b * exK, 1);
  ex.color2 = new C4(T.color.r * exK * 0.8, T.color.g * exK * 0.8, T.color.b * exK * 0.8, 1);
  ex.colorDead = new C4(0, 0, 0, 0);
  ex.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
  ex.updateSpeed = 1 / 60;
  ex.emitRate = sh.exBase = flag ? 120 : 90;
  ex.start();
  sh.exhaust = ex;

  makeBar(sh, spec.barW);
  orient(sh);
  S.ships.push(sh);
  return sh;
}

const FORMATION = [[0, 6, 28], [-18, 2, 18], [18, 2, 18], [-32, -4, 6], [32, -4, 6], [-16, -14, -4], [16, -14, -4], [-22, 14, -10], [22, 14, -10]];
function spawnFleets() {
  for (let team = 0; team < 2; team++) {
    const dirZ = team === 0 ? 1 : -1;
    const base = new V3(0, team === 0 ? -6 : 6, team === 0 ? -150 : 150);
    const fwd = new V3(0, 0, dirZ);
    const escorts = FORMATION.map(([x, y, z], i) => createShip(team, false, i + 1, base.add(new V3(x * dirZ, y, z * dirZ)), fwd));
    const flag = createShip(team, true, 0, base, fwd);
    S.order = S.order || [[], []];
    S.order[team] = [...escorts.slice(0, 4), flag, ...escorts.slice(4)];
  }
  buildPips();
}

/* ------------------------------------------------------------------ *
 *  Flight model and AI
 * ------------------------------------------------------------------ */
const TMP = new V3(), TMP2 = new V3(), TR = new V3(), TU = new V3();

function closestOnAxis(sh, p, out) {
  const ax = sh.fwd;
  const t = clamp(V3.Dot(p.subtract(sh.pos), ax), sh.segA, sh.segB);
  out.copyFrom(ax).scaleInPlace(t).addInPlace(sh.pos);
  return out;
}

function orient(sh) {
  const f = sh.fwd, up = sh.up;
  up.addInPlace(new V3(0, sh.flag ? 0.05 : 0.004, 0));
  V3.CrossToRef(up, f, sh.right);
  if (sh.right.lengthSquared() < 1e-8) sh.right.set(1, 0, 0);
  sh.right.normalize();
  V3.CrossToRef(f, sh.right, up); up.normalize();
  const c = Math.cos(sh.roll), s = Math.sin(sh.roll);
  TR.set(sh.right.x * c + up.x * s, sh.right.y * c + up.y * s, sh.right.z * c + up.z * s);
  V3.CrossToRef(f, TR, TU);
  Q.RotationQuaternionFromAxisToRef(TR, TU, f, sh.root.rotationQuaternion);
  sh.root.computeWorldMatrix(true);
}

function turnToward(f, d, maxAng, fallbackAxis) {
  const dot = clamp(V3.Dot(f, d), -1, 1), ang = Math.acos(dot);
  if (ang < 1e-4) return;
  const axis = V3.Cross(f, d);
  if (axis.lengthSquared() < 1e-8) axis.copyFrom(fallbackAxis);
  axis.normalize();
  const q = Q.RotationAxis(axis, Math.min(ang, maxAng));
  f.rotateByQuaternionToRef(q, f); f.normalize();
}

function nearest(sh, list) {
  let best = null, bd = Infinity;
  for (const e of list) { const d = V3.DistanceSquared(sh.pos, e.pos); if (d < bd) { bd = d; best = e; } }
  return best;
}
function pickTarget(sh, enemies) {
  let best = null, bs = Infinity;
  for (const e of enemies) {
    const sc = V3.Distance(sh.pos, e.pos) + (e.flag ? 70 : 0) + Math.random() * 90;
    if (sc < bs) { bs = sc; best = e; }
  }
  return best;
}

function escortAI(sh, enemies, dt) {
  sh.retarget -= dt;
  if (!sh.target || !sh.target.alive || sh.retarget < 0) { sh.target = pickTarget(sh, enemies); sh.retarget = rand(5, 9); }
  const tg = sh.target, d = new V3();
  if (sh.state === 'break') {
    d.copyFrom(sh.breakDir);
    sh.stateT -= dt;
    if (sh.stateT <= 0) sh.state = 'attack';
  } else if (tg) {
    const to = tg.pos.subtract(sh.pos), dist = to.length();
    const lead = tg.pos.add(tg.vel.scale(Math.min(dist / P_SPEED, 2)));
    d.copyFrom(lead.subtractInPlace(sh.pos)).normalize();
    d.addInPlace(sh.right.scale(Math.sin(S.time * 1.3 + sh.phase) * 0.18));
    if (dist < (tg.flag ? 50 : 24)) {
      sh.state = 'break'; sh.stateT = rand(1.4, 2.6);
      sh.breakDir = sh.fwd.scale(1.2).addInPlace(randUnit()).addInPlace(to.normalize().scale(-0.4)).normalize();
    }
  } else d.copyFrom(sh.pos).scaleInPlace(-1).normalize();
  return d;
}

function flagAI(sh, enemies) {
  let foe = null;
  for (const e of enemies) if (e.flag) foe = e;
  if (!foe) foe = nearest(sh, enemies);
  sh.target = foe;
  const d = new V3();
  if (foe) {
    const to = foe.pos.subtract(sh.pos), dist = to.length();
    to.scaleInPlace(1 / Math.max(dist, 1e-3));
    if (dist > 165) d.copyFrom(to);
    else {
      V3.CrossToRef(to, V3.Up(), d);
      d.normalize().scaleInPlace(sh.orbitSide).addInPlace(to.scale(dist < 95 ? -0.6 : 0.25));
    }
  } else d.copyFrom(sh.fwd);
  d.y += Math.sin(S.time * 0.17 + sh.phase) * 0.25 - sh.pos.y * 0.006;
  return d.normalize();
}

function avoidance(sh, out) {
  for (const o of S.ships) {
    if (o === sh || !o.alive) continue;
    if (o.flag) {
      closestOnAxis(o, sh.pos, TMP);
      const dv = sh.pos.subtract(TMP), dist = dv.length(), R = sh.flag ? 48 : 20;
      if (dist < R) out.addInPlace(dv.scaleInPlace((R - dist) / R * 3.5 / Math.max(dist, 0.1)));
    } else if (!sh.flag) {
      const dv = sh.pos.subtract(o.pos), dist = dv.length(), R = 13;
      if (dist < R) out.addInPlace(dv.scaleInPlace((R - dist) / R * 2 / Math.max(dist, 0.1)));
    }
  }
  const L = sh.pos.length();
  if (L > ARENA) out.addInPlace(sh.pos.scale(-(L - ARENA) / (L * 35)));
}

function updateShip(sh, dt) {
  const enemies = S.alive[1 - sh.team];
  const d = sh.flag ? flagAI(sh, enemies) : escortAI(sh, enemies, dt);
  avoidance(sh, d);
  if (d.lengthSquared() < 1e-8) d.copyFrom(sh.fwd);
  d.normalize();

  const lat = V3.Dot(d, sh.right);
  turnToward(sh.fwd, d, sh.turn * dt, sh.up);
  const targetRoll = -clamp(lat * 2.2, -1, 1) * sh.maxBank;
  sh.roll += (targetRoll - sh.roll) * Math.min(1, dt * 3);

  const align = Math.max(0, V3.Dot(sh.fwd, d));
  const thr = sh.flag ? 0.6 + 0.4 * align : (sh.state === 'break' ? 1 : 0.55 + 0.45 * align);
  sh.speed += clamp(sh.maxSpeed * thr - sh.speed, -sh.accel * dt, sh.accel * dt);
  sh.vel.copyFrom(sh.fwd).scaleInPlace(sh.speed);
  sh.pos.addInPlace(sh.vel.scale(dt));
  orient(sh);

  // Engines respond to throttle
  const th = sh.speed / sh.maxSpeed;
  for (const f of sh.flames) {
    const g = f.metadata, j = 0.85 + Math.random() * 0.3;
    f.scaling.set(g.d * (0.92 + Math.random() * 0.14), g.d * (0.92 + Math.random() * 0.14), g.len * (0.35 + 0.75 * th) * j);
  }
  sh.eLight.intensity = sh.lightI * (0.5 + 0.7 * th) * (0.88 + Math.random() * 0.24);
  sh.exhaust.emitRate = sh.exBase * (0.3 + 0.9 * th);

  // Weapons: fixed cadence of one volley every 3 s
  sh.fireT -= dt;
  if (sh.fireT <= 0) {
    if (fire(sh)) sh.fireT += FIRE_INTERVAL;
    else sh.fireT = 0;
  }

  // Health bar (billboard, scaled with distance to stay legible)
  const dist = V3.Distance(camera.position, sh.pos);
  const bs = clamp(dist / 230, 0.75, 2.8);
  sh.bar.scaling.setAll(bs);
  sh.bar.position.set(sh.pos.x, sh.pos.y + sh.barY * Math.max(1, bs * 0.75), sh.pos.z);
  const h = sh.hp / sh.maxHp;
  if (Math.abs(h - sh.barShown) > 0.001) {
    sh.barShown += (h - sh.barShown) * Math.min(1, dt * 8);
    const k = Math.max(sh.barShown, 0.001);
    sh.barFill.scaling.x = k;
    sh.barFill.position.x = -(1 - k) * sh.barW / 2;
    const c = sh.barMat.emissiveColor;
    if (k > 0.5) c.set(0.3 + (1 - k) * 1.4, 1, 0.45 - (1 - k) * 0.6);
    else c.set(1, 0.3 + k * 1.4, 0.15);
  }
}

/* ------------------------------------------------------------------ *
 *  Weapons
 * ------------------------------------------------------------------ */
function localPoint(sh, x, y, z) { return V3.TransformCoordinates(new V3(x, y, z), sh.root.getWorldMatrix()); }

function fire(sh) {
  const enemies = S.alive[1 - sh.team];
  if (!enemies.length) return false;
  let tg = sh.target && sh.target.alive ? sh.target : null;
  if (!tg || V3.Distance(tg.pos, sh.pos) > RANGE) tg = nearest(sh, enemies);
  if (!tg || V3.Distance(tg.pos, sh.pos) > RANGE) return false;
  if (sh.flag) for (const s of [-1, 1]) launch(sh, localPoint(sh, s * 5.6, -0.4, 14), tg, 18);
  else launch(sh, localPoint(sh, 0, 0, 5.4), tg, 12);
  return true;
}

function launch(sh, from, tg, dmg) {
  let aim = tg.pos.clone();
  for (let i = 0; i < 2; i++) aim = tg.pos.add(tg.vel.scale(V3.Distance(from, aim) / P_SPEED));
  const dir = aim.subtract(from).normalize();
  dir.addInPlace(randUnit().scale(sh.flag ? 0.012 : 0.03)).normalize();
  S.proj[sh.team].push({ pos: from, dir, vel: dir.scale(P_SPEED), age: 0, dmg, owner: sh });
  addFlash(sh.team, from, sh.flag ? 5.5 : 2.8, 0.2);
}

function addFlash(team, pos, size, dur) {
  const l = S.flashes[team];
  if (l.length < MAX_FLASH) l.push({ pos: pos.clone(), size, dur, t: 0 });
}

function updateProjectiles(dt) {
  for (let t = 0; t < 2; t++) {
    const list = S.proj[t], foes = S.alive[1 - t];
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.age += dt;
      let hit = null;
      for (let k = 0; k < 2 && !hit; k++) {
        p.pos.addInPlace(p.vel.scale(dt * 0.5));
        for (const e of foes) {
          if (!e.alive) continue;
          if (V3.DistanceSquared(e.pos, p.pos) > e.reach * e.reach) continue;
          closestOnAxis(e, p.pos, TMP);
          if (V3.DistanceSquared(TMP, p.pos) < e.hitR * e.hitR) { hit = e; break; }
        }
      }
      if (hit) {
        spawnHit(p.pos, t);
        damage(hit, p.dmg, p.owner);
      }
      if (hit || p.age > P_LIFE || list.length > MAX_P) { list[i] = list[list.length - 1]; list.pop(); }
    }
  }
}

function damage(sh, amt, by) {
  if (!sh.alive || sh.dying) return;
  sh.hp -= amt;
  if (sh.hp < sh.maxHp * 0.45 && !sh.dmgFx) addDamageFx(sh);
  if (sh.hp <= 0) { sh.hp = 0; destroyShip(sh, by, null); }
}

function addDamageFx(sh) {
  const b = sh.dmgBox;
  const f = new BABYLON.ParticleSystem('damage', sh.flag ? 500 : 180, scene);
  f.particleTexture = TEX.flare; f.emitter = sh.root;
  f.minEmitBox = new V3(-b[0], -b[1], -b[2]); f.maxEmitBox = new V3(b[0], b[1], b[2]);
  f.direction1 = new V3(-1, 0.3, -1); f.direction2 = new V3(1, 1, 0);
  f.minEmitPower = 1; f.maxEmitPower = 4;
  f.minLifeTime = sh.flag ? 0.6 : 0.4; f.maxLifeTime = sh.flag ? 1.4 : 1.0;
  f.minSize = sh.flag ? 1.5 : 0.6; f.maxSize = sh.flag ? 3.5 : 1.6;
  f.color1 = new C4(1, 0.62, 0.22, 1); f.color2 = new C4(1, 0.35, 0.08, 1); f.colorDead = new C4(0.03, 0.03, 0.03, 0);
  f.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
  f.updateSpeed = 1 / 60; f.emitRate = sh.flag ? 110 : 50;
  f.start();
  sh.dmgFx = f;
}

/* ------------------------------------------------------------------ *
 *  Explosions
 * ------------------------------------------------------------------ */
function burst(name, count, tex, pos, cfg) {
  const ps = new BABYLON.ParticleSystem(name, count, scene);
  ps.particleTexture = tex; ps.emitter = pos.clone();
  ps.createSphereEmitter(cfg.radius, 1);
  ps.minEmitPower = cfg.power[0]; ps.maxEmitPower = cfg.power[1];
  ps.minLifeTime = cfg.life[0]; ps.maxLifeTime = cfg.life[1];
  if (cfg.sizes) cfg.sizes.forEach(s => ps.addSizeGradient(s[0], s[1], s[2]));
  else { ps.minSize = cfg.size[0]; ps.maxSize = cfg.size[1]; }
  cfg.colors.forEach(c => ps.addColorGradient(c[0], c[1]));
  if (cfg.drag) cfg.drag.forEach(d => ps.addDragGradient(d[0], d[1]));
  ps.blendMode = cfg.blend !== undefined ? cfg.blend : BABYLON.ParticleSystem.BLENDMODE_ONEONE;
  if (cfg.stretched) ps.billboardMode = BABYLON.ParticleSystem.BILLBOARDMODE_STRETCHED;
  ps.minInitialRotation = 0; ps.maxInitialRotation = Math.PI * 2;
  ps.minAngularSpeed = -1; ps.maxAngularSpeed = 1;
  ps.updateSpeed = 1 / 60;
  ps.manualEmitCount = count;
  ps.start(cfg.delay || 0);
  disposeLater(ps, cfg.life[1] + (cfg.delay || 0) / 1000 + 0.6);
  return ps;
}

function fxMesh(mesh, mat, glowColor) {
  mesh.material = mat; mesh.isPickable = false;
  mesh.metadata = { glow: glowColor };
  return mesh;
}

function spawnExplosion(pos, s, team, normal) {
  const T = TEAM[team];
  const tb = T.bright;
  const sq = Math.sqrt(s);

  // Smoke first so the additive fire renders over it
  burst('smoke', s > 1 ? 150 : 60, TEX.smoke, pos, {
    radius: 1.5 * s, power: [1.5 * s, 7 * s], life: [1.6, 3.6], delay: 120,
    sizes: [[0, 3 * s, 5 * s], [1, 10 * s, 17 * s]],
    colors: [[0, new C4(0.2, 0.18, 0.17, 0)], [0.1, new C4(0.17, 0.15, 0.14, 0.5)], [1, new C4(0.04, 0.04, 0.05, 0)]],
    drag: [[0, 0], [1, 0.6]], blend: BABYLON.ParticleSystem.BLENDMODE_STANDARD
  });
  burst('fire', s > 1 ? 650 : 240, TEX.flare, pos, {
    radius: 1.2 * s, power: [3 * s, 22 * s], life: [0.5, s > 1 ? 2.0 : 1.4],
    sizes: [[0, 1.5 * s, 3 * s], [0.35, 4 * s, 7 * s], [1, 6 * s, 10 * s]],
    colors: [[0, new C4(1, 1, 0.9, 1)], [0.15, new C4(1, 0.78, 0.32, 1)], [0.45, new C4(0.95, 0.36, 0.08, 1)], [0.8, new C4(0.32, 0.07, 0.03, 1)], [1, new C4(0, 0, 0, 1)]],
    drag: [[0, 0], [1, 0.85]]
  });
  burst('sparks', s > 1 ? 450 : 170, TEX.flare, pos, {
    radius: 0.6 * s, power: [30 * sq, 115 * sq], life: [0.4, 1.4], size: [0.25 * sq, 0.65 * sq], stretched: true,
    colors: [[0, new C4(1, 1, 0.92, 1)], [0.3, new C4(1, 0.82, 0.42, 1)], [0.7, new C4(tb.r * 0.8, tb.g * 0.8, tb.b * 0.8, 1)], [1, new C4(0, 0, 0, 1)]],
    drag: [[0, 0], [1, 0.92]]
  });
  burst('embers', s > 1 ? 160 : 60, TEX.flare, pos, {
    radius: 0.8 * s, power: [8 * sq, 40 * sq], life: [1.0, 2.6], size: [0.3 * sq, 0.8 * sq],
    colors: [[0, new C4(tb.r, tb.g, tb.b, 1)], [0.5, new C4(T.color.r, T.color.g, T.color.b, 1)], [1, new C4(0, 0, 0, 1)]],
    drag: [[0, 0], [1, 0.7]]
  });

  // Blinding flash
  const flash = fxMesh(BABYLON.MeshBuilder.CreateSphere('xflash', { diameter: 1, segments: 16 }, scene), null, new C3(1, 0.8, 0.5));
  const fm = additiveMat('xflashMat', true); fm.emissiveColor = new C3(1, 0.88, 0.65); flash.material = fm;
  flash.position.copyFrom(pos);
  tween(0.6, k => {
    flash.scaling.setAll(Math.max(0.01, 18 * s * (k < 0.25 ? k / 0.25 : 1 - (k - 0.25) * 0.4)));
    fm.alpha = Math.pow(1 - k, 2);
    flash.metadata.glow.set(fm.alpha, fm.alpha * 0.8, fm.alpha * 0.5);
  }, () => { flash.dispose(); fm.dispose(); });

  // Spherical shockwave shell
  const shell = fxMesh(BABYLON.MeshBuilder.CreateSphere('shell', { diameter: 1, segments: 24 }, scene), null, tb.clone());
  const sm = additiveMat('shellMat', false);
  const mc = mix(arr(tb), [1, 0.85, 0.6], 0.5);
  sm.emissiveColor = new C3(mc[0], mc[1], mc[2]);
  sm.opacityFresnelParameters = new BABYLON.FresnelParameters();
  sm.opacityFresnelParameters.leftColor = C3.White(); sm.opacityFresnelParameters.rightColor = C3.Black();
  sm.opacityFresnelParameters.power = 2.5; sm.opacityFresnelParameters.bias = 0;
  shell.material = sm; shell.position.copyFrom(pos);
  const shellDur = s > 1 ? 1.2 : 0.8;
  tween(shellDur, k => {
    const e = 1 - Math.pow(1 - k, 3);
    shell.scaling.setAll(Math.max(0.01, (4 + 52 * e) * s));
    sm.alpha = Math.pow(1 - k, 1.5) * 0.95;
    shell.metadata.glow = sm.emissiveColor.scale(sm.alpha * 0.6);
  }, () => { shell.dispose(); sm.dispose(); });

  // Flat shock rings
  const rings = s > 1 ? 2 : 1;
  for (let r = 0; r < rings; r++) {
    const ring = fxMesh(BABYLON.MeshBuilder.CreatePlane('ring', { size: 1 }, scene), null, new C3(1, 0.6, 0.3));
    const rm = additiveMat('ringMat', false); rm.emissiveTexture = TEX.ring; rm.emissiveColor = C3.Black();
    ring.material = rm; ring.position.copyFrom(pos);
    const n = (normal && r === 0) ? normal.clone() : randUnit();
    ring.lookAt(pos.add(n));
    const dur = 1.3 + r * 0.3, delay = r * 0.12;
    rm.alpha = 0; ring.scaling.setAll(0.01);
    tween(dur + delay, k0 => {
      const k = clamp((k0 * (dur + delay) - delay) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 2.5);
      ring.scaling.setAll(Math.max(0.01, (6 + 70 * e) * s * (r ? 0.8 : 1)));
      rm.alpha = k > 0 ? Math.pow(1 - k, 1.8) : 0;
      ring.metadata.glow.set(rm.alpha, rm.alpha * 0.6, rm.alpha * 0.3);
    }, () => { ring.dispose(); rm.dispose(); });
  }

  // Dynamic light from the blast
  let slot = xLights[0];
  for (const x of xLights) if (x.t / x.dur > slot.t / slot.dur) slot = x;
  slot.L.position.copyFrom(pos); slot.L.range = 70 * s + 50;
  slot.peak = 5 * s; slot.dur = 0.8 + 0.35 * s; slot.t = 0;

  // Camera shake based on proximity
  const cd = V3.Distance(camera.position, pos);
  S.shake = Math.min(3.5, S.shake + s * s * 70 / Math.max(70, cd));
}

function spawnHit(pos, team) {
  const T = TEAM[team];
  burst('hit', 30, TEX.flare, pos, {
    radius: 0.3, power: [8, 42], life: [0.15, 0.45], size: [0.2, 0.5], stretched: true,
    colors: [[0, new C4(1, 1, 1, 1)], [0.4, new C4(T.bright.r, T.bright.g, T.bright.b, 1)], [1, new C4(0, 0, 0, 1)]]
  });
  addFlash(team, pos, 4.2, 0.22);
}

function spawnDebris(sh) {
  const n = sh.flag ? 34 : 13;
  for (let i = 0; i < n; i++) {
    const hot = Math.random() < 0.3;
    const m = DEBRIS_T[(Math.random() * 4) | 0].clone('debris');
    m.setEnabled(true); m.isVisible = true; m.isPickable = false;
    m.material = hot ? MAT_HOT : MATS[sh.team][Math.random() < 0.7 ? 'hull' : 'dark'];
    const size = sh.flag ? rand(0.8, 2.6) : rand(0.3, 1.0);
    m.scaling.set(size * rand(0.6, 1.4), size * rand(0.4, 1), size * rand(0.6, 1.6));
    m.position.copyFrom(sh.pos).addInPlace(randUnit().scaleInPlace(rand(0, sh.flag ? 10 : 2)));
    m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
    if (hot) m.metadata = { glow: new C3(1, 0.45, 0.12) };
    const d = {
      m, vel: randUnit().scaleInPlace(rand(8, sh.flag ? 40 : 32)).addInPlace(sh.vel.scale(0.4)),
      spin: new V3(rand(-4, 4), rand(-4, 4), rand(-4, 4)), life: 0, max: rand(3.2, 6.5), base: m.scaling.clone(), trail: null
    };
    if (i < (sh.flag ? 9 : 3)) {
      const tr = new BABYLON.ParticleSystem('debrisTrail', 150, scene);
      tr.particleTexture = TEX.flare; tr.emitter = m;
      tr.minEmitBox = V3.Zero(); tr.maxEmitBox = V3.Zero();
      tr.direction1 = new V3(-1, -1, -1); tr.direction2 = new V3(1, 1, 1);
      tr.minEmitPower = 0.3; tr.maxEmitPower = 1.5;
      tr.minLifeTime = 0.3; tr.maxLifeTime = 0.8;
      tr.minSize = 0.6 * (sh.flag ? 1.8 : 1); tr.maxSize = 1.4 * (sh.flag ? 1.8 : 1);
      tr.color1 = new C4(1, 0.72, 0.3, 1); tr.color2 = new C4(1, 0.42, 0.1, 1); tr.colorDead = new C4(0, 0, 0, 0);
      tr.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE; tr.updateSpeed = 1 / 60; tr.emitRate = 80;
      tr.start();
      d.trail = tr; d.trailStop = rand(1.3, 2.5);
    }
    S.debris.push(d);
  }
}

function updateDebris(dt) {
  for (let i = S.debris.length - 1; i >= 0; i--) {
    const d = S.debris[i];
    d.life += dt;
    d.m.position.addInPlace(d.vel.scale(dt));
    d.vel.scaleInPlace(1 - 0.12 * dt);
    d.m.rotation.addInPlace(d.spin.scale(dt));
    const rem = d.max - d.life;
    const f = clamp(rem / (d.max * 0.3), 0, 1);
    d.m.scaling.copyFrom(d.base).scaleInPlace(Math.max(f, 0.001));
    if (d.trail && d.life > d.trailStop && d.trail.isStarted()) d.trail.stop();
    if (rem <= 0) {
      if (d.trail) d.trail.dispose(false);
      d.m.dispose();
      S.debris.splice(i, 1);
    }
  }
}

function destroyShip(sh, by, chainFrom) {
  if (!sh.alive) return;
  sh.alive = false;
  const pos = sh.pos.clone(), vel = sh.vel.clone(), fwd = sh.fwd.clone(), up = sh.up.clone();
  const s = sh.flag ? 2.6 : 1;
  spawnExplosion(pos, s, sh.team, sh.flag ? up : null);
  if (sh.flag) {
    // rolling secondary detonations along the hull
    for (let i = 0; i < 7; i++) {
      const at = pos.add(fwd.scale(rand(-16, 18))).addInPlace(randUnit().scaleInPlace(rand(2, 7))).addInPlace(vel.scale(0.3 * i * 0.17));
      later(0.12 + i * 0.16, () => spawnExplosion(at, rand(0.6, 0.95), sh.team, null));
    }
  }
  spawnDebris(sh);

  // detach particle emitters before the ship's meshes go away
  sh.exhaust.emitter = sh.anchor.getAbsolutePosition().clone(); sh.exhaust.stop(); disposeLater(sh.exhaust, 1.2);
  if (sh.dmgFx) { sh.dmgFx.emitter = pos.clone(); sh.dmgFx.stop(); disposeLater(sh.dmgFx, 1.6); }
  sh.eLight.dispose();
  sh.root.dispose();
  sh.bar.dispose();
  sh.barMat.dispose();

  const name = x => `<span class="${TEAM[x.team].cls}">${x.label}</span>`;
  if (chainFrom) logFeed(`${name(sh)} <span class="chain">caught in the blast of</span> ${name(chainFrom)}`);
  else if (by) logFeed(`${name(by)} destroyed ${name(sh)}`);
  else logFeed(`${name(sh)} destroyed`);

  // Chain reaction: anything within roughly one ship-width of the blast detonates too
  for (const o of S.ships) {
    if (!o.alive || o.dying || o === sh) continue;
    closestOnAxis(o, pos, TMP2);
    if (V3.Distance(TMP2, pos) < sh.width + o.hitR * 0.5) {
      o.dying = true;
      later(rand(0.14, 0.32), () => destroyShip(o, null, sh));
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Instanced rendering of projectiles and flashes
 * ------------------------------------------------------------------ */
const QI = Q.Identity(), MQ = new Q(), MM = new BABYLON.Matrix(), MS = new V3(), AX = new V3(), AY = new V3();
function dirQuat(dir, out) {
  const up = Math.abs(dir.y) < 0.99 ? V3.Up() : V3.Right();
  V3.CrossToRef(up, dir, AX); AX.normalize();
  V3.CrossToRef(dir, AX, AY);
  Q.RotationQuaternionFromAxisToRef(AX, AY, dir, out);
  return out;
}
function commit(mesh, buf, n) {
  mesh.isVisible = n > 0;
  if (n > 0) { mesh.thinInstanceCount = n; mesh.thinInstanceBufferUpdated('matrix'); }
}
function renderInstances(dt) {
  for (let t = 0; t < 2; t++) {
    const fx = FX[t], list = S.proj[t];
    let n = 0;
    for (const p of list) {
      if (n >= MAX_P) break;
      dirQuat(p.dir, MQ);
      MS.set(1, 1, 1);
      BABYLON.Matrix.ComposeToRef(MS, MQ, p.pos, MM); MM.copyToArray(fx.boltBuf, n * 16);
      MS.set(0.8, 0.8, 16 * Math.min(1, p.age / 0.14) + 0.01);
      BABYLON.Matrix.ComposeToRef(MS, MQ, p.pos, MM); MM.copyToArray(fx.tailBuf, n * 16);
      n++;
    }
    commit(fx.bolt, fx.boltBuf, n);
    commit(fx.tail, fx.tailBuf, n);

    const fl = S.flashes[t];
    let m = 0;
    for (let i = fl.length - 1; i >= 0; i--) {
      const f = fl[i];
      f.t += dt;
      const k = f.t / f.dur;
      if (k >= 1) { fl[i] = fl[fl.length - 1]; fl.pop(); continue; }
      const sc = f.size * (k < 0.25 ? k / 0.25 : 1 - (k - 0.25) / 0.75) + 0.01;
      MS.set(sc, sc, sc);
      BABYLON.Matrix.ComposeToRef(MS, QI, f.pos, MM); MM.copyToArray(fx.flashBuf, m * 16);
      m++;
    }
    commit(fx.flash, fx.flashBuf, m);
  }
}

/* ------------------------------------------------------------------ *
 *  Lights, camera, HUD
 * ------------------------------------------------------------------ */
function updateLights(dt) {
  for (const x of xLights) {
    x.t += dt;
    const k = x.t / x.dur;
    x.L.intensity = k < 1 ? x.peak * (k < 0.08 ? k / 0.08 : Math.pow(1 - (k - 0.08) / 0.92, 2)) : 0;
  }
}

const CAM_MODES = ['battle view', 'follow Vigilant', 'follow Harrow', 'free'];
function setCamMode(i) {
  S.camMode = i % CAM_MODES.length;
  $('bCam').textContent = 'Camera: ' + CAM_MODES[S.camMode];
  camera.panningSensibility = S.camMode === 3 ? 60 : 0;
}
function updateCamera(dt) {
  let goal = null;
  if (S.camMode === 1 || S.camMode === 2) {
    const f = S.ships.find(s => s.flag && s.team === S.camMode - 1 && s.alive);
    if (f) goal = f.pos; else setCamMode(0);
  }
  if (S.camMode === 0) {
    const c = new V3(); let w = 0;
    for (const s of S.ships) if (s.alive) { const k = s.flag ? 3 : 1; c.addInPlace(s.pos.scale(k)); w += k; }
    if (w > 0) goal = c.scaleInPlace(1 / w);
  }
  if (goal) {
    const k = 1 - Math.exp(-dt * (S.camMode === 0 ? 1.2 : 3));
    camera.target.addInPlace(goal.subtract(camera.target).scaleInPlace(k));
  }
  S.shake *= Math.exp(-dt * 4);
  const a = S.shake * camera.radius * 0.004;
  camera.targetScreenOffset.set((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
}

function buildPips() {
  for (let t = 0; t < 2; t++) {
    const el = $('p' + t);
    el.innerHTML = '';
    S.order[t].forEach(sh => {
      const p = document.createElement('div');
      p.className = 'pip' + (sh.flag ? ' flag' : '');
      p.title = sh.label;
      const i = document.createElement('i');
      p.appendChild(i);
      el.appendChild(p);
      sh.pip = p; sh.pipFill = i;
    });
  }
}
function updateHud() {
  for (let t = 0; t < 2; t++) {
    let alive = 0;
    for (const sh of S.order[t]) {
      if (sh.alive) { alive++; sh.pipFill.style.height = (sh.hp / sh.maxHp * 100).toFixed(1) + '%'; }
      else sh.pip.classList.add('dead');
    }
    $('c' + t).textContent = `${alive} of 10 ships`;
  }
}
function logFeed(html) {
  const feed = $('feed');
  const li = document.createElement('li');
  li.innerHTML = html;
  feed.appendChild(li);
  while (feed.children.length > 6) feed.removeChild(feed.firstChild);
  setTimeout(() => { li.style.opacity = '0'; }, 7000);
  setTimeout(() => { li.remove(); }, 8300);
}

function checkVictory() {
  if (S.over) return;
  const a = S.ships.some(s => s.alive && s.team === 0), b = S.ships.some(s => s.alive && s.team === 1);
  if (a && b) return;
  S.over = true;
  later(2.8, () => {
    const title = $('bannerTitle');
    if (a) { title.textContent = 'Azure Coalition holds the field'; title.style.color = 'var(--azure)'; }
    else if (b) { title.textContent = 'Crimson Dominion holds the field'; title.style.color = 'var(--crimson)'; }
    else { title.textContent = 'Both fleets destroyed'; title.style.color = '#ffc47a'; }
    $('banner').hidden = false;
    let n = 8;
    const tick = () => { $('bannerSub').textContent = `A new engagement begins in ${n} s`; };
    tick();
    S.countdown = setInterval(() => { n--; if (n <= 0) { restart(); } else tick(); }, 1000);
  });
}

/* ------------------------------------------------------------------ *
 *  Lifecycle
 * ------------------------------------------------------------------ */
function clearBattle() {
  clearInterval(S.countdown);
  $('banner').hidden = true;
  const old = anims.splice(0);
  for (const a of old) if (a.cleanup) { if (a.update) a.update(1, 0); if (a.end) a.end(); }
  for (const sh of S.ships) {
    if (!sh.alive) continue;
    sh.exhaust.dispose(false);
    if (sh.dmgFx) sh.dmgFx.dispose(false);
    sh.eLight.dispose(); sh.root.dispose(); sh.bar.dispose(); sh.barMat.dispose();
  }
  for (const d of S.debris) { if (d.trail) d.trail.dispose(false); d.m.dispose(); }
  S.ships = []; S.debris = []; S.proj = [[], []]; S.flashes = [[], []]; S.alive = [[], []];
  for (const x of xLights) { x.t = x.dur; x.L.intensity = 0; }
  S.over = false; S.shake = 0; S.time = 0;
  $('feed').innerHTML = '';
}
function restart() {
  clearBattle();
  spawnFleets();
  logFeed('Fleets closing to engagement range');
}

// Warm up every effect shader once (invisibly small) so the first real explosion does not stutter.
spawnExplosion(new V3(0, 0, 0), 0.0005, 0, null);
spawnHit(new V3(0, 0, 0), 1);
xLights.forEach(x => { x.peak = 0; });
S.shake = 0;

spawnFleets();
logFeed('Fleets closing to engagement range');

scene.onBeforeRenderObservable.add(() => {
  const dt = Math.min(engine.getDeltaTime() / 1000, 1 / 20);
  S.time += dt;
  S.alive[0] = S.ships.filter(s => s.alive && s.team === 0);
  S.alive[1] = S.ships.filter(s => s.alive && s.team === 1);
  for (const sh of S.ships) if (sh.alive) updateShip(sh, dt);
  updateProjectiles(dt);
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i];
    if (!a) continue;
    a.t += dt;
    const k = Math.min(1, a.t / a.dur);
    if (a.update) a.update(k, dt);
    if (k >= 1) { anims.splice(i, 1); if (a.end) a.end(); }
  }
  updateDebris(dt);
  renderInstances(dt);
  updateLights(dt);
  updateCamera(dt);
  checkVictory();
  S.hudT -= dt;
  if (S.hudT <= 0) { S.hudT = 0.1; updateHud(); }
});

engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => engine.resize());

/* Controls */
setCamMode(0);
$('bCam').addEventListener('click', () => setCamMode(S.camMode + 1));
$('bOrbit').addEventListener('click', () => {
  camera.useAutoRotationBehavior = !camera.useAutoRotationBehavior;
  if (camera.useAutoRotationBehavior) {
    camera.autoRotationBehavior.idleRotationSpeed = 0.06;
    camera.autoRotationBehavior.idleRotationWaitTime = 4000;
  }
  $('bOrbit').textContent = 'Auto-orbit: ' + (camera.useAutoRotationBehavior ? 'on' : 'off');
});
$('bRestart').addEventListener('click', restart);
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'c' || e.key === 'C') setCamMode(S.camMode + 1);
  if (e.key === 'r' || e.key === 'R') restart();
});
})();
</script>
</body>
</html>
