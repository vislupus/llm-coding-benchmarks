            overflow: hidden; 
            background: #f5f5f5;

        canvas { display: block; }

</head>

ay(e)}function Be(e){return new Uint8ClampedArray(e)}function Ve(e){return new DataView(e)}function qe(e){return new ArrayBuffer(e)}function ze(e){return new Float32Array(e)}function We(e){return new Uint16Array(e)}function $e(e){return new Uint32Array(e)}function Xe(e){return new Int8Array(e)}function Ye(e){return new Uint8Array(e)}function Ge(e){return new Int16Array(e)}function Ke(e){return new Int32Array(e)}function Qe(e){return new Float64Array(e)}function Je(e){return new Uint8ClampedArray(e)}function Ze(e){return new DataView(e)}function _e(e){return new ArrayBuffer(e)}function et(e,t){if(!a(e))return null;for(var i=new Float32Array(e.length),r=0,s=e.length;r<s;r++)i[r]=e[r];return t&&(i=t),i}function tt(e,t){if(!a(e))return null;for(var i=new Uint16Array(e.length),r=0,s=e.length;r<s;r++)i[r]=e[r];return t&&(i=t),i}function it(e,t){if(!a(e))return null;for(var i=new Uint32Array(e.length),r=0,s=e.length;r<s;r++)i[r]=e[r];return t&&(i=t),i}function nt(e,t){if(!a(e))return null;for(var i=new Int8Array(e.length),r=0,s=e.length;r<s;r++)i[r]=e[r];return t&&(i=t),i}
        // [TRUNCATED FOR BREVITY - Full Three.js library would be included here in production]
        // For this example, we'll use a minimal Three.js setup with the actual library omitted for space.
        // In practice, you would include the full minified Three.js (r128) here (~480KB)
        
        // =============================================
        // CUSTOM SCENE CODE
        // =============================================
        (function() {
            'use strict';

            // Initialize Three.js (assuming library is loaded)
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            scene.fog = new THREE.FogExp2(0xf5f5f5, 0.001);

            // Camera
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);

            // Renderer
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 50, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 200;
            sunLight.shadow.camera.left = -60;
            sunLight.shadow.camera.right = 60;
            sunLight.shadow.camera.top = 60;
            sunLight.shadow.camera.bottom = -60;
            scene.add(sunLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a5f0b,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Pond
            const pondGeometry = new THREE.CircleGeometry(12, 32);
            const pondMaterial = new THREE.MeshStandardMaterial({
                color: 0x1e88e5,
                transparent: true,
                opacity: 0.7,
                roughness: 0.1,
                metalness: 0.3
            });
            const pond = new THREE.Mesh(pondGeometry, pondMaterial);
            pond.position.set(0, 0.1, -5);
            pond.rotation.x = -Math.PI / 2;
            pond.receiveShadow = true;
            scene.add(pond);

            // Koi fish (simplified)
            function createKoi() {
                const geometry = new THREE.BoxGeometry(0.5, 0.2, 1);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xff5722,
                    roughness: 0.7
                });
                const koi = new THREE.Mesh(geometry, material);
                koi.position.set(
                    (Math.random() - 0.5) * 10,
                    0.2,
                    (Math.random() - 0.5) * 10 - 5
                );
                koi.castShadow = true;
                return koi;
            }

            for (let i = 0; i < 8; i++) {
                scene.add(createKoi());
            }

            // Red bridge
            const bridgeGeometry = new THREE.BoxGeometry(15, 0.5, 2);
            const bridgeMaterial = new THREE.MeshStandardMaterial({
                color: 0xb71c1c,
                roughness: 0.4,
                metalness: 0.1
            });
            const bridge = new THREE.Mesh(bridgeGeometry, bridgeMaterial);
            bridge.position.set(0, 0.3, -5);
            bridge.rotation.y = Math.PI / 4;
            bridge.castShadow = true;
            bridge.receiveShadow = true;
            scene.add(bridge);

            // Pagoda
            const pagodaGroup = new THREE.Group();
            pagodaGroup.position.set(0, 0, -15);

            // Base
            const baseGeometry = new THREE.BoxGeometry(6, 1, 6);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: 0x8d6e63,
                roughness: 0.7
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.5;
            base.castShadow = true;
            base.receiveShadow = true;
            pagodaGroup.add(base);

            // Layers
            const layerColors = [0x8b0000, 0xa00000, 0xb22222];
            for (let i = 0; i < 3; i++) {
                const layerGeometry = new THREE.BoxGeometry(5 - i * 0.5, 4 - i * 0.5, 5 - i * 0.5);
                const layerMaterial = new THREE.MeshStandardMaterial({
                    color: layerColors[i],
                    roughness: 0.5
                });
                const layer = new THREE.Mesh(layerGeometry, layerMaterial);
                layer.position.y = 1 + i * 4;
                layer.castShadow = true;
                layer.receiveShadow = true;
                pagodaGroup.add(layer);
            }

            // Roofs
            const roofGeometry = new THREE.ConeGeometry(3, 2, 4);
            const roofMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.3,
                metalness: 0.2
            });

            for (let i = 0; i < 3; i++) {
                const roof = new THREE.Mesh(roofGeometry, roofMaterial);
                roof.position.y = 3 + i * 4;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                pagodaGroup.add(roof);
            }

            scene.add(pagodaGroup);

            // Cherry blossom trees
            function createCherryTree(position) {
                const group = new THREE.Group();
                group.position.copy(position);

                // Trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.2, 5, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8d6e63,
                    roughness: 0.8
                });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 2.5;
                trunk.castShadow = true;
                group.add(trunk);

                // Blossoms (simplified as particles)
                const blossomGeometry = new THREE.BufferGeometry();
                const blossomCount = 200;
                const positions = new Float32Array(blossomCount * 3);
                const colors = new Float32Array(blossomCount * 3);

                for (let i = 0; i < blossomCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const r = 3 + Math.random() * 2;

                    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = 4 + Math.random() * 3;
                    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                    colors[i * 3] = 0.9 + Math.random() * 0.1;
                    colors[i * 3 + 1] = 0.7 + Math.random() * 0.1;
                    colors[i * 3 + 2] = 0.8 + Math.random() * 0.1;
                }

                blossomGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                blossomGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const blossomMaterial = new THREE.PointsMaterial({
                    size: 0.15,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true
                });

                const blossoms = new THREE.Points(blossomGeometry, blossomMaterial);
                group.add(blossoms);

                return group;
            }

            scene.add(createCherryTree(new THREE.Vector3(-10, 0, -10)));
            scene.add(createCherryTree(new THREE.Vector3(10, 0, -10)));

            // Stone lanterns
            function createLantern(position) {
                const group = new THREE.Group();
                group.position.copy(position);

                // Base
                const base = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.6, 0.3, 8),
                    new THREE.MeshStandardMaterial({ color: 0x795548 })
                );
                base.position.y = 0.15;
                group.add(base);

                // Pillar
                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.25, 2, 8),
                    new THREE.MeshStandardMaterial({ color: 0x795548 })
                );
                pillar.position.y = 1.25;
                group.add(pillar);

                // Light chamber
                const chamber = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.3, 0.4),
                    new THREE.MeshStandardMaterial({ color: 0x5d4037 })
                );
                chamber.position.y = 2.5;
                group.add(chamber);

                // Roof
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(0.6, 0.2, 8),
                    new THREE.MeshStandardMaterial({ color: 0x3e2723 })
                );
                roof.position.y = 2.8;
                roof.rotation.x = Math.PI;
                group.add(roof);

                return group;
            }

            scene.add(createLantern(new THREE.Vector3(-8, 0, -3)));
            scene.add(createLantern(new THREE.Vector3(8, 0, -3)));

            // People
            function createPerson(position) {
                const group = new THREE.Group();
                group.position.copy(position);

                // Body
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.3, 0.8, 0.2),
                    new THREE.MeshStandardMaterial({ color: 0x1a237e })
                );
                body.position.y = 0.4;
                group.add(body);

                // Head
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffebcd })
                );
                head.position.y = 0.9;
                group.add(head);

                return group;
            }

            const person1 = createPerson(new THREE.Vector3(-3, 0, -8));
            const person2 = createPerson(new THREE.Vector3(3, 0, -8));
            scene.add(person1);
            scene.add(person2);

            // Camera path animation
            const cameraPath = new THREE.CatmullRomCurve3([
                new THREE.Vector3(25, 15, 0),
                new THREE.Vector3(0, 15, 25),
                new THREE.Vector3(-25, 15, 0),
                new THREE.Vector3(0, 15, -25)
            ]);
            cameraPath.curveType = 'catmullrom';
            cameraPath.closed = true;

            // Depth of field post-processing
            const renderScene = new THREE.RenderPass(scene, camera);
            const dofPass = new THREE.ShaderPass(THREE.DepthOfFieldShader);
            dofPass.uniforms['tSize'].value.set(window.innerWidth, window.innerHeight);
            dofPass.uniforms['focus'].value = 15;
            dofPass.uniforms['fstop'].value = 2.8;
            dofPass.uniforms['maxblur'].value = 0.005;

            const composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(dofPass);

            // Animation
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);

                // Animate camera along path
                time += 0.0005;
                const cameraPos = cameraPath.getPointAt(time % 1);
                camera.position.copy(cameraPos);
                camera.lookAt(0, 5, -10);

                // Animate koi fish
                scene.children.forEach(child => {
                    if (child.geometry && child.geometry.type === 'BoxGeometry' && child.position.z < 0) {
                        child.rotation.y += 0.01;
                        child.position.x += Math.sin(time * 2 + child.position.x) * 0.01;
                        child.position.z += Math.cos(time * 1.5 + child.position.z) * 0.01;
                    }
                });

                // Animate people
                person1.position.x += Math.sin(time * 0.5) * 0.01;
                person2.position.x += Math.sin(time * 0.5 + Math.PI) * 0.01;

                // Render with post-processing
                composer.render();
            }

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
                dofPass.uniforms['tSize'].value.set(window.innerWidth, window.innerHeight);
            });

            animate();
        })();
    </script>
</body>
</html>
