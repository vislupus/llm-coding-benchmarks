<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stillness of Spring — Cinematic Garden</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe8d9;font-family:Georgia,'Times New Roman',serif}
  #stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 42%}
  #world{position:absolute;left:50%;top:50%;width:1600px;height:1200px;margin:-600px 0 0 -800px;
         transform-style:preserve-3d;will-change:transform}
  #world svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  #petalLayer{transform:translateZ(70px);will-change:transform}
  .sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 7s ease-in-out infinite alternate}
  .sway2{transform-box:fill-box;transform-origin:bottom center;animation:sway 9.5s ease-in-out infinite alternate;animation-delay:-3s}
  .csway{transform-box:fill-box;transform-origin:bottom center;animation:csway 10s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-1.7deg)}to{transform:rotate(1.9deg)}}
  @keyframes csway{from{transform:rotate(-.7deg) scale(1)}to{transform:rotate(.8deg) scale(1.018)}}
  #shimmer{animation:shim 9s linear infinite}
  @keyframes shim{from{transform:translateX(-300px) skewX(-18deg)}to{transform:translateX(2400px) skewX(-18deg)}}
  #rays{position:fixed;inset:-5%;pointer-events:none;mix-blend-mode:screen;z-index:5;
       background:conic-gradient(from -26deg at 16% 6%,rgba(255,238,196,.55),transparent 16%,
        rgba(255,240,205,.25) 24%,transparent 40%,rgba(255,232,178,.32) 52%,transparent 68%);
       animation:raydrift 26s ease-in-out infinite alternate}
  @keyframes raydrift{from{opacity:.32;transform:rotate(-1deg) scale(1.05)}to{opacity:.62;transform:rotate(1.4deg) scale(1.12)}}
  #warm{position:fixed;inset:0;pointer-events:none;z-index:4;
       background:radial-gradient(60% 60% at 20% 8%,rgba(255,226,168,.38),transparent 60%),
                  radial-gradient(80% 80% at 80% 95%,rgba(110,85,130,.14),transparent 62%)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:6;
       background:radial-gradient(125% 125% at 50% 44%,transparent 52%,rgba(32,23,15,.42) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:.5;mix-blend-mode:overlay}
  .bar{position:fixed;left:0;right:0;height:0;background:#0b0906;z-index:12;transition:height 2.6s cubic-bezier(.65,0,.2,1)}
  #barT{top:0}#barB{bottom:0}
  body.cine .bar{height:6vh}
  #title{position:fixed;left:6.5vw;bottom:11.5vh;color:#37301f;z-index:11;opacity:0;
         transform:translateY(26px);transition:opacity 2.2s ease 1.1s,transform 2.2s ease 1.1s;pointer-events:none}
  body.cine #title{opacity:1;transform:none}
  #title h1{font-weight:400;font-size:min(5.4vw,58px);margin:0;letter-spacing:.3em;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  #title .rule{width:64px;height:1px;background:#8a7550;margin:16px 0 12px}
  #title p{letter-spacing:.42em;text-transform:uppercase;font-size:11px;color:#74633f;margin:0}
  @media (prefers-reduced-motion:reduce){.sway,.sway2,.csway,#rays,#shimmer{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <svg id="art" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid meet"></svg>
    <svg id="petalLayer" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>
<div id="warm"></div><div id="rays"></div><div id="vig"></div>
<svg id="grain"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gf)" opacity="0.55"/></svg>
<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<div id="title"><h1>静寂の庭</h1><div class="rule"></div><p>Stillness of Spring · A Cinematic Garden Study</p></div>

<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const art=document.getElementById('art'), pets=document.getElementById('petalLayer');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
/* seeded rng for a stable, art-directed layout */
let seed=20240329; function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const pick=arr=>arr[Math.floor(rnd()*arr.length)];

/* ---------- defs ---------- */
const defs=el('defs',{},art);
function lg(id,stops,x2,y2){const g=el('linearGradient',{id,x1:0,y1:0,x2:x2||0,y2:y2||1},defs);
  stops.forEach(s=>el('stop',{offset:s[0],'stop-color':s[1],...(s[2]!==undefined?{'stop-opacity':s[2]}:{})},g))}
lg('grassG',[[0,'#bdd07c'],[.55,'#98ad54'],[1,'#7c9547']]);
lg('pondG',[[0,'#7ecabb'],[.6,'#56a89a'],[1,'#3a867b']]);
lg('roofG',[[0,'#575c67'],[1,'#33363f']]);
lg('stoneG',[[0,'#c7c1b0'],[1,'#a29c8b']]);
lg('trunkG',[[0,'#7c5340'],[1,'#5a3a2b']]);
lg('goldG',[[0,'#f5d274'],[1,'#c79330']]);
lg('redG',[[0,'#b8423a'],[1,'#8e2f27']]);
lg('wallG',[[0,'#f7f2e6'],[1,'#e7dfcc']]);
lg('shimG',[[0,'#ffffff',0],[.5,'#ffffff',.9],[1,'#ffffff',0]],1,0);

const POND_D="M742 852 Q792 776 952 758 Q1150 738 1332 790 Q1428 832 1406 906 Q1390 963 1300 983 Q1306 1062 1180 1083 Q1012 1102 900 1072 Q802 1042 780 978 Q744 920 742 852 Z";
const GROUND_D="M110 792 Q90 1004 402 1102 Q800 1180 1232 1112 Q1502 1010 1490 822 Q1476 640 1230 572 Q820 480 432 572 Q142 646 110 792 Z";
const clip=el('clipPath',{id:'pondClip'},defs); el('path',{d:POND_D},clip);

/* ---------- ground ---------- */
const gGround=el('g',{},art);
el('path',{d:GROUND_D,fill:'#6e8140',transform:'translate(0,16)'},gGround);
el('path',{d:GROUND_D,fill:'url(#grassG)'},gGround);
el('path',{d:GROUND_D,fill:'none',stroke:'rgba(255,255,255,.18)','stroke-width':2},gGround);

/* grass sprinkles */
for(let i=0;i<70;i++){const x=800+(rnd()*2-1)*640,y=840+(rnd()*2-1)*280;
  if(((x-800)/690)**2+((y-840)/310)**2>0.95)continue;
  if(x>700&&y>740&&x<1440&&y<1110)continue;
  el('ellipse',{cx:x,cy:y,rx:3+rnd()*2.5,ry:2+rnd()*1.6,fill:pick(['#fdf6ec','#f6c9d4','#f9e3ea']),opacity:.85},gGround)}
for(let i=0;i<40;i++){const x=800+(rnd()*2-1)*640,y=840+(rnd()*2-1)*280;
  if(((x-800)/690)**2+((y-840)/310)**2>0.95)continue;
  el('ellipse',{cx:x,cy:y,rx:4.5,ry:2.2,fill:'#f4b7c8',opacity:.7,transform:`rotate(${rnd()*360} ${x} ${y})`},gGround)}

/* ---------- background layer (trees / bamboo) ---------- */
const far=el('g',{id:'far'},art);

function rock(g,x,y,rx,ry,c){el('ellipse',{cx:x,cy:y,rx:rx,ry:ry,fill:c||'#a49e8e'},g);
  el('ellipse',{cx:x-rx*.2,cy:y-ry*.3,rx:rx*.55,ry:ry*.4,fill:'rgba(255,255,255,.18)'},g)}
function bush(g,x,y,r,c){const cols=['#425f33','#4c6b3a','#3c5a2f','#557a41'];
  el('circle',{cx:x-r*.45,cy:y+r*.15,r:r*.72,fill:c||pick(cols)},g);
  el('circle',{cx:x+r*.4,cy:y+r*.2,r:r*.66,fill:pick(cols)},g);
  el('circle',{cx:x,cy:y-r*.2,r:r*.8,fill:pick(cols)},g);
  for(let i=0;i<5;i++)el('ellipse',{cx:x+(rnd()*1.3-.65)*r,cy:y+(rnd()*1.1-.55)*r,rx:3.4,ry:2.6,fill:'#fdf7ee',opacity:.9},g)}

function cherry(x,bx,by,cx,cy,rx,ry,scl){const g=el('g',{class:'csway'},far);
  el('path',{d:`M${bx} ${by} C ${bx-18} ${by-90} ${bx-36} ${by-150} ${bx-58} ${by-215}`,stroke:'url(#trunkG)','stroke-width':26,fill:'none','stroke-linecap':'round'},g);
  el('path',{d:`M${bx-22} ${by-120} C ${bx+30} ${by-170} ${bx+70} ${by-200} ${bx+96} ${by-238}`,stroke:'url(#trunkG)','stroke-width':14,fill:'none','stroke-linecap':'round'},g);
  el('path',{d:`M${bx-40} ${by-190} C ${bx-80} ${by-215} ${bx-96} ${by-235} ${bx-114} ${by-252}`,stroke:'url(#trunkG)','stroke-width':11,fill:'none','stroke-linecap':'round'},g);
  const pinks=['#f8cdd9','#f3b2cb','#fbdce6','#f0a7c3','#f9c2d4'];
  for(let i=0;i<52;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd());
    const px=cx+Math.cos(a)*rx*r*scl,py=cy+Math.sin(a)*ry*r*scl;
    el('circle',{cx:px,cy:py,r:(16+rnd()*30)*scl,fill:pick(pinks),opacity:.8+rnd()*.2},g)}
  for(let i=0;i<16;i++){const px=cx+(rnd()*1.1-.7)*rx*scl,py=cy+(rnd()*.9-.65)*ry*scl;
    el('circle',{cx:px,cy:py,r:(8+rnd()*12)*scl,fill:'#fdeef4',opacity:.9},g)}
  for(let i=0;i<7;i++)el('circle',{cx:cx+(rnd()*1.6-.8)*rx*scl,cy:cy+ry*scl*(0.6+rnd()*.5),r:3+rnd()*2,fill:'#f4b7ca',opacity:.8},g);
  return g}

cherry(0,332,648,300,318,215,150,1);          /* left blossom */
cherry(0,1366,670,1335,340,222,148,1.02);     /* right blossom */

function bamboo(x,y,h,n,w){const g=el('g',{class:rnd()>.5?'sway':'sway2'},far);
  for(let i=0;i<n;i++){const sx=x+i*w,sw=sx+(rnd()*14-7),top=y-h+(rnd()*40);
    el('line',{x1:sx,y1:y,x2:sw,y2:top,stroke:pick(['#8fae6b','#7fa15c','#9ab874']),'stroke-width':7,'stroke-linecap':'round'},g);
    for(let n2=0;n2<7;n2++){const ly=top+8+n2*(h/8)+rnd()*10,lx=sw-(sw-sx)*(n2/8);
      for(let s=-1;s<=1;s+=2){const len=18+rnd()*22,ang=(s>0?0.35:Math.PI-0.35)+(rnd()*.5-.25);
        el('path',{d:`M${lx} ${ly} q ${Math.cos(ang)*len} ${-Math.abs(Math.sin(ang))*len*0.55} ${Math.cos(ang)*len*1.6} ${-Math.abs(Math.sin(ang))*len*0.35}`,
          stroke:pick(['#6d9550','#7fa35e','#5e8747']),'stroke-width':5,fill:'none','stroke-linecap':'round',opacity:.95},g)}}}
  return g}
bamboo(70,700,330,6,20);
bamboo(1430,760,250,5,18);

/* rocks & bushes (background side) */
rock(far,1120,656,42,26);rock(far,1162,670,27,18,'#948e7e');rock(far,1092,672,20,13,'#8d8777');
rock(far,132,772,26,17);rock(far,168,902,32,20);rock(far,585,1046,27,16,'#999382');
bush(far,258,648,54);bush(far,352,672,30);bush(far,1242,624,48);bush(far,140,786,34);

/* ---------- pagoda ---------- */
const pag=el('g',{},art);
el('ellipse',{cx:848,cy:676,rx:230,ry:26,fill:'rgba(40,40,30,.16)'},pag);
function roof(g,cx,yE,hw,h){
  const d=`M${cx-hw} ${yE-14} Q${cx-hw+14} ${yE+6} ${cx-hw+36} ${yE+3} Q${cx-hw*.48} ${yE-h*.6} ${cx} ${yE-h} Q${cx+hw*.48} ${yE-h*.6} ${cx+hw-36} ${yE+3} Q${cx+hw-14} ${yE+6} ${cx+hw} ${yE-14} L${cx+hw-28} ${yE+26} Q${cx} ${yE-h+54} ${cx-hw+28} ${yE+26} Z`;
  el('path',{d,fill:'url(#roofG)',stroke:'#2c2f37','stroke-width':1.5},g);
  [-.62,-.28,.28,.62].forEach(k=>el('line',{x1:cx,y1:yE-h+7,x2:cx+hw*k+(k>0?-16:16),y2:yE+2,stroke:'rgba(0,0,0,.28)','stroke-width':3},g));
  [cx-hw+6,cx+hw-13].forEach(bx=>{el('rect',{x:bx,y:yE-7,width:7,height:7,fill:'url(#goldG)'},g);
    el('line',{x1:bx+3.5,y1:yE,x2:bx+3.5,y2:yE+8,stroke:'#c79330','stroke-width':1.5},g)});
}
function railing(g,cx,y,w){el('rect',{x:cx-w/2-8,y:y,width:w+16,height:8,fill:'url(#redG)'},g);
  el('rect',{x:cx-w/2-12,y:y-12,width:w+24,height:5,fill:'#c6503f'},g);
  for(let i=0;i<=Math.floor(w/16);i++)el('rect',{x:cx-w/2-4+i*16,y:y-12,width:4,height:14,fill:'#a03a30'},g);
  el('rect',{x:cx-w/2-20,y:y+8,width:w+40,height:8,fill:'#8e2f27'},g)}
function body(g,x,y,w,h,door){
  el('rect',{x,y,width:w,height:h,fill:'url(#redG)'},g);
  el('rect',{x:x+7,y:y+7,width:w-14,height:h-14,fill:'url(#wallG)'},g);
  for(let i=1;i<4;i++)el('rect',{x:x+(w/4)*i-3,y:y+7,width:6,height:h-14,fill:'#a33830'},g);
  el('rect',{x:x+7,y:y+h*.45,width:w-14,height:6,fill:'#a33830'},g);
  if(door){el('rect',{x:x+w/2-16,y:y+h*.42,width:32,height:h*.55,fill:'#57251f',rx:2},g);
    el('circle',{cx:x+w/2-6,cy:y+h*.68,r:2.4,fill:'url(#goldG)'},g);
    el('circle',{cx:x+w/2+6,cy:y+h*.68,r:2.4,fill:'url(#goldG)'},g)}}

el('rect',{x:700,y:608,width:260,height:48,fill:'url(#stoneG)',stroke:'#8f897a'},pag);
el('rect',{x:712,y:600,width:236,height:10,fill:'#b9b3a3'},pag);
for(let k=0;k<4;k++){const w=88+14*k;el('rect',{x:830-w/2,y:656+9.5*k,width:w,height:9.5,fill:'#b6b09f',stroke:'#97917f','stroke-width':1},pag)}
body(pag,745,514,170,92,true);
roof(pag,830,520,258,108);
body(pag,763,362,134,66);
railing(pag,830,424,150);
roof(pag,830,366,205,92);
body(pag,778,212,104,58);
railing(pag,830,266,118);
roof(pag,830,216,152,84);
el('rect',{x:820,y:126,width:20,height:9,fill:'url(#goldG)'},pag);
el('line',{x1:830,y1:126,x2:830,y2:86,stroke:'#d3a03a','stroke-width':4},pag);
el('circle',{cx:830,cy:114,r:5,fill:'url(#goldG)'},pag);
el('circle',{cx:830,cy:102,r:4,fill:'url(#goldG)'},pag);
el('path',{d:'M830 76 q7 9 0 14 q-7 -5 0 -14',fill:'url(#goldG)'},pag);

/* ---------- stone path ---------- */
const pathG=el('g',{},art);
function bez(p0,c1,c2,p3,t){const u=1-t;return[
  u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p3[0],
  u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p3[1]]}
const pts=[];
for(let i=0;i<11;i++)pts.push(bez([225,1130],[300,952],[432,842],[560,762],i/10));
for(let i=1;i<8;i++)pts.push(bez([560,762],[620,736],[666,712],[788,694],i/7));
pts.forEach((p,i)=>{const x=p[0]+(rnd()*26-13),y=p[1]+(rnd()*16-8);
  el('ellipse',{cx:x,cy:y,rx:24+rnd()*16,ry:14+rnd()*10,fill:'#c9c3b2',stroke:'#a49e8e','stroke-width':2,transform:`rotate(${rnd()*40-20} ${x} ${y})`},pathG);
  el('ellipse',{cx:x-6,cy:y-5,rx:12,ry:6,fill:'rgba(255,255,255,.25)'},pathG)});

/* fence bottom-left */
const fg=el('g',{},art);
[[510,1125],[578,1106],[648,1090]].forEach(p=>el('rect',{x:p[0],y:p[1]-34,width:9,height:36,rx:3,fill:'#b2ac9d',stroke:'#93907f','stroke-width':1},fg));
el('line',{x1:512,y1:1101,x2:656,y2:1066,stroke:'#b2ac9d','stroke-width':6},fg);
el('line',{x1:512,y1:1113,x2:656,y2:1078,stroke:'#b2ac9d','stroke-width':6},fg);

/* lanterns */
function lantern(g,x,y,s){const w=t=>t*s;
  el('ellipse',{cx:x,cy:y,rx:w(30),ry:w(9),fill:'rgba(40,40,30,.15)'},g);
  el('rect',{x:x-w(22),y:y-w(14),width:w(44),height:w(14),rx:2,fill:'url(#stoneG)',stroke:'#8f897a'},g);
  el('rect',{x:x-w(9),y:y-w(46),width:w(18),height:w(32),fill:'url(#stoneG)',stroke:'#8f897a'},g);
  el('rect',{x:x-w(18),y:y-w(54),width:w(36),height:w(9),rx:2,fill:'#a8a292'},g);
  el('rect',{x:x-w(13),y:y-w(84),width:w(26),height:w(30),fill:'url(#stoneG)',stroke:'#8f897a'},g);
  el('rect',{x:x-w(7),y:y-w(78),width:w(14),height:w(17),rx:2,fill:'#5c5647'},g);
  el('path',{d:`M${x-w(26)} ${y-w(84)} Q${x} ${y-w(104)} ${x+w(26)} ${y-w(84)} L${x+w(16)} ${y-w(80)} Q${x} ${y-w(94)} ${x-w(16)} ${y-w(80)} Z`,fill:'#a19b8b',stroke:'#8a8474'},g);
  el('circle',{cx:x,cy:y-w(108),r:w(5),fill:'#a19b8b'},g)}
const midG=el('g',{},art);
lantern(midG,214,806,1.05);lantern(midG,682,712,0.95);lantern(midG,714,1096,0.8);lantern(midG,116,690,0.9);
bush(midG,872,702,22);bush(midG,938,716,28);bush(midG,1004,704,20);bush(midG,938,758,18);

/* ---------- pond ---------- */
const pondG=el('g',{},art);
el('path',{d:POND_D,fill:'url(#pondG)',stroke:'#cfc7b0','stroke-width':13},pondG);
el('path',{d:POND_D,fill:'none',stroke:'rgba(0,0,0,.14)','stroke-width':4},pondG);
el('path',{d:'M800 850 Q980 800 1180 810 Q1330 830 1390 880',stroke:'rgba(255,255,255,.28)','stroke-width':3,fill:'none'},pondG);
el('path',{d:'M820 990 Q1000 1040 1220 1030 Q1310 1010 1360 960',stroke:'rgba(255,255,255,.22)','stroke-width':3,fill:'none'},pondG);
const shim=el('g',{'clip-path':'url(#pondClip)'},pondG);
el('rect',{id:'shimmer',x:0,y:700,width:560,height:460,fill:'url(#shimG)',opacity:.12},shim);

const ripG=el('g',{'clip-path':'url(#pondClip)'},pondG);
const fishG=el('g',{'clip-path':'url(#pondClip)'},pondG);

/* koi */
const FISH=[
  {c:['#ffffff','#e8641d'],p:['#e8641d','#e8641d']},{c:['#e8641d','#ffffff'],p:['#ffffff']},
  {c:['#ffffff','#d94f2a'],p:['#d94f2a','#2b2b2b']},{c:['#f2f2f2','#222'],p:['#2b2b2b']},
  {c:['#ffffff','#e8641d'],p:['#e8641d']},{c:['#f5b942','#fff'],p:['#fff8ee']},
  {c:['#ffffff','#d94f2a'],p:['#d94f2a']},{c:['#2f2f2f','#fff'],p:['#e8641d','#ffffff']}
];
const fishes=[];
FISH.forEach((f,i)=>{
  const inLobe=i>4;
  const fish={el:el('g',{},fishG),a:rnd()*Math.PI*2,sp:(0.1+rnd()*0.14)*(i%2?1:-1),
    cx:inLobe?1085:1065,cy:inLobe?1006:884,
    A:inLobe?110+rnd()*70:150+rnd()*110,B:inLobe?28+rnd()*32:58+rnd()*78,
    wig:rnd()*6,sc:.8+rnd()*.4};
  const e=fish.el;const [base]=f.c;
  el('path',{d:'M-24 0 Q-36 -11 -46 -10 Q-39 0 -46 10 Q-36 11 -24 0 Z',fill:base,opacity:.92},e);
  el('ellipse',{cx:0,cy:0,rx:27,ry:11.5,fill:base},e);
  f.p.forEach((pc,j)=>el('ellipse',{cx:-8+j*12,ry:6+j,cy:(j%2?-3:2),rx:7+j*2,fill:pc,opacity:.95},e));
  el('ellipse',{cx:6,cy:4,rx:14,ry:4,fill:'rgba(255,255,255,.35)'},e);
  el('circle',{cx:19,cy:-3.5,r:1.8,fill:'#1d1d1d'},e);
  el('circle',{cx:19,cy:3.5,r:1.8,fill:'#1d1d1d'},e);
  fishes.push(fish)});

/* ---------- bridge ---------- */
const bg2=el('g',{},art);
el('path',{d:'M1448 902 Q1356 946 1268 1092',stroke:'rgba(40,40,30,.16)','stroke-width':46,fill:'none'},bg2);

/* ---------- people ---------- */
function person(g,x,y,shirt,legs,skirt,facing){
  el('ellipse',{cx:x,cy:y+2,rx:16,ry:5,fill:'rgba(40,40,30,.18)'},g);

    el('line',{x1:x-5,y1:y-2,x2:x-5,y2:y,stroke:'#e8c39a','stroke-width':4},g);
    el('line',{x1:x+5,y1:y-2,x2:x+5,y2:y,stroke:'#e8c39a','stroke-width':4},g)}
  else{el('rect',{x:x-8,y:y-20,width:7,height:22,rx:3,fill:legs},g);
    el('rect',{x:x+1,y:y-20,width:7,height:22,rx:3,fill:legs},g)}
  el('circle',{cx:x,cy:y-52,r:7.5,fill:'#ecc79c'},g);
  el('path',{d:`M${x-7} ${y-54} a7.5 7.5 0 0 1 15 0 l0 3 q -7 -6 -15 -1 Z`,fill:'#31251f'},g);

const ppl=el('g',{},art);

/* ---------- petals layer ---------- */
const petals=[];
for(let i=0;i<54;i++){
  const e=el('ellipse',{rx:5,ry:3.2,fill:pick(['#f6bcd1','#fbD9e4','#f2a9c2','#ffffff']),opacity:.92},pets);
  const zone=rnd()>.45?
    {x0:120,x1:520,y0:170,y1:420}:{x0:1140,x1:1560,y0:190,y1:470};
  petals.push({el:e,z:zone,x:0,y:0,vy:20+rnd()*26,ph:rnd()*6.28,sc:.55+rnd()*.9,
    rot:rnd()*360,vr:(rnd()*80-40),dead:900+rnd()*250,fresh:true})}
function respawn(p){p.x=p.z.x0+rnd()*(p.z.x1-p.z.x0);p.y=p.z.y0+rnd()*(p.z.y1-p.z.y0)*.5;
  p.el.setAttribute('opacity',.92)}
petals.forEach(respawn);

/* ---------- ripples ---------- */
const ripples=[];let lastRip=0;
function spawnRipple(t){
  const x=1065+(rnd()*2-1)*230,y=900+(rnd()*2-1)*110;
  ripples.push({el:el('ellipse',{cx:x,cy:y,rx:4,ry:2,fill:'none',stroke:'rgba(255,255,255,.55)','stroke-width':2},ripG),t0:t})}

/* ---------- cinematic camera + loop ---------- */
const world=document.getElementById('world');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0=performance.now();let last=t0;
function frame(now){
  const t=now-t0,dt=Math.min(.05,(now-last)/1000);last=now;
  const intro=Math.min(1,t/3800),e=1-Math.pow(1-intro,3);
  if(!reduced){
    const s=(1.34-.28*e)*(1+.012*Math.sin(t/7000));
    const rx=6+Math.sin(t/11000)*2.2*e+(1-e)*8;
    const ry=Math.sin(t/9000)*3.6*e;
    const rz=Math.sin(t/13000)*1.3*e;
    const tx=Math.sin(t/15000)*26*e;
    const ty=Math.cos(t/18000)*15*e-(1-e)*50;
    world.style.transform=`translate3d(${tx}px,${ty}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
    art.style.filter=`blur(${(1-e)*14}px) saturate(1.04) brightness(1.01)`;
    far.style.filter=`blur(${(.9+.6*Math.sin(t/8000))*e}px)`;
  }else{art.style.filter='none';world.style.transform='scale(1.05)'}
  /* koi */
  for(const f of fishes){
    f.a+=f.sp*dt;
    const x=f.cx+Math.cos(f.a)*f.A,y=f.cy+Math.sin(f.a)*f.B;
    let h=Math.atan2(f.B*Math.cos(f.a),-f.A*Math.sin(f.a));
    if(f.sp<0)h+=Math.PI;
    const wig=Math.sin(t/120+f.wig)*7;
    f.el.setAttribute('transform',`translate(${x} ${y}) rotate(${(h*180/Math.PI+wig)}) scale(${f.sc})`)}
  /* ripples */
  if(t-lastRip>850){lastRip=t;if(ripples.length<10)spawnRipple(t)}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],age=(t-r.t0)/1600;
    if(age>=1){r.el.remove();ripples.splice(i,1);continue}
    r.el.setAttribute('rx',5+age*38);r.el.setAttribute('ry',2.5+age*19);
    r.el.setAttribute('opacity',(1-age)*.7)}
  /* petals */
  for(const p of petals){
    p.y+=p.vy*dt;p.x+=(Math.sin(t/700+p.ph)*14+9)*dt;p.rot+=p.vr*dt;
    if(p.y>p.dead){respawn(p)}
    else{const fade=p.y>p.dead-180?(p.dead-p.y)/180:1;
      p.el.setAttribute('opacity',(.92*fade*(p.sc>1.1?.6:1)).toFixed(2))}
    p.el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.rot}) scale(${p.sc})`)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
setTimeout(()=>document.body.classList.add('cine'),200);
})();
