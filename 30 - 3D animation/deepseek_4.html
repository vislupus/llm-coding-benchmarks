<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden – Isometric 3D Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 40%, #f7f3eb 0%, #e9e2d4 60%, #cdbfae 100%);
            font-family: Arial, sans-serif;
        }

        .scene-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            position: relative;
        }
        .scene-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .12) 100%);
            pointer-events: none;
            z-index: 10;
            border-radius: 0;
        }

        .camera {
            transform-style: preserve-3d;
            animation: cameraPan 28s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes cameraPan {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1) translateX(0) translateY(0);
            }
            20% {
                transform: rotateX(2deg) rotateY(3deg) scale(1.02) translateX(-10px) translateY(-4px);
            }
            40% {
                transform: rotateX(-1deg) rotateY(-2deg) scale(1.03) translateX(8px) translateY(5px);
            }
            60% {
                transform: rotateX(1deg) rotateY(2deg) scale(1.02) translateX(-6px) translateY(2px);
            }
            80% {
                transform: rotateX(-2deg) rotateY(1deg) scale(1.04) translateX(12px) translateY(-3px);
            }
            100% {
                transform: rotateX(0deg) rotateY(0deg) scale(1) translateX(0) translateY(0);
            }
        }

        svg {
            width: min(94vw, 94vh);
            height: auto;
            display: block;
            filter: drop-shadow(0 30px 50px rgba(0, 0, 0, .3));
            border-radius: 16px;
            background: transparent;
        }

        /* Subtle directional light overlay */
        #lighting {
            pointer-events: none;
        }

        /* Petals */
        .petal {
            position: fixed;
            width: 14px;
            height: 14px;
            border-radius: 50% 50% 50% 0;
            background: linear-gradient(135deg, #ffd6e8 0%, #ffa8c8 55%, #ff7eb5 100%);
            box-shadow: 0 0 8px rgba(255, 130, 180, .45);
            pointer-events: none;
            z-index: 999;
            opacity: 0;
        }
        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: .85;
            }
            25% {
                transform: translateY(22vh) translateX(22px) rotate(80deg);
                opacity: .75;
            }
            50% {
                transform: translateY(48vh) translateX(-18px) rotate(170deg);
                opacity: .55;
            }
            75% {
                transform: translateY(75vh) translateX(14px) rotate(270deg);
                opacity: .3;
            }
            100% {
                transform: translateY(115vh) translateX(-6px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Koi tail wiggle */
        .koi-tail {
            animation: tailWiggle .6s ease-in-out infinite alternate;
            transform-origin: right center;
        }
        @keyframes tailWiggle {
            0% {
                transform: skewY(0deg);
            }
            100% {
                transform: skewY(8deg);
            }
        }

        /* Water ripple */
        .ripple {
            animation: rippleAnim 3s ease-out infinite;
        }
        @keyframes rippleAnim {
            0% {
                stroke-width: 1;
                opacity: .7;
                transform: scale(.6);
            }
            100% {
                stroke-width: 0;
                opacity: 0;
                transform: scale(1.4);
            }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <div class="camera">
            <svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">

                <!-- Definitions -->

                <g id="lighting">
                    <ellipse cx="600" cy="350" rx="400" ry="250" fill="rgba(255,255,255,0.06)"/>
                    <ellipse cx="800" cy="750" rx="150" ry="80" fill="rgba(255,255,255,0.05)"/>
                </g>

            </svg>
        </div>
    </div>

    <!-- Petals container -->
    <div id="petals-container"></div>

    <script>
        const NS = 'http://www.w3.org/2000/svg';

        // ===== KOI FISH ANIMATION =====
        const koiData = [
            { color: '#e74c3c', size: 14, speed: 0.3, phase: 0 },
            { color: '#f39c12', size: 12, speed: 0.25, phase: 2.1 },
            { color: '#2d2d2d', size: 13, speed: 0.35, phase: 4.2 },
            { color: '#ff6b35', size: 11, speed: 0.2, phase: 1.5 },
            { color: '#ff4444', size: 12, speed: 0.28, phase: 3.3 },
        ];

        const pondCenter = { x: 800, y: 720 };
        const pondRX = 140;
        const pondRY = 70;

        function setupKoi() {
            const koiGroup = document.getElementById('koi-group');
            koiData.forEach((fish, i) => {
                const g = document.createElementNS(NS, 'g');
                g.setAttribute('id', 'koi-' + i);

                // Body
                const body = document.createElementNS(NS, 'ellipse');
                body.setAttribute('rx', fish.size);
                body.setAttribute('ry', fish.size * 0.4);
                body.setAttribute('fill', fish.color);
                body.setAttribute('stroke', 'rgba(0,0,0,0.3)');
                body.setAttribute('stroke-width', '0.5');
                g.appendChild(body);

                // Tail
                const tail = document.createElementNS(NS, 'path');
                tail.setAttribute('d', `M ${-fish.size},0 Q ${-fish.size-10},-8 ${-fish.size-16},0 Q ${-fish.size-10},8 ${-fish.size},0`);
                tail.setAttribute('fill', fish.color);
                tail.setAttribute('opacity', '0.7');
                tail.setAttribute('class', 'koi-tail');
                g.appendChild(tail);

                // Eye
                const eye = document.createElementNS(NS, 'circle');
                eye.setAttribute('cx', fish.size * 0.35);
                eye.setAttribute('cy', -1);
                eye.setAttribute('r', 2);
                eye.setAttribute('fill', '#000');
                g.appendChild(eye);

                koiGroup.appendChild(g);
            });
        }

        function animateKoi(time) {
            koiData.forEach((fish, i) => {
                const angle = fish.phase + time * 0.001 * fish.speed;
                const x = pondCenter.x + Math.cos(angle) * pondRX;
                const y = pondCenter.y + Math.sin(angle) * pondRY;
                const koi = document.getElementById('koi-' + i);
                const rotation = (angle * 180 / Math.PI) + 90;
                koi.setAttribute('transform', `translate(${x}, ${y}) rotate(${rotation})`);
            });
            requestAnimationFrame(animateKoi);
        }

        // ===== FALLING PETALS =====
        function setupPetals() {
            const container = document.getElementById('petals-container');
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (6 + Math.random() * 8) + 's';
                petal.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(petal);
                setTimeout(() => petal.remove(), 15000);
            }, 250);
        }

        // ===== INIT =====
        setupKoi();
        requestAnimationFrame(animateKoi);
        setupPetals();
    </script>
</body>
</html>
