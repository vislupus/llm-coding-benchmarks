<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cinematic Pagoda Garden – 3D Animation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Base reset & typography */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      background: radial-gradient(circle at 10% -10%, #1d263b 0, #020617 42%, #000 100%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: min(100vw, 1120px);
      height: min(100vh, 800px);
      padding: 16px;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: radial-gradient(circle at 20% 0, rgba(148,163,184,0.25), transparent 55%),
                  radial-gradient(circle at 120% 120%, rgba(15,23,42,0.9), #020617 70%);
      box-shadow:
        0 40px 120px rgba(0,0,0,0.85),
        0 0 0 1px rgba(148,163,184,0.12);
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0 0, rgba(248,250,252,0.12), transparent 60%);
      mix-blend-mode: screen;
      opacity: 0.35;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 22px;
      z-index: 3;
      pointer-events: none;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(226,232,240,0.75);
    }

    .hud-pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.4));
      box-shadow:
        0 0 0 1px rgba(148,163,184,0.35),
        0 18px 45px rgba(15,23,42,0.9);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #f97316, #fb923c);
      box-shadow: 0 0 12px rgba(248, 171, 92, 0.9);
    }

    .hud-tagline {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      opacity: 0.7;
    }

    .hud-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(148,163,184,0.9);
    }

    .hud-bottom span {
      opacity: 0.85;
    }

    .hud-bottom strong {
      font-weight: 600;
      color: #e5e7eb;
    }

    .hud-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hud-button {
      pointer-events: auto;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: radial-gradient(circle at 0 0, rgba(236,252,203,0.24), transparent 55%),
                  linear-gradient(135deg, rgba(15,23,42,0.7), rgba(15,23,42,0.95));
      color: #e5e7eb;
      box-shadow: 0 0 0 1px rgba(148,163,184,0.5),
                  0 8px 24px rgba(15,23,42,0.9);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 150ms ease-out, box-shadow 150ms ease-out, background 150ms ease-out;
    }

    .hud-button::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #bbf7d0, #22c55e);
      box-shadow: 0 0 12px rgba(74,222,128,0.9);
    }

    .hud-button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(226,232,240,0.9),
        0 18px 45px rgba(15,23,42,1);
      background: radial-gradient(circle at 20% -20%, rgba(248,250,252,0.3), transparent 60%),
                  linear-gradient(135deg, rgba(15,23,42,0.95), rgba(15,23,42,0.9));
    }

    .hud-button:active {
      transform: translateY(0);
      box-shadow:
        0 0 0 1px rgba(148,163,184,0.8),
        0 10px 28px rgba(15,23,42,0.9);
    }

    .hud-hint {
      opacity: 0.7;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hud-meta {
      display: flex;
      gap: 18px;
      align-items: center;
      opacity: 0.85;
    }

    .hud-meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .hud-meta span::before {
      content: "";
      width: 7px;
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(to right, rgba(148,163,184,0.6), transparent);
    }

    /* Scene & camera */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 1200px;
      perspective-origin: 50% 40%;
      overflow: hidden;
      border-radius: 24px;
      isolation: isolate;
    }

    .world {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: 50% 65%;
      will-change: transform;
    }

    .layer {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
      will-change: transform, filter, opacity;
    }

    .layer-far {
      transform: translateZ(-220px);
    }

    .layer-mid {
      transform: translateZ(0px);
    }

    .layer-near {
      transform: translateZ(150px);
    }

    /* Sky & background */
    .sky {
      background:
        radial-gradient(circle at 20% -20%, #f9a8d4 0, rgba(248,250,252,0.3) 14%, transparent 38%),
        radial-gradient(circle at 80% -10%, #bfdbfe 0, rgba(59,130,246,0.18) 22%, transparent 60%),
        radial-gradient(circle at 50% 45%, #020617 0, #020617 50%, #000 100%);
      filter: saturate(1.15) brightness(1.02);
    }

    .horizon-mist {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 10%;
      height: 35%;
      background:
        radial-gradient(circle at 50% 0%, rgba(148,163,184,0.38), transparent 60%),
        radial-gradient(circle at 0 20%, rgba(148,163,184,0.2), transparent 60%),
        radial-gradient(circle at 100% 20%, rgba(148,163,184,0.22), transparent 60%);
      opacity: 0.7;
      filter: blur(4px);
    }

    .mountain-range {
      position: absolute;
      left: -6%;
      right: -6%;
      bottom: 18%;
      height: 36%;
      background:
        radial-gradient(circle at 15% 60%, rgba(15,23,42,0.96) 0, transparent 60%),
        radial-gradient(circle at 45% 70%, rgba(15,23,42,0.92) 0, transparent 65%),
        radial-gradient(circle at 75% 63%, rgba(15,23,42,0.9) 0, transparent 60%),
        radial-gradient(circle at 100% 70%, rgba(15,23,42,0.9) 0, transparent 55%);
      filter: blur(2px);
      opacity: 0.75;
    }

    .sun-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      top: 2%;
      left: 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(254,249,195,0.95) 0, rgba(251,191,36,0.4) 30%, transparent 70%);
      mix-blend-mode: screen;
      opacity: 0.9;
      filter: blur(0.6px);
    }

    .sun-glow::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(254,243,199,0.45);
      box-shadow:
        0 0 12px rgba(253,224,171,0.9),
        0 0 32px rgba(234,179,8,0.8);
      opacity: 0.7;
    }

    /* Island */
    .garden-island {
      inset: 12% 10% 8% 10%;
      transform: translateZ(0px) rotateX(68deg);
    }

    .island {
      position: absolute;
      inset: 0;
      border-radius: 50% / 55%;
      background:
        radial-gradient(circle at 50% 40%, #4ade80 0, #22c55e 26%, #15803d 62%, #14532d 88%),
        radial-gradient(circle at 10% 90%, rgba(74,222,128,0.85), transparent 65%);
      box-shadow:
        0 60px 120px rgba(0,0,0,0.85);
      overflow: hidden;
    }

    .island::before {
      content: "";
      position: absolute;
      inset: 2%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 10% 0, rgba(190,242,100,0.7), transparent 60%),
        radial-gradient(circle at 90% 20%, rgba(190,242,100,0.6), transparent 60%),
        radial-gradient(circle at 40% 60%, rgba(21,128,61,0.9), transparent 70%);
      mix-blend-mode: soft-light;
      opacity: 0.9;
    }

    .island-rim {
      position: absolute;
      inset: 1.6%;
      border-radius: inherit;
      border: 12px solid rgba(15,23,42,0.95);
      border-bottom-width: 22px;
      box-shadow:
        0 24px 40px rgba(0,0,0,0.8),
        inset 0 12px 24px rgba(0,0,0,0.65);
      background:
        radial-gradient(circle at 50% 0, rgba(241,245,249,0.03), transparent 55%);
      pointer-events: none;
    }

    /* Stone path */
    .path {
      position: absolute;
      left: 10%;
      right: 38%;
      bottom: 8%;
      top: 40%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 20% 30%, rgba(226,232,240,0.88) 0, rgba(148,163,184,0.98) 24%, rgba(71,85,105,0.9) 65%, transparent 75%);
      box-shadow:
        0 18px 35px rgba(15,23,42,0.85),
        inset 0 3px 6px rgba(255,255,255,0.24);
      transform: translateZ(18px);
      overflow: hidden;
    }

    .path::before,
    .path::after {
      content: "";
      position: absolute;
      inset: 15%;
      border-radius: 999px;
      background-image:
        radial-gradient(circle at 10% 30%, rgba(15,23,42,0.45) 0, transparent 55%),
        radial-gradient(circle at 45% 60%, rgba(15,23,42,0.45) 0, transparent 60%),
        radial-gradient(circle at 80% 45%, rgba(15,23,42,0.5) 0, transparent 56%);
      opacity: 0.5;
    }

    .path::after {
      inset: 20%;
      filter: blur(1px);
      opacity: 0.65;
    }

    /* Pond */
    .pond {
      position: absolute;
      right: 10%;
      bottom: 10%;
      width: 48%;
      height: 36%;
      border-radius: 55% 55% 48% 48%;
      box-shadow:
        0 24px 40px rgba(15,23,42,0.9),
        inset 0 10px 16px rgba(15,23,42,0.9),
        inset 0 -12px 26px rgba(15,23,42,0.85);
      background: radial-gradient(circle at 50% 20%, #cffafe 0, #38bdf8 30%, #0ea5e9 55%, #0369a1 80%);
      overflow: hidden;
      transform: translateZ(26px);
    }

    .pond::before {
      content: "";
      position: absolute;
      inset: 3% 4%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 30% 0%, rgba(240,249,255,0.9) 0, transparent 45%),
        radial-gradient(circle at 80% 40%, rgba(14,165,233,0.9) 0, transparent 55%),
        radial-gradient(circle at 10% 100%, rgba(8,47,73,0.85) 0, transparent 70%);
      mix-blend-mode: soft-light;
      opacity: 0.9;
    }

    .pond-ripples {
      position: absolute;
      inset: 8% 10%;
      border-radius: inherit;
      border: 1px solid rgba(191,219,254,0.65);
      box-shadow:
        0 0 24px rgba(191,219,254,0.7),
        inset 0 0 12px rgba(191,219,254,0.8);
      opacity: 0.8;
      mix-blend-mode: screen;
    }

    .pond-ripples::before,
    .pond-ripples::after {
      content: "";
      position: absolute;
      inset: 16% 18%;
      border-radius: inherit;
      border: 1px solid rgba(191,219,254,0.5);
      box-shadow: 0 0 18px rgba(191,219,254,0.7);
      opacity: 0.7;
    }

    .pond-ripples::after {
      inset: 30% 33%;
      opacity: 0.55;
    }

    /* Bridge */
    .bridge-group {
      position: absolute;
      right: 18%;
      bottom: 12%;
      width: 34%;
      height: 26%;
      transform-style: preserve-3d;
      transform: translateZ(36px);
    }

    .bridge-arc {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 16%;
      height: 38%;
      border-radius: 999px;
      background:
        linear-gradient(to right, #b91c1c, #ef4444, #b91c1c);
      box-shadow:
        0 8px 18px rgba(127,29,29,0.85),
        inset 0 3px 6px rgba(254,242,242,0.18);
      transform: translateZ(4px);
    }

    .bridge-arc::before {
      content: "";
      position: absolute;
      inset: 18% 10%;
      border-radius: inherit;
      background:
        linear-gradient(to right, rgba(248,250,252,0.16), transparent 40%, rgba(248,250,252,0.2), transparent 70%);
      opacity: 0.9;
    }

    .bridge-deck {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 10%;
      height: 26%;
      border-radius: 999px;
      background:
        linear-gradient(to bottom, #fed7aa, #fb923c);
      box-shadow:
        0 10px 22px rgba(127,29,29,0.85),
        inset 0 4px 8px rgba(248,250,252,0.35);
      transform: translateZ(2px);
    }

    .bridge-rail {
      position: absolute;
      bottom: 28%;
      height: 18%;
      left: 10%;
      right: 10%;
      border-radius: 999px;
      background: linear-gradient(to right, #b91c1c, #ef4444, #b91c1c);
      box-shadow:
        0 6px 12px rgba(127,29,29,0.85),
        inset 0 2px 4px rgba(248,250,252,0.26);
    }

    .bridge-rail::before,
    .bridge-rail::after {
      content: "";
      position: absolute;
      inset: 18% 10%;
      border-radius: inherit;
      border: 1px solid rgba(254,226,226,0.6);
      opacity: 0.8;
    }

    .bridge-pillars {
      position: absolute;
      inset: 10% 0 0;
      display: flex;
      justify-content: space-between;
      padding: 0 18%;
    }

    .bridge-post {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background:
        linear-gradient(to bottom, #fee2e2, #b91c1c);
      box-shadow:
        0 8px 18px rgba(127,29,29,0.9);
    }

    /* Pagoda */
    .pagoda {
      position: absolute;
      left: 32%;
      right: 30%;
      bottom: 28%;
      top: 24%;
      transform-style: preserve-3d;
      transform: translateZ(40px);
    }

    .pagoda-platform {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 6%;
      height: 16%;
      border-radius: 20px;
      background: linear-gradient(to bottom, #0f172a, #020617);
      box-shadow:
        0 24px 45px rgba(15,23,42,0.95),
        inset 0 4px 8px rgba(148,163,184,0.5);
    }

    .pagoda-platform::before {
      content: "";
      position: absolute;
      inset: 10% 8%;
      border-radius: inherit;
      border: 1px solid rgba(148,163,184,0.55);
      box-shadow: inset 0 0 14px rgba(148,163,184,0.4);
    }

    .pagoda-stair {
      position: absolute;
      left: 40%;
      right: 40%;
      bottom: -4%;
      height: 16%;
      background:
        linear-gradient(to bottom, #fecaca, #ef4444);
      border-radius: 10px 10px 14px 14px;
      box-shadow:
        0 12px 20px rgba(127,29,29,0.9);
    }

    .pagoda-level {
      position: absolute;
      left: 12%;
      right: 12%;
      height: 23%;
      transform-origin: 50% 100%;
    }

    .pagoda-level.level-1 { bottom: 16%; }
    .pagoda-level.level-2 { bottom: 41%; left: 18%; right: 18%; }
    .pagoda-level.level-3 { bottom: 66%; left: 24%; right: 24%; }

    .pagoda-body {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 12%;
      top: 28%;
      background: linear-gradient(135deg, #f9fafb, #e5e7eb);
      box-shadow:
        0 8px 18px rgba(15,23,42,0.75),
        inset 0 0 10px rgba(148,163,184,0.65);
      border-radius: 8px;
      border: 2px solid rgba(148,163,184,0.9);
    }

    .pagoda-body::before,
    .pagoda-body::after {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      height: 18%;
      border-radius: 4px;
      border: 1px solid rgba(148,163,184,0.9);
      background: linear-gradient(to bottom, #fee2e2, #fecaca);
      box-shadow:
        inset 0 1px 2px rgba(248,250,252,0.9),
        0 2px 4px rgba(15,23,42,0.3);
    }

    .pagoda-body::before {
      top: 16%;
    }

    .pagoda-body::after {
      bottom: 16%;
    }

    .pagoda-balcony {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26%;
      border-radius: 10px;
      background: linear-gradient(to bottom, #fecaca, #b91c1c);
      box-shadow:
        0 10px 20px rgba(127,29,29,0.9);
    }

    .pagoda-balcony::before {
      content: "";
      position: absolute;
      inset: 18% 10%;
      border-radius: inherit;
      border: 1px solid rgba(254,226,226,0.7);
    }

    .pagoda-roof {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 40%;
      transform-origin: 50% 100%;
    }

    .pagoda-eaves {
      position: absolute;
      inset: 0;
      border-radius: 50% 50% 14px 14px;
      background:
        linear-gradient(to bottom, #020617, #0b1120 50%, #020617 100%);
      box-shadow:
        0 12px 24px rgba(15,23,42,0.95),
        inset 0 3px 6px rgba(148,163,184,0.5);
    }

    .pagoda-eaves::before,
    .pagoda-eaves::after {
      content: "";
      position: absolute;
      inset: 10% 16%;
      border-radius: inherit;
      border: 1px solid rgba(30,64,175,0.7);
      opacity: 0.8;
    }

    .pagoda-eaves::after {
      inset: 22% 24%;
      opacity: 0.65;
    }

    .pagoda-cap {
      position: absolute;
      width: 20%;
      height: 26%;
      left: 40%;
      bottom: -10%;
      border-radius: 999px;
      background: linear-gradient(to bottom, #facc15, #eab308);
      box-shadow:
        0 6px 12px rgba(161,98,7,0.85),
        inset 0 0 8px rgba(254,249,195,0.9);
    }

    .pagoda-spire {
      position: absolute;
      left: 49%;
      bottom: 15%;
      width: 2px;
      height: 36%;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, #facc15, #eab308);
      box-shadow:
        0 0 8px rgba(250,204,21,0.9);
    }

    /* Trees & shrubs */
    .tree {
      position: absolute;
      transform-origin: 50% 100%;
    }

    .trunk {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 11%;
      height: 38%;
      transform: translateX(-50%);
      border-radius: 99px;
      background: linear-gradient(to bottom, #78350f, #451a03);
      box-shadow:
        0 10px 20px rgba(15,23,42,0.9);
    }

    .canopy {
      position: absolute;
      bottom: 18%;
      left: 50%;
      width: 220%;
      height: 140%;
      transform: translateX(-50%);
      border-radius: 60% 60% 52% 52%;
      background:
        radial-gradient(circle at 20% 15%, #fee2e2 0, #fecaca 22%, #fb7185 55%, rgba(190,24,93,0.75) 80%),
        radial-gradient(circle at 70% 40%, rgba(244,114,182,0.85), transparent 60%);
      box-shadow:
        0 18px 28px rgba(244,114,182,0.75),
        inset 0 8px 14px rgba(254,249,195,0.65);
    }

    .canopy::before,
    .canopy::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      inset: 12% 16%;
      background:
        radial-gradient(circle at 10% 10%, rgba(254,249,195,0.8), transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(244,114,182,0.9), transparent 60%);
      opacity: 0.9;
      mix-blend-mode: screen;
    }

    .canopy::after {
      inset: 22% 22%;
      opacity: 0.7;
    }

    .tree.cherry-left {
      left: 16%;
      bottom: 40%;
      width: 18%;
      height: 38%;
      transform: rotateZ(-5deg) translateZ(12px);
    }

    .tree.cherry-right {
      right: 12%;
      bottom: 42%;
      width: 18%;
      height: 38%;
      transform: rotateZ(4deg) translateZ(-8px);
    }

    .bamboo-clump {
      position: absolute;
      left: 10%;
      bottom: 26%;
      width: 10%;
      height: 30%;
      transform: translateZ(10px);
    }

    .bamboo-stalk {
      position: absolute;
      bottom: 0;
      width: 18%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(to bottom, #bbf7d0, #22c55e);
      box-shadow:
        0 10px 18px rgba(14,116,144,0.85);
    }

    .bamboo-stalk:nth-child(1) { left: 8%; transform: rotateZ(-3deg); }
    .bamboo-stalk:nth-child(2) { left: 32%; transform: rotateZ(1deg); }
    .bamboo-stalk:nth-child(3) { left: 56%; transform: rotateZ(0deg); }
    .bamboo-stalk:nth-child(4) { left: 80%; transform: rotateZ(3deg); }

    .bamboo-leaf {
      position: absolute;
      width: 80%;
      height: 26%;
      border-radius: 999px;
      background: radial-gradient(circle at 0 50%, #bbf7d0, #22c55e 45%, transparent 65%);
      transform-origin: 0 50%;
      opacity: 0.9;
    }

    .bamboo-leaf:nth-child(5) { bottom: 60%; left: 36%; transform: rotateZ(-28deg); }
    .bamboo-leaf:nth-child(6) { bottom: 48%; left: 20%; transform: rotateZ(-16deg); }
    .bamboo-leaf:nth-child(7) { bottom: 68%; left: 54%; transform: rotateZ(-34deg); }

    /* Shrubs / rocks */
    .shrub {
      position: absolute;
      width: 10%;
      height: 10%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 20%, #bbf7d0, #16a34a 40%, #166534 75%);
      box-shadow:
        0 12px 22px rgba(15,23,42,0.9);
    }

    .shrub.large { width: 13%; height: 13%; }
    .shrub.small { width: 7%; height: 7%; }

    .shrub.s1 { left: 28%; bottom: 34%; }
    .shrub.s2 { left: 44%; bottom: 32%; }
    .shrub.s3 { right: 24%; bottom: 32%; }
    .shrub.s4 { right: 32%; bottom: 26%; width: 12%; height: 11%; }
    .shrub.s5 { left: 22%; bottom: 24%; width: 9%; height: 9%; }
    .shrub.s6 { right: 42%; bottom: 26%; width: 7%; height: 7%; }

    .rock {
      position: absolute;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 20%, #e5e7eb, #9ca3af 35%, #4b5563 80%);
      box-shadow:
        0 12px 20px rgba(15,23,42,0.9);
    }

    .rock.r1 { left: 68%; bottom: 18%; width: 8%; height: 6%; }
    .rock.r2 { left: 74%; bottom: 22%; width: 10%; height: 7%; }
    .rock.r3 { left: 80%; bottom: 18%; width: 7%; height: 5%; }
    .rock.r4 { left: 18%; bottom: 16%; width: 7%; height: 5%; }
    .rock.r5 { left: 24%; bottom: 18%; width: 9%; height: 6%; }

    /* Stone lanterns */
    .lantern {
      position: absolute;
      width: 6%;
      height: 18%;
      transform-origin: 50% 100%;
    }

    .lantern-body {
      position: absolute;
      left: 50%;
      width: 32%;
      height: 44%;
      transform: translateX(-50%);
      border-radius: 99px;
      background: linear-gradient(to bottom, #e5e7eb, #9ca3af);
      box-shadow:
        0 6px 12px rgba(15,23,42,0.85);
    }

    .lantern-cap {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 38%;
      height: 26%;
      border-radius: 999px;
      background: linear-gradient(to bottom, #f9fafb, #cbd5f5);
      box-shadow:
        0 6px 12px rgba(15,23,42,0.85);
    }

    .lantern-cap::before {
      content: "";
      position: absolute;
      inset: 18% 16%;
      border-radius: inherit;
      border: 1px solid rgba(148,163,184,0.9);
    }

    .lantern-light {
      position: absolute;
      left: 32%;
      right: 32%;
      top: 44%;
      bottom: 22%;
      border-radius: 6px;
      background: radial-gradient(circle at 30% 0, #fee2e2, #f97316);
      box-shadow: 0 0 18px rgba(251,191,36,0.8);
    }

    .lantern-base {
      position: absolute;
      left: 16%;
      right: 16%;
      bottom: 0;
      height: 18%;
      border-radius: 6px 6px 10px 10px;
      background: linear-gradient(to bottom, #e5e7eb, #9ca3af);
      box-shadow:
        0 6px 12px rgba(15,23,42,0.85);
    }

    .lantern.l1 { left: 20%; bottom: 34%; transform: translateZ(18px); }
    .lantern.l2 { left: 34%; bottom: 26%; transform: translateZ(20px); }
    .lantern.l3 { left: 50%; bottom: 20%; transform: translateZ(18px); }

    /* Visitors */
    .visitor {
      position: absolute;
      width: 4.8%;
      height: 16%;
      transform-origin: 50% 100%;
      transform: translateZ(30px);
    }

    .visitor .head {
      position: absolute;
      width: 34%;
      padding-bottom: 34%;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fed7aa, #f97316);
      left: 50%;
      transform: translate(-50%, 0);
      top: 0;
      box-shadow:
        0 3px 6px rgba(15,23,42,0.8);
    }

    .visitor .body {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 32%;
      width: 70%;
      height: 44%;
      border-radius: 999px;
      background: linear-gradient(to bottom, #0f172a, #020617);
      box-shadow:
        0 6px 12px rgba(15,23,42,0.9);
    }

    .visitor .body.alt {
      background: linear-gradient(to bottom, #22c55e, #15803d);
    }

    .visitor .legs {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 50%;
      height: 30%;
      border-radius: 999px;
      background: linear-gradient(to bottom, #1e293b, #020617);
      box-shadow:
        0 6px 12px rgba(15,23,42,0.9);
    }

    .visitor.v1 { left: 22%; bottom: 18%; }
    .visitor.v2 { left: 32%; bottom: 22%; }
    .visitor.v3 { right: 26%; bottom: 18%; }

    .visitor.v1 .body { background: linear-gradient(to bottom, #fbbf24, #eab308); }

    /* Koi fish */
    .koi {
      position: absolute;
      width: 7%;
      height: 9%;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fee2e2, #fecaca 24%, #fb7185 45%, #7f1d1d 80%);
      box-shadow:
        0 4px 10px rgba(15,23,42,0.75);
      transform-origin: 50% 50%;
      overflow: hidden;
    }

    .koi::before,
    .koi::after {
      content: "";
      position: absolute;
      border-radius: 999px;
    }

    .koi::before {
      inset: 12% 16%;
      background-image:
        repeating-linear-gradient(135deg, rgba(127,29,29,0.9) 0, rgba(127,29,29,0.9) 10%, transparent 10%, transparent 20%);
      mix-blend-mode: multiply;
      opacity: 0.9;
    }

    .koi::after {
      width: 40%;
      height: 40%;
      right: -20%;
      top: 30%;
      background: radial-gradient(circle at 20% 50%, #fecaca, #f97316 70%);
    }

    .koi.k1 { left: 20%; top: 40%; animation: swim1 26s linear infinite; }
    .koi.k2 { left: 38%; top: 50%; animation: swim2 24s linear infinite; }
    .koi.k3 { left: 58%; top: 32%; animation: swim3 30s linear infinite; }
    .koi.k4 { left: 70%; top: 60%; animation: swim4 32s linear infinite; }

    .koi.light {
      background: radial-gradient(circle at 20% 10%, #fefce8, #fed7aa 35%, #f97316 75%);
    }

    .koi.dark {
      background: radial-gradient(circle at 10% 0, #fef3c7, #f97316 35%, #0f172a 80%);
    }

    @keyframes swim1 {
      0%   { transform: translateX(-10%) translateY(0%) rotate(6deg); }
      25%  { transform: translateX(10%) translateY(-10%) rotate(14deg); }
      50%  { transform: translateX(22%) translateY(0%) rotate(0deg); }
      75%  { transform: translateX(4%) translateY(12%) rotate(-12deg); }
      100% { transform: translateX(-10%) translateY(0%) rotate(6deg); }
    }

    @keyframes swim2 {
      0%   { transform: translateX(0%) translateY(0%) rotate(-14deg); }
      25%  { transform: translateX(-12%) translateY(8%) rotate(-4deg); }
      50%  { transform: translateX(-4%) translateY(16%) rotate(10deg); }
      75%  { transform: translateX(10%) translateY(8%) rotate(2deg); }
      100% { transform: translateX(0%) translateY(0%) rotate(-14deg); }
    }

    @keyframes swim3 {
      0%   { transform: translateX(0%) translateY(0%) rotate(4deg); }
      25%  { transform: translateX(-4%) translateY(8%) rotate(-2deg); }
      50%  { transform: translateX(-14%) translateY(12%) rotate(-10deg); }
      75%  { transform: translateX(-4%) translateY(4%) rotate(4deg); }
      100% { transform: translateX(0%) translateY(0%) rotate(4deg); }
    }

    @keyframes swim4 {
      0%   { transform: translateX(6%) translateY(0%) rotate(-8deg); }
      25%  { transform: translateX(-4%) translateY(-10%) rotate(-16deg); }
      50%  { transform: translateX(-16%) translateY(-6%) rotate(0deg); }
      75%  { transform: translateX(2%) translateY(10%) rotate(10deg); }
      100% { transform: translateX(6%) translateY(0%) rotate(-8deg); }
    }

    /* Floating petals */
    .petal {
      position: absolute;
      width: 18px;
      height: 30px;
      border-radius: 999px 999px 999px 999px;
      background: radial-gradient(circle at 20% 0, #fee2e2, #fb7185);
      box-shadow:
        0 6px 12px rgba(15,23,42,0.9);
      opacity: 0.9;
      transform-origin: 50% 50%;
      filter: blur(1.2px);
      mix-blend-mode: screen;
    }

    .petal.p1 { left: 12%; top: 30%; animation: petalDrift1 28s linear infinite; }
    .petal.p2 { left: 26%; top: 16%; width: 22px; height: 34px; animation: petalDrift2 32s linear infinite; }
    .petal.p3 { left: 52%; top: 8%; width: 20px; height: 32px; animation: petalDrift3 26s linear infinite; }
    .petal.p4 { right: 20%; top: 24%; width: 24px; height: 36px; animation: petalDrift4 30s linear infinite; }

    @keyframes petalDrift1 {
      0%   { transform: translate3d(0,0,180px) rotateZ(10deg) rotateX(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate3d(140px, 140px, 220px) rotateZ(80deg) rotateX(20deg); opacity: 0.9; }
      90%  { opacity: 0; transform: translate3d(260px, 220px, 260px) rotateZ(120deg) rotateX(40deg); }
      100% { opacity: 0; transform: translate3d(0,0,180px) rotateZ(10deg) rotateX(0deg); }
    }

    @keyframes petalDrift2 {
      0%   { transform: translate3d(0,0,220px) rotateZ(-6deg) rotateX(8deg); opacity: 0; }
      15%  { opacity: 0.9; }
      55%  { transform: translate3d(80px, 180px, 260px) rotateZ(-40deg) rotateX(28deg); opacity: 1; }
      95%  { opacity: 0; transform: translate3d(200px, 260px, 300px) rotateZ(-80deg) rotateX(46deg); }
      100% { opacity: 0; transform: translate3d(0,0,220px) rotateZ(-6deg) rotateX(8deg); }
    }

    @keyframes petalDrift3 {
      0%   { transform: translate3d(0,0,240px) rotateZ(8deg) rotateX(0deg); opacity: 0; }
      10%  { opacity: 0.9; }
      45%  { transform: translate3d(-120px, 180px, 280px) rotateZ(-40deg) rotateX(24deg); opacity: 1; }
      90%  { opacity: 0; transform: translate3d(-240px, 260px, 320px) rotateZ(-90deg) rotateX(40deg); }
      100% { opacity: 0; transform: translate3d(0,0,240px) rotateZ(8deg) rotateX(0deg); }
    }

    @keyframes petalDrift4 {
      0%   { transform: translate3d(0,0,180px) rotateZ(-10deg) rotateX(4deg); opacity: 0; }
      12%  { opacity: 1; }
      55%  { transform: translate3d(-120px, 160px, 240px) rotateZ(40deg) rotateX(24deg); opacity: 0.9; }
      92%  { opacity: 0; transform: translate3d(-240px, 230px, 300px) rotateZ(80deg) rotateX(40deg); }
      100% { opacity: 0; transform: translate3d(0,0,180px) rotateZ(-10deg) rotateX(4deg); }
    }

    /* Depth vignette */
    .vignette {
      position: absolute;
      inset: -4%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 50% 35%, transparent 0, transparent 62%, rgba(15,23,42,0.8) 100%);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #app {
        padding: 8px;
      }
      .hud {
        padding: 12px 14px;
      }
      .hud-top {
        font-size: 10px;
      }
      .hud-bottom {
        font-size: 10px;
      }
      .hud-button {
        padding-inline: 10px;
      }
    }

  </style>
</head>
<body>
  <div id="app">
    <div class="frame">
      <div class="scene">
        <div class="world">
          <div class="layer sky layer-far">
            <div class="sun-glow"></div>
            <div class="mountain-range"></div>
            <div class="horizon-mist"></div>
          </div>

          <div class="layer garden-island layer-mid">
            <div class="island"></div>
            <div class="island-rim"></div>

            <div class="path"></div>

            <div class="pond layer-mid">
              <div class="pond-ripples"></div>
              <div class="koi k1 light"></div>
              <div class="koi k2 dark"></div>
              <div class="koi k3"></div>
              <div class="koi k4 light"></div>
            </div>

            <div class="bridge-group layer-near">
              <div class="bridge-arc"></div>
              <div class="bridge-deck"></div>
              <div class="bridge-rail"></div>
              <div class="bridge-pillars">
                <div class="bridge-post"></div>
                <div class="bridge-post"></div>
                <div class="bridge-post"></div>
                <div class="bridge-post"></div>
              </div>
            </div>

            <div class="pagoda layer-mid">
              <div class="pagoda-platform"></div>
              <div class="pagoda-stair"></div>

              <div class="pagoda-level level-1">
                <div class="pagoda-roof">
                  <div class="pagoda-eaves"></div>
                </div>
                <div class="pagoda-body"></div>
                <div class="pagoda-balcony"></div>
              </div>

              <div class="pagoda-level level-2">
                <div class="pagoda-roof">
                  <div class="pagoda-eaves"></div>
                </div>
                <div class="pagoda-body"></div>
                <div class="pagoda-balcony"></div>
              </div>

              <div class="pagoda-level level-3">
                <div class="pagoda-roof">
                  <div class="pagoda-eaves"></div>
                </div>
                <div class="pagoda-body"></div>
              </div>

              <div class="pagoda-spire"></div>
              <div class="pagoda-cap"></div>
            </div>

            <div class="tree cherry-left layer-mid">
              <div class="trunk"></div>
              <div class="canopy"></div>
            </div>

            <div class="tree cherry-right layer-far">
              <div class="trunk"></div>
              <div class="canopy"></div>
            </div>

            <div class="bamboo-clump layer-mid">
              <div class="bamboo-stalk"></div>
              <div class="bamboo-stalk"></div>
              <div class="bamboo-stalk"></div>
              <div class="bamboo-stalk"></div>
              <div class="bamboo-leaf"></div>
              <div class="bamboo-leaf"></div>
              <div class="bamboo-leaf"></div>
            </div>

            <div class="shrub s1 large layer-mid"></div>
            <div class="shrub s2 layer-mid"></div>
            <div class="shrub s3 layer-mid"></div>
            <div class="shrub s4 layer-mid"></div>
            <div class="shrub s5 layer-mid"></div>
            <div class="shrub s6 layer-mid"></div>

            <div class="rock r1 layer-mid"></div>
            <div class="rock r2 layer-mid"></div>
            <div class="rock r3 layer-mid"></div>
            <div class="rock r4 layer-mid"></div>
            <div class="rock r5 layer-mid"></div>

            <div class="lantern l1 layer-mid">
              <div class="lantern-body"></div>
              <div class="lantern-cap"></div>
              <div class="lantern-light"></div>
              <div class="lantern-base"></div>
            </div>

            <div class="lantern l2 layer-mid">
              <div class="lantern-body"></div>
              <div class="lantern-cap"></div>
              <div class="lantern-light"></div>
              <div class="lantern-base"></div>
            </div>

            <div class="lantern l3 layer-mid">
              <div class="lantern-body"></div>
              <div class="lantern-cap"></div>
              <div class="lantern-light"></div>
              <div class="lantern-base"></div>
            </div>

            <div class="visitor v1 layer-mid">
              <div class="head"></div>
              <div class="body"></div>
              <div class="legs"></div>
            </div>

            <div class="visitor v2 layer-mid">
              <div class="head"></div>
              <div class="body alt"></div>
              <div class="legs"></div>
            </div>

            <div class="visitor v3 layer-near">
              <div class="head"></div>
              <div class="body"></div>
              <div class="legs"></div>
            </div>

          </div> <!-- garden-island -->

          <div class="layer layer-near">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>

          <div class="layer vignette layer-near"></div>

        </div> <!-- world -->

        <div class="hud">
          <div class="hud-top">
            <div class="hud-pill">
              <div class="dot"></div>
              <span>Cinematic Garden Orbit</span>
            </div>
            <div class="hud-tagline">Click to pause · move cursor to subtly steer the camera</div>
          </div>

          <div class="hud-bottom">
            <div class="hud-meta">
              <span><strong>Depth-of-field</strong> adaptive focus</span>
              <span><strong>Lighting</strong> soft evening sun</span>
            </div>
            <div class="hud-controls">
              <button type="button" class="hud-button" id="toggle-play">Pause</button>
              <div class="hud-hint">Drag the scene with your cursor for parallax</div>
            </div>
          </div>
        </div>
      </div> <!-- frame inner -->
    </div> <!-- frame -->
  </div> <!-- app -->

  <script>
    (function() {
      const world = document.querySelector(".world");
      const playButton = document.getElementById("toggle-play");
      const nearLayers = document.querySelectorAll(".layer-near");
      const farLayers = document.querySelectorAll(".layer-far");
      const midLayers = document.querySelectorAll(".layer-mid");
      const sunGlow = document.querySelector(".sun-glow");
      const horizonMist = document.querySelector(".horizon-mist");

      let running = true;
      let start = performance.now();
      let mouseX = 0;
      let mouseY = 0;
      let targetMouseX = 0;
      let targetMouseY = 0;

      function updateMouse(e) {
        const w = window.innerWidth || 1;
        const h = window.innerHeight || 1;
        targetMouseX = (e.clientX / w - 0.5) * 2;
        targetMouseY = (e.clientY / h - 0.5) * 2;
      }

      window.addEventListener("pointermove", updateMouse, { passive: true });

      window.addEventListener("resize", function() {
        // Layout is fully responsive; placeholder for future hooks.
      });

      playButton.addEventListener("click", function() {
        running = !running;
        playButton.textContent = running ? "Pause" : "Play";
        if (running) {
          start = performance.now() - lastElapsed * 1000;
          requestAnimationFrame(loop);
        }
      });

      let lastElapsed = 0;

      function loop(now) {
        if (!running) return;

        if (!start) start = now;
        const elapsed = (now - start) / 1000;
        lastElapsed = elapsed;

        const orbitDuration = 32; // seconds for full cinematic orbit
        const phase = (elapsed % orbitDuration) / orbitDuration;
        const angle = phase * Math.PI * 2;

        mouseX += (targetMouseX - mouseX) * 0.06;
        mouseY += (targetMouseY - mouseY) * 0.06;

        const baseTiltX = 60;
        const basePanY = -26;
        const orbitStrength = 26;
        const verticalDrift = 6;
        const dollyDepth = -120;

        const camRotX = baseTiltX + Math.sin(angle * 0.7) * verticalDrift - mouseY * 6;
        const camRotY = basePanY + Math.sin(angle) * orbitStrength + mouseX * 8;
        const camZ = dollyDepth - Math.cos(angle * 0.8) * 24;

        world.style.transform =
          "rotateX(" + camRotX.toFixed(2) + "deg) rotateY(" + camRotY.toFixed(2) + "deg) translateZ(" + camZ.toFixed(1) + "px)";

        const focusWave = 0.5 + Math.sin(angle * 1.2) * 0.28;
        const nearBlur = 1.6 + (1 - focusWave) * 1.6;
        const farBlur = 1.2 + focusWave * 1.6;

        nearLayers.forEach(function(el) {
          el.style.filter =
            "blur(" + nearBlur.toFixed(2) + "px) saturate(1.05) brightness(1.05)";
        });

        farLayers.forEach(function(el) {
          el.style.filter =
            "blur(" + farBlur.toFixed(2) + "px) saturate(0.96) brightness(0.96)";
        });

        midLayers.forEach(function(el) {
          el.style.filter =
            "blur(0.35px) saturate(1.06) brightness(1.04)";
        });

        if (sunGlow) {
          const sunPulse = 0.75 + Math.sin(angle * 1.5) * 0.08;
          sunGlow.style.opacity = sunPulse.toFixed(2);
        }

        if (horizonMist) {
          const mistPulse = 0.65 + (1 - Math.cos(angle * 1.1)) * 0.12;
          horizonMist.style.opacity = mistPulse.toFixed(2);
        }

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>

  <!-- Tailwind CDN as required (optional enhancement) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
