<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura Pavilion — a living diorama</title>
<style>
  :root{
    --paper:#fbfaf7;
    --paper-2:#e9e6df;
    --ink:#2f2a26;
    --ink-soft:#6d655c;
    --lacquer:#a03a32;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit;}
  html,body{height:100%;margin:0;background:var(--paper);}
  body{
    overflow:hidden;
    color:var(--ink);
    font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 18%, #ffffff 0%, #f6f4f0 46%, #e6e2da 100%);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  /* ——— optical layers ——— */
  .lens{position:absolute;left:0;right:0;pointer-events:none;}
  .lens-far{
    top:0;height:46%;
    -webkit-backdrop-filter:blur(3.5px);backdrop-filter:blur(3.5px);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 26%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 26%,transparent 100%);
  }
  .lens-near{
    bottom:0;height:34%;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 14%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 14%,transparent 100%);
  }
  .grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.55;
    background:linear-gradient(200deg,#fff2d8 0%,rgba(255,255,255,0) 42%,#c9d6e8 100%);}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(112% 86% at 50% 44%,rgba(0,0,0,0) 52%,rgba(60,54,48,.20) 100%);}
  .grain{position:absolute;inset:-60px;pointer-events:none;opacity:.055;mix-blend-mode:multiply;
    background-repeat:repeat;animation:drift 1.1s steps(3,end) infinite;}
  @keyframes drift{
    0%{transform:translate3d(0,0,0)} 33%{transform:translate3d(-7px,5px,0)}
    66%{transform:translate3d(6px,-6px,0)} 100%{transform:translate3d(0,0,0)}
  }

  /* ——— type ——— */
  .plate{position:absolute;left:clamp(20px,4vw,56px);top:clamp(20px,4vh,46px);
    pointer-events:none;max-width:22rem;
    opacity:0;animation:rise 2.4s cubic-bezier(.2,.7,.2,1) .5s forwards;}
  .plate .jp{display:block;font-size:clamp(26px,3.4vw,40px);letter-spacing:.34em;
    color:var(--lacquer);line-height:1;margin:0 0 .5rem;font-weight:400;}
  .plate h1{margin:0;font-size:clamp(17px,1.6vw,22px);font-weight:400;letter-spacing:.09em;}
  .plate p{margin:.55rem 0 0;font-size:13.5px;line-height:1.65;color:var(--ink-soft);
    max-width:26ch;font-style:italic;}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .keys{position:absolute;left:50%;bottom:clamp(16px,3.4vh,34px);transform:translateX(-50%);
    display:flex;gap:1.4rem;font-family:ui-sans-serif,system-ui,"Helvetica Neue",sans-serif;
    font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);
    background:rgba(255,255,255,.52);border:1px solid rgba(47,42,38,.09);
    padding:.5rem 1.1rem;border-radius:999px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;animation:rise 1.6s ease 2.6s forwards, sink 2s ease 11s forwards;}
  .keys b{font-weight:600;color:var(--ink);}
  .keys.stay{animation:rise 1.6s ease 2.6s forwards;}
  @keyframes sink{to{opacity:0;transform:translateX(-50%) translateY(8px)}}

  .stamp{position:absolute;right:clamp(18px,3.4vw,42px);top:clamp(20px,4vh,46px);
    width:58px;height:58px;border-radius:5px;background:var(--lacquer);color:#fff;
    display:grid;place-items:center;font-size:21px;letter-spacing:.06em;line-height:1.05;
    text-align:center;opacity:0;transform:rotate(-4deg);
    animation:stamp 1.1s cubic-bezier(.2,1.4,.3,1) 1.7s forwards;
    box-shadow:0 8px 22px -12px rgba(160,58,50,.8);}
  @keyframes stamp{0%{opacity:0;transform:rotate(-16deg) scale(1.5)}to{opacity:.92;transform:rotate(-4deg) scale(1)}}

  .boot{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);
    font-size:12px;letter-spacing:.24em;color:var(--ink-soft);transition:opacity .9s ease;
    font-family:ui-sans-serif,system-ui,sans-serif;}
  .boot.gone{opacity:0;pointer-events:none;}
  .fail{position:absolute;inset:0;display:none;place-items:center;padding:2rem;text-align:center;
    font-size:14px;line-height:1.7;color:var(--ink-soft);}
  @media (prefers-reduced-motion:reduce){.grain{animation:none}}
  @media (max-width:640px){
    .plate p{display:none}
    .stamp{width:46px;height:46px;font-size:17px}
    .keys{gap:.9rem;font-size:10.5px;padding:.45rem .8rem}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="lens lens-far"></div>
  <div class="lens lens-near"></div>
  <div class="grade"></div>
  <div class="vignette"></div>
  <div class="grain" id="grain"></div>

  <div class="plate">
    <span class="jp">桜閣</span>
    <h1>Sakura Pavilion</h1>
    <p>Three roofs, one koi pond, and a wind that never quite stops.</p>
  </div>
  <div class="stamp">桜</div>
  <div class="keys" id="keys">
    <span><b>Drag</b> to look</span>
    <span><b>Scroll</b> to move closer</span>
    <span><b>Space</b> holds the camera</span>
  </div>

  <div class="boot" id="boot">BUILDING THE GARDEN</div>
  <div class="fail" id="fail">This scene needs WebGL. Try a current desktop or mobile browser with hardware acceleration switched on.</div>
</div>

<script>
"use strict";
(function(){

/* ============================================================
   0 — small math kit
   ============================================================ */
var PI = Math.PI, cos = Math.cos, sin = Math.sin, sqrt = Math.sqrt;
var min = Math.min, max = Math.max, abs = Math.abs, pow = Math.pow, floor = Math.floor;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(e0,e1,x){ var t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function smin(a,b,k){ var h=clamp(0.5+0.5*(b-a)/k,0,1); return lerp(b,a,h)-k*h*(1-h); }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
function scl(a,s){ return [a[0]*s,a[1]*s,a[2]*s]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function norm(a){ var l=sqrt(dot(a,a))||1; return [a[0]/l,a[1]/l,a[2]/l]; }

function persp(fovy,asp,n,f){
  var t=1/Math.tan(fovy/2);
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]);
}
function lookAt(eye,ctr,up){
  var z=norm(sub(eye,ctr)), x=norm(cross(up,z)), y=cross(z,x);
  return new Float32Array([
    x[0],y[0],z[0],0,
    x[1],y[1],z[1],0,
    x[2],y[2],z[2],0,
    -dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
}
function trs(x,y,z,yaw,s){
  s = (s===undefined)?1:s;
  var c=cos(yaw), n=sin(yaw);
  return new Float32Array([c*s,0,-n*s,0, 0,s,0,0, n*s,0,c*s,0, x,y,z,1]);
}
function m3yaw(yaw){ var c=cos(yaw), n=sin(yaw); return new Float32Array([c,0,-n, 0,1,0, n,0,c]); }
var IDENT4 = trs(0,0,0,0,1), IDENT3 = m3yaw(0);

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function hx(h){ return [parseInt(h.substr(1,2),16)/255, parseInt(h.substr(3,2),16)/255, parseInt(h.substr(5,2),16)/255]; }
function tint(c,f){ return [clamp(c[0]*f,0,1.6),clamp(c[1]*f,0,1.6),clamp(c[2]*f,0,1.6)]; }
function mixc(a,b,t){ return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }

function vnoise(x,y){
  function h(i,j){ var s=sin(i*127.1+j*311.7)*43758.5453; return s-floor(s); }
  var i=floor(x), j=floor(y), fx=x-i, fy=y-j;
  fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  return lerp(lerp(h(i,j),h(i+1,j),fx), lerp(h(i,j+1),h(i+1,j+1),fx), fy);
}

/* ============================================================
   1 — the garden's ground truth (shared by CPU + GPU)
   ============================================================ */
var ISLE_HALF = 10.0, ISLE_R = 4.5, ISLE_DEEP = 1.75;

// pond = smooth union of two ellipses
function ellD(x,z,cx,cz,rx,rz){ var a=(x-cx)/rx, b=(z-cz)/rz; return (sqrt(a*a+b*b)-1)*min(rx,rz); }
function pondDist(x,z){ return smin(ellD(x,z,5.2,2.2,3.8,3.0), ellD(x,z,1.4,7.0,2.6,2.0), 0.9); }

function isleSDF(x,z){
  var qx=abs(x)-(ISLE_HALF-ISLE_R), qy=abs(z)-(ISLE_HALF-ISLE_R);
  var mx=max(qx,0), my=max(qy,0);
  return sqrt(mx*mx+my*my)+min(max(qx,qy),0)-ISLE_R;
}
function isleRadius(th){ // distance from origin to the rim at angle th
  var dx=cos(th), dz=sin(th), r=ISLE_HALF*1.4;
  for(var i=0;i<28;i++) r -= isleSDF(dx*r, dz*r);
  return r;
}

var WATER_Y = -0.25;
function groundY(x,z){
  var mound = 0.10*sin(x*0.36)*cos(z*0.31) + 0.07*(vnoise(x*0.22+4.1, z*0.22-2.7)-0.5);
  var d = pondDist(x,z);
  var depth = d<0 ? 1.25*pow(clamp(-d/2.0,0,1),0.55) : 0;
  return mound - depth;
}

var PATH = [[-7.4,8.6],[-6.3,7.4],[-5.2,6.4],[-4.2,5.6],[-3.0,5.0],[-1.8,4.4],[-1.0,4.0],[-0.5,3.7]];
var PATHB = [[-3.0,5.0],[-1.6,5.2],[-0.6,4.9],[0.0,4.6],[2.6,9.0],[3.8,8.4]];
function segD(px,pz,a,b){
  var ax=b[0]-a[0], az=b[1]-a[1], vx=px-a[0], vz=pz-a[1];
  var h=clamp((vx*ax+vz*az)/(ax*ax+az*az||1),0,1);
  var dx=vx-ax*h, dz=vz-az*h; return sqrt(dx*dx+dz*dz);
}
function pathDist(x,z){
  var d=1e9,i;
  for(i=0;i<PATH.length-1;i++) d=min(d,segD(x,z,PATH[i],PATH[i+1]));
  for(i=0;i<PATHB.length-1;i++) d=min(d,segD(x,z,PATHB[i],PATHB[i+1]));
  return d;
}

// pagoda footprint (for scatter rejection)
var PG = {x:-0.5, z:-2.5, half:5.0};
function nearPagoda(x,z){ return abs(x-PG.x)<PG.half && abs(z-PG.z)<PG.half; }

// bridge arc
var BR0=[0.0,4.6], BR1=[2.6,9.0];
function bridgePt(t){
  var x=lerp(BR0[0],BR1[0],t), z=lerp(BR0[1],BR1[1],t);
  var y=lerp(groundY(BR0[0],BR0[1])+0.15, groundY(BR1[0],BR1[1])+0.15, t) + 1.25*sin(PI*t);
  return [x,y,z];
}

/* ============================================================
   2 — palette
   ============================================================ */
var C = {
  roof:   hx('#34343c'), roofRidge: hx('#4b4b55'), roofUnder: hx('#453a33'),
  wall:   hx('#f3efe6'), wallDim: hx('#ded8cc'),
  red:    hx('#a33a33'), redDark: hx('#7e2b26'), redLite: hx('#bc4b41'),
  gold:   hx('#d2a33f'),
  stone:  hx('#c3bdb2'), stoneDk: hx('#9c968c'),
  soil:   hx('#6d5b47'), soilDk: hx('#473c31'), grassLip: hx('#728b40'),
  trunk:  hx('#7a5c46'), trunkDk: hx('#5d4534'),
  bloom1: hx('#f7c9d8'), bloom2: hx('#efb2c8'), bloom3: hx('#fce3ec'),
  bamboo: hx('#84a94a'), bambooDk: hx('#6a8d3a'), leaf: hx('#8fbb53'),
  bush:   hx('#4e6b31'), bushLite: hx('#5f7d3c'),
  rock:   hx('#b3aea6'), rockDk: hx('#8e8a82'),
  wood:   hx('#b98358'), koiW: hx('#f6f3ee'), koiO: hx('#e2703a'), koiK: hx('#3b3a3a')
};

/* ============================================================
   3 — mesh building
   ============================================================ */
function Mesh(){ this.a=[]; this.count=0; }
Mesh.prototype.push = function(p,n,c,s){
  this.a.push(p[0],p[1],p[2], n[0],n[1],n[2], c[0],c[1],c[2], s||0);
  this.count++;
};
Mesh.prototype.triF = function(a,b,c,col,sw){
  var n=norm(cross(sub(b,a),sub(c,a)));
  if(!isFinite(n[0])) n=[0,1,0];
  this.push(a,n,col,sw); this.push(b,n,col,sw); this.push(c,n,col,sw);
};
Mesh.prototype.quadF = function(a,b,c,d,col,sw){ this.triF(a,b,c,col,sw); this.triF(a,c,d,col,sw); };
Mesh.prototype.triS = function(p,n,c,s){ // arrays of 3
  this.push(p[0],n[0],c[0],s[0]); this.push(p[1],n[1],c[1],s[1]); this.push(p[2],n[2],c[2],s[2]);
};
Mesh.prototype.quadS = function(p,n,c,s){
  this.triS([p[0],p[1],p[2]],[n[0],n[1],n[2]],[c[0],c[1],c[2]],[s[0],s[1],s[2]]);
  this.triS([p[0],p[2],p[3]],[n[0],n[2],n[3]],[c[0],c[2],c[3]],[s[0],s[2],s[3]]);
};
Mesh.prototype.upload = function(gl){
  this.buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.a), gl.STATIC_DRAW);
  this.a = null;
  return this;
};

/* generic smooth grid surface: f(i,j) -> [x,y,z, r,g,b, sway] */
function grid(M, nu, nv, f, wrapU){
  var P=[],Cc=[],S=[],i,j;
  for(i=0;i<=nu;i++){ P[i]=[];Cc[i]=[];S[i]=[];
    for(j=0;j<=nv;j++){ var r=f(i,j); P[i][j]=[r[0],r[1],r[2]]; Cc[i][j]=[r[3],r[4],r[5]]; S[i][j]=r[6]||0; } }
  var N=[];
  for(i=0;i<=nu;i++){ N[i]=[];
    for(j=0;j<=nv;j++){
      var im = wrapU ? (i-1+nu)%nu : max(i-1,0);
      var ip = wrapU ? (i+1)%nu : min(i+1,nu);
      var jm = max(j-1,0), jp = min(j+1,nv);
      var n = cross(sub(P[ip][j],P[im][j]), sub(P[i][jp],P[i][jm]));
      var l = sqrt(dot(n,n));
      N[i][j] = l>1e-9 ? [n[0]/l,n[1]/l,n[2]/l] : [0,1,0];
    } }
  for(i=0;i<nu;i++) for(j=0;j<nv;j++){
    M.quadS([P[i][j],P[i+1][j],P[i+1][j+1],P[i][j+1]],
            [N[i][j],N[i+1][j],N[i+1][j+1],N[i][j+1]],
            [Cc[i][j],Cc[i+1][j],Cc[i+1][j+1],Cc[i][j+1]],
            [S[i][j],S[i+1][j],S[i+1][j+1],S[i][j+1]]);
  }
}

function box(M,cx,cy,cz,sx,sy,sz,col,yaw,o){
  o=o||{}; yaw=yaw||0;
  var c=cos(yaw), s=sin(yaw), ao=o.ao===undefined?0.22:o.ao, sw=o.sway||0;
  var hx2=sx/2, hy=sy/2, hz=sz/2;
  function V(x,y,z){ return [cx+x*c+z*s, cy+y, cz-x*s+z*c]; }
  var p=[ V(-hx2,-hy,-hz),V(hx2,-hy,-hz),V(hx2,-hy,hz),V(-hx2,-hy,hz),
          V(-hx2,hy,-hz), V(hx2,hy,-hz), V(hx2,hy,hz), V(-hx2,hy,hz)];
  var lo=tint(col,1-ao), hi=col;
  M.quadF(p[4],p[5],p[6],p[7], tint(col,1.05), sw);         // top
  M.quadF(p[3],p[2],p[1],p[0], lo, 0);                       // bottom
  // sides get a vertical AO gradient via two bands
  var mid=[];
  for(var k=0;k<4;k++) mid.push([lerp(p[k][0],p[k+4][0],0.5), lerp(p[k][1],p[k+4][1],0.5), lerp(p[k][2],p[k+4][2],0.5)]);
  var md=tint(col,1-ao*0.45);
  var seq=[[0,1],[1,2],[2,3],[3,0]];
  for(k=0;k<4;k++){
    var a=seq[k][0], b=seq[k][1];
    M.quadS([p[a],p[b],mid[b],mid[a]],
            [normSide(p[a],p[b]),normSide(p[a],p[b]),normSide(p[a],p[b]),normSide(p[a],p[b])],
            [lo,lo,md,md],[0,0,sw*0.5,sw*0.5]);
    M.quadS([mid[a],mid[b],p[b+4],p[a+4]],
            [normSide(p[a],p[b]),normSide(p[a],p[b]),normSide(p[a],p[b]),normSide(p[a],p[b])],
            [md,md,hi,hi],[sw*0.5,sw*0.5,sw,sw]);
  }
  function normSide(a,b){ var d=sub(b,a); return norm([d[2],0,-d[0]]); }
}

function tube(M,p0,p1,r0,r1,seg,col,o){
  o=o||{};
  var ax=norm(sub(p1,p0));
  var up = abs(ax[1])>0.9 ? [1,0,0] : [0,1,0];
  var u=norm(cross(up,ax)), v=cross(ax,u);
  var s0=o.sway0||0, s1=o.sway1||0, cap=o.cap!==false;
  var ringA=[],ringB=[],nrm=[],i;
  for(i=0;i<=seg;i++){
    var a=i/seg*PI*2, ca=cos(a), sa=sin(a);
    var dir=[u[0]*ca+v[0]*sa, u[1]*ca+v[1]*sa, u[2]*ca+v[2]*sa];
    ringA.push(add(p0,scl(dir,r0))); ringB.push(add(p1,scl(dir,r1))); nrm.push(dir);
  }
  var lo=tint(col,0.86);
  for(i=0;i<seg;i++){
    M.quadS([ringA[i],ringA[i+1],ringB[i+1],ringB[i]],
            [nrm[i],nrm[i+1],nrm[i+1],nrm[i]],
            [lo,lo,col,col],[s0,s0,s1,s1]);
  }
  if(cap && r1>0.001) for(i=0;i<seg;i++) M.triF(p1,ringB[i],ringB[i+1],tint(col,1.05),s1);
  if(cap && r0>0.001) for(i=0;i<seg;i++) M.triF(p0,ringA[i+1],ringA[i],tint(col,0.8),s0);
}

function blob(M,cx,cy,cz,rx,ry,rz,su,sv,col,o){
  o=o||{};
  var jit=o.jitter||0, sw=o.sway||0, flat=!!o.flat, seed=o.seed||7, shade=o.shade||0.16;
  var R=rng(seed*977+13);
  var jmap=[],i,j;
  for(i=0;i<=su;i++){ jmap[i]=[]; for(j=0;j<=sv;j++) jmap[i][j]= 1 + (R()-0.5)*2*jit; }
  for(i=0;i<=su;i++) jmap[i][0]=jmap[0][0], jmap[i][sv]=jmap[0][sv];
  for(j=0;j<=sv;j++) jmap[su][j]=jmap[0][j];
  function P(i,j){
    var a=i/su*PI*2, b=j/sv*PI - PI/2, k=jmap[i][j];
    return [cx+cos(b)*cos(a)*rx*k, cy+sin(b)*ry*k, cz+cos(b)*sin(a)*rz*k];
  }
  function Cl(j){ return tint(col, 1 - shade*(1 - j/sv)); }
  for(i=0;i<su;i++) for(j=0;j<sv;j++){
    var a=P(i,j),b=P(i+1,j),c=P(i+1,j+1),d=P(i,j+1);
    if(flat){ M.quadF(a,b,c,d, Cl((j+0.5)), sw); }
    else{
      var na=norm(sub(a,[cx,cy,cz])),nb=norm(sub(b,[cx,cy,cz])),nc=norm(sub(c,[cx,cy,cz])),nd=norm(sub(d,[cx,cy,cz]));
      M.quadS([a,b,c,d],[na,nb,nc,nd],[Cl(j),Cl(j),Cl(j+1),Cl(j+1)],[sw*(j/sv),sw*(j/sv),sw*((j+1)/sv),sw*((j+1)/sv)]);
    }
  }
}

var SHADOWS = [];   // {x,z,rx,rz,rot,str}
function shadow(x,z,rx,rz,str,rot){
  var sx = x + 1.35*rx*0.42, sz = z + 0.9*rz*0.32;   // pushed away from the sun
  SHADOWS.push({x:sx, z:sz, rx:rx, rz:rz, rot:rot||0, str:str===undefined?0.5:str, y:groundY(sx,sz)+0.035});
}

/* ---------- island ---------- */
function buildIsland(G, P){
  var NA=176, NR=50, rim=[];
  for(var i=0;i<=NA;i++){ var th=i/NA*PI*2; rim.push(isleRadius(th)); }
  grid(G, NA, NR, function(i,j){
    var th=i/NA*PI*2, u=pow(j/NR,0.82), r=rim[i]*u;
    var x=cos(th)*r, z=sin(th)*r;
    return [x, groundY(x,z), z, 1,1,1, 0];   // colour comes from the shader
  }, true);

  // rim skirt: grass lip → soil → dark base
  var steps=[[0.0,0.0,C.grassLip,1.0],[0.10,-0.22,C.soil,0.995],[0.5,-0.95,C.soil,0.96],[1.0,-ISLE_DEEP,C.soilDk,0.9]];
  grid(P, NA, steps.length-1, function(i,j){
    var th=i/NA*PI*2, s=steps[j], r=rim[i]*s[3];
    var x=cos(th)*r, z=sin(th)*r;
    var y = j===0 ? groundY(x,z) : s[1];
    var n = vnoise(x*0.6+9, z*0.6-3);
    var col = tint(s[2], 0.88+0.24*n);
    return [x,y,z, col[0],col[1],col[2], 0];
  }, true);

  // flat underside
  var cap=[];
  for(var k=0;k<=NA;k++){ var t=k/NA*PI*2; cap.push([cos(t)*rim[k]*0.9, -ISLE_DEEP, sin(t)*rim[k]*0.9]); }
  for(k=0;k<NA;k++) P.triF([0,-ISLE_DEEP-0.05,0], cap[k+1], cap[k], tint(C.soilDk,0.7), 0);
}

function buildWater(W){
  // only emit quads that touch the pond — the sheet must never reach the island rim
  var NX=104, NZ=104, x0=-3.2, x1=9.6, z0=-1.6, z1=9.8, white=[1,1,1];
  for(var i=0;i<NX;i++) for(var j=0;j<NZ;j++){
    var xa=lerp(x0,x1,i/NX), xb=lerp(x0,x1,(i+1)/NX);
    var za=lerp(z0,z1,j/NZ), zb=lerp(z0,z1,(j+1)/NZ);
    var d=min(min(pondDist(xa,za),pondDist(xb,za)),min(pondDist(xb,zb),pondDist(xa,zb)));
    if(d>0.30) continue;
    W.quadF([xa,WATER_Y,za],[xb,WATER_Y,za],[xb,WATER_Y,zb],[xa,WATER_Y,zb], white, 0);
  }
}

/* ---------- pagoda ---------- */
function roofY(u,v,h,up){
  var au=abs(u), av=abs(v), r=max(au,av), m=min(au,av);
  var corner = r>1e-4 ? m/r : 0;
  var base = h*pow(max(1-r,0),1.25);
  var sag  = -0.15*h*sin(PI*clamp(r,0,1));
  var lift = up*pow(clamp(r,0,1),7)*(0.34+0.98*corner);
  return base+sag+lift;
}
function buildRoof(M, cx, cz, baseY, half, h, up, thick){
  var N = half>2.0 ? 26 : 12;
  function pos(i,j){
    var u=i/N*2-1, v=j/N*2-1;
    return [cx+u*half, baseY+roofY(u,v,h,up), cz+v*half, u, v];
  }
  function col(u,v){
    var au=abs(u),av=abs(v), r=max(au,av);
    var t=(au>av? v:u)*half;
    var c=tint(C.roof, 0.93+0.075*sin(t*5.2));
    var hip=Math.exp(-pow((au-av)*5.5,2));
    c=mixc(c, C.roofRidge, hip*0.5*smoothstep(0.3,0.95,r));
    c=mixc(c, C.roofRidge, smoothstep(0.2,0.05,r));
    return c;
  }
  grid(M,N,N,function(i,j){ var p=pos(i,j), c=col(p[3],p[4]); return [p[0],p[1],p[2],c[0],c[1],c[2],0]; },false);
  grid(M,N,N,function(i,j){ var p=pos(i,j); var c=tint(C.roofUnder, 0.9+0.15*abs(p[3]*p[4]));
        return [p[0],p[1]-thick,p[2],c[0],c[1],c[2],0]; },false);
  // eave edge band
  for(var i=0;i<N;i++){
    var a=pos(i,0), b=pos(i+1,0);
    M.quadF([a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0],b[1]-thick,b[2]],[a[0],a[1]-thick,a[2]], tint(C.roofRidge,1.05),0);
    a=pos(i,N); b=pos(i+1,N);
    M.quadF([a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0],b[1]-thick,b[2]],[a[0],a[1]-thick,a[2]], tint(C.roofRidge,1.05),0);
    a=pos(0,i); b=pos(0,i+1);
    M.quadF([a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0],b[1]-thick,b[2]],[a[0],a[1]-thick,a[2]], tint(C.roofRidge,1.05),0);
    a=pos(N,i); b=pos(N,i+1);
    M.quadF([a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0],b[1]-thick,b[2]],[a[0],a[1]-thick,a[2]], tint(C.roofRidge,1.05),0);
  }
  // gilded corner bosses + eave beads
  var corners=[[1,1],[1,-1],[-1,1],[-1,-1]];
  for(i=0;i<4;i++){
    var u=corners[i][0], v=corners[i][1];
    var y=baseY+roofY(u,v,h,up);
    box(M, cx+u*half*0.985, y+0.12, cz+v*half*0.985, 0.34,0.34,0.34, C.gold, PI/4, {ao:0.1});
  }
  for(i=1;i<N;i+=3){
    var p=pos(i,N); blob(M,p[0],p[1]-thick-0.06,p[2],0.075,0.075,0.075,6,4,C.gold,{shade:0.1});
    p=pos(i,0);     blob(M,p[0],p[1]-thick-0.06,p[2],0.075,0.075,0.075,6,4,C.gold,{shade:0.1});
  }
}

function railing(M,cx,cz,half,y,h,col){
  var per=Math.round(half*2/0.62);
  for(var side=0;side<4;side++){
    var sx = side===0?1:(side===1?-1:0), sz = side===2?1:(side===3?-1:0);
    for(var i=0;i<=per;i++){
      var t=i/per*2-1;
      var px = sx!==0 ? sx*half : t*half;
      var pz = sz!==0 ? sz*half : t*half;
      if(sx!==0) pz=t*half;
      box(M, cx+px, y+h/2, cz+pz, 0.1,h,0.1, col, 0, {ao:0.25});
    }
    // rails
    var a = sx!==0 ? [cx+sx*half, y+h-0.07, cz] : [cx, y+h-0.07, cz+sz*half];
    box(M, a[0],a[1],a[2], sx!==0?0.15:half*2, 0.14, sx!==0?half*2:0.15, tint(col,1.06),0,{ao:0.14});
    box(M, a[0],y+h*0.5,a[2], sx!==0?0.1:half*2, 0.09, sx!==0?half*2:0.1, tint(col,0.94),0,{ao:0.2});
  }
}

function buildPagoda(M){
  var cx=PG.x, cz=PG.z;
  // stone podium
  box(M,cx,-0.1,cz, 9.6,0.5,9.6, tint(C.stone,0.95),0,{ao:0.3});
  box(M,cx,0.38,cz, 9.0,0.5,9.0, C.stone,0,{ao:0.24});
  box(M,cx,0.78,cz, 8.4,0.34,8.4, tint(C.stone,1.05),0,{ao:0.18});
  // stairs
  for(var s=0;s<4;s++){
    var y=0.95-s*0.245;
    box(M,cx,y-0.12,cz+4.35+s*0.42, 2.8,0.26,0.46, tint(C.stone,1.02-s*0.02),0,{ao:0.22});
  }
  box(M,cx-1.55,0.5,cz+4.9, 0.28,1.0,1.9, tint(C.stone,0.96),0,{ao:0.25});
  box(M,cx+1.55,0.5,cz+4.9, 0.28,1.0,1.9, tint(C.stone,0.96),0,{ao:0.25});

  var tiers=[
    {y0:0.95, h:3.35, half:3.35, roofHalf:5.15, roofH:1.75, up:0.62, thick:0.3},
    {y0:5.75, h:2.35, half:2.80, roofHalf:4.40, roofH:1.55, up:0.56, thick:0.27},
    {y0:9.15, h:1.95, half:2.35, roofHalf:3.75, roofH:2.15, up:0.52, thick:0.25}
  ];
  for(var t=0;t<tiers.length;t++){
    var T=tiers[t], y0=T.y0, hh=T.half;
    // wall block
    box(M,cx,y0+T.h/2,cz, hh*2,T.h,hh*2, C.wall,0,{ao:0.2});
    // sill + head bands
    box(M,cx,y0+0.16,cz, hh*2+0.26,0.32,hh*2+0.26, C.red,0,{ao:0.2});
    box(M,cx,y0+T.h-0.18,cz, hh*2+0.30,0.36,hh*2+0.30, C.red,0,{ao:0.18});
    // corner posts
    for(var q=0;q<4;q++){
      var sx=(q&1)?1:-1, sz=(q&2)?1:-1;
      box(M,cx+sx*hh,y0+T.h/2,cz+sz*hh, 0.42,T.h,0.42, C.redLite,0,{ao:0.26});
    }
    // panels / doors on all faces
    var panels = t===0?3:2;
    for(var f=0;f<4;f++){
      var ang=f*PI/2, dx=sin(ang), dz=cos(ang);
      for(var p=0;p<panels;p++){
        var o=(p/(panels-1||1)-0.5)*hh*1.28;
        var px=cx+dx*(hh+0.03)+cos(ang)*o, pz=cz+dz*(hh+0.03)-sin(ang)*o;
        var isDoor = (t===0 && f===0);
        box(M,px,y0+T.h*0.52,pz, isDoor?1.5:1.35, T.h*0.62, 0.1, isDoor?C.redDark:C.wallDim, -ang, {ao:0.16});
        box(M,px,y0+T.h*0.52,pz, isDoor?1.62:1.46, T.h*0.68, 0.05, C.red, -ang, {ao:0.1});
        if(isDoor) blob(M,px+0.0,y0+T.h*0.5,pz+0.09,0.07,0.07,0.07,6,4,C.gold,{});
      }
    }
    buildRoof(M,cx,cz,y0+T.h,T.roofHalf,T.roofH,T.up,T.thick);
    // veranda deck above the roof
    if(t<2){
      var vy=tiers[t+1].y0-0.18;
      box(M,cx,vy,cz, tiers[t+1].half*2+1.5, 0.22, tiers[t+1].half*2+1.5, tint(C.wood,0.95),0,{ao:0.24});
      railing(M,cx,cz,tiers[t+1].half+0.7, vy+0.1, 0.72, C.red);
    }
  }
  // finial
  var fy=tiers[2].y0+tiers[2].h+tiers[2].roofH;
  tube(M,[cx,fy-0.3,cz],[cx,fy+1.5,cz],0.11,0.05,8,C.gold,{});
  for(var r=0;r<5;r++) tube(M,[cx,fy+0.05+r*0.22,cz],[cx,fy+0.13+r*0.22,cz],0.28-r*0.04,0.28-r*0.04,10,C.gold,{});
  blob(M,cx,fy+1.34,cz,0.16,0.2,0.16,8,6,C.gold,{});
  shadow(cx,cz,5.6,5.6,0.55,0);
}

/* ---------- flora ---------- */
function cherryTree(M,x,z,s,seed){
  var R=rng(seed);
  var gy=groundY(x,z);
  var lean=[(R()-0.5)*0.5, 0, (R()-0.5)*0.5];
  var top=[x+lean[0]*s, gy+3.1*s, z+lean[2]*s];
  tube(M,[x,gy-0.2,z],[x+lean[0]*s*0.5,gy+1.7*s,z+lean[2]*s*0.5],0.42*s,0.3*s,9,C.trunkDk,{cap:false});
  tube(M,[x+lean[0]*s*0.5,gy+1.7*s,z+lean[2]*s*0.5],top,0.3*s,0.2*s,9,C.trunk,{cap:false});
  var nb=5+floor(R()*3);
  var ends=[];
  for(var i=0;i<nb;i++){
    var a=(i/nb)*PI*2 + R()*0.6;
    var len=(1.5+R()*1.3)*s;
    var e=[top[0]+cos(a)*len, top[1]+(0.7+R()*0.9)*s, top[2]+sin(a)*len];
    tube(M,top,e,0.19*s,0.08*s,7,C.trunk,{sway0:0.03,sway1:0.1});
    // twig
    var e2=[e[0]+cos(a)*0.7*s, e[1]+0.5*s, e[2]+sin(a)*0.7*s];
    tube(M,e,e2,0.08*s,0.03*s,6,C.trunk,{sway0:0.1,sway1:0.16});
    ends.push(e2);
  }
  // canopy: clustered blossom blobs
  var blooms=[C.bloom1,C.bloom2,C.bloom3];
  for(i=0;i<ends.length;i++){
    for(var k=0;k<4;k++){
      var e=ends[i];
      var rx=(0.85+R()*0.75)*s, ry=rx*(0.6+R()*0.25);
      blob(M, e[0]+(R()-0.5)*1.5*s, e[1]+(R()-0.4)*0.9*s, e[2]+(R()-0.5)*1.5*s,
           rx, ry, rx, 9, 6, blooms[floor(R()*3)], {sway:0.15+R()*0.07, shade:0.13, seed:seed+i*7+k});
    }
  }
  blob(M, top[0], top[1]+1.35*s, top[2], 2.5*s, 1.15*s, 2.5*s, 11, 7, C.bloom1, {sway:0.13, shade:0.16, seed:seed+91});
  shadow(x,z,2.7*s,2.3*s,0.4,0);
}

function bambooClump(M,x,z,n,seed,s){
  var R=rng(seed);
  for(var i=0;i<n;i++){
    var ox=x+(R()-0.5)*2.4, oz=z+(R()-0.5)*2.4;
    var gy=groundY(ox,oz), h=(5.0+R()*3.4)*s;
    var tipx=ox+(R()-0.5)*1.1, tipz=oz+(R()-0.5)*1.1;
    var segs=6+floor(R()*3);
    for(var k=0;k<segs;k++){
      var t0=k/segs, t1=(k+1)/segs;
      var p0=[lerp(ox,tipx,t0*t0), gy-0.1+h*t0, lerp(oz,tipz,t0*t0)];
      var p1=[lerp(ox,tipx,t1*t1), gy-0.1+h*t1, lerp(oz,tipz,t1*t1)];
      tube(M,p0,p1,0.085*s*(1-t0*0.35),0.085*s*(1-t1*0.35),7,
           k%2? C.bamboo : tint(C.bamboo,0.94), {sway0:0.30*t0*t0, sway1:0.30*t1*t1, cap:false});
      tube(M,p1,[p1[0],p1[1]+0.05,p1[2]],0.1*s*(1-t1*0.35),0.09*s,7,C.bambooDk,{sway0:0.3*t1*t1,sway1:0.3*t1*t1,cap:false});
      // leaves on upper nodes
      if(t1>0.45){
        var nl=2+floor(R()*3);
        for(var l=0;l<nl;l++){
          var a=R()*PI*2, ln=(0.9+R()*0.7)*s, dr=0.45+R()*0.4;
          var base=[p1[0],p1[1],p1[2]];
          var tip=[base[0]+cos(a)*ln, base[1]+ln*(0.42-dr), base[2]+sin(a)*ln];
          var side=norm(cross(sub(tip,base),[0,1,0]));
          var w=0.085*s;
          var sw=0.30*t1*t1+0.06;
          M.triF(base, add(add(base,scl(sub(tip,base),0.45)),scl(side,w)), tip, R()>0.5?C.leaf:C.bamboo, sw);
          M.triF(base, tip, add(add(base,scl(sub(tip,base),0.45)),scl(side,-w)), tint(C.leaf,0.9), sw);
        }
      }
    }
  }
  shadow(x,z,1.8,1.8,0.32,0);
}

function lantern(M,x,z,s){

  s=s||1;
  tube(M,[x,gy-0.2,z],[x,gy+0.22*s,z],0.5*s,0.42*s,8,C.stoneDk,{});
  tube(M,[x,gy+0.2*s,z],[x,gy+1.1*s,z],0.2*s,0.17*s,8,C.stone,{});

  box(M,x,gy+1.55*s,z,0.66*s,0.58*s,0.66*s,C.wall,PI/8,{ao:0.1});
  for(var f=0;f<4;f++) box(M, x+sin(f*PI/2+PI/8)*0.33*s, gy+1.55*s, z+cos(f*PI/2+PI/8)*0.33*s,
      0.36*s,0.34*s,0.04*s, tint(C.stoneDk,0.7), -(f*PI/2+PI/8), {ao:0.05});

/* ---------- structures ---------- */
function buildBridge(M){
  var N=26, W=0.78;
  var dir=norm([BR1[0]-BR0[0],0,BR1[1]-BR0[1]]);
  var side=[-dir[2],0,dir[0]];
  var prevL,prevR,prevLb,prevRb;
  for(var i=0;i<=N;i++){
    var p=bridgePt(i/N);
    var L=[p[0]+side[0]*W,p[1],p[2]+side[2]*W], R=[p[0]-side[0]*W,p[1],p[2]-side[2]*W];
    var Lb=[L[0],L[1]-0.22,L[2]], Rb=[R[0],R[1]-0.22,R[2]];
    if(i>0){
      var plank = (i%2) ? tint(C.wood,1.05) : tint(C.wood,0.93);
      M.quadF(prevL,L,R,prevR, plank, 0);
      M.quadF(prevLb,Lb,Rb,prevRb, tint(C.redDark,0.8),0);
      M.quadF(prevL,L,Lb,prevLb, C.red, 0);
      M.quadF(prevR,R,Rb,prevRb, C.red, 0);
    }
    prevL=L;prevR=R;prevLb=Lb;prevRb=Rb;
    // railing posts + rails
    if(i%3===0){
      box(M,L[0],L[1]+0.34,L[2],0.11,0.68,0.11,C.redLite,0,{ao:0.2});
      box(M,R[0],R[1]+0.34,R[2],0.11,0.68,0.11,C.redLite,0,{ao:0.2});
    }
    if(i>0){
      var q=bridgePt((i-1)/N);
      var aL=[q[0]+side[0]*W,q[1]+0.66,q[2]+side[2]*W], bL=[L[0],L[1]+0.66,L[2]];
      var aR=[q[0]-side[0]*W,q[1]+0.66,q[2]-side[2]*W], bR=[R[0],R[1]+0.66,R[2]];
      tube(M,aL,bL,0.075,0.075,5,C.red,{cap:false});
      tube(M,aR,bR,0.075,0.075,5,C.red,{cap:false});
      tube(M,[aL[0],aL[1]-0.3,aL[2]],[bL[0],bL[1]-0.3,bL[2]],0.05,0.05,5,tint(C.red,0.92),{cap:false});
      tube(M,[aR[0],aR[1]-0.3,aR[2]],[bR[0],bR[1]-0.3,bR[2]],0.05,0.05,5,tint(C.red,0.92),{cap:false});
    }
  }
  var mid=bridgePt(0.5);
  shadow(mid[0],mid[2],2.4,2.0,0.22,0);
}

    tube(M,[A[0],A[1]+0.5,A[2]],[B[0],B[1]+0.5,B[2]],0.055,0.055,5,tint(C.stone,0.96),{cap:false});

function buildScatter(M){
  var R=rng(20260927);
  var i,x,z,d,pd;
  // shoreline rocks & garden rocks
  for(i=0;i<70;i++){
    x=(R()-0.5)*19; z=(R()-0.5)*19;
    if(isleSDF(x,z)>-0.8) continue;
    d=pondDist(x,z); pd=pathDist(x,z);
    var shoreRock = d>-0.05 && d<1.5;
    if(!shoreRock && R()>0.34) continue;
    if(pd<1.35 || nearPagoda(x,z)) continue;
    var s=(0.35+R()*0.75)*(shoreRock?1.15:0.9);
    blob(M,x,groundY(x,z)+s*0.32,z, s*1.35, s*0.7, s*1.1, 7,5,
         R()>0.5?C.rock:C.rockDk, {flat:true, jitter:0.22, seed:i*13+3});
    if(s>0.55) shadow(x,z,s*1.5,s*1.2,0.3,0);
  }
  // moss bushes
  for(i=0;i<95;i++){
    x=(R()-0.5)*19.4; z=(R()-0.5)*19.4;
    if(isleSDF(x,z)>-0.7) continue;
    d=pondDist(x,z); pd=pathDist(x,z);
    if(d<0.55 || pd<1.25) continue;
    if(nearPagoda(x,z) && R()>0.45) continue;
    var b=(0.42+R()*0.72);
    blob(M,x,groundY(x,z)+b*0.3,z, b*1.3, b*0.82, b*1.25, 9,6,
         R()>0.6?C.bushLite:C.bush, {seed:i*29+5, shade:0.3, sway:0.035});
    if(b>0.7) shadow(x,z,b*1.4,b*1.2,0.28,0);
  }
  // flat stepping slabs beside the water
  for(i=0;i<16;i++){
    var t=i/15;
    var px=lerp(-1.4,2.2,t)+ (R()-0.5)*0.7;
    var pz=lerp(3.6,4.9,t)+ (R()-0.5)*0.9;
    if(pondDist(px,pz)<0.25) continue;
    blob(M,px,groundY(px,pz)+0.06,pz, 0.55+R()*0.3, 0.1, 0.48+R()*0.3, 8,4,
         tint(C.rock,1.04), {flat:true, jitter:0.12, seed:i*7+1});
  }
  // grass tufts along the path
  for(i=0;i<130;i++){
    x=(R()-0.5)*19.6; z=(R()-0.5)*19.6;
    if(isleSDF(x,z)>-0.5) continue;
    if(pondDist(x,z)<0.45 || pathDist(x,z)<1.15) continue;
    var gy=groundY(x,z);
    for(var b2=0;b2<3;b2++){
      var a=R()*PI*2, ln=0.26+R()*0.3;
      M.triF([x,gy,z],[x+cos(a)*0.06,gy,z+sin(a)*0.06],
             [x+cos(a)*ln*0.5,gy+ln*1.5,z+sin(a)*ln*0.5], tint(C.bushLite,1.05+R()*0.2), 0.05);
    }
  }
}

function compile(src,type){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs,fs){
  var p=gl.createProgram();
  gl.attachShader(p,compile(vs,gl.VERTEX_SHADER));
  gl.attachShader(p,compile(fs,gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

    for(var i=0;i<4;i++){
      var u=corners[i][0]*rx, w=corners[i][1]*rz;
      v.push([x+u*c-w*s, y, z+u*s+w*c, corners[i][0], corners[i][1]]);
    }
    var order=[0,1,2, 0,2,3];
    for(i=0;i<6;i++){ var q=v[order[i]]; arr.push(q[0],q[1],q[2],q[3],q[4],str); }
  }
  for(var i=0;i<SHADOWS.length;i++){
    var S=SHADOWS[i]; quad(S.x,S.y,S.z,S.rx,S.rz,S.rot,S.str);
  }
  quad(2.6,-ISLE_DEEP-0.28,3.0, 12.5,12.5,0.0, 0.42);   // the diorama's own shadow
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);
  window.__decal={buf:buf,count:arr.length/6};
})();

/* petals */
(function(){
  var R=rng(4242), base=[], rnd=[], n=1100, placed=0, guard=0;
  while(placed<n && guard<n*30){
    guard++;
    var x=(R()-0.5)*21, z=(R()-0.5)*21;
    if(isleSDF(x,z)>0.4) continue;
    base.push(x,14.5,z);
    rnd.push(R(), 0.55+R()*0.95, 5.5+R()*7.0);
    placed++;
  }
  var b1=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b1);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(base),gl.STATIC_DRAW);
  var b2=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b2);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(rnd),gl.STATIC_DRAW);
  window.__petal={base:b1,rnd:b2,count:placed};
})();

/* ---------- draw helpers ---------- */
var STRIDE=10*4;
function bindMesh(mesh){
  gl.bindBuffer(gl.ARRAY_BUFFER,mesh.buf);
  gl.vertexAttribPointer(A.pos,3,gl.FLOAT,false,STRIDE,0);
  gl.vertexAttribPointer(A.nrm,3,gl.FLOAT,false,STRIDE,12);
  gl.vertexAttribPointer(A.col,3,gl.FLOAT,false,STRIDE,24);
  gl.vertexAttribPointer(A.sway,1,gl.FLOAT,false,STRIDE,36);
}
var WIND=[0.17,0.11];
function drawMesh(mesh,o){
  o=o||{};
  bindMesh(mesh);
  gl.uniformMatrix4fv(U.uModel,false,o.model||IDENT4);
  gl.uniformMatrix3fv(U.uNrmMat,false,o.nrm||IDENT3);
  gl.uniform1f(U.uMode,o.mode||0);
  gl.uniform1f(U.uAlpha,o.alpha===undefined?1:o.alpha);
  gl.uniform1f(U.uSpec,o.spec||0.0);
  gl.uniform2f(U.uWind,(o.wind||WIND)[0],(o.wind||WIND)[1]);
  gl.uniform1f(U.uPhase,o.phase||0);
  gl.drawArrays(gl.TRIANGLES,0,mesh.count);
}

/* ---------- camera ---------- */
var cam={ az:0.62, el:0.52, dist:46, tgt:[0.2,4.0,0.9],
          azUser:0, elUser:0, distUser:0, auto:true, drag:false, lx:0, ly:0, vx:0, vy:0 };

canvas.addEventListener('pointerdown',function(e){
  cam.drag=true; cam.lx=e.clientX; cam.ly=e.clientY; canvas.setPointerCapture(e.pointerId);
  document.getElementById('keys').classList.add('stay');
});
canvas.addEventListener('pointermove',function(e){
  if(!cam.drag) return;
  var dx=e.clientX-cam.lx, dy=e.clientY-cam.ly;
  cam.lx=e.clientX; cam.ly=e.clientY;
  cam.vx=dx*0.0055; cam.vy=dy*0.004;
  cam.azUser-=cam.vx; cam.elUser=clamp(cam.elUser-cam.vy,-0.42,0.55);
});
function endDrag(){ cam.drag=false; }
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  cam.distUser=clamp(cam.distUser+e.deltaY*0.022,-20,34);
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); cam.auto=!cam.auto; }
  if(e.key==='r'||e.key==='R'){ cam.azUser=0;cam.elUser=0;cam.distUser=0; }
});

/* ---------- grain texture ---------- */
(function(){
  var c=document.createElement('canvas'); c.width=c.height=110;
  var x=c.getContext('2d'), d=x.createImageData(110,110);
  for(var i=0;i<d.data.length;i+=4){
    var v=180+Math.random()*75;
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255;
  }
  x.putImageData(d,0,0);
  document.getElementById('grain').style.backgroundImage='url('+c.toDataURL()+')';
})();

/* ---------- loop ---------- */
var DPR=Math.min(window.devicePixelRatio||1,1.8);
function resize(){
  var w=max(1,Math.floor(canvas.clientWidth*DPR)), h=max(1,Math.floor(canvas.clientHeight*DPR));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
}
window.addEventListener('resize',resize);

var pathFlat=new Float32Array(16), pathBFlat=new Float32Array(12);
for(var i2=0;i2<8;i2++){ pathFlat[i2*2]=PATH[i2][0]; pathFlat[i2*2+1]=PATH[i2][1]; }
for(i2=0;i2<6;i2++){ pathBFlat[i2*2]=PATHB[i2][0]; pathBFlat[i2*2+1]=PATHB[i2][1]; }

var SUN=norm([-0.46,0.74,0.49]);
var t0=performance.now(), booted=false;

gl.disable(gl.CULL_FACE);
gl.enable(gl.DEPTH_TEST);
gl.clearColor(BG[0],BG[1],BG[2],1);

function frame(now){
  requestAnimationFrame(frame);
  resize();
  var t=(now-t0)/1000;
  if(!booted && t>0.15){ booted=true; document.getElementById('boot').classList.add('gone'); }

  // cinematic camera: slow orbit, breathing dolly, easing intro
  if(cam.auto) cam.az += 0.0016;
  var intro=smoothstep(0,5.2,t);
  var az=cam.az+cam.azUser;
  var el=clamp(cam.el+cam.elUser+sin(t*0.11)*0.055 + (1-intro)*0.30, 0.12, 1.15);
  var dist=(cam.dist+cam.distUser+sin(t*0.077)*2.4) + (1-intro)*26;
  var tgt=[cam.tgt[0]+sin(t*0.13)*0.35, cam.tgt[1]+ (1-intro)*1.2 + sin(t*0.19)*0.22, cam.tgt[2]+cos(t*0.1)*0.35];
  var eye=[tgt[0]+cos(az)*cos(el)*dist, tgt[1]+sin(el)*dist, tgt[2]+sin(az)*cos(el)*dist];

  var aspect=canvas.width/Math.max(canvas.height,1);
  var proj=persp(23*PI/180, aspect, 1.0, 220);
  var view=lookAt(eye,tgt,[0,1,0]);

  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  gl.useProgram(prog);
  gl.enableVertexAttribArray(A.pos); gl.enableVertexAttribArray(A.nrm);
  gl.enableVertexAttribArray(A.col); gl.enableVertexAttribArray(A.sway);
  gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniformMatrix4fv(U.uView,false,view);
  gl.uniform1f(U.uTime,t);
  gl.uniform3f(U.uCam,eye[0],eye[1],eye[2]);
  gl.uniform3f(U.uSun,SUN[0],SUN[1],SUN[2]);
  gl.uniform3f(U.uSunCol,1.02,0.95,0.84);
  gl.uniform3f(U.uSky,0.40,0.47,0.58);
  gl.uniform3f(U.uGrd,0.30,0.29,0.24);
  gl.uniform3f(U.uBg,BG[0],BG[1],BG[2]);
  gl.uniform2fv(U.uPath,pathFlat);
  gl.uniform2fv(U.uPathB,pathBFlat);

  gl.disable(gl.BLEND);
  gl.depthMask(true);

  drawMesh(mGround,{mode:2});
  drawMesh(mProps,{mode:0});

  for(var i=0;i<PEOPLE.length;i++){
    var P=PEOPLE[i];
    var yaw=P.yaw+sin(t*0.4+i*2.1)*0.055;
    drawMesh(mPerson[i],{model:trs(P.x,P.y,P.z,yaw,1), nrm:m3yaw(yaw),
      wind:[0.05,0.04], phase:i*3.3});
  }
  for(i=0;i<KOI.length;i++){
    var k=KOI[i], a=t*k.sp+k.ph;
    var kx=k.cx+cos(a)*k.rx, kz=k.cz+sin(a)*k.rz;
    var dx=-sin(a)*k.rx*k.sp, dz=cos(a)*k.rz*k.sp;
    var yaw2=Math.atan2(dx,dz);
    var floorY=groundY(kx,kz)+0.24*k.sc;
    var ky=min(max(k.y+sin(t*0.5+k.ph)*0.06, floorY), WATER_Y-0.2);
    drawMesh(mKoi[i],{model:trs(kx,ky,kz,yaw2,k.sc), nrm:m3yaw(yaw2),
      wind:[0.16,0.0], phase:k.ph*3.0});
  }

  // soft contact shadows
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(dprog);
  gl.enableVertexAttribArray(DA.pos); gl.enableVertexAttribArray(DA.uv); gl.enableVertexAttribArray(DA.str);
  gl.uniformMatrix4fv(DU.uProj,false,proj);
  gl.uniformMatrix4fv(DU.uView,false,view);
  gl.bindBuffer(gl.ARRAY_BUFFER,window.__decal.buf);
  gl.vertexAttribPointer(DA.pos,3,gl.FLOAT,false,24,0);
  gl.vertexAttribPointer(DA.uv,2,gl.FLOAT,false,24,12);
  gl.vertexAttribPointer(DA.str,1,gl.FLOAT,false,24,20);
  gl.drawArrays(gl.TRIANGLES,0,window.__decal.count);
  gl.disableVertexAttribArray(DA.pos); gl.disableVertexAttribArray(DA.uv); gl.disableVertexAttribArray(DA.str);

  // water
  gl.useProgram(prog);
  gl.enableVertexAttribArray(A.pos); gl.enableVertexAttribArray(A.nrm);
  gl.enableVertexAttribArray(A.col); gl.enableVertexAttribArray(A.sway);
  drawMesh(mWater,{mode:1,alpha:0.85});
  gl.disableVertexAttribArray(A.pos); gl.disableVertexAttribArray(A.nrm);
  gl.disableVertexAttribArray(A.col); gl.disableVertexAttribArray(A.sway);

  // petals
  gl.useProgram(pprog);
  gl.enableVertexAttribArray(PA.base); gl.enableVertexAttribArray(PA.rnd);
  gl.uniformMatrix4fv(PU.uProj,false,proj);
  gl.uniformMatrix4fv(PU.uView,false,view);
  gl.uniform1f(PU.uTime,t);
  gl.uniform1f(PU.uPx, canvas.height*0.021);
  gl.bindBuffer(gl.ARRAY_BUFFER,window.__petal.base);
  gl.vertexAttribPointer(PA.base,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,window.__petal.rnd);
  gl.vertexAttribPointer(PA.rnd,3,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.POINTS,0,window.__petal.count);
  gl.disableVertexAttribArray(PA.base); gl.disableVertexAttribArray(PA.rnd);

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}
requestAnimationFrame(frame);

})();
</script>
</body>
