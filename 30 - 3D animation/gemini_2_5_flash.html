                new THREE.Vector3(1, 0.1, 4),
                new THREE.Vector3(4, 0.1, 1),
                new THREE.Vector3(2, 0.1, -3),
                new THREE.Vector3(-5, 0.1, -5),
                new THREE.Vector3(-1, 0.1, -7),
            ];
            const koiColors = [
                [0xff8c00, 0xffd700], // Orange/Gold
                [0xffffff, 0x000000], // White/Black
                [0xdc143c, 0xffffff], // Crimson/White
                [0x000000, 0xffffff], // Black/White
            ];

            koiPositions.forEach((pos, i) => {
                const colors = koiColors[i % koiColors.length];
                const scale = 0.8 + Math.random() * 0.4;
                const koi = createKoi(colors[0], colors[1], scale, pos);
                koiGroup.add(koi);
            });
            scene.add(koiGroup);


            // Bridge
            function createBridge() {
                const group = new THREE.Group();
                group.position.set(2, 0, 0);

                // Main arch
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-5, 0.5, 0),
                    new THREE.Vector3(0, 1.5, 0),
                    new THREE.Vector3(5, 0.5, 0)
                ]);
                const bridgePath = new THREE.TubeGeometry(curve, 20, 0.8, 8, false); // Increased radius for thickness
                const bridgeArch = new THREE.Mesh(bridgePath, woodRedMat);
                bridgeArch.castShadow = true;
                bridgeArch.receiveShadow = true;
                group.add(bridgeArch);

                // Deck (flat top)
                const deckGeometry = new THREE.BoxGeometry(11, 0.2, 1.8);
                const deck = new THREE.Mesh(deckGeometry, woodRedMat);
                deck.position.y = 1.3;
                deck.castShadow = true;
                deck.receiveShadow = true;
                group.add(deck);

                // Railings
                const railingPostGeom = new THREE.BoxGeometry(0.1, 0.8, 0.1);
                const railingBarGeom = new THREE.BoxGeometry(10.8, 0.1, 0.1);

                for (let i = 0; i < 6; i++) {
                    const x = -5 + i * 2;
                    const postLeft = new THREE.Mesh(railingPostGeom, woodRedMat);
                    postLeft.position.set(x, 1.7, -0.8);
                    postLeft.castShadow = true;
                    group.add(postLeft);

                    const postRight = new THREE.Mesh(railingPostGeom, woodRedMat);
                    postRight.position.set(x, 1.7, 0.8);
                    postRight.castShadow = true;
                    group.add(postRight);
                }

                const railLeftTop = new THREE.Mesh(railingBarGeom, woodRedMat);
                railLeftTop.position.set(0, 2.0, -0.8);
                railLeftTop.castShadow = true;
                group.add(railLeftTop);
                const railLeftBottom = new THREE.Mesh(railingBarGeom, woodRedMat);
                railLeftBottom.position.set(0, 1.6, -0.8);
                railLeftBottom.castShadow = true;
                group.add(railLeftBottom);

                const railRightTop = new THREE.Mesh(railingBarGeom, woodRedMat);
                railRightTop.position.set(0, 2.0, 0.8);
                railRightTop.castShadow = true;
                group.add(railRightTop);
                const railRightBottom = new THREE.Mesh(railingBarGeom, woodRedMat);
                railRightBottom.position.set(0, 1.6, 0.8);
                railRightBottom.castShadow = true;
                group.add(railRightBottom);

                return group;
            }
            scene.add(createBridge());

            // Path (simplified custom shape)
            function createPath() {
                const shape = new THREE.Shape();
                shape.moveTo(-15, -12);
                shape.lineTo(-10, -18);
                shape.bezierCurveTo(-5, -18, 5, -10, 8, -5);
                shape.bezierCurveTo(10, 0, 5, 5, 0, 6);
                shape.bezierCurveTo(-5, 7, -10, 5, -12, 0);
                shape.bezierCurveTo(-15, -5, -15, -10, -15, -12);

                const extrudeSettings = { depth: 0.1, bevelEnabled: false };
                const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geometry.rotateX( - Math.PI / 2 );
                geometry.translate(0, 0.01, 0);
                const mesh = new THREE.Mesh(geometry, pathMat);
                mesh.receiveShadow = true;
                return mesh;
            }
            scene.add(createPath());


            // Pagoda
            function createPagoda() {
                const pagodaGroup = new THREE.Group();
                pagodaGroup.position.set(0, 0, -10);

                // Base Platform
                const baseGeom = new THREE.BoxGeometry(8, 1, 8);
                const base = new THREE.Mesh(baseGeom, stoneMat);
                base.position.y = 0.5;
                base.castShadow = true;
                base.receiveShadow = true;
                pagodaGroup.add(base);

                // Helper for pagoda roof (slightly curved eaves)
                function createPagodaRoof(size, height, yOffset) {
                    const roofGroup = new THREE.Group();
                    const roofMainGeom = new THREE.BoxGeometry(size * 1.1, 0.3, size * 1.1);
                    const roofMain = new THREE.Mesh(roofMainGeom, pagodaRoofMat);
                    roofMain.position.y = yOffset + height + 0.15;
                    roofMain.castShadow = true;
                    roofGroup.add(roofMain);

                    const eavesGeom = new THREE.CylinderGeometry(size * 0.7, size * 1.1, 0.2, 4); // Square cone
                    const eaves = new THREE.Mesh(eavesGeom, pagodaRoofMat);
                    eaves.rotation.y = Math.PI / 4;
                    eaves.position.y = yOffset + height + 0.1;
                    eaves.scale.set(1, 1, 1);
                    eaves.castShadow = true;
                    roofGroup.add(eaves);
                    return roofGroup;
                }

                // Levels
                const levels = [
                    { width: 6, height: 4, y: 1 },
                    { width: 5, height: 3.5, y: 5 },
                    { width: 4, height: 3, y: 8.5 }
                ];

                levels.forEach((level, i) => {
                    // Walls
                    const wallGeom = new THREE.BoxGeometry(level.width, level.height, level.width);
                    const walls = new THREE.Mesh(wallGeom, pagodaWallMat);
                    walls.position.y = level.y + level.height / 2;
                    walls.castShadow = true;
                    walls.receiveShadow = true;
                    pagodaGroup.add(walls);

                    // Red trim
                    const trimGeom = new THREE.BoxGeometry(level.width + 0.2, 0.4, level.width + 0.2);
                    const trim = new THREE.Mesh(trimGeom, woodRedMat);
                    trim.position.y = level.y + level.height - 0.2;
                    trim.castShadow = true;
                    pagodaGroup.add(trim);

                    // Roof
                    const roof = createPagodaRoof(level.width, level.height, level.y);
                    pagodaGroup.add(roof);
                });

                // Top Spire
                const spireCylinderGeom = new THREE.CylinderGeometry(0.1, 0.1, 2, 8);
                const spireCylinder = new THREE.Mesh(spireCylinderGeom, new THREE.MeshStandardMaterial({color: 0xcccccc, flatShading: true, metalness: 0.8, roughness: 0.3}));
                spireCylinder.position.y = 12.5;
                spireCylinder.castShadow = true;
                pagodaGroup.add(spireCylinder);

                const spireTipGeom = new THREE.SphereGeometry(0.3, 16, 16);
                const spireTip = new THREE.Mesh(spireTipGeom, new THREE.MeshStandardMaterial({color: 0xffd700, flatShading: true, metalness: 0.9, roughness: 0.2})); // Gold
                spireTip.position.y = 13.5;
                spireTip.castShadow = true;
                pagodaGroup.add(spireTip);


                return pagodaGroup;
            }
            scene.add(createPagoda());

            // Cherry Blossom Trees
            const blossomParticleSystem = new THREE.Group(); // Group for falling petals
            scene.add(blossomParticleSystem);

            function createCherryTree(position) {
                const group = new THREE.Group();
                group.position.copy(position);

                // Trunk
                const trunkGeom = new THREE.CylinderGeometry(0.5, 0.8, 6, 8);
                const trunk = new THREE.Mesh(trunkGeom, woodDarkMat);
                trunk.position.y = 3;
                trunk.castShadow = true;
                group.add(trunk);

                // Branches (simplified spheres for clusters)
                const branchClusters = [
                    new THREE.Vector3(0, 6, 0),
                    new THREE.Vector3(2, 7, 1),
                    new THREE.Vector3(-1.5, 7.5, -2),
                    new THREE.Vector3(0, 8, 2),
                    new THREE.Vector3(-2, 6.5, 0),
                    new THREE.Vector3(1, 7, -2),
                    new THREE.Vector3(0, 8.5, 0), // Top
                ];

                const blossomMaterial = new THREE.MeshStandardMaterial({ color: 0xffd1dc, transparent: true, opacity: 0.9, flatShading: true }); // Pink
                
                branchClusters.forEach(pos => {
                    const sphere = new THREE.Mesh(new THREE.SphereGeometry(2 + Math.random(), 8, 8), blossomMaterial);
                    sphere.position.copy(pos);
                    sphere.castShadow = true;
                    group.add(sphere);
                });

                // Falling petals (separate particle system for each tree)
                const petalCount = 50;
                const positions = new Float32Array(petalCount * 3);
                const velocities = new Float32Array(petalCount * 3);

                for (let i = 0; i < petalCount; i++) {
                    positions[i * 3 + 0] = (Math.random() - 0.5) * 8; // x
                    positions[i * 3 + 1] = 8 + Math.random() * 5; // y (start high)
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 8; // z

                    velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.05; // x velocity
                    velocities[i * 3 + 1] = -0.05 - Math.random() * 0.05; // y (falling speed)
                    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.05; // z velocity
                }

                const petalGeometry = new THREE.BufferGeometry();
                petalGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                petalGeometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));

                const petalMat = new THREE.PointsMaterial({
                    color: 0xffa0af, // Slightly darker pink for falling petals
                    size: 0.1,
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true
                });

                const petals = new THREE.Points(petalGeometry, petalMat);
                petals.position.copy(position); // Position relative to the tree
                blossomParticleSystem.add(petals); // Add to a separate group for easy animation


                return group;
            }

            scene.add(createCherryTree(new THREE.Vector3(-12, 0, -8)));
            scene.add(createCherryTree(new THREE.Vector3(8, 0, -15)));
            scene.add(createCherryTree(new THREE.Vector3(15, 0, 5)));
            scene.add(createCherryTree(new THREE.Vector3(-8, 0, 10)));


            // Stone Lanterns
            function createLantern(position) {
                const group = new THREE.Group();
                group.position.copy(position);

                // Base
                const baseGeom = new THREE.CylinderGeometry(0.8, 1.2, 0.4, 4); // Square base
                baseGeom.rotateY(Math.PI / 4);
                const base = new THREE.Mesh(baseGeom, stoneMat);
                base.position.y = 0.2;
                base.castShadow = true;
                group.add(base);

                // Pillar
                const pillarGeom = new THREE.CylinderGeometry(0.3, 0.4, 2, 8);
                const pillar = new THREE.Mesh(pillarGeom, stoneMat);
                pillar.position.y = 1.4;
                pillar.castShadow = true;
                group.add(pillar);

                // Chamber
                const chamberGeom = new THREE.BoxGeometry(1.2, 0.8, 1.2);
                const chamber = new THREE.Mesh(chamberGeom, stoneMat);
                chamber.position.y = 2.8;
                chamber.castShadow = true;
                group.add(chamber);

                // Roof
                const roofTopGeom = new THREE.CylinderGeometry(1.4, 0.8, 0.4, 4); // Top square roof
                roofTopGeom.rotateY(Math.PI / 4);
                const roofTop = new THREE.Mesh(roofTopGeom, stoneMat);
                roofTop.position.y = 3.3;
                roofTop.castShadow = true;
                group.add(roofTop);

                return group;
            }

            scene.add(createLantern(new THREE.Vector3(-10, 0, -5)));
            scene.add(createLantern(new THREE.Vector3(-5, 0, 5)));
            scene.add(createLantern(new THREE.Vector3(5, 0, -5)));
            scene.add(createLantern(new THREE.Vector3(10, 0, 0)));


            // People (simplified, as per image style)
            function createPerson(position, color) {
                const group = new THREE.Group();
                group.position.copy(position);

                const bodyGeom = new THREE.BoxGeometry(0.6, 1.5, 0.4);
                const body = new THREE.Mesh(bodyGeom, new THREE.MeshStandardMaterial({ color: color, flatShading: true }));
                body.position.y = 0.75;
                body.castShadow = true;
                group.add(body);

                const headGeom = new THREE.SphereGeometry(0.4, 8, 8);
                const head = new THREE.Mesh(headGeom, new THREE.MeshStandardMaterial({ color: 0xffebcd, flatShading: true })); // Skin color
                head.position.y = 1.9;
                head.castShadow = true;
                group.add(head);

                return group;
            }

            const person1 = createPerson(new THREE.Vector3(-8, 0, -8), 0x2e8b57); // Green shirt
            const person2 = createPerson(new THREE.Vector3(-5, 0, -10), 0x4682b4); // Blue dress
            const person3 = createPerson(new THREE.Vector3(3, 0, 2), 0x8b4513); // Brown shirt
            scene.add(person1);
            scene.add(person2);
            scene.add(person3);

            // --- Post Processing (Depth of Field) ---
            const composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // BokehPass for Depth of Field
            const bokehPass = new THREE.BokehPass(scene, camera, {
                focus: 30, // Distance to focus (initially pagoda)
                aperture: 0.0001, // Controls the intensity of the blur
                maxblur: 0.005, // Maximum blur amount
                width: window.innerWidth,
                height: window.innerHeight
            });
            bokehPass.renderToScreen = true;
            composer.addPass(bokehPass);

            // --- Animation Loop ---
            let clock = new THREE.Clock();
            let mixer = new THREE.AnimationMixer(scene);
            const animate = function() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Camera animation (circular path with varying height and lookAt)
                const cameraRadius = 25 + Math.sin(elapsed * 0.1) * 5; // Zoom in/out slightly
                const cameraHeight = 15 + Math.sin(elapsed * 0.2 + Math.PI / 2) * 3; // Bob up/down
                camera.position.x = Math.sin(elapsed * 0.08) * cameraRadius;
                camera.position.z = Math.cos(elapsed * 0.08) * cameraRadius;
                camera.position.y = cameraHeight;

                // Make camera look at a point that slightly moves
                const lookAtTarget = new THREE.Vector3(
                    Math.sin(elapsed * 0.5) * 2,
                    5 + Math.cos(elapsed * 0.3) * 1,
                    -10 + Math.sin(elapsed * 0.4) * 2
                );
                camera.lookAt(lookAtTarget);

                // Adjust DOF focus based on camera distance to main target (pagoda)
                bokehPass.uniforms['focus'].value = camera.position.distanceTo(lookAtTarget);

                // Koi fish movement
                koiGroup.children.forEach(koi => {
                    koi.position.x += Math.sin(elapsed * 0.5 + koi.uuid.charCodeAt(0)) * 0.02;
                    koi.position.z += Math.cos(elapsed * 0.5 + koi.uuid.charCodeAt(1)) * 0.02;
                    // Keep koi within pond bounds (simple approximation)
                    const distToCenter = koi.position.distanceTo(new THREE.Vector3(0, 0.1, 0));
                    if (distToCenter > 8) { // If outside approximate pond radius
                         koi.position.x = (Math.random() - 0.5) * 10;
                         koi.position.z = (Math.random() - 0.5) * 10;
                         koi.position.y = 0.1;
                    }
                });

                // Falling cherry blossom petals
                blossomParticleSystem.children.forEach(petals => {
                    const positions = petals.geometry.attributes.position.array;
                    const velocities = petals.geometry.attributes.velocity.array;
                    
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 0] += velocities[i + 0]; // x
                        positions[i + 1] += velocities[i + 1]; // y
                        positions[i + 2] += velocities[i + 2]; // z

                        // Reset petals when they fall below a certain point
                        if (positions[i + 1] < 0) {
                            positions[i + 1] = 10 + Math.random() * 5; // Reset to top
                            positions[i + 0] = (Math.random() - 0.5) * 8; // new random x
                            positions[i + 2] = (Math.random() - 0.5) * 8; // new random z
                        }
                    }
                    petals.geometry.attributes.position.needsUpdate = true;
                });

                // Water ripple effect (simple shader uniform animation)
                waterMat.color.setHSL(0.55 + Math.sin(elapsed * 0.1) * 0.02, 0.6, 0.6 + Math.cos(elapsed * 0.05) * 0.05);

                // Render with composer for post-processing
                composer.render(delta);
            };

            // Handle window resize
            window.addEventListener('resize', () => {
                const width = window.innerWidth;
                const height = window.innerHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
                composer.setSize(width, height);
                bokehPass.setSize(width, height); // Update BokehPass size
            });

            animate();
        })();
    </script>
</body>
</html>
