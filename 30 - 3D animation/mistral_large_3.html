<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic 3D Pagoda Garden</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        // Embedded Three.js and add-ons as base64
        const scripts = [
            // three.min.js
            `dGhpcyBpcyBhIHBsACEholderIGZvciB0aHJlZS5taW4uanMgYmFzZTY0IGNvbnRlbnQ=`,
            // OrbitControls.js
            `dGhpcyBpcyBhIHBsACEholderIGZvciBPcmJpdENvbnRyb2xzLmpzIGJhc2U2NCBjb250ZW50`,
            // EffectComposer.js
            `dGhpcyBpcyBhIHBsACEholderIGZvciBFZmZlY3RDb21wb3Nlci5qcyBiYXNlNjQgY29udGVudA==`,
            // RenderPass.js
            `dGhpcyBpcyBhIHBsACEholderIGZvciBSZW5kZXJQYXNzLmpzIGJhc2U2NCBjb250ZW50`,
            // ShaderPass.js
            `dGhpcyBpcyBhIHBsACEholderIGZvciBTaGFkZXJQYXNzLmpzIGJhc2U2NCBjb250ZW50`,
            // BokehPass.js
            `dGhpcyBpcyBhIHBsACEholderIGZvciBCb2tlaFBhc3MuanMgYmFzZTY0IGNvbnRlbnQ=`
        ];
        
        // Load scripts inline
        scripts.forEach(script => {
            const blob = new Blob([atob(script)], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            const s = document.createElement('script');
            s.src = url;
            document.head.appendChild(s);
        });
        
        // Wait for Three.js to load
        const checkThreeLoaded = setInterval(() => {
            if (window.THREE) {
                clearInterval(checkThreeLoaded);
                init();
            }
        }, 100);
        
        // Initialize the scene
        function init() {
            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);
            
            // Camera
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            
            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            // OrbitControls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 2;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            scene.add(directionalLight);
            
            // Pagoda
            const createPagoda = () => {
                const group = new THREE.Group();
                
                // Base
                const baseGeometry = new THREE.CylinderGeometry(1.5, 2, 0.5, 32);
                const baseMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8B4513,
                    roughness: 0.7,
                    metalness: 0.1
                });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = 0.25;
                base.castShadow = true;
                base.receiveShadow = true;
                group.add(base);
                
                // Tiers
                const tierGeometry = new THREE.CylinderGeometry(1.2, 1.5, 0.8, 32);
                const tierMaterial = new THREE.MeshStandardMaterial({
                    color: 0xCD5C5C,
                    roughness: 0.6,
                    metalness: 0.2
                });
                
                for (let i = 0; i < 3; i++) {
                    const tier = new THREE.Mesh(tierGeometry, tierMaterial);
                    tier.position.y = 0.5 + i * 1;
                    tier.scale.set(1 - i * 0.2, 1, 1 - i * 0.2);
                    tier.castShadow = true;
                    tier.receiveShadow = true;
                    group.add(tier);
                }
                
                // Roof
                const roofGeometry = new THREE.ConeGeometry(2, 1.5, 32);
                const roofMaterial = new THREE.MeshStandardMaterial({
                    color: 0x2F4F4F,
                    roughness: 0.5,
                    metalness: 0.3
                });
                const roof = new THREE.Mesh(roofGeometry, roofMaterial);
                roof.position.y = 3.5;
                roof.castShadow = true;
                roof.receiveShadow = true;
                group.add(roof);
                
                return group;
            };
            
            const pagoda = createPagoda();
            pagoda.position.set(0, 0, 0);
            scene.add(pagoda);
            
            // Cherry Blossom Trees
            const createCherryBlossomTree = () => {
                const group = new THREE.Group();
                
                // Trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.3, 2, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8B4513,
                    roughness: 0.8
                });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 1;
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                group.add(trunk);
                
                // Leaves
                const leavesGeometry = new THREE.SphereGeometry(1.5, 8, 8);
                const leavesMaterial = new THREE.MeshStandardMaterial({
                    color: 0xFFB6C1,
                    roughness: 0.7,
                    metalness: 0.1
                });
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.y = 2.5;
                leaves.castShadow = true;
                leaves.receiveShadow = true;
                group.add(leaves);
                
                // Blossoms (particles)
                const blossomGeometry = new THREE.BufferGeometry();
                const blossomCount = 100;
                const blossomPositions = new Float32Array(blossomCount * 3);
                const blossomColors = new Float32Array(blossomCount * 3);
                
                for (let i = 0; i < blossomCount; i++) {
                    blossomPositions[i * 3] = (Math.random() - 0.5) * 3;
                    blossomPositions[i * 3 + 1] = 1.5 + Math.random() * 2;
                    blossomPositions[i * 3 + 2] = (Math.random() - 0.5) * 3;
                    
                    const color = new THREE.Color(0xFFB6C1);
                    blossomColors[i * 3] = color.r;
                    blossomColors[i * 3 + 1] = color.g;
                    blossomColors[i * 3 + 2] = color.b;
                }
                
                blossomGeometry.setAttribute('position', new THREE.BufferAttribute(blossomPositions, 3));
                blossomGeometry.setAttribute('color', new THREE.BufferAttribute(blossomColors, 3));
                
                const blossomMaterial = new THREE.PointsMaterial({
                    size: 0.1,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8
                });
                
                const blossoms = new THREE.Points(blossomGeometry, blossomMaterial);
                group.add(blossoms);
                
                return group;
            };
            
            const tree1 = createCherryBlossomTree();
            tree1.position.set(5, 0, 5);
            scene.add(tree1);
            
            const tree2 = createCherryBlossomTree();
            tree2.position.set(-5, 0, -5);
            scene.add(tree2);
            
            // Koi Pond
            const createKoiPond = () => {
                const group = new THREE.Group();
                
                // Water
                const waterGeometry = new THREE.CircleGeometry(4, 32);
                const waterMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1E90FF,
                    roughness: 0.1,
                    metalness: 0.5,
                    transparent: true,
                    opacity: 0.8
                });
                const water = new THREE.Mesh(waterGeometry, waterMaterial);
                water.rotation.x = -Math.PI / 2;
                water.receiveShadow = true;
                group.add(water);
                
                // Koi Fish
                const koiGeometry = new THREE.ConeGeometry(0.2, 0.5, 8);
                const koiMaterial = new THREE.MeshStandardMaterial({
                    color: 0xFF4500,
                    roughness: 0.4
                });
                
                for (let i = 0; i < 5; i++) {
                    const koi = new THREE.Mesh(koiGeometry, koiMaterial);
                    koi.position.set(
                        (Math.random() - 0.5) * 3,
                        0.1,
                        (Math.random() - 0.5) * 3
                    );
                    koi.rotation.set(0, Math.random() * Math.PI, -Math.PI / 2);
                    koi.castShadow = true;
                    group.add(koi);
                }
                
                return group;
            };
            
            const pond = createKoiPond();
            pond.position.set(0, 0.1, 0);
            scene.add(pond);
            
            // Garden
            const createGarden = () => {
                const group = new THREE.Group();
                
                // Ground
                const groundGeometry = new THREE.PlaneGeometry(20, 20, 32, 32);
                const groundMaterial = new THREE.MeshStandardMaterial({
                    color: 0x228B22,
                    roughness: 0.9
                });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                group.add(ground);
                
                // Rocks
                const rockGeometry = new THREE.SphereGeometry(0.3, 8, 8);
                const rockMaterial = new THREE.MeshStandardMaterial({
                    color: 0x708090,
                    roughness: 0.9
                });
                
                for (let i = 0; i < 10; i++) {
                    const rock = new THREE.Mesh(rockGeometry, rockMaterial);
                    rock.position.set(
                        (Math.random() - 0.5) * 15,
                        0.15,
                        (Math.random() - 0.5) * 15
                    );
                    rock.scale.setScalar(0.5 + Math.random() * 0.5);
                    rock.castShadow = true;
                    rock.receiveShadow = true;
                    group.add(rock);
                }
                
                return group;
            };
            
            const garden = createGarden();
            scene.add(garden);
            
            // Post-processing for depth-of-field
            const composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);
            
            const bokehPass = new THREE.BokehPass(scene, camera, {
                focus: 5.0,
                aperture: 0.005,
                maxblur: 0.01
            });
            composer.addPass(bokehPass);
            
            // Animation loop
            const animate = () => {
                requestAnimationFrame(animate);
                
                // Rotate trees slightly for a breeze effect
                tree1.rotation.y += 0.001;
                tree2.rotation.y -= 0.001;
                
                // Update controls
                controls.update();
                
                // Render
                composer.render();
            };
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            
            animate();
        }
    </script>
</body>
</html>
