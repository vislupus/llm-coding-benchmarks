<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Japanese Garden 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(255,255,255,0.5);
        }
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader">Generating Zen Garden...</div>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1 style="margin: 0; font-weight: 300; letter-spacing: 2px;">ZEN GARDEN</h1>
        <p style="margin: 5px 0; font-size: 0.9rem; opacity: 0.7;">Interactive Cinematic 3D Experience</p>
    </div>

    <!-- Three.js and dependencies -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

        // --- Configuration ---
        const COLORS = {
            pagodaRoof: 0x3a3a3e,
            pagodaWalls: 0xfcfcfc,
            pagodaTrim: 0xa83232,
            bridge: 0xa83232,
            water: 0x7fb5b5,
            grass: 0x8b9d62,
            cherry: 0xf9b7cc,
            bamboo: 0x6b8e23,
            stone: 0xaaaaaa,
            koi1: 0xff4500,
            koi2: 0xffffff
        };

        let scene, camera, renderer, controls, composer;
        let petals = [];
        let koiFish = [];
        const clock = new THREE.Clock();

        // --- Initialization ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.fog = new THREE.FogExp2(0xffffff, 0.01);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(40, 30, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.2;
            controls.maxPolarAngle = Math.PI / 2.1;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.left = -50;
            sunLight.shadow.camera.right = 50;
            sunLight.shadow.camera.top = 50;
            sunLight.shadow.camera.bottom = -50;
            scene.add(sunLight);

            // Create World
            createGardenBase();
            createPagoda();
            createPond();
            createBridge();
            createTrees();
            createEnvironment();

            // Post Processing
            setupPostProcessing();

            document.getElementById('loader').style.display = 'none';
            animate();
        }

        // --- Objects ---

        function createGardenBase() {
            // Ground
            const geometry = new THREE.CylinderGeometry(45, 47, 3, 64);
            const material = new THREE.MeshStandardMaterial({ color: COLORS.grass, roughness: 1.0 });
            const ground = new THREE.Mesh(geometry, material);
            ground.position.y = -1.5;
            ground.receiveShadow = true;
            scene.add(ground);

            // Stepping stones path
            const createPath = (points) => {
                points.forEach(p => {
                    const stone = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(1.2 + Math.random()*0.5, 0),
                        new THREE.MeshStandardMaterial({ color: 0xbbbbbb })
                    );
                    stone.position.set(p.x, 0.05, p.z);
                    stone.scale.y = 0.1;
                    stone.rotation.y = Math.random() * Math.PI;
                    stone.receiveShadow = true;
                    scene.add(stone);
                });
            };

            const points = [];
            for(let i=0; i<20; i++) {
                const t = i / 20;
                points.push({
                    x: -15 + 30 * t + Math.sin(t * 5) * 5,
                    z: 15 - 30 * t + Math.cos(t * 5) * 2
                });
            }
            createPath(points);
        }

        function createPond() {
            // Custom pond shape
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(10, -5, 20, 5, 25, 15);
            shape.bezierCurveTo(20, 25, 5, 25, 0, 15);
            shape.bezierCurveTo(-5, 5, 0, 0, 0, 0);

            const geometry = new THREE.ShapeGeometry(shape);
            geometry.rotateX(-Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: COLORS.water, 
                transparent: true, 
                opacity: 0.7,
                roughness: 0.05,
                metalness: 0.8
            });
            const pond = new THREE.Mesh(geometry, material);
            pond.position.set(5, 0.02, 5);
            pond.receiveShadow = true;
            scene.add(pond);

            // Pond bottom
            const bottom = pond.clone();
            bottom.position.y = -0.5;
            bottom.material = new THREE.MeshStandardMaterial({ color: 0x334444 });
            scene.add(bottom);

            // Add Koi
            for(let i=0; i<12; i++) {
                const koi = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.2, 0.8, 4, 8),
                    new THREE.MeshStandardMaterial({ color: Math.random() > 0.4 ? COLORS.koi1 : COLORS.koi2 })
                );
                koi.position.set(15 + (Math.random()-0.5)*15, -0.2, 15 + (Math.random()-0.5)*15);
                koi.userData = { 
                    angle: Math.random() * Math.PI * 2, 
                    radius: 4 + Math.random() * 6,
                    speed: 0.005 + Math.random() * 0.01,
                    yOffset: 15,
                    xOffset: 15
                };
                scene.add(koi);
                koiFish.push(koi);
            }
        }

        function createPagoda() {
            const pagodaGroup = new THREE.Group();
            
            const createLayer = (y, scale, hasBalcony = true) => {
                // Base
                const baseGeo = new THREE.BoxGeometry(10 * scale, 6, 10 * scale);
                const baseMat = new THREE.MeshStandardMaterial({ color: COLORS.pagodaWalls });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = y + 3;
                base.castShadow = true;
                base.receiveShadow = true;
                pagodaGroup.add(base);

                // Trim/Windows
                for(let i=0; i<4; i++) {
                    const trim = new THREE.Mesh(
                        new THREE.BoxGeometry(10.2 * scale, 0.5, 0.2),
                        new THREE.MeshStandardMaterial({ color: COLORS.pagodaTrim })
                    );
                    trim.position.set(0, y + 4, 5.1 * scale);
                    trim.rotation.y = (Math.PI / 2) * i;
                    // base.add(trim); // Relative positions are easier
                }

                // Roof
                const roofGeo = new THREE.ConeGeometry(8 * scale, 4, 4);
                const roofMat = new THREE.MeshStandardMaterial({ color: COLORS.pagodaRoof });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = y + 7.5;
                roof.rotation.y = Math.PI / 4;
                roof.scale.set(1.5, 0.8, 1.5);
                roof.castShadow = true;
                pagodaGroup.add(roof);

                if (hasBalcony) {
                    const balconyGeo = new THREE.BoxGeometry(12 * scale, 0.5, 12 * scale);
                    const balconyMat = new THREE.MeshStandardMaterial({ color: COLORS.pagodaTrim });
                    const balcony = new THREE.Mesh(balconyGeo, balconyMat);
                    balcony.position.y = y + 5.5;
                    pagodaGroup.add(balcony);
                }
            };

            // 3 Layers
            createLayer(0, 1.2);
            createLayer(8, 1.0);
            createLayer(16, 0.8);
            createLayer(24, 0.6, false);

            // Tip
            const tipGeo = new THREE.CylinderGeometry(0.1, 0.5, 3, 8);
            const tipMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const tip = new THREE.Mesh(tipGeo, tipMat);
            tip.position.y = 31;
            pagodaGroup.add(tip);

            pagodaGroup.position.set(-10, 0, -10);
            scene.add(pagodaGroup);
        }

        function createPond() {
            const pondGeo = new THREE.TorusGeometry(12, 4, 16, 100);
            // Using a simpler shape for the pond surface
            const surfaceGeo = new THREE.CircleGeometry(15, 32);
            surfaceGeo.rotateX(-Math.PI / 2);
            const surfaceMat = new THREE.MeshStandardMaterial({ 
                color: COLORS.water, 
                transparent: true, 
                opacity: 0.8,
                roughness: 0.1,
                metalness: 0.5
            });
            const pond = new THREE.Mesh(surfaceGeo, surfaceMat);
            pond.position.set(15, 0.1, 10);
            scene.add(pond);

            // Add Koi
            for(let i=0; i<8; i++) {
                const koi = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.3, 1, 4, 8),
                    new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? COLORS.koi1 : COLORS.koi2 })
                );
                koi.position.set(15 + (Math.random()-0.5)*15, -0.2, 10 + (Math.random()-0.5)*15);
                koi.userData = { 
                    angle: Math.random() * Math.PI * 2, 
                    radius: 5 + Math.random() * 5,
                    speed: 0.01 + Math.random() * 0.02
                };
                scene.add(koi);
                koiFish.push(koi);
            }
        }

        function createBridge() {
            const bridgeGroup = new THREE.Group();
            
            // Arch
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-8, 0, 0),
                new THREE.Vector3(0, 5, 0),
                new THREE.Vector3(8, 0, 0)
            );
            const points = curve.getPoints(20);
            const bridgeGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 20, 1.5, 8, false);
            const bridgeMat = new THREE.MeshStandardMaterial({ color: COLORS.bridge });
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridgeGroup.add(bridge);

            // Rails
            const railCurve1 = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-8, 2, 2),
                new THREE.Vector3(0, 7, 2),
                new THREE.Vector3(8, 2, 2)
            );
            const rail1 = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(railCurve1.getPoints(20)), 20, 0.3, 8, false), bridgeMat);
            bridgeGroup.add(rail1);

            const railCurve2 = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-8, 2, -2),
                new THREE.Vector3(0, 7, -2),
                new THREE.Vector3(8, 2, -2)
            );
            const rail2 = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(railCurve2.getPoints(20)), 20, 0.3, 8, false), bridgeMat);
            bridgeGroup.add(rail2);

            bridgeGroup.position.set(20, 0, 20);
            bridgeGroup.rotation.y = -Math.PI / 4;
            scene.add(bridgeGroup);
        }

        function createTrees() {
            const createCherryTree = (x, z) => {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.8, 10, 8),
                    new THREE.MeshStandardMaterial({ color: 0x4a3728 })
                );
                trunk.position.y = 5;
                group.add(trunk);

                const leaves = new THREE.Group();
                for(let i=0; i<5; i++) {
                    const cluster = new THREE.Mesh(
                        new THREE.SphereGeometry(4 + Math.random()*2, 8, 8),
                        new THREE.MeshStandardMaterial({ color: COLORS.cherry })
                    );
                    cluster.position.set((Math.random()-0.5)*5, 10 + Math.random()*5, (Math.random()-0.5)*5);
                    cluster.scale.y = 0.6;
                    leaves.add(cluster);
                }
                group.add(leaves);
                group.position.set(x, 0, z);
                scene.add(group);
            };

            createCherryTree(-20, -15);
            createCherryTree(-25, 5);
            createCherryTree(5, -25);
            createCherryTree(25, -15);

            // Falling Petals
            const petalGeo = new THREE.PlaneGeometry(0.2, 0.2);
            const petalMat = new THREE.MeshStandardMaterial({ color: COLORS.cherry, side: THREE.DoubleSide });
            for(let i=0; i<100; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                resetPetal(petal);
                scene.add(petal);
                petals.push(petal);
            }
        }

        function resetPetal(petal) {
            petal.position.set(
                (Math.random() - 0.5) * 60,
                20 + Math.random() * 20,
                (Math.random() - 0.5) * 60
            );
            petal.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            petal.userData.speed = 0.05 + Math.random() * 0.1;
            petal.userData.rotSpeed = 0.02 + Math.random() * 0.05;
        }

        function createEnvironment() {
            // Bamboo clusters
            for(let i=0; i<40; i++) {
                const b = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.2, 12 + Math.random()*8, 6),
                    new THREE.MeshStandardMaterial({ color: COLORS.bamboo })
                );
                const angle = Math.random() * Math.PI * 2;
                const dist = 32 + Math.random() * 5;
                b.position.set(Math.cos(angle)*dist, 6, Math.sin(angle)*dist);
                if (b.position.x > 0 && b.position.z > 0) continue; // Keep pond area clear
                scene.add(b);
            }

            // Rocks
            for(let i=0; i<20; i++) {
                const r = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(1 + Math.random()*2, 0),
                    new THREE.MeshStandardMaterial({ color: COLORS.stone, roughness: 0.9 })
                );
                r.position.set((Math.random()-0.5)*60, -0.5, (Math.random()-0.5)*60);
                r.scale.y = 0.4 + Math.random()*0.5;
                r.rotation.set(Math.random(), Math.random(), Math.random());
                r.castShadow = true;
                r.receiveShadow = true;
                scene.add(r);
            }

            // Stone Lanterns (Toro)
            const createLantern = (x, z) => {
                const group = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 1, 6), new THREE.MeshStandardMaterial({color: COLORS.stone}));
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2, 6), new THREE.MeshStandardMaterial({color: COLORS.stone}));
                stem.position.y = 1;
                const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.5), new THREE.MeshStandardMaterial({color: COLORS.stone}));
                head.position.y = 2.5;
                const top = new THREE.Mesh(new THREE.ConeGeometry(1.2, 1, 4), new THREE.MeshStandardMaterial({color: COLORS.stone}));
                top.position.y = 3.5;
                top.rotation.y = Math.PI/4;
                
                group.add(base, stem, head, top);
                group.position.set(x, 0, z);
                group.castShadow = true;
                scene.add(group);

                // Small light inside
                const light = new THREE.PointLight(0xffaa44, 2, 10);
                light.position.set(x, 2.5, z);
                scene.add(light);
            };

            createLantern(-18, 5);
            createLantern(-5, 18);
            createLantern(12, 0);

            // People
            const createPerson = (x, z, color, hairColor) => {
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.2, 4, 8), new THREE.MeshStandardMaterial({color: color}));
                body.position.y = 1;
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshStandardMaterial({color: 0xffdbac}));
                head.position.y = 2;
                const hair = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 8), new THREE.MeshStandardMaterial({color: hairColor}));
                hair.position.y = 2.1;
                hair.scale.set(1, 0.6, 1);
                
                group.add(body, head, hair);
                group.position.set(x, 0, z);
                group.castShadow = true;
                scene.add(group);
            };

            createPerson(-10, 10, 0x444444, 0x221100); // Person 1
            createPerson(-8, 14, 0x225522, 0x442200); // Person 2
            createPerson(22, 18, 0x222288, 0x111111); // Person 3 on bridge
        }

        function setupPostProcessing() {
            composer = new EffectComposer(renderer);
            
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.4, 0.4, 0.9
            );
            composer.addPass(bloomPass);

            const bokehPass = new BokehPass(scene, camera, {
                focus: 45.0,
                aperture: 0.00002,
                maxblur: 0.005,
                width: window.innerWidth,
                height: window.innerHeight
            });
            composer.addPass(bokehPass);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();

            // Animate Petals
            petals.forEach(p => {
                p.position.y -= p.userData.speed;
                p.position.x += Math.sin(time + p.position.z) * 0.02;
                p.rotation.x += p.userData.rotSpeed;
                p.rotation.y += p.userData.rotSpeed;
                if(p.position.y < 0) resetPetal(p);
            });

            // Animate Koi
            koiFish.forEach(k => {
                k.userData.angle += k.userData.speed;
                k.position.x = k.userData.xOffset + Math.cos(k.userData.angle) * k.userData.radius;
                k.position.z = k.userData.yOffset + Math.sin(k.userData.angle) * k.userData.radius;
                k.rotation.y = -k.userData.angle + Math.PI/2;
                k.position.y = -0.4 + Math.sin(time * 2 + k.userData.radius) * 0.05;
            });

            // Cinematic Camera Float
            camera.position.y += Math.sin(time * 0.5) * 0.02;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
