<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Garden • Cinematic 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Inter:wght@300;400&amp;display=swap');
        
        :root {
            --gold: #c5a46e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #f0e6d2;
            font-family: 'Inter', system_ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .cinematic-header {
            padding: 1.25rem 2rem;
            background: linear-gradient(to bottom, #111, transparent);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }
        
        .title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -1.5px;
            background: linear-gradient(#f0e6d2, #c5a46e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 0.875rem;
            opacity: 0.6;
            letter-spacing: 2px;
            font-weight: 300;
        }
        
        .scene-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1a1814 0%, #0a0a0a 70%);
            overflow: hidden;
        }
        
        .scene-container {
            width: 820px;
            height: 820px;
            position: relative;
            perspective: 1600px;
            cursor: grab;
        }
        
        .scene-container:active {
            cursor: grabbing;
        }
        
        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            transform: rotateX(62deg) rotateY(0deg) rotateZ(45deg);
        }
        
        .ground {
            position: absolute;
            width: 780px;
            height: 780px;
            background: linear-gradient(#3a3a2f, #2c2a24);
            border-radius: 50%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6),
                        inset 0 0 120px rgba(0,0,0,0.5);
            transform: translateZ(-40px);
            left: 20px;
            top: 20px;
        }
        
        .stone-path {
            position: absolute;
            width: 380px;
            height: 120px;
            background: #55524a;
            border-radius: 50px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
            transform: translateZ(8px) rotateZ(-25deg);
            left: 210px;
            top: 320px;
            border: 1px solid #44413a;
        }
        
        .pagoda {
            position: absolute;
            left: 310px;
            top: 195px;
            width: 200px;
            height: 260px;
            transform-style: preserve-3d;
            transform: translateZ(60px);
        }
        
        .pagoda-base {
            position: absolute;
            width: 100%;
            height: 70px;
            background: linear-gradient(#8c6645, #664d35);
            border: 2px solid #3f2a1f;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            transform: translateZ(0);
        }
        
        .pagoda-floor {
            position: absolute;
            width: 94%;
            height: 18px;
            background: #5c4633;
            left: 3%;
            top: 65px;
            box-shadow: 0 4px 0 #3f2a1f;
            transform: translateZ(4px);
        }
        
        .pagoda-roof {
            position: absolute;
            width: 110%;
            height: 42px;
            background: linear-gradient(#2f2a26, #1f1c1a);
            left: -5%;
            top: 78px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.7),
                        0 0 0 3px #1a1814;
            transform: translateZ(10px);
            border-radius: 4px;
        }
        
        .pagoda-roof::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent, rgba(197,164,110,0.15));
        }
        
        .pagoda-tier {
            position: absolute;
            width: 82%;
            height: 52px;
            background: linear-gradient(#d4c3a3, #a38c6d);
            left: 9%;
            top: 105px;
            box-shadow: 0 8px 0 #664d35,
                        0 0 0 4px #3f2a1f;
            transform: translateZ(18px);
        }
        
        .pagoda-roof2 {
            position: absolute;
            width: 96%;
            height: 38px;
            background: linear-gradient(#2f2a26, #1f1c1a);
            left: 2%;
            top: 152px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.6);
            transform: translateZ(24px);
        }
        
        .pagoda-top {
            position: absolute;
            width: 66%;
            height: 66px;
            background: linear-gradient(#d4c3a3, #a38c6d);
            left: 17%;
            top: 180px;
            box-shadow: 0 6px 0 #664d35,
                        0 0 0 3px #3f2a1f;
            transform: translateZ(32px);
        }
        
        .pagoda-spire {
            position: absolute;
            width: 18px;
            height: 38px;
            background: linear-gradient(#c5a46e, #8c6645);
            left: 50%;
            top: 235px;
            transform: translate(-50%, 0) translateZ(42px);
            box-shadow: 0 0 12px #c5a46e;
        }
        
        .cherry-tree {
            position: absolute;
            width: 120px;
            height: 140px;
            transform-style: preserve-3d;
        }
        
        .tree-left {
            left: 95px;
            top: 145px;
            transform: translateZ(25px);
        }
        
        .tree-right {
            left: 590px;
            top: 170px;
            transform: translateZ(15px);
        }
        
        .tree-trunk {
            position: absolute;
            width: 18px;
            height: 85px;
            background: linear-gradient(#3f2a1f, #2c2119);
            left: 51px;
            top: 55px;
            border-radius: 40%;
            box-shadow: 6px 0 10px rgba(0,0,0,0.4);
        }
        
        .blossom {
            position: absolute;
            width: 42px;
            height: 42px;
            background: #f8d7e8;
            border-radius: 50%;
            box-shadow: 0 0 18px #f8d7e8,
                        inset 0 0 10px #e89cb8;
            animation: sway 3.5s ease-in-out infinite;
        }
        
        .blossom::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #f8d7e8 30%, transparent 70%);
            border-radius: 50%;
        }
        
        .pond {
            position: absolute;
            width: 310px;
            height: 195px;
            background: linear-gradient(#4a7c8c, #2d5461);
            border-radius: 50% 40% 55% 35%;
            box-shadow: inset 0 30px 60px rgba(0,0,0,0.4),
                        0 15px 35px rgba(0,0,0,0.3);
            transform: translateZ(12px) rotateZ(-12deg);
            left: 400px;
            top: 420px;
            border: 8px solid #3a5f6b;
            overflow: hidden;
        }
        
        .koi {
            position: absolute;
            width: 26px;
            height: 13px;
            background: #f5f0e6;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255,255,255,0.6);
            animation: swim 4.2s linear infinite;
        }
        
        .koi::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #c13c3c;
            border-radius: 50%;
            top: 1.5px;
            left: 3px;
        }
        
        .bridge {
            position: absolute;
            width: 115px;
            height: 32px;
            background: linear-gradient(#8c3f2f, #5c2a1f);
            border-radius: 50px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.5);
            transform: translateZ(28px) rotateZ(18deg);
            left: 535px;
            top: 475px;
            border: 4px solid #3f2a1f;
        }
        
        .bridge::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background: #a67c5d;
            top: 8px;
            left: 0;
        }
        
        .lantern {
            position: absolute;
            width: 18px;
            height: 32px;
            background: #d4c3a3;
            border-radius: 4px;
            box-shadow: 0 0 12px #f0e6d2,
                        inset 0 0 6px #8c6645;
            transform: translateZ(22px);
        }
        
        .person {
            position: absolute;
            width: 14px;
            height: 32px;
            transform-style: preserve-3d;
        }
        
        .person-head {
            position: absolute;
            width: 9px;
            height: 9px;
            background: #d4b89c;
            border-radius: 50%;
            top: 0;
            left: 2.5px;
        }
        
        .person-body {
            position: absolute;
            width: 14px;
            height: 18px;
            background: #2c4a3a;
            top: 9px;
            border-radius: 3px;
        }
        
        .person2 {
            left: 305px;
            top: 355px;
            transform: translateZ(18px);
        }
        
        .person3 {
            left: 275px;
            top: 360px;
            transform: translateZ(16px);
        }
        
        .person4 {
            left: 630px;
            top: 490px;
            transform: translateZ(34px);
        }
        
        .petal {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f8d7e8;
            border-radius: 50% 20% 50% 20%;
            pointer-events: none;
            box-shadow: 0 0 6px #f8d7e8;
            z-index: 50;
            animation: fall linear forwards;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 200;
            background: rgba(20, 18, 15, 0.75);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #333;
        }
        
        .control-btn {
            background: #2c2a24;
            color: #c5a46e;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .control-btn:hover {
            background: #3f3a30;
            transform: translateY(-1px);
        }
        
        .info {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 0.75rem;
            opacity: 0.5;
            text-align: right;
            line-height: 1.3;
        }
        
        @keyframes sway {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
        }
        
        @keyframes swim {
            0% { transform: translateX(0); }
            100% { transform: translateX(260px); }
        }
        
        .light-beam {
            position: absolute;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(197,164,110,0.06) 10%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            z-index: 10;
            animation: lightMove 18s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="cinematic-header">
        <div>
            <div class="title">Zen Garden</div>
            <div class="subtitle">KYOTO • SPRING 1892</div>
        </div>
        <div style="text-align: right; font-size: 0.75rem; opacity: 0.7;">
            CINEMATIC 3D EXPERIENCE<br>
            <span style="font-size:0.65rem">DRAG TO ORBIT • SCROLL TO ZOOM</span>
        </div>
    </div>
    
    <div class="scene-wrapper">
        <div class="scene-container" id="container">
            <div class="scene" id="scene">
                
                <!-- Ground -->
                <div class="ground"></div>
                
                <!-- Stone Path -->
                <div class="stone-path"></div>
                
                <!-- Pagoda -->
                <div class="pagoda">
                    <div class="pagoda-base"></div>
                    <div class="pagoda-floor"></div>
                    <div class="pagoda-roof"></div>
                    <div class="pagoda-tier"></div>
                    <div class="pagoda-roof2"></div>
                    <div class="pagoda-top"></div>
                    <div class="pagoda-spire"></div>
                    
                    <!-- Windows -->
                    <div style="position:absolute; width:22px; height:14px; background:#1f1c1a; left:38px; top:115px; transform:translateZ(22px); box-shadow:0 0 6px #c5a46e;"></div>
                    <div style="position:absolute; width:22px; height:14px; background:#1f1c1a; left:140px; top:115px; transform:translateZ(22px); box-shadow:0 0 6px #c5a46e;"></div>
                </div>
                
                <!-- Cherry Tree Left -->
                <div class="cherry-tree tree-left">
                    <div class="tree-trunk"></div>
                    <div class="blossom" style="left:22px; top:18px; width:48px; height:48px; animation-delay: 0.3s;"></div>
                    <div class="blossom" style="left:58px; top:12px; width:38px; height:38px; animation-delay: 1.4s;"></div>
                    <div class="blossom" style="left:12px; top:48px; width:32px; height:32px; animation-delay: 2.1s;"></div>
                    <div class="blossom" style="left:72px; top:44px; width:42px; height:42px; animation-delay: 0.9s;"></div>
                </div>
                
                <!-- Cherry Tree Right -->
                <div class="cherry-tree tree-right">
                    <div class="tree-trunk"></div>
                    <div class="blossom" style="left:35px; top:15px; width:52px; height:52px; animation-delay: 1.8s;"></div>
                    <div class="blossom" style="left:8px; top:38px; width:36px; height:36px; animation-delay: 0.6s;"></div>
                    <div class="blossom" style="left:68px; top:32px; width:44px; height:44px; animation-delay: 2.7s;"></div>
                </div>
                
                <!-- Koi Pond -->
                <div class="pond" id="pond">
                    <!-- Koi fish -->
                    <div class="koi" style="left: 35px; top: 65px; animation-duration: 5.8s; background:#f8e8c8;"></div>
                    <div class="koi" style="left: 80px; top: 105px; animation-duration: 4.3s; background:#f5f0e6;"></div>
                    <div class="koi" style="left: 155px; top: 52px; animation-duration: 6.4s; background:#f8e8c8;"></div>
                    <div class="koi" style="left: 210px; top: 125px; animation-duration: 3.9s; background:#f5f0e6;"></div>
                </div>
                
                <!-- Red Bridge -->
                <div class="bridge"></div>
                
                <!-- Lanterns -->
                <div class="lantern" style="left: 185px; top: 295px;"></div>
                <div class="lantern" style="left: 430px; top: 510px;"></div>
                
                <!-- People -->
                <div class="person person2">
                    <div class="person-head"></div>
                    <div class="person-body" style="background:#3a4f5c;"></div>
                </div>
                <div class="person person3">
                    <div class="person-head"></div>
                    <div class="person-body" style="background:#2c4a3a;"></div>
                </div>
                <div class="person person4">
                    <div class="person-head"></div>
                    <div class="person-body" style="background:#4a3f2f;"></div>
                </div>
                
                <!-- Light beam -->
                <div class="light-beam" style="left: 310px; top: 210px;"></div>
                
            </div>
        </div>
        
        <!-- Floating petals container -->
        <div id="petals-container" style="position:absolute; width:820px; height:820px; pointer-events:none; z-index:60;"></div>
    </div>
    
    <div class="controls">
        <button onclick="resetCamera()" class="control-btn">RESET VIEW</button>
        <button onclick="toggleAnimation()" class="control-btn" id="anim-btn">PAUSE ANIMATION</button>
        <button onclick="changeLighting()" class="control-btn">GOLDEN HOUR</button>
    </div>
    
    <div class="info">
        ISOMETRIC • CINEMATIC<br>
        <span style="font-size:10px">Smooth camera movement enabled</span>
    </div>
    
    <script>
        const scene = document.getElementById('scene');
        const container = document.getElementById('container');
        let isDragging = false;
        let previousX = 0;
        let previousY = 0;
        let rotX = 62;
        let rotY = 0;
        let rotZ = 45;
        let scale = 1;
        let animating = true;
        let animationFrame;
        
        // Mouse drag to orbit camera
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousX = e.clientX;
            previousY = e.clientY;
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - previousX;
            const deltaY = e.clientY - previousY;
            
            rotY += deltaX * 0.4;
            rotX += deltaY * 0.35;
            
            // Clamp rotation
            rotX = Math.max(48, Math.min(74, rotX));
            
            updateSceneTransform();
            
            previousX = e.clientX;
            previousY = e.clientY;
        });
        
        // Scroll to zoom
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale += e.deltaY * -0.0018;
            scale = Math.max(0.65, Math.min(1.45, scale));
            updateSceneTransform();
        });
        
        function updateSceneTransform() {
            scene.style.transition = 'transform 0.1s ease-out';
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(${scale})`;
        }
        
        function resetCamera() {
            rotX = 62;
            rotY = 0;
            rotZ = 45;
            scale = 1;
            scene.style.transition = 'transform 0.8s cubic-bezier(0.23, 1.0, 0.32, 1)';
            updateSceneTransform();
            
            setTimeout(() => {
                scene.style.transition = 'transform 0.1s ease-out';
            }, 800);
        }
        
        // Gentle automatic camera movement
        let autoAngle = 0;
        
        function autoOrbit() {
            if (!animating) return;
            
            autoAngle += 0.035;
            
            // Subtle breathing rotation
            const targetRotY = Math.sin(autoAngle * 0.6) * 9;
            const targetRotX = 62 + Math.sin(autoAngle * 0.35) * 2.5;
            
            rotY = rotY * 0.94 + targetRotY * 0.06;
            rotX = rotX * 0.95 + targetRotX * 0.05;
            
            updateSceneTransform();
            
            animationFrame = requestAnimationFrame(autoOrbit);
        }
        
        function toggleAnimation() {
            animating = !animating;
            const btn = document.getElementById('anim-btn');
            
            if (animating) {
                btn.textContent = 'PAUSE ANIMATION';
                autoOrbit();
            } else {
                btn.textContent = 'RESUME ANIMATION';
                cancelAnimationFrame(animationFrame);
            }
        }
        
        function changeLighting() {
            const sceneEl = document.getElementById('scene');
            if (sceneEl.style.filter === 'sepia(0.35) saturate(1.4)') {
                sceneEl.style.filter = 'none';
            } else {
                sceneEl.style.transition = 'filter 1.2s ease';
                sceneEl.style.filter = 'sepia(0.35) saturate(1.4)';
                setTimeout(() => {
                    sceneEl.style.transition = 'transform 0.1s ease-out';
                }, 1200);
            }
        }
        
        // Create falling cherry petals
        function createPetal() {
            const petalContainer = document.getElementById('petals-container');
            const petal = document.createElement('div');
            petal.className = 'petal';
            
            const startX = Math.random() * 820;
            petal.style.left = `${startX}px`;
            petal.style.top = `-15px`;
            
            const duration = Math.random() * 5200 + 6800;
            petal.style.animation = `fall ${duration}ms linear forwards`;
            
            // Random size
            const size = Math.random() * 7 + 6;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            
            petalContainer.appendChild(petal);
            
            setTimeout(() => {
                if (petal.parentNode) petal.parentNode.removeChild(petal);
            }, duration + 100);
        }
        
        // Spawn petals periodically
        function startPetalFall() {
            setInterval(() => {
                if (animating) {
                    for (let i = 0; i < 2; i++) {
                        setTimeout(() => {
                            createPetal();
                        }, i * 240);
                    }
                }
            }, 920);
        }
        
        // Koi fish swimming with more natural motion
        function enhanceKoi() {
            const kois = document.querySelectorAll('.koi');
            kois.forEach((koi, index) => {
                const baseDuration = parseFloat(koi.style.animationDuration) || 4.5;
                
                setInterval(() => {
                    if (!animating) return;
                    
                    koi.style.transition = `transform ${baseDuration * 0.9}ms ease-in-out`;
                    
                    const randomY = 48 + Math.random() * 85;
                    koi.style.top = `${randomY}px`;
                    
                    setTimeout(() => {
                        if (koi.parentNode) {
                            koi.style.transition = `transform ${baseDuration}ms linear`;
                        }
                    }, baseDuration * 850);
                }, (baseDuration * 1000) + (index * 800));
            });
        }
        
        function updateSceneTransformInitial() {
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(${scale})`;
        }
        
        // Initialize everything
        function init() {
            updateSceneTransformInitial();
            
            // Start automatic orbit
            setTimeout(() => {
                autoOrbit();
            }, 1200);
            
            // Start petals
            setTimeout(startPetalFall, 800);
            
            // Enhance koi fish
            setTimeout(enhanceKoi, 1400);
            
            // Add subtle depth of field effect on scroll
            container.addEventListener('wheel', () => {
                if (scale < 0.95) {
                    scene.style.filter = 'blur(0.6px)';
                } else {
                    scene.style.filter = 'none';
                }
            });
            
            // Keyboard support
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    resetCamera();
                }
                if (e.key === ' ') {
                    e.preventDefault();
                    toggleAnimation();
                }
            });
            
            // Initial petal burst
            setTimeout(() => {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => createPetal(), i * 160);
                }
            }, 2100);
            
            // Welcome message hint
            setTimeout(() => {
                console.log('%c[Cinematic] 3D Japanese Garden ready. Drag to orbit.', 'color:#666');
            }, 3000);
        }
        
        // Boot the experience
        window.onload = init;
    </script>
</body>
</html>
