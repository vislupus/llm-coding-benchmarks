<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden 3D Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 100%);
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Georgia', serif;
            font-size: 24px;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="loading">Loading Japanese Garden...</div>
    <div id="canvas-container"></div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(40, 35, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(50, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xd4e6ff, 0.4);
        fillLight.position.set(-30, 20, -20);
        scene.add(fillLight);

        // Materials
        const materials = {
            pagodaRoof: new THREE.MeshStandardMaterial({ 
                color: 0x2c2c2c, 
                roughness: 0.7,
                metalness: 0.1
            }),
            pagodaWood: new THREE.MeshStandardMaterial({ 
                color: 0x8b4513, 
                roughness: 0.6,
                metalness: 0.1
            }),
            pagodaWhite: new THREE.MeshStandardMaterial({ 
                color: 0xf5f5dc, 
                roughness: 0.8
            }),
            gold: new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                roughness: 0.3,
                metalness: 0.8
            }),
            grass: new THREE.MeshStandardMaterial({ 
                color: 0x7cbe58, 
                roughness: 0.9
            }),
            stone: new THREE.MeshStandardMaterial({ 
                color: 0x808080, 
                roughness: 0.9
            }),
            water: new THREE.MeshStandardMaterial({ 
                color: 0x40a4df, 
                roughness: 0.1,
                metalness: 0.3,
                transparent: true,
                opacity: 0.8
            }),
            bridge: new THREE.MeshStandardMaterial({ 
                color: 0xb22222, 
                roughness: 0.5
            }),
            cherryBlossom: new THREE.MeshStandardMaterial({ 
                color: 0xffb6c1, 
                roughness: 0.9
            }),
            bamboo: new THREE.MeshStandardMaterial({ 
                color: 0x6b8e23, 
                roughness: 0.7
            }),
            koiRed: new THREE.MeshStandardMaterial({ color: 0xff4500 }),
            koiWhite: new THREE.MeshStandardMaterial({ color: 0xffffff }),
            koiOrange: new THREE.MeshStandardMaterial({ color: 0xffa500 }),
            koiBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a }),
            personSkin: new THREE.MeshStandardMaterial({ color: 0xffdbac }),
            personClothes: new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
        };

        // Ground
        const groundGeometry = new THREE.CylinderGeometry(35, 35, 1, 64);
        const ground = new THREE.Mesh(groundGeometry, materials.grass);
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Pagoda builder function
        function createPagoda(x, z) {
            const pagodaGroup = new THREE.Group();
            pagodaGroup.position.set(x, 0, z);

            // Base platform
            const baseGeometry = new THREE.BoxGeometry(16, 2, 16);
            const base = new THREE.Mesh(baseGeometry, materials.stone);
            base.position.y = 1;
            base.castShadow = true;
            base.receiveShadow = true;
            pagodaGroup.add(base);

            // Pagoda tiers
            const tierHeight = 5;
            const tierWidths = [12, 10, 8];
            const tierHeights = [4, 4, 4];

            for (let i = 0; i < 3; i++) {
                const tierGroup = new THREE.Group();
                tierGroup.position.y = 2 + i * tierHeight;

                // Main structure
                const structureWidth = tierWidths[i];
                const structure = new THREE.Mesh(
                    new THREE.BoxGeometry(structureWidth, tierHeight, structureWidth),
                    materials.pagodaWhite
                );
                structure.position.y = tierHeight / 2;
                structure.castShadow = true;
                structure.receiveShadow = true;
                tierGroup.add(structure);

                // Roof
                const roofSize = structureWidth + 2;
                const roofGeometry = new THREE.ConeGeometry(roofSize, 1.5, 4);
                const roof = new THREE.Mesh(roofGeometry, materials.pagodaRoof);
                roof.position.y = tierHeight + 0.75;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                tierGroup.add(roof);

                // Balcony railing
                const railingGeometry = new THREE.TorusGeometry(structureWidth / 2 + 0.5, 0.1, 8, 16);
                const railing = new THREE.Mesh(railingGeometry, materials.pagodaWood);
                railing.position.y = tierHeight - 1;
                railing.rotation.x = Math.PI / 2;
                tierGroup.add(railing);

                pagodaGroup.add(tierGroup);
            }

            // Top spire
            const spireBase = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.5, 2, 8), materials.gold);
            spireBase.position.y = 16;
            pagodaGroup.add(spireBase);

            const spireTop = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 8), materials.gold);
            spireTop.position.y = 18;
            pagodaGroup.add(spireTop);

            scene.add(pagodaGroup);
            return pagodaGroup;
        }

        createPagoda(0, -5);

        // Cherry blossom trees
        function createCherryTree(x, z, scale = 1) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);
            treeGroup.scale.set(scale, scale, scale);

            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.5, 4, 8);
            const trunk = new THREE.Mesh(trunkGeometry, new THREE.MeshStandardMaterial({ color: 0x4a3728 }));
            trunk.position.y = 2;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Foliage clusters
            const foliagePositions = [
                [0, 5, 0], [1.5, 5, 1], [-1.5, 5, 1], [0, 6, 1.5],
                [2, 4, 0], [-2, 4, 0], [0, 4, -1.5], [1, 3, -1],
                [-1, 3, 1], [0, 7, -1]
            ];

            foliagePositions.forEach(([dx, dy, dz]) => {
                const foliage = new THREE.Mesh(
                    new THREE.SphereGeometry(1.2, 16, 16),
                    materials.cherryBlossom
                );
                foliage.position.set(dx, dy + 2, dz);
                foliage.castShadow = true;
                treeGroup.add(foliage);
            });

            scene.add(treeGroup);
        }

        createCherryTree(-12, -8, 1.2);
        createCherryTree(12, -8, 1.1);
        createCherryTree(-15, 5, 0.9);
        createCherryTree(15, 5, 1);

        // Bamboo grove
        function createBamboo(x, z) {
            const count = 15;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const radius = 3 + Math.random() * 2;
                const height = 3 + Math.random() * 4;
                
                const bambooGroup = new THREE.Group();
                bambooGroup.position.set(x + Math.cos(angle) * radius, 0, z + Math.sin(angle) * radius);
                
                const stalk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.1, 0.15, height, 8),
                    materials.bamboo
                );
                stalk.position.y = height / 2;
                stalk.castShadow = true;
                bambooGroup.add(stalk);

                // Bamboo leaves
                const leafGeometry = new THREE.ConeGeometry(0.3, 1, 6);
                for (let j = 0; j < 5; j++) {
                    const leaf = new THREE.Mesh(leafGeometry, materials.bamboo);
                    const leafAngle = (j / 5) * Math.PI * 2;
                    leaf.position.set(Math.cos(leafAngle) * 0.2, height - 0.5, Math.sin(leafAngle) * 0.2);
                    leaf.rotation.z = leafAngle;
                    leaf.rotation.x = -0.3;
                    bambooGroup.add(leaf);
                }

                scene.add(bambooGroup);
            }
        }

        createBamboo(-14, 8);
        createBamboo(13, 8);

        // Koi pond
        function createPond() {
            const pondGroup = new THREE.Group();

            // Pond base
            const pondShape = new THREE.Shape();
            pondShape.moveTo(10, 5);
            pondShape.bezierCurveTo(15, 5, 18, 0, 18, -5);
            pondShape.bezierCurveTo(18, -12, 10, -15, 5, -15);
            pondShape.bezierCurveTo(-5, -15, -10, -10, -10, -5);
            pondShape.bezierCurveTo(-10, 0, -5, 5, 0, 5);
            pondShape.bezierCurveTo(5, 5, 8, 5, 10, 5);

            const pondGeometry = new THREE.ExtrudeGeometry(pondShape, { depth: 0.5, bevelEnabled: false });
            const pond = new THREE.Mesh(pondGeometry, materials.water);
            pond.rotation.x = -Math.PI / 2;
            pond.position.set(10, -0.3, -5);
            pond.receiveShadow = true;
            pondGroup.add(pond);

            // Pond edge
            const edgeGeometry = new THREE.CylinderGeometry(12, 12, 0.8, 64);
            const edge = new THREE.Mesh(edgeGeometry, materials.stone);
            edge.position.set(10, 0.4, -5);
            edgeGroup.add(edge);

            scene.add(pondGroup);
            return pondGroup;
        }

        const pondGroup = createPond();

        // Koi fish
        const koiFish = [];
        const koiPositions = [
            { x: 12, z: -3, color: materials.koiRed },
            { x: 14, z: -8, color: materials.koiOrange },
            { x: 8, z: -10, color: materials.koiWhite },
            { x: 6, z: -5, color: materials.koiBlack },
            { x: 15, z: -12, color: materials.koiOrange },
            { x: 10, z: -13, color: materials.koiRed },
            { x: 16, z: -3, color: materials.koiWhite },
            { x: 18, z: -8, color: materials.koiBlack }
        ];

        koiPositions.forEach((pos, index) => {
            const fishGroup = new THREE.Group();
            fishGroup.position.set(pos.x, -0.2, pos.z);

            // Body
            const body = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 8, 8),
                pos.color
            );
            body.scale.set(1.5, 0.6, 0.8);
            fishGroup.add(body);

            // Tail
            const tail = new THREE.Mesh(
                new THREE.ConeGeometry(0.2, 0.6, 6),
                pos.color
            );
            tail.position.x = -0.6;
            tail.rotation.y = Math.PI;
            fishGroup.add(tail);

            // Eye
            const eye = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0x000000 })
            );
            eye.position.set(0.3, 0.1, 0.3);
            fishGroup.add(eye);

            fishGroup.userData = { 
                speed: 0.02 + Math.random() * 0.02,
                direction: Math.random() * Math.PI * 2,
                wobble: Math.random() * Math.PI * 2
            };
            
            koiFish.push(fishGroup);
            scene.add(fishGroup);
        });

        // Bridge
        function createBridge() {
            const bridgeGroup = new THREE.Group();

            // Bridge supports
            const support1 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 3, 8),
                materials.stone
            );
            support1.position.set(15, -1, -8);
            bridgeGroup.add(support1);

            const support2 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 3, 8),
                materials.stone
            );
            support2.position.set(15, -1, -2);
            bridgeGroup.add(support2);

            // Bridge deck
            const deckGeometry = new THREE.BoxGeometry(10, 0.3, 2.5);
            const deck = new THREE.Mesh(deckGeometry, materials.bridge);
            deck.position.set(15, 0, -5);
            deck.rotation.x = -0.15;
            deck.castShadow = true;
            bridgeGroup.add(deck);

            // Railings
            for (let i = 0; i < 5; i++) {
                const railingPost = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.08, 1, 8),
                    materials.bridge
                );
                railingPost.position.set(13 + i * 0.5, 0.5, -6.2);
                bridgeGroup.add(railingPost);

                const railingPost2 = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.08, 1, 8),
                    materials.bridge
                );
                railingPost2.position.set(13 + i * 0.5, 0.5, -3.8);
                bridgeGroup.add(railingPost2);
            }

            // Handrails
            const handrailTop = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.05, 10, 8),
                materials.bridge
            );
            handrailTop.position.set(15, 0.5, -6.2);
            handrailTop.rotation.x = -0.15;
            bridgeGroup.add(handrailTop);

            const handrailBottom = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.05, 10, 8),
                materials.bridge
            );
            handrailBottom.position.set(15, 0.5, -3.8);
            handrailBottom.rotation.x = -0.15;
            bridgeGroup.add(handrailBottom);

            scene.add(bridgeGroup);
        }

        createBridge();

        // Stone lanterns
        function createStoneLantern(x, z) {
            const lanternGroup = new THREE.Group();
            lanternGroup.position.set(x, 0, z);

            // Base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.6, 0.8, 8),
                materials.stone
            );
            base.position.y = 0.4;
            base.castShadow = true;
            lanternGroup.add(base);

            // Pole
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.15, 2, 8),
                materials.stone
            );
            pole.position.y = 1.8;
            lanternGroup.add(pole);

            // Light box
            const lightBox = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.6, 0.6),
                materials.stone
            );
            lightBox.position.y = 2.8;
            lanternGroup.add(lightBox);

            // Roof
            const roof = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.3, 0.3, 8),
                materials.stone
            );
            roof.position.y = 3.2;
            lanternGroup.add(roof);

            scene.add(lanternGroup);
        }

        createStoneLantern(-8, 5);
        createStoneLantern(-5, 8);
        createStoneLantern(-3, 3);
        createStoneLantern(-1, -3);

        // Path
        function createPath() {
            const pathGroup = new THREE.Group();

            const pathPoints = [
                { x: -15, z: 5 },
                { x: -12, z: 3 },
                { x: -8, z: 2 },
                { x: -5, z: 0 },
                { x: -3, z: -2 },
                { x: 0, z: -3 },
                { x: 5, z: -3 },
                { x: 8, z: -4 },
                { x: 10, z: -5 }
            ];

            pathPoints.forEach((point, index) => {
                const stoneGeometry = new THREE.CircleGeometry(0.6 + Math.random() * 0.4, 8);
                const stone = new THREE.Mesh(stoneGeometry, materials.stone);
                stone.rotation.x = -Math.PI / 2;
                stone.position.set(point.x, 0.05, point.z);
                stone.receiveShadow = true;
                pathGroup.add(stone);
            });

            scene.add(pathGroup);
        }

        createPath();

        // People
        function createPerson(x, z, color) {
            const personGroup = new THREE.Group();
            personGroup.position.set(x, 0, z);

            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.25, 0.8, 8),
                new THREE.MeshStandardMaterial({ color: color })
            );
            body.position.y = 0.9;
            body.castShadow = true;
            personGroup.add(body);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                materials.personSkin
            );
            head.position.y = 1.5;
            personGroup.add(head);

            // Legs
            const legGeometry = new THREE.CylinderGeometry(0.1, 0.12, 0.8, 8);
            const leftLeg = new THREE.Mesh(legGeometry, new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
            leftLeg.position.set(-0.1, 0.4, 0);
            personGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeometry, new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
            rightLeg.position.set(0.1, 0.4, 0);
            personGroup.add(rightLeg);

            scene.add(personGroup);
            return personGroup;
        }

        const person1 = createPerson(-8, 2, 0xffffff);
        const person2 = createPerson(-6, 0, 0x4a7c23);
        const person3 = createPerson(17, -5, 0x2c3e50);

        // Falling cherry blossom petals
        const petals = [];
        const petalGeometry = new THREE.PlaneGeometry(0.15, 0.15);
        const petalMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffb6c1, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9
        });

        for (let i = 0; i < 100; i++) {
            const petal = new THREE.Mesh(petalGeometry, petalMaterial);
            petal.position.set(
                (Math.random() - 0.5) * 60,
                Math.random() * 20,
                (Math.random() - 0.5) * 60
            );
            petal.rotation.z = Math.random() * Math.PI;
            petal.rotation.y = Math.random() * Math.PI;
            petal.userData = {
                speed: 0.02 + Math.random() * 0.03,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.5 + Math.random() * 0.5
            };
            petals.push(petal);
            scene.add(petal);
        }

        // Bushes
        function createBush(x, z, scale) {
            const bushGroup = new THREE.Group();
            bushGroup.position.set(x, 0, z);
            bushGroup.scale.set(scale, scale, scale);

            const bushGeometry = new THREE.SphereGeometry(1, 8, 8);
            const bush = new THREE.Mesh(bushGeometry, new THREE.MeshStandardMaterial({ color: 0x2d5a27 }));
            bush.position.y = 0.8;
            bush.castShadow = true;
            bushGroup.add(bush);

            scene.add(bushGroup);
        }

        createBush(-10, 0, 1.2);
        createBush(-8, -2, 1);
        createBush(-5, -1, 1.3);
        createBush(2, -2, 1.1);
        createBush(4, -4, 1);
        createBush(7, -6, 1.4);
        createBush(10, -8, 1.2);
        createBush(-12, 6, 1.1);
        createBush(8, 6, 1);

        // Rock decorations
        function createRock(x, z, scale) {
            const rockGroup = new THREE.Group();
            rockGroup.position.set(x, 0, z);
            rockGroup.scale.set(scale, scale, scale);

            const rockGeometry = new THREE.DodecahedronGeometry(1, 0);
            const rock = new THREE.Mesh(rockGeometry, materials.stone);
            rock.position.y = 0.8;
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            rockGroup.add(rock);

            scene.add(rockGroup);
        }

        createRock(-14, 2, 1.5);
        createRock(-13, 4, 1.2);
        createRock(8, -10, 1.3);
        createRock(11, -11, 1.1);
        createRock(5, 2, 1);

        // Camera animation
        let time = 0;
        const initialCameraPos = camera.position.clone();

        function animateCamera() {
            time += 0.001;
            const orbitRadius = 45;
            const orbitSpeed = 0.0005;
            
            camera.position.x = initialCameraPos.x + Math.sin(time * orbitSpeed) * 5;
            camera.position.z = initialCameraPos.z + Math.cos(time * orbitSpeed) * 5;
            camera.lookAt(0, 5, 0);
        }

        // Petal animation
        function animatePetals() {
            petals.forEach(petal => {
                petal.position.y -= petal.userData.speed;
                petal.position.x += Math.sin(petal.userData.wobble) * 0.02;
                petal.userData.wobble += petal.userData.wobbleSpeed;
                
                if (petal.position.y < 0) {
                    petal.position.y = 20;
                    petal.position.x = (Math.random() - 0.5) * 60;
                    petal.position.z = (Math.random() - 0.5) * 60;
                }
            });
        }

        // Koi fish animation
        function animateFish() {
            koiFish.forEach(fish => {
                fish.userData.direction += 0.001;
                fish.position.x += Math.sin(fish.userData.direction) * 0.05;
                fish.position.z += Math.cos(fish.userData.direction) * 0.05;
                fish.userData.wobble += 0.05;
                fish.rotation.y = Math.sin(fish.userData.wobble) * 0.3;
                fish.rotation.x = Math.sin(fish.userData.wobble * 2) * 0.1;

                // Keep fish in pond
                if (fish.position.x > 18) fish.position.x = 10;
                if (fish.position.x < 8) fish.position.x = 10;
                if (fish.position.z > -3) fish.position.z = -15;
                if (fish.position.z < -15) fish.position.z = -3;
            });
        }

        // Loading
        window.onload = () => {
            document.getElementById('loading').style.display = 'none';
        };

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            animateCamera();
            animatePetals();
            animateFish();
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
