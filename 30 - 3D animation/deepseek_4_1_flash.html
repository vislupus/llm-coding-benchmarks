<script>
"use strict";
/* =====================================================================================
   SAKURA NO NIWA — a procedural, single-file WebGL2 cinematic of an isometric
   Japanese pagoda garden.  Everything (geometry, shading, camera, audio) is generated
   at runtime: no external assets, no libraries, works offline.
   ===================================================================================== */
(function(){

/* ------------------------------------------------------------------ tiny math uti ls */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const smoother=(t)=>t*t*t*(t*(t*6-15)+10);
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const norm=(v)=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const faceN=(a,b,c)=>norm(cross(sub(b,a),sub(c,a)));
function hash2(x,y){let h=(x|0)*374761393+(y|0)*668265263;h=(h^(h>>13))*1274126177;h=h^(h>>16);return ((h>>>0)%100000)/100000;}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y){return 0.55*vnoise(x,y)+0.28*vnoise(x*2.13+5.2,y*2.13-3.1)+0.17*vnoise(x*4.31-8.1,y*4.31+2.7);}

/* ------------------------------------------------------------ 4x4 / 3x3 matrix helpers */
const M4={
  id(o){o[0]=1;o[1]=0;o[2]=0;o[3]=0;o[4]=0;o[5]=1;o[6]=0;o[7]=0;o[8]=0;o[9]=0;o[10]=1;o[11]=0;o[12]=0;o[13]=0;o[14]=0;o[15]=1;return o;},
  new(){return M4.id(new Float32Array(16));},
  copy(o,a){for(let i=0;i<16;i++)o[i]=a[i];return o;},
  persp(o,fovy,asp,n,f){const t=1/Math.tan(fovy/2);
    o[0]=t/asp;o[1]=0;o[2]=0;o[3]=0;o[4]=0;o[5]=t;o[6]=0;o[7]=0;o[8]=0;o[9]=0;o[10]=(f+n)/(n-f);o[11]=-1;
    o[12]=0;o[13]=0;o[14]=2*f*n/(n-f);o[15]=0;return o;},
  ortho(o,l,r,b,t,n,f){o[0]=2/(r-l);o[1]=0;o[2]=0;o[3]=0;o[4]=0;o[5]=2/(t-b);o[6]=0;o[7]=0;o[8]=0;o[9]=0;o[10]=-2/(f-n);o[11]=0;
    o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o;},
  mul(o,a,b){for(let i=0;i<4;i++){const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4+0]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;o[i*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[i*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;o[i*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}return o;},
  lookAt(o,eye,ctr,up){
    let z=norm(sub(eye,ctr));
    if(Math.abs(z[1])>0.999) z=[0,0.0001,1];
    let x=norm(cross(up,z)),y=cross(z,x);
    o[0]=x[0];o[1]=y[0];o[2]=z[0];o[3]=0;o[4]=x[1];o[5]=y[1];o[6]=z[1];o[7]=0;o[8]=x[2];o[9]=y[2];o[10]=z[2];o[11]=0;
    o[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);o[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
    o[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);o[15]=1;return o;},
  trans(o,x,y,z){M4.id(o);o[12]=x;o[13]=y;o[14]=z;return o;},
  rotY(o,a){const c=Math.cos(a),s=Math.sin(a);M4.id(o);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o;},
  rotX(o,a){const c=Math.cos(a),s=Math.sin(a);M4.id(o);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o;},
  rotZ(o,a){const c=Math.cos(a),s=Math.sin(a);M4.id(o);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o;},
  scale(o,x,y,z){M4.id(o);o[0]=x;o[5]=y;o[10]=z;return o;}
};
const T=[];for(let i=0;i<20;i++)T.push(M4.new());
function mul3(o,a,b){for(let i=0;i<3;i++){const b0=b[i*3],b1=b[i*3+1],b2=b[i*3+2];
  o[i*3+0]=a[0]*b0+a[3]*b1+a[6]*b2;o[i*3+1]=a[1]*b0+a[4]*b1+a[7]*b2;o[i*3+2]=a[2]*b0+a[5]*b1+a[8]*b2;}return o;}

/* --------------------------------------------------- transform stack used while building */
const XF={
  m:M4.new(), nm:new Float32Array([1,0,0,0,1,0,0,0,1]), st:[],
  reset(){M4.id(this.m);this.nm.set([1,0,0,0,1,0,0,0,1]);this.st.length=0;},
  _apply(mL,nL){
    const a=this.m.slice(),b=this.nm.slice();
    M4.mul(this.m,a,mL); mul3(this.nm,b,nL);
  },
  T(x,y,z){this._apply(M4.trans(T[0],x,y,z),[1,0,0,0,1,0,0,0,1]);return this;},
  RY(a){this._apply(M4.rotY(T[1],a),[Math.cos(a),0,-Math.sin(a),0,1,0,Math.sin(a),0,Math.cos(a)]);return this;},
  RX(a){const c=Math.cos(a),s=Math.sin(a);this._apply(M4.rotX(T[2],a),[1,0,0,0,c,s,0,-s,c]);return this;},
  RZ(a){const c=Math.cos(a),s=Math.sin(a);this._apply(M4.rotZ(T[3],a),[c,s,0,-s,c,0,0,0,1]);return this;},
  S(x,y,z){this._apply(M4.scale(T[4],x,y,z),[1/x,0,0,0,1/y,0,0,0,1/z]);return this;},
  push(){this.st.push(Float32Array.from(this.m),Float32Array.from(this.nm));return this;},
  pop(){const n=this.nm;this.nm.set(this.st.pop());this.m.set(this.st.pop());return this;},
  tp(p){const m=this.m;return [m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],
                            m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],
                            m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];},
  tn(n){const a=this.nm,l=Math.hypot(a[0]*n[0]+a[3]*n[1]+a[6]*n[2],a[1]*n[0]+a[4]*n[1]+a[7]*n[2],a[2]*n[0]+a[5]*n[1]+a[8]*n[2])||1;
    return [(a[0]*n[0]+a[3]*n[1]+a[6]*n[2])/l,(a[1]*n[0]+a[4]*n[1]+a[7]*n[2])/l,(a[2]*n[0]+a[5]*n[1]+a[8]*n[2])/l];}
};

/* --------------------------------------------------------------------- mesh builder */
function newMesh(){return {p:[],n:[],c:[],i:[]};}
function pushPoly(g,pts,col,opts){
  opts=opts||{};
  const P=pts.map(p=>XF.tp(p));
  let fn=null,nn=null;
  if(opts.n){
    if(Array.isArray(opts.n[0])) nn=opts.n.map(n=>XF.tn(n));
    else fn=XF.tn(opts.n);
  } else fn=faceN(P[0],P[1],P[2]);
  const cs=Array.isArray(col[0])?col:null;
  const base=g.p.length/3;
  for(let i=0;i<P.length;i++){
    const n=nn?nn[i]:fn, c=cs?cs[i]:col;
    g.p.push(P[i][0],P[i][1],P[i][2]);
    g.n.push(n[0],n[1],n[2]);
    g.c.push(c[0],c[1],c[2],c.length>3?c[3]:0);
  }
  for(let i=1;i<P.length-1;i++) g.i.push(base,base+i,base+i+1);
}
function pushQuad(g,a,b,c,d,col,opts){pushPoly(g,[a,b,c,d],col,opts);}
function pushTri(g,a,b,c,col,opts){pushPoly(g,[a,b,c],col,opts);}
function box(g,cx,cy,cz,w,h,d,col,opts){
  opts=opts||{};const f=opts.faces||null;
  const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2;
  const C=(i)=>f?f[i]:col;
  pushPoly(g,[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],C(0),{n:[1,0,0]});
  pushPoly(g,[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],C(1),{n:[-1,0,0]});
  pushPoly(g,[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],C(2),{n:[0,1,0]});
  pushPoly(g,[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],C(3),{n:[0,-1,0]});
  pushPoly(g,[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],C(4),{n:[0,0,1]});
  pushPoly(g,[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],C(5),{n:[0,0,-1]});
}
function cyl(g,r0,r1,h,seg,col,opts){
  opts=opts||{};
  const y0=-h/2,y1=h/2;
  for(let i=0;i<seg;i++){
    const a0=i/seg*TAU,a1=(i+1)/seg*TAU;
    const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    const pA=[r0*c0,y0,r0*s0],pB=[r1*c0,y1,r1*s0],pC=[r1*c1,y1,r1*s1],pD=[r0*c1,y0,r0*s1];
    const nd=[c0,0,s0],nd1=[c1,0,s1];
    pushPoly(g,[pA,pB,pC,pD],col,opts.smooth?{n:[nd,nd,nd1,nd1]}:{});
  }
  if(opts.caps!==false){
    for(let i=0;i<seg;i++){
      const a0=i/seg*TAU,a1=(i+1)/seg*TAU;
      pushPoly(g,[[0,y1,0],[r1*Math.cos(a1),y1,r1*Math.sin(a1)],[r1*Math.cos(a0),y1,r1*Math.sin(a0)]],col,{n:[0,1,0]});
      pushPoly(g,[[0,y0,0],[r0*Math.cos(a0),y0,r0*Math.sin(a0)],[r0*Math.cos(a1),y0,r0*Math.sin(a1)]],col,{n:[0,-1,0]});
    }
  }
}
function sph(g,cx,cy,cz,r,su,sv,col,opts){
  opts=opts||{};
  const nz=opts.noise||0,sq=opts.squash||1,sd=opts.seed||0,smooth=opts.smooth!==false;
  const P=(j,k)=>{
    const lat=(-0.5+j/sv)*Math.PI,lon=k/su*TAU;
    const nr=nz?1+(fbm(Math.cos(lon)*1.4+sd,Math.sin(lon)*1.4+lat*1.2+sd)-0.5)*nz:1;
    const rr=r*nr,cl=Math.cos(lat);
    return [cx+rr*cl*Math.cos(lon),cy+rr*Math.sin(lat)*sq,cz+rr*cl*Math.sin(lon)];
  };
  for(let j=0;j<sv;j++)for(let k=0;k<su;k++){
    const a=P(j,k),b=P(j+1,k),c=P(j+1,k+1),d=P(j,k+1);
    if(!smooth){pushPoly(g,[a,b,c,d],col,{});continue;}
    const nrm=(p)=>norm(sub(p,[cx,cy,cz]));
    pushPoly(g,[a,b,c,d],col,{n:[nrm(a),nrm(b),nrm(c),nrm(d)]});
  }
}
function tube(g,pts,rads,col,seg,flexArr){
  seg=seg||6;
  for(let s=0;s<pts.length-1;s++){
    const A=pts[s],B=pts[s+1],dir=norm(sub(B,A));
    const up=Math.abs(dir[1])>0.9?[1,0,0]:[0,1,0];
    const u=norm(cross(up,dir)),v=cross(dir,u);
    const cA=Array.isArray(col[0])?col[s]:col, cB=Array.isArray(col[0])?col[s+1]:col;
    for(let i=0;i<seg;i++){
      const a0=i/seg*TAU,a1=(i+1)/seg*TAU;
      const Pt=(O,rr,ang)=>[O[0]+(u[0]*Math.cos(ang)+v[0]*Math.sin(ang))*rr,
                            O[1]+(u[1]*Math.cos(ang)+v[1]*Math.sin(ang))*rr,
                            O[2]+(u[2]*Math.cos(ang)+v[2]*Math.sin(ang))*rr];
      const n0=[u[0]*Math.cos(a0)+v[0]*Math.sin(a0),u[1]*Math.cos(a0)+v[1]*Math.sin(a0),u[2]*Math.cos(a0)+v[2]*Math.sin(a0)];
      const n1=[u[0]*Math.cos(a1)+v[0]*Math.sin(a1),u[1]*Math.cos(a1)+v[1]*Math.sin(a1),u[2]*Math.cos(a1)+v[2]*Math.sin(a1)];
      pushPoly(g,[Pt(A,rads[s],a0),Pt(B,rads[s+1],a0),Pt(B,rads[s+1],a1),Pt(A,rads[s],a1)],
        [cA,cB,cB,cA],{n:[n0,n0,n1,n1]});
    }
  }
}
/* contour (marching squares) -> flat surface clipped by a signed field ------------------ */
function contourMesh(g,fld,levelbox,x0,x1,z0,z1,res,ys,vext,vexn){
  const nx=Math.ceil((x1-x0)/res),nz=Math.ceil((z1-z0)/res);
  const F=new Float32Array((nx+1)*(nz+1));
  for(let k=0;k<=nz;k++)for(let i=0;i<=nx;i++)F[i+k*(nx+1)]=fld(x0+i*res,z0+k*res)-levelbox;
  const vx=new Map();
  const V=(i,k)=>{const x=x0+i*res,z=z0+k*res;return [x,(ys?ys(x,z):0),z];};
  const edge=(i,k,o)=>{
    const key=i+','+k+','+o;
    if(vx.has(key))return vx.get(key);
    let p,a,b,fa,fb;
    if(o===0){a=F[i+k*(nx+1)];b=F[i+1+k*(nx+1)];fa=V(i,k);fb=V(i+1,k);}
    else {a=F[i+(k+1)*(nx+1)];b=F[i+k*(nx+1)];fa=V(i,k+1);fb=V(i,k);}
    const t=Math.abs(a-b)<1e-6?0.5:a/(a-b);
    p=[lerp(fa[0],fb[0],t),lerp(fa[1],fb[1],t),lerp(fa[2],fb[2],t)];
    vx.set(key,p);return p;
  };
  const inside=(i,k)=>F[i+k*(nx+1)]<0;
  for(let k=0;k<nz;k++)for(let i=0;i<nx;i++){
    const c=[inside(i,k+1),inside(i+1,k+1),inside(i+1,k),inside(i,k)];
    if(c[0]===false&&c[1]===false&&c[2]===false&&c[3]===false)continue;
    const poly=[];
    const cIdx=[[i,k+1],[i+1,k+1],[i+1,k],[i,k]];
    for(let s=0;s<4;s++){
      const a=cIdx[s],b=cIdx[(s+1)%4];
      if(c[s])poly.push(V(a[0],a[1]));
      if(c[s]!==c[(s+1)%4]){
        const horiz=(a[1]===b[1]);
        const ei=Math.min(a[0],b[0]),ek=Math.min(a[1],b[1]);
        poly.push(edge(ei,ek,horiz?0:1));
      }
    }
    if(poly.length>=3){
      let cx2=0,cz2=0;
      for(const p of poly){cx2+=p[0];cz2+=p[2];}
      cx2/=poly.length;cz2/=poly.length;
      const col=vext?vext(cx2,cz2):[0.5,0.5,0.5,1];
      const nrm=vexn?{n:poly.map(p=>vexn(p[0],p[2]))}:{n:[0,1,0]};
      pushPoly(g,poly,col,nrm);
    }
  }
}

/* ----------------------------------------------------------------- scene field / terrain */
const ISL={rx:11.1,rz:9.9};
const POND=[
  {cx:4.0,cz:-3.4,rx:4.25,rz:3.15,rot:-0.32,amp:[0.075,0.05,0.035],ph:[0.6,-1.1,2.3]},
  {cx:2.9,cz:-6.4,rx:2.3,rz:1.95,rot:0.34,amp:[0.11,0.06,0.03],ph:[1.4,0.3,-0.7]}
];
function lobeSDF(x,z,L){
  const c=Math.cos(L.rot),s=Math.sin(L.rot),dx=x-L.cx,dz=z-L.cz;
  const lx=dx*c+dz*s,lz=-dx*s+dz*c;
  const th=Math.atan2(-lz,lx);
  const r=1+L.amp[0]*Math.cos(2*th+L.ph[0])+L.amp[1]*Math.cos(3*th+L.ph[1])+L.amp[2]*Math.cos(4*th+L.ph[2]);
  return (Math.hypot(lx/L.rx,lz/L.rz)-r)*3.3;
}
function smin(a,b,k){const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*0.25;}
function pondSD(x,z){return smin(lobeSDF(x,z,POND[0]),lobeSDF(x,z,POND[1]),1.5);}
function islandSD(x,z){
  const th=Math.atan2(-z,x);
  const r=1+0.075*Math.cos(2*th+0.7)+0.045*Math.cos(3*th-1.2)+0.03*Math.cos(5*th+2.1);
  return (Math.hypot(x/ISL.rx,z/ISL.rz)-r)*9.0;
}
const PATH=[[-10.3,3.4],[-9.1,1.2],[-7.7,-0.8],[-6.0,-2.4],[-4.2,-3.4],[-2.2,-4.0],[-0.2,-4.6],[1.6,-5.6],[3.2,-6.4],[4.1,-7.2]];
const SPUR=[[-4.2,-3.4],[-3.6,-2.0],[-2.9,-0.5]];
function polyDist(x,z,pts){
  let best=1e9;
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0],az=pts[i][1],bx=pts[i+1][0],bz=pts[i+1][1];
    const dx=bx-ax,dz=bz-az,L=dx*dx+dz*dz;
    let t=L>0?((x-ax)*dx+(z-az)*dz)/L:0;t=clamp(t,0,1);
    const d=Math.hypot(x-(ax+dx*t),z-(az+dz*t));
    if(d<best)best=d;
  }return best;
}
function pathDist(x,z){return Math.min(polyDist(x,z,PATH),polyDist(x,z,SPUR));}
function moundH(x,z){const d=Math.hypot(x+1.4,z-2.2);return 0.64*(1-smoothstep(3.2,6.4,d));}
function terrainH(x,z){
  const isl=islandSD(x,z),p=pondSD(x,z);
  let y=0.32*smoothstep(-3,7,z)*(1-Math.min(1,pathDist(x,z)/2.4));
  y+=moundH(x,z);
  const pl=-p;
  if(pl>0) y-=0.27*smoothstep(0,0.5,pl)+1.02*smoothstep(0.3,2.3,pl);
  const inner=Math.min(1,Math.max(0,-isl*0.5));
  y+=(fbm(x*0.36,z*0.36)-0.5)*0.10*inner*(p>0?1:0.25);
  return y;
}
function terrainN(x,z){
  const e=0.24;
  const hx=terrainH(x+e,z)-terrainH(x-e,z),hz=terrainH(x,z+e)-terrainH(x,z-e);
  return norm([-hx/(2*e),1,-hz/(2*e)]);
}
/* per-vertex terrain colour ------------------------------------------------------------- */
function terrainCol(x,z){
  const p=pondSD(x,z),isl=islandSD(x,z),n=fbm(x*0.75,z*0.75),n2=fbm(x*2.6+9,z*2.6-3);
  const pd=pathDist(x,z),md=Math.hypot(x+1.4,z-0.9);
  let col=mix3([0.30,0.47,0.22],[0.53,0.70,0.35],n*0.85+0.08);
  if(n>0.68)col=mix3(col,[0.24,0.40,0.20],(n-0.68)*2.2);
  const terr=1-smoothstep(3.3,4.7,md);
  if(terr>0.01)col=mix3(col,[0.85,0.82,0.755],terr*0.95);
  if(pd<1.25){col=mix3(col,[0.90,0.865,0.75],smoothstep(1.25,0.6,pd)*(0.55+0.45*n2));}
  if(p<0.5){
    const sand=mix3([0.86,0.82,0.685],[0.95,0.93,0.855],n2);
    col=mix3(col,sand,smoothstep(-0.5,0.3,p));
    const dep=smoothstep(0.05,1.9,-p);
    const bot=mix3(mix3([0.55,0.72,0.62],sand,0.4),[0.09,0.32,0.36],dep);
    const peb=smoothstep(0.60,0.80,fbm(x*2.2+31,z*2.2-11));
    col=mix3(col,mix3(bot,[0.80,0.80,0.74],peb*0.75),smoothstep(0.42,-0.12,p));
  }
  const ny=terrainN(x,z)[1];
  const steep=smoothstep(0.90,0.66,ny);
  if(steep>0.01)col=mix3(col,[0.63,0.62,0.585],steep*0.85*(p>0?1:0.45));
  if(isl>-0.75)col=mix3(col,[0.44,0.35,0.26],smoothstep(-0.75,-0.06,isl));
  return [col[0],col[1],col[2],0];
}

function buildIsland(g){
  const res=0.30;

    (x,z)=>terrainCol(x,z),(x,z)=>terrainN(x,z));
  /* skirt following the analytic outline, top ring tucked just inside */
  const N=260,ringT=[],ringB=[];
  for(let i=0;i<N;i++){
    const a=i/N*TAU;

    const r=1+0.075*Math.cos(2*th+0.7)+0.045*Math.cos(3*th-1.2)+0.03*Math.cos(5*th+2.1);
    const x=(r*ISL.rx*0.995)*Math.cos(a),z=-(r*ISL.rz*0.995)*Math.sin(a);
    ringT.push([x,Math.max(terrainH(x,z),0.02)+0.03,z]);

    const yA=[s[1],s[1]-0.24-detail(s[0],s[2])*0.1,s[1]-0.75,s[1]-depth];
    const yB=[t[1],t[1]-0.24-detail(t[0],t[2])*0.1,t[1]-0.75,t[1]-depth];
    const cols=[rcol([colT[0]*0.9,colT[1]*0.9,colT[2]*0.9]),c1,c2,c3];
    for(let b=0;b<3;b++){
      const o=[[s[0],yA[b],s[2]],[t[0],yB[b],t[2]],[t[0],yB[b+1],t[2]],[s[0],yA[b+1],s[2]]];
      pushPoly(g,o,[cols[b],cols[b],cols[b+1],cols[b+1]],{});

  for(let i=1;i<N-1;i++){

  }

/* ---- pagoda roofs -------------------------------------------------------------------- */
function pagodaRoof(g,half,height,lift,thick,tint){
  const K=6,S=11;
  const per=(a)=>{const P=[];
    for(let s=0;s<4;s++){
      for(let i=0;i<S;i++){
        const u=i/S;
        if(s===0)P.push([a,a-2*a*u]);
        else if(s===1)P.push([a-2*a*u,-a]);
        else if(s===2)P.push([-a,-a+2*a*u]);
        else P.push([-a+2*a*u,a]);
      }
    }return P;};
  const ring=(t)=>{
    const a=half*Math.max(0.0008,1-0.982*Math.pow(t,0.95));
    const y=height*Math.pow(t,1.22);
    const pc=(p)=>Math.pow(Math.min(Math.abs(p[0]),Math.abs(p[1]))/Math.max(a,1e-4),3);
    return per(a).map(p=>{
      const k=pc(p),fl=lift*k*Math.pow(1-t,2.4),sc=1+0.10*k*Math.pow(1-t,2);
      return [p[0]*sc,y+fl,p[1]*sc];
    });
  };
  const rings=[],under=[];
  for(let k=0;k<=K;k++){
    const t=k/K;rings.push(ring(t));
    under.push(ring(t).map(p=>[p[0]*1.0,(height*Math.pow(t,1.22))-thick*(0.35+0.65*(1-t))-0.02,p[1]]));
  }
  const topC=[tint[0],tint[1],tint[2],0],ribC=[PAL.roofRib[0],PAL.roofRib[1],PAL.roofRib[2],0.25];
  const undC=[PAL.roofUnder[0],PAL.roofUnder[1],PAL.roofUnder[2],0];
  for(let k=0;k<K;k++){
    const A=rings[k],B=rings[k+1],n=A.length;
    for(let i=0;i<n;i++){
      const j=(i+1)%n;
      const cor=(Math.min(Math.abs(A[i][0]),Math.abs(A[i][2]))>half*0.45);
      pushPoly(g,[A[i],B[i],B[j],A[j]],cor?[ribC,ribC,ribC,ribC]:topC,{});
      pushPoly(g,[under[k][i],under[k][j],under[k+1][j],under[k+1][i]],undC,{});
    }
  }
  const A=rings[0],U=under[0],n=A.length;
  for(let i=0;i<n;i++){const j=(i+1)%n;
    pushPoly(g,[U[i],A[i],A[j],U[j]],rcol(PAL.roofEdge),{});}
  /* ridge + apex cap */
  const ap=[0,height+0.02,0];
  pushPoly(g,[[ap[0],ap[1],ap[2]+0.12],[ap[0]+0.12,ap[1],ap[2]],[ap[0],ap[1],ap[2]-0.12],[ap[0]-0.12,ap[1],ap[2]]],
    rcol(PAL.roofEdge),{n:[0,1,0]});
}

function railing(g,w,d,h,col){
  const r=0.055;
  box(g,0,h+r,0,w,2*r,2*r,col);
  box(g,0,h*0.55+r,0,w,2*r*0.8,2*r*0.8,col);
  const n=Math.max(2,Math.round(w/0.45));
  for(let i=0;i<=n;i++){const x=-w/2+i*(w/n);box(g,x,h/2+r,0,2*r*1.5,h,2*r*1.5,col);}
  box(g,0,h+r,d,w,2*r,2*r,col);
  box(g,0,h*0.55+r,d,w,2*r*0.8,2*r*0.8,col);
  for(let i=0;i<=n;i++){const x=-w/2+i*(w/n);box(g,x,h/2+r,d,2*r*1.5,h,2*r*1.5,col);}
  const m=Math.max(2,Math.round(d/0.45));
  box(g,-w/2,h+r,d/2,2*r,2*r,d,col);box(g,-w/2,h*0.55+r,d/2,2*r*0.8,2*r*0.8,d,col);
  for(let i=0;i<=m;i++){const z=i*(d/m);box(g,-w/2,h/2+r,z,2*r*1.5,h,2*r*1.5,col);}
  box(g,w/2,h+r,d/2,2*r,2*r,d,col);box(g,w/2,h*0.55+r,d/2,2*r*0.8,2*r*0.8,d,col);
  for(let i=0;i<=m;i++){const z=i*(d/m);box(g,w/2,h/2+r,z,2*r*1.5,h,2*r*1.5,col);}
}

/* ---- trees --------------------------------------------------------------------------- */
function cherryTree(g,x,z,hgt,spread,seed,lean){
  const y0=terrainH(x,z);
  const pts=[],rads=[];
  const bend=lean||0;
  for(let i=0;i<=4;i++){
    const t=i/4;
    pts.push([x+Math.sin(t*1.1)*bend*1.1*spread*0.30, y0+hgt*0.52*t, z+Math.cos(t*0.9)*bend*spread*0.22]);
    rads.push(0.30*(1-0.78*t));
  }
  tube(g,pts,rads,[rcol(PAL.trunk),rcol(PAL.trunk),rcol(PAL.trunkLt),rcol(PAL.trunkLt),rcol([0.44,0.32,0.24])],7);
  const top=pts[4];
  const branches=[];
  for(let b=0;b<6;b++){
    const a=b/6*TAU+seed*1.7,sl=0.55+((hash2(b*13+7,seed*31)|0)%100)/140;
    const bpts=[[top[0]*0.9+pts[3][0]*0.1,top[1]-0.25,top[2]*0.9+pts[3][2]*0.1]];
    const bl=spread*(0.95+hash2(b,seed)*0.5);
    for(let i=1;i<=3;i++){
      const t=i/3;
      bpts.push([top[0]+Math.cos(a)*bl*t+Math.sin(t*2)*bend*0.4, top[1]+bl*0.42*Math.sin(t*1.1)+t*0.25, top[2]+Math.sin(a)*bl*t+Math.cos(t*2)*bend*0.3]);
    }

/* ---- bridge -------------------------------------------------------------------------- */
function buildBridge(g,A,B){
  const dirx=B[0]-A[0],dirz=B[1]-A[1],len=Math.hypot(dirx,dirz);
  const ux=dirx/len,uz=dirz/len,px=-uz,pz=ux;
  const yaw=Math.atan2(-uz,ux);
  const N=22,apex=1.30,halfW=0.82;
  const pos=(t,y)=>({x:A[0]+ux*len*t+px*0,y:y,z:A[1]+uz*len*t+pz*0});
  const yOf=(t)=>Math.max(terrainH(A[0]+ux*len*t,A[1]+uz*len*t),0)+0.10+apex*Math.pow(Math.sin(Math.PI*t),0.9);
  const deckPts=[],deckY=[];
  for(let i=0;i<=N;i++){const t=i/N;deckPts.push([A[0]+ux*len*t,0,A[1]+uz*len*t]);deckY.push(yOf(t));}
  XF.push();
  /* deck planks */
  for(let i=0;i<N;i++){
    const t0=i/N,t1=(i+1)/N,y0=deckY[i],y1=deckY[i+1];
    const p0=[deckPts[i][0]-ux*0.02,y0,deckPts[i][2]-uz*0.02];
    const p1=[deckPts[i+1][0]+ux*0.02,y1,deckPts[i+1][2]+uz*0.02];
    const c=i%2?PAL.deck:[0.94,0.76,0.68];
    const off=(h,s)=>{const p=h?p0:p1,yy=h?y0:y1;
      return [p[0]+px*halfW*s, yy, p[2]+pz*halfW*s];};
    pushPoly(g,[off(true,-1),off(true,1),off(false,1),off(false,-1)],[rcol(c),rcol(c),rcol(c),rcol(c)],{});
    /* side beams */
    for(const s of [-1,1]){
      pushPoly(g,[[off(true,s)[0],y0-0.16,off(true,s)[2]],[off(false,s)[0],y1-0.16,off(false,s)[2]],
        [off(false,s)[0],y1-0.02,off(false,s)[2]],[off(true,s)[0],y0-0.02,off(true,s)[2]]],rcol(PAL.wood),{});
    }
  }
  /* railings */
  const postN=Math.round(len/0.62);
  for(const s of [-1,1]){
    for(let i=0;i<=postN;i++){
      const t=i/postN,y=yOf(t),x=A[0]+ux*len*t+px*halfW*s,z=A[1]+uz*len*t+pz*halfW*s;
      XF.push();XF.T(x,y+0.28,z);XF.RY(yaw);
      box(g,0,0,0,0.10,0.56,0.10,rcol(PAL.wood));
      sph(g,0,0.31,0,0.075,7,5,PAL.gold,{smooth:true});
      XF.pop();
    }
    const t0=0;
    const rp=[];
    for(let i=0;i<=N;i++){const t=i/N,y=yOf(t),x=A[0]+ux*len*t+px*halfW*s,z=A[1]+uz*len*t+pz*halfW*s;rp.push([x,y,z]);}
    tube(g,rp.map(p=>[p[0],p[1]+0.54,p[2]]),new Array(N+1).fill(0.055),rcol(PAL.woodLt),6);
    tube(g,rp.map(p=>[p[0],p[1]+0.28,p[2]]),new Array(N+1).fill(0.038),rcol(PAL.woodDk),5);
  }
  /* stone steps at both ends */
  for(const end of [0,1]){
    const sgn=end===0?-1:1, t0=end===0?0:1;
    const ex=A[0]+ux*len*t0, ez=A[1]+uz*len*t0;
    const topY=yOf(t0);
    const gY=Math.max(terrainH(ex+sgn*ux*1.0,ez+sgn*uz*1.0),0.0)+0.03;
    const n=6;
    for(let k=0;k<n;k++){
      const f=k/n,f2=(k+1)/n;
      const yA=lerp(topY,gY,f),yB=lerp(topY,gY,f2);
      const w=halfW*1.45*(1-0.05*k);
      const dz=0.33;
      const x0=ex+sgn*ux*dz*k, z0=ez+sgn*uz*dz*k;
      const x1=ex+sgn*ux*dz*(k+1), z1=ez+sgn*uz*dz*(k+1);
      pushPoly(g,[[x0+px*w,yA,z0+pz*w],[x1+px*w,yB,z1+pz*w],
                  [x1-px*w,yB,z1-pz*w],[x0-px*w,yA,z0-pz*w]],
        rcol(k%2?PAL.stoneLt:PAL.stone),{n:[0,1,0]});
      pushPoly(g,[[x1+px*w,yB,z1+pz*w],[x1+px*w,yB-0.20,z1+pz*w],
                  [x1-px*w,yB-0.20,z1-pz*w],[x1-px*w,yB,z1-pz*w]],rcol(PAL.stoneDk),{});
    }
  }
  XF.pop();
}

/* ---- path tiles, ground petals, fence ------------------------------------------------ */
function pathTiles(g,seed){
  for(let s=0;s<PATH.length-1;s++){
    const A=PATH[s],B=PATH[s+1],len=Math.hypot(B[0]-A[0],B[1]-A[1]);
    const n=Math.max(1,Math.round(len/0.55));
    for(let i=0;i<n;i++){
      const t=(i+0.5)/n;
      const x=lerp(A[0],B[0],t)+(hash2(i+s*7,seed)-0.5)*0.55;
      const z=lerp(A[1],B[1],t)+(hash2(i*3+s,seed+2)-0.5)*0.55;
      if(pondSD(x,z)<0.25)continue;
      const y=terrainH(x,z)+0.022,r=0.30+hash2(i*5+s,seed)*0.22,ang=hash2(i*11+s,seed)*TAU;
      const col=[0.88+hash2(i,seed)*0.06,0.86,0.79];
      const pts=[];
      for(let k=0;k<5;k++){
        const a=ang+k/5*TAU,rr=r*(1+ (hash2(i*3+k,s+1)-0.5)*0.45);
        pts.push([x+Math.cos(a)*rr,y,z+Math.sin(a)*rr]);
      }
      pushPoly(g,pts,[rcol(col),rcol(col),rcol(col),rcol(col),rcol(col)],{n:[0,1,0]});
    }
  }
}
function groundPetals(g,seed,count){
  const trees=[[-7.4,5.0,3.4],[5.6,5.4,2.9],[-4.6,6.6,2.5],[8.0,1.2,2.7]];
  for(let i=0;i<count;i++){
    let x,z;
    const r=hash2(i*3+seed,seed*5);
    if(r<0.55){
      const tr=trees[(i|0)%trees.length];
      const a=hash2(i*7,seed)*TAU,d=Math.sqrt(hash2(i*11,seed+3))*tr[2]*2.1;
      x=tr[0]+Math.cos(a)*d;z=tr[1]+Math.sin(a)*d;
    }else if(r<0.85){
      const t=hash2(i*13,seed)*PATH.length;
      const s=Math.min(PATH.length-2,Math.floor(t)),ft=t-s;
      x=lerp(PATH[s][0],PATH[s+1][0],ft)+(hash2(i,seed)-0.5)*2.4;
      z=lerp(PATH[s][1],PATH[s+1][1],ft)+(hash2(i*5,seed)-0.5)*2.4;
    }else{
      const a=hash2(i*17,seed)*TAU,d=Math.sqrt(hash2(i*19,seed+9))*10.5;
      x=Math.cos(a)*d;z=Math.sin(a)*d*0.92;
    }
    if(islandSD(x,z)>-0.35)continue;
    if(pondSD(x,z)<0.05)continue;
    const p=pondSD(x,z);
    const y=terrainH(x,z)+(0.5-smoothstep(0,1.2,p))*0.004+0.02;
    const s=0.055+hash2(i*23,seed)*0.055,ang=hash2(i*29,seed)*TAU;
    const col=hash2(i,seed*3)>0.45?[1.0,0.92,0.95]:[0.98,0.78,0.86];
    const P=(dx,dz)=>[x+dx*Math.cos(ang)-dz*Math.sin(ang),y,z+dx*Math.sin(ang)+dz*Math.cos(ang)];
    pushPoly(g,[P(-s,-s),P(s,-s),P(s,s),P(-s,s)],[rcol(col),rcol(col),rcol(col),rcol(col)],{n:[0,1,0]});
  }
}
function buildFence(g){
  const a0=1.62,a1=3.72,N=26,posts=[];
  for(let i=0;i<=N;i++){
    const a=lerp(a0,a1,i/N);
    const th=a;
    const r=1+0.075*Math.cos(2*th+0.7)+0.045*Math.cos(3*th-1.2)+0.03*Math.cos(5*th+2.1);
    const x=(r*ISL.rx*0.93)*Math.cos(a),z=-(r*ISL.rz*0.93)*Math.sin(a);
    if(pondSD(x,z)<0.35)continue;
    const y=terrainH(x,z);
    posts.push([x,y,z]);
    XF.push();XF.T(x,y,z);
    box(g,0,0.34,0,0.13,0.68,0.13,rcol([0.86,0.85,0.82]));
    box(g,0,0.68,0,0.16,0.05,0.16,rcol([0.78,0.77,0.74]));
    XF.pop();
  }
  for(let i=0;i<posts.length-1;i++){
    const A=posts[i],B=posts[i+1];
    if(Math.hypot(B[0]-A[0],B[2]-A[2])>2.0)continue;
    for(const h of [0.52,0.26]){

        rcol([0.88,0.87,0.84]),{});
    }
  }
}

/* ---- koi ----------------------------------------------------------------------------- */
function makeKoi(){
  const g=newMesh();
  const body=[[1.0,0.86,0.80],[0.95,0.36,0.18],[1.0,0.86,0.80],[0.16,0.14,0.15]];
  /* body: ellipsoid stretched along +X, head at +X */
  const su=14,sv=9;
  const P=(j,k,rx,ry,rz,cx)=>{
    const lat=(-0.5+j/sv)*Math.PI,lon=k/su*TAU;
    const cl=Math.cos(lat);
    return [cx+rx*cl*Math.cos(lon),ry*Math.sin(lat),rz*cl*Math.sin(lon)];
  };
  const cAt=(x)=>{ // patch pattern along the body
    const t=clamp((x+1)*0.5,0,1);
    if(t<0.22)return body[3];
    if(t<0.45)return body[1];
    if(t<0.72)return body[0];
    return body[2];
  };
  for(let j=0;j<sv;j++)for(let k=0;k<su;k++){
    const lat0=(-0.5+j/sv)*Math.PI,lat1=(-0.5+(j+1)/sv)*Math.PI;
    const lon0=k/su*TAU,lon1=(k+1)/su*TAU;
    const cl0=Math.cos(lat0),cl1=Math.cos(lat1);
    const rx=0.46*(1-0.45*Math.pow(Math.abs(Math.sin((j+0.5)/sv*Math.PI-Math.PI/2)),2));
    const mk=(lat,lon,cl)=>{const t=(lat/Math.PI+0.5);
      const x=0.52*Math.cos(lon)*Math.cos(lat)*1.0;
      return [x,0.20*Math.sin(lat),0.16*Math.cos(lat)*Math.sin(lon)];};
    const a=mk(lat0,lon0,Math.cos(lat0)),b=mk(lat1,lon0,Math.cos(lat1)),c1=mk(lat1,lon1,Math.cos(lat1)),d=mk(lat0,lon1,Math.cos(lat0));
    const c=cAt((a[0]+c1[0])*0.5);
    pushPoly(g,[a,b,c1,d],[rcolf(c,0.0),rcolf(c,0.0),rcolf(c,0.55),rcolf(c,0.55)],{});
  }
  /* tail + fins (flex = 1 at the tip) */
  const tcol=[[1.0,0.80,0.82],[0.95,0.42,0.25]];
  pushPoly(g,[[-0.5,0.01,0.02],[-0.95,0.16,0.02],[-1.02,0.0,0.02],[-0.95,-0.14,0.02]],
    [rcolf(tcol[0],0.9),rcolf(tcol[1],1.0),rcolf(tcol[1],1.0),rcolf(tcol[0],0.9)],{});
  pushPoly(g,[[-0.5,0.01,-0.02],[-0.95,-0.14,-0.02],[-1.02,0.0,-0.02],[-0.95,0.16,-0.02]],
    [rcolf(tcol[0],0.9),rcolf(tcol[1],1.0),rcolf(tcol[1],1.0),rcolf(tcol[1],1.0)],{});
  for(const s of [1,-1]){
    pushPoly(g,[[0.12,0.0,s*0.14],[0.02,0.0,s*0.42],[-0.18,0.0,s*0.30]],
      [rcolf([1.0,0.45,0.35],0.5),rcolf([1.0,0.45,0.35],1.0),rcolf([1.0,0.45,0.35],1.0)],{});
  }
  pushPoly(g,[[-0.06,0.20,0],[0.10,0.22,0],[0.06,0.02,0]],rcolf([1.0,0.4,0.3],0.3),{});
  return g;
}

function makeGrass(count){

const SEG=[];let TOTAL=0;

function updateCamera(t){

  const u=smoother(clamp((ct-s.t0)/(s.t1-s.t0),0,1));

  const hp=clamp(pitch+0.22*Math.sin(t*0.23+0.4)+dragPitch,-4,86);

  const dir=[Math.sin(yawR)*Math.cos(pitchR),Math.sin(pitchR),Math.cos(yawR)*Math.cos(pitchR)];

function updateActors(t){
  const koi=DY.koi;
  for(let i=0;i<koi.length;i++){
    const k=koi[i],s=k.sp;
    const a=t*s.sp+s.ph;
    const x=s.cx+Math.cos(a)*s.ra, z=s.cz+Math.sin(a)*s.rb;
    const tx=-Math.sin(a)*s.ra*s.sp, tz=Math.cos(a)*s.rb*s.sp;
    const yaw=Math.atan2(-tz,tx);
    const bank=Math.sin(a*3+i)*0.16+s.tilt;
    const y=-0.50+0.05*Math.sin(a*2.1+i*1.7);
    const X=k.xf||(k.xf=mkXf());
    X.id().t(x,y,z).ry(yaw).rz(bank).sc(0.72*s.s);
    k.m=X.m;k.nm=X.nm;
  }
  const ppl=DY.people;
  for(let i=0;i<ppl.length;i++){
    const p=ppl[i];
    let x=p.x,z=p.z,yaw=p.yaw,walkPhase=0,walking=0;
    if(p.bridgeT!==undefined){
      const A=[3.35,-6.55],B=[8.35,-4.15];
      const dx=B[0]-A[0],dz=B[1]-A[1],len=Math.hypot(dx,dz);
      const tt=clamp(p.bridgeT,0,1);
      x=A[0]+dx*tt; z=A[1]+dz*tt;
      yaw=Math.atan2(-dz/len,dx/len);
      p.y=Math.max(terrainH(x,z),0.0)+0.06+1.30*Math.pow(Math.sin(Math.PI*tt),0.9);
    } else p.y=terrainH(x,z);
    if(p.walk){
      p.walk.t+=p.walk.dir*p.walk.speed*dt*(playing?1:0);
      if(p.walk.t>0.86)p.walk.dir=-1;
      if(p.walk.t<0.09)p.walk.dir=1;
      const tt=clamp(p.walk.t,0,1);
      const s=tt*(PATH.length-1),si=Math.min(PATH.length-2,Math.floor(s)),ft=s-si;
      x=lerp(PATH[si][0],PATH[si+1][0],ft)+0.16;
      z=lerp(PATH[si][1],PATH[si+1][1],ft)-0.10;
      const dirx=PATH[si+1][0]-PATH[si][0],dirz=PATH[si+1][1]-PATH[si][1];
      yaw=Math.atan2(-dirz,dirx)+(p.walk.dir<0?Math.PI:0);
      walkPhase=p.walk.t*46;
      walking=1;
      p.y=terrainH(x,z);
    }
    p.x=x;p.z=z;p.yaw=yaw;
    const idle=Math.sin(t*1.15+p.phase)*0.035;
    for(const key in p.parts){
      const part=p.parts[key];
      const X=part.xf||(part.xf=mkXf());
      X.id().t(x,p.y,z).ry(yaw);
      X.t(part.pivot[0],part.pivot[1],part.pivot[2]);
      let sw=idle*(key==='armL'?1:(key==='armR'?-1:0));
      if(walking){
        if(key==='legL')sw=Math.sin(walkPhase)*0.50;
        else if(key==='legR')sw=-Math.sin(walkPhase)*0.50;
        else if(key==='armL')sw=-Math.sin(walkPhase)*0.40;
        else if(key==='armR')sw=Math.sin(walkPhase)*0.40;
      }
      if(key==='torso'){
        const sc=1+0.013*Math.sin(t*1.4+p.phase);
        const o=M4.mul(T[15],X.m,M4.scale(T[16],sc,sc,sc));M4.copy(X.m,o);
        const b=X.nm.slice();mul3(X.nm,b,new Float32Array([1/sc,0,0,0,1/sc,0,0,0,1/sc]));

        const o=M4.mul(T[15],X.m,M4.rotX(T[16],sw));M4.copy(X.m,o);

        const b=X.nm.slice();mul3(X.nm,b,new Float32Array([1,0,0,0,c,s2,0,-s2,c]));

    }
  }

}
function inv4(o,m){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
        b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
        b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det) return M4.id(o);
  det=1/det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o;
}
/* =================================================================== ui */
const capN=document.getElementById('capN'),capL=document.getElementById('capL'),capB=document.getElementById('capB');
const shotsEl=document.getElementById('shots');
SHOTS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=String(i+1).padStart(2,'0')+' '+s.sub.toUpperCase();
  b.onclick=()=>{clock=SEG[i].t0+0.001;};
  shotsEl.appendChild(b);
});
const bPlay=document.getElementById('bPlay');
bPlay.onclick=()=>{playing=!playing;bPlay.textContent=playing?'❙❙ PAUSE':'▶ PLAY';bPlay.classList.toggle('on',playing);};
const bBox=document.getElementById('bBox');
bBox.onclick=()=>{document.body.classList.toggle('boxless');bBox.classList.toggle('on',!document.body.classList.contains('boxless'));};
const bUi=document.getElementById('bUi');
bUi.onclick=()=>document.body.classList.toggle('hideui');
document.getElementById('bQual').onchange=(e)=>{ql=parseInt(e.target.value);SHADOW=QUAL[ql].shadow;allocShadow();resize();};
const bSound=document.getElementById('bSound');
let audio=null;
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  const ac=new AC();
  const master=ac.createGain();master.gain.value=0.0;master.connect(ac.destination);
  const buf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.6;
  const wind=ac.createBufferSource();wind.buffer=buf;wind.loop=true;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.Q.value=0.6;
  const wg=ac.createGain();wg.gain.value=0.20;
  wind.connect(lp);lp.connect(wg);wg.connect(master);wind.start();
  const lfo=ac.createOscillator();lfo.frequency.value=0.06;
  const lg=ac.createGain();lg.gain.value=0.11;lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  const water=ac.createBufferSource();water.buffer=buf;water.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=1.4;
  const bg=ac.createGain();bg.gain.value=0.045;
  water.connect(bp);bp.connect(bg);bg.connect(master);water.start();
  const pad=ac.createGain();pad.gain.value=0.0;pad.connect(master);
  const notes=[0,2,4,7,9];
  setInterval(()=>{
    if(master.gain.value<0.01)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';
    const base=392*Math.pow(2,notes[Math.floor(Math.random()*notes.length)]/12)*(Math.random()<0.5?1:0.5);
    o.frequency.value=base;
    g.gain.value=0.0;o.connect(g);g.connect(master);
    const t=ac.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.035,t+0.8);
    g.gain.exponentialRampToValueAtTime(0.0001,t+6.5);o.start(t);o.stop(t+6.6);
  },6200);
  return {ac:ac,master:master};
}
bSound.onclick=()=>{
  if(!audio)audio=initAudio();
  if(!audio)return;
  if(audio.ac.state==='suspended')audio.ac.resume();
  const on=audio.master.gain.value<0.01;
  audio.master.gain.setTargetAtTime(on?0.55:0.0,audio.ac.currentTime,0.6);
  bSound.classList.toggle('on',on);
};
window.addEventListener('keydown',(e)=>{
  if(e.key==='h'||e.key==='H')document.body.classList.toggle('hideui');
  if(e.key===' '){e.preventDefault();bPlay.click();}
});
canvas.addEventListener('pointerdown',(e)=>{dragging=true;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>{dragging=false;});
canvas.addEventListener('pointermove',(e)=>{
  if(!dragging)return;
  dragYaw=clamp(dragYaw-e.movementX*0.10,-60,60);
  dragPitch=clamp(dragPitch+e.movementY*0.06,-18,18);
});
canvas.addEventListener('wheel',(e)=>{
  e.preventDefault();zoom=clamp(zoom+e.deltaY*0.00018,-0.34,0.5);
},{passive:false});
window.addEventListener('resize',()=>{resize();});
document.addEventListener('visibilitychange',()=>{document.hidden?0:(last=performance.now());});

/* ================================================================= test-compile & boot */
function init(){
  pScene=makeProg(VS_SCENE,FS_SCENE);
  pDepth=makeProg(`#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    uniform mat4 uModel,uLightMat;
    void main(){ gl_Position=uLightMat*uModel*vec4(aPos,1.0); }`,
    `#version 300 es
    precision highp float;
    void main(){ }`);
  pSky=makeProg(VS_SKY,FS_SKY);
  pPts=makeProg(VS_PTS,FS_PTS);
  pPost=makeProg(VS_POST,FS_POST);
  SHADOW=QUAL[ql].shadow;
  resize();allocShadow();
  const built=buildWorld();
  meshStatic=uploadMesh(G_STATIC);
  meshWater=uploadMesh(G_WATER);
  const km=uploadMesh(built.koi);
  for(const k of DY.koi)k.mesh=km;
  for(const p of DY.people)for(const key in p.parts)p.parts[key].mesh=uploadMesh(p.parts[key].mesh);
  ptsPetals=uploadPoints(DY.petals);
  ptsGrass=uploadPoints(DY.grass);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.95,0.94,0.93,1.0);
}
let meshStatic,meshWater,ptsPetals,ptsGrass;
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden){last=now;return;}
  dt=Math.min(0.05,(now-last)/1000);last=now;
  if(playing)clock+=dt*speed;
  updateCamera(clock);
  M4.lookAt(CAM.view,CAM.pos,CAM.target,[0,1,0]);
  CAM.proj=M4.persp(CAM.proj,CAM.fov*Math.PI/180,canvas.width/Math.max(1,canvas.height),0.5,90);
  buildLightMat();
  /* focus sits on the subject the camera is framing -> believable depth of field */
  camState.focusDist=Math.max(2.0,Math.hypot(CAM.pos[0]-CAM.target[0],CAM.pos[1]-CAM.target[1],CAM.pos[2]-CAM.target[2]));
  updateActors(clock);
  render();
  /* hud */
  capN.textContent=String(camState.label+1).padStart(2,'0')+' / '+String(SHOTS.length).padStart(2,'0');
  if(capL.textContent!==SHOTS[camState.label].label){
    capL.style.opacity=0;
    setTimeout(()=>{capL.textContent=SHOTS[camState.label].label;capL.style.transition='opacity .5s';capL.style.opacity=1;},180);
  }
  let ct=clock%TOTAL,s=SEG[SEG.length-1];
  for(let i=0;i<SEG.length;i++)if(ct>=SEG[i].t0&&ct<SEG[i].t1){s=SEG[i];break;}
  capB.style.width=(((ct-s.t0)/(s.t1-s.t0))*100).toFixed(1)+'%';
  document.querySelectorAll('#shots button').forEach((b,i)=>b.classList.toggle('on',i===camState.label));
  if(firstFrame){
    firstFrame=false;
    const l=document.getElementById('load');
    setTimeout(()=>{l.style.opacity=0;setTimeout(()=>l.remove(),1000);},420);
  }
}
try{
  init();
  requestAnimationFrame(loop);
}catch(err){
  console.error(err);
  const e=document.getElementById('err');
  e.style.display='flex';e.textContent='Something went wrong while composing the film: '+err.message;
  document.getElementById('load').style.display='none';
}
})();
</script>
