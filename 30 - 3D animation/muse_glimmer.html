<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Pagoda Garden – Isometric</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;font-family:system-ui}
  #stage{
    position:absolute;inset:0;
    perspective:1200px;
    perspective-origin:50% 45%;
    background:
      radial-gradient(1200px 600px at 50% 20%, #1e2a3a 0%, #0b0f14 70%);
  }
  #scene{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    animation:orbit 28s ease-in-out infinite alternate;
  }
  #plate{
    position:absolute;left:50%;top:50%;
    width:min(92vmin,1100px);
    height:min(92vmin,1100px);
    transform:translate(-50%,-50%) rotateX(60deg) rotateZ(0deg);
    transform-style:preserve-3d;
    filter: saturate(1.05) contrast(1.03);
  }
  #plate::before{
    content:"";
    position:absolute;inset:0;
    background:#000;
    filter: blur(80px);
    opacity:.35;
    transform:translateZ(-80px);
  }
  #art{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    will-change:transform,filter;
    animation: dof 14s ease-in-out infinite alternate;
    border-radius:18px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 40px 120px rgba(0,0,0,.7);
  }
  /* subtle vignette + lighting */
  #stage::after{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    background:
      radial-gradient(80% 60% at 50% 35%, transparent 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom, rgba(255,235,210,.08), transparent 30%, transparent 70%, rgba(0,0,0,.6));
    mix-blend-mode:multiply;
  }
  @keyframes orbit{
    0%   { transform: rotateY(-18deg) rotateX(2deg); }
    100% { transform: rotateY(18deg) rotateX(-2deg); }
  }
  @keyframes dof{
    0%   { filter: saturate(1.05) contrast(1.03) blur(.2px); }
    100% { filter: saturate(1.12) contrast(1.06) blur(1.2px); }
  }
  #ui{
    position:absolute;left:16px;bottom:16px;
    color:#dfe8f5;font-size:12px;opacity:.7;
    background:rgba(0,0,0,.35);padding:8px 10px;border-radius:8px;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <div id="plate">
      <!-- Paste your artwork as a base64 data URI here -->
      <img id="art" alt="Pagoda garden illustration"
           src="IMAGE_DATA_URL">
    </div>
  </div>
</div>
<div id="ui">Cinematic isometric • smooth orbit • subtle depth-of-field • offline HTML</div>

<script>
/* Tiny runtime polish: gentle parallax on mouse/touch */
const scene = document.getElementById('scene');
let tx=0,ty=0;
addEventListener('pointermove', e=>{
  const x = (e.clientX / innerWidth - .5) * 2;
  const y = (e.clientY / innerHeight - .5) * 2;
  tx = x * 6;
  ty = y * 4;
});
function tick(){
  scene.style.transform = `rotateY(${tx}deg) rotateX(${2 - ty}deg)`;
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
