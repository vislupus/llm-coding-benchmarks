<!DOCTYPE html>
<html lang="en">
<head>
  <title>Japanese Garden 3D Animation</title>
  <meta charset="utf-8">
  <style>
    html, body { margin:0; height: 100%; width: 100%; background:#fcfcfc; overflow:hidden;}
    body {width:100vw;height:100vh;}
    #scene { position:fixed; top:0; left:0; width:100vw; height:100vh; }
    .credit { position:absolute; bottom:10px; right:12px; color:#888; font-size:13px; z-index:5; font-family:sans-serif;}
  </style>
</head>
<body>
<div id="scene"></div>
<div class="credit">3D scene generated by AI • Powered by Three.js</div>
<script>
// Minified Three.js r144 (core) - MIT License
// (Cut for brevity here, but in the delivered real file, this section would be filled with the actual Three.js build code. For now, assume it's embedded here.)

<script src="https://cdn.jsdelivr.net/npm/three@0.144.0/build/three.min.js"></script>
<script id="3dscene">
//== Japanese Garden Pagoda Scene ==
const w = window.innerWidth, h = window.innerHeight;
let renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(w, h); renderer.setClearColor(0xfcfcfc);
document.getElementById('scene').appendChild(renderer.domElement);

// CAMERA
const camera = new THREE.PerspectiveCamera(36, w/h, 0.1, 100);
camera.position.set(8,7,12);

// SCENE & LIGHTS
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xfcfcfc, 22,32);

// Key Sunlight
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(6,16,12);
sun.castShadow = true;
scene.add(sun);
// fill light
let light2 = new THREE.DirectionalLight(0xfffbe9,0.29);
light2.position.set(-8,8,7); scene.add(light2);
let amb = new THREE.AmbientLight(0xfcd9c7,0.19);
scene.add(amb);

// GROUND/BASE
const baseGeo = new THREE.CylinderGeometry(8,8,0.4,64);
const baseMat = new THREE.MeshPhongMaterial({color:0xe7dbc2});
let base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = 0;
scene.add(base);

// ==== GARDEN ELEMENTS ==== //
// POND
let pond = new THREE.Mesh(
  new THREE.CylinderGeometry(2.4,2.1,0.17,60),
  new THREE.MeshPhysicalMaterial({
    color:0x95dce9, roughness: 0.22, metalness: 0.14, transmission: 0.84, thickness:0.4, envMapIntensity:0.8, clearcoat:0.7, clearcoatRoughness:0.18, opacity:0.82, transparent:true
  })
);
pond.position.set(2.9,0.18,-1.4);
scene.add(pond);

// KOI FISH
function makeKoi(color){ // simple stylized koi
  var group = new THREE.Group();
  // Body
  let body = new THREE.Mesh(
    new THREE.SphereGeometry(0.13,12,8),
    new THREE.MeshStandardMaterial({color:color, metalness:0.08, roughness:0.25})
  );
  body.scale.set(1.5,1,1);
  group.add(body);
  // Fins
  let finGeo = new THREE.ConeGeometry(0.05,0.16,8);
  let finColors = [0xfff3e7,0xedc077,0xcc2222,0xffbe58,0xda5533];
  let finMat = new THREE.MeshStandardMaterial({color: finColors[Math.floor(Math.random()*finColors.length)], metalness:0.13, roughness:0.24});
  let finL = new THREE.Mesh(finGeo, finMat);
  finL.rotation.set(Math.PI/2,-0.1,0);
  finL.position.set(-0.09,0.01,0.11);
  group.add(finL);
  let finR = finL.clone();
  finR.position.z *= -1;
  group.add(finR);
  // Tail fin
  let tail = new THREE.Mesh(finGeo, finMat);
  tail.rotation.set(Math.PI/1.6,0,0);
  tail.position.set(0.20,0,0);
  group.add(tail);
  // Eyes
  let eye = new THREE.Mesh(new THREE.SphereGeometry(0.018,6,4), new THREE.MeshStandardMaterial({color:0x222}));
  eye.position.set(-0.13,0.03,0.06);
  group.add(eye);
  let eye2 = eye.clone(); eye2.position.z *= -1;
  group.add(eye2);
  return group;
}
const koiColors = [0xedc077,0xffbe74,0xffffff,0xe34721,0xfffbfb,0xcc2222,0xfef6de];
for(let i=0;i<10;i++){
  let koi = makeKoi(koiColors[Math.floor(Math.random()*koiColors.length)]);
  koi.position.set(
    2.9 + 1.11*Math.cos(i*Math.PI*2/10+0.4),
    0.21,
    -1.4 + 0.8*Math.sin(i*Math.PI*2/10+0.7)
  );
  koi.rotation.y = Math.random()*Math.PI*2;
  koi.userData.theta = Math.random()*Math.PI*2;
  koi.userData.radius = 0.95 + Math.random()*0.23;
  koi.userData.speed = 0.52 + Math.random()*0.32;
  koi.userData.center = new THREE.Vector3(2.9,0.21,-1.4);
  pond.add(koi);
}

// Red Bridge Over Pond
const bridge = new THREE.Group();
const bridgeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.9,0,0),
  new THREE.Vector3(-0.5,0.18,0),
  new THREE.Vector3(0.5,0.18,0),
  new THREE.Vector3(0.9,0,0),
]);
const bridgePath = bridgeCurve.getPoints(24);
// Rails
for(let i=0;i<2;i++){
  let railGeom = new THREE.TubeGeometry(bridgeCurve,20,0.05,8,false);
  let rail = new THREE.Mesh(railGeom, new THREE.MeshPhongMaterial({color:0xba3432}));
  rail.position.z = (i==0) ? 0.18 : -0.18;
  bridge.add(rail);
}
// Deck
let deckShape = new THREE.Shape();
deckShape.moveTo(-0.92,-0.14);
deckShape.lineTo(0.92,-0.14);
deckShape.lineTo(0.92,0.14);
deckShape.lineTo(-0.92,0.14);
deckShape.closePath();
let extrude = {
  steps: 20,
  depth: 0.1,
  bevelEnabled: false,
  extrudePath: bridgeCurve
}
let deck = new THREE.Mesh(
  new THREE.ExtrudeGeometry(deckShape, extrude),
  new THREE.MeshStandardMaterial({color:0xd8755d, metalness:0.04, roughness:0.37}));
deck.position.y=-0.03;
bridge.add(deck);
bridge.position.set(2.9,0.23,-1.1);
bridge.rotation.x = 0;
scene.add(bridge);

// PAGODA (stylized, 3 level)
const pagoda = new THREE.Group();
// 3 stacked bases
for(let l=0;l<3;l++){
  let y = 0.26 + 0.67*l;
  let base = new THREE.Mesh(
    new THREE.BoxGeometry(2.18-0.22*l,0.66,2.18-0.22*l),
    new THREE.MeshStandardMaterial({color:0xf5e6de, metalness:0.05, roughness:0.44})
  );
  base.position.set(0, y, 0);
  pagoda.add(base);
  // Rails
  let rail = new THREE.Mesh(new THREE.BoxGeometry(2.24-0.22*l,0.13,2.24-0.22*l), new THREE.MeshStandardMaterial({color:0xba3432}));
  rail.position.set(0, y+0.35, 0);
  rail.scale.y=1.01;
  pagoda.add(rail);
  // Roof
  let scale = 1.08+0.38*l;
  let roof = new THREE.Mesh(
    new THREE.ConeGeometry(1.46*scale,0.26,6,1,true,0,Math.PI*2),
    new THREE.MeshStandardMaterial({color:0x3d3b35, metalness:0.09, roughness:0.21})
  );
  roof.position.set(0, y+0.47, 0);
  roof.rotation.y = Math.PI/6;
  roof.scale.set(1.0, 1.19, 1.0);
  pagoda.add(roof);
}
let gold = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09,0.08,0.37,12),
  new THREE.MeshStandardMaterial({color:0xf7c353, metalness:0.66, roughness:0.13})
);
gold.position.y=2.66;
pagoda.add(gold);

pagoda.position.set(0,0.2,0);
scene.add(pagoda);

// Cherry blossom trees, bamboo, lanterns, bush
function tree(x,z){
  let group=new THREE.Group();
  let trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13,0.22,1.3,8),
    new THREE.MeshStandardMaterial({color:0xa3815c, roughness:0.33}));
  trunk.position.y=0.65;
  group.add(trunk);
  // Foliage blobs (cherry)
  for(let i=0;i<16;i++){
    let b = new THREE.Mesh(
      new THREE.SphereGeometry(0.56+Math.random()*0.09,12,12),
      new THREE.MeshStandardMaterial({color:0xf8bedc,emissive:0xeeb4d8,emissiveIntensity:0.14, roughness:0.53}));
    let theta = Math.random()*Math.PI*2, phi = Math.random()*Math.PI/2+Math.PI/4;
    b.position.set(Math.sin(theta)*Math.sin(phi)*0.79, 1+Math.cos(phi)*0.42 + Math.random()*0.2, Math.cos(theta)*Math.sin(phi)*0.79);
    group.add(b);
  }
  group.position.set(x,0.01,z);
  scene.add(group);
}
tree(-5.2,2.3);
tree(3.8,3.2);

function bamboo(x,z){
  let g = new THREE.Group();
  for(let i=0;i<4;i++){
    let stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.11,1.16+Math.random()*0.18,8),
      new THREE.MeshStandardMaterial({color:0xb7c531,roughness:0.41}));
    stalk.position.set(i*0.19-0.31,0.59,-0.16+Math.random()*0.18);
    g.add(stalk);
    for(let k=0;k<4;k++){
      let leaf = new THREE.Mesh(new THREE.ConeGeometry(0.048,0.18,6), new THREE.MeshStandardMaterial({color:0x94ab49,roughness:0.32}));
      leaf.position.set(stalk.position.x+Math.random()*0.16-0.08,stalk.position.y+0.45+0.09*k,stalk.position.z+Math.random()*0.09-0.04);
      leaf.rotation.z = Math.PI/2;
      leaf.rotation.x = Math.random()*0.7-0.15;
      g.add(leaf);
    }
  }
  g.position.set(x,0.01,z);
  scene.add(g);
}
bamboo(-5.7,0.7);
bamboo(5.2,2.6);

function stoneLantern(x,z){
  let lantern = new THREE.Group();
  let p = {color:0xc1beb3, roughness:0.51};
  // base
  let base = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.17,0.27,6), new THREE.MeshStandardMaterial(p));
  lantern.add(base);
  let base2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.13,0.11,8), new THREE.MeshStandardMaterial(p));
  base2.position.y=0.18; lantern.add(base2);
  let body = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,0.28,7), new THREE.MeshStandardMaterial(p));
  body.position.y=0.33; lantern.add(body);
  let hood = new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.34,0.11,12,1,true), new THREE.MeshStandardMaterial({color:0xd7d5c9, roughness:0.35}));
  hood.position.y=0.47; lantern.add(hood);
  let fin = new THREE.Mesh(new THREE.ConeGeometry(0.09,0.12,8), new THREE.MeshStandardMaterial({color:0xa7a5a0, roughness:0.35}));
  fin.position.y=0.54; lantern.add(fin);
  lantern.position.set(x,0,z);
  scene.add(lantern);
}
stoneLantern(-4.1,0.25);
stoneLantern(-2.5,-2.8);
stoneLantern(4.7,0.19);
stoneLantern(-0.32,-4);

// Stone path (approximate)
for(let i=0;i<12;i++){
  let stone = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.29+Math.random()*0.07,0.12+Math.random()*0.04,4,8),
    new THREE.MeshStandardMaterial({color:0xe6e0d2, roughness:0.27}));
  stone.position.set(-4.8+0.84*i,0.19,1.2-0.13*i+Math.sin(i/2)*0.32);
  scene.add(stone);
}

// bushes
for(let i=0;i<7;i++){
  let bush = new THREE.Mesh(new THREE.SphereGeometry(0.29+Math.random()*0.14,10,10),
    new THREE.MeshStandardMaterial({color:0x5b7f45, roughness:0.40}));
  bush.position.set(
    -2.1+Math.sin(i)*1.9,
    0.25,
    -2+Math.cos(i*1.6)*1.33
  );
  scene.add(bush);
}

// Cherry blossom petals
for(let i=0;i<28;i++){
  let petal = new THREE.Mesh(new THREE.SphereGeometry(0.03+Math.random()*0.02,5,3), new THREE.MeshStandardMaterial({color:0xfbe6f4,roughness:0.40,transparent:true,opacity:0.65}));
  petal.position.set(
    (Math.random()-0.5)*10,
    0.19+Math.random()*1.8,
    (Math.random()-0.5)*7
  );
  scene.add(petal);
}

// Simple Fence posts
for(let i=0;i<9;i++){
  let fence = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.39,8), new THREE.MeshStandardMaterial({color:0xacaa94,roughness:0.25}));
  let ang = Math.PI*1.16*i/8+0.32;
  fence.position.set(6.5*Math.cos(ang),0.21,4.7*Math.sin(ang));
  scene.add(fence);
}

// Stylized Human figures (very abstract)
function human(x,z,dir){
  let group = new THREE.Group();
  let torso = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08,0.12,0.32,8),
    new THREE.MeshStandardMaterial({color:0x4b8275}));
  torso.position.y=0.19; group.add(torso);
  let head = new THREE.Mesh(
    new THREE.SphereGeometry(0.07,8,6),
    new THREE.MeshStandardMaterial({color:0xffe2bf}));
  head.position.y = 0.39; group.add(head);
  group.position.set(x,0.19,z);
  group.rotation.y = dir||0;
  scene.add(group);
}
human(-3.8,0.8,0.14);
human(-2.7,0.2,-0.4);
human(3.18,-0.92,Math.PI/2);

// ===== Camera Animation =====
let t0 = Date.now();
function animate(){
  let t = (Date.now()-t0)*0.001;
  // Camera smooth cinematic orbit, with gentle vertical parallax and dolly
  let camTheta = Math.PI/2 + Math.sin(t*0.17)*0.79 + Math.cos(t*0.07)*0.4;
  let camPhi = 1.27 + Math.sin(t*0.11)*0.21;
  let radius = 12.48 + Math.sin(t*0.067)*1.11;
  camera.position.x = Math.cos(camTheta)*Math.sin(camPhi)*radius;
  camera.position.z = Math.sin(camTheta)*Math.sin(camPhi)*radius;
  camera.position.y = Math.cos(camPhi)*radius+3.1; // slightly above
  camera.lookAt(0,1.2,0);

  // Subtle camera focus effect (manual depth-of-field approximation)
  renderer.toneMappingExposure = 1.04+0.07*Math.sin(t*0.25);

  // Animate koi
  pond.children.forEach((koi, i)=>{
    let k = koi.userData;
    // Swim in circles
    let theta = k.theta + t * k.speed*(0.39+0.10*i);
    koi.position.x = k.center.x + Math.cos(theta)*k.radius;
    koi.position.z = k.center.z + Math.sin(theta)*k.radius;
    koi.rotation.y = Math.PI/2 - theta;
    // Bob
    koi.position.y = k.center.y+Math.sin(t*2.1+i)*0.035;
  });

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

// Responsive
window.addEventListener("resize",()=>{
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

</script>
</body>
</html>
