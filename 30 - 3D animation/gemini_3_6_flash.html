<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Japanese Garden - Cinematic Scene</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f3f4f6;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Glassmorphism UI */
    .ui-overlay {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }

    /* Top Bar Header */
    .header-bar {
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff 0%, #fbcfe8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-subtitle {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Control Panel Right */
    .panel-right {
      top: 20px;
      right: 20px;
      width: 310px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .panel-right.hidden {
      opacity: 0;
      transform: translateX(20px);
      pointer-events: none;
    }

    .panel-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .btn-preset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-preset:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .btn-preset.active {
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.3) 0%, rgba(192, 132, 252, 0.3) 100%);
      border-color: #f472b6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.25);
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .btn-cam {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-cam:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .btn-cam.active {
      background: rgba(59, 130, 246, 0.25);
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #f472b6;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #f472b6 0%, #fb7185 100%);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(244, 114, 182, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 114, 182, 0.5);
    }
    .action-btn:active {
      transform: translateY(0);
    }

    /* Bottom Quick Toolbar */
    .bottom-bar {
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
      color: #fff;
    }
    .icon-btn.active {
      background: #f472b6;
      border-color: #f472b6;
      color: #fff;
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 114, 182, 0.4);
      color: #fbcfe8;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Cinematic Helper hint */
    .click-hint {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- UI Elements -->
  <div class="ui-overlay header-bar interactive">
    <div>
      <div class="header-title">🌸 Japanese Garden</div>
      <div class="header-subtitle">Interactive 3D Sanctuary</div>
    </div>
  </div>

  <div id="toast" class="toast">🌸 Blossom Shower Triggered!</div>
  <div class="click-hint">Drag to rotate • Scroll to zoom • Click ground to spawn sakura petals</div>

  <!-- Main Control Panel -->
  <div id="control-panel" class="ui-overlay panel-right interactive">
    <div class="panel-section-title">🌅 Atmosphere Presets</div>
    <div class="preset-grid">
      <button class="btn-preset active" onclick="setPreset('day')">🌸 Day Sakura</button>
      <button class="btn-preset" onclick="setPreset('sunset')">🌅 Golden Sunset</button>
      <button class="btn-preset" onclick="setPreset('night')">🌙 Night Glow</button>
      <button class="btn-preset" onclick="setPreset('twilight')">🌫️ Zen Fog</button>
    </div>

    <div class="panel-section-title">🎥 Camera Angles</div>
    <div class="camera-grid">
      <button class="btn-cam active" onclick="setCameraView('overview')">Overview</button>
      <button class="btn-cam" onclick="setCameraView('pagoda')">Pagoda</button>
      <button class="btn-cam" onclick="setCameraView('koi')">Koi Pond</button>
      <button class="btn-cam" onclick="setCameraView('bridge')">Bridge</button>
      <button class="btn-cam" onclick="setCameraView('lantern')">Lantern</button>
      <button class="btn-cam" onclick="setCameraView('cinematic')">Cinematic</button>
    </div>

    <div class="panel-section-title">✨ Visual Effects</div>
    <div class="toggle-row">
      <span>Auto Turntable</span>
      <label class="switch">
        <input type="checkbox" id="toggle-turntable" checked onchange="toggleTurntable(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Depth of Field (Tilt-Shift)</span>
      <label class="switch">
        <input type="checkbox" id="toggle-dof" checked onchange="toggleDoF(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Lantern Glow</span>
      <label class="switch">
        <input type="checkbox" id="toggle-lanterns" checked onchange="toggleLanterns(this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <button class="action-btn" onclick="triggerSakuraBurst()">
      🌸 Sakura Blossom Shower
    </button>
  </div>

  <!-- Bottom Quick Bar -->
  <div class="ui-overlay bottom-bar interactive">
    <button class="icon-btn" id="sound-btn" title="Toggle Zen Ambient Audio" onclick="toggleAudio()">🎵</button>
    <button class="icon-btn" title="Trigger Blossom Rain" onclick="triggerSakuraBurst()">🌸</button>
    <button class="icon-btn" id="turntable-btn" title="Toggle Camera Orbit" onclick="toggleTurntableBtn()">🔄</button>
    <button class="icon-btn" title="Take Screenshot" onclick="takeSnapshot()">📸</button>
    <button class="icon-btn" id="panel-toggle-btn" title="Toggle Panel" onclick="togglePanel()">⚙️</button>
  </div>

  <!-- Embedded Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Main Application Script -->
  <script>
    // --- Application State ---
    let scene, camera, renderer, clock;
    let controls = {};
    let isAutoRotating = true;
    let dofEnabled = true;
    let lanternsEnabled = true;
    let currentPreset = 'day';

    // Materials & Textures
    let textures = {};
    let animatedMaterials = [];
    let lanternLights = [];

    // Particle & Entity Objects
    let fallingPetals = [];
    let koiFishList = [];
    let waterMesh, waterMaterial;
    let DoFPassMaterial;

    // Audio Engine
    let audioCtx = null;
    let audioPlaying = false;
    let audioGainNode = null;

    // --- Procedural Canvas Texture Generators ---
    function createRoofTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2b2e36';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#181a20';
      ctx.lineWidth = 12;
      for (let y = 0; y < 512; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();
      }
      ctx.fillStyle = '#1e2128';
      for (let x = 0; x < 512; x += 32) {
        for (let y = 0; y < 512; y += 32) {
          ctx.beginPath();
          ctx.arc(x + 16, y + 16, 12, 0, Math.PI);
          ctx.fill();
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createWoodTexture(colorHex1, colorHex2) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colorHex1;
      ctx.fillRect(0, 0, 256, 256);

      ctx.fillStyle = colorHex2;
      ctx.globalAlpha = 0.15;
      for (let i = 0; i < 200; i++) {
        const y = Math.random() * 256;
        const h = Math.random() * 4 + 1;
        ctx.fillRect(0, y, 256, h);
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createStoneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#8a939e';
      ctx.fillRect(0, 0, 256, 256);

      ctx.fillStyle = '#5c6470';
      for (let i = 0; i < 1500; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const r = Math.random() * 2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createPetalTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, '#fbcfe8');
      grad.addColorStop(0.6, '#f472b6');
      grad.addColorStop(1, 'rgba(244, 114, 182, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(32, 32, 28, 18, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    function createWaterNoiseCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#8080ff';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const r = Math.random() * 20 + 5;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
        grad.addColorStop(1, 'rgba(128, 128, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createKoiTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      
      // Base body color
      ctx.fillStyle = type === 'yellow' ? '#facc15' : '#ffffff';
      ctx.fillRect(0, 0, 128, 64);

      if (type !== 'yellow') {
        // Red patches (Kohaku / Sanke)
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.ellipse(30, 32, 20, 15, 0, 0, Math.PI * 2);
        ctx.ellipse(70, 25, 18, 12, 0.2, 0, Math.PI * 2);
        ctx.ellipse(95, 38, 12, 8, -0.2, 0, Math.PI * 2);
        ctx.fill();

        if (type === 'sanke') {
          // Black patches
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.ellipse(45, 40, 10, 6, 0.5, 0, Math.PI * 2);
          ctx.ellipse(80, 20, 8, 5, -0.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Eye dots
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(15, 20, 3, 0, Math.PI * 2);
      ctx.arc(15, 44, 3, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    // --- Orbit Camera & Controls Implementation ---
    function initCameraControls() {
      controls = {
        target: new THREE.Vector3(0, 3.2, 0),
        radius: 22,
        theta: Math.PI * 0.25, // horizontal angle
        phi: Math.PI * 0.32,   // vertical elevation angle
        minRadius: 6,
        maxRadius: 40,
        minPhi: 0.05,
        maxPhi: Math.PI * 0.48,
        isDragging: false,
        previousMouse: { x: 0, y: 0 },
        targetTheta: Math.PI * 0.25,
        targetPhi: Math.PI * 0.32,
        targetRadius: 22,
        targetLookAt: new THREE.Vector3(0, 3.2, 0)
      };

      const dom = renderer.domElement;

      dom.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          controls.isDragging = true;
          controls.previousMouse = { x: e.clientX, y: e.clientY };
        }
      });

      window.addEventListener('mouseup', () => {
        controls.isDragging = false;
      });

      window.addEventListener('mousemove', (e) => {
        if (!controls.isDragging) return;
        const deltaX = e.clientX - controls.previousMouse.x;
        const deltaY = e.clientY - controls.previousMouse.y;

        controls.targetTheta -= deltaX * 0.005;
        controls.targetPhi -= deltaY * 0.005;
        controls.targetPhi = Math.max(controls.minPhi, Math.min(controls.maxPhi, controls.targetPhi));

        controls.previousMouse = { x: e.clientX, y: e.clientY };
      });

      dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        controls.targetRadius += e.deltaY * 0.015;
        controls.targetRadius = Math.max(controls.minRadius, Math.min(controls.maxRadius, controls.targetRadius));
      }, { passive: false });

      // Touch events
      let touchStartDist = 0;
      dom.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          controls.isDragging = true;
          controls.previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      });

      dom.addEventListener('touchmove', (e) => {
        if (controls.isDragging && e.touches.length === 1) {
          const deltaX = e.touches[0].clientX - controls.previousMouse.x;
          const deltaY = e.touches[0].clientY - controls.previousMouse.y;
          controls.targetTheta -= deltaX * 0.005;
          controls.targetPhi -= deltaY * 0.005;
          controls.targetPhi = Math.max(controls.minPhi, Math.min(controls.maxPhi, controls.targetPhi));
          controls.previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = touchStartDist - dist;
          controls.targetRadius += delta * 0.02;
          controls.targetRadius = Math.max(controls.minRadius, Math.min(controls.maxRadius, controls.targetRadius));
          touchStartDist = dist;
        }
      });

      dom.addEventListener('touchend', () => {
        controls.isDragging = false;
      });

      // Click ground to spawn sakura
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      dom.addEventListener('click', (e) => {
        if (e.target.tagName !== 'CANVAS') return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
          const p = intersects[0].point;
          spawnPetalsAt(p.x, p.y + 2, p.z, 25);
        }
      });
    }

    function updateCamera() {
      if (isAutoRotating && !controls.isDragging) {
        controls.targetTheta += 0.0012;
      }

      // Smooth lerp for camera controls
      controls.theta += (controls.targetTheta - controls.theta) * 0.08;
      controls.phi += (controls.targetPhi - controls.phi) * 0.08;
      controls.radius += (controls.targetRadius - controls.radius) * 0.08;
      controls.target.lerp(controls.targetLookAt, 0.08);

      const x = controls.radius * Math.sin(controls.phi) * Math.sin(controls.theta);
      const y = controls.radius * Math.cos(controls.phi);
      const z = controls.radius * Math.sin(controls.phi) * Math.cos(controls.theta);

      camera.position.set(
        controls.target.x + x,
        controls.target.y + y,
        controls.target.z + z
      );
      camera.lookAt(controls.target);
    }

    // --- Scene Setup ---
    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color('#dbeafe');
      scene.fog = new THREE.FogExp2('#dbeafe', 0.015);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      clock = new THREE.Clock();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // Procedural textures
      textures.roof = createRoofTileTexture();
      textures.roof.wrapS = textures.roof.wrapT = THREE.RepeatWrapping;
      textures.roof.repeat.set(2, 2);

      textures.woodRed = createWoodTexture('#991b1b', '#7f1d1d');
      textures.woodDark = createWoodTexture('#331800', '#1a0c00');
      textures.stone = createStoneTexture();
      textures.petal = createPetalTexture();
      textures.waterNoise = createWaterNoiseCanvas();

      textures.koiKohaku = createKoiTexture('kohaku');
      textures.koiSanke = createKoiTexture('sanke');
      textures.koiYellow = createKoiTexture('yellow');

      // Lighting
      setupLighting();

      // Build Garden World
      buildJapaneseGarden();

      // Camera Controls
      initCameraControls();

      // Window resize
      window.addEventListener('resize', onWindowResize);

      // Postprocessing for Tilt-Shift Depth-of-Field
      initPostProcessing();

      // Render Loop
      animate();
    }

    let renderTarget, postScene, postCamera, postMaterial;

    function initPostProcessing() {
      const renderTargetParams = {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat
      };
      const px = Math.min(window.devicePixelRatio, 2);
      renderTarget = new THREE.WebGLRenderTarget(
        window.innerWidth * px,
        window.innerHeight * px,
        renderTargetParams
      );

      postScene = new THREE.Scene();
      postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      postMaterial = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: null },
          blurAmount: { value: 0.0035 },
          focusCenter: { value: 0.5 },
          focusRadius: { value: 0.18 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float blurAmount;
          uniform float focusCenter;
          uniform float focusRadius;
          varying vec2 vUv;

          void main() {
            vec4 sum = vec4(0.0);
            float dist = abs(vUv.y - focusCenter);
            float blur = smoothstep(focusRadius, focusRadius + 0.35, dist) * blurAmount;

            sum += texture2D(tDiffuse, vUv + vec2(0.0, -4.0 * blur)) * 0.05;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, -3.0 * blur)) * 0.09;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, -2.0 * blur)) * 0.12;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, -1.0 * blur)) * 0.15;
            sum += texture2D(tDiffuse, vUv) * 0.18;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, 1.0 * blur)) * 0.15;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, 2.0 * blur)) * 0.12;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, 3.0 * blur)) * 0.09;
            sum += texture2D(tDiffuse, vUv + vec2(0.0, 4.0 * blur)) * 0.05;

            gl_FragColor = sum;
          }
        `
      });

      const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
      postScene.add(postQuad);
    }

    // --- 3-Tier Japanese Pagoda ---
    function buildPagoda() {
      const pagoda = new THREE.Group();
      pagoda.position.set(-2, 0.1, -2.5);

      const redMat = new THREE.MeshStandardMaterial({
        map: textures.woodRed,
        color: '#b91c1c',
        roughness: 0.4
      });

      const whitePlasterMat = new THREE.MeshStandardMaterial({
        color: '#f8fafc',
        roughness: 0.6
      });

      const roofMat = new THREE.MeshStandardMaterial({
        map: textures.roof,
        color: '#334155',
        roughness: 0.5,
        metalness: 0.2
      });

      const goldMat = new THREE.MeshStandardMaterial({
        color: '#eab308',
        metalness: 0.8,
        roughness: 0.2
      });

      const darkWoodMat = new THREE.MeshStandardMaterial({
        map: textures.woodDark,
        color: '#261205',
        roughness: 0.7
      });

      // Stone Foundation Base
      const baseGeo = new THREE.BoxGeometry(4.2, 0.8, 4.2);
      const baseMat = new THREE.MeshStandardMaterial({ map: textures.stone, roughness: 0.8 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = 0.4;
      base.castShadow = true;
      base.receiveShadow = true;
      pagoda.add(base);

      // Front Steps
      for (let i = 0; i < 4; i++) {
        const step = new THREE.Mesh(
          new THREE.BoxGeometry(1.4, 0.15, 0.3),
          redMat
        );
        step.position.set(0, i * 0.15 + 0.1, 2.1 + i * 0.22);
        step.castShadow = true;
        step.receiveShadow = true;
        pagoda.add(step);
      }

      // Helper for creating swept pagoda roof tier
      function createPagodaRoof(width, yPos) {
        const group = new THREE.Group();
        group.position.y = yPos;

        const roofShape = new THREE.ConeGeometry(width * 0.82, 0.8, 4);
        const roofMesh = new THREE.Mesh(roofShape, roofMat);
        roofMesh.rotation.y = Math.PI / 4;
        roofMesh.scale.set(1.4, 0.7, 1.4);
        roofMesh.castShadow = true;
        roofMesh.receiveShadow = true;
        group.add(roofMesh);

        // Under-eave red structure frame
        const eaveGeo = new THREE.BoxGeometry(width * 1.1, 0.12, width * 1.1);
        const eave = new THREE.Mesh(eaveGeo, redMat);
        eave.position.y = -0.3;
        eave.castShadow = true;
        group.add(eave);

        // Corner eaves golden ornaments
        for (let r = 0; r < 4; r++) {
          const angle = (r * Math.PI) / 2 + Math.PI / 4;
          const corner = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 4), goldMat);
          const dist = width * 0.75;
          corner.position.set(Math.cos(angle) * dist, -0.3, Math.sin(angle) * dist);
          corner.rotation.z = -Math.PI / 4;
          group.add(corner);
        }

        return group;
      }

      // Tier 1 (Ground Level)
      const tier1Wall = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.6, 3.2), whitePlasterMat);
      tier1Wall.position.y = 1.6;
      tier1Wall.castShadow = true;
      pagoda.add(tier1Wall);

      // Tier 1 Pillars & Door
      const door = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.2, 0.08), darkWoodMat);
      door.position.set(0, 1.4, 1.61);
      pagoda.add(door);

      // Balcony Railings 1st Floor
      const railFloor = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.08, 3.6), redMat);
      railFloor.position.y = 0.85;
      pagoda.add(railFloor);

      const roof1 = createPagodaRoof(3.8, 2.6);
      pagoda.add(roof1);

      // Tier 2 (Middle)
      const tier2Wall = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.4, 2.5), whitePlasterMat);
      tier2Wall.position.y = 3.3;
      tier2Wall.castShadow = true;
      pagoda.add(tier2Wall);

      const railFloor2 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 2.8), redMat);
      railFloor2.position.y = 2.65;
      pagoda.add(railFloor2);

      const roof2 = createPagodaRoof(3.1, 4.2);
      pagoda.add(roof2);

      // Tier 3 (Top)
      const tier3Wall = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.2, 1.9), whitePlasterMat);
      tier3Wall.position.y = 4.8;
      tier3Wall.castShadow = true;
      pagoda.add(tier3Wall);

      const roof3 = createPagodaRoof(2.4, 5.6);
      pagoda.add(roof3);

      // Top Golden Spire (Sōrin)
      const spireGroup = new THREE.Group();
      spireGroup.position.y = 6.0;

      const spireBase = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 8), goldMat);
      spireGroup.add(spireBase);

      for (let s = 0; s < 7; s++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.2 - s * 0.018, 0.03, 8, 16), goldMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.4 + s * 0.18;
        spireGroup.add(ring);
      }

      const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), goldMat);
      jewel.position.y = 1.8;
      spireGroup.add(jewel);

      pagoda.add(spireGroup);
      scene.add(pagoda);
    }

    // --- Curved Koi Pond & Water ---
    function buildKoiPond() {
      const pondGroup = new THREE.Group();

      // S-curve pond shape cut into ground
      const pondShape = new THREE.Shape();
      pondShape.moveTo(1, -1);
      pondShape.bezierCurveTo(4, -1, 6, 2, 4, 5);
      pondShape.bezierCurveTo(2, 7, -1, 5, 0, 3);
      pondShape.bezierCurveTo(0.5, 1, -1, -1, 1, -1);

      // Water surface mesh
      const waterGeo = new THREE.ShapeGeometry(pondShape);
      waterMaterial = new THREE.MeshStandardMaterial({
        color: '#0284c7',
        roughness: 0.1,
        metalness: 0.8,
        transparent: true,
        opacity: 0.82,
        normalMap: textures.waterNoise,
        normalScale: new THREE.Vector2(0.15, 0.15)
      });

      waterMesh = new THREE.Mesh(waterGeo, waterMaterial);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.position.set(1.5, 0.08, -1.5);
      pondGroup.add(waterMesh);

      // Dark Pond Bed
      const bedGeo = new THREE.ShapeGeometry(pondShape);
      const bedMat = new THREE.MeshStandardMaterial({ color: '#0f172a', roughness: 0.9 });
      const bedMesh = new THREE.Mesh(bedGeo, bedMat);
      bedMesh.rotation.x = -Math.PI / 2;
      bedMesh.position.set(1.5, -0.4, -1.5);
      pondGroup.add(bedMesh);

      // Stone Coping Edge around pond
      const points = pondShape.getPoints(60);
      for (let i = 0; i < points.length; i++) {
        const pt = points[i];
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.22 + Math.random() * 0.1, 1),
          new THREE.MeshStandardMaterial({ map: textures.stone, roughness: 0.8 })
        );
        // Map 2D shape coords to 3D position
        rock.position.set(pt.x + 1.5, 0.1, -pt.y - 1.5);
        rock.scale.set(1 + Math.random() * 0.4, 0.6 + Math.random() * 0.3, 1 + Math.random() * 0.4);
        rock.castShadow = true;
        rock.receiveShadow = true;
        pondGroup.add(rock);
      }

      scene.add(pondGroup);

      // Spawn Koi Fish
      buildKoiFish();
    }

    // --- Swimming Animated Koi Fish ---
    function buildKoiFish() {
      const koiTypes = ['kohaku', 'sanke', 'yellow', 'kohaku', 'sanke', 'yellow', 'kohaku'];

      for (let i = 0; i < 9; i++) {
        const koiGroup = new THREE.Group();

        const koiMat = new THREE.MeshStandardMaterial({
          map: tex,
          roughness: 0.3,
          metalness: 0.1

        // Fish Body
        const bodyGeo = new THREE.ConeGeometry(0.12, 0.55, 8);
        bodyGeo.rotateX(Math.PI / 2);
        const body = new THREE.Mesh(bodyGeo, koiMat);
        koiGroup.add(body);

        // Tail Fin
        const tailGeo = new THREE.PlaneGeometry(0.18, 0.22);
        const tailMat = new THREE.MeshStandardMaterial({
          color: '#ffffff',
          transparent: true,
          opacity: 0.7,
          side: THREE.DoubleSide
        });
        const tail = new THREE.Mesh(tailGeo, tailMat);
        tail.position.set(0, 0, -0.32);
        koiGroup.add(tail);

        // Pectoral Fins
        const finGeo = new THREE.PlaneGeometry(0.12, 0.18);
        const leftFin = new THREE.Mesh(finGeo, tailMat);
        leftFin.position.set(0.12, 0, 0.05);
        leftFin.rotation.set(0.3, 0, -0.5);
        koiGroup.add(leftFin);

        const rightFin = new THREE.Mesh(finGeo, tailMat);
        rightFin.position.set(-0.12, 0, 0.05);
        rightFin.rotation.set(0.3, 0, 0.5);
        koiGroup.add(rightFin);

        // Position in pond area
        koiGroup.position.set(
          2.5 + (Math.random() - 0.5) * 3.5,
          -0.12 - Math.random() * 0.15,
          -0.5 + (Math.random() - 0.5) * 3.5
        );

        koiGroup.scale.setScalar(0.7 + Math.random() * 0.5);

        scene.add(koiGroup);

        koiFishList.push({
          mesh: koiGroup,
          tailMesh: tail,
          speed: 0.4 + Math.random() * 0.5,
          swimPhase: Math.random() * Math.PI * 2,
          radiusX: 1.2 + Math.random() * 1.8,
          radiusZ: 1.2 + Math.random() * 1.8,
          centerX: koiGroup.position.x,
          centerZ: koiGroup.position.z
        });
      }
    }

    // --- Arched Red Bridge (Taiko-Bashi) ---
    function buildBridge() {
      const bridgeGroup = new THREE.Group();
      bridgeGroup.position.set(3.8, 0.1, -1.2);
      bridgeGroup.rotation.y = Math.PI * 0.22;

      const redMat = new THREE.MeshStandardMaterial({
        map: textures.woodRed,
        color: '#dc2626',
        roughness: 0.4
      });

      const goldMat = new THREE.MeshStandardMaterial({
        color: '#eab308',
        metalness: 0.8,
        roughness: 0.2
      });

      // Arched Deck Planks
      const plankCount = 18;
      const bridgeWidth = 1.0;
      const bridgeSpan = 3.2;

      for (let i = 0; i <= plankCount; i++) {
        const t = i / plankCount;
        const angle = t * Math.PI;
        const x = (t - 0.5) * bridgeSpan;
        const y = Math.sin(angle) * 0.65;

        const plank = new THREE.Mesh(
          new THREE.BoxGeometry(bridgeSpan / plankCount * 0.9, 0.08, bridgeWidth),
          redMat
        );
        plank.position.set(x, y, 0);
        plank.rotation.z = -Math.cos(angle) * 0.45;
        plank.castShadow = true;
        plank.receiveShadow = true;
        bridgeGroup.add(plank);

        // Railing Posts
        if (i % 3 === 0) {
          for (let side of [-1, 1]) {
            const post = new THREE.Mesh(
              new THREE.CylinderGeometry(0.04, 0.04, 0.7, 8),
              redMat
            );
            post.position.set(x, y + 0.3, side * (bridgeWidth / 2 + 0.04));
            post.castShadow = true;
            bridgeGroup.add(post);

            // Gold Post Cap (Giboshi)
            const cap = new THREE.Mesh(
              new THREE.SphereGeometry(0.06, 8, 8),
              goldMat
            );
            cap.position.set(x, y + 0.68, side * (bridgeWidth / 2 + 0.04));
            bridgeGroup.add(cap);
          }
        }
      }

      // Curved Handrails
      for (let side of [-1, 1]) {
        const points = [];
        for (let i = 0; i <= 20; i++) {
          const t = i / 20;
          const x = (t - 0.5) * bridgeSpan;
          const y = Math.sin(t * Math.PI) * 0.65 + 0.55;
          points.push(new THREE.Vector3(x, y, side * (bridgeWidth / 2 + 0.04)));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const railGeo = new THREE.TubeGeometry(curve, 20, 0.035, 8, false);
        const railMesh = new THREE.Mesh(railGeo, redMat);
        railMesh.castShadow = true;
        bridgeGroup.add(railMesh);
      }

      scene.add(bridgeGroup);
    }

    // --- Winding Stone Path & Stepping Stones ---

      const pathGroup = new THREE.Group();

      // Curve path points from entrance to pagoda

      const curve = new THREE.CatmullRomCurve3(pathPoints);

      for (let i = 0; i < points.length; i++) {

        flagstone.scale.set(1 + Math.random() * 0.3, 1, 0.8 + Math.random() * 0.3);
        flagstone.castShadow = true;
        flagstone.receiveShadow = true;
        pathGroup.add(flagstone);
      }

      scene.add(pathGroup);
    }

    // --- Cherry Blossom Trees (Sakura) ---
    function buildSakuraTrees() {
      const woodMat = new THREE.MeshStandardMaterial({
        map: textures.woodDark,
        roughness: 0.9
      });

      const blossomMat = new THREE.MeshStandardMaterial({
        color: '#f472b6',
        roughness: 0.6,

      });

        // Branches

          const branch = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.22, 2.0, 6),

          );
          const angle = (b * Math.PI) / 2 + Math.random() * 0.4;
          branch.position.set(Math.cos(angle) * 0.6, 2.4, Math.sin(angle) * 0.6);
          branch.rotation.set(Math.cos(angle) * 0.8, angle, Math.sin(angle) * 0.8);
          branch.castShadow = true;
          tree.add(branch);
        }

        // Billowy Blossom Cloud Foliage
        const cloudCount = 14;
        for (let c = 0; c < cloudCount; c++) {
          const cloud = new THREE.Mesh(
            new THREE.DodecahedronGeometry(1.2 + Math.random() * 0.6, 1),
            blossomMat
          );
          cloud.position.set(
            (Math.random() - 0.5) * 3.2,
            3.2 + Math.random() * 2.2,
            (Math.random() - 0.5) * 3.2

          cloud.castShadow = true;
          tree.add(cloud);
        }

        tree.scale.setScalar(1.1 + idx * 0.1);
        scene.add(tree);

    // --- Bamboo Groves ---
    function buildBambooGroves() {
      const bambooMat = new THREE.MeshStandardMaterial({
        color: '#16a34a',

      });

      const leafMat = new THREE.MeshStandardMaterial({
        color: '#22c55e',

      });

      const grovePositions = [
        new THREE.Vector3(-8.0, 0, -1.0),
        new THREE.Vector3(7.5, 0, 1.5)
      ];

      grovePositions.forEach((grovePos) => {
        const grove = new THREE.Group();
        grove.position.copy(grovePos);

        for (let i = 0; i < 18; i++) {
          const stalk = new THREE.Group();
          const height = 4.5 + Math.random() * 2.5;

          // Segmented Stalk
          const segs = 6;
          for (let s = 0; s < segs; s++) {
            const seg = new THREE.Mesh(
              new THREE.CylinderGeometry(0.06, 0.07, height / segs, 8),
              bambooMat
            );
            seg.position.y = (s + 0.5) * (height / segs);
            seg.castShadow = true;
            stalk.add(seg);

            // Ring node
            const ring = new THREE.Mesh(
              new THREE.TorusGeometry(0.075, 0.015, 6, 12),
              bambooMat
            );
            ring.rotation.x = Math.PI / 2;
            ring.position.y = s * (height / segs);
            stalk.add(ring);
          }

          // Leaf Clusters at top
          for (let l = 0; l < 5; l++) {
            const leaf = new THREE.Mesh(
              new THREE.PlaneGeometry(0.12, 0.4),
              leafMat
            );
            leaf.position.set(
              (Math.random() - 0.5) * 0.3,
              height - Math.random() * 1.2,
              (Math.random() - 0.5) * 0.3
            );
            leaf.rotation.set(Math.random(), Math.random(), Math.random());
            stalk.add(leaf);
          }

          stalk.position.set((Math.random() - 0.5) * 2.2, 0, (Math.random() - 0.5) * 2.2);
          grove.add(stalk);
        }

        scene.add(grove);
      });
    }

    // --- Topiary Bushes & Boulders ---
    function buildBushesAndBoulders() {
      const bushMat = new THREE.MeshStandardMaterial({
        color: '#15803d',
        roughness: 0.8
      });

      const rockMat = new THREE.MeshStandardMaterial({
        map: textures.stone,
        roughness: 0.85
      });

      // Trimmed rounded Buxus Bushes
      const bushPositions = [
        new THREE.Vector3(-3.2, 0.3, 0.5),
        new THREE.Vector3(-1.2, 0.3, -2.8),
        new THREE.Vector3(1.5, 0.3, 1.2),
        new THREE.Vector3(5.2, 0.3, -2.5),
        new THREE.Vector3(-0.8, 0.3, 3.5)
      ];

      bushPositions.forEach((pos) => {
        const bush = new THREE.Mesh(
          new THREE.SphereGeometry(0.5 + Math.random() * 0.3, 12, 12),
          bushMat
        );
        bush.position.copy(pos);
        bush.scale.set(1.2, 0.8, 1.2);
        bush.castShadow = true;
        scene.add(bush);
      });

      // Boulders
      const boulderPositions = [
        new THREE.Vector3(-4.8, 0.3, -1.5),
        new THREE.Vector3(3.5, 0.3, -3.8),
        new THREE.Vector3(0.5, 0.3, -4.8)
      ];

      boulderPositions.forEach((pos) => {
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.6 + Math.random() * 0.4, 1),
          rockMat
        );
        rock.position.copy(pos);
        rock.rotation.set(Math.random(), Math.random(), Math.random());
        rock.castShadow = true;
        scene.add(rock);
      });
    }

    // --- Stylized 3D Visitors ---
    function buildVisitors() {
      function createPerson(shirtColorHex, pantsColorHex, isSkirt) {
        const person = new THREE.Group();

        const skinMat = new THREE.MeshStandardMaterial({ color: '#fde047', roughness: 0.6 });
        const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColorHex, roughness: 0.5 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColorHex, roughness: 0.5 });
        const hairMat = new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.8 });

        // Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), skinMat);
        head.position.y = 1.35;
        person.add(head);

        // Hair
        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), hairMat);
        hair.position.set(0, 1.38, -0.02);
        person.add(hair);

        // Torso
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.12, 0.5, 8), shirtMat);
        torso.position.y = 0.95;
        person.add(torso);

        // Legs / Skirt
        if (isSkirt) {
          const skirt = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.4, 8), pantsMat);
          skirt.position.y = 0.62;
          person.add(skirt);

          for (let l of [-0.06, 0.06]) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.45, 8), skinMat);
            leg.position.set(l, 0.22, 0);
            person.add(leg);
          }
        } else {
          for (let l of [-0.07, 0.07]) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.7, 8), pantsMat);
            leg.position.set(l, 0.35, 0);
            person.add(leg);
          }
        }

        person.traverse((child) => {
          if (child.isMesh) child.castShadow = true;
        });

        return person;
      }

      // Visitor 1 (Woman in white top, dark skirt)
      const v1 = createPerson('#f8fafc', '#1e293b', true);
      v1.position.set(-3.1, 0.12, 3.2);
      v1.rotation.y = Math.PI * 0.15;
      scene.add(v1);

      // Visitor 2 (Man in green t-shirt)
      const v2 = createPerson('#15803d', '#334155', false);
      v2.position.set(-2.5, 0.12, 3.0);
      v2.rotation.y = -Math.PI * 0.1;
      scene.add(v2);

      // Visitor 3 (Man on bridge in navy blue shirt)
      const v3 = createPerson('#1e3a8a', '#d97706', false);
      v3.position.set(3.8, 0.75, -1.2);
      v3.rotation.y = -Math.PI * 0.4;
      scene.add(v3);
    }

    // --- Falling Sakura Petal Particle System ---
    function initSakuraPetals() {
      const count = 220;
      const geo = new THREE.PlaneGeometry(0.12, 0.12);
      const mat = new THREE.MeshStandardMaterial({
        map: textures.petal,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const instancedMesh = new THREE.InstancedMesh(geo, mat, count);
      const dummy = new THREE.Object3D();

      for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * 22;
        const y = 1.0 + Math.random() * 12;
        const z = (Math.random() - 0.5) * 22;

        dummy.position.set(x, y, z);
        dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        dummy.scale.setScalar(0.8 + Math.random() * 0.6);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);

        fallingPetals.push({
          x: x, y: y, z: z,
          vx: (Math.random() - 0.5) * 0.02,
          vy: -0.015 - Math.random() * 0.02,
          vz: (Math.random() - 0.5) * 0.02,
          rotX: Math.random() * 0.02,
          rotY: Math.random() * 0.02,
          rotZ: Math.random() * 0.02,
          rx: dummy.rotation.x,
          ry: dummy.rotation.y,
          rz: dummy.rotation.z
        });
      }

      instancedMesh.instanceMatrix.needsUpdate = true;
      scene.add(instancedMesh);
      fallingPetals.mesh = instancedMesh;
      fallingPetals.dummy = dummy;
    }

    function spawnPetalsAt(cx, cy, cz, count) {
      if (!fallingPetals.mesh) return;

      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * fallingPetals.length);
        const p = fallingPetals[idx];
        p.x = cx + (Math.random() - 0.5) * 2;
        p.y = cy + Math.random() * 1.5;
        p.z = cz + (Math.random() - 0.5) * 2;
        p.vy = -0.02 - Math.random() * 0.025;
      }
      showToast('🌸 Sakura Blossom Rain!');
    }

    function updateSakuraPetals(delta) {
      if (!fallingPetals.mesh) return;

      const dummy = fallingPetals.dummy;
      const mesh = fallingPetals.mesh;

      for (let i = 0; i < fallingPetals.length; i++) {
        const p = fallingPetals[i];

        p.x += p.vx + Math.sin(clock.elapsedTime + i) * 0.005;
        p.y += p.vy;
        p.z += p.vz + Math.cos(clock.elapsedTime + i) * 0.005;

        p.rx += p.rotX;
        p.ry += p.rotY;

        if (p.y < 0.1) {
          p.y = 10 + Math.random() * 4;
          p.x = (Math.random() - 0.5) * 22;
          p.z = (Math.random() - 0.5) * 22;
        }

        dummy.position.set(p.x, p.y, p.z);
        dummy.rotation.set(p.rx, p.ry, p.rz);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }

      mesh.instanceMatrix.needsUpdate = true;
    }

    // --- Animation & Render Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Camera motion update
      updateCamera();

      // Swimming Koi Fish Update
      koiFishList.forEach((koi) => {
        koi.swimPhase += delta * koi.speed;
        const x = koi.centerX + Math.cos(koi.swimPhase) * koi.radiusX;
        const z = koi.centerZ + Math.sin(koi.swimPhase * 0.8) * koi.radiusZ;

        // Calculate heading direction
        const dx = x - koi.mesh.position.x;
        const dz = z - koi.mesh.position.z;
        const angle = Math.atan2(dx, dz);

        koi.mesh.position.x = x;
        koi.mesh.position.z = z;
        koi.mesh.rotation.y = angle;

        // Tail wiggle
        if (koi.tailMesh) {
          koi.tailMesh.rotation.y = Math.sin(time * 8 + koi.swimPhase) * 0.35;
        }
      });

      // Water distortion animation
      if (textures.waterNoise) {
        textures.waterNoise.offset.x = (time * 0.03) % 1;
        textures.waterNoise.offset.y = (time * 0.02) % 1;
      }

      // Lantern subtle flickering
      if (lanternsEnabled) {
        lanternLights.forEach((light, i) => {
          light.intensity = 1.0 + Math.sin(time * 4 + i) * 0.25 + (Math.random() - 0.5) * 0.1;
        });
      }

      // Sakura Petals Fall Update
      updateSakuraPetals(delta);

      // Render Scene with or without DoF
      if (dofEnabled && renderTarget) {
        renderer.setRenderTarget(renderTarget);
        renderer.render(scene, camera);
        postMaterial.uniforms.tDiffuse.value = renderTarget.texture;
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);
      } else {
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      }
    }

    // --- Atmosphere & Lighting Presets ---
    function setPreset(presetKey) {
      currentPreset = presetKey;
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (presetKey === 'day') {
        scene.background.set('#dbeafe');
        scene.fog.color.set('#dbeafe');
        scene.fog.density = 0.012;
        ambientLight.color.set('#ffffff');
        ambientLight.intensity = 0.5;
        mainLight.color.set('#fffbeb');
        mainLight.intensity = 1.4;
        mainLight.position.set(20, 30, 15);
      } else if (presetKey === 'sunset') {
        scene.background.set('#fdba74');
        scene.fog.color.set('#fdba74');
        scene.fog.density = 0.015;
        ambientLight.color.set('#fed7aa');
        ambientLight.intensity = 0.4;
        mainLight.color.set('#f97316');
        mainLight.intensity = 1.8;
        mainLight.position.set(25, 12, -20);
      } else if (presetKey === 'night') {
        scene.background.set('#090d16');
        scene.fog.color.set('#090d16');
        scene.fog.density = 0.02;
        ambientLight.color.set('#1e293b');
        ambientLight.intensity = 0.2;
        mainLight.color.set('#38bdf8');
        mainLight.intensity = 0.4;
        mainLight.position.set(-15, 25, 10);
      } else if (presetKey === 'twilight') {
        scene.background.set('#3b0764');
        scene.fog.color.set('#3b0764');
        scene.fog.density = 0.025;
        ambientLight.color.set('#a855f7');
        ambientLight.intensity = 0.35;
        mainLight.color.set('#f472b6');
        mainLight.intensity = 0.8;
        mainLight.position.set(10, 20, -15);
      }

      showToast(`Preset: ${presetKey.toUpperCase()}`);
    }

    // --- Camera View Targets ---
    function setCameraView(viewKey) {
      document.querySelectorAll('.btn-cam').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      isAutoRotating = false;
      document.getElementById('toggle-turntable').checked = false;

      if (viewKey === 'overview') {
        controls.targetLookAt.set(0, 3.2, 0);
        controls.targetRadius = 22;
        controls.targetTheta = Math.PI * 0.25;
        controls.targetPhi = Math.PI * 0.32;
      } else if (viewKey === 'pagoda') {
        controls.targetLookAt.set(-2, 3.5, -2.5);
        controls.targetRadius = 12;
        controls.targetTheta = Math.PI * 0.15;
        controls.targetPhi = Math.PI * 0.38;
      } else if (viewKey === 'koi') {
        controls.targetLookAt.set(2.2, 0.2, -0.5);
        controls.targetRadius = 8;
        controls.targetTheta = Math.PI * 0.4;
        controls.targetPhi = Math.PI * 0.28;
      } else if (viewKey === 'bridge') {
        controls.targetLookAt.set(3.8, 0.8, -1.2);
        controls.targetRadius = 7;
        controls.targetTheta = Math.PI * 0.7;
        controls.targetPhi = Math.PI * 0.35;
      } else if (viewKey === 'lantern') {
        controls.targetLookAt.set(-1.2, 0.8, 0.8);
        controls.targetRadius = 5.5;
        controls.targetTheta = -Math.PI * 0.2;
        controls.targetPhi = Math.PI * 0.38;
      } else if (viewKey === 'cinematic') {
        isAutoRotating = true;
        document.getElementById('toggle-turntable').checked = true;
        controls.targetLookAt.set(0, 2.8, 0);
        controls.targetRadius = 18;
      }
    }

    // --- UI Controls Handlers ---
    function toggleTurntable(val) {
      isAutoRotating = val;
    }

    function toggleTurntableBtn() {
      isAutoRotating = !isAutoRotating;
      document.getElementById('toggle-turntable').checked = isAutoRotating;
      document.getElementById('turntable-btn').classList.toggle('active', isAutoRotating);
      showToast(isAutoRotating ? '🔄 Turntable On' : '⏸️ Turntable Off');
    }

    function toggleDoF(val) {
      dofEnabled = val;
      showToast(val ? '✨ DoF Enabled' : '✨ DoF Disabled');
    }

    function toggleLanterns(val) {
      lanternsEnabled = val;
      lanternLights.forEach(l => l.visible = val);
      showToast(val ? '🏮 Lanterns On' : '🏮 Lanterns Off');
    }

    function triggerSakuraBurst() {
      spawnPetalsAt(0, 6, 0, 100);
    }

    function togglePanel() {
      const panel = document.getElementById('control-panel');
      panel.classList.toggle('hidden');
    }

    function takeSnapshot() {
      if (dofEnabled && renderTarget) {
        renderer.setRenderTarget(renderTarget);
        renderer.render(scene, camera);
        postMaterial.uniforms.tDiffuse.value = renderTarget.texture;
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);
      } else {
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      }
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'japanese-garden-3d.png';
      link.href = dataURL;
      link.click();
      showToast('📸 Screenshot Saved!');
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      if (renderTarget) {
        const px = Math.min(window.devicePixelRatio, 2);
        renderTarget.setSize(width * px, height * px);
      }
    }

    // --- Web Audio Synthesizer for Zen Audio ---
    function toggleAudio() {
      const btn = document.getElementById('sound-btn');

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioGainNode = audioCtx.createGain();
        audioGainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        audioGainNode.connect(audioCtx.destination);

        // Synthesize Wind Noise
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, audioCtx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(audioGainNode);
        whiteNoise.start();

        // Synthesize Wind Chime Melody Drops
        setInterval(() => {
          if (!audioPlaying) return;
          const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];
          const freq = notes[Math.floor(Math.random() * notes.length)];

          const osc = audioCtx.createOscillator();
          const chimeGain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          chimeGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          chimeGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);

          osc.connect(chimeGain);
          chimeGain.connect(audioGainNode);

          osc.start();
          osc.stop(audioCtx.currentTime + 2.5);
        }, 2400);
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      audioPlaying = !audioPlaying;
      audioGainNode.gain.setValueAtTime(audioPlaying ? 0.15 : 0, audioCtx.currentTime);

      btn.classList.toggle('active', audioPlaying);
      showToast(audioPlaying ? '🎵 Ambient Sound On' : '🔇 Audio Muted');
    }

    // --- Initialize Everything ---
    window.addEventListener('load', init);
  </script>
