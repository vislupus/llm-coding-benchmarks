<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Japanese Garden — 3D Animation</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Noto+Serif+JP:wght@300;700&display=swap');

    html, body { margin: 0; padding: 0; overflow: hidden; background: #f0ece6; height: 100vh; width: 100vw; }
    #canvas-container { position: fixed; inset: 0; z-index: 0; }
    #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 6vh 6vw; }
    .label { font-family: 'Cormorant Garamond', 'Noto Serif JP', serif; color: #3a2f2f; text-shadow: 0 2px 24px rgba(255,255,255,0.8); }
    .label h1 { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 300; letter-spacing: 0.15em; line-height: 1.05; margin: 0 0 0.15em; }
    .label p { font-size: clamp(0.9rem, 1.5vw, 1.15rem); font-weight: 300; letter-spacing: 0.12em; color: #5c4a3a; margin: 0; }
    .bottom-right { position: absolute; bottom: 6vh; right: 6vw; text-align: right; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="overlay">
    <div class="label">
      <h1>Spring Pavilion</h1>
      <p>A quiet garden in perpetual bloom</p>
    </div>
    <div class="label bottom-right">
      <p style="font-size:0.75rem; letter-spacing:0.25em; opacity:0.75;">CINEMATIC 3D &mdash; REAL-TIME</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8ddd0);
    scene.fog = new THREE.FogExp2(0xe8ddd0, 0.018);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(14, 10, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.target.set(0, 2.5, 0);

    // Lights
    const hemi = new THREE.HemisphereLight(0xffeedd, 0x557755, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff5e1, 1.2);
    sun.position.set(10, 15, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xaaccdd, 0.4);
    fill.position.set(-10, 5, -5);
    scene.add(fill);

    // Ground base
    const groundGeo = new THREE.CylinderGeometry(14, 15, 1, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x8aaa78, roughness: 0.95, metalness: 0.0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // Stone path
    function makeStone(x, z, scale = 1) {
      const s = new THREE.Mesh(
        new THREE.BoxGeometry(1.1*scale, 0.15, 0.7*scale),
        new THREE.MeshStandardMaterial({ color: 0xd5d2c8, roughness: 0.8 })
      );
      s.position.set(x, 0.12, z);
      s.rotation.y = (Math.random()-0.5)*0.4;
      s.castShadow = true; s.receiveShadow = true;
      scene.add(s);
    }
    const stones = [
      [-4, 2],[ -2.5, 1.2],[ -1, 0.2],[ 0.5, -0.8],[ 2, -1.8],[ 3.5, -3],[ 2.2, -4.5],
      [-1.2, -2], [2.8, 1.5], [-3.2, -1], [4, 3]
    ];
    stones.forEach(p => makeStone(p[0], p[1], 0.9 + Math.random()*0.4));

    // Pagoda (3-tier stylized)
    function pagodaRoof(radius, y, color = 0x2a2333) {
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(radius, 2.2, 16, 1, true),
        new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.05 })
      );
      roof.position.y = y;
      roof.rotation.y = Math.PI/8;
      roof.castShadow = true;
      scene.add(roof);
      // decorative gold tip
      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(0.35, 0.6, 8),
        new THREE.MeshStandardMaterial({ color: 0xd4a843, roughness: 0.3, metalness: 0.6 })
      );
      tip.position.y = y + 1.2;
      scene.add(tip);
      return roof;
    }
    // Structure body (red/white)
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc43b3b, roughness: 0.7, metalness: 0.1 });
    const bodyWhite = new THREE.MeshStandardMaterial({ color: 0xf2e8d8, roughness: 0.6, metalness: 0.1 });

    function tier(y, size) {
      // red pillars
      for (let a=0; a<8; a++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.2, 0.1), bodyMat);
        p.position.set(Math.sin(a*0.785)*(size-0.3), y+1.1, Math.cos(a*0.785)*(size-0.3));
        p.castShadow = true; scene.add(p);
      }
      // white walls
      const w = new THREE.Mesh(new THREE.BoxGeometry(size*1.2, 2.2, size*1.2), bodyWhite);
      w.position.y = y+1.1; w.castShadow = true; scene.add(w);
      // floor deck
      const deck = new THREE.Mesh(new THREE.BoxGeometry(size+0.8, 0.15, size+0.8), new THREE.MeshStandardMaterial({color: 0x8a2a2a, roughness:0.8}));
      deck.position.y = y+2.3; deck.receiveShadow = true; scene.add(deck);
    }
    tier(0, 2.2);
    tier(3.2, 1.6);
    tier(5.6, 1.1);

    pagodaRoof(2.4, 2.8);
    pagodaRoof(1.8, 6.2);
    pagodaRoof(1.2, 8.6);

    // Bamboo
    function bambooCluster(cx, cz, count) {
      for (let i=0; i<count; i++) {
        const h = 2.5 + Math.random()*2;
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, h, 8), new THREE.MeshStandardMaterial({ color: 0x6aa060, roughness: 0.9 }));
        const ax = cx + (Math.random()-0.5)*2;
        const az = cz + (Math.random()-0.5)*2;
        stem.position.set(ax, h/2, az); stem.castShadow = true; scene.add(stem);
        // leaves
        for (let k=0; k<4; k++) {
          const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 4), new THREE.MeshStandardMaterial({ color: 0x88bb70, roughness: 0.8, transparent: true, opacity: 0.85 }));
          leaf.position.set(ax+(Math.random()-0.5)*0.4, 1.5+Math.random()*h, az+(Math.random()-0.5)*0.4);
          leaf.rotation.x = Math.random()*0.6-0.3; leaf.rotation.y = Math.random()*Math.PI*2;
          scene.add(leaf);
        }
      }
    }
    bambooCluster(6, -2, 18);
    bambooCluster(-6, 4, 14);

    // Cherry blossom trees
    function sakuraTree(cx, cz, radius) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2.5, 8), new THREE.MeshStandardMaterial({ color: 0x5c3a2a, roughness: 0.9 }));
      trunk.position.set(cx, 1.25, cz); scene.add(trunk);
      const canopy = new THREE.Mesh(new THREE.SphereGeometry(radius, 14, 10), new THREE.MeshStandardMaterial({ color: 0xf5c8d0, roughness: 0.8, transparent: true, opacity: 0.85 }));
      canopy.position.set(cx, 3.0, cz); scene.add(canopy);
    }
    sakuraTree(-5, 5, 1.6);
    sakuraTree(5, 4, 1.2);
    sakuraTree(-3, -4, 1.0);
    sakuraTree(4, -2, 0.9);

    // Pond
    const pondGeo = new THREE.TorusGeometry(3.8, 1.8, 16, 48);
    const pondMat = new THREE.MeshStandardMaterial({ color: 0x4aaebb, roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.9 });
    const pond = new THREE.Mesh(pondGeo, pondMat);
    pond.rotation.x = -Math.PI/2;
    pond.position.y = 0.15;
    pond.receiveShadow = true; scene.add(pond);

    // Koi fish (small spheres with movement)
    const koiColors = [0xff7a3a, 0xffffff, 0xff5555, 0xdddddd];
    const koiFish = [];
    for (let i=0; i<6; i++) {
      const koi = new THREE.Group();
      const body = new THREE.Mesh(new THREE.EllipsoidGeometry(0.35, 0.18, 0.22), new THREE.MeshStandardMaterial({ color: koiColors[i%koiColors.length], roughness: 0.3 }));
      body.rotation.z = Math.PI/2; koi.add(body);
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.35, 4), new THREE.MeshStandardMaterial({ color: koiColors[i%koiColors.length], roughness: 0.3 }));
      tail.position.x = -0.35; tail.rotation.z = -Math.PI/2; koi.add(tail);
      pond.add(koi);
      koiFish.push({ group: koi, speed: 0.5 + Math.random()*0.8, angle: Math.random()*Math.PI*2, r: 1.2 + Math.random()*1.4 });
    }

    // People
    function person(x, z, rot) {
      const group = new THREE.Group();
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.16), new THREE.MeshStandardMaterial({ color: 0xf5d6b8, roughness: 0.6 }));
      head.position.y = 1.45; group.add(head);
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6), new THREE.MeshStandardMaterial({ color: rot ? 0x2d3e50 : 0x557755, roughness: 0.8 }));
      body.position.y = 0.9; group.add(body);
      const legs = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.55, 0.08), new THREE.MeshStandardMaterial({ color: rot ? 0x1a2a3a : 0x333333, roughness: 0.8 }));
      legs.position.y = 0.55; group.add(legs);
      group.position.set(x, 0, z); group.rotation.y = rot ? 0.2 : -0.2; scene.add(group);
    }
    person(-2.5, 0.5, false);
    person(-3.2, -0.2, false);
    person(3.5, -2, true);

    // Stone lanterns
    function lantern(x, z) {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0xb0b0a8, roughness: 0.8 }));
      base.position.set(x, 0.1, z); scene.add(base);
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.8, 0.18), new THREE.MeshStandardMaterial({ color: 0xb8b5a8, roughness: 0.8 }));
      pillar.position.set(x, 0.58, z); scene.add(pillar);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.15, 0.55), new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 }));
      cap.position.set(x, 0.95, z); scene.add(cap);
      const light = new THREE.PointLight(0xffc890, 0.6, 6);
      light.position.set(x, 1.1, z); scene.add(light);
    }
    lantern(-5, 2); lantern(3, -3); lantern(-1, -3.5);

    // Rocks / bushes
    function bush(x, z, s=0.8) {
      const bush = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), new THREE.MeshStandardMaterial({ color: 0x4a6a3a, roughness: 0.9 }));
      bush.position.set(x, s*0.6, z); scene.add(bush);
    }
    bush(-4, -2.5, 1); bush(2, -2, 0.7); bush(-3.5, 2.5, 0.9); bush(4.5, 2, 0.8);

    // Small rocks
    for (let i=0; i<10; i++) {
      const r = new THREE.Mesh(new THREE.SphereGeometry(0.2+Math.random()*0.3, 6, 4), new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 }));
      r.position.set((Math.random()-0.5)*10, 0.2+Math.random()*0.2, (Math.random()-0.5)*10);
      scene.add(r);
    }

    // Red bridge
    const bridgeGeo = new THREE.BoxGeometry(3.2, 0.15, 0.6);
    const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xb82a2a, roughness: 0.6, metalness: 0.1 });
    const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
    bridge.position.set(3.5, 0.45, -2.5);
    bridge.rotation.y = 0.15;
    bridge.castShadow = true; scene.add(bridge);
    // railings
    for (let side of [-0.25, 0.25]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.35, 0.04), new THREE.MeshStandardMaterial({ color: 0xa82a2a, roughness: 0.7 }));
      rail.position.set(3.5, 0.62, -2.5 + side); rail.rotation.y = 0.15; scene.add(rail);
    }

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();

      controls.update();

      // Gentle bobbing of canopies
      scene.children.forEach(child => {
        if (child.material && child.material.color?.getHex && child.material.color.getHex() === 0xf5c8d0) {
          child.position.y = 3.0 + Math.sin(t*1.2)*0.15;
        }
      });

      // Koi swim
      koiFish.forEach(fish => {
        fish.angle += dt * fish.speed * 0.3;
        fish.group.position.x = Math.sin(fish.angle)*fish.r;
        fish.group.position.z = Math.cos(fish.angle)*fish.r;
        fish.group.rotation.y = -fish.angle - Math.PI/2;
        fish.group.position.y = 0.25 + Math.sin(t*2 + fish.angle)*0.03;
      });

      // Slight sway for lantern light
      scene.children.forEach(c => {
        if (c.isPointLight) c.intensity = 0.6 + Math.sin(t*3)*0.05;
      });

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
