    initFBO() {
      const gl = this.gl;
      const w = gl.drawingBufferWidth || window.innerWidth;
      const h = gl.drawingBufferHeight || window.innerHeight;

      this.fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);

      this.sceneTexture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.sceneTexture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      this.depthBuffer = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.depthBuffer);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);

      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.sceneTexture, 0);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.depthBuffer);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    initBuffers() {
      const gl = this.gl;

      const sceneData = buildSceneGeometry();
      this.sceneBuffers = {
        pos: gl.createBuffer(),
        norm: gl.createBuffer(),
        col: gl.createBuffer(),
        idx: gl.createBuffer(),
        count: sceneData.indices.length
      };
      gl.bindBuffer(gl.ARRAY_BUFFER, this.sceneBuffers.pos);
      gl.bufferData(gl.ARRAY_BUFFER, sceneData.positions, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.sceneBuffers.norm);
      gl.bufferData(gl.ARRAY_BUFFER, sceneData.normals, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.sceneBuffers.col);
      gl.bufferData(gl.ARRAY_BUFFER, sceneData.colors, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.sceneBuffers.idx);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sceneData.indices, gl.STATIC_DRAW);

      const waterData = buildWaterGeometry();
      this.waterBuffers = {
        pos: gl.createBuffer(),
        norm: gl.createBuffer(),
        idx: gl.createBuffer(),
        count: waterData.indices.length
      };
      gl.bindBuffer(gl.ARRAY_BUFFER, this.waterBuffers.pos);
      gl.bufferData(gl.ARRAY_BUFFER, waterData.positions, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.waterBuffers.norm);
      gl.bufferData(gl.ARRAY_BUFFER, waterData.normals, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.waterBuffers.idx);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, waterData.indices, gl.STATIC_DRAW);

      const koiMesh = this.koiSystem.mesh;
      this.koiBuffers = {
        pos: gl.createBuffer(),
        norm: gl.createBuffer(),
        idx: gl.createBuffer(),
        count: koiMesh.indices.length
      };
      gl.bindBuffer(gl.ARRAY_BUFFER, this.koiBuffers.pos);
      gl.bufferData(gl.ARRAY_BUFFER, koiMesh.positions, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.koiBuffers.norm);
      gl.bufferData(gl.ARRAY_BUFFER, koiMesh.normals, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.koiBuffers.idx);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, koiMesh.indices, gl.STATIC_DRAW);

      const quadVerts = new Float32Array([
        -0.5, -0.5, 0.0,
         0.5, -0.5, 0.0,
         0.5,  0.5, 0.0,
        -0.5,  0.5, 0.0
      ]);
      const quadIdx = new Uint16Array([0, 1, 2, 0, 2, 3]);
      this.petalBuffers = {
        pos: gl.createBuffer(),
        idx: gl.createBuffer()
      };
      gl.bindBuffer(gl.ARRAY_BUFFER, this.petalBuffers.pos);
      gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.petalBuffers.idx);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, quadIdx, gl.STATIC_DRAW);

      const fsQuad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      this.fsBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.fsBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, fsQuad, gl.STATIC_DRAW);
    }

    resize() {
      const gl = this.gl;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
      const w = Math.floor(this.canvas.clientWidth * dpr);
      const h = Math.floor(this.canvas.clientHeight * dpr);

      if (this.canvas.width !== w || this.canvas.height !== h) {
        this.canvas.width = w;
        this.canvas.height = h;

        gl.bindTexture(gl.TEXTURE_2D, this.sceneTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindRenderbuffer(gl.RENDERBUFFER, this.depthBuffer);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
      }
    }

    setAtmosphere(presetKey) {
      if (this.atmospheres[presetKey]) {
        this.targetAtmosphere = this.atmospheres[presetKey];
      }
    }

    setCameraPreset(presetKey) {
      const cp = this.cameraPresets[presetKey];
      if (cp) {
        this.camera.autoTour = false;
        this.camera.targetTheta = cp.theta;
        this.camera.targetPhi = cp.phi;
        this.camera.distance = cp.dist;
        V3.set(this.camera.targetCenter, cp.target[0], cp.target[1], cp.target[2]);
        this.targetFocalDistance = cp.focus;
      }
    }

    render(dt) {
      const gl = this.gl;
      this.resize();

      const timeScale = dt * this.simSpeed;
      this.elapsedTime += timeScale;

      if (this.camera.autoTour) {
        this.camera.tourTime += dt * 0.12 * this.simSpeed;
        this.camera.targetTheta = 0.78 + Math.sin(this.camera.tourTime * 0.8) * 0.65;
        this.camera.targetPhi = 0.62 + Math.cos(this.camera.tourTime * 0.5) * 0.15;
      }

      const camLerp = Math.min(1.0, dt * 4.5);
      this.camera.theta += (this.camera.targetTheta - this.camera.theta) * camLerp;
      this.camera.phi += (this.camera.targetPhi - this.camera.phi) * camLerp;
      V3.lerp(this.camera.target, this.camera.target, this.camera.targetCenter, camLerp);
      this.focalDistance += (this.targetFocalDistance - this.focalDistance) * camLerp;

      const cy = Math.sin(this.camera.phi) * this.camera.distance;
      const hDist = Math.cos(this.camera.phi) * this.camera.distance;
      const cx = Math.cos(this.camera.theta) * hDist;
      const cz = Math.sin(this.camera.theta) * hDist;
      V3.set(this.camera.eye, this.camera.target[0] + cx, this.camera.target[1] + cy, this.camera.target[2] + cz);

      const atm = this.currentAtmosphere;
      const tgt = this.targetAtmosphere;
      for (let k in atm) {
        if (typeof atm[k] === 'number') {
          atm[k] += (tgt[k] - atm[k]) * dt * 3.0;
        } else if (Array.isArray(atm[k]) || atm[k] instanceof Float32Array) {
          for (let c = 0; c < 3; c++) {
            atm[k][c] += (tgt[k][c] - atm[k][c]) * dt * 3.0;
          }
        }
      }

      this.koiSystem.update(timeScale);
      this.sakuraSystem.update(timeScale);

      const aspect = this.canvas.width / this.canvas.height;
      const projMat = M4.perspective(M4.create(), this.camera.fov, aspect, 0.5, 60.0);
      const viewMat = M4.lookAt(M4.create(), this.camera.eye, this.camera.target, this.camera.up);
      const modelMat = M4.identity(M4.create());

      // PASS 1: Scene rendering into offscreen buffer
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
      gl.viewport(0, 0, this.canvas.width, this.canvas.height);

      gl.clearColor(atm.clearColor[0], atm.clearColor[1], atm.clearColor[2], 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.disable(gl.BLEND);

      // 1. Draw Scene
      gl.useProgram(this.progScene);

      gl.uniformMatrix4fv(gl.getUniformLocation(this.progScene, 'uModel'), false, modelMat);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.progScene, 'uView'), false, viewMat);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.progScene, 'uProjection'), false, projMat);
      gl.uniform1f(gl.getUniformLocation(this.progScene, 'uTime'), this.elapsedTime);

      gl.uniform3fv(gl.getUniformLocation(this.progScene, 'uSunDir'), atm.sunDir);
      gl.uniform3fv(gl.getUniformLocation(this.progScene, 'uSunColor'), atm.sunColor);
      gl.uniform3fv(gl.getUniformLocation(this.progScene, 'uSkyColor'), atm.skyColor);
      gl.uniform3fv(gl.getUniformLocation(this.progScene, 'uGroundColor'), atm.groundColor);
      gl.uniform3fv(gl.getUniformLocation(this.progScene, 'uCameraPos'), this.camera.eye);
      gl.uniform1f(gl.getUniformLocation(this.progScene, 'uNightFactor'), atm.nightFactor);

      const aPos = gl.getAttribLocation(this.progScene, 'aPosition');
      const aNorm = gl.getAttribLocation(this.progScene, 'aNormal');
      const aCol = gl.getAttribLocation(this.progScene, 'aColor');

      gl.bindBuffer(gl.ARRAY_BUFFER, this.sceneBuffers.pos);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.sceneBuffers.norm);
      gl.enableVertexAttribArray(aNorm);
      gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.sceneBuffers.col);
      gl.enableVertexAttribArray(aCol);
      gl.vertexAttribPointer(aCol, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.sceneBuffers.idx);
      gl.drawElements(gl.TRIANGLES, this.sceneBuffers.count, gl.UNSIGNED_SHORT, 0);

      // 2. Draw Koi Fish
      gl.bindBuffer(gl.ARRAY_BUFFER, this.koiBuffers.pos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.koiBuffers.norm);
      gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);

      gl.disableVertexAttribArray(aCol);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.koiBuffers.idx);

      for (let fish of this.koiSystem.fishList) {
        const fMat = M4.identity(M4.create());
        fMat[12] = fish.x;
        fMat[13] = -0.16;
        fMat[14] = fish.z;

        const cosH = Math.cos(fish.heading), sinH = Math.sin(fish.heading);
        const rotMat = M4.identity(M4.create());
        rotMat[0] = sinH;  rotMat[2] = cosH;
        rotMat[8] = -cosH; rotMat[10] = sinH;
        M4.multiply(fMat, fMat, rotMat);

        const wiggle = Math.sin(fish.phase) * 0.14;
        rotMat[0] = Math.cos(wiggle);  rotMat[2] = Math.sin(wiggle);
        rotMat[8] = -Math.sin(wiggle); rotMat[10] = Math.cos(wiggle);
        M4.multiply(fMat, fMat, rotMat);

        gl.uniformMatrix4fv(gl.getUniformLocation(this.progScene, 'uModel'), false, fMat);
        gl.vertexAttrib3f(aCol, fish.color[0], fish.color[1], fish.color[2]);
        gl.drawElements(gl.TRIANGLES, this.koiBuffers.count, gl.UNSIGNED_SHORT, 0);
      }

      // 3. Draw Water Surface with Transparency
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(this.progWater);

      gl.uniformMatrix4fv(gl.getUniformLocation(this.progWater, 'uModel'), false, modelMat);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.progWater, 'uView'), false, viewMat);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.progWater, 'uProjection'), false, projMat);
      gl.uniform1f(gl.getUniformLocation(this.progWater, 'uTime'), this.elapsedTime);
      gl.uniform3fv(gl.getUniformLocation(this.progWater, 'uSunDir'), atm.sunDir);
      gl.uniform3fv(gl.getUniformLocation(this.progWater, 'uSunColor'), atm.sunColor);
      gl.uniform3fv(gl.getUniformLocation(this.progWater, 'uCameraPos'), this.camera.eye);

      const wPos = gl.getAttribLocation(this.progWater, 'aPosition');
      const wNorm = gl.getAttribLocation(this.progWater, 'aNormal');

      gl.bindBuffer(gl.ARRAY_BUFFER, this.waterBuffers.pos);
      gl.enableVertexAttribArray(wPos);
      gl.vertexAttribPointer(wPos, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.waterBuffers.norm);
      gl.enableVertexAttribArray(wNorm);
      gl.vertexAttribPointer(wNorm, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.waterBuffers.idx);
      gl.drawElements(gl.TRIANGLES, this.waterBuffers.count, gl.UNSIGNED_SHORT, 0);

      // 4. Draw Sakura Petals
      gl.useProgram(this.progPetals);

      gl.uniformMatrix4fv(gl.getUniformLocation(this.progPetals, 'uView'), false, viewMat);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.progPetals, 'uProjection'), false, projMat);

      const pPos = gl.getAttribLocation(this.progPetals, 'aPosition');
      const pOff = gl.getAttribLocation(this.progPetals, 'aOffset');
      const pRot = gl.getAttribLocation(this.progPetals, 'aRotation');
      const pScale = gl.getAttribLocation(this.progPetals, 'aScale');

      // Disable other attribute arrays to ensure constant values apply cleanly
      for (let loc = 0; loc < 6; loc++) {
        if (loc !== pPos) gl.disableVertexAttribArray(loc);
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, this.petalBuffers.pos);
      gl.enableVertexAttribArray(pPos);
      gl.vertexAttribPointer(pPos, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.petalBuffers.idx);

      for (let i = 0; i < this.sakuraSystem.count; i++) {
        gl.vertexAttrib3f(pOff, this.sakuraSystem.positions[i*3], this.sakuraSystem.positions[i*3+1], this.sakuraSystem.positions[i*3+2]);
        gl.vertexAttrib3f(pRot, this.sakuraSystem.rotations[i*3], this.sakuraSystem.rotations[i*3+1], this.sakuraSystem.rotations[i*3+2]);
        gl.vertexAttrib1f(pScale, this.sakuraSystem.scales[i]);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      }

      // PASS 2: Fullscreen Post-Processing (Bokeh Depth of Field, Vignette & Tone)
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, this.canvas.width, this.canvas.height);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);

      gl.useProgram(this.progPost);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.sceneTexture);
      gl.uniform1i(gl.getUniformLocation(this.progPost, 'uScene'), 0);

      gl.uniform1f(gl.getUniformLocation(this.progPost, 'uFocalDistance'), this.focalDistance);
      gl.uniform1f(gl.getUniformLocation(this.progPost, 'uAperture'), this.aperture);
      gl.uniform1f(gl.getUniformLocation(this.progPost, 'uDoFEnabled'), this.dofEnabled ? 1.0 : 0.0);
      gl.uniform2f(gl.getUniformLocation(this.progPost, 'uTexelSize'), 1.0 / this.canvas.width, 1.0 / this.canvas.height);
      gl.uniform1f(gl.getUniformLocation(this.progPost, 'uTime'), this.elapsedTime);

      const fsPos = gl.getAttribLocation(this.progPost, 'aPosition');
      for (let loc = 0; loc < 6; loc++) {
        if (loc !== fsPos) gl.disableVertexAttribArray(loc);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, this.fsBuffer);
      gl.enableVertexAttribArray(fsPos);
      gl.vertexAttribPointer(fsPos, 2, gl.FLOAT, false, 0, 0);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }

  // --- 10. Initialization & User Interaction Handling ---
  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('glcanvas');
    const renderer = new DioramaRenderer(canvas);
    const soundscape = new ZenSoundscape();

    const btnSound = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    const btnTour = document.getElementById('btn-tour');
    const btnPhoto = document.getElementById('btn-photo');
    const btnReset = document.getElementById('btn-reset');
    const btnDof = document.getElementById('btn-dof');
    const sliderFocus = document.getElementById('slider-focus');
    const sliderSpeed = document.getElementById('slider-speed');
    const focusMarker = document.getElementById('focus-marker');
    const toast = document.getElementById('toast');
    const hint = document.getElementById('interaction-hint');

    setTimeout(() => {
      hint.style.opacity = '0';
    }, 6000);

    let isDragging = false;
    let prevMouseX = 0, prevMouseY = 0;
    const canvasContainer = document.getElementById('canvas-container');

    canvasContainer.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
      renderer.camera.autoTour = false;
      btnTour.classList.remove('active');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      renderer.camera.targetTheta -= dx * 0.006;
      renderer.camera.targetPhi = Math.max(0.15, Math.min(1.45, renderer.camera.targetPhi + dy * 0.006));
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      renderer.camera.distance = Math.max(8.0, Math.min(45.0, renderer.camera.distance + e.deltaY * 0.025));
    }, { passive: false });

    // Touch Support
    let touchStartDist = 0;
    canvasContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevMouseX = e.touches[0].clientX;
        prevMouseY = e.touches[0].clientY;
        renderer.camera.autoTour = false;
        btnTour.classList.remove('active');
      } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - prevMouseX;
        const dy = e.touches[0].clientY - prevMouseY;
        prevMouseX = e.touches[0].clientX;
        prevMouseY = e.touches[0].clientY;
        renderer.camera.targetTheta -= dx * 0.007;
        renderer.camera.targetPhi = Math.max(0.15, Math.min(1.45, renderer.camera.targetPhi + dy * 0.007));
      } else if (e.touches.length === 2) {
        const curDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = touchStartDist / curDist;
        renderer.camera.distance = Math.max(8.0, Math.min(45.0, renderer.camera.distance * factor));
        touchStartDist = curDist;
      }
    });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // Click on canvas to Focus & Ripple
    canvasContainer.addEventListener('click', (e) => {
      focusMarker.style.left = e.clientX + 'px';
      focusMarker.style.top = e.clientY + 'px';
      focusMarker.style.opacity = '1';
      focusMarker.style.transform = 'translate(-50%, -50%) scale(1.2)';

      setTimeout(() => {
        focusMarker.style.transform = 'translate(-50%, -50%) scale(1.0)';
        setTimeout(() => { focusMarker.style.opacity = '0'; }, 500);
      }, 200);

      if (soundscape.isPlaying) {
        soundscape.playBambooClack();
      }
    });

    // Camera Preset Buttons
    const camButtons = document.querySelectorAll('[data-cam]');
    camButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        camButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const camKey = btn.getAttribute('data-cam');
        renderer.setCameraPreset(camKey);
        btnTour.classList.remove('active');
        sliderFocus.value = renderer.targetFocalDistance;
      });
    });

    // Atmosphere / Lighting Buttons
    const timeButtons = document.querySelectorAll('[data-time]');
    timeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        timeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const timeKey = btn.getAttribute('data-time');
        renderer.setAtmosphere(timeKey);
      });
    });

    // Depth of Field Toggle & Focus Slider
    btnDof.addEventListener('click', () => {
      renderer.dofEnabled = !renderer.dofEnabled;
      btnDof.classList.toggle('active', renderer.dofEnabled);
    });

    sliderFocus.addEventListener('input', (e) => {
      renderer.targetFocalDistance = parseFloat(e.target.value);
    });

    sliderSpeed.addEventListener('input', (e) => {
      renderer.simSpeed = parseFloat(e.target.value);
    });

    // Auto Tour Toggle
    btnTour.addEventListener('click', () => {
      renderer.camera.autoTour = !renderer.camera.autoTour;
      btnTour.classList.toggle('active', renderer.camera.autoTour);
      if (renderer.camera.autoTour) {
        camButtons.forEach(b => b.classList.remove('active'));
      }
    });

    // Reset View Button
    btnReset.addEventListener('click', () => {
      renderer.setCameraPreset('isometric');
      camButtons.forEach(b => b.classList.remove('active'));
      document.querySelector('[data-cam="isometric"]').classList.add('active');
    });

    // Audio Ambience Button
    btnSound.addEventListener('click', () => {
      const playing = soundscape.toggle();
      btnSound.classList.toggle('active', playing);
      soundIcon.textContent = playing ? '🔊' : '🎵';
    });

    // Snapshot High-Res Photograph
    btnPhoto.addEventListener('click', () => {
      renderer.render(0.016);
      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'zen-garden-pagoda.png';
      link.href = dataUrl;
      link.click();

      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    });

    // Animation Loop
    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) * 0.001, 0.1);
      lastTime = now;
      renderer.render(dt);
    }
    requestAnimationFrame(animate);
  });
})();
</script>
</body>
</html>
